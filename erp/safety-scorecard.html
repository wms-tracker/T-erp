<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Safety Score Card — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:flex-end}
.search-bar select{flex:1;min-width:100px}
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.progress-wrap{background:#e5e7eb;border-radius:6px;height:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;transition:width .4s}
.rank-table{border-collapse:collapse;width:100%;font-size:0.85rem}
.rank-table th{background:#f8fafc;padding:8px 12px;text-align:left;font-weight:700;color:#374151;border-bottom:2px solid #e5e7eb}
.rank-table td{padding:8px 12px;border-bottom:1px solid #f3f4f6}
.rank-table tr:hover td{background:#f9fafb}
.score-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;flex-shrink:0}
.criterion-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6}
.criterion-row:last-child{border-bottom:none}
.score-input{width:70px;text-align:center;font-weight:700;font-size:0.95rem}
.hint-text{font-size:0.72rem;color:#9ca3af;margin-top:2px}
.medal{font-size:1.4rem}
</style>
</head>
<body>
<script type="module">
import { requireRole, getProfile } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  SCORECARD_CRITERIA, SCORECARD_GRADE, SCORECARD_DEPARTMENTS, STAT_MONTHS,
  calcScoreGrade, calcTotalScore,
  listScoreCard, getScoreCard, upsertScoreCard, deleteScoreCard
} from "./js/safety-data.js";

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-scorecard', 'บัตรคะแนนความปลอดภัย');
main.insertAdjacentHTML('afterbegin', `
<div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <span id="panel-title">บันทึกคะแนนแผนก</span>
    <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
  <div class="panel-footer" id="panel-footer"></div>
</div>
`);

const esc  = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const THIS_YEAR = new Date().getFullYear();
let records  = [];
let selYear  = THIS_YEAR;
let selMonth = new Date().getMonth() + 1; // 1-12

const MEDALS = ['🥇','🥈','🥉'];

async function render() {
  records = await listScoreCard(selYear);

  const monthRecs = records.filter(r=>r.month===selMonth);
  const ranked = [...monthRecs].map(r=>({ ...r, _total: calcTotalScore(r.scores||{}), _grade: calcScoreGrade(calcTotalScore(r.scores||{})) }))
                               .sort((a,b)=>b._total-a._total);

  // year KPIs
  const all = records.map(r=>calcTotalScore(r.scores||{}));
  const avgScore = all.length ? Math.round(all.reduce((s,v)=>s+v,0)/all.length) : 0;
  const aGrade   = calcScoreGrade(avgScore);
  const topRec   = ranked[0];

  // year selector
  const years = [];
  for (let y=THIS_YEAR+1;y>=THIS_YEAR-2;y--) years.push(y);

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🏆 บัตรคะแนนความปลอดภัย</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      <select id="year-sel" style="width:auto;margin:0" onchange="window.__changeYear(this.value)">
        ${years.map(y=>`<option value="${y}" ${y===selYear?'selected':''}>${y}</option>`).join('')}
      </select>
      <button class="btn btn-primary" onclick="window.__openPanel()">+ ให้คะแนนแผนก</button>
    </div>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card">
      <div class="kpi-num" style="color:${aGrade.color}">${avgScore}</div>
      <div class="kpi-label">คะแนนเฉลี่ยปี ${selYear}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num" style="font-size:1.1rem;color:${aGrade.color}">${aGrade.label.split(' —')[0]}</div>
      <div class="kpi-label">เกรดเฉลี่ย</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num">${monthRecs.length}</div>
      <div class="kpi-label">แผนกที่บันทึกแล้ว</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num">${topRec?topRec._total:'-'}</div>
      <div class="kpi-label">อันดับ 1 เดือนนี้</div>
    </div>
  </div>

  <div class="search-bar">
    <div style="font-size:0.85rem;font-weight:600;color:#374151;align-self:center">เดือนที่ดู:</div>
    <select id="month-sel" style="width:auto;margin:0" onchange="window.__changeMonth(this.value)">
      ${STAT_MONTHS.map((m,i)=>`<option value="${i+1}" ${(i+1)===selMonth?'selected':''}>${m}</option>`).join('')}
    </select>
  </div>

  <div class="section-title">🏆 Ranking ประจำเดือน ${STAT_MONTHS[selMonth-1]}</div>
  ${renderRanking(ranked)}

  <div class="section-title">📈 Trend รายเดือน ปี ${selYear}</div>
  ${renderTrend()}`;
}

function renderRanking(ranked) {
  if (!ranked.length) return `<p style="color:#9ca3af;text-align:center;padding:24px 0">ยังไม่มีข้อมูลเดือนนี้ — กด "+ ให้คะแนนแผนก" เพื่อเริ่ม</p>`;
  return `<div style="overflow-x:auto"><table class="rank-table">
    <thead><tr><th>#</th><th>แผนก</th>${SCORECARD_CRITERIA.map(c=>`<th title="${c.hint}">${c.label.substring(0,6)}</th>`).join('')}<th>รวม</th><th>เกรด</th><th></th></tr></thead>
    <tbody>
    ${ranked.map((r,i)=>{
      const sc = r.scores||{};
      return `<tr onclick="window.__openView('${r.id}')">
        <td style="font-weight:800;font-size:1rem">${MEDALS[i]||`#${i+1}`}</td>
        <td style="font-weight:700">${esc(r.department)}</td>
        ${SCORECARD_CRITERIA.map(c=>{
          const v = sc[c.key]||0;
          const pct = Math.round(v/c.weight*100);
          return `<td title="${v}/${c.weight}">
            <div style="font-weight:700;color:${pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}">${v}</div>
            <div class="progress-wrap" style="width:40px;height:4px"><div class="progress-fill" style="width:${pct}%;background:${pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}"></div></div>
          </td>`;
        }).join('')}
        <td style="font-weight:900;font-size:1.05rem;color:${r._grade.color}">${r._total}</td>
        <td><span class="badge" style="color:${r._grade.color};background:${r._grade.bg}">${r._grade.label.split(' —')[0]}</span></td>
        <td><button class="btn btn-ghost" style="padding:3px 10px;font-size:0.75rem" onclick="event.stopPropagation();window.__del('${r.id}')">ลบ</button></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}

function renderTrend() {
  const depts = [...new Set(records.map(r=>r.department))].sort();
  if (!depts.length) return `<p style="color:#9ca3af">ยังไม่มีข้อมูล</p>`;
  const deptColors = ['#1a237e','#dc2626','#16a34a','#d97706','#7c3aed','#0891b2','#059669','#92400e'];
  return `<div style="overflow-x:auto">
  <table style="border-collapse:collapse;font-size:0.8rem;width:100%">
    <thead><tr>
      <th style="padding:6px 10px;background:#f8fafc;border-bottom:2px solid #e5e7eb">แผนก</th>
      ${STAT_MONTHS.map(m=>`<th style="padding:6px 8px;background:#f8fafc;border-bottom:2px solid #e5e7eb;white-space:nowrap">${m}</th>`).join('')}
    </tr></thead>
    <tbody>
    ${depts.map((dept,di)=>`
      <tr>
        <td style="padding:5px 10px;font-weight:700;color:${deptColors[di%deptColors.length]};white-space:nowrap">${esc(dept)}</td>
        ${STAT_MONTHS.map((_,mi)=>{
          const r = records.find(x=>x.department===dept && x.month===(mi+1));
          if (!r) return `<td style="padding:5px 8px;text-align:center;color:#e5e7eb">—</td>`;
          const tot = calcTotalScore(r.scores||{});
          const g   = calcScoreGrade(tot);
          return `<td style="padding:5px 8px;text-align:center;cursor:pointer" onclick="window.__openView('${r.id}')">
            <span style="font-weight:700;color:${g.color}">${tot}</span>
          </td>`;
        }).join('')}
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

window.__changeYear  = y => { selYear  = Number(y); render(); };
window.__changeMonth = m => { selMonth = Number(m); render(); };

// ── view ──────────────────────────────────────────────────────────────────────
window.__openView = async (id) => {
  const r = await getScoreCard(id);
  if (!r) return;
  const sc    = r.scores||{};
  const total = calcTotalScore(sc);
  const grade = calcScoreGrade(total);
  openPanel(`คะแนน ${r.department} — ${STAT_MONTHS[(r.month||1)-1]} ${r.year}`);
  document.getElementById('panel-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="score-circle" style="background:${grade.bg};color:${grade.color}">${total}</div>
      <div>
        <div style="font-weight:800;font-size:1.05rem">${esc(r.department)}</div>
        <div style="color:#6b7280;font-size:0.82rem">${STAT_MONTHS[(r.month||1)-1]} ${r.year}</div>
        <div style="margin-top:4px"><span class="badge" style="color:${grade.color};background:${grade.bg}">${grade.label}</span></div>
      </div>
    </div>
    ${SCORECARD_CRITERIA.map(c=>{
      const v   = sc[c.key]||0;
      const pct = Math.round(v/c.weight*100);
      return `
      <div class="criterion-row">
        <div>
          <div style="font-weight:600;font-size:0.88rem">${c.label}</div>
          <div class="hint-text">น้ำหนัก ${c.weight} คะแนน · ${c.hint}</div>
        </div>
        <div style="text-align:right;min-width:70px">
          <div style="font-weight:900;font-size:1.1rem;color:${pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}">${v}<span style="font-size:0.7rem;color:#9ca3af">/${c.weight}</span></div>
          <div class="progress-wrap" style="margin-top:3px"><div class="progress-fill" style="width:${pct}%;background:${pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}"></div></div>
        </div>
      </div>`;
    }).join('')}
    ${r.note?`<div style="margin-top:12px;padding:10px;background:#fafafa;border-radius:8px;font-size:0.85rem"><strong>หมายเหตุ:</strong> ${esc(r.note)}</div>`:''}`;
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__editRow('${id}')">แก้ไข</button>
     <button class="btn btn-danger"  onclick="window.__del('${id}')">ลบ</button>
     <button class="btn btn-ghost"   onclick="window.__closePanel()">ปิด</button>`;
};

// ── form ──────────────────────────────────────────────────────────────────────
window.__openPanel = (r=null) => {
  openPanel(r ? 'แก้ไขคะแนน' : 'ให้คะแนนแผนก');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-body').dataset.editId = r?.id||'';
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost"   onclick="window.__closePanel()">ยกเลิก</button>`;
};
window.__editRow = async (id) => {
  const r = await getScoreCard(id);
  if (r) window.__openPanel(r);
};

function renderForm(r) {
  const sc = r?.scores||{};
  return `
  <div class="form-row">
    <div>
      <label class="lbl" style="margin-top:0">ปี *</label>
      <input id="f-year" type="number" value="${r?.year||THIS_YEAR}" min="2020"/>
    </div>
    <div>
      <label class="lbl" style="margin-top:0">เดือน *</label>
      <select id="f-month">
        ${STAT_MONTHS.map((m,i)=>`<option value="${i+1}" ${(r?.month||selMonth)===(i+1)?'selected':''}>${m}</option>`).join('')}
      </select>
    </div>
  </div>
  <div>
    <label class="lbl">แผนก *</label>
    <select id="f-dept">
      ${SCORECARD_DEPARTMENTS.map(d=>`<option value="${d}" ${(r?.department||'ผลิต')===d?'selected':''}>${d}</option>`).join('')}
    </select>
  </div>
  <div class="section-title">ให้คะแนนแต่ละเกณฑ์ (รวม 100)</div>
  <div id="score-preview" style="text-align:right;font-size:0.85rem;color:#6b7280;margin-bottom:8px">รวม: <strong id="sum-display">0</strong>/100</div>
  ${SCORECARD_CRITERIA.map(c=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f3f4f6">
      <div style="flex:1">
        <div style="font-weight:600;font-size:0.88rem">${c.label}</div>
        <div class="hint-text">${c.hint} (max ${c.weight})</div>
      </div>
      <input class="score-input" id="sc-${c.key}" type="number" min="0" max="${c.weight}" value="${sc[c.key]||0}" oninput="window.__updateSum()"/>
    </div>`).join('')}
  <div>
    <label class="lbl">หมายเหตุ</label>
    <input id="f-note" value="${esc(r?.note||'')}" placeholder="ความเห็นเพิ่มเติม"/>
  </div>`;
}

window.__updateSum = () => {
  const sum = SCORECARD_CRITERIA.reduce((s,c)=>s+(parseFloat(document.getElementById(`sc-${c.key}`)?.value)||0),0);
  const el  = document.getElementById('sum-display');
  if (el) { el.textContent=Math.round(sum); el.style.color=sum>=80?'#16a34a':sum>=50?'#d97706':'#dc2626'; }
};

window.__save = async () => {
  const year  = parseInt(document.getElementById('f-year')?.value)||THIS_YEAR;
  const month = parseInt(document.getElementById('f-month')?.value)||1;
  const dept  = document.getElementById('f-dept')?.value||'ผลิต';
  const scores= {};
  SCORECARD_CRITERIA.forEach(c=>{
    const raw = parseFloat(document.getElementById(`sc-${c.key}`)?.value)||0;
    scores[c.key] = Math.min(raw, c.weight);
  });
  const data = { scores, note: document.getElementById('f-note')?.value.trim()||'' };
  try {
    await upsertScoreCard(year, month, dept, data, profile.uid);
    selYear=year; selMonth=month;
    window.__closePanel(); await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบคะแนนนี้?')) return;
  await deleteScoreCard(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
