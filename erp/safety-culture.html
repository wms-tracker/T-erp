<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>แบบสำรวจวัฒนธรรมความปลอดภัย — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(600px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-bar input{flex:1}
.info-row{display:flex;gap:14px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
/* survey form */
.cat-block{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;margin-bottom:14px}
.cat-header{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f3f4f6}
.q-row{padding:10px 14px;border-bottom:1px solid #f9fafb}
.q-row:last-child{border-bottom:none}
.q-text{font-size:0.86rem;color:#374151;margin-bottom:8px;line-height:1.45}
.scale-row{display:flex;gap:5px;flex-wrap:wrap}
.scale-btn{padding:5px 10px;border-radius:7px;border:1.5px solid #e5e7eb;cursor:pointer;font-size:0.78rem;font-weight:600;transition:all .15s;min-width:36px;text-align:center;user-select:none}
.scale-btn:hover{border-color:#6b7280}
.scale-btn.sel{color:#fff}
/* score display */
.score-ring{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.3rem;font-weight:800;border:5px solid;flex-shrink:0}
.cat-bar-wrap{background:#e5e7eb;border-radius:6px;height:8px;flex:1;overflow:hidden}
.cat-bar{height:100%;border-radius:6px;transition:width .4s}
.overall-box{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;border-radius:12px;padding:18px;display:flex;align-items:center;gap:16px;margin-bottom:16px}
.overall-score{font-size:2.5rem;font-weight:800;line-height:1}
.overall-label{font-size:0.9rem;opacity:.85;margin-top:4px}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  SURVEY_CATEGORIES, SURVEY_SCALE, SURVEY_DEPARTMENTS,
  calcSurveyCatAvg, calcSurveyOverall,
  listCultureSurvey, getCultureSurvey, createCultureSurvey, deleteCultureSurvey
} from "./js/safety-data.js";
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-culture', 'แบบสำรวจวัฒนธรรมความปลอดภัย');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

const SCALE_COLORS = ['','#dc2626','#f97316','#d97706','#16a34a','#15803d'];

let records  = [];
let editId   = null;
let responses= {};

function scoreColor(v) {
  if (!v) return '#9ca3af';
  if (v >= 4.5) return '#15803d';
  if (v >= 3.5) return '#16a34a';
  if (v >= 2.5) return '#d97706';
  return '#dc2626';
}
function scoreLabel(v) {
  if (!v || v===0) return 'ยังไม่มีข้อมูล';
  if (v >= 4.5) return 'ดีเยี่ยม';
  if (v >= 3.5) return 'ดี';
  if (v >= 2.5) return 'พอใช้';
  return 'ต้องปรับปรุง';
}

// ── render ────────────────────────────────────────────────────────────────────
async function render() {
  records = await listCultureSurvey();
  const total = records.length;
  const overall = total ? +(records.reduce((s,r)=>s+(r.overallScore||0),0)/total).toFixed(2) : 0;
  const thisMonth = records.filter(r=>{
    if (!r.submittedAt) return false;
    const d = r.submittedAt.toDate ? r.submittedAt.toDate() : new Date(r.submittedAt);
    const n = new Date();
    return d.getMonth()===n.getMonth() && d.getFullYear()===n.getFullYear();
  }).length;

  const catAvgs = SURVEY_CATEGORIES.map(cat => {
    const vals = records.map(r=>r.catScores?.[cat.key]||0).filter(v=>v>0);
    return { key:cat.key, label:cat.label, icon:cat.icon, color:cat.color,
             avg: vals.length ? +(vals.reduce((s,v)=>s+v,0)/vals.length).toFixed(2) : 0 };
  });

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🔍 แบบสำรวจวัฒนธรรมความปลอดภัย</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ ทำแบบสำรวจ</button>
  </div>

  ${total ? `
  <div class="overall-box">
    <div>
      <div class="overall-score">${overall.toFixed(1)}<span style="font-size:1rem;opacity:.7">/5</span></div>
      <div class="overall-label">${scoreLabel(overall)} — คะแนนเฉลี่ยรวม</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:7px">
      ${catAvgs.map(c=>`
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:0.75rem;color:#fff;opacity:.8;width:16px;text-align:center">${c.icon}</span>
          <div class="cat-bar-wrap">
            <div class="cat-bar" style="width:${c.avg/5*100}%;background:${SCALE_COLORS[Math.round(c.avg)]||'#fff'}"></div>
          </div>
          <span style="font-size:0.78rem;color:#fff;font-weight:700;width:28px;text-align:right">${c.avg>0?c.avg.toFixed(1):'-'}</span>
        </div>`).join('')}
    </div>
  </div>` : ''}

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${total}</div><div class="kpi-label">แบบสำรวจทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:${scoreColor(overall)}">${overall>0?overall.toFixed(1)+'/5':'-'}</div><div class="kpi-label">คะแนนเฉลี่ย</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#2563eb">${thisMonth}</div><div class="kpi-label">เดือนนี้</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#7c3aed">${SURVEY_CATEGORIES.flatMap(c=>c.questions).length}</div><div class="kpi-label">คำถามทั้งหมด</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาแผนก, ชื่อ..." oninput="window.__search(this.value)"/>
  </div>

  <div id="list-wrap">${renderList(records)}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">แบบสำรวจวัฒนธรรมความปลอดภัย</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ยังไม่มีแบบสำรวจ</p>`;
  return list.map(r => {
    const ov = r.overallScore || 0;
    const col = scoreColor(ov);
    const submittedDate = r.submittedAt?.toDate ? r.submittedAt.toDate() : (r.submittedAt ? new Date(r.submittedAt) : null);
    return `
    <div class="card" onclick="window.__viewResult('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:0.95rem">${r.anonymous ? '👤 ไม่ระบุตัวตน' : esc(r.respondentName||'-')}</div>
          <div class="info-row">
            <span>🏢 ${esc(r.department||'-')}</span>
            <span>📅 ${submittedDate ? fmtDate(submittedDate.toISOString().slice(0,10)) : '-'}</span>
            ${r.position ? `<span>💼 ${esc(r.position)}</span>` : ''}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:1.6rem;font-weight:800;color:${col};line-height:1">${ov.toFixed(1)}</div>
          <div style="font-size:0.72rem;color:#6b7280">${scoreLabel(ov)}</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        ${SURVEY_CATEGORIES.map(cat=>{
          const v = r.catScores?.[cat.key]||0;
          return `<span style="font-size:0.72rem;padding:2px 7px;border-radius:10px;background:#f3f4f6;color:${cat.color};font-weight:600">${cat.icon} ${v>0?v.toFixed(1):'-'}</span>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

window.__search = (q) => {
  const kw = q.toLowerCase();
  const f  = records.filter(r =>
    (r.respondentName||'').toLowerCase().includes(kw) ||
    (r.department||'').toLowerCase().includes(kw)
  );
  document.getElementById('list-wrap').innerHTML = renderList(f);
};

// ── view result ───────────────────────────────────────────────────────────────
window.__viewResult = async (id) => {
  editId = id;
  const rec = await getCultureSurvey(id);
  if (!rec) return;
  const panel = document.getElementById('panel');
  document.getElementById('panel-title').textContent = 'ผลแบบสำรวจ';
  document.getElementById('overlay').classList.add('open');
  panel.classList.add('open');

  const body = document.getElementById('panel-body');
  body.innerHTML = `
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:2.5rem;font-weight:800;color:${scoreColor(rec.overallScore||0)}">${(rec.overallScore||0).toFixed(2)} / 5.00</div>
      <div style="font-size:0.9rem;color:#6b7280">${scoreLabel(rec.overallScore||0)}</div>
      <div style="font-size:0.82rem;color:#9ca3af;margin-top:4px">${rec.anonymous?'ไม่ระบุตัวตน':esc(rec.respondentName||'-')} · ${esc(rec.department||'-')}</div>
    </div>
    ${SURVEY_CATEGORIES.map(cat=>{
      const avg = rec.catScores?.[cat.key]||0;
      const pct = avg/5*100;
      return `
      <div style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="font-size:1rem">${cat.icon}</span>
          <span style="font-weight:700;font-size:0.85rem;color:${cat.color}">${esc(cat.label)}</span>
          <span style="margin-left:auto;font-size:0.85rem;font-weight:700;color:${scoreColor(avg)}">${avg>0?avg.toFixed(2):'-'}</span>
        </div>
        <div style="background:#e5e7eb;border-radius:6px;height:8px;overflow:hidden">
          <div style="height:100%;border-radius:6px;width:${pct}%;background:${cat.color};transition:width .4s"></div>
        </div>
        ${cat.questions.map((q,qi)=>{
          const v = rec.responses?.[`${cat.key}_${qi}`]||0;
          const sc = SURVEY_SCALE.find(s=>s.v===v);
          return `<div style="display:flex;justify-content:space-between;padding:5px 2px;font-size:0.8rem;border-bottom:1px solid #f3f4f6">
            <span style="color:#374151;flex:1">${esc(q)}</span>
            <span style="font-weight:700;color:${SCALE_COLORS[v]||'#9ca3af'};white-space:nowrap;margin-left:8px">${v?v+'/5 — '+esc(sc?.label||''):'-'}</span>
          </div>`;
        }).join('')}
      </div>`;
    }).join('')}
    ${rec.openComment ? `<div style="background:#f9fafb;border-radius:8px;padding:12px;margin-top:8px"><div style="font-size:0.78rem;font-weight:700;color:#6b7280;margin-bottom:4px">ความคิดเห็นเพิ่มเติม</div><div style="font-size:0.85rem;color:#374151">${esc(rec.openComment)}</div></div>` : ''}`;

  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ปิด</button>`;
};

// ── new survey panel ──────────────────────────────────────────────────────────
window.__openPanel = async (id) => {
  editId    = null;
  responses = {};
  const panel = document.getElementById('panel');
  document.getElementById('panel-title').textContent = 'ทำแบบสำรวจวัฒนธรรมความปลอดภัย';
  document.getElementById('overlay').classList.add('open');
  panel.classList.add('open');
  document.getElementById('panel-body').innerHTML = renderSurveyForm();
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__submitSurvey()">ส่งแบบสำรวจ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderSurveyForm() {
  return `
  <div class="form-row">
    <div>
      <label class="lbl">แผนก *</label>
      <select id="f-dept">
        <option value="">-- เลือกแผนก --</option>
        ${SURVEY_DEPARTMENTS.map(d=>`<option value="${esc(d)}">${esc(d)}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">ตำแหน่งงาน</label>
      <input id="f-pos" placeholder="เช่น พนักงานคลังสินค้า, หัวหน้าทีม"/>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
    <input type="checkbox" id="f-anon" style="width:16px;height:16px;margin:0"/>
    <label for="f-anon" style="font-size:0.85rem;cursor:pointer">ไม่ระบุตัวตน (Anonymous)</label>
  </div>
  <div id="name-row">
    <label class="lbl">ชื่อ-นามสกุล</label>
    <input id="f-name" value="${esc(profile.displayName||'')}" placeholder="ชื่อผู้ตอบแบบสำรวจ"/>
  </div>

  <div class="section-title" style="margin-top:16px">คำถามแบบสำรวจ (1=ไม่เห็นด้วยอย่างยิ่ง … 5=เห็นด้วยอย่างยิ่ง)</div>

  ${SURVEY_CATEGORIES.map(cat=>`
    <div class="cat-block">
      <div class="cat-header" style="background:${cat.color}18">
        <span style="font-size:1.1rem">${cat.icon}</span>
        <span style="font-weight:700;color:${cat.color};font-size:0.88rem">${esc(cat.label)}</span>
        <span id="cat-avg-${cat.key}" style="margin-left:auto;font-size:0.82rem;font-weight:700;color:${cat.color}"></span>
      </div>
      ${cat.questions.map((q,qi)=>`
        <div class="q-row">
          <div class="q-text">${qi+1}. ${esc(q)}</div>
          <div class="scale-row">
            ${SURVEY_SCALE.map(s=>`
              <div class="scale-btn" id="sb-${cat.key}-${qi}-${s.v}"
                   onclick="window.__rate('${cat.key}',${qi},${s.v})"
                   title="${esc(s.label)}">
                ${s.v}<div style="font-size:0.6rem;line-height:1.1;opacity:.8">${s.v===1?'ไม่เห็น':s.v===3?'กลาง':s.v===5?'เห็นด้วย':''}</div>
              </div>`).join('')}
          </div>
        </div>`).join('')}
    </div>`).join('')}

  <label class="lbl">ความคิดเห็นหรือข้อเสนอแนะเพิ่มเติม</label>
  <textarea id="f-comment" placeholder="แสดงความคิดเห็นได้ที่นี่..."></textarea>`;
}

window.__rate = (catKey, qi, v) => {
  const rKey = `${catKey}_${qi}`;
  responses[rKey] = v;
  SURVEY_SCALE.forEach(s=>{
    const btn = document.getElementById(`sb-${catKey}-${qi}-${s.v}`);
    if (!btn) return;
    if (s.v===v) {
      btn.classList.add('sel');
      btn.style.background = SCALE_COLORS[v];
      btn.style.borderColor = SCALE_COLORS[v];
    } else {
      btn.classList.remove('sel');
      btn.style.background = '';
      btn.style.borderColor = '';
    }
  });
  const cat = SURVEY_CATEGORIES.find(c=>c.key===catKey);
  if (cat) {
    const vals = cat.questions.map((_,i)=>responses[`${catKey}_${i}`]).filter(Boolean);
    const avg  = vals.length ? (vals.reduce((s,v)=>s+v,0)/vals.length).toFixed(1) : '';
    const el   = document.getElementById(`cat-avg-${catKey}`);
    if (el) el.textContent = avg ? `avg: ${avg}/5` : '';
  }
};

document.addEventListener('change', e => {
  if (e.target.id==='f-anon') {
    const row = document.getElementById('name-row');
    if (row) row.style.display = e.target.checked ? 'none' : '';
  }
});

// ── submit ────────────────────────────────────────────────────────────────────
window.__submitSurvey = async () => {
  const dept   = document.getElementById('f-dept')?.value;
  const anon   = document.getElementById('f-anon')?.checked;
  const name   = document.getElementById('f-name')?.value.trim();
  if (!dept) { alert('กรุณาเลือกแผนก'); return; }

  const totalQ = SURVEY_CATEGORIES.flatMap(c=>c.questions).length;
  const answered = Object.keys(responses).length;
  if (answered < totalQ) {
    if (!confirm(`ยังตอบไม่ครบ (${answered}/${totalQ} คำถาม) ต้องการส่งหรือไม่?`)) return;
  }

  const catScores = {};
  SURVEY_CATEGORIES.forEach(cat=>{
    const vals = cat.questions.map((_,qi)=>responses[`${cat.key}_${qi}`]).filter(Boolean);
    catScores[cat.key] = vals.length ? +(vals.reduce((s,v)=>s+v,0)/vals.length).toFixed(2) : 0;
  });
  const allVals = Object.values(catScores).filter(v=>v>0);
  const overallScore = allVals.length ? +(allVals.reduce((s,v)=>s+v,0)/allVals.length).toFixed(2) : 0;

  const data = {
    department:     dept,
    position:       document.getElementById('f-pos')?.value.trim()||'',
    anonymous:      anon,
    respondentName: anon ? '' : (name||profile.displayName||''),
    responses,
    catScores,
    overallScore,
    openComment:    document.getElementById('f-comment')?.value.trim()||'',
    submittedAt:    new Date().toISOString(),
  };
  try {
    await createCultureSurvey(data, profile.uid);
    window.__closePanel();
    await render();
  } catch(e) { alert('ส่งไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบแบบสำรวจนี้?')) return;
  await deleteCultureSurvey(id);
  window.__closePanel();
  await render();
};

window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
