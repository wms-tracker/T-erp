<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อุปกรณ์ความปลอดภัย</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listEquipments, getEquipment, createEquipment, updateEquipment, deleteEquipment,
  EQUIPMENT_CATEGORIES, EQUIP_STATUS,
} from "./js/safety-data.js";
import './js/safety-attach.js';

let _profile, _rows = [], _editId = null, _filterExpiry = '';

const today = () => new Date().toISOString().split('T')[0];
function daysUntil(d) { if (!d) return null; return Math.ceil((new Date(d) - new Date()) / 86400000); }
function expiryBadge(d) {
  const days = daysUntil(d);
  if (days === null) return '';
  if (days < 0)  return `<span style="background:#fee2e2;color:#dc2626;padding:2px 7px;border-radius:8px;font-size:.72rem;font-weight:700">หมดอายุ ${Math.abs(days)}วันที่แล้ว</span>`;
  if (days <= 30) return `<span style="background:#fef3c7;color:#d97706;padding:2px 7px;border-radius:8px;font-size:.72rem;font-weight:700">หมดใน ${days} วัน</span>`;
  return `<span style="color:#64748b;font-size:.8rem">${d}</span>`;
}

const CSS = `<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Sarabun,sans-serif;background:#f8fafc;color:#0f172a;}
.wrap{max-width:1300px;margin:0 auto;padding:0 20px 60px;}
.hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:20px 0 14px;}
.page-title{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px;}
.btn{padding:7px 16px;border:none;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.1s;}
.btn-primary{background:#0f172a;color:#fff;} .btn-primary:hover{background:#1e293b;}
.btn-ghost{background:#f1f5f9;color:#475569;} .btn-ghost:hover{background:#e2e8f0;}
.btn-green{background:#16a34a;color:#fff;}  .btn-green:hover{background:#15803d;}
.btn-red{background:#fee2e2;color:#dc2626;} .btn-red:hover{background:#fecaca;}
.btn-sm{padding:4px 10px;font-size:.75rem;}
.stat-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.stat-card{background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.07);flex:1;min-width:110px;cursor:pointer;transition:.1s;}
.stat-card:hover{box-shadow:0 3px 8px rgba(0,0,0,.1);}
.stat-card.active{outline:2px solid #0891b2;}
.stat-val{font-size:1.6rem;font-weight:900;line-height:1;}
.stat-label{font-size:.72rem;color:#64748b;margin-top:3px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
.filter-row input,.filter-row select{padding:6px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.82rem;font-family:Sarabun,sans-serif;background:#fff;}
.tbl-card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden;}
.tbl{width:100%;border-collapse:collapse;font-size:.83rem;}
.tbl th{text-align:left;padding:10px 14px;font-size:.72rem;font-weight:700;color:#64748b;background:#f8fafc;border-bottom:1.5px solid #f1f5f9;}
.tbl td{padding:10px 14px;border-bottom:1px solid #f8fafc;vertical-align:middle;}
.tbl tr:hover td{background:#f8fafc;}
.tbl .empty{text-align:center;padding:40px;color:#94a3b8;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:700;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;}
.panel{position:fixed;right:0;top:0;height:100dvh;width:min(640px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);z-index:101;display:flex;flex-direction:column;overflow:hidden;transform:translateX(100%);transition:transform .25s ease;}
.panel.open{transform:translateX(0);}
.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f1f5f9;flex-shrink:0;}
.panel-body{flex:1;overflow-y:auto;padding:20px;}
.panel-ft{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld.full{grid-column:1/-1;}
.lbl{font-size:.75rem;font-weight:700;color:#475569;}
input,select,textarea{padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;outline:none;color:#0f172a;background:#fff;width:100%;}
input:focus,select:focus,textarea:focus{border-color:#0891b2;}
.sec-hd{font-size:.78rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;padding:10px 0 8px;border-bottom:1.5px solid #f1f5f9;margin:12px 0 8px;}
@media print{
  .no-print{display:none!important;}
  .print-only{display:block!important;}
  .overlay,.panel{display:none!important;}
  body{font-size:9pt;}
  .tbl{font-size:8.5pt;}
}
.print-only{display:none;}
</style>`;

// ── LOAD / RENDER ─────────────────────────────────────────────────────────────
async function loadList() {
  _rows = await listEquipments({ lim: 500 });
  renderList();
}

function renderList() {
  const mc = document.getElementById('main-content');
  const total  = _rows.length;
  const active = _rows.filter(r => r.status === 'active').length;
  const expired= _rows.filter(r => r.expiryDate && r.expiryDate < today()).length;
  const soon   = _rows.filter(r => { const d = daysUntil(r.expiryDate); return d !== null && d >= 0 && d <= 30; }).length;
  const repair = _rows.filter(r => r.status === 'repair').length;

  mc.innerHTML = CSS + `
  <div class="wrap">
    <div class="hd no-print">
      <div class="page-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        อุปกรณ์ความปลอดภัย (PPE & Safety Equipment)
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="window.print()">🖨 พิมพ์</button>
        <button class="btn btn-primary" onclick="__openForm()">+ เพิ่มอุปกรณ์</button>
      </div>
    </div>

    <div class="stat-bar no-print">
      <div class="stat-card ${_filterExpiry===''?'active':''}" onclick="__setFilter('')"><div class="stat-val">${total}</div><div class="stat-label">ทั้งหมด</div></div>
      <div class="stat-card ${_filterExpiry==='active'?'active':''}" onclick="__setFilter('active')"><div class="stat-val" style="color:#16a34a">${active}</div><div class="stat-label">ใช้งานได้</div></div>
      <div class="stat-card ${_filterExpiry==='expired'?'active':''}" onclick="__setFilter('expired')"><div class="stat-val" style="color:#dc2626">${expired}</div><div class="stat-label">หมดอายุ</div></div>
      <div class="stat-card ${_filterExpiry==='soon'?'active':''}" onclick="__setFilter('soon')"><div class="stat-val" style="color:#d97706">${soon}</div><div class="stat-label">หมดใน 30 วัน</div></div>
      <div class="stat-card ${_filterExpiry==='repair'?'active':''}" onclick="__setFilter('repair')"><div class="stat-val" style="color:#dc2626">${repair}</div><div class="stat-label">ส่งซ่อม</div></div>
    </div>

    <div class="filter-row no-print">
      <input id="fSearch" placeholder="🔍 ค้นหาชื่ออุปกรณ์..." oninput="__filterList()" style="min-width:200px">
      <select id="fCat" onchange="__filterList()"><option value="">ทุกหมวด</option>${EQUIPMENT_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select>
      <select id="fStatus" onchange="__filterList()"><option value="">ทุกสถานะ</option>${Object.entries(EQUIP_STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select>
    </div>

    <div class="tbl-card no-print">
      <table class="tbl"><thead><tr>
        <th>ชื่ออุปกรณ์</th><th>หมวดหมู่</th><th>S/N</th><th>จำนวน</th><th>สถานที่</th><th>ผู้รับผิดชอบ</th><th>วันหมดอายุ</th><th>ตรวจสอบครั้งต่อไป</th><th>สถานะ</th><th></th>
      </tr></thead>
      <tbody id="equipBody">${buildRows(_rows)}</tbody></table>
    </div>

    <!-- Print table (all columns simplified) -->
    <div class="print-only">
      <h2 style="font-size:14pt;margin-bottom:8px">ทะเบียนอุปกรณ์ความปลอดภัย</h2>
      <table style="width:100%;border-collapse:collapse;font-size:9pt">
        <thead><tr style="background:#f1f5f9">${['#','ชื่ออุปกรณ์','หมวด','S/N','จำนวน','ผู้รับผิดชอบ','หมดอายุ','สถานะ'].map(h=>`<th style="border:1px solid #ccc;padding:5px">${h}</th>`).join('')}</tr></thead>
        <tbody>${_rows.map((r,i)=>{
          const s=EQUIP_STATUS[r.status]||{label:r.status,color:'#64748b'};
          return `<tr><td style="border:1px solid #ccc;padding:4px;text-align:center">${i+1}</td>
            <td style="border:1px solid #ccc;padding:4px">${r.equipmentName||'—'}</td>
            <td style="border:1px solid #ccc;padding:4px">${(r.category||'').split('—').pop()?.trim()||r.category||'—'}</td>
            <td style="border:1px solid #ccc;padding:4px">${r.serialNumber||'—'}</td>
            <td style="border:1px solid #ccc;padding:4px;text-align:center">${r.quantity||1}</td>
            <td style="border:1px solid #ccc;padding:4px">${r.assignedTo||'—'}</td>
            <td style="border:1px solid #ccc;padding:4px;color:${r.expiryDate&&r.expiryDate<today()?'#dc2626':'#0f172a'}">${r.expiryDate||'—'}</td>
            <td style="border:1px solid #ccc;padding:4px;color:${s.color}">${s.label}</td>
          </tr>`;}).join('')}
        </tbody>
      </table>
      <p style="margin-top:12px;font-size:8pt;color:#64748b">พิมพ์ ณ วันที่ ${today()}</p>
    </div>
  </div>
  <div class="overlay" id="overlay" onclick="__closePanel()"></div>
  <div class="panel" id="sidePanel"><div id="panelContent" style="display:flex;flex-direction:column;height:100%"></div></div>`;
}

function buildRows(rows) {
  if (!rows.length) return `<tr><td colspan="10" class="empty">ยังไม่มีข้อมูล</td></tr>`;
  let filtered = rows;
  if (_filterExpiry === 'expired') filtered = rows.filter(r => r.expiryDate && r.expiryDate < today());
  if (_filterExpiry === 'soon')    filtered = rows.filter(r => { const d=daysUntil(r.expiryDate); return d!==null&&d>=0&&d<=30; });
  if (_filterExpiry === 'active')  filtered = rows.filter(r => r.status === 'active');
  if (_filterExpiry === 'repair')  filtered = rows.filter(r => r.status === 'repair');
  if (!filtered.length) return `<tr><td colspan="10" class="empty">ไม่มีรายการในหมวดนี้</td></tr>`;
  return filtered.map(r => {
    const s = EQUIP_STATUS[r.status] || { label: r.status||'—', color:'#64748b', bg:'#f1f5f9' };
    return `<tr>
      <td style="font-weight:700">${r.equipmentName||'—'}</td>
      <td style="font-size:.78rem">${r.category||'—'}</td>
      <td style="font-size:.78rem;color:#64748b">${r.serialNumber||'—'}</td>
      <td style="text-align:center">${r.quantity||1}</td>
      <td style="font-size:.78rem">${r.location||'—'}</td>
      <td style="font-size:.78rem">${r.assignedTo||'—'}</td>
      <td>${expiryBadge(r.expiryDate)}</td>
      <td style="font-size:.78rem;color:${r.nextInspectionDate&&r.nextInspectionDate<=today()?'#dc2626':'#0f172a'}">${r.nextInspectionDate||'—'}</td>
      <td><span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span></td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-sm" onclick="window.__viewRecord('${r.id}')">ดูเอกสาร</button><button class="btn btn-ghost btn-sm" onclick="__editRecord('${r.id}')">แก้ไข</button>
        <button class="btn btn-red btn-sm" onclick="__del('${r.id}')">ลบ</button>
      </td>
    </tr>`;
  }).join('');
}

window.__setFilter = (f) => {
  _filterExpiry = f;
  const mc = document.getElementById('main-content');
  mc.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
  const tbody = document.getElementById('equipBody');
  if (tbody) tbody.innerHTML = buildRows(_rows);
  renderList();
};

window.__filterList = () => {
  const search = document.getElementById('fSearch')?.value?.toLowerCase() || '';
  const cat    = document.getElementById('fCat')?.value || '';
  const status = document.getElementById('fStatus')?.value || '';
  let rows = _rows;
  if (_filterExpiry === 'expired') rows = rows.filter(r => r.expiryDate && r.expiryDate < today());
  if (_filterExpiry === 'soon')    rows = rows.filter(r => { const d=daysUntil(r.expiryDate); return d!==null&&d>=0&&d<=30; });
  if (_filterExpiry === 'active')  rows = rows.filter(r => r.status === 'active');
  if (_filterExpiry === 'repair')  rows = rows.filter(r => r.status === 'repair');
  if (search) rows = rows.filter(r => (r.equipmentName||'').toLowerCase().includes(search));
  if (cat)    rows = rows.filter(r => r.category === cat);
  if (status) rows = rows.filter(r => r.status === status);
  const tbody = document.getElementById('equipBody');
  if (tbody) tbody.innerHTML = buildRows(rows);
};

// ── PANEL helpers ─────────────────────────────────────────────────────────────
function openPanel(html) {
  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('overlay').style.display = 'block';
}
window.__closePanel = () => {
  document.getElementById('sidePanel').classList.remove('open');
  document.getElementById('overlay').style.display = 'none';
};

// ── FORM ──────────────────────────────────────────────────────────────────────
window.__openForm = () => { _editId = null; renderFormPanel(); };

window.__editRecord = async (id) => {
  const rec = _rows.find(r => r.id === id) || await getEquipment(id);
  if (!rec) return;
  _editId = id;
  renderFormPanel(rec);
};

function renderFormPanel(rec = {}) {
  openPanel(`
  <div class="panel-hd">
    <div style="font-weight:700">${_editId ? 'แก้ไขอุปกรณ์' : 'เพิ่มอุปกรณ์ใหม่'}</div>
    <button class="btn btn-ghost btn-sm" onclick="__closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="form-grid">
      <div class="fld full"><label class="lbl">ชื่ออุปกรณ์ *</label><input id="eName" value="${rec.equipmentName||''}"></div>
      <div class="fld full"><label class="lbl">หมวดหมู่</label>
        <select id="eCat">${EQUIPMENT_CATEGORIES.map(c=>`<option ${rec.category===c?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <div class="fld"><label class="lbl">Serial Number / รหัส</label><input id="eSN" value="${rec.serialNumber||''}"></div>
      <div class="fld"><label class="lbl">จำนวน</label><input type="number" id="eQty" min="1" value="${rec.quantity||1}"></div>
      <div class="fld"><label class="lbl">สถานที่เก็บ / ใช้งาน</label><input id="eLoc" value="${rec.location||''}"></div>
      <div class="fld"><label class="lbl">ผู้รับผิดชอบ</label><input id="eAssigned" value="${rec.assignedTo||''}"></div>
      <div class="fld"><label class="lbl">วันที่ซื้อ/รับ</label><input type="date" id="ePurchase" value="${rec.purchaseDate||''}"></div>
      <div class="fld"><label class="lbl">วันหมดอายุ</label><input type="date" id="eExpiry" value="${rec.expiryDate||''}"></div>
      <div class="fld"><label class="lbl">ตรวจสอบล่าสุด</label><input type="date" id="eLastInsp" value="${rec.lastInspectionDate||''}"></div>
      <div class="fld"><label class="lbl">ตรวจสอบครั้งต่อไป</label><input type="date" id="eNextInsp" value="${rec.nextInspectionDate||''}"></div>
      <div class="fld full"><label class="lbl">สถานะ</label>
        <select id="eStatus">
          ${Object.entries(EQUIP_STATUS).map(([k,v])=>`<option value="${k}" ${(rec.status||'active')===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
      <div class="fld full"><label class="lbl">หมายเหตุ</label><textarea id="eNote" rows="2">${rec.notes||''}</textarea></div>
    </div>
  </div>
  <div class="panel-ft">
    <button class="btn btn-ghost" onclick="__closePanel()">ยกเลิก</button>
    <button class="btn btn-green" onclick="__saveEquip()">💾 บันทึก</button>
  </div>`);
}

window.__saveEquip = async () => {
  const name = document.getElementById('eName')?.value?.trim();
  if (!name) return alert('กรุณาระบุชื่ออุปกรณ์');
  const data = {
    equipmentName:      name,
    category:           document.getElementById('eCat')?.value || '',
    serialNumber:       document.getElementById('eSN')?.value || '',
    quantity:           +document.getElementById('eQty')?.value || 1,
    location:           document.getElementById('eLoc')?.value || '',
    assignedTo:         document.getElementById('eAssigned')?.value || '',
    purchaseDate:       document.getElementById('ePurchase')?.value || '',
    expiryDate:         document.getElementById('eExpiry')?.value || '',
    lastInspectionDate: document.getElementById('eLastInsp')?.value || '',
    nextInspectionDate: document.getElementById('eNextInsp')?.value || '',
    status:             document.getElementById('eStatus')?.value || 'active',
    notes:              document.getElementById('eNote')?.value || '',
  };
  try {
    if (_editId) await updateEquipment(_editId, data);
    else await createEquipment(data, _profile?.uid);
    _editId = null;
    __closePanel();
    await loadList();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

window.__del = async (id) => {
  if (!confirm('ลบอุปกรณ์นี้?')) return;
  await deleteEquipment(id);
  await loadList();
};

// ── BOOT ──────────────────────────────────────────────────────────────────────
_profile = await requireRole(['safety_officer','kpo','admin','manager']);
renderShell(_profile, 'safety-equipment', 'อุปกรณ์ความปลอดภัย');
loadList();
window.__viewRecord = async id => { await window.__editRecord(id); window.__safetyViewMode(); };
</script>
</body>
</html>
