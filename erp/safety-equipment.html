<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อุปกรณ์ความปลอดภัย — KPO Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b;">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listEquipments, getEquipment, createEquipment, updateEquipment, deleteEquipment,
  EQUIPMENT_CATEGORIES, EQUIP_STATUS, DEPARTMENTS
} from "./js/safety-data.js";

const $ = id => document.getElementById(id);
let _profile, _equips = [];
let _editId = null;
let _filterCat = '', _filterStatus = '', _search = '';

function buildLayout() {
  document.getElementById('main-content').innerHTML = `
  <style>
    .eq{padding:0 20px 40px;max-width:1200px;margin:0 auto;}
    .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:20px 0 14px;}
    .page-title{font-size:1.2rem;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;}
    .btn{padding:7px 16px;border:none;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn-primary{background:#0891b2;color:#fff;} .btn-primary:hover{background:#0e7490;}
    .btn-ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;} .btn-ghost:hover{background:#e2e8f0;}
    .btn-sm{padding:5px 11px;font-size:.78rem;}
    .btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600;}
    .sum-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .sum-chip{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 16px;flex:1;min-width:100px;text-align:center;}
    .sum-chip .val{font-size:1.4rem;font-weight:800;}
    .sum-chip .lbl{font-size:.72rem;color:#94a3b8;margin-top:2px;}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .filter-bar input,.filter-bar select{padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.82rem;}
    .tbl-wrap{overflow-x:auto;}
    .tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
    .tbl th{text-align:left;padding:9px 12px;font-size:.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;background:#f8fafc;border-bottom:1.5px solid #e2e8f0;}
    .tbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;}
    .tbl tr:hover td{background:#f8fafc;cursor:pointer;}
    .empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
    .expire-warn{color:#dc2626;font-weight:600;}
    .expire-soon{color:#d97706;font-weight:600;}
    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;}
    .modal-panel{background:#fff;height:100dvh;width:min(540px,100vw);overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;}
    .modal-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
    .modal-body{padding:20px;flex:1;}
    .modal-foot{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;}
    .form-group{margin-bottom:12px;}
    .form-label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:4px;}
    .req{color:#dc2626;}
    .form-ctrl{width:100%;padding:8px 11px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.85rem;color:#0f172a;box-sizing:border-box;}
    .form-ctrl:focus{outline:none;border-color:#0891b2;box-shadow:0 0 0 3px rgba(8,145,178,.1);}
    textarea.form-ctrl{resize:vertical;min-height:60px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
  </style>
  <div class="eq" id="mainView"></div>
  <div id="mBg" class="modal-bg" style="display:none" onclick="__closeModal(event)">
    <div class="modal-panel">
      <div class="modal-head"><div style="font-size:1rem;font-weight:700;color:#0f172a" id="mdTitle">—</div>
        <button class="btn btn-ghost btn-sm" onclick="__closeModal(null)">✕</button></div>
      <div class="modal-body" id="mdBody"></div>
      <div class="modal-foot" id="mdFoot"></div>
    </div>
  </div>`;
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
}

function renderView() {
  const today = new Date().toISOString().split('T')[0];
  const expiredCount = _equips.filter(e => e.expiryDate && e.expiryDate < today).length;
  const soonCount    = _equips.filter(e => {
    const d = daysUntil(e.expiryDate);
    return d !== null && d >= 0 && d <= 30;
  }).length;
  const inspCount    = _equips.filter(e => e.status === 'inspect').length;

  const filtered = _equips.filter(e => {
    if (_filterCat && e.category !== _filterCat) return false;
    if (_filterStatus && e.status !== _filterStatus) return false;
    if (_search && !JSON.stringify(e).toLowerCase().includes(_search.toLowerCase())) return false;
    return true;
  });

  $('mainView').innerHTML = `
  <div class="page-header">
    <div class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      อุปกรณ์ความปลอดภัย
    </div>
    <button class="btn btn-primary" onclick="__openForm(null)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      เพิ่มอุปกรณ์
    </button>
  </div>

  <div class="sum-bar">
    <div class="sum-chip"><div class="val">${_equips.length}</div><div class="lbl">รายการทั้งหมด</div></div>
    <div class="sum-chip"><div class="val" style="color:#16a34a">${_equips.filter(e=>e.status==='active').length}</div><div class="lbl">ใช้งานได้</div></div>
    <div class="sum-chip"><div class="val" style="color:#d97706">${inspCount}</div><div class="lbl">รอตรวจสอบ</div></div>
    <div class="sum-chip"><div class="val" style="color:#f59e0b">${soonCount}</div><div class="lbl">หมดอายุภายใน 30 วัน</div></div>
    <div class="sum-chip"><div class="val" style="color:#dc2626">${expiredCount}</div><div class="lbl">หมดอายุแล้ว</div></div>
  </div>

  <div class="filter-bar">
    <input type="text" placeholder="ค้นหา..." oninput="__srch(this.value)" style="min-width:180px">
    <select onchange="__fCat(this.value)">
      <option value="">ทุกหมวดหมู่</option>
      ${EQUIPMENT_CATEGORIES.map(c=>`<option value="${c}" ${_filterCat===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <select onchange="__fSt(this.value)">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(EQUIP_STATUS).map(([k,v])=>`<option value="${k}" ${_filterStatus===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  </div>

  ${filtered.length === 0
    ? `<div class="empty-state"><div style="font-size:2.5rem">🦺</div><div style="margin-top:8px">ยังไม่มีรายการอุปกรณ์</div></div>`
    : `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>รหัส</th><th>ชื่ออุปกรณ์</th><th>หมวดหมู่</th><th>แผนก</th><th>จำนวน</th><th>ตรวจสอบครั้งถัดไป</th><th>วันหมดอายุ</th><th>สถานะ</th><th></th></tr></thead>
      <tbody>
      ${filtered.map(e => {
        const s = EQUIP_STATUS[e.status] || EQUIP_STATUS.active;
        const d = daysUntil(e.expiryDate);
        const today2 = new Date().toISOString().split('T')[0];
        let expClass = '';
        if (e.expiryDate && e.expiryDate < today2) expClass = 'expire-warn';
        else if (d !== null && d <= 30) expClass = 'expire-soon';
        return `<tr onclick="__openForm('${e.id}')">
          <td style="font-weight:700;color:#0891b2">${e.equipId||'—'}</td>
          <td style="font-weight:600">${e.name||'—'}</td>
          <td style="font-size:.78rem">${e.category||'—'}</td>
          <td>${e.department||'—'}</td>
          <td style="text-align:center">${e.quantity||'—'}</td>
          <td>${e.nextInspDate||'—'}</td>
          <td class="${expClass}">${e.expiryDate||'—'}${d!==null&&d<0?' (หมดแล้ว)':d!==null&&d<=30?` (${d}วัน)`:''}</td>
          <td><span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span></td>
          <td onclick="event.stopPropagation()"><button class="btn btn-danger btn-sm" onclick="__del('${e.id}')">ลบ</button></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`}`;
}

async function openForm(id) {
  _editId = id;
  let e = id ? (_equips.find(x=>x.id===id) || await getEquipment(id)) : null;
  $('mdTitle').textContent = id ? 'แก้ไขอุปกรณ์' : 'เพิ่มอุปกรณ์ความปลอดภัย';
  $('mdBody').innerHTML = `
  <div class="form-group">
    <label class="form-label">ชื่ออุปกรณ์ <span class="req">*</span></label>
    <input type="text" class="form-ctrl" id="fName" value="${e?.name||''}" placeholder="ชื่ออุปกรณ์">
  </div>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">รหัสอุปกรณ์</label>
      <input type="text" class="form-ctrl" id="fEqId" value="${e?.equipId||''}" placeholder="EQ-001">
    </div>
    <div class="form-group">
      <label class="form-label">หมวดหมู่ <span class="req">*</span></label>
      <select class="form-ctrl" id="fCat">
        ${EQUIPMENT_CATEGORIES.map(c=>`<option value="${c}" ${e?.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">แผนก</label>
      <select class="form-ctrl" id="fDept">
        <option value="">— ทุกแผนก —</option>
        ${DEPARTMENTS.map(d=>`<option value="${d}" ${e?.department===d?'selected':''}>${d}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">จำนวน</label>
      <input type="number" class="form-ctrl" id="fQty" value="${e?.quantity||''}" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">วันที่ซื้อ/รับ</label>
      <input type="date" class="form-ctrl" id="fPurchase" value="${e?.purchaseDate||''}">
    </div>
    <div class="form-group">
      <label class="form-label">วันหมดอายุ</label>
      <input type="date" class="form-ctrl" id="fExpiry" value="${e?.expiryDate||''}">
    </div>
    <div class="form-group">
      <label class="form-label">ตรวจสอบครั้งล่าสุด</label>
      <input type="date" class="form-ctrl" id="fLastInsp" value="${e?.lastInspDate||''}">
    </div>
    <div class="form-group">
      <label class="form-label">กำหนดตรวจสอบครั้งถัดไป</label>
      <input type="date" class="form-ctrl" id="fNextInsp" value="${e?.nextInspDate||''}">
    </div>
    <div class="form-group">
      <label class="form-label">ยี่ห้อ / รุ่น</label>
      <input type="text" class="form-ctrl" id="fModel" value="${e?.model||''}">
    </div>
    <div class="form-group">
      <label class="form-label">สถานะ</label>
      <select class="form-ctrl" id="fSt">
        ${Object.entries(EQUIP_STATUS).map(([k,v])=>`<option value="${k}" ${(e?.status||'active')===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">หมายเหตุ</label>
    <textarea class="form-ctrl" id="fNote">${e?.note||''}</textarea>
  </div>`;
  $('mdFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__closeModal(null)">ยกเลิก</button>
    ${id?`<button class="btn btn-danger btn-sm" onclick="__del('${id}')">ลบ</button>`:''}
    <button class="btn btn-primary" id="mdSave" onclick="__save()">${id?'บันทึกการแก้ไข':'เพิ่มอุปกรณ์'}</button>`;
  $('mBg').style.display = 'flex';
}

async function save() {
  const name = $('fName')?.value?.trim();
  const cat  = $('fCat')?.value;
  if (!name || !cat) { showToast('กรุณาระบุชื่อและหมวดหมู่', '#dc2626'); return; }
  const data = {
    name, equipId: $('fEqId')?.value?.trim()||'', category: cat,
    department: $('fDept')?.value||'', quantity: +($('fQty')?.value||0)||null,
    purchaseDate: $('fPurchase')?.value||'', expiryDate: $('fExpiry')?.value||'',
    lastInspDate: $('fLastInsp')?.value||'', nextInspDate: $('fNextInsp')?.value||'',
    model: $('fModel')?.value?.trim()||'', status: $('fSt')?.value||'active',
    note: $('fNote')?.value?.trim()||'',
  };
  const btn = $('mdSave'); btn.disabled=true; btn.textContent='กำลังบันทึก...';
  try {
    if (_editId) await updateEquipment(_editId, data);
    else await createEquipment(data, _profile.uid);
    _equips = await listEquipments({ lim: 500 });
    closeModal(null); renderView();
    showToast('บันทึกแล้ว ✓', '#16a34a');
  } catch(e) { btn.disabled=false; btn.textContent=_editId?'บันทึกการแก้ไข':'เพิ่มอุปกรณ์'; showToast(e.message,'#dc2626'); }
}

async function del(id) {
  if (!confirm('ลบรายการนี้?')) return;
  await deleteEquipment(id);
  _equips = await listEquipments({ lim: 500 });
  closeModal(null); renderView();
  showToast('ลบแล้ว','#0891b2');
}

function closeModal(e) { if (e && e.target!==$('mBg')) return; $('mBg').style.display='none'; }
function showToast(msg,color='#16a34a'){const el=document.createElement('div');el.style.cssText=`position:fixed;bottom:24px;right:24px;background:${color};color:#fff;padding:12px 20px;border-radius:10px;font-family:Sarabun,sans-serif;font-size:.85rem;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)`;el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500);}

window.__openForm=openForm; window.__save=save; window.__del=del; window.__closeModal=closeModal;
window.__srch=v=>{_search=v;renderView()};
window.__fCat=v=>{_filterCat=v;renderView()};
window.__fSt=v=>{_filterStatus=v;renderView()};

_profile = await requireRole(['safety_officer','kpo','admin','manager']);
renderShell(_profile, 'safety-equipment', 'อุปกรณ์ความปลอดภัย');
buildLayout();
_equips = await listEquipments({ lim: 500 });
renderView();
</script>
</body>
</html>
