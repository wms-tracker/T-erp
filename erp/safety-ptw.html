<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใบอนุญาตทำงาน (PTW) — KPO Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #printArea, #printArea * { visibility: visible !important; }
      #printArea {
        position: fixed; inset: 0; padding: 15mm 14mm;
        font-family: Sarabun, sans-serif; font-size: 10pt;
        color: #000; background: #fff; z-index: 9999;
      }
      .ptw-header { text-align: center; border-bottom: 2pt solid #000; padding-bottom: 6pt; margin-bottom: 10pt; }
      .ptw-doc-title { font-size: 14pt; font-weight: 800; }
      .ptw-doc-sub   { font-size: 10.5pt; margin-top: 3pt; }
      .ptw-badge-print { display: inline-block; border: 1pt solid #000; padding: 1pt 8pt; border-radius: 10pt; font-weight: 700; font-size: 9pt; }
      .ptw-row   { display: flex; gap: 20pt; margin: 5pt 0; font-size: 9.5pt; }
      .ptw-field { flex: 1; }
      .ptw-label { font-weight: 700; font-size: 8.5pt; }
      .ptw-val   { border-bottom: .5pt solid #999; min-height: 14pt; padding: 1pt 0; }
      .ptw-section { margin-top: 9pt; }
      .ptw-sec-title { font-size: 10pt; font-weight: 700; background: #f0f0f0; padding: 3pt 6pt; margin-bottom: 5pt; }
      .ptw-check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3pt; font-size: 9pt; }
      .ptw-check-item { display: flex; align-items: flex-start; gap: 6pt; }
      .ptw-box { width: 10pt; height: 10pt; border: 1pt solid #555; flex-shrink: 0; margin-top: 1pt; display: flex; align-items: center; justify-content: center; font-size: 8pt; }
      .ptw-sign-row  { display: flex; justify-content: space-around; margin-top: 28pt; }
      .ptw-sign-blk  { text-align: center; min-width: 100pt; }
      .ptw-sign-line { border-top: 1pt solid #666; margin-top: 28pt; padding-top: 4pt; font-size: 8.5pt; white-space: pre; }
      @page { margin: 0; size: A4; }
    }
  </style>
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b;">กำลังโหลด...</div>
<div id="printArea" style="display:none"></div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listPermits, getPermit, createPermit, updatePermit,
  approvePermit, rejectPermit, activatePermit, closePermit, cancelPermit,
  generatePermitId, PERMIT_TYPES, PERMIT_STATUS, PERMIT_CHECKLISTS, PPE_OPTIONS,
} from "./js/safety-data.js";

const $ = id => document.getElementById(id);
let _profile, _view = 'board', _items = [], _editId = null, _printId = null;
let _filterStatus = '', _filterType = '', _filterSearch = '';
const TODAY = () => new Date().toISOString().split('T')[0];

// ── helpers ──────────────────────────────────────────────────────────────
function statusBadge(s) {
  const p = PERMIT_STATUS[s] || { label: s, color: '#94a3b8' };
  return `<span style="background:${p.color}22;color:${p.color};border:1px solid ${p.color}44;border-radius:10px;padding:2px 9px;font-size:.72rem;font-weight:700">${p.label}</span>`;
}
function typeBadge(t) {
  const p = PERMIT_TYPES[t] || { icon: '📋', labelTh: t, color: '#94a3b8' };
  return `<span style="background:${p.color}18;color:${p.color};border-radius:8px;padding:2px 9px;font-size:.75rem;font-weight:700">${p.icon} ${p.labelTh}</span>`;
}
function daysLeft(endDate) {
  if (!endDate) return null;
  return Math.ceil((new Date(endDate) - new Date()) / 86400000);
}
function daysLeftBadge(endDate) {
  if (!endDate) return '';
  const d = daysLeft(endDate);
  if (d < 0)  return `<span style="color:#dc2626;font-size:.72rem;font-weight:700">⛔ หมดอายุ ${Math.abs(d)} วันแล้ว</span>`;
  if (d === 0) return `<span style="color:#dc2626;font-size:.72rem;font-weight:700">⚠️ หมดอายุวันนี้</span>`;
  if (d <= 1)  return `<span style="color:#dc2626;font-size:.72rem;font-weight:700">⚠️ หมดอายุพรุ่งนี้</span>`;
  if (d <= 3)  return `<span style="color:#d97706;font-size:.72rem;font-weight:700">⚠️ เหลือ ${d} วัน</span>`;
  return `<span style="color:#16a34a;font-size:.72rem">เหลือ ${d} วัน</span>`;
}
const canApprove = () => ['admin','manager','safety_officer'].includes(_profile?.role);

// ── load data ─────────────────────────────────────────────────────────────
async function loadData() {
  _items = await listPermits({ lim: 500 });
}

// ── main render ───────────────────────────────────────────────────────────
function renderContent() {
  const mc = $('main-content');
  mc.innerHTML = `
  <style>
    .pw{padding:0 20px 60px;max-width:1300px;margin:0 auto;}
    .ph{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:18px 0 12px;}
    .ph-title{font-size:1.15rem;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;}
    .btn{padding:7px 16px;border:none;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn-primary{background:#0891b2;color:#fff;} .btn-primary:hover{background:#0e7490;}
    .btn-ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;} .btn-ghost:hover{background:#e2e8f0;}
    .btn-sm{padding:5px 10px;font-size:.78rem;}
    .btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fecaca;} .btn-danger:hover{background:#fecaca;}
    .btn-success{background:#dcfce7;color:#16a34a;border:1px solid #bbf7d0;} .btn-success:hover{background:#bbf7d0;}
    .btn-warn{background:#fef3c7;color:#d97706;border:1px solid #fde68a;} .btn-warn:hover{background:#fde68a;}
    .tab-bar{display:flex;gap:4px;background:#f1f5f9;border-radius:10px;padding:4px;margin-bottom:14px;flex-wrap:wrap;}
    .tab{padding:7px 16px;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:#64748b;transition:.15s;}
    .tab.active,.tab:hover{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.1);}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .filter-bar input,.filter-bar select{padding:7px 11px;border:1.5px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.82rem;background:#fff;color:#0f172a;}
    .filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:#0891b2;}
    /* Board */
    .board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:20px;}
    .permit-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;transition:.15s;border-left:4px solid transparent;}
    .permit-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.12);transform:translateY(-1px);}
    .pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
    .pc-id{font-size:.8rem;font-weight:700;color:#0891b2;}
    .pc-type{font-size:.88rem;font-weight:700;color:#0f172a;margin-bottom:4px;line-height:1.3;}
    .pc-loc{font-size:.78rem;color:#64748b;display:flex;align-items:center;gap:4px;margin-bottom:6px;}
    .pc-date{font-size:.75rem;color:#94a3b8;}
    .pc-requester{font-size:.75rem;color:#64748b;}
    /* Table */
    .ptw-table{width:100%;border-collapse:collapse;font-size:.82rem;}
    .ptw-table th{text-align:left;padding:9px 12px;font-size:.72rem;font-weight:700;color:#64748b;background:#f8fafc;border-bottom:1.5px solid #e2e8f0;white-space:nowrap;}
    .ptw-table td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle;}
    .ptw-table tr:hover td{background:#f8fafc;}
    /* Summary bar */
    .sum-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .sum-chip{background:#fff;border-radius:10px;padding:10px 16px;box-shadow:0 1px 3px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;min-width:90px;}
    .sum-val{font-size:1.6rem;font-weight:900;line-height:1;}
    .sum-lbl{font-size:.68rem;color:#64748b;font-weight:600;margin-top:2px;text-align:center;}
    /* Slide panel */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;}
    .overlay.open{display:block;}
    .panel{position:fixed;top:0;right:0;height:100dvh;width:min(600px,100vw);background:#fff;z-index:201;overflow-y:auto;transform:translateX(100%);transition:.25s cubic-bezier(.4,0,.2,1);}
    .panel.open{transform:none;}
    .panel-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1;}
    .panel-title{font-size:1rem;font-weight:700;color:#0f172a;}
    .panel-body{padding:20px;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
    @media(max-width:600px){.form-row{grid-template-columns:1fr;}}
    .form-row.full{grid-template-columns:1fr;}
    .form-group{display:flex;flex-direction:column;gap:4px;}
    .form-label{font-size:.78rem;font-weight:700;color:#374151;}
    .form-label span{color:#dc2626;}
    .form-input{padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.85rem;color:#0f172a;transition:.15s;}
    .form-input:focus{outline:none;border-color:#0891b2;box-shadow:0 0 0 3px rgba(8,145,178,.1);}
    .section-divider{font-size:.8rem;font-weight:700;color:#475569;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid #e2e8f0;}
    .checklist-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
    @media(max-width:450px){.checklist-grid{grid-template-columns:1fr;}}
    .check-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;cursor:pointer;transition:.1s;}
    .check-item.checked{background:#f0fdf4;border-color:#86efac;}
    .check-item input{margin-top:2px;accent-color:#16a34a;}
    .check-item label{font-size:.8rem;line-height:1.4;cursor:pointer;}
    .ppe-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
    .ppe-btn{padding:5px 10px;border:1.5px solid #e2e8f0;border-radius:20px;font-size:.78rem;font-weight:600;cursor:pointer;background:#fff;color:#475569;transition:.1s;}
    .ppe-btn.active{background:#0891b2;border-color:#0891b2;color:#fff;}
    /* Detail view */
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
    @media(max-width:600px){.detail-grid{grid-template-columns:1fr;}}
    .detail-field{display:flex;flex-direction:column;gap:2px;}
    .detail-label{font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;}
    .detail-val{font-size:.88rem;color:#0f172a;}
    /* Action toolbar */
    .action-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #f1f5f9;}
    .empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
  </style>
  <div class="pw">
    <div class="ph">
      <div class="ph-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        ใบอนุญาตทำงาน (PTW)
      </div>
      <button class="btn btn-primary" onclick="__openCreate()">+ สร้างใบอนุญาต</button>
    </div>

    <div id="sumBar"></div>

    <div class="tab-bar">
      ${[['board','บอร์ดงาน'],['list','รายการทั้งหมด']].map(([v,l])=>
        `<button class="tab ${_view===v?'active':''}" onclick="__setView('${v}')">${l}</button>`).join('')}
    </div>

    <div class="filter-bar">
      <input type="text"   id="fSearch" placeholder="🔍 ค้นหา..." value="${_filterSearch}" oninput="__filter()" style="flex:1;min-width:180px">
      <select id="fStatus" onchange="__filter()">
        <option value="">ทุกสถานะ</option>
        ${Object.entries(PERMIT_STATUS).map(([k,v])=>`<option value="${k}" ${_filterStatus===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
      <select id="fType" onchange="__filter()">
        <option value="">ทุกประเภท</option>
        ${Object.values(PERMIT_TYPES).map(t=>`<option value="${t.key}" ${_filterType===t.key?'selected':''}>${t.icon} ${t.labelTh}</option>`).join('')}
      </select>
    </div>

    <div id="contentArea"></div>
  </div>

  <!-- Overlay + Panel -->
  <div class="overlay" id="overlay" onclick="__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span class="panel-title" id="panelTitle">ใบอนุญาตทำงาน</span>
      <button class="btn btn-ghost btn-sm" onclick="__closePanel()">✕ ปิด</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>`;

  renderSummary();
  renderContentArea();
}

// ── summary bar ───────────────────────────────────────────────────────────
function renderSummary() {
  const active    = _items.filter(i => i.status === 'active').length;
  const pending   = _items.filter(i => i.status === 'pending').length;
  const approved  = _items.filter(i => i.status === 'approved').length;
  const expired   = _items.filter(i => ['active','approved'].includes(i.status) && i.workEndDate && i.workEndDate < TODAY()).length;
  const completed = _items.filter(i => i.status === 'completed').length;
  const bar = [
    { val: active,   lbl: 'กำลังดำเนินงาน', color: '#16a34a' },
    { val: pending,  lbl: 'รออนุมัติ',       color: '#d97706' },
    { val: approved, lbl: 'อนุมัติ (รอเริ่ม)',color: '#0891b2' },
    { val: expired,  lbl: 'หมดอายุ',         color: '#dc2626' },
    { val: completed,lbl: 'เสร็จสิ้น',        color: '#475569' },
  ];
  $('sumBar').innerHTML = `<div class="sum-bar">${bar.map(b=>
    `<div class="sum-chip"><div class="sum-val" style="color:${b.color}">${b.val}</div><div class="sum-lbl">${b.lbl}</div></div>`).join('')}</div>`;
}

// ── content area ──────────────────────────────────────────────────────────
function filtered() {
  let rows = _items;
  if (_filterStatus) rows = rows.filter(r => r.status === _filterStatus);
  if (_filterType)   rows = rows.filter(r => r.permitType === _filterType);
  if (_filterSearch) {
    const q = _filterSearch.toLowerCase();
    rows = rows.filter(r =>
      (r.permitId||'').toLowerCase().includes(q) ||
      (r.workDescription||'').toLowerCase().includes(q) ||
      (r.location||'').toLowerCase().includes(q) ||
      (r.requestedBy||'').toLowerCase().includes(q));
  }
  return rows;
}

function renderContentArea() {
  const rows = filtered();
  const ca = $('contentArea');
  if (!ca) return;
  if (_view === 'board') {
    if (rows.length === 0) { ca.innerHTML = `<div class="empty-state">📋 ไม่มีใบอนุญาตในขณะนี้<br><small>คลิก "+ สร้างใบอนุญาต" เพื่อเริ่มต้น</small></div>`; return; }
    ca.innerHTML = `<div class="board-grid">${rows.map(r => permitCard(r)).join('')}</div>`;
  } else {
    ca.innerHTML = `
    <div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07)">
    <div style="overflow-x:auto">
    <table class="ptw-table">
      <thead><tr>
        <th>เลขที่</th><th>ประเภท</th><th>งาน</th><th>สถานที่</th>
        <th>ผู้ขอ</th><th>วันที่</th><th>สถานะ</th><th></th>
      </tr></thead>
      <tbody>${rows.length === 0 ? `<tr><td colspan="8" class="empty-state">ไม่มีข้อมูล</td></tr>` :
        rows.map(r => `<tr>
          <td><span style="font-weight:700;color:#0891b2">${r.permitId||'—'}</span></td>
          <td>${typeBadge(r.permitType)}</td>
          <td style="max-width:200px"><div style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.workDescription||'—'}</div></td>
          <td style="color:#64748b">${r.location||'—'}</td>
          <td>${r.requestedBy||'—'}</td>
          <td style="white-space:nowrap;color:#64748b">${r.workStartDate||'—'} → ${r.workEndDate||'—'}</td>
          <td>${statusBadge(r.status)}</td>
          <td><button class="btn btn-ghost btn-sm" onclick="__openDetail('${r.id}')">ดู</button></td>
        </tr>`).join('')}
      </tbody>
    </table></div></div>`;
  }
}

function permitCard(r) {
  const pt = PERMIT_TYPES[r.permitType] || { icon: '📋', color: '#94a3b8', labelTh: r.permitType };
  const isExpired = ['active','approved'].includes(r.status) && r.workEndDate && r.workEndDate < TODAY();
  return `
  <div class="permit-card" style="border-left-color:${isExpired?'#dc2626':pt.color}" onclick="__openDetail('${r.id}')">
    <div class="pc-top">
      <div>
        <div class="pc-id">${r.permitId||r.id.slice(0,8)}</div>
        <div class="pc-type">${pt.icon} ${pt.labelTh}</div>
      </div>
      ${statusBadge(r.status)}
    </div>
    <div style="font-size:.85rem;font-weight:600;color:#0f172a;margin-bottom:4px;line-height:1.4">${(r.workDescription||'—').slice(0,60)}${(r.workDescription||'').length>60?'...':''}</div>
    <div class="pc-loc"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>${r.location||'—'}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
      <span class="pc-date">${r.workStartDate||'?'} – ${r.workEndDate||'?'}</span>
      ${daysLeftBadge(r.workEndDate)}
    </div>
    <div class="pc-requester" style="margin-top:4px">ผู้ขอ: ${r.requestedBy||'—'} · ${r.department||''}</div>
  </div>`;
}

// ── open detail ───────────────────────────────────────────────────────────
async function openDetail(id) {
  const r = _items.find(i => i.id === id) || await getPermit(id);
  if (!r) return;
  const pt = PERMIT_TYPES[r.permitType] || { icon:'📋', labelTh: r.permitType, color:'#94a3b8' };
  const checklist = PERMIT_CHECKLISTS[r.permitType] || [];
  const checks = r.checklist || {};
  const ppe    = r.ppe || [];

  const canAct   = canApprove();
  const isPending  = r.status === 'pending';
  const isApproved = r.status === 'approved';
  const isActive   = r.status === 'active';
  const isDone     = ['completed','rejected','cancelled'].includes(r.status);

  $('panelTitle').textContent = `${pt.icon} ${r.permitId || 'ใบอนุญาต'}`;
  $('panelBody').innerHTML = `
    <div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${typeBadge(r.permitType)} ${statusBadge(r.status)} ${daysLeftBadge(r.workEndDate)}
    </div>

    <div class="detail-grid">
      ${[
        ['งาน/กิจกรรม', r.workDescription, true],
        ['สถานที่ปฏิบัติงาน', r.location],
        ['ผู้ขออนุญาต', r.requestedBy],
        ['แผนก', r.department],
        ['บริษัทผู้รับเหมา', r.contractor || '—'],
        ['ผู้ปฏิบัติงาน', r.workers || '—'],
        ['วันเริ่ม', r.workStartDate + ' ' + (r.workStartTime||'')],
        ['วันสิ้นสุด', r.workEndDate + ' ' + (r.workEndTime||'')],
      ].map(([l,v,full])=>
        `<div class="detail-field"${full?' style="grid-column:1/-1"':''}><div class="detail-label">${l}</div><div class="detail-val">${v||'—'}</div></div>`
      ).join('')}
    </div>

    ${r.hazards ? `<div class="detail-field" style="margin-bottom:10px"><div class="detail-label">อันตรายที่ระบุ</div><div class="detail-val" style="white-space:pre-wrap">${r.hazards}</div></div>` : ''}
    ${r.precautions ? `<div class="detail-field" style="margin-bottom:10px"><div class="detail-label">มาตรการป้องกัน</div><div class="detail-val" style="white-space:pre-wrap">${r.precautions}</div></div>` : ''}

    ${checklist.length > 0 ? `
    <div class="section-divider">รายการตรวจสอบก่อนเริ่มงาน</div>
    <div class="checklist-grid">
      ${checklist.map((item,i) => {
        const done = checks[`item_${i}`] === true;
        return `<div class="check-item ${done?'checked':''}">
          <div style="width:16px;height:16px;border:1.5px solid ${done?'#16a34a':'#94a3b8'};border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">${done?'<svg width="10" height="10" viewBox="0 0 12 12"><polyline points="1,6 5,10 11,2" stroke="#16a34a" stroke-width="2" fill="none"/></svg>':''}</div>
          <span style="font-size:.78rem;line-height:1.4;color:${done?'#166534':'#374151'}">${item}</span>
        </div>`;
      }).join('')}
    </div>` : ''}

    ${ppe.length > 0 ? `
    <div class="section-divider">PPE ที่กำหนด</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px">
      ${ppe.map(p=>`<span style="background:#0891b218;color:#0891b2;border-radius:10px;padding:3px 10px;font-size:.75rem;font-weight:600">🦺 ${p}</span>`).join('')}
    </div>` : ''}

    ${r.rejectedReason  ? `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.83rem"><strong>เหตุผลที่ปฏิเสธ:</strong> ${r.rejectedReason}</div>` : ''}
    ${r.cancelReason    ? `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.83rem"><strong>เหตุผลยกเลิก:</strong> ${r.cancelReason}</div>` : ''}
    ${r.closedNotes     ? `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:.83rem"><strong>บันทึกการปิดงาน:</strong> ${r.closedNotes}</div>` : ''}
    ${r.approvedBy      ? `<div style="font-size:.78rem;color:#64748b;margin-bottom:4px">อนุมัติโดย: ${r.approvedBy}</div>` : ''}

    <div class="action-bar">
      ${!isDone && canAct ? `<button class="btn btn-ghost btn-sm" onclick="__openEdit('${r.id}')">✏️ แก้ไข</button>` : ''}
      ${isPending && canAct ? `
        <button class="btn btn-success btn-sm" onclick="__doApprove('${r.id}')">✅ อนุมัติ</button>
        <button class="btn btn-danger btn-sm" onclick="__doReject('${r.id}')">❌ ปฏิเสธ</button>` : ''}
      ${isApproved ? `<button class="btn btn-primary btn-sm" onclick="__doActivate('${r.id}')">▶ เริ่มงาน</button>` : ''}
      ${isActive ? `<button class="btn btn-success btn-sm" onclick="__doClose('${r.id}')">✅ ปิดงาน</button>` : ''}
      ${!isDone ? `<button class="btn btn-ghost btn-sm" onclick="__doCancel('${r.id}')">🚫 ยกเลิก</button>` : ''}
      <button class="btn btn-ghost btn-sm" onclick="__printPermit('${r.id}')">🖨 พิมพ์</button>
    </div>`;
  openPanel('detail');
}

// ── create / edit form ────────────────────────────────────────────────────
function openCreate() {
  _editId = null;
  renderForm(null);
}
async function openEdit(id) {
  _editId = id;
  const r = _items.find(i => i.id === id) || await getPermit(id);
  renderForm(r);
}

function renderForm(r) {
  const isEdit = !!r;
  $('panelTitle').textContent = isEdit ? `✏️ แก้ไข ${r.permitId}` : '➕ สร้างใบอนุญาตทำงาน';

  const pt = r ? r.permitType : 'hot_work';
  const checks = r?.checklist || {};
  const ppe = r?.ppe || [];
  const checklist = PERMIT_CHECKLISTS[pt] || [];

  $('panelBody').innerHTML = `
    <div class="form-row full"><div class="form-group">
      <label class="form-label">ประเภทงาน <span>*</span></label>
      <select class="form-input" id="fPermitType" onchange="__refreshChecklist()">
        ${Object.values(PERMIT_TYPES).map(t=>`<option value="${t.key}" ${pt===t.key?'selected':''}>${t.icon} ${t.labelTh}</option>`).join('')}
      </select>
    </div></div>
    <div class="form-row full"><div class="form-group">
      <label class="form-label">งาน/กิจกรรม <span>*</span></label>
      <input class="form-input" id="fWork" placeholder="อธิบายงานที่จะทำ..." value="${r?.workDescription||''}">
    </div></div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">สถานที่ <span>*</span></label>
        <input class="form-input" id="fLocation" placeholder="จุดปฏิบัติงาน" value="${r?.location||''}">
      </div>
      <div class="form-group">
        <label class="form-label">แผนก</label>
        <input class="form-input" id="fDept" placeholder="แผนก" value="${r?.department||''}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">ผู้ขออนุญาต <span>*</span></label>
        <input class="form-input" id="fRequester" placeholder="ชื่อ-นามสกุล" value="${r?.requestedBy||''}">
      </div>
      <div class="form-group">
        <label class="form-label">บริษัทผู้รับเหมา</label>
        <input class="form-input" id="fContractor" placeholder="(ถ้ามี)" value="${r?.contractor||''}">
      </div>
    </div>
    <div class="form-row full"><div class="form-group">
      <label class="form-label">ผู้ปฏิบัติงาน</label>
      <input class="form-input" id="fWorkers" placeholder="ชื่อผู้ปฏิบัติงานทุกคน" value="${r?.workers||''}">
    </div></div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">วัน-เวลาเริ่มงาน <span>*</span></label>
        <input type="date" class="form-input" id="fStartDate" value="${r?.workStartDate||TODAY()}">
      </div>
      <div class="form-group">
        <label class="form-label">เวลาเริ่ม</label>
        <input type="time" class="form-input" id="fStartTime" value="${r?.workStartTime||'08:00'}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">วัน-เวลาสิ้นสุด <span>*</span></label>
        <input type="date" class="form-input" id="fEndDate" value="${r?.workEndDate||TODAY()}">
      </div>
      <div class="form-group">
        <label class="form-label">เวลาสิ้นสุด</label>
        <input type="time" class="form-input" id="fEndTime" value="${r?.workEndTime||'17:00'}">
      </div>
    </div>
    <div class="form-row full"><div class="form-group">
      <label class="form-label">อันตรายที่ระบุได้</label>
      <textarea class="form-input" id="fHazards" rows="2" placeholder="ระบุอันตรายที่อาจเกิดขึ้น...">${r?.hazards||''}</textarea>
    </div></div>
    <div class="form-row full"><div class="form-group">
      <label class="form-label">มาตรการป้องกัน</label>
      <textarea class="form-input" id="fPrecautions" rows="2" placeholder="มาตรการป้องกันและควบคุมอันตราย...">${r?.precautions||''}</textarea>
    </div></div>

    <div class="section-divider">PPE ที่ต้องใช้</div>
    <div class="ppe-grid" id="ppeGrid">
      ${PPE_OPTIONS.map(p => `<button type="button" class="ppe-btn ${ppe.includes(p)?'active':''}" onclick="__togglePpe(this,'${p}')">${p}</button>`).join('')}
    </div>

    <div class="section-divider" id="clTitle">รายการตรวจสอบก่อนเริ่มงาน</div>
    <div class="checklist-grid" id="clGrid">
      ${renderChecklistItems(checklist, checks)}
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">สถานะ</label>
        <select class="form-input" id="fStatus">
          ${Object.entries(PERMIT_STATUS).map(([k,v])=>`<option value="${k}" ${(r?.status||'draft')===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-primary" onclick="__submitForm(${isEdit})">💾 บันทึก</button>
      <button class="btn btn-ghost" onclick="__closePanel()">ยกเลิก</button>
    </div>`;
  openPanel('form');
}

function renderChecklistItems(checklist, checks) {
  return checklist.map((item,i) => {
    const done = checks[`item_${i}`] === true;
    return `<label class="check-item ${done?'checked':''}" for="cl_${i}">
      <input type="checkbox" id="cl_${i}" ${done?'checked':''} style="accent-color:#16a34a">
      <span style="font-size:.8rem;line-height:1.4">${item}</span>
    </label>`;
  }).join('');
}

window.__refreshChecklist = () => {
  const pt = $('fPermitType')?.value;
  const checklist = PERMIT_CHECKLISTS[pt] || [];
  const cg = $('clGrid');
  if (cg) cg.innerHTML = renderChecklistItems(checklist, {});
};

window.__togglePpe = (btn, name) => btn.classList.toggle('active');

// ── submit form ────────────────────────────────────────────────────────────
window.__submitForm = async (isEdit) => {
  const permitType  = $('fPermitType')?.value;
  const workDescription = $('fWork')?.value?.trim();
  const location        = $('fLocation')?.value?.trim();
  const requestedBy     = $('fRequester')?.value?.trim();
  const workStartDate   = $('fStartDate')?.value;
  const workEndDate     = $('fEndDate')?.value;
  if (!workDescription || !location || !requestedBy || !workStartDate || !workEndDate) {
    alert('กรุณากรอกข้อมูลที่จำเป็น (งาน / สถานที่ / ผู้ขอ / วันที่)'); return;
  }
  const checklist = {};
  PERMIT_CHECKLISTS[permitType]?.forEach((_,i) => {
    checklist[`item_${i}`] = !!$(`cl_${i}`)?.checked;
  });
  const ppe = [...document.querySelectorAll('.ppe-btn.active')].map(b => b.textContent.trim());

  const data = {
    permitType, workDescription, location, requestedBy,
    department:  $('fDept')?.value?.trim()||'',
    contractor:  $('fContractor')?.value?.trim()||'',
    workers:     $('fWorkers')?.value?.trim()||'',
    workStartDate, workEndDate,
    workStartTime: $('fStartTime')?.value||'',
    workEndTime:   $('fEndTime')?.value||'',
    hazards:      $('fHazards')?.value?.trim()||'',
    precautions:  $('fPrecautions')?.value?.trim()||'',
    checklist, ppe,
    status: $('fStatus')?.value || 'draft',
  };

  if (isEdit) {
    await updatePermit(_editId, data);
  } else {
    data.permitId = await generatePermitId();
    await createPermit(data, _profile.uid);
  }
  __closePanel();
  await loadData();
  renderSummary();
  renderContentArea();
};

// ── workflow actions ──────────────────────────────────────────────────────
window.__doApprove = async id => {
  if (!confirm('ยืนยันการอนุมัติใบอนุญาตนี้?')) return;
  await approvePermit(id, _profile.displayName || _profile.email);
  await loadData(); renderSummary(); renderContentArea(); __closePanel();
};
window.__doReject = async id => {
  const reason = prompt('ระบุเหตุผลที่ปฏิเสธ:');
  if (reason === null) return;
  await rejectPermit(id, _profile.displayName || _profile.email, reason);
  await loadData(); renderSummary(); renderContentArea(); __closePanel();
};
window.__doActivate = async id => {
  if (!confirm('เริ่มต้นงานตามใบอนุญาตนี้?')) return;
  await activatePermit(id);
  await loadData(); renderSummary(); renderContentArea(); __closePanel();
};
window.__doClose = async id => {
  const notes = prompt('บันทึกการปิดงาน (สรุปผล/ข้อสังเกต):') || '';
  await closePermit(id, _profile.displayName || _profile.email, notes);
  await loadData(); renderSummary(); renderContentArea(); __closePanel();
};
window.__doCancel = async id => {
  const reason = prompt('ระบุเหตุผลยกเลิก:');
  if (reason === null) return;
  await cancelPermit(id, reason);
  await loadData(); renderSummary(); renderContentArea(); __closePanel();
};

// ── print permit ──────────────────────────────────────────────────────────
window.__printPermit = async id => {
  const r = _items.find(i => i.id === id) || await getPermit(id);
  if (!r) return;
  const pt = PERMIT_TYPES[r.permitType] || { icon:'📋', labelTh: r.permitType, color:'#94a3b8' };
  const checklist = PERMIT_CHECKLISTS[r.permitType] || [];
  const checks = r.checklist || {};
  const ppe    = r.ppe || [];
  const today  = new Date().toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });

  const pa = $('printArea');
  pa.style.display = 'block';
  pa.innerHTML = `
  <div class="ptw-header">
    <div class="ptw-doc-title">ใบอนุญาตทำงาน (Work Permit)</div>
    <div class="ptw-doc-sub">${pt.icon} ${pt.labelTh} &nbsp;|&nbsp; เลขที่: ${r.permitId||'—'} &nbsp;|&nbsp; <span class="ptw-badge-print">${PERMIT_STATUS[r.status]?.label||r.status}</span></div>
  </div>
  <div class="ptw-row">
    <div class="ptw-field"><div class="ptw-label">งาน/กิจกรรม</div><div class="ptw-val">${r.workDescription||'—'}</div></div>
  </div>
  <div class="ptw-row">
    <div class="ptw-field"><div class="ptw-label">สถานที่</div><div class="ptw-val">${r.location||'—'}</div></div>
    <div class="ptw-field"><div class="ptw-label">แผนก</div><div class="ptw-val">${r.department||'—'}</div></div>
  </div>
  <div class="ptw-row">
    <div class="ptw-field"><div class="ptw-label">ผู้ขออนุญาต</div><div class="ptw-val">${r.requestedBy||'—'}</div></div>
    <div class="ptw-field"><div class="ptw-label">บริษัทผู้รับเหมา</div><div class="ptw-val">${r.contractor||'—'}</div></div>
  </div>
  <div class="ptw-row">
    <div class="ptw-field"><div class="ptw-label">ผู้ปฏิบัติงาน</div><div class="ptw-val">${r.workers||'—'}</div></div>
  </div>
  <div class="ptw-row">
    <div class="ptw-field"><div class="ptw-label">วัน-เวลาเริ่มงาน</div><div class="ptw-val">${r.workStartDate||'—'} เวลา ${r.workStartTime||'—'} น.</div></div>
    <div class="ptw-field"><div class="ptw-label">วัน-เวลาสิ้นสุด</div><div class="ptw-val">${r.workEndDate||'—'} เวลา ${r.workEndTime||'—'} น.</div></div>
  </div>

  <div class="ptw-section">
    <div class="ptw-sec-title">อันตรายที่ระบุ / มาตรการป้องกัน</div>
    <div class="ptw-row">
      <div class="ptw-field"><div class="ptw-label">อันตราย</div><div class="ptw-val" style="min-height:28pt">${r.hazards||'—'}</div></div>
      <div class="ptw-field"><div class="ptw-label">มาตรการป้องกัน</div><div class="ptw-val" style="min-height:28pt">${r.precautions||'—'}</div></div>
    </div>
  </div>

  ${checklist.length > 0 ? `
  <div class="ptw-section">
    <div class="ptw-sec-title">รายการตรวจสอบก่อนเริ่มงาน</div>
    <div class="ptw-check-grid">
      ${checklist.map((item,i) => {
        const done = checks[`item_${i}`] === true;
        return `<div class="ptw-check-item"><div class="ptw-box">${done?'✓':''}</div><span>${item}</span></div>`;
      }).join('')}
    </div>
  </div>` : ''}

  ${ppe.length > 0 ? `
  <div class="ptw-section">
    <div class="ptw-sec-title">PPE ที่กำหนด</div>
    <div style="font-size:9pt">${ppe.join(' · ')}</div>
  </div>` : ''}

  <div class="ptw-sign-row">
    ${[
      [`ผู้ขออนุญาต\n${r.requestedBy||'.........................'}`,'............................\n(ลายเซ็น/วันที่)'],
      [`ผู้อนุมัติ\n${r.approvedBy||'.........................'}`,'............................\n(ลายเซ็น/วันที่)'],
      ['จป. วิชาชีพ','............................\n(ลายเซ็น/วันที่)'],
    ].map(([title,sub])=>`
    <div class="ptw-sign-blk">
      <div class="ptw-sign-line">${title}\n${sub}</div>
    </div>`).join('')}
  </div>`;

  window.print();
  setTimeout(() => { pa.style.display = 'none'; pa.innerHTML = ''; }, 1000);
};

// ── panel helpers ─────────────────────────────────────────────────────────
function openPanel(type) {
  $('overlay').classList.add('open');
  setTimeout(() => $('panel').classList.add('open'), 10);
}
window.__closePanel = () => {
  $('panel').classList.remove('open');
  $('overlay').classList.remove('open');
};

// ── global controls ───────────────────────────────────────────────────────
window.__setView = v => { _view = v; renderContent(); };
window.__filter = () => {
  _filterSearch = $('fSearch')?.value || '';
  _filterStatus = $('fStatus')?.value || '';
  _filterType   = $('fType')?.value   || '';
  renderContentArea();
};
window.__openCreate = openCreate;
window.__openEdit   = openEdit;
window.__openDetail = openDetail;

// ── boot ──────────────────────────────────────────────────────────────────
_profile = await requireRole(['safety_officer','kpo','admin','manager']);
renderShell(_profile, 'safety-ptw', 'ใบอนุญาตทำงาน (PTW)');
await loadData();
renderContent();
</script>
</body>
</html>
