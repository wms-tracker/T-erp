<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ใบอนุญาตทำงาน (PTW) — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-warning{background:#d97706;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-bar select,.search-bar input{flex:1;min-width:120px}
.info-row{display:flex;gap:12px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:8px 0}
.type-card{border:2px solid #e5e7eb;border-radius:8px;padding:8px 12px;cursor:pointer;transition:all .15s;text-align:center}
.type-card.sel{border-width:2.5px}
.checklist-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid #f3f4f6;font-size:0.85rem}
.checklist-row input[type=checkbox]{width:16px;height:16px;margin:2px 0 0;flex-shrink:0}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  PTW_TYPES, PTW_STATUS, PTW_RISK_LEVELS,
  listPTW, getPTW, createPTW, updatePTW, deletePTW
} from "./js/safety-data.js";
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-ptw', 'ใบอนุญาตทำงาน (PTW)');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';
const badge   = (st) => {
  const s = PTW_STATUS[st] || PTW_STATUS.draft;
  return `<span class="badge" style="color:${s.color};background:${s.bg}">${s.label}</span>`;
};
const riskBadge = (r) => {
  const rl = PTW_RISK_LEVELS[r];
  if (!rl) return '';
  return `<span class="badge" style="color:${rl.color};background:${rl.bg}">${rl.label}</span>`;
};

const PTW_CHECKLIST = [
  'ประเมินความเสี่ยงก่อนทำงานเรียบร้อยแล้ว',
  'กำหนด exclusion zone และติดป้ายเตือนแล้ว',
  'แจ้งทีมงานและผู้เกี่ยวข้องทราบแล้ว',
  'เตรียมอุปกรณ์ PPE ครบตามที่กำหนด',
  'เตรียมอุปกรณ์ดับเพลิงและ first aid พร้อมแล้ว',
  'ตรวจสอบสภาพบรรยากาศ (อากาศ, แก๊ส) แล้ว',
  'กำหนด emergency escape route แล้ว',
  'สื่อสาร standby person / fire watch แล้ว',
];

let records = [];
let editId  = null;
let selType = '';

async function render() {
  records = await listPTW();
  const statusFilter = document.getElementById('filter-status')?.value || '';
  const typeFilter   = document.getElementById('filter-type')?.value || '';
  const q            = document.getElementById('search-input')?.value.toLowerCase() || '';

  const stats = {};
  Object.keys(PTW_STATUS).forEach(k=>stats[k]=0);
  records.forEach(r=>{ if(stats[r.status]!==undefined) stats[r.status]++; });

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">📋 ใบอนุญาตทำงาน (PTW)</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ ขอใบอนุญาต</button>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${records.length}</div><div class="kpi-label">ทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${stats.pending||0}</div><div class="kpi-label">รออนุมัติ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${stats.active||0}</div><div class="kpi-label">กำลังทำงาน</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#2563eb">${stats.approved||0}</div><div class="kpi-label">อนุมัติแล้ว</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${(stats.rejected||0)+(stats.expired||0)}</div><div class="kpi-label">ปฏิเสธ/หมดอายุ</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหางาน, ผู้ขอ..." oninput="window.__applyFilter()"/>
    <select id="filter-status" onchange="window.__applyFilter()">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(PTW_STATUS).map(([k,v])=>`<option value="${k}" ${statusFilter===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
    <select id="filter-type" onchange="window.__applyFilter()">
      <option value="">ทุกประเภท</option>
      ${PTW_TYPES.map(t=>`<option value="${t.key}" ${typeFilter===t.key?'selected':''}>${t.icon} ${t.label}</option>`).join('')}
    </select>
  </div>

  <div id="list-wrap">${renderList(applyFilter(records, q, statusFilter, typeFilter))}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">ใบอนุญาตทำงาน</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function applyFilter(list, q, status, type) {
  return list.filter(r => {
    const matchQ = !q || (r.workDescription||'').toLowerCase().includes(q) || (r.requestedBy||'').toLowerCase().includes(q) || (r.location||'').toLowerCase().includes(q);
    const matchS = !status || r.status===status;
    const matchT = !type   || r.ptwType===type;
    return matchQ && matchS && matchT;
  });
}

window.__applyFilter = () => {
  const q  = document.getElementById('search-input')?.value.toLowerCase()||'';
  const s  = document.getElementById('filter-status')?.value||'';
  const t  = document.getElementById('filter-type')?.value||'';
  document.getElementById('list-wrap').innerHTML = renderList(applyFilter(records, q, s, t));
};

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ไม่พบใบอนุญาต</p>`;
  return list.map(r => {
    const tp = PTW_TYPES.find(t=>t.key===r.ptwType);
    return `
    <div class="card" onclick="window.__openView('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:0.95rem">${tp?tp.icon:''} ${esc(r.workDescription||'-')}</div>
          <div class="info-row">
            <span>📍 ${esc(r.location||'-')}</span>
            <span>👤 ${esc(r.requestedBy||'-')}</span>
            <span>📅 ${fmtDate(r.workDate)}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${badge(r.status)}
          ${riskBadge(r.riskLevel)}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── view ──────────────────────────────────────────────────────────────────────
window.__openView = async (id) => {
  editId = id;
  const r = await getPTW(id);
  if (!r) return;
  const tp = PTW_TYPES.find(t=>t.key===r.ptwType);
  openPanel('รายละเอียดใบอนุญาต');
  document.getElementById('panel-body').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
      <span style="font-size:2rem">${tp?.icon||'📋'}</span>
      <div>
        <div style="font-weight:800;font-size:1rem">${esc(r.workDescription||'-')}</div>
        <div style="font-size:0.82rem;color:#6b7280">${esc(tp?.label||'-')} · ${fmtDate(r.workDate)}</div>
      </div>
      ${badge(r.status)}
    </div>
    <div class="form-row" style="margin-bottom:12px">
      <div><div class="lbl" style="margin-top:0">สถานที่</div><div>${esc(r.location||'-')}</div></div>
      <div><div class="lbl" style="margin-top:0">ระดับความเสี่ยง</div><div>${riskBadge(r.riskLevel)}</div></div>
      <div><div class="lbl">ผู้ขออนุญาต</div><div>${esc(r.requestedBy||'-')}</div></div>
      <div><div class="lbl">แผนก/บริษัท</div><div>${esc(r.department||'-')}</div></div>
      <div><div class="lbl">วันที่ทำงาน</div><div>${fmtDate(r.workDate)}</div></div>
      <div><div class="lbl">เวลา</div><div>${esc(r.startTime||'-')} – ${esc(r.endTime||'-')}</div></div>
    </div>
    ${r.equipmentTools ? `<div><div class="lbl" style="margin-top:0">เครื่องมือ/อุปกรณ์ที่ใช้</div><div style="font-size:0.85rem">${esc(r.equipmentTools)}</div></div>` : ''}
    ${r.ppeRequired ? `<div style="margin-top:8px"><div class="lbl" style="margin-top:0">PPE ที่กำหนด</div><div style="font-size:0.85rem">${esc(r.ppeRequired)}</div></div>` : ''}
    ${r.precautions ? `<div style="margin-top:8px"><div class="lbl" style="margin-top:0">มาตรการควบคุม</div><div style="font-size:0.85rem">${esc(r.precautions)}</div></div>` : ''}
    ${r.checklistItems && r.checklistItems.length ? `
    <div class="section-title">Checklist ก่อนเริ่มงาน</div>
    ${PTW_CHECKLIST.map((item,i)=>`
      <div class="checklist-row">
        <span style="color:${r.checklistItems[i]?'#16a34a':'#9ca3af'};font-size:1.1rem">${r.checklistItems[i]?'✓':'○'}</span>
        <span style="color:${r.checklistItems[i]?'#374151':'#9ca3af'}">${esc(item)}</span>
      </div>`).join('')}` : ''}
    ${r.approvedBy ? `<div style="margin-top:12px;padding:10px;background:#f0fdf4;border-radius:8px;font-size:0.85rem"><strong>✓ อนุมัติโดย:</strong> ${esc(r.approvedBy)}</div>` : ''}
    ${r.rejectedReason ? `<div style="margin-top:12px;padding:10px;background:#fef2f2;border-radius:8px;font-size:0.85rem"><strong>✗ เหตุผลที่ไม่อนุมัติ:</strong> ${esc(r.rejectedReason)}</div>` : ''}`;

  const footer = document.getElementById('panel-footer');
  footer.innerHTML = '';
  if (r.status==='pending') {
    footer.innerHTML = `
      <button class="btn btn-success" onclick="window.__approve('${id}')">อนุมัติ</button>
      <button class="btn btn-danger" onclick="window.__reject('${id}')">ไม่อนุมัติ</button>`;
  }
  if (r.status==='approved') {
    footer.innerHTML += `<button class="btn btn-primary" onclick="window.__activate('${id}')">เริ่มงาน (Activate)</button>`;
  }
  if (r.status==='active') {
    footer.innerHTML += `<button class="btn btn-success" onclick="window.__complete('${id}')">ปิดงาน (Complete)</button>`;
  }
  if (['draft','pending'].includes(r.status)) {
    footer.innerHTML += `<button class="btn btn-ghost" onclick="window.__editPTW('${id}')">แก้ไข</button>`;
  }
  footer.innerHTML += `
    <button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
    <button class="btn btn-ghost" onclick="window.__closePanel()">ปิด</button>`;
};

// ── form ──────────────────────────────────────────────────────────────────────
window.__openPanel = (id) => {
  editId  = id;
  selType = '';
  openPanel(id ? 'แก้ไขใบอนุญาต' : 'ขอใบอนุญาตทำงาน');
  document.getElementById('panel-body').innerHTML = renderForm(null);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-warning" onclick="window.__saveSubmit()">บันทึก + ส่งอนุมัติ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

window.__editPTW = async (id) => {
  editId = id;
  const r = await getPTW(id);
  if (!r) return;
  selType = r.ptwType||'';
  openPanel('แก้ไขใบอนุญาต');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderForm(r) {
  return `
  <div class="section-title" style="margin-top:0">ประเภทงาน *</div>
  <div class="type-grid">
    ${PTW_TYPES.map(t=>`
      <div class="type-card ${(selType||r?.ptwType)===t.key?'sel':''}"
           id="tc-${t.key}"
           style="${(selType||r?.ptwType)===t.key?`border-color:${t.color};background:${t.color}18`:''}"
           onclick="window.__selType('${t.key}','${t.color}')">
        <div style="font-size:1.5rem">${t.icon}</div>
        <div style="font-size:0.78rem;font-weight:600;color:${t.color}">${t.label.split(' (')[0]}</div>
      </div>`).join('')}
  </div>
  <div class="form-row">
    <div style="grid-column:1/-1">
      <label class="lbl">รายละเอียดงาน *</label>
      <textarea id="f-desc" rows="2" placeholder="อธิบายงานที่จะทำ">${esc(r?.workDescription||'')}</textarea>
    </div>
    <div>
      <label class="lbl">สถานที่/พื้นที่ทำงาน *</label>
      <input id="f-loc" value="${esc(r?.location||'')}" placeholder="เช่น Line 3, คลังสินค้า A"/>
    </div>
    <div>
      <label class="lbl">ระดับความเสี่ยง</label>
      <select id="f-risk">
        ${Object.entries(PTW_RISK_LEVELS).map(([k,v])=>`<option value="${k}" ${r?.riskLevel===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">ผู้ขออนุญาต *</label>
      <input id="f-req" value="${esc(r?.requestedBy||profile.displayName||'')}" placeholder="ชื่อผู้ขอ"/>
    </div>
    <div>
      <label class="lbl">แผนก/บริษัทผู้รับเหมา</label>
      <input id="f-dept" value="${esc(r?.department||'')}" placeholder="แผนก"/>
    </div>
    <div>
      <label class="lbl">วันที่ทำงาน *</label>
      <input id="f-date" type="date" value="${r?.workDate||''}"/>
    </div>
    <div>
      <label class="lbl">เวลาเริ่ม – สิ้นสุด</label>
      <div style="display:flex;gap:6px">
        <input id="f-start" type="time" value="${r?.startTime||''}" style="flex:1"/>
        <input id="f-end"   type="time" value="${r?.endTime||''}"   style="flex:1"/>
      </div>
    </div>
    <div style="grid-column:1/-1">
      <label class="lbl">เครื่องมือ/อุปกรณ์ที่ใช้</label>
      <input id="f-equip" value="${esc(r?.equipmentTools||'')}" placeholder="เช่น เครื่องเชื่อม, Angle grinder"/>
    </div>
    <div style="grid-column:1/-1">
      <label class="lbl">PPE ที่กำหนด</label>
      <input id="f-ppe" value="${esc(r?.ppeRequired||'')}" placeholder="เช่น หน้ากาก, ถุงมือกันความร้อน, Safety harness"/>
    </div>
    <div style="grid-column:1/-1">
      <label class="lbl">มาตรการควบคุม/ข้อควรระวัง</label>
      <textarea id="f-prec">${esc(r?.precautions||'')}</textarea>
    </div>
  </div>
  <div class="section-title">Checklist ก่อนเริ่มงาน</div>
  ${PTW_CHECKLIST.map((item,i)=>`
    <div class="checklist-row">
      <input type="checkbox" id="chk-${i}" ${r?.checklistItems?.[i]?'checked':''}/>
      <label for="chk-${i}" style="cursor:pointer">${esc(item)}</label>
    </div>`).join('')}`;
}

window.__selType = (key, color) => {
  selType = key;
  PTW_TYPES.forEach(t => {
    const el = document.getElementById(`tc-${t.key}`);
    if (!el) return;
    if (t.key===key) { el.classList.add('sel'); el.style.borderColor=color; el.style.background=color+'18'; }
    else { el.classList.remove('sel'); el.style.borderColor=''; el.style.background=''; }
  });
};

async function saveRecord(submitForApproval) {
  const ptwType = selType;
  if (!ptwType) { alert('กรุณาเลือกประเภทงาน'); return; }
  const workDescription = document.getElementById('f-desc')?.value.trim();
  const location        = document.getElementById('f-loc')?.value.trim();
  const requestedBy     = document.getElementById('f-req')?.value.trim();
  const workDate        = document.getElementById('f-date')?.value;
  if (!workDescription || !location || !requestedBy || !workDate) {
    alert('กรุณากรอกข้อมูลที่จำเป็น: รายละเอียดงาน, สถานที่, ผู้ขออนุญาต, วันที่');
    return;
  }
  const checklistItems = PTW_CHECKLIST.map((_,i) => document.getElementById(`chk-${i}`)?.checked||false);
  const data = {
    ptwType, workDescription, location, requestedBy,
    department:    document.getElementById('f-dept')?.value.trim()||'',
    riskLevel:     document.getElementById('f-risk')?.value||'low',
    workDate,
    startTime:     document.getElementById('f-start')?.value||'',
    endTime:       document.getElementById('f-end')?.value||'',
    equipmentTools:document.getElementById('f-equip')?.value.trim()||'',
    ppeRequired:   document.getElementById('f-ppe')?.value.trim()||'',
    precautions:   document.getElementById('f-prec')?.value.trim()||'',
    checklistItems,
    status:        submitForApproval ? 'pending' : (editId ? undefined : 'draft'),
  };
  if (!data.status) delete data.status;
  try {
    if (editId) await updatePTW(editId, data);
    else await createPTW(data, profile.uid);
    window.__closePanel();
    await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
}

window.__save       = () => saveRecord(false);
window.__saveSubmit = () => saveRecord(true);

window.__approve = async (id) => {
  const by = prompt('ชื่อผู้อนุมัติ:');
  if (!by) return;
  await updatePTW(id, { status:'approved', approvedBy:by });
  window.__closePanel(); await render();
};
window.__reject = async (id) => {
  const reason = prompt('เหตุผลที่ไม่อนุมัติ:');
  if (reason===null) return;
  await updatePTW(id, { status:'rejected', rejectedReason:reason });
  window.__closePanel(); await render();
};
window.__activate = async (id) => {
  await updatePTW(id, { status:'active', activatedAt: new Date().toISOString() });
  window.__closePanel(); await render();
};
window.__complete = async (id) => {
  await updatePTW(id, { status:'completed', completedAt: new Date().toISOString() });
  window.__closePanel(); await render();
};
window.__del = async (id) => {
  if (!confirm('ยืนยันลบใบอนุญาตนี้?')) return;
  await deletePTW(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
