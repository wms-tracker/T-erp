<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บันทึกอุบัติเหตุ — KPO Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b;">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listIncidents, getIncident, createIncident, updateIncident, deleteIncident,
  INCIDENT_TYPES, INCIDENT_STATUS, DEPARTMENTS, BODY_PARTS, INJURY_NATURES
} from "./js/safety-data.js";

// ─── helpers ────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmtDate = s => s || '—';
function badge(val, map) {
  const m = map[val] || { label: val, color: '#64748b', bg: '#f1f5f9' };
  return `<span class="badge" style="background:${m.bg||'#f1f5f9'};color:${m.color}">${m.label||m.labelTh}</span>`;
}

let _profile, _rows = [], _activeId = null;

// ─── filter state ──────────────────────────────────────────────────────
const F = { type: '', status: '', dept: '', q: '', page: 0, pageSize: 20 };

function applyFilters(rows) {
  let r = [...rows];
  if (F.type)   r = r.filter(x => x.incidentType === F.type);
  if (F.status) r = r.filter(x => x.status === F.status);
  if (F.dept)   r = r.filter(x => x.department === F.dept);
  if (F.q) {
    const q = F.q.toLowerCase();
    r = r.filter(x => (x.incidentId||'').toLowerCase().includes(q)
      || (x.description||'').toLowerCase().includes(q)
      || (x.location||'').toLowerCase().includes(q)
      || (x.injuredPerson||'').toLowerCase().includes(q));
  }
  return r;
}

}

// ─── table render ──────────────────────────────────────────────────────
function renderTable() {
  const filtered = applyFilters(_rows);
  const total = filtered.length;
  const pages = Math.ceil(total / F.pageSize) || 1;
  if (F.page >= pages) F.page = pages - 1;
  const slice = filtered.slice(F.page * F.pageSize, (F.page + 1) * F.pageSize);

  $('rowCount').textContent = `${total} รายการ`;

  if (filtered.length === 0) {
    $('tblWrap').innerHTML = `<div class="empty-state"><div style="font-size:2.5rem">📋</div><div style="margin-top:8px">ยังไม่มีข้อมูลเหตุการณ์</div><div style="margin-top:4px;font-size:.8rem">กดปุ่ม "บันทึกเหตุการณ์ใหม่" เพื่อเพิ่มข้อมูลแรก</div></div>`;
    $('pager').innerHTML = '';
    return;
  }

  $('tblWrap').innerHTML = `
  <table class="tbl">
    <thead><tr>
      <th>หมายเลข</th><th>วันที่-เวลา</th><th>ประเภท</th><th>แผนก/สถานที่</th>
      <th>ผู้ประสบเหตุ</th><th>รายละเอียด</th><th>สถานะ</th>
    </tr></thead>
    <tbody>
    ${slice.map(r => {
      const t = INCIDENT_TYPES[r.incidentType] || { labelTh: r.incidentType, color: '#64748b', bg: '#f1f5f9' };
      const s = INCIDENT_STATUS[r.status]       || { label: r.status, color: '#64748b', bg: '#f1f5f9' };
      return `<tr onclick="__openDetail('${r.id}')">
        <td><span class="incid-id">${r.incidentId||r.id.slice(0,8)}</span></td>
        <td>${r.incidentDate||'—'} ${r.incidentTime||''}</td>
        <td><span class="badge" style="background:${t.bg};color:${t.color}">${t.labelTh}</span></td>
        <td><div style="font-size:.82rem;font-weight:600">${r.department||'—'}</div><div style="font-size:.75rem;color:#94a3b8">${r.location||''}</div></td>
        <td>${r.injuredPerson||'—'}</td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.description||'—'}</td>
        <td><span class="badge" style="background:${s.bg||'#f1f5f9'};color:${s.color}">${s.label}</span></td>
      </tr>`;
    }).join('')}
    </tbody>
  </table>`;

  // Pagination
  $('pager').innerHTML = `
    <span>${F.page*F.pageSize+1}–${Math.min((F.page+1)*F.pageSize,total)} / ${total}</span>
    <button onclick="__page(-1)" ${F.page===0?'disabled':''}>‹ ก่อนหน้า</button>
    <button onclick="__page(1)"  ${F.page>=pages-1?'disabled':''}>ถัดไป ›</button>`;
}

// ─── create form ───────────────────────────────────────────────────────
function openCreateForm() {
  _activeId = null;
  $('modalTitle').textContent = 'บันทึกเหตุการณ์ใหม่';
  $('modalBody').innerHTML = createFormHTML({});
  $('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__closeModal(null)">ยกเลิก</button>
    <button class="btn btn-primary" onclick="__submitCreate()">บันทึกเหตุการณ์</button>`;
  $('modalBg').style.display = 'flex';
}

// ─── detail view ───────────────────────────────────────────────────────
async function openDetail(id) {
  _activeId = id;
  $('modalTitle').textContent = 'รายละเอียดเหตุการณ์';
  $('modalBody').innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8">กำลังโหลด...</div>`;
  $('modalBg').style.display = 'flex';

  const r = await getIncident(id);
  if (!r) { $('modalBody').innerHTML = '<div style="padding:20px;color:#dc2626">ไม่พบข้อมูล</div>'; return; }

  const t = INCIDENT_TYPES[r.incidentType] || { labelTh: r.incidentType, color: '#64748b', bg: '#f1f5f9' };
  const s = INCIDENT_STATUS[r.status]       || { label: r.status, color: '#64748b', bg: '#f1f5f9' };

  const STATUS_ORDER = ['draft','submitted','investigating','pending_approval','corrective_action','closed'];
  const currentIdx = STATUS_ORDER.indexOf(r.status);

  $('modalBody').innerHTML = `
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
    <span style="font-size:1.05rem;font-weight:800;color:#1e40af">${r.incidentId||id.slice(0,8)}</span>
    <span class="badge" style="background:${t.bg};color:${t.color};font-size:.8rem">${t.labelTh}</span>
    <span class="badge" style="background:${s.bg||'#f1f5f9'};color:${s.color};font-size:.8rem">${s.label}</span>
  </div>

  <div class="form-section">ข้อมูลเหตุการณ์</div>
  <div class="detail-grid">
    <div class="detail-row"><div class="detail-label">วันที่</div><div class="detail-val">${r.incidentDate||'—'} ${r.incidentTime||''}</div></div>
    <div class="detail-row"><div class="detail-label">แผนก</div><div class="detail-val">${r.department||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">สถานที่</div><div class="detail-val">${r.location||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">ผู้รายงาน</div><div class="detail-val">${r.witness||r.createdBy||'—'}</div></div>
  </div>

  <div class="form-group" style="margin-top:12px">
    <div class="form-label">รายละเอียด</div>
    <div style="background:#f8fafc;border-radius:8px;padding:10px 14px;font-size:.85rem;color:#1e293b;line-height:1.6">${r.description||'—'}</div>
  </div>

  ${r.injuredPerson ? `
  <div class="form-section">ผู้ประสบเหตุ</div>
  <div class="detail-grid">
    <div class="detail-row"><div class="detail-label">ชื่อ</div><div class="detail-val">${r.injuredPerson}</div></div>
    <div class="detail-row"><div class="detail-label">ตำแหน่ง</div><div class="detail-val">${r.position||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">ลักษณะบาดเจ็บ</div><div class="detail-val">${r.injuryNature||'—'}</div></div>
    <div class="detail-row"><div class="detail-label">อวัยวะ</div><div class="detail-val">${r.bodyPart||'—'}</div></div>
  </div>` : ''}

  ${r.immediateAction ? `
  <div class="form-group" style="margin-top:12px">
    <div class="form-label">มาตรการแก้ไขเบื้องต้น</div>
    <div style="background:#f0fdf4;border-radius:8px;padding:10px 14px;font-size:.85rem;color:#1e293b;line-height:1.6">${r.immediateAction}</div>
  </div>` : ''}

  <div class="form-section">สถานะการดำเนินการ</div>
  <div class="status-timeline">
  ${STATUS_ORDER.map((st, i) => {
    const sm = INCIDENT_STATUS[st] || { label: st, color: '#64748b' };
    const isDone = i < currentIdx;
    const isActive = i === currentIdx;
    return `<div class="status-step ${isDone?'done':''} ${isActive?'active':''}">
      <div class="status-dot" style="background:${isActive?s.color:isDone?'#16a34a':'#e2e8f0'}"></div>
      <div class="status-step-label">${sm.label}</div>
    </div>`;
  }).join('')}
  </div>

  <div class="form-section">อัปเดตสถานะ</div>
  <div class="workflow-row">
    ${r.status !== 'investigating' ? `<button class="workflow-btn primary" onclick="__updateStatus('${id}','investigating')">เริ่มสอบสวน</button>` : ''}
    ${r.status === 'investigating'  ? `<button class="workflow-btn primary" onclick="__updateStatus('${id}','pending_approval')">ส่งอนุมัติ</button>` : ''}
    ${r.status === 'pending_approval' ? `<button class="workflow-btn primary" onclick="__updateStatus('${id}','corrective_action')">อนุมัติ → ดำเนินการแก้ไข</button>` : ''}
    ${r.status === 'corrective_action' ? `<button class="workflow-btn primary" onclick="__updateStatus('${id}','closed')">ปิดเคส</button>` : ''}
    ${r.status !== 'closed' ? `<button class="workflow-btn" onclick="__openEdit('${id}')">แก้ไขข้อมูล</button>` : ''}
  </div>`;

  $('modalFoot').innerHTML = `
    <button class="btn btn-danger" onclick="__deleteIncident('${id}')" style="margin-right:auto">🗑 ลบ</button>
    <button class="btn btn-ghost" onclick="__closeModal(null)">ปิด</button>`;
}

// ─── edit form ─────────────────────────────────────────────────────────
async function openEdit(id) {
  _activeId = id;
  const r = await getIncident(id);
  if (!r) return;
  $('modalTitle').textContent = 'แก้ไขข้อมูลเหตุการณ์';
  $('modalBody').innerHTML = createFormHTML(r);
  $('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__openDetail('${id}')">ยกเลิก</button>
    <button class="btn btn-primary" onclick="__submitEdit('${id}')">บันทึกการแก้ไข</button>`;
}

// ─── submit handlers ───────────────────────────────────────────────────
async function submitCreate() {
  const d = collectForm();
  if (!d) return;
  const btn = $('modalFoot').querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    await createIncident(d, _profile.uid);
    _rows = await listIncidents({ lim: 200 });
    renderTable();
    closeModal(null);
    showToast('บันทึกเหตุการณ์เรียบร้อยแล้ว ✓', '#16a34a');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'บันทึกเหตุการณ์';
    showToast('เกิดข้อผิดพลาด: ' + e.message, '#dc2626');
  }
}

async function submitEdit(id) {
  const d = collectForm();
  if (!d) return;
  const btn = $('modalFoot').querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    await updateIncident(id, d);
    _rows = await listIncidents({ lim: 200 });
    renderTable();
    openDetail(id);
    showToast('แก้ไขข้อมูลเรียบร้อยแล้ว ✓', '#16a34a');
  } catch (e) {
    btn.disabled = false; btn.textContent = 'บันทึกการแก้ไข';
    showToast('เกิดข้อผิดพลาด: ' + e.message, '#dc2626');
  }
}

async function updateStatus(id, newStatus) {
  try {
    await updateIncident(id, { status: newStatus });
    _rows = await listIncidents({ lim: 200 });
    renderTable();
    openDetail(id);
    showToast(`อัปเดตสถานะ: ${INCIDENT_STATUS[newStatus]?.label} ✓`, '#16a34a');
  } catch (e) {
    showToast('เกิดข้อผิดพลาด: ' + e.message, '#dc2626');
  }
}

function collectForm() {
  const required = ['fIncidentDate','fIncidentTime','fIncidentType','fDepartment','fLocation','fDescription'];
  for (const id of required) {
    if (!$(id)?.value?.trim()) {
      showToast('กรุณากรอกข้อมูลให้ครบ (ช่องที่มี *)', '#dc2626');
      $(id)?.focus();
      return null;
    }
  }
  return {
    incidentDate:    $('fIncidentDate').value,
    incidentTime:    $('fIncidentTime').value,
    incidentType:    $('fIncidentType').value,
    department:      $('fDepartment').value,
    location:        $('fLocation').value.trim(),
    description:     $('fDescription').value.trim(),
    injuredPerson:   $('fInjuredPerson').value.trim(),
    position:        $('fPosition').value.trim(),
    injuryNature:    $('fInjuryNature').value,
    bodyPart:        $('fBodyPart').value,
    immediateAction: $('fImmediateAction').value.trim(),
    witness:         $('fWitness').value.trim(),
  };
}

// ─── toast ─────────────────────────────────────────────────────────────
function showToast(msg, color = '#16a34a') {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:24px;right:24px;background:${color};color:#fff;padding:12px 20px;border-radius:10px;font-family:Sarabun,sans-serif;font-size:.85rem;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:320px`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function closeModal(e) {
  if (e && e.target !== $('modalBg')) return;
  $('modalBg').style.display = 'none';
  _activeId = null;
}

// ─── global helpers ────────────────────────────────────────────────────
window.__filter = () => {
  F.type   = $('fType')?.value   || '';
  F.status = $('fStatus')?.value || '';
  F.dept   = $('fDept')?.value   || '';
  F.q      = $('fSearch')?.value || '';
  F.page   = 0;
  renderTable();
};
window.__clearFilter = () => {
  $('fType').value = $('fStatus').value = $('fDept').value = $('fSearch').value = '';
  Object.assign(F, { type:'', status:'', dept:'', q:'', page:0 });
  renderTable();
};
window.__page        = d => { F.page += d; renderTable(); };
window.__openCreate  = openCreateForm;
window.__openDetail  = openDetail;
window.__openEdit    = openEdit;
window.__closeModal  = closeModal;
window.__submitCreate = submitCreate;
window.__submitEdit   = submitEdit;
window.__updateStatus = updateStatus;
window.__deleteIncident = async id => {
  if (!confirm('ลบรายการอุบัติเหตุนี้?')) return;
  await deleteIncident(id);
  _rows = await listIncidents({ lim: 200 });
  renderTable();
  closeModal(null);
};

// ─── boot ───────────────────────────────────────────────────────────────
_profile = await requireRole(['safety_officer', 'kpo', 'admin', 'manager', 'warehouse']);
renderShell(_profile, 'incident-list', 'บันทึกอุบัติเหตุ');
buildLayout();

// Load data
_rows = await listIncidents({ lim: 200 });
renderTable();

// Handle #new hash
if (location.hash === '#new') openCreateForm();
// Handle ?id= query
const qid = new URLSearchParams(location.search).get('id');
if (qid) openDetail(qid);
</script>
</body>
</html>
