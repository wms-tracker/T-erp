<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Daily Safety Report — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:11px;box-shadow:0 1px 5px rgba(0,0,0,.09);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;border-left:5px solid transparent}
.card:hover{box-shadow:0 3px 12px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(680px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:flex-end}
.search-bar select{flex:1;min-width:100px}
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.status-selector{display:flex;gap:8px;margin-top:6px}
.status-btn{flex:1;padding:10px;border:2px solid #e5e7eb;border-radius:9px;cursor:pointer;text-align:center;font-weight:700;font-size:0.85rem;transition:all .15s}
.act-check{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:0.85rem;cursor:pointer}
.act-check input[type=checkbox]{width:16px;height:16px;flex-shrink:0}
.today-banner{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.info-row{display:flex;gap:12px;flex-wrap:wrap;font-size:0.8rem;color:#6b7280;margin-top:4px}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  DAILY_SHIFTS, DAILY_STATUS, DAILY_ACTIVITIES, DAILY_WEATHER,
  listDailyReport, getDailyReport, createDailyReport, updateDailyReport, deleteDailyReport
} from "./js/safety-data.js";
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-daily', 'รายงานความปลอดภัยประจำวัน');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric',weekday:'long'}) : '-';
const fmtShort= s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';
const TODAY   = new Date().toISOString().slice(0,10);

let records = [];
let editId  = null;
let selStatus = '';

async function render() {
  records = await listDailyReport(200);
  const flt = document.getElementById('filter-status')?.value||'';

  const safe    = records.filter(r=>r.overallStatus==='safe').length;
  const caution = records.filter(r=>r.overallStatus==='caution').length;
  const unsafe  = records.filter(r=>r.overallStatus==='unsafe').length;
  const todayRec= records.filter(r=>r.reportDate===TODAY);
  const totalIncidents = records.reduce((s,r)=>s+(r.incidentCount||0),0);

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">📋 รายงานความปลอดภัยประจำวัน</h2>
    <button class="btn btn-primary" onclick="window.__openPanel()">+ รายงานวันนี้</button>
  </div>

  ${todayRec.length?`
  <div style="margin-bottom:14px">
    <div style="font-size:0.8rem;font-weight:700;color:#1a237e;margin-bottom:6px">📅 วันนี้</div>
    ${todayRec.map(r=>renderCard(r,true)).join('')}
  </div>`:''}

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${records.length}</div><div class="kpi-label">รายงานทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${safe}</div><div class="kpi-label">🟢 ปลอดภัย</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${caution}</div><div class="kpi-label">🟡 ต้องระวัง</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${unsafe}</div><div class="kpi-label">🔴 ไม่ปลอดภัย</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${totalIncidents}</div><div class="kpi-label">อุบัติเหตุสะสม</div></div>
  </div>

  <div class="search-bar">
    <select id="filter-status" onchange="window.__applyFilter()">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(DAILY_STATUS).map(([k,v])=>`<option value="${k}" ${flt===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
    </select>
  </div>
  <div id="list-wrap">${renderList(applyFilter(records.filter(r=>r.reportDate!==TODAY),flt))}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">รายงานประจำวัน</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function applyFilter(list, status) {
  return status ? list.filter(r=>r.overallStatus===status) : list;
}
window.__applyFilter = () => {
  const s=document.getElementById('filter-status')?.value||'';
  document.getElementById('list-wrap').innerHTML=renderList(applyFilter(records.filter(r=>r.reportDate!==TODAY),s));
};

function statusColor(s) { return (DAILY_STATUS[s]||DAILY_STATUS.safe).color; }

function renderCard(r, highlight=false) {
  const st  = DAILY_STATUS[r.overallStatus]||DAILY_STATUS.safe;
  const shf = DAILY_SHIFTS.find(x=>x.key===r.shift)||DAILY_SHIFTS[3];
  const wx  = DAILY_WEATHER.find(x=>x.key===r.weather);
  return `
  <div class="card" style="border-left-color:${st.color}${highlight?';box-shadow:0 2px 8px rgba(0,0,0,.12)':''}" onclick="window.__openView('${r.id}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
          <span style="font-size:1.3rem">${st.icon}</span>
          <span style="font-weight:800">${fmtShort(r.reportDate)}</span>
          <span style="font-size:0.82rem;color:#6b7280">${shf.icon} ${shf.label.split(' ')[0]}</span>
          ${wx?`<span>${wx.icon}</span>`:''}
        </div>
        <div class="info-row">
          <span>👤 ${esc(r.reportedBy||'-')}</span>
          <span>👷 ${r.workerCount||0} คน</span>
          ${r.incidentCount?`<span style="color:#dc2626;font-weight:700">⚠️ อุบัติเหตุ ${r.incidentCount} ครั้ง</span>`:'<span style="color:#16a34a">✓ ไม่มีอุบัติเหตุ</span>'}
          ${r.nearMissCount?`<span style="color:#d97706">⚡ Near Miss ${r.nearMissCount}</span>`:''}
        </div>
        ${r.keyObservation?`<div style="font-size:0.82rem;color:#374151;margin-top:5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical">${esc(r.keyObservation)}</div>`:''}
      </div>
      <span class="badge" style="color:${st.color};background:${st.bg};white-space:nowrap">${st.label}</span>
    </div>
  </div>`;
}

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:28px 0">ไม่มีรายงานเก่า</p>`;
  return list.map(r=>renderCard(r)).join('');
}

// ── view ──────────────────────────────────────────────────────────────────────
window.__openView = async (id) => {
  editId = id;
  const r = await getDailyReport(id);
  if (!r) return;
  const st  = DAILY_STATUS[r.overallStatus]||DAILY_STATUS.safe;
  const shf = DAILY_SHIFTS.find(x=>x.key===r.shift)||DAILY_SHIFTS[3];
  const wx  = DAILY_WEATHER.find(x=>x.key===r.weather);
  openPanel(`รายงาน ${fmtShort(r.reportDate)}`);
  document.getElementById('panel-body').innerHTML = `
    <div class="today-banner" style="background:${st.bg}">
      <span style="font-size:2.2rem">${st.icon}</span>
      <div>
        <div style="font-weight:900;font-size:1.1rem;color:${st.color}">${st.label}</div>
        <div style="font-size:0.85rem;color:#374151">${fmtDate(r.reportDate)}</div>
        <div style="font-size:0.8rem;color:#6b7280">${shf.icon} ${shf.label} ${wx?'· '+wx.icon+' '+wx.label:''}</div>
      </div>
    </div>

    <div class="form-row" style="font-size:0.85rem;margin-bottom:12px">
      <div><div class="lbl" style="margin-top:0">ผู้รายงาน</div><div>${esc(r.reportedBy||'-')}</div></div>
      <div><div class="lbl" style="margin-top:0">จำนวนคนงาน</div><div style="font-weight:700;font-size:1.1rem">${r.workerCount||0} คน</div></div>
      <div><div class="lbl">อุบัติเหตุ</div><div style="font-weight:700;color:${r.incidentCount?'#dc2626':'#16a34a'};font-size:1.1rem">${r.incidentCount||0} ครั้ง</div></div>
      <div><div class="lbl">Near Miss</div><div style="font-weight:700;color:${r.nearMissCount?'#d97706':'#16a34a'};font-size:1.1rem">${r.nearMissCount||0} ครั้ง</div></div>
    </div>

    ${(r.activities||[]).length?`
    <div class="section-title">กิจกรรมที่ดำเนินการ</div>
    ${(r.activities||[]).map(a=>`<div style="display:flex;align-items:center;gap:7px;padding:4px 0;font-size:0.85rem"><span style="color:#16a34a">✓</span>${esc(a)}</div>`).join('')}`:''}

    ${r.keyObservation?`<div class="section-title">สิ่งที่พบ / ข้อสังเกตสำคัญ</div><div style="font-size:0.85rem;line-height:1.6;white-space:pre-wrap">${esc(r.keyObservation)}</div>`:''}
    ${r.actionsTaken?`<div class="section-title">การแก้ไข / ดำเนินการแล้ว</div><div style="font-size:0.85rem;line-height:1.6;white-space:pre-wrap">${esc(r.actionsTaken)}</div>`:''}
    ${r.pendingIssues?`<div style="margin-top:10px;padding:10px;background:#fef3c7;border-radius:8px;font-size:0.85rem"><strong>⚠️ ปัญหาค้างอยู่:</strong><br>${esc(r.pendingIssues)}</div>`:''}
    ${r.tomorrowPlan?`<div style="margin-top:8px;padding:10px;background:#eff6ff;border-radius:8px;font-size:0.85rem"><strong>📅 แผนพรุ่งนี้:</strong><br>${esc(r.tomorrowPlan)}</div>`:''}`;

  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__editRecord('${id}')">แก้ไข</button>
     <button class="btn btn-danger"  onclick="window.__del('${id}')">ลบ</button>
     <button class="btn btn-ghost"   onclick="window.__closePanel()">ปิด</button>`;
};

// ── form ──────────────────────────────────────────────────────────────────────
window.__openPanel = (r=null) => {
  editId = r?.id||null;
  selStatus = r?.overallStatus||'safe';
  openPanel(r?`แก้ไขรายงาน ${fmtShort(r.reportDate)}`:'รายงานความปลอดภัยประจำวัน');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost"   onclick="window.__closePanel()">ยกเลิก</button>`;
};
window.__editRecord = async (id) => { const r=await getDailyReport(id); if(r) window.__openPanel(r); };

function renderForm(r) {
  return `
  <div class="form-row">
    <div>
      <label class="lbl" style="margin-top:0">วันที่ *</label>
      <input id="f-date" type="date" value="${r?.reportDate||TODAY}"/>
    </div>
    <div>
      <label class="lbl" style="margin-top:0">กะ</label>
      <select id="f-shift">
        ${DAILY_SHIFTS.map(s=>`<option value="${s.key}" ${(r?.shift||'all')===s.key?'selected':''}>${s.icon} ${s.label}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">ผู้รายงาน</label>
      <input id="f-reporter" value="${esc(r?.reportedBy||profile.displayName||'')}"/>
    </div>
    <div>
      <label class="lbl">สภาพอากาศ</label>
      <select id="f-weather">
        <option value="">-</option>
        ${DAILY_WEATHER.map(w=>`<option value="${w.key}" ${(r?.weather||'')===w.key?'selected':''}>${w.icon} ${w.label}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">จำนวนคนงานในโรงงาน</label>
      <input id="f-workers" type="number" min="0" value="${r?.workerCount||''}" placeholder="0"/>
    </div>
    <div>
      <label class="lbl">จำนวนผู้รับเหมา</label>
      <input id="f-contractors" type="number" min="0" value="${r?.contractorCount||''}" placeholder="0"/>
    </div>
    <div>
      <label class="lbl">อุบัติเหตุวันนี้ (ครั้ง)</label>
      <input id="f-inc" type="number" min="0" value="${r?.incidentCount||0}"/>
    </div>
    <div>
      <label class="lbl">Near Miss วันนี้ (ครั้ง)</label>
      <input id="f-nm" type="number" min="0" value="${r?.nearMissCount||0}"/>
    </div>
  </div>

  <label class="lbl">สถานะความปลอดภัยโดยรวม *</label>
  <div class="status-selector" id="status-sel">
    ${Object.entries(DAILY_STATUS).map(([k,v])=>`
      <div class="status-btn" id="stbtn-${k}"
           style="${selStatus===k?`border-color:${v.color};background:${v.bg};color:${v.color}`:''}"
           onclick="window.__selStatus('${k}')">
        ${v.icon}<br/>${v.label}
      </div>`).join('')}
  </div>

  <div class="section-title">กิจกรรมที่ดำเนินการวันนี้</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px">
    ${DAILY_ACTIVITIES.map((a,i)=>`
      <label class="act-check">
        <input type="checkbox" id="act-${i}" ${(r?.activities||[]).includes(a)?'checked':''}/>
        ${esc(a)}
      </label>`).join('')}
  </div>

  <div>
    <label class="lbl">สิ่งที่พบ / ข้อสังเกตสำคัญ</label>
    <textarea id="f-obs" rows="3" placeholder="สภาพที่พบในพื้นที่, พฤติกรรมที่สังเกต...">${esc(r?.keyObservation||'')}</textarea>
  </div>
  <div>
    <label class="lbl">การแก้ไข / ดำเนินการแล้ว</label>
    <textarea id="f-act" rows="2">${esc(r?.actionsTaken||'')}</textarea>
  </div>
  <div>
    <label class="lbl">ปัญหาค้างอยู่ (Pending Issues)</label>
    <textarea id="f-pend" rows="2">${esc(r?.pendingIssues||'')}</textarea>
  </div>
  <div>
    <label class="lbl">แผนงานพรุ่งนี้</label>
    <input id="f-plan" value="${esc(r?.tomorrowPlan||'')}"/>
  </div>`;
}

window.__selStatus = (k) => {
  selStatus = k;
  Object.entries(DAILY_STATUS).forEach(([key,v])=>{
    const el = document.getElementById(`stbtn-${key}`);
    if (!el) return;
    el.style.borderColor = key===k ? v.color : '#e5e7eb';
    el.style.background  = key===k ? v.bg    : '';
    el.style.color       = key===k ? v.color : '#374151';
  });
};

window.__save = async () => {
  const date = document.getElementById('f-date')?.value;
  if (!date) { alert('กรุณาเลือกวันที่'); return; }
  const activities = DAILY_ACTIVITIES.filter((_,i)=>document.getElementById(`act-${i}`)?.checked);
  const data = {
    reportDate:      date,
    shift:           document.getElementById('f-shift')?.value||'all',
    reportedBy:      document.getElementById('f-reporter')?.value.trim()||'',
    weather:         document.getElementById('f-weather')?.value||'',
    workerCount:     parseInt(document.getElementById('f-workers')?.value)||0,
    contractorCount: parseInt(document.getElementById('f-contractors')?.value)||0,
    incidentCount:   parseInt(document.getElementById('f-inc')?.value)||0,
    nearMissCount:   parseInt(document.getElementById('f-nm')?.value)||0,
    overallStatus:   selStatus||'safe',
    activities,
    keyObservation:  document.getElementById('f-obs')?.value.trim()||'',
    actionsTaken:    document.getElementById('f-act')?.value.trim()||'',
    pendingIssues:   document.getElementById('f-pend')?.value.trim()||'',
    tomorrowPlan:    document.getElementById('f-plan')?.value.trim()||'',
  };
  try {
    if (editId) await updateDailyReport(editId, data);
    else await createDailyReport(data, profile.uid);
    window.__closePanel(); await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบรายงานนี้?')) return;
  await deleteDailyReport(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();

window.__viewRecord = async id => { await window.__editRecord(id); window.__safetyViewMode(); };
</script>
</body>
</html>
