// โ”€โ”€ KPI โ”€โ”€
function renderKPI(recs) {

// โ”€โ”€ Status selector โ”€โ”€
window.__selStatus = key => {

  const data = {

    lawYear:             document.getElementById('f-lawYear').value.trim(),

  };
  if (!data.lawName || !data.evalDate) { alert('เธเธฃเธธเธ“เธฒเธเธฃเธญเธเธเธทเนเธญเธเธเธซเธกเธฒเธขเนเธฅเธฐเธงเธฑเธเธ—เธตเนเธเธฃเธฐเน€เธกเธดเธ'); return; }
  try {
    if (editId) await updateLegalCompliance(editId, data);

};

window.__deleteLC = async (id, name) => {

// โ”€โ”€ Filter โ”€โ”€
function applyFilter() {
  const q   = document.getElementById('search-box')?.value.toLowerCase()||'';
  const st  = document.getElementById('filter-status')?.value||'';
  const cat = document.getElementById('filter-cat')?.value||'';
  const filtered = allRecs.filter(r =>
    (!q  || (r.lawName||'').toLowerCase().includes(q) || (r.lawNumber||'').toLowerCase().includes(q)) &&
    (!st || r.complianceStatus===st) &&
    (!cat|| r.category===cat)
  );
  document.getElementById('kpi-wrap').innerHTML = renderKPI(filtered);
  document.getElementById('table-wrap').innerHTML = renderTable(filtered);
}
window.applyFilter = applyFilter;

async function loadData() {
  allRecs = await listLegalCompliance();

}
