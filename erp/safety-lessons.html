<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>เธเธ—เน€เธฃเธตเธขเธเธ—เธตเนเนเธ”เนเธฃเธฑเธ</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root{--c-primary:#7c3aed;--c-success:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-gray:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.toolbar input{flex:1;min-width:140px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
/* card view */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.lesson-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:hidden;cursor:pointer;transition:box-shadow .15s}
.lesson-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.card-top{padding:14px 16px;border-bottom:1px solid #f1f5f9}
.card-title{font-size:.9rem;font-weight:700;margin-bottom:6px}
.card-body{padding:12px 16px;font-size:.82rem;color:#475569}
.card-body .row{display:flex;gap:8px;margin-bottom:4px}
.card-body .label{color:#9ca3af;min-width:80px;font-size:.78rem}
/* table */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f1f5f9;padding:9px 12px;text-align:left;font-size:.8rem;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
td{padding:9px 12px;font-size:.84rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.src-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.77rem;font-weight:600}
/* panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(680px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:80px}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.view-toggle{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:8px}
.view-btn{padding:5px 12px;border:none;background:none;border-radius:6px;font-size:.82rem;cursor:pointer;color:#6b7280;font-family:inherit}
.view-btn.active{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.dept-tag{display:inline-block;padding:2px 7px;background:#f1f5f9;border-radius:4px;font-size:.74rem;margin:2px;color:#475569}
</style>
</head>
<body>
<script type="module">

const main = renderShell(profile, 'safety-lessons', 'เธเธ—เน€เธฃเธตเธขเธเธ—เธตเนเนเธ”เนเธฃเธฑเธ (Lessons Learned)');

let allRecs  = [];
let editId   = null;
let viewMode = 'card';

// โ”€โ”€ KPI โ”€โ”€
function renderKPI(recs) {
  const total  = recs.length;
  const draft  = recs.filter(r=>r.status==='draft').length;
  const dist   = recs.filter(r=>r.status==='distributed').length;
  const impl   = recs.filter(r=>r.status==='implemented').length;
  const high   = recs.filter(r=>r.severity==='high').length;
  const srcMap = {};
  recs.forEach(r=>{ srcMap[r.source]=(srcMap[r.source]||0)+1; });
  const topSrc = Object.entries(srcMap).sort((a,b)=>b[1]-a[1])[0];
  const topLabel = topSrc ? (LESSON_SOURCES.find(s=>s.key===topSrc[0])?.label||topSrc[0]) : 'โ€”';
  return `<div class="kpi-row">
    <div class="kpi"><div class="num">${total}</div><div class="lbl">เธเธ—เน€เธฃเธตเธขเธเธ—เธฑเนเธเธซเธกเธ”</div></div>
    <div class="kpi" style="border-color:#9ca3af"><div class="num" style="color:#9ca3af">${draft}</div><div class="lbl">โ๏ธ เธฃเนเธฒเธ</div></div>
    <div class="kpi" style="border-color:#2563eb"><div class="num" style="color:#2563eb">${dist}</div><div class="lbl">๐“ค เนเธเธเธเนเธฒเธขเนเธฅเนเธง</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${impl}</div><div class="lbl">โ… เธเธณเนเธเธเธเธดเธเธฑเธ•เธด</div></div>
    <div class="kpi" style="border-color:#dc2626"><div class="num" style="color:#dc2626">${high}</div><div class="lbl">๐”ด เธเธงเธฒเธกเธชเธณเธเธฑเธเธชเธนเธ</div></div>
    <div class="kpi" style="border-color:#7c3aed"><div class="num" style="color:#7c3aed;font-size:.82rem">${topLabel}</div><div class="lbl">เนเธซเธฅเนเธเธ—เธตเนเธกเธฒเธซเธฅเธฑเธ</div></div>
  </div>`;
}

// โ”€โ”€ Card view โ”€โ”€
function renderCards(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon">๐“–</div><p>เธขเธฑเธเนเธกเนเธกเธตเธเธ—เน€เธฃเธตเธขเธ</p></div>`;
  return `<div class="card-grid">${recs.map(r => {
    const src = LESSON_SOURCES.find(s=>s.key===r.source)||{icon:'๐“',label:'โ€”',color:'#6b7280',bg:'#f3f4f6'};
    const st  = LESSON_STATUS[r.status]||LESSON_STATUS.draft;
    const sev = LESSON_SEVERITY[r.severity]||LESSON_SEVERITY.medium;
    const depts = (r.departments||'').split(',').map(d=>d.trim()).filter(Boolean);
    return `<div class="lesson-card" onclick="window.__editLesson('${r.id}')">
      <div class="card-top" style="border-left:4px solid ${sev.color}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
          <span class="src-chip" style="color:${src.color};background:${src.bg}">${src.icon} ${src.label}</span>
          <span class="badge" style="color:${st.color};background:${st.bg}">${st.icon} ${st.label}</span>
        </div>
        <div class="card-title">${r.title||'โ€”'}</div>
        <div style="font-size:.78rem;color:#6b7280">${r.eventDate||'โ€”'}</div>
      </div>
      <div class="card-body">
        <div class="row"><span class="label">เธเธ—เน€เธฃเธตเธขเธ:</span><span>${r.lesson||'โ€”'}</span></div>
        <div class="row"><span class="label">เธเธฒเธฃเธเนเธญเธเธเธฑเธ:</span><span>${r.prevention||'โ€”'}</span></div>
        <div style="margin-top:6px">
          ${depts.map(d=>`<span class="dept-tag">${d}</span>`).join('')}
        </div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// โ”€โ”€ Table โ”€โ”€
function renderTable(recs) {

  const rows = recs.map(r => {
    const src = LESSON_SOURCES.find(s=>s.key===r.source)||{icon:'๐“',label:'โ€”',color:'#6b7280',bg:'#f3f4f6'};
    const st  = LESSON_STATUS[r.status]||LESSON_STATUS.draft;
    const sev = LESSON_SEVERITY[r.severity]||LESSON_SEVERITY.medium;
    return `<tr>

    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>เธงเธฑเธเธ—เธตเนเน€เธเธดเธ”เน€เธซเธ•เธธ</th><th>เนเธซเธฅเนเธเธ—เธตเนเธกเธฒ</th><th>เธซเธฑเธงเธเนเธญ / เธเธ—เน€เธฃเธตเธขเธ</th>
      <th>เธฃเธฐเธ”เธฑเธ</th><th>เธเธนเนเธฃเธฑเธเธเธดเธ”เธเธญเธ</th><th>เธงเธฑเธเธ—เธตเนเนเธเธเธเนเธฒเธข</th><th>เธชเธ–เธฒเธเธฐ</th><th>เธเธฑเธ”เธเธฒเธฃ</th>
    </tr></thead>

  </table>`;
}

// โ”€โ”€ Form โ”€โ”€

  const srcOpts = LESSON_SOURCES.map(s=>`<option value="${s.key}" ${rec?.source===s.key?'selected':''}>${s.icon} ${s.label}</option>`).join('');

        <input id="f-title" value="${rec?.title||''}" placeholder="เธชเธฃเธธเธเธเธ—เน€เธฃเธตเธขเธเนเธเธซเธเธถเนเธเธเธฃเธฐเนเธขเธ"/></div>
    </div>
    <div class="form-row three">

    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธฃเธฒเธขเธฅเธฐเน€เธญเธตเธขเธ”เน€เธซเธ•เธธเธเธฒเธฃเธ“เน / เธ—เธตเนเธกเธฒ</label>
        <textarea id="f-event" rows="3" placeholder="เธญเธเธดเธเธฒเธขเน€เธซเธ•เธธเธเธฒเธฃเธ“เนเธ—เธตเนเน€เธเธดเธ”เธเธถเนเธ เธซเธฃเธทเธญเธ—เธตเนเธกเธฒเธเธญเธเธเธ—เน€เธฃเธตเธขเธ">${rec?.event||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธชเธฒเน€เธซเธ•เธธเธซเธฅเธฑเธ (Root Cause)</label>
        <textarea id="f-rootCause" rows="2" placeholder="เธชเธฒเน€เธซเธ•เธธเธ—เธตเนเนเธ—เนเธเธฃเธดเธเธ—เธตเนเธ—เธณเนเธซเนเน€เธเธดเธ”เน€เธซเธ•เธธเธเธฒเธฃเธ“เน">${rec?.rootCause||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธเธ—เน€เธฃเธตเธขเธเธ—เธตเนเนเธ”เนเธฃเธฑเธ *</label>
        <textarea id="f-lesson" rows="3" placeholder="เธชเธดเนเธเธ—เธตเนเน€เธฃเธตเธขเธเธฃเธนเนเนเธ”เนเธเธฒเธเน€เธซเธ•เธธเธเธฒเธฃเธ“เนเธเธตเน เน€เธเธทเนเธญเธเนเธญเธเธเธฑเธเธเธฒเธฃเน€เธเธดเธ”เธเนเธณ">${rec?.lesson||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธกเธฒเธ•เธฃเธเธฒเธฃเธเนเธญเธเธเธฑเธเธเธฒเธฃเน€เธเธดเธ”เธเนเธณ</label>
        <textarea id="f-prevention" rows="2" placeholder="เธชเธดเนเธเธ—เธตเนเธ•เนเธญเธเธ—เธณเน€เธเธทเนเธญเธเนเธญเธเธเธฑเธเนเธกเนเนเธซเนเน€เธเธดเธ”เธเนเธณ">${rec?.prevention||''}</textarea></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>เธเธนเนเธฃเธฑเธเธเธดเธ”เธเธญเธ</label>
        <input id="f-responsible" value="${rec?.responsible||''}" placeholder="เธเธทเนเธญ / เธ•เธณเนเธซเธเนเธ"/></div>
      <div class="form-group"><label>เธงเธฑเธเธ—เธตเนเนเธเธเธเนเธฒเธข</label>
        <input id="f-distDate" type="date" value="${rec?.distDate||''}"/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เนเธเธเธ / เธชเนเธงเธเธเธฒเธเธ—เธตเนเนเธเธเธเนเธฒเธข (เธเธฑเนเธเธ”เนเธงเธขเธเธธเธฅเธ เธฒเธ)</label>
        <input id="f-departments" value="${rec?.departments||''}" placeholder="เน€เธเนเธ เธเธฅเธดเธ•, QC, เธเธฅเธฑเธเธชเธดเธเธเนเธฒ, เธ—เธธเธเนเธเธเธ"/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธงเธดเธเธตเธเธฒเธฃเธชเธทเนเธญเธชเธฒเธฃ / เน€เธเธขเนเธเธฃเน</label>
        <input id="f-commMethod" value="${rec?.commMethod||''}" placeholder="เน€เธเนเธ Toolbox Talk, Email, เธเธญเธฃเนเธ”เธเธฃเธฐเธเธฒเธจ"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>เธชเธ–เธฒเธเธฐ</label>

      <div class="form-group"><label>เธญเนเธฒเธเธญเธดเธ (เน€เธฅเธเธ—เธตเนเนเธ CAPA / เน€เธซเธ•เธธเธเธฒเธฃเธ“เน)</label>

    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button type="button" class="btn btn-primary" onclick="window.__saveLesson()">๐’พ เธเธฑเธเธ—เธถเธ</button>
      <button type="button" class="btn btn-ghost" onclick="window.__closePanel()">เธขเธเน€เธฅเธดเธ</button>

}

// โ”€โ”€ Panel โ”€โ”€
window.__closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
function openPanel(html, title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

window.__newLesson  = () => { editId = null; openPanel(renderForm(null), '+ เน€เธเธดเนเธกเธเธ—เน€เธฃเธตเธขเธ'); };
window.__editLesson = async id => {
  editId = id;
  const r = await getLesson(id);
  openPanel(renderForm(r), 'โ๏ธ เนเธเนเนเธเธเธ—เน€เธฃเธตเธขเธ');
};

// โ”€โ”€ Save โ”€โ”€
window.__saveLesson = async () => {
  const data = {
    title:       document.getElementById('f-title').value.trim(),
    eventDate:   document.getElementById('f-eventDate').value,
    source:      document.getElementById('f-source').value,
    severity:    document.getElementById('f-severity').value,
    event:       document.getElementById('f-event').value.trim(),
    rootCause:   document.getElementById('f-rootCause').value.trim(),
    lesson:      document.getElementById('f-lesson').value.trim(),
    prevention:  document.getElementById('f-prevention').value.trim(),
    responsible: document.getElementById('f-responsible').value.trim(),
    distDate:    document.getElementById('f-distDate').value,
    departments: document.getElementById('f-departments').value.trim(),
    commMethod:  document.getElementById('f-commMethod').value.trim(),

  };
  if (!data.title)     { alert('เธเธฃเธธเธ“เธฒเธเธฃเธญเธเธซเธฑเธงเธเนเธญเธเธ—เน€เธฃเธตเธขเธ'); return; }
  if (!data.eventDate) { alert('เธเธฃเธธเธ“เธฒเน€เธฅเธทเธญเธเธงเธฑเธเธ—เธตเนเน€เธเธดเธ”เน€เธซเธ•เธธ'); return; }
  if (!data.lesson)    { alert('เธเธฃเธธเธ“เธฒเธเธฃเธญเธเธเธ—เน€เธฃเธตเธขเธเธ—เธตเนเนเธ”เนเธฃเธฑเธ'); return; }
  try {

};

// โ”€โ”€ Delete โ”€โ”€
window.__deleteLesson = async (id, title) => {
  if (!confirm(`เธฅเธเธเธ—เน€เธฃเธตเธขเธ "${title}"?`)) return;
  await deleteLesson(id);
  window.__closePanel();

};

// โ”€โ”€ Filter โ”€โ”€
function applyFilter() {
  const q   = document.getElementById('search-box')?.value.toLowerCase()||'';
  const src = document.getElementById('filter-source')?.value||'';
  const st  = document.getElementById('filter-status')?.value||'';
  const sev = document.getElementById('filter-sev')?.value||'';
  const filtered = allRecs.filter(r =>
    (!q   || (r.title||'').toLowerCase().includes(q) || (r.lesson||'').toLowerCase().includes(q) || (r.departments||'').toLowerCase().includes(q)) &&
    (!src || r.source===src) &&
    (!st  || r.status===st) &&
    (!sev || r.severity===sev)
  );
  document.getElementById('kpi-wrap').innerHTML = renderKPI(filtered);
  document.getElementById('content-wrap').innerHTML =
    viewMode==='table' ? renderTable(filtered) : renderCards(filtered);
}
window.applyFilter = applyFilter;

window.__switchView = mode => {
  viewMode = mode;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===mode));
  applyFilter();
};

async function loadData() {
  allRecs = await listLessons();
  applyFilter();
}
