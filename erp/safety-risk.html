<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประเมินความเสี่ยง (HIRA)</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listRiskAssessments, getRiskAssessment, createRiskAssessment, updateRiskAssessment,
  getRiskLevel, RISK_LIKELIHOOD, RISK_SEVERITY, RISK_CONTROLS, DEPARTMENTS,
} from "./js/safety-data.js";

let _profile, _rows = [], _panelOpen = false, _detail = null, _editId = null;
// each assessment: title, department, assessDate, assessedBy, reviewer, status, hazards[]
// hazard: {activity,hazard,consequence,likelihoodBefore,severityBefore,controlType,controls,likelihoodAfter,severityAfter}
let _hazards = [];

const today = () => new Date().toISOString().split('T')[0];
const riskColor = score => getRiskLevel(score).color;
const riskBg    = score => getRiskLevel(score).bg;
const riskLabel = score => getRiskLevel(score).label;

// ── STYLES ────────────────────────────────────────────────────────────────────
const CSS = `<style>

.wrap{max-width:1300px;margin:0 auto;padding:0 20px 60px;}

.btn{padding:7px 16px;border:none;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.1s;}
.btn-primary{background:#0f172a;color:#fff;} .btn-primary:hover{background:#1e293b;}
.btn-ghost{background:#f1f5f9;color:#475569;}  .btn-ghost:hover{background:#e2e8f0;}
.btn-green{background:#16a34a;color:#fff;}    .btn-green:hover{background:#15803d;}
.btn-red{background:#dc2626;color:#fff;}      .btn-red:hover{background:#b91c1c;}
.btn-sm{padding:4px 10px;font-size:.75rem;}
/* stats */
.stat-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.stat-card{background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.07);flex:1;min-width:100px;}
.stat-val{font-size:1.5rem;font-weight:900;line-height:1;}
.stat-label{font-size:.72rem;color:#64748b;margin-top:3px;}
/* table */
.tbl-card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.07);overflow:hidden;margin-bottom:16px;}
.tbl{width:100%;border-collapse:collapse;font-size:.83rem;}
.tbl th{text-align:left;padding:10px 14px;font-size:.72rem;font-weight:700;color:#64748b;background:#f8fafc;border-bottom:1.5px solid #f1f5f9;}
.tbl td{padding:10px 14px;border-bottom:1px solid #f8fafc;vertical-align:top;}
.tbl tr:hover td{background:#f8fafc;cursor:pointer;}

.risk-badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:.72rem;font-weight:700;}
/* panel */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none;}

.panel.open .overlay,.overlay.open{display:block;}
.panel-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #f1f5f9;flex-shrink:0;}
.panel-body{flex:1;overflow-y:auto;padding:20px;}
.panel-ft{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;}
/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;}
@media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld.full{grid-column:1/-1;}
.lbl{font-size:.75rem;font-weight:700;color:#475569;}
input,select,textarea{padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;outline:none;color:#0f172a;background:#fff;width:100%;}
input:focus,select:focus,textarea:focus{border-color:#0891b2;}
.sec-hd{font-size:.78rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;padding:10px 0 8px;border-bottom:1.5px solid #f1f5f9;margin:12px 0 8px;display:flex;justify-content:space-between;align-items:center;}
/* hazard rows */
.haz-card{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px;position:relative;}
.haz-card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.haz-num{width:22px;height:22px;border-radius:50%;background:#0891b2;color:#fff;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* risk matrix */
.matrix-wrap{overflow-x:auto;margin-bottom:16px;}
.matrix{border-collapse:collapse;font-size:.72rem;}
.matrix td,.matrix th{width:44px;height:36px;text-align:center;border:1.5px solid #fff;border-radius:3px;font-weight:700;}
.matrix .label-row th{background:transparent;color:#64748b;}
.matrix .label-col{background:transparent;color:#64748b;width:80px;text-align:right;padding-right:6px;}
/* score input display */
.score-display{display:inline-block;padding:4px 10px;border-radius:8px;font-weight:900;font-size:1rem;}
/* print */
@media print{
  .no-print{display:none!important;}
  .print-only{display:block!important;}
  .overlay,.panel-ft{display:none!important;}
  .panel{position:static;width:100%;height:auto;box-shadow:none;}
  body{font-size:9pt;}
  .tbl{font-size:8pt;}
}
.print-only{display:none;}
</style>`;

// ── RISK MATRIX SVG ───────────────────────────────────────────────────────────
function riskMatrixHtml() {
  const cellColor = (l, s) => {
    const sc = l * s;
    if (sc <= 4) return '#bbf7d0';
    if (sc <= 9) return '#fde68a';
    if (sc <= 16) return '#fca5a5';
    return '#991b1b';
  };
  const cellTextColor = (l, s) => (l*s > 16) ? '#fff' : '#0f172a';
  const sevLabels = ['1 ไม่มีนัย','2 เล็กน้อย','3 ปานกลาง','4 รุนแรง','5 หายนะ'];
  const likLabels = ['1 แทบจะไม่','2 ไม่น่าจะ','3 อาจเกิด','4 น่าจะ','5 แน่นอน'];

  let rows = `<tr class="label-row"><th class="label-col">ความน่าจะเกิด ↓ / ความรุนแรง →</th>${sevLabels.map(l=>`<th style="font-size:.65rem;text-align:center;width:56px">${l}</th>`).join('')}</tr>`;
  for (let li = 5; li >= 1; li--) {
    rows += `<tr><td class="label-col" style="font-size:.65rem">${likLabels[li-1]}</td>`;
    for (let si = 1; si <= 5; si++) {
      const sc = li * si;
      rows += `<td style="background:${cellColor(li,si)};color:${cellTextColor(li,si)};width:56px;text-align:center;font-size:.8rem;padding:8px">${sc}</td>`;
    }
    rows += '</tr>';
  }
  return `<div class="matrix-wrap">
    <div style="font-size:.78rem;font-weight:700;color:#334155;margin-bottom:6px">Risk Matrix (5×5)</div>
    <table class="matrix" style="border-collapse:collapse">${rows}</table>
    <div style="display:flex;gap:12px;margin-top:8px;font-size:.72rem;flex-wrap:wrap">
      <span><span style="display:inline-block;width:12px;height:12px;background:#bbf7d0;border-radius:2px;vertical-align:middle"></span> ต่ำ (≤4)</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#fde68a;border-radius:2px;vertical-align:middle"></span> ปานกลาง (5-9)</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#fca5a5;border-radius:2px;vertical-align:middle"></span> สูง (10-16)</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#991b1b;border-radius:2px;vertical-align:middle"></span> <span style="color:#fff;background:#991b1b;padding:0 3px;border-radius:2px">สูงมาก (&gt;16)</span></span>
    </div>
  </div>`;
}

// ── LOAD / RENDER LIST ────────────────────────────────────────────────────────
async function loadList() {
  _rows = await listRiskAssessments({ lim: 200 });
  renderList();
}

function renderList() {
  const mc = document.getElementById('main-content');
  const allHazards = _rows.flatMap(r => r.hazards || []);
  const countExtreme = allHazards.filter(h => (h.likelihoodBefore||1)*(h.severityBefore||1) > 16).length;
  const countHigh    = allHazards.filter(h => { const s=(h.likelihoodBefore||1)*(h.severityBefore||1); return s>9&&s<=16; }).length;
  const countResidHigh = allHazards.filter(h => (h.likelihoodAfter||1)*(h.severityAfter||1) > 9).length;

  mc.innerHTML = CSS + `
  <div class="wrap">
    <div class="hd no-print">
      <div class="page-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        ประเมินความเสี่ยง (HIRA)
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="window.print()">🖨 พิมพ์</button>
        <button class="btn btn-primary" onclick="__newAssess()">+ การประเมินใหม่</button>
      </div>
    </div>

    <div class="stat-bar no-print">
      <div class="stat-card"><div class="stat-val">${_rows.length}</div><div class="stat-label">การประเมินทั้งหมด</div></div>
      <div class="stat-card"><div class="stat-val">${allHazards.length}</div><div class="stat-label">อันตรายที่ระบุ</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#7f1d1d">${countExtreme}</div><div class="stat-label">สูงมาก (Extreme)</div></div>
      <div class="stat-card"><div class="stat-val" style="color:#dc2626">${countHigh}</div><div class="stat-label">สูง (High)</div></div>
      <div class="stat-card"><div class="stat-val" style="color:${countResidHigh>0?'#d97706':'#16a34a'}">${countResidHigh}</div><div class="stat-label">ความเสี่ยงคงเหลือ ≥สูง</div></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;flex-wrap:wrap">
      <div>
        <div class="tbl-card">
          <table class="tbl" id="riskTable">
            <thead><tr>
              <th>ชื่อการประเมิน / แผนก</th><th>วันที่</th><th>อันตราย</th>
              <th>สูงมาก</th><th>สูง</th><th>ปานกลาง</th><th>ต่ำ</th><th>ดำเนินการ</th>
            </tr></thead>
            <tbody>${buildRiskRows(_rows)}</tbody>
          </table>
        </div>
      </div>
      <div class="no-print" style="min-width:380px">
        ${riskMatrixHtml()}
      </div>
    </div>
  </div>
  <!-- panel overlay -->
  <div class="overlay" id="overlay" onclick="__closePanel()"></div>
  <div class="panel" id="sidePanel"><div id="panelContent"></div></div>`;
}

function buildRiskRows(rows) {
  if (!rows.length) return `<tr><td colspan="8" class="empty">ยังไม่มีข้อมูล</td></tr>`;
  return rows.map(r => {
    const haz = r.hazards || [];
    const counts = { extreme:0, high:0, moderate:0, low:0 };
    haz.forEach(h => {
      const sc = (h.likelihoodBefore||1)*(h.severityBefore||1);
      const lv = getRiskLevel(sc).level;
      counts[lv] = (counts[lv]||0)+1;
    });
    return `<tr onclick="__openDetail('${r.id}')">
      <td>
        <div style="font-weight:700">${r.title||'—'}</div>
        <div style="font-size:.75rem;color:#64748b">${r.department||'—'} | ผู้ประเมิน: ${r.assessedBy||'—'}</div>
      </td>
      <td>${r.assessDate||'—'}</td>
      <td style="font-weight:700">${haz.length}</td>
      <td><span style="font-weight:700;color:#7f1d1d">${counts.extreme||0}</span></td>
      <td><span style="font-weight:700;color:#dc2626">${counts.high||0}</span></td>
      <td><span style="font-weight:700;color:#d97706">${counts.moderate||0}</span></td>
      <td><span style="font-weight:700;color:#16a34a">${counts.low||0}</span></td>
      <td onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="__editAssess('${r.id}')">แก้ไข</button>
      </td>
    </tr>`;
  }).join('');
}

// ── PANEL helpers ─────────────────────────────────────────────────────────────
function openPanel(html) {
  document.getElementById('panelContent').innerHTML = html;
  document.getElementById('sidePanel').style.transform = 'translateX(0)';
  document.getElementById('sidePanel').style.transition = 'transform .25s ease';
  document.getElementById('overlay').style.display = 'block';
}
window.__closePanel = () => {
  document.getElementById('sidePanel').style.transform = 'translateX(100%)';
  document.getElementById('overlay').style.display = 'none';
};

// ── DETAIL PANEL ──────────────────────────────────────────────────────────────
window.__openDetail = async (id) => {
  const rec = _rows.find(r => r.id === id) || await getRiskAssessment(id);
  if (!rec) return;
  _detail = rec;
  const haz = rec.hazards || [];

  openPanel(`
  <div class="panel-hd">
    <div style="font-weight:700;font-size:1rem">${rec.title || 'HIRA'}</div>
    <button class="btn btn-ghost btn-sm" onclick="__closePanel()">✕ ปิด</button>
  </div>
  <div class="panel-body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;font-size:.83rem">
      <div><div class="lbl">แผนก</div>${rec.department||'—'}</div>
      <div><div class="lbl">วันที่ประเมิน</div>${rec.assessDate||'—'}</div>
      <div><div class="lbl">ผู้ประเมิน</div>${rec.assessedBy||'—'}</div>
      <div><div class="lbl">ผู้ทบทวน</div>${rec.reviewer||'—'}</div>
    </div>
    ${haz.length === 0 ? '<div style="text-align:center;color:#94a3b8;padding:30px">ยังไม่มีรายการอันตราย</div>' :
      haz.map((h, i) => {
        const scoreBefore = (h.likelihoodBefore||1)*(h.severityBefore||1);
        const scoreAfter  = (h.likelihoodAfter||1)*(h.severityAfter||1);
        return `
        <div class="haz-card">
          <div class="haz-card-hd">
            <div style="display:flex;align-items:center;gap:8px">
              <div class="haz-num">${i+1}</div>
              <div style="font-weight:700">${h.activity||'—'}</div>
            </div>
            <span class="risk-badge" style="background:${riskBg(scoreBefore)};color:${riskColor(scoreBefore)}">${riskLabel(scoreBefore)}</span>
          </div>
          <div style="font-size:.8rem;display:grid;gap:4px">
            <div><span class="lbl">อันตราย:</span> ${h.hazard||'—'}</div>
            <div><span class="lbl">ผลกระทบ:</span> ${h.consequence||'—'}</div>
            <div style="display:flex;gap:12px;margin-top:4px">
              <div><span class="lbl">ก่อน:</span> L=${h.likelihoodBefore||1} × S=${h.severityBefore||1} = <span style="font-weight:700;color:${riskColor(scoreBefore)}">${scoreBefore}</span></div>
              <div><span class="lbl">หลัง:</span> L=${h.likelihoodAfter||1} × S=${h.severityAfter||1} = <span style="font-weight:700;color:${riskColor(scoreAfter)}">${scoreAfter}</span>
                <span class="risk-badge" style="background:${riskBg(scoreAfter)};color:${riskColor(scoreAfter)};margin-left:4px">${riskLabel(scoreAfter)}</span>
              </div>
            </div>
            <div><span class="lbl">มาตรการควบคุม (${h.controlType||'—'}):</span> ${h.controls||'—'}</div>
          </div>
        </div>`;
      }).join('')}
  </div>
  <div class="panel-ft">
    <button class="btn btn-ghost" onclick="__closePanel()">ปิด</button>
    <button class="btn btn-primary" onclick="__editAssess('${rec.id}')">✏️ แก้ไข</button>
  </div>`);
};

// ── FORM PANEL ────────────────────────────────────────────────────────────────
window.__newAssess = () => {
  _editId = null;
  _hazards = [newHazard()];
  renderForm();
};

window.__editAssess = async (id) => {
  const rec = _rows.find(r => r.id === id) || await getRiskAssessment(id);
  if (!rec) return;
  _editId = id;
  _hazards = (rec.hazards || []).map(h => ({ ...h }));
  if (!_hazards.length) _hazards = [newHazard()];
  renderForm(rec);
};

function newHazard() {
  return { activity:'', hazard:'', consequence:'', likelihoodBefore:3, severityBefore:3, controlType:'administrative', controls:'', likelihoodAfter:1, severityAfter:1 };
}

function renderForm(rec = {}) {
  const formHtml = `
  <div class="panel-hd">
    <div style="font-weight:700">${_editId ? 'แก้ไขการประเมิน' : 'การประเมินความเสี่ยงใหม่'}</div>
    <button class="btn btn-ghost btn-sm" onclick="__closePanel()">✕</button>
  </div>
  <div class="panel-body">
    <div class="form-grid" style="margin-bottom:14px">
      <div class="fld full"><label class="lbl">ชื่อการประเมิน / กิจกรรม *</label><input id="rTitle" value="${rec.title||''}"></div>
      <div class="fld"><label class="lbl">แผนก *</label>
        <select id="rDept"><option value="">— เลือก —</option>${DEPARTMENTS.map(d=>`<option ${rec.department===d?'selected':''}>${d}</option>`).join('')}</select>
      </div>
      <div class="fld"><label class="lbl">วันที่ประเมิน</label><input type="date" id="rDate" value="${rec.assessDate||today()}"></div>
      <div class="fld"><label class="lbl">ผู้ประเมิน</label><input id="rAssessedBy" value="${rec.assessedBy||_profile?.displayName||''}"></div>
      <div class="fld"><label class="lbl">ผู้ทบทวน</label><input id="rReviewer" value="${rec.reviewer||''}"></div>
    </div>

    <div class="sec-hd">
      รายการอันตราย
      <button class="btn btn-ghost btn-sm" onclick="__addHazard()">+ เพิ่มอันตราย</button>
    </div>
    <div id="hazContainer">${_hazards.map((_,i)=>hazardFormRow(i)).join('')}</div>
  </div>
  <div class="panel-ft">
    <button class="btn btn-ghost" onclick="__closePanel()">ยกเลิก</button>
    <button class="btn btn-green" onclick="__saveAssess()">💾 บันทึก</button>
  </div>`;
  openPanel(formHtml);
}

function hazardFormRow(i) {
  const h = _hazards[i];
  const sBefore = (h.likelihoodBefore||1)*(h.severityBefore||1);
  const sAfter  = (h.likelihoodAfter||1)*(h.severityAfter||1);
  return `
  <div class="haz-card" id="haz-${i}">
    <div class="haz-card-hd">
      <div style="display:flex;align-items:center;gap:6px"><div class="haz-num">${i+1}</div><span style="font-weight:700;font-size:.83rem">อันตรายที่ ${i+1}</span></div>
      ${i > 0 ? `<button class="btn btn-ghost btn-sm" onclick="__removeHazard(${i})" style="color:#dc2626">✕ ลบ</button>` : ''}
    </div>
    <div style="display:grid;gap:8px;font-size:.82rem">
      <div class="fld"><label class="lbl">งาน / กิจกรรม</label><input id="h${i}_activity" value="${h.activity||''}"></div>
      <div class="fld"><label class="lbl">อันตรายที่ระบุ</label><input id="h${i}_hazard" value="${h.hazard||''}"></div>
      <div class="fld"><label class="lbl">ผลกระทบ / อาการ</label><input id="h${i}_consequence" value="${h.consequence||''}"></div>
      <div style="background:#fff8f8;border-radius:8px;padding:10px;border:1px solid #fecaca">
        <div style="font-weight:700;font-size:.75rem;color:#dc2626;margin-bottom:6px">ก่อนมาตรการ</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div class="fld" style="flex:1;min-width:140px"><label class="lbl">โอกาสเกิด (L)</label>
            <select id="h${i}_lBefore" onchange="__calcScore(${i})">
              ${RISK_LIKELIHOOD.map(o=>`<option value="${o.value}" ${h.likelihoodBefore==o.value?'selected':''}>${o.label}</option>`).join('')}
            </select>
          </div>
          <div class="fld" style="flex:1;min-width:140px"><label class="lbl">ความรุนแรง (S)</label>
            <select id="h${i}_sBefore" onchange="__calcScore(${i})">
              ${RISK_SEVERITY.map(o=>`<option value="${o.value}" ${h.severityBefore==o.value?'selected':''}>${o.label}</option>`).join('')}
            </select>
          </div>
          <div style="text-align:center">
            <div class="lbl">คะแนน</div>
            <div id="scoreBefore${i}" class="score-display" style="background:${riskBg(sBefore)};color:${riskColor(sBefore)}">${sBefore} — ${riskLabel(sBefore)}</div>
          </div>
        </div>
      </div>
      <div class="fld"><label class="lbl">ประเภทมาตรการควบคุม</label>
        <select id="h${i}_ctrlType">
          ${RISK_CONTROLS.map(c=>`<option value="${c.key}" ${h.controlType===c.key?'selected':''}>${c.label}</option>`).join('')}
        </select>
      </div>
      <div class="fld"><label class="lbl">มาตรการควบคุม (อธิบายสิ่งที่ทำ)</label><textarea id="h${i}_controls" rows="2" style="resize:vertical">${h.controls||''}</textarea></div>
      <div style="background:#f0fdf4;border-radius:8px;padding:10px;border:1px solid #bbf7d0">
        <div style="font-weight:700;font-size:.75rem;color:#16a34a;margin-bottom:6px">หลังมาตรการ (ความเสี่ยงคงเหลือ)</div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <div class="fld" style="flex:1;min-width:140px"><label class="lbl">โอกาสเกิด (L)</label>
            <select id="h${i}_lAfter" onchange="__calcScore(${i})">
              ${RISK_LIKELIHOOD.map(o=>`<option value="${o.value}" ${h.likelihoodAfter==o.value?'selected':''}>${o.label}</option>`).join('')}
            </select>
          </div>
          <div class="fld" style="flex:1;min-width:140px"><label class="lbl">ความรุนแรง (S)</label>
            <select id="h${i}_sAfter" onchange="__calcScore(${i})">
              ${RISK_SEVERITY.map(o=>`<option value="${o.value}" ${h.severityAfter==o.value?'selected':''}>${o.label}</option>`).join('')}
            </select>
          </div>
          <div style="text-align:center">
            <div class="lbl">คะแนน</div>
            <div id="scoreAfter${i}" class="score-display" style="background:${riskBg(sAfter)};color:${riskColor(sAfter)}">${sAfter} — ${riskLabel(sAfter)}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

window.__calcScore = (i) => {
  const lB = +document.getElementById(`h${i}_lBefore`)?.value || 1;
  const sB = +document.getElementById(`h${i}_sBefore`)?.value || 1;
  const lA = +document.getElementById(`h${i}_lAfter`)?.value  || 1;
  const sA = +document.getElementById(`h${i}_sAfter`)?.value  || 1;
  const el1 = document.getElementById(`scoreBefore${i}`);
  const el2 = document.getElementById(`scoreAfter${i}`);
  if (el1) { el1.textContent = `${lB*sB} — ${riskLabel(lB*sB)}`; el1.style.background=riskBg(lB*sB); el1.style.color=riskColor(lB*sB); }
  if (el2) { el2.textContent = `${lA*sA} — ${riskLabel(lA*sA)}`; el2.style.background=riskBg(lA*sA); el2.style.color=riskColor(lA*sA); }
};

window.__addHazard = () => {
  _collectHazards();
  _hazards.push(newHazard());
  const container = document.getElementById('hazContainer');
  if (container) container.insertAdjacentHTML('beforeend', hazardFormRow(_hazards.length - 1));
};

window.__removeHazard = (i) => {
  _collectHazards();
  _hazards.splice(i, 1);
  const container = document.getElementById('hazContainer');
  if (container) container.innerHTML = _hazards.map((_,idx) => hazardFormRow(idx)).join('');
};

function _collectHazards() {
  _hazards = _hazards.map((_, i) => ({
    activity:         document.getElementById(`h${i}_activity`)?.value    || '',
    hazard:           document.getElementById(`h${i}_hazard`)?.value      || '',
    consequence:      document.getElementById(`h${i}_consequence`)?.value || '',
    likelihoodBefore: +document.getElementById(`h${i}_lBefore`)?.value    || 1,
    severityBefore:   +document.getElementById(`h${i}_sBefore`)?.value    || 1,
    controlType:      document.getElementById(`h${i}_ctrlType`)?.value    || 'administrative',
    controls:         document.getElementById(`h${i}_controls`)?.value    || '',
    likelihoodAfter:  +document.getElementById(`h${i}_lAfter`)?.value     || 1,
    severityAfter:    +document.getElementById(`h${i}_sAfter`)?.value     || 1,
  }));
}

window.__saveAssess = async () => {
  const title = document.getElementById('rTitle')?.value;
  const dept  = document.getElementById('rDept')?.value;
  if (!title) return alert('กรุณาระบุชื่อการประเมิน');
  _collectHazards();
  const data = {
    title,
    department:  dept,
    assessDate:  document.getElementById('rDate')?.value || today(),
    assessedBy:  document.getElementById('rAssessedBy')?.value || '',
    reviewer:    document.getElementById('rReviewer')?.value   || '',
    hazards:     _hazards,
  };
  try {
    if (_editId) await updateRiskAssessment(_editId, data);
    else await createRiskAssessment(data, _profile?.uid);
    _editId = null;
    __closePanel();
    _rows = await listRiskAssessments({ lim: 200 });
    renderList();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

// ── BOOT ──────────────────────────────────────────────────────────────────────
_profile = await requireRole(['safety_officer','kpo','admin','manager']);
renderShell(_profile, 'risk-assessment', 'ประเมินความเสี่ยง (HIRA)');
loadList();
</script>
</body>
</html>
