<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Training Matrix — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(680px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-warning{background:#d97706;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-bar select,.search-bar input{flex:1;min-width:120px}
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.dept-chip{display:inline-block;padding:2px 8px;background:#eff6ff;color:#1e40af;border-radius:8px;font-size:0.74rem;margin:2px}
.progress-wrap{background:#e5e7eb;border-radius:6px;height:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:6px;transition:width .4s}
.matrix-table{border-collapse:collapse;font-size:0.78rem;width:100%;margin-top:8px}
.matrix-table th{background:#f8fafc;padding:6px 10px;border:1px solid #e5e7eb;white-space:nowrap;font-weight:700;color:#374151}
.matrix-table td{padding:5px 8px;border:1px solid #f3f4f6;text-align:center}
.cell-compliant{background:#dcfce7;color:#15803d;font-weight:700}
.cell-expiring{background:#fef9c3;color:#92400e;font-weight:700}
.cell-overdue{background:#fee2e2;color:#991b1b;font-weight:700}
.cell-pending{background:#f9fafb;color:#9ca3af}
.row-name{text-align:left;font-weight:600;padding:5px 10px;white-space:nowrap;border:1px solid #e5e7eb;background:#fafafa}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  MATRIX_TRAINING_TYPES, MATRIX_STATUS, MATRIX_DEPARTMENTS,
  calcMatrixStatus,
  listTrainingMatrix, getTrainingMatrix, createTrainingMatrix,
  updateTrainingMatrixDoc, deleteTrainingMatrix
} from "./js/safety-data.js";

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'training-matrix', 'Training Matrix / Compliance');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';
const daysUntil = s => s ? Math.floor((new Date(s)-Date.now())/86400000) : null;

let records = [];
let view    = 'list'; // 'list' | 'matrix'

function statusBadge(st) {
  const s = MATRIX_STATUS[st]||MATRIX_STATUS.pending;
  return `<span class="badge" style="color:${s.color};background:${s.bg}">${s.label}</span>`;
}
function typeBadge(k) {
  const t = MATRIX_TRAINING_TYPES.find(x=>x.key===k);
  if (!t) return '';
  return `<span class="badge" style="color:${t.color};background:${t.bg}">${t.icon} ${t.label}</span>`;
}

async function render() {
  records = await listTrainingMatrix();
  const withStatus = records.map(r=>({ ...r, _status: calcMatrixStatus(r) }));

  const flt = document.getElementById('filter-status')?.value||'';
  const q   = document.getElementById('search-input')?.value.toLowerCase()||'';
  const ftl = document.getElementById('filter-type')?.value||'';

  const compliant = withStatus.filter(r=>r._status==='compliant').length;
  const expiring  = withStatus.filter(r=>r._status==='expiring').length;
  const overdue   = withStatus.filter(r=>r._status==='overdue').length;
  const pending   = withStatus.filter(r=>r._status==='pending').length;
  const total     = records.length;
  const compPct   = total ? Math.round(compliant/total*100) : 0;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">📚 Training Matrix — Compliance</h2>
    <div style="display:flex;gap:8px">
      <button class="btn ${view==='list'?'btn-primary':'btn-ghost'}" onclick="window.__setView('list')">รายการ</button>
      <button class="btn ${view==='matrix'?'btn-primary':'btn-ghost'}" onclick="window.__setView('matrix')">Matrix</button>
      <button class="btn btn-success" onclick="window.__openPanel(null)">+ เพิ่มหลักสูตร</button>
    </div>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card">
      <div class="kpi-num">${total}</div>
      <div class="kpi-label">หลักสูตรทั้งหมด</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num" style="color:#16a34a">${compliant}</div>
      <div class="kpi-label">Compliant</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num" style="color:#d97706">${expiring}</div>
      <div class="kpi-label">ใกล้หมดอายุ</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num" style="color:#dc2626">${overdue}</div>
      <div class="kpi-label">เกินกำหนด</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-num" style="color:#6b7280">${pending}</div>
      <div class="kpi-label">ยังไม่ดำเนินการ</div>
    </div>
  </div>

  <div style="margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;font-size:0.8rem;color:#6b7280;margin-bottom:4px">
      <span>Overall Compliance</span><span style="font-weight:700;color:${compPct>=80?'#16a34a':compPct>=50?'#d97706':'#dc2626'}">${compPct}%</span>
    </div>
    <div class="progress-wrap"><div class="progress-fill" style="width:${compPct}%;background:${compPct>=80?'#16a34a':compPct>=50?'#d97706':'#dc2626'}"></div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาชื่อหลักสูตร..." oninput="window.__applyFilter()"/>
    <select id="filter-status" onchange="window.__applyFilter()">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(MATRIX_STATUS).map(([k,v])=>`<option value="${k}" ${flt===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
    <select id="filter-type" onchange="window.__applyFilter()">
      <option value="">ทุกประเภท</option>
      ${MATRIX_TRAINING_TYPES.map(t=>`<option value="${t.key}" ${ftl===t.key?'selected':''}>${t.label}</option>`).join('')}
    </select>
  </div>

  <div id="content-wrap">${view==='matrix' ? renderMatrix(withStatus) : renderList(applyFilter(withStatus,q,flt,ftl))}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">หลักสูตรฝึกอบรม</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function applyFilter(list, q, status, type) {
  return list.filter(r => {
    const mq = !q || (r.courseName||'').toLowerCase().includes(q);
    return mq && (!status||r._status===status) && (!type||r.trainingType===type);
  });
}
window.__applyFilter = () => {
  const q  = document.getElementById('search-input')?.value.toLowerCase()||'';
  const st = document.getElementById('filter-status')?.value||'';
  const tp = document.getElementById('filter-type')?.value||'';
  const ws = records.map(r=>({...r,_status:calcMatrixStatus(r)}));
  document.getElementById('content-wrap').innerHTML =
    view==='matrix' ? renderMatrix(ws) : renderList(applyFilter(ws,q,st,tp));
};
window.__setView = (v) => { view=v; render(); };

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ไม่มีรายการที่ตรงเงื่อนไข</p>`;
  return list.map(r => {
    const days = daysUntil(r.expiryDate);
    const daysStr = days===null ? '' : days<0 ? `<span style="color:#dc2626;font-size:0.75rem">เกิน ${Math.abs(days)} วัน</span>` : `<span style="color:${days<60?'#d97706':'#6b7280'};font-size:0.75rem">เหลือ ${days} วัน</span>`;
    const pct = r.targetEmployees ? Math.round(((r.completedEmployees||0)/r.targetEmployees)*100) : 0;
    return `
    <div class="card" onclick="window.__openView('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1">
          <div style="font-weight:700">${esc(r.courseName||'-')}</div>
          <div style="margin:4px 0;display:flex;gap:4px;flex-wrap:wrap">
            ${statusBadge(r._status)} ${typeBadge(r.trainingType)}
          </div>
          ${r.requiredDepts?.length ? `<div style="margin-top:4px">${r.requiredDepts.map(d=>`<span class="dept-chip">${esc(d)}</span>`).join('')}</div>` : ''}
          ${r.targetEmployees ? `
          <div style="margin-top:8px">
            <div style="display:flex;justify-content:space-between;font-size:0.75rem;color:#6b7280;margin-bottom:3px">
              <span>${r.completedEmployees||0}/${r.targetEmployees} คน ผ่านการอบรม</span><span>${pct}%</span>
            </div>
            <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%;background:${pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}"></div></div>
          </div>` : ''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          ${r.expiryDate?`<div style="font-size:0.75rem;color:#6b7280">หมดอายุ ${fmtDate(r.expiryDate)}</div>`:''}
          ${daysStr}
        </div>
      </div>
    </div>`;
  }).join('');
}

function renderMatrix(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ยังไม่มีหลักสูตร</p>`;
  const depts = MATRIX_DEPARTMENTS;
  const cellClass = { compliant:'cell-compliant', expiring:'cell-expiring', overdue:'cell-overdue', pending:'cell-pending' };
  const cellTxt   = { compliant:'✓', expiring:'⚠', overdue:'✗', pending:'—' };

  return `<div style="overflow-x:auto">
  <table class="matrix-table">
    <thead>
      <tr>
        <th style="min-width:160px">หลักสูตร</th>
        ${depts.map(d=>`<th style="min-width:70px">${esc(d)}</th>`).join('')}
      </tr>
    </thead>
    <tbody>
      ${list.map(r=>`
        <tr>
          <td class="row-name" onclick="window.__openView('${r.id}')" title="${esc(r.courseName)}">${esc(r.courseName||'-').substring(0,30)}${(r.courseName||'').length>30?'…':''}</td>
          ${depts.map(d=>{
            const req = r.requiredDepts?.includes(d);
            if (!req) return `<td style="background:#fafafa;color:#e5e7eb">—</td>`;
            return `<td class="${cellClass[r._status]}">${cellTxt[r._status]}</td>`;
          }).join('')}
        </tr>`).join('')}
    </tbody>
  </table>
  <div style="margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;font-size:0.75rem">
    <span class="cell-compliant" style="padding:2px 8px;border-radius:6px">✓ Compliant</span>
    <span class="cell-expiring"  style="padding:2px 8px;border-radius:6px">⚠ ใกล้หมดอายุ</span>
    <span class="cell-overdue"   style="padding:2px 8px;border-radius:6px">✗ เกินกำหนด</span>
    <span class="cell-pending"   style="padding:2px 8px;border-radius:6px">— ยังไม่ดำเนินการ</span>
    <span style="color:#9ca3af">— (ไม่บังคับสำหรับแผนกนี้)</span>
  </div>
  </div>`;
}

// ── view ──────────────────────────────────────────────────────────────────────
window.__openView = async (id) => {
  const r = await getTrainingMatrix(id);
  if (!r) return;
  const st  = calcMatrixStatus(r);
  const pct = r.targetEmployees ? Math.round(((r.completedEmployees||0)/r.targetEmployees)*100) : null;
  openPanel('รายละเอียดหลักสูตร');
  document.getElementById('panel-body').innerHTML = `
    <div style="margin-bottom:14px">
      <div style="font-weight:800;font-size:1.05rem">${esc(r.courseName||'-')}</div>
      <div style="font-size:0.82rem;color:#6b7280;margin-top:2px">${esc(r.courseCode||'')}</div>
      <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${statusBadge(st)} ${typeBadge(r.trainingType)}</div>
    </div>
    <div class="form-row" style="font-size:0.85rem">
      <div><div class="lbl" style="margin-top:0">วันที่อบรมล่าสุด</div><div>${fmtDate(r.completionDate)}</div></div>
      <div><div class="lbl" style="margin-top:0">วันหมดอายุ</div><div style="color:${st==='overdue'?'#dc2626':st==='expiring'?'#d97706':'#374151'}">${fmtDate(r.expiryDate)}</div></div>
      <div><div class="lbl">อายุความ (เดือน)</div><div>${r.validityMonths||'ไม่มีกำหนด'}</div></div>
      <div><div class="lbl">ผู้สอน/วิทยากร</div><div>${esc(r.instructor||'-')}</div></div>
      <div><div class="lbl">สถานที่จัดอบรม</div><div>${esc(r.venue||'-')}</div></div>
      <div><div class="lbl">กฎหมาย/มาตรฐานอ้างอิง</div><div>${esc(r.legalRef||'-')}</div></div>
    </div>
    ${r.requiredDepts?.length?`
    <div class="section-title">แผนกที่ต้องผ่านการอบรม</div>
    <div>${r.requiredDepts.map(d=>`<span class="dept-chip">${esc(d)}</span>`).join('')}</div>`:''}
    ${pct!==null?`
    <div class="section-title">ความคืบหน้า</div>
    <div style="display:flex;justify-content:space-between;font-size:0.82rem;color:#6b7280;margin-bottom:6px">
      <span>${r.completedEmployees||0} / ${r.targetEmployees} คน</span><span style="font-weight:700;color:${pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}">${pct}%</span>
    </div>
    <div class="progress-wrap" style="height:12px"><div class="progress-fill" style="width:${pct}%;background:${pct>=80?'#16a34a':pct>=50?'#d97706':'#dc2626'}"></div></div>`:''}
    ${r.description?`<div class="section-title">รายละเอียดหลักสูตร</div><div style="font-size:0.85rem">${esc(r.description)}</div>`:''}
    ${r.note?`<div style="margin-top:10px;padding:10px;background:#fafafa;border-radius:8px;font-size:0.85rem"><strong>หมายเหตุ:</strong> ${esc(r.note)}</div>`:''}`;
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__editRecord('${id}')">แก้ไข</button>
     <button class="btn btn-warning" onclick="window.__renew('${id}')">ต่ออายุ / อบรมใหม่</button>
     <button class="btn btn-danger"  onclick="window.__del('${id}')">ลบ</button>
     <button class="btn btn-ghost"   onclick="window.__closePanel()">ปิด</button>`;
};

// ── form ──────────────────────────────────────────────────────────────────────
window.__openPanel = (r) => {
  openPanel(r ? 'แก้ไขหลักสูตร' : 'เพิ่มหลักสูตรใหม่');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost"   onclick="window.__closePanel()">ยกเลิก</button>`;
  document.getElementById('panel-body').dataset.editId = r?.id||'';
};
window.__editRecord = async (id) => {
  const r = await getTrainingMatrix(id);
  if (r) window.__openPanel(r);
};
window.__renew = async (id) => {
  const r = await getTrainingMatrix(id);
  if (!r) return;
  window.__openPanel({ ...r, completionDate:'', expiryDate:'' });
  document.getElementById('panel-body').dataset.editId = id;
  document.getElementById('panel-title').textContent = 'ต่ออายุ / อบรมใหม่';
};

function renderForm(r) {
  return `
  <div class="form-row">
    <div>
      <label class="lbl" style="margin-top:0">ชื่อหลักสูตร *</label>
      <input id="f-name" value="${esc(r?.courseName||'')}" placeholder="เช่น LOTO Training"/>
    </div>
    <div>
      <label class="lbl" style="margin-top:0">รหัสหลักสูตร</label>
      <input id="f-code" value="${esc(r?.courseCode||'')}" placeholder="เช่น SAF-001"/>
    </div>
  </div>
  <div>
    <label class="lbl">ประเภท *</label>
    <select id="f-type">
      ${MATRIX_TRAINING_TYPES.map(t=>`<option value="${t.key}" ${(r?.trainingType||'internal')===t.key?'selected':''}>${t.icon} ${t.label}</option>`).join('')}
    </select>
  </div>
  <div>
    <label class="lbl">กฎหมาย/มาตรฐานอ้างอิง</label>
    <input id="f-legal" value="${esc(r?.legalRef||'')}" placeholder="เช่น กฎกระทรวงฯ ข้อ 15, ISO 45001:2018 ข้อ 7.2"/>
  </div>
  <div>
    <label class="lbl">แผนกที่ต้องผ่านการอบรม (เลือกได้หลายแผนก)</label>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
      ${MATRIX_DEPARTMENTS.map(d=>`
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:0.85rem">
          <input type="checkbox" id="dept-${d.replace(/\//g,'-')}" style="width:auto;margin:0" ${r?.requiredDepts?.includes(d)?'checked':''}/>
          ${esc(d)}
        </label>`).join('')}
    </div>
  </div>
  <div class="form-row">
    <div>
      <label class="lbl">วันที่จัดอบรมล่าสุด</label>
      <input id="f-comp" type="date" value="${r?.completionDate||''}"/>
    </div>
    <div>
      <label class="lbl">วันหมดอายุ</label>
      <input id="f-exp" type="date" value="${r?.expiryDate||''}"/>
    </div>
    <div>
      <label class="lbl">อายุความ (เดือน)</label>
      <input id="f-valid" type="number" min="0" value="${r?.validityMonths||12}" placeholder="12"/>
    </div>
    <div>
      <label class="lbl">ชั่วโมงอบรม</label>
      <input id="f-hrs" type="number" min="0" step="0.5" value="${r?.hours||''}" placeholder="6"/>
    </div>
    <div>
      <label class="lbl">จำนวนพนักงานเป้าหมาย</label>
      <input id="f-target" type="number" min="0" value="${r?.targetEmployees||''}" placeholder="จำนวน"/>
    </div>
    <div>
      <label class="lbl">จำนวนที่ผ่านแล้ว</label>
      <input id="f-done" type="number" min="0" value="${r?.completedEmployees||''}" placeholder="จำนวน"/>
    </div>
  </div>
  <div>
    <label class="lbl">ผู้สอน/วิทยากร</label>
    <input id="f-inst" value="${esc(r?.instructor||'')}" placeholder="ชื่อผู้สอน หรือบริษัทฝึกอบรม"/>
  </div>
  <div>
    <label class="lbl">สถานที่จัดอบรม</label>
    <input id="f-venue" value="${esc(r?.venue||'')}" placeholder="เช่น ห้องประชุม A, บริษัท xyz"/>
  </div>
  <div>
    <label class="lbl">รายละเอียดหลักสูตร</label>
    <textarea id="f-desc">${esc(r?.description||'')}</textarea>
  </div>
  <div>
    <label class="lbl">หมายเหตุ</label>
    <input id="f-note" value="${esc(r?.note||'')}"/>
  </div>`;
}

window.__save = async () => {
  const name = document.getElementById('f-name')?.value.trim();
  if (!name) { alert('กรุณากรอกชื่อหลักสูตร'); return; }
  const depts = MATRIX_DEPARTMENTS.filter(d => document.getElementById(`dept-${d.replace(/\//g,'-')}`)?.checked);
  const data = {
    courseName:         name,
    courseCode:         document.getElementById('f-code')?.value.trim()||'',
    trainingType:       document.getElementById('f-type')?.value||'internal',
    legalRef:           document.getElementById('f-legal')?.value.trim()||'',
    requiredDepts:      depts,
    completionDate:     document.getElementById('f-comp')?.value||'',
    expiryDate:         document.getElementById('f-exp')?.value||'',
    validityMonths:     parseInt(document.getElementById('f-valid')?.value)||12,
    hours:              parseFloat(document.getElementById('f-hrs')?.value)||0,
    targetEmployees:    parseInt(document.getElementById('f-target')?.value)||0,
    completedEmployees: parseInt(document.getElementById('f-done')?.value)||0,
    instructor:         document.getElementById('f-inst')?.value.trim()||'',
    venue:              document.getElementById('f-venue')?.value.trim()||'',
    description:        document.getElementById('f-desc')?.value.trim()||'',
    note:               document.getElementById('f-note')?.value.trim()||'',
  };
  const editId = document.getElementById('panel-body')?.dataset.editId;
  try {
    if (editId) await updateTrainingMatrixDoc(editId, data);
    else await createTrainingMatrix(data, profile.uid);
    window.__closePanel(); await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบหลักสูตรนี้?')) return;
  await deleteTrainingMatrix(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
