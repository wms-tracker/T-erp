<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ตรวจสอบรถ/รถยก — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:16px;margin-bottom:12px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.12)}
.type-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;border:2px solid #e5e7eb;cursor:pointer;font-size:0.82rem;transition:all .15s;user-select:none}
.type-chip.active{border-color:#1a237e;background:#e8eaf6;color:#1a237e;font-weight:600}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s}
.checklist-item:hover{background:#f1f5f9}
.checklist-item.checked{background:#dcfce7}
.checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:#16a34a;flex-shrink:0;margin-top:2px}
.checklist-item label{font-size:0.85rem;cursor:pointer;line-height:1.4}
.progress-wrap{background:#e5e7eb;border-radius:8px;height:8px;margin:8px 0 4px;overflow:hidden}
.progress-bar{height:100%;border-radius:8px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .3s}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.defect-row{display:flex;gap:8px;margin-bottom:8px}
.defect-row input{flex:1;padding:6px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:0.85rem}
.defect-row button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:70px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.6rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.75rem;color:#6b7280;margin-top:2px}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  COL, VEHICLE_TYPES, VEHICLE_CHECK_STATUS, VEHICLE_CHECKLIST,
  listVehicleCheck, getVehicleCheck, createVehicleCheck, updateVehicleCheck, deleteVehicleCheck
} from "./js/safety-data.js";
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-vehicle', 'ตรวจสอบรถยก/ยานพาหนะ');

const badge  = (l,c,bg) => `<span class="badge" style="color:${c};background:${bg}">${l}</span>`;
const esc    = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

let records = [];
let editId  = null;
let checklistState = {};
let selectedType   = '';
let defects = [];

// ── render ────────────────────────────────────────────────────────────────────
async function render() {
  records = await listVehicleCheck();
  const total  = records.length;
  const pass   = records.filter(r=>r.overallStatus==='pass').length;
  const fail   = records.filter(r=>r.overallStatus==='fail').length;
  const today  = records.filter(r=> r.checkDate === new Date().toISOString().slice(0,10)).length;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🚛 ตรวจสอบรถยก / ยานพาหนะ</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ บันทึกการตรวจสอบ</button>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${total}</div><div class="kpi-label">บันทึกทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${pass}</div><div class="kpi-label">ผ่านการตรวจ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${fail}</div><div class="kpi-label">ไม่ผ่าน / ต้องซ่อม</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${today}</div><div class="kpi-label">ตรวจวันนี้</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาทะเบียน, ชื่อผู้ขับ, ประเภท..." oninput="window.__filterList(this.value)"/>
  </div>

  <div id="list-wrap">${renderList(records)}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">บันทึกการตรวจสอบ</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ยังไม่มีบันทึกการตรวจสอบ</p>`;
  return list.map(r => {
    const st  = VEHICLE_CHECK_STATUS[r.overallStatus] || VEHICLE_CHECK_STATUS.pending;
    const vt  = VEHICLE_TYPES.find(x=>x.key===r.vehicleType) || {};
    const done = (r.checklist||[]).filter(Boolean).length;
    const total= VEHICLE_CHECKLIST.length;
    const pct  = Math.round(done/total*100);
    return `
    <div class="card" onclick="window.__openPanel('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:1rem">${vt.icon||'🚗'} ${esc(r.vehiclePlate||'-')} <span style="font-size:0.85rem;font-weight:400;color:#6b7280">${esc(r.vehicleModel||'')}</span></div>
          <div style="font-size:0.82rem;color:#6b7280;margin-top:2px">ประเภท: ${esc(vt.label||r.vehicleType||'-')} · ผู้ตรวจ: ${esc(r.checkedBy||'-')} · ${fmtDate(r.checkDate)}</div>
          ${r.defects&&r.defects.length ? `<div style="font-size:0.8rem;color:#dc2626;margin-top:3px">⚠️ ข้อบกพร่อง: ${esc(r.defects.join(', '))}</div>` : ''}
        </div>
        <div style="flex-shrink:0;text-align:right">
          ${badge(st.label, st.color, st.bg)}
          <div style="font-size:0.75rem;color:#6b7280;margin-top:4px">ตรวจ ${done}/${total} รายการ</div>
        </div>
      </div>
      <div class="progress-wrap" style="margin-top:8px">
        <div class="progress-bar" style="width:${pct}%;background:${r.overallStatus==='fail'?'linear-gradient(90deg,#dc2626,#f87171)':'linear-gradient(90deg,#16a34a,#4ade80)'}"></div>
      </div>
    </div>`;
  }).join('');
}

window.__filterList = (q) => {
  const kw = q.toLowerCase();
  const filtered = records.filter(r =>
    (r.vehiclePlate||'').toLowerCase().includes(kw) ||
    (r.checkedBy||'').toLowerCase().includes(kw) ||
    (r.vehicleType||'').toLowerCase().includes(kw) ||
    (r.vehicleModel||'').toLowerCase().includes(kw)
  );
  document.getElementById('list-wrap').innerHTML = renderList(filtered);
};

// ── panel ─────────────────────────────────────────────────────────────────────
window.__openPanel = async (id) => {
  editId = id;
  checklistState = {};
  selectedType   = '';
  defects        = [];
  const panel = document.getElementById('panel');
  const body  = document.getElementById('panel-body');
  const foot  = document.getElementById('panel-footer');
  document.getElementById('panel-title').textContent = id ? 'แก้ไขการตรวจสอบ' : 'บันทึกการตรวจสอบ';
  document.getElementById('overlay').classList.add('open');
  panel.classList.add('open');

  let rec = null;
  if (id) {
    rec = await getVehicleCheck(id);
    if (rec) {
      selectedType = rec.vehicleType || '';
      defects = rec.defects ? [...rec.defects] : [];
      (rec.checklist||[]).forEach((v,i)=>{ checklistState[VEHICLE_CHECKLIST[i]?.key] = v; });
    }
  }

  const today = new Date().toISOString().slice(0,10);
  body.innerHTML = renderForm(rec, today);
  renderChecklist();

  if (id) {
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
      <button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
      <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
  } else {
    foot.innerHTML = `
      <button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
      <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
  }
};

function renderForm(rec, today) {
  const typeChips = VEHICLE_TYPES.map(t=>`
    <div class="type-chip ${selectedType===t.key?'active':''}" onclick="window.__selType('${t.key}')">
      ${t.icon} ${esc(t.label)}
    </div>`).join('');

  return `
  <div class="section-title">ข้อมูลยานพาหนะ</div>
  <div class="chip-wrap">${typeChips}</div>

  <div class="form-row">
    <div>
      <label class="lbl">ทะเบียนรถ / รหัสรถ *</label>
      <input id="f-plate" value="${esc(rec?.vehiclePlate||'')}" placeholder="เช่น KP-001 / กบ 1234"/>
    </div>
    <div>
      <label class="lbl">ยี่ห้อ / รุ่น</label>
      <input id="f-model" value="${esc(rec?.vehicleModel||'')}" placeholder="เช่น Toyota 8FG15"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">วันที่ตรวจ *</label>
      <input id="f-date" type="date" value="${rec?.checkDate||today}"/>
    </div>
    <div>
      <label class="lbl">ผู้ตรวจสอบ *</label>
      <input id="f-by" value="${esc(rec?.checkedBy||profile.displayName||'')}" placeholder="ชื่อผู้ตรวจ"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">ชั่วโมงใช้งาน (Hr)</label>
      <input id="f-hours" type="number" min="0" value="${rec?.operatingHours||''}" placeholder="0"/>
    </div>
    <div>
      <label class="lbl">ผลการตรวจโดยรวม *</label>
      <select id="f-status">
        ${Object.entries(VEHICLE_CHECK_STATUS).map(([k,v])=>`<option value="${k}" ${(rec?.overallStatus||'pending')===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="section-title" style="margin-top:16px">รายการตรวจสอบ</div>
  <div style="font-size:0.8rem;color:#6b7280;margin-bottom:8px">คลิกที่รายการเพื่อทำเครื่องหมาย ✓</div>
  <div class="progress-wrap"><div class="progress-bar" id="cl-bar" style="width:0%"></div></div>
  <div id="cl-pct" style="font-size:0.78rem;color:#6b7280;text-align:right;margin-bottom:6px">0 / ${VEHICLE_CHECKLIST.length}</div>
  <div id="checklist-wrap"></div>

  <div class="section-title" style="margin-top:16px">ข้อบกพร่องที่พบ</div>
  <div id="defects-wrap">${renderDefectsUI()}</div>
  <button class="btn btn-ghost" style="margin-top:4px;font-size:0.82rem" onclick="window.__addDefect()">+ เพิ่มรายการบกพร่อง</button>

  <label class="lbl">หมายเหตุ / การดำเนินการแก้ไข</label>
  <textarea id="f-note">${esc(rec?.note||'')}</textarea>`;
}

function renderChecklist() {
  const wrap = document.getElementById('checklist-wrap');
  if (!wrap) return;
  wrap.innerHTML = VEHICLE_CHECKLIST.map(item=>`
    <div class="checklist-item ${checklistState[item.key]?'checked':''}" onclick="window.__toggleCL('${item.key}')">
      <input type="checkbox" ${checklistState[item.key]?'checked':''} onchange="window.__toggleCL('${item.key}')"/>
      <label>${esc(item.label)}</label>
    </div>`).join('');
  updateProgressBar();
}

function updateProgressBar() {
  const done  = Object.values(checklistState).filter(Boolean).length;
  const total = VEHICLE_CHECKLIST.length;
  const pct   = Math.round(done/total*100);
  const bar   = document.getElementById('cl-bar');
  const lbl   = document.getElementById('cl-pct');
  if (bar) bar.style.width = pct+'%';
  if (lbl) lbl.textContent = `${done} / ${total}`;
}

window.__toggleCL = (key) => {
  checklistState[key] = !checklistState[key];
  renderChecklist();
};

window.__selType = (key) => {
  selectedType = key;
  document.querySelectorAll('.type-chip').forEach(el=>{
    el.classList.toggle('active', el.textContent.trim().includes(VEHICLE_TYPES.find(x=>x.key===key)?.label||'__NONE__') ||
      el.getAttribute('onclick')===`window.__selType('${key}')`);
  });
  document.querySelectorAll('.type-chip').forEach(el=>{
    const match = el.getAttribute('onclick')===`window.__selType('${key}')`;
    el.classList.toggle('active', match);
  });
};

function renderDefectsUI() {
  return defects.map((d,i)=>`
    <div class="defect-row">
      <input value="${esc(d)}" oninput="window.__updateDefect(${i},this.value)" placeholder="รายละเอียดข้อบกพร่อง"/>
      <button class="btn btn-ghost" onclick="window.__removeDefect(${i})">✕</button>
    </div>`).join('');
}

window.__addDefect = () => {
  defects.push('');
  document.getElementById('defects-wrap').innerHTML = renderDefectsUI();
};
window.__removeDefect = (i) => {
  defects.splice(i,1);
  document.getElementById('defects-wrap').innerHTML = renderDefectsUI();
};
window.__updateDefect = (i,v) => { defects[i] = v; };

// ── save / delete ─────────────────────────────────────────────────────────────
window.__save = async () => {
  const plate  = document.getElementById('f-plate')?.value.trim();
  const byWho  = document.getElementById('f-by')?.value.trim();
  const date   = document.getElementById('f-date')?.value;
  const status = document.getElementById('f-status')?.value;
  if (!plate || !byWho || !date || !selectedType) {
    alert('กรุณากรอก: ประเภทรถ, ทะเบียน, ผู้ตรวจ และวันที่ตรวจ');
    return;
  }
  const checklistArr = VEHICLE_CHECKLIST.map(item => !!checklistState[item.key]);
  const data = {
    vehicleType:    selectedType,
    vehiclePlate:   plate,
    vehicleModel:   document.getElementById('f-model')?.value.trim() || '',
    checkDate:      date,
    checkedBy:      byWho,
    operatingHours: parseFloat(document.getElementById('f-hours')?.value)||0,
    overallStatus:  status,
    checklist:      checklistArr,
    defects:        defects.filter(d=>d.trim()),
    note:           document.getElementById('f-note')?.value.trim() || '',
  };
  try {
    if (editId) await updateVehicleCheck(editId, data);
    else        await createVehicleCheck(data, profile.uid);
    window.__closePanel();
    await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบบันทึกนี้?')) return;
  await deleteVehicleCheck(id);
  window.__closePanel();
  await render();
};

window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
