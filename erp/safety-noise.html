<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ตรวจวัดเสียง/สั่นสะเทือน — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(600px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-bar select,.search-bar input{flex:1;min-width:120px}
.info-row{display:flex;gap:12px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.db-meter{position:relative;height:28px;border-radius:8px;overflow:hidden;background:#e5e7eb;margin:4px 0}
.db-bar{height:100%;border-radius:8px;transition:width .5s;display:flex;align-items:center;padding:0 10px;font-size:0.8rem;font-weight:700;color:#fff}
.db-mark{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.8}
.db-mark-label{position:absolute;top:-16px;font-size:0.65rem;color:#6b7280;transform:translateX(-50%)}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  NOISE_AREA_TYPES, NOISE_STATUS, NOISE_MEASURE_TYPES, classifyNoise,
  listNoiseMonitor, getNoiseMonitor, createNoiseMonitor, updateNoiseMonitor, deleteNoiseMonitor
} from "./js/safety-data.js";

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-noise', 'ตรวจวัดเสียง/สั่นสะเทือน');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

let records = [];
let editId  = null;

const MAX_DB = 110;

function statusBadge(dB) {
  const key = classifyNoise(dB);
  const st  = NOISE_STATUS[key];
  return `<span class="badge" style="color:${st.color};background:${st.bg}">${st.label}</span>`;
}

function dbMeter(dB) {
  const pct = Math.min(dB/MAX_DB*100, 100);
  const key = classifyNoise(dB);
  const col = key==='safe' ? '#16a34a' : key==='warning' ? '#d97706' : '#dc2626';
  const m80 = 80/MAX_DB*100;
  const m85 = 85/MAX_DB*100;
  return `
  <div style="margin:8px 0">
    <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:2px">
      <span style="color:#6b7280">ระดับเสียง</span>
      <span style="font-weight:800;color:${col}">${dB} dB(A)</span>
    </div>
    <div class="db-meter">
      <div class="db-bar" style="width:${pct}%;background:${col}">${dB} dB</div>
      <div class="db-mark" style="left:${m80}%"><div class="db-mark-label" style="left:0">80</div></div>
      <div class="db-mark" style="left:${m85}%"><div class="db-mark-label" style="left:0">85</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:0.65rem;color:#9ca3af">
      <span>0</span><span>80</span><span>85</span><span style="margin-left:auto">${MAX_DB}</span>
    </div>
  </div>`;
}

async function render() {
  records = await listNoiseMonitor();
  const statusFilter = document.getElementById('filter-status')?.value || '';
  const q            = document.getElementById('search-input')?.value.toLowerCase() || '';
  const safe     = records.filter(r=>classifyNoise(r.leqValue||0)==='safe').length;
  const warning  = records.filter(r=>classifyNoise(r.leqValue||0)==='warning').length;
  const exceeded = records.filter(r=>classifyNoise(r.leqValue||0)==='exceeded').length;
  const avgDB = records.length ? +(records.reduce((s,r)=>s+(r.leqValue||0),0)/records.length).toFixed(1) : 0;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🔊 ตรวจวัดเสียง/สั่นสะเทือน</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ บันทึกการวัด</button>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${records.length}</div><div class="kpi-label">ครั้งที่วัด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${safe}</div><div class="kpi-label">ปลอดภัย</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${warning}</div><div class="kpi-label">เฝ้าระวัง</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${exceeded}</div><div class="kpi-label">เกินมาตรฐาน</div></div>
    <div class="kpi-card"><div class="kpi-num">${avgDB||'-'}</div><div class="kpi-label">Avg dB(A)</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาสถานที่, ผู้วัด..." oninput="window.__applyFilter()"/>
    <select id="filter-status" onchange="window.__applyFilter()">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(NOISE_STATUS).map(([k,v])=>`<option value="${k}" ${statusFilter===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  </div>

  <div id="list-wrap">${renderList(applyFilter(records, q, statusFilter))}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">บันทึกการตรวจวัดเสียง</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function applyFilter(list, q, status) {
  return list.filter(r => {
    const matchQ = !q || (r.location||'').toLowerCase().includes(q) || (r.measuredBy||'').toLowerCase().includes(q) || (r.areaType||'').toLowerCase().includes(q);
    const st = classifyNoise(r.leqValue||0);
    return matchQ && (!status || st===status);
  });
}

window.__applyFilter = () => {
  const q = document.getElementById('search-input')?.value.toLowerCase()||'';
  const s = document.getElementById('filter-status')?.value||'';
  document.getElementById('list-wrap').innerHTML = renderList(applyFilter(records, q, s));
};

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ยังไม่มีข้อมูลการวัด</p>`;
  return list.map(r => {
    const area = NOISE_AREA_TYPES.find(a=>a.key===r.areaType);
    const dB   = r.leqValue||0;
    return `
    <div class="card" onclick="window.__openView('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:0.95rem">${area?area.icon:''} ${esc(r.location||'-')}</div>
          <div class="info-row">
            <span>${area?.label||'-'}</span>
            <span>📅 ${fmtDate(r.measuredAt)}</span>
            <span>👤 ${esc(r.measuredBy||'-')}</span>
          </div>
          ${dbMeter(dB)}
        </div>
        <div>${statusBadge(dB)}</div>
      </div>
    </div>`;
  }).join('');
}

// ── view ──────────────────────────────────────────────────────────────────────
window.__openView = async (id) => {
  editId = id;
  const r = await getNoiseMonitor(id);
  if (!r) return;
  const area = NOISE_AREA_TYPES.find(a=>a.key===r.areaType);
  openPanel('รายละเอียดการวัดเสียง');
  document.getElementById('panel-body').innerHTML = `
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:2rem">${area?.icon||'🔊'}</div>
      <div style="font-weight:800;font-size:1rem">${esc(r.location||'-')}</div>
      <div style="font-size:0.82rem;color:#6b7280">${area?.label||'-'} · ${fmtDate(r.measuredAt)}</div>
    </div>
    ${dbMeter(r.leqValue||0)}
    <div class="form-row" style="margin-top:12px">
      <div><div class="lbl" style="margin-top:0">Leq</div><div style="font-weight:700">${r.leqValue||'-'} dB(A)</div></div>
      <div><div class="lbl" style="margin-top:0">TWA</div><div style="font-weight:700">${r.twaValue||'-'} dB(A)</div></div>
      <div><div class="lbl">Lpeak</div><div style="font-weight:700">${r.lpeakValue||'-'} dB(C)</div></div>
      <div><div class="lbl">Noise Dose</div><div style="font-weight:700">${r.doseValue||'-'} %</div></div>
      <div><div class="lbl">ผู้ตรวจวัด</div><div>${esc(r.measuredBy||'-')}</div></div>
      <div><div class="lbl">เครื่องมือที่ใช้</div><div>${esc(r.instrument||'-')}</div></div>
      <div><div class="lbl">สภาพการทำงาน</div><div>${esc(r.operatingCondition||'-')}</div></div>
      <div><div class="lbl">จำนวนคนงานในพื้นที่</div><div>${r.workersExposed||'-'} คน</div></div>
    </div>
    ${r.correctedActions ? `<div style="margin-top:10px"><div class="lbl" style="margin-top:0">มาตรการแก้ไข</div><div style="font-size:0.85rem">${esc(r.correctedActions)}</div></div>` : ''}
    ${r.remarks ? `<div style="margin-top:8px"><div class="lbl" style="margin-top:0">หมายเหตุ</div><div style="font-size:0.85rem">${esc(r.remarks)}</div></div>` : ''}`;
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-ghost" onclick="window.__editRecord('${id}')">แก้ไข</button>
     <button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ปิด</button>`;
};

// ── form ──────────────────────────────────────────────────────────────────────
window.__openPanel = (id) => {
  editId = id;
  openPanel(id ? 'แก้ไขบันทึกการวัด' : 'บันทึกการวัดเสียง');
  document.getElementById('panel-body').innerHTML = renderForm(null);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

window.__editRecord = async (id) => {
  editId = id;
  const r = await getNoiseMonitor(id);
  if (!r) return;
  openPanel('แก้ไขบันทึกการวัด');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderForm(r) {
  return `
  <div class="form-row">
    <div>
      <label class="lbl" style="margin-top:0">ประเภทพื้นที่ *</label>
      <select id="f-area">
        <option value="">-- เลือกพื้นที่ --</option>
        ${NOISE_AREA_TYPES.map(a=>`<option value="${a.key}" ${r?.areaType===a.key?'selected':''}>${a.icon} ${a.label}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl" style="margin-top:0">ชื่อสถานที่/จุดวัด *</label>
      <input id="f-loc" value="${esc(r?.location||'')}" placeholder="เช่น Line 1 ด้านหน้าเครื่องปั๊ม"/>
    </div>
    <div>
      <label class="lbl">วันที่ตรวจวัด *</label>
      <input id="f-date" type="date" value="${r?.measuredAt||new Date().toISOString().slice(0,10)}"/>
    </div>
    <div>
      <label class="lbl">ผู้ตรวจวัด *</label>
      <input id="f-by" value="${esc(r?.measuredBy||profile.displayName||'')}"/>
    </div>
    <div>
      <label class="lbl">ค่า Leq (dB(A)) *</label>
      <input id="f-leq" type="number" step="0.1" min="0" max="140" value="${r?.leqValue||''}" placeholder="เช่น 82.5"
             oninput="window.__previewDB(this.value)"/>
    </div>
    <div>
      <label class="lbl">ค่า TWA (dB(A))</label>
      <input id="f-twa" type="number" step="0.1" min="0" max="140" value="${r?.twaValue||''}"/>
    </div>
    <div>
      <label class="lbl">ค่า Lpeak (dB(C))</label>
      <input id="f-lpeak" type="number" step="0.1" min="0" max="160" value="${r?.lpeakValue||''}"/>
    </div>
    <div>
      <label class="lbl">Noise Dose (%)</label>
      <input id="f-dose" type="number" step="0.1" min="0" value="${r?.doseValue||''}"/>
    </div>
    <div>
      <label class="lbl">เครื่องมือที่ใช้วัด</label>
      <input id="f-instr" value="${esc(r?.instrument||'')}" placeholder="เช่น Sound Level Meter รุ่น XYZ"/>
    </div>
    <div>
      <label class="lbl">จำนวนคนงานในพื้นที่</label>
      <input id="f-workers" type="number" min="0" value="${r?.workersExposed||''}"/>
    </div>
    <div style="grid-column:1/-1">
      <label class="lbl">สภาพการทำงาน</label>
      <input id="f-cond" value="${esc(r?.operatingCondition||'')}" placeholder="เช่น เครื่องจักรทำงานเต็มกำลัง, 8 ชั่วโมง"/>
    </div>
  </div>
  <div id="db-preview"></div>
  <div>
    <label class="lbl">มาตรการแก้ไข (ถ้าเกินมาตรฐาน)</label>
    <textarea id="f-action">${esc(r?.correctedActions||'')}</textarea>
  </div>
  <div>
    <label class="lbl">หมายเหตุ</label>
    <textarea id="f-remarks">${esc(r?.remarks||'')}</textarea>
  </div>`;
}

window.__previewDB = (val) => {
  const v = parseFloat(val);
  if (!isNaN(v) && v > 0) {
    document.getElementById('db-preview').innerHTML = dbMeter(v);
  }
};

window.__save = async () => {
  const areaType = document.getElementById('f-area')?.value;
  const location = document.getElementById('f-loc')?.value.trim();
  const leqValue = parseFloat(document.getElementById('f-leq')?.value);
  const measuredBy = document.getElementById('f-by')?.value.trim();
  const measuredAt = document.getElementById('f-date')?.value;
  if (!areaType || !location || isNaN(leqValue) || !measuredBy || !measuredAt) {
    alert('กรุณากรอกข้อมูลที่จำเป็น: พื้นที่, สถานที่, ค่า Leq, ผู้ตรวจวัด, วันที่');
    return;
  }
  const data = {
    areaType, location, leqValue, measuredBy, measuredAt,
    twaValue:          parseFloat(document.getElementById('f-twa')?.value)||null,
    lpeakValue:        parseFloat(document.getElementById('f-lpeak')?.value)||null,
    doseValue:         parseFloat(document.getElementById('f-dose')?.value)||null,
    instrument:        document.getElementById('f-instr')?.value.trim()||'',
    workersExposed:    parseInt(document.getElementById('f-workers')?.value)||0,
    operatingCondition:document.getElementById('f-cond')?.value.trim()||'',
    correctedActions:  document.getElementById('f-action')?.value.trim()||'',
    remarks:           document.getElementById('f-remarks')?.value.trim()||'',
    noiseStatus:       classifyNoise(leqValue),
  };
  try {
    if (editId) await updateNoiseMonitor(editId, data);
    else await createNoiseMonitor(data, profile.uid);
    window.__closePanel(); await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบบันทึกนี้?')) return;
  await deleteNoiseMonitor(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
