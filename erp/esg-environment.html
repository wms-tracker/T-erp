      <h3>รายการบันทึก</h3>
      <div id="records-carbon" class="tbl-wrap"><p style="color:#9ca3af;text-align:center;padding:20px">กำลังโหลด...</p></div>
    </div>
  </div>

  <!-- Emission Factor Modal -->
  <div id="modal-ef" class="modal-bg" style="display:none">
    <div class="modal-box">
      <h3>⚙️ ค่าสัมประสิทธิ์การปล่อยก๊าซ (Emission Factors)</h3>
      <p class="sub">แหล่งอ้างอิง TGO Thailand 2022 / IPCC 2006 — ปรับค่าได้ตามฐานข้อมูลบริษัท</p>
      <div id="ef-fields" class="ef-grid"></div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="closeEF()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="saveEF()">💾 บันทึก</button>
      </div>
    </div>
  </div>

</div>
`;

// ── Utility ───────────────────────────────────────────────────────────────────
function toast(msg, type) {
  const el = document.getElementById('env-toast');
  el.textContent = msg;
  el.className = 'env-toast show ' + (type || '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function fmt(n, dec) {
  if (n == null || n === '') return '—';
  return Number(n).toLocaleString('th-TH', { maximumFractionDigits: dec ?? 2 });
}

function fmtDate(d) {
  if (!d) return '—';
  const p = String(d).split('-');
  if (p.length === 3) return p[2] + '/' + p[1] + '/' + (Number(p[0]) + 543);
  return d;
}

function sum(arr, k) { return arr.reduce((s, r) => s + (Number(r[k]) || 0), 0); }

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  _tab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  loadTab(tab);
}
window.switchTab = switchTab;

// ── Year/month change ─────────────────────────────────────────────────────────
function onYearMonth() {
  _year  = Number(document.getElementById('sel-year').value);
  _month = Number(document.getElementById('sel-month').value);
  loadTab(_tab);
}
window.onYearMonth = onYearMonth;

// ── Load tab data ─────────────────────────────────────────────────────────────
async function loadTab(tab) {
  try {
    if (tab === 'energy')    { const r = await listEnergy(_year, _month);    renderKPI_energy(r);    renderEnergy(r); }
    if (tab === 'water')     { const r = await listWater(_year, _month);     renderKPI_water(r);     renderWater(r); }
    if (tab === 'waste')     { const r = await listWaste(_year, _month);     renderKPI_waste(r);     renderWaste(r); }
    if (tab === 'packaging') { const r = await listPackaging(_year, _month); renderKPI_packaging(r); renderPackaging(r); }
    if (tab === 'carbon')    { const r = await listCarbon(_year, _month);    renderKPI_carbon(r);    renderCarbon(r); }
  } catch(e) { toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 'error'); }
}

// ── KPI renderers ─────────────────────────────────────────────────────────────
function kpiCard(val, lbl, cls) {
  return '<div class="kpi-card ' + (cls||'') + '"><div class="kv">' + val + '</div><div class="kl">' + lbl + '</div></div>';
}

function renderKPI_energy(r) {
  const el  = sum(r,'electricity_kwh');
  const cost = sum(r,'electricity_cost');
  const mk  = sum(r,'machine_kwh') + sum(r,'forklift_kwh');
  document.getElementById('kpi-energy').innerHTML =
    kpiCard(fmt(el,0) + ' kWh', 'ไฟฟ้ารวม', 'amber') +
    kpiCard('฿' + fmt(cost,0), 'ค่าไฟฟ้า', 'red') +
    kpiCard(fmt(mk,0) + ' kWh', 'เครื่องจักร+รถยก', 'blue');
}

function renderKPI_water(r) {
  const m3   = sum(r,'water_m3');
  const cost = sum(r,'water_cost');
  const lk   = sum(r,'leak_m3');
  document.getElementById('kpi-water').innerHTML =
    kpiCard(fmt(m3,2) + ' ลบ.ม.', 'น้ำใช้รวม', 'blue') +
    kpiCard('฿' + fmt(cost,0), 'ค่าน้ำ', 'red') +
    kpiCard(fmt(lk,2) + ' ลบ.ม.', 'น้ำรั่วไหล', lk > 0 ? 'red' : '');
}

function renderKPI_waste(r) {
  const total = sum(r,'total_kg');
  const haz   = sum(r,'hazardous_kg');
  const rate  = r.length ? (r.reduce((s,x)=>s+(x.recycle_rate||0),0)/r.length) : 0;
  document.getElementById('kpi-waste').innerHTML =
    kpiCard(fmt(total,1) + ' kg', 'ของเสียรวม', 'amber') +
    kpiCard(fmt(rate,1) + '%', 'อัตรา Recycle', rate >= 30 ? '' : 'red') +
    kpiCard(fmt(haz,2) + ' kg', 'ของเสียอันตราย', haz > 0 ? 'red' : '');
}

function renderKPI_packaging(r) {
  const boxes = sum(r,'boxes');
  const plas  = sum(r,'plastic_kg');
  const reuse = sum(r,'reuse_pcs');
  document.getElementById('kpi-packaging').innerHTML =
    kpiCard(fmt(boxes,0) + ' ใบ', 'กล่องกระดาษ', 'amber') +
    kpiCard(fmt(plas,2) + ' kg', 'พลาสติก', 'red') +
    kpiCard(fmt(reuse,0) + ' ชิ้น', 'วัสดุ Reuse', '');
}

function renderKPI_carbon(r) {
  const co2 = sum(r,'co2e_kg');
  const vol = sum(r,'fuel_volume');
  document.getElementById('kpi-carbon').innerHTML =
    kpiCard(fmt(co2,2) + ' kg', 'CO₂e รวม', co2 > 1000 ? 'red' : 'amber') +
    kpiCard(fmt(co2/1000,3) + ' t', 'CO₂e (ตัน)', '') +
    kpiCard(fmt(vol,2), 'ปริมาณเชื้อเพลิงรวม', 'blue');
}

// ── Table renderers ───────────────────────────────────────────────────────────
function actionBtns(tab, row) {
  return '<button class="btn btn-outline btn-sm" onclick="editRow(\'' + tab + '\',' + JSON.stringify(row).replace(/'/g,"\\'") + ')">✏️</button>'
    + ' <button class="btn btn-danger btn-sm" onclick="delRow(\'' + tab + '\',\'' + row.id + '\')" style="' + DEL_SHOW + '">🗑</button>';
}

function renderEnergy(rows) {
  if (!rows.length) { document.getElementById('records-energy').innerHTML = '<table><tbody><tr class="empty-row"><td colspan="8">ยังไม่มีข้อมูลเดือนนี้</td></tr></tbody></table>'; return; }
  let h = '<table><thead><tr><th>วันที่</th><th>หน่วยงาน</th><th>ไฟฟ้า (kWh)</th><th>ค่าไฟ (฿)</th><th>เครื่องจักร</th><th>รถยก</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r) {
    h += '<tr><td>' + fmtDate(r.date) + '</td><td>' + (r.dept||'—') + '</td><td>' + fmt(r.electricity_kwh,2) + '</td><td>' + fmt(r.electricity_cost,2) + '</td><td>' + fmt(r.machine_kwh,2) + '</td><td>' + fmt(r.forklift_kwh,2) + '</td><td>' + (r.notes||'') + '</td><td style="white-space:nowrap">' + actionBtns('energy', r) + '</td></tr>';
  });
  h += '</tbody></table>';
  document.getElementById('records-energy').innerHTML = h;
}

function renderWater(rows) {
  if (!rows.length) { document.getElementById('records-water').innerHTML = '<table><tbody><tr class="empty-row"><td colspan="7">ยังไม่มีข้อมูลเดือนนี้</td></tr></tbody></table>'; return; }
  let h = '<table><thead><tr><th>วันที่</th><th>หน่วยงาน</th><th>น้ำ (ลบ.ม.)</th><th>ค่าน้ำ (฿)</th><th>รั่วไหล</th><th>แหล่งน้ำ</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r) {
    h += '<tr><td>' + fmtDate(r.date) + '</td><td>' + (r.dept||'—') + '</td><td>' + fmt(r.water_m3,3) + '</td><td>' + fmt(r.water_cost,2) + '</td><td>' + fmt(r.leak_m3,3) + '</td><td>' + (r.water_source||'—') + '</td><td style="white-space:nowrap">' + actionBtns('water', r) + '</td></tr>';
  });
  h += '</tbody></table>';
  document.getElementById('records-water').innerHTML = h;
}

function renderWaste(rows) {
  if (!rows.length) { document.getElementById('records-waste').innerHTML = '<table><tbody><tr class="empty-row"><td colspan="8">ยังไม่มีข้อมูลเดือนนี้</td></tr></tbody></table>'; return; }
  let h = '<table><thead><tr><th>วันที่</th><th>หน่วยงาน</th><th>รวม (kg)</th><th>Recycle%</th><th>อันตราย (kg)</th><th>วิธีกำจัด</th><th>หมายเหตุ</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r) {
    const rateBadge = (r.recycle_rate||0) >= 30
      ? '<span class="badge badge-green">' + fmt(r.recycle_rate,1) + '%</span>'
      : '<span class="badge badge-amber">' + fmt(r.recycle_rate,1) + '%</span>';
    h += '<tr><td>' + fmtDate(r.date) + '</td><td>' + (r.dept||'—') + '</td><td>' + fmt(r.total_kg,2) + '</td><td>' + rateBadge + '</td><td>' + fmt(r.hazardous_kg,2) + '</td><td>' + (r.disposal_method||'—') + '</td><td>' + (r.notes||'') + '</td><td style="white-space:nowrap">' + actionBtns('waste', r) + '</td></tr>';
  });
  h += '</tbody></table>';
  document.getElementById('records-waste').innerHTML = h;
}

function renderPackaging(rows) {
  if (!rows.length) { document.getElementById('records-packaging').innerHTML = '<table><tbody><tr class="empty-row"><td colspan="7">ยังไม่มีข้อมูลเดือนนี้</td></tr></tbody></table>'; return; }
  let h = '<table><thead><tr><th>วันที่</th><th>หน่วยงาน</th><th>กล่อง (ใบ)</th><th>พลาสติก (kg)</th><th>เทปกาว (ม้วน)</th><th>Reuse (ชิ้น)</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r) {
    h += '<tr><td>' + fmtDate(r.date) + '</td><td>' + (r.dept||'—') + '</td><td>' + fmt(r.boxes,0) + '</td><td>' + fmt(r.plastic_kg,2) + '</td><td>' + fmt(r.tape_rolls,0) + '</td><td>' + fmt(r.reuse_pcs,0) + '</td><td style="white-space:nowrap">' + actionBtns('packaging', r) + '</td></tr>';
  });
  h += '</tbody></table>';
  document.getElementById('records-packaging').innerHTML = h;
}

function renderCarbon(rows) {
  if (!rows.length) { document.getElementById('records-carbon').innerHTML = '<table><tbody><tr class="empty-row"><td colspan="7">ยังไม่มีข้อมูลเดือนนี้</td></tr></tbody></table>'; return; }
  const fuelLabel = {};
  FUEL_TYPES.forEach(function(f) { fuelLabel[f.key] = f.label; });
  let h = '<table><thead><tr><th>วันที่</th><th>หน่วยงาน</th><th>เชื้อเพลิง</th><th>ปริมาณ</th><th>CO₂e (kg)</th><th>รถ/เครื่องจักร</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r) {
    h += '<tr><td>' + fmtDate(r.date) + '</td><td>' + (r.dept||'—') + '</td><td>' + (fuelLabel[r.fuel_type]||r.fuel_type||'—') + '</td><td>' + fmt(r.fuel_volume,2) + '</td><td><strong>' + fmt(r.co2e_kg,3) + '</strong></td><td>' + (r.vehicle_type||'—') + '</td><td style="white-space:nowrap">' + actionBtns('carbon', r) + '</td></tr>';
  });
  h += '</tbody></table>';
  document.getElementById('records-carbon').innerHTML = h;
}

// ── Form helpers ──────────────────────────────────────────────────────────────
function getForm(tab) {
  const f = document.getElementById('form-' + tab);
  const g = function(n) { const el = f.querySelector('[name="' + n + '"]'); return el ? el.value : ''; };
  const gn = function(n) { return Number(g(n)) || 0; };
  const base = { id: document.getElementById('edit-' + tab).value || null, date: g('date'), year: _year, month: _month, dept: g('dept'), notes: g('notes') };
  if (tab === 'energy')    return Object.assign(base, { electricity_kwh: gn('electricity_kwh'), electricity_cost: gn('electricity_cost'), machine_kwh: gn('machine_kwh'), forklift_kwh: gn('forklift_kwh') });
  if (tab === 'water')     return Object.assign(base, { water_m3: gn('water_m3'), water_cost: gn('water_cost'), leak_m3: gn('leak_m3'), saved_m3: gn('saved_m3'), water_source: g('water_source') });
  if (tab === 'waste')     return Object.assign(base, { general_kg: gn('general_kg'), recyclable_kg: gn('recyclable_kg'), paper_kg: gn('paper_kg'), plastic_kg: gn('plastic_kg'), packaging_kg: gn('packaging_kg'), hazardous_kg: gn('hazardous_kg'), disposal_method: g('disposal_method') });
  if (tab === 'packaging') return Object.assign(base, { boxes: gn('boxes'), plastic_kg: gn('plastic_kg'), tape_rolls: gn('tape_rolls'), cushion_kg: gn('cushion_kg'), reuse_pcs: gn('reuse_pcs') });
  if (tab === 'carbon')    return Object.assign(base, { fuel_type: g('fuel_type'), fuel_volume: gn('fuel_volume'), vehicle_type: g('vehicle_type'), distance_km: gn('distance_km'), co2e_manual: document.getElementById('chk-manual').checked, co2e_kg: gn('co2e_kg') });
  return base;
}

function clearForm(tab) {
  const f = document.getElementById('form-' + tab);
  f.reset();
  f.querySelector('[name="date"]').value = TODAY;
  document.getElementById('edit-' + tab).value = '';
  if (tab === 'carbon') {
    document.getElementById('co2e-display').textContent = '— kgCO₂e';
    document.getElementById('ef-display').textContent = '';
    document.getElementById('chk-manual').checked = false;
    document.getElementById('inp-co2e').style.display = 'none';
    document.getElementById('inp-co2e').disabled = true;
  }
}
window.clearForm = clearForm;

function fillForm(tab, row) {
  const f = document.getElementById('form-' + tab);
  const set = function(n, v) { const el = f.querySelector('[name="' + n + '"]'); if (el) el.value = v || ''; };
  document.getElementById('edit-' + tab).value = row.id || '';
  set('date', row.date); set('dept', row.dept); set('notes', row.notes);
  if (tab === 'energy')    { set('electricity_kwh', row.electricity_kwh); set('electricity_cost', row.electricity_cost); set('machine_kwh', row.machine_kwh); set('forklift_kwh', row.forklift_kwh); }
  if (tab === 'water')     { set('water_m3', row.water_m3); set('water_cost', row.water_cost); set('leak_m3', row.leak_m3); set('saved_m3', row.saved_m3); set('water_source', row.water_source); }
  if (tab === 'waste')     { set('general_kg', row.general_kg); set('recyclable_kg', row.recyclable_kg); set('paper_kg', row.paper_kg); set('plastic_kg', row.plastic_kg); set('packaging_kg', row.packaging_kg); set('hazardous_kg', row.hazardous_kg); set('disposal_method', row.disposal_method); }
  if (tab === 'packaging') { set('boxes', row.boxes); set('plastic_kg', row.plastic_kg); set('tape_rolls', row.tape_rolls); set('cushion_kg', row.cushion_kg); set('reuse_pcs', row.reuse_pcs); }
  if (tab === 'carbon')    { set('fuel_type', row.fuel_type); set('fuel_volume', row.fuel_volume); set('vehicle_type', row.vehicle_type); set('distance_km', row.distance_km); if (row.co2e_manual) { document.getElementById('chk-manual').checked = true; toggleManual(); } set('co2e_kg', row.co2e_kg); calcCO2e(); }
  f.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function editRow(tab, row) { fillForm(tab, row); }
window.editRow = editRow;

async function delRow(tab, id) {
  if (!confirm('ลบรายการนี้?')) return;
  try {
    await deleteRec(C[tab.toUpperCase()], id);
    toast('ลบแล้ว', 'success');
    loadTab(tab);
  } catch(e) { toast('ลบไม่สำเร็จ: ' + e.message, 'error'); }
}
window.delRow = delRow;

async function submitForm(e, tab) {
  e.preventDefault();
  const data = getForm(tab);
  if (!data.date) { toast('กรุณาเลือกวันที่', 'error'); return; }
  try {
    if (tab === 'energy')    await saveEnergy(data);
    if (tab === 'water')     await saveWater(data);
    if (tab === 'waste')     await saveWaste(data);
    if (tab === 'packaging') await savePackaging(data);
    if (tab === 'carbon')    await saveCarbon(data, _efMap);
    toast(data.id ? 'อัปเดตแล้ว ✓' : 'บันทึกแล้ว ✓', 'success');
    clearForm(tab);
    loadTab(tab);
  } catch(err) { toast('บันทึกไม่สำเร็จ: ' + err.message, 'error'); }
}
window.submitForm = submitForm;

// ── CO2e auto-calc ────────────────────────────────────────────────────────────
function calcCO2e() {
  const ft  = document.getElementById('sel-fuel').value;
  const vol = parseFloat(document.getElementById('inp-vol').value) || 0;
  const ef  = _efMap[ft];
  const manual = document.getElementById('chk-manual').checked;
  if (!manual && ef && vol > 0) {
    const co2e = Math.round(vol * ef.value * 1000) / 1000;
    document.getElementById('co2e-display').textContent = co2e.toFixed(3) + ' kgCO₂e';
    document.getElementById('inp-co2e').value = co2e;
    document.getElementById('ef-display').textContent = 'EF: ' + ef.value + ' ' + ef.unit + ' (' + ef.source + ')';
  } else if (!manual) {
    document.getElementById('co2e-display').textContent = '— kgCO₂e';
    document.getElementById('ef-display').textContent = '';
  }
}
window.calcCO2e = calcCO2e;

function toggleManual() {
  const on = document.getElementById('chk-manual').checked;
  const inp = document.getElementById('inp-co2e');
  inp.style.display = on ? 'block' : 'none';
  inp.disabled = !on;
  if (!on) calcCO2e();
}
window.toggleManual = toggleManual;

// ── Emission Factor modal ─────────────────────────────────────────────────────
function openEF() {
  const EF_LABELS = {
    electricity_grid: 'ไฟฟ้า (Grid)',
    diesel:           'ดีเซล',
    gasoline:         'เบนซิน',
    lpg:              'LPG',
    natural_gas:      'ก๊าซธรรมชาติ',
  };
  let html = '';
  Object.keys(EF_LABELS).forEach(function(k) {
    const ef = _efMap[k] || {};
    html += '<div class="ef-row">'
      + '<div><label>' + EF_LABELS[k] + '</label><input type="number" id="ef-' + k + '" value="' + (ef.value||'') + '" step="0.0001" min="0"></div>'
      + '<div class="unit">' + (ef.unit || '') + '</div>'
      + '<div><label>แหล่งอ้างอิง</label><input type="text" id="efsrc-' + k + '" value="' + (ef.source||'') + '"></div>'
      + '</div>';
  });
  document.getElementById('ef-fields').innerHTML = html;
  document.getElementById('modal-ef').style.display = 'flex';
}
window.openEF = openEF;

function closeEF() { document.getElementById('modal-ef').style.display = 'none'; }
window.closeEF = closeEF;

async function saveEF() {
  const EF_KEYS = ['electricity_grid','diesel','gasoline','lpg','natural_gas'];
  const data = {};
  EF_KEYS.forEach(function(k) {
    const v = parseFloat(document.getElementById('ef-' + k).value);
    const src = document.getElementById('efsrc-' + k).value;
    if (!isNaN(v)) data[k] = { value: v, unit: (_efMap[k]||{}).unit || '', source: src };
  });
  try {
    await saveEmissionFactors(data);
    _efMap = Object.assign(_efMap, data);
    toast('บันทึก Emission Factors แล้ว ✓', 'success');
    closeEF();
  } catch(e) { toast('บันทึกไม่สำเร็จ: ' + e.message, 'error'); }
}
window.saveEF = saveEF;

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  _efMap = await getEmissionFactors();
  loadTab('energy');
}
init();
</script>
