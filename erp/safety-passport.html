<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Safety Passport — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-bar select,.search-bar input{flex:1;min-width:120px}
.info-row{display:flex;gap:12px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
/* score ring */
.score-ring{width:72px;height:72px;border-radius:50%;border:5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.score-num{font-size:1.3rem;font-weight:800;line-height:1}
/* passport card */
.passport-card{background:linear-gradient(135deg,#1a237e,#283593);border-radius:14px;padding:18px;color:#fff;margin-bottom:16px}
.avatar{width:52px;height:52px;border-radius:50%;background:#3949ab;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;flex-shrink:0;border:2px solid rgba(255,255,255,.3)}
/* cert chip */
.cert-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;border:1.5px solid transparent;margin:2px;transition:all .15s;user-select:none}
/* cert row in form */
.cert-block{border:1px solid #e5e7eb;border-radius:9px;padding:10px 12px;margin-bottom:8px}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  PASSPORT_DEPARTMENTS, PASSPORT_CERTS, PASSPORT_STATUS, calcPassportScore,
  listSafetyPassport, getSafetyPassport, createSafetyPassport,
  updateSafetyPassport, deleteSafetyPassport
} from "./js/safety-data.js";

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-passport', 'Safety Passport รายบุคคล');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

let records  = [];
let editId   = null;
let formCerts= [];   // [{key, issueDate, expiryDate}]

function scoreColor(v) {
  if (v >= 90) return '#16a34a';
  if (v >= 70) return '#d97706';
  return '#dc2626';
}
function scoreLabel(v) {
  if (v >= 90) return 'ดี';
  if (v >= 70) return 'พอใช้';
  return 'ต้องปรับปรุง';
}
function initials(name) {
  return (name||'?').split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase();
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date()) / 86400000);
}

async function render() {
  records = await listSafetyPassport();
  const statusFilter = document.getElementById('filter-status')?.value || '';
  const deptFilter   = document.getElementById('filter-dept')?.value || '';
  const q            = document.getElementById('search-input')?.value.toLowerCase() || '';

  const active   = records.filter(r=>r.status==='active'||!r.status).length;
  const expiring = records.filter(r => (r.certs||[]).some(c => { const d=daysUntil(c.expiryDate); return d!==null && d>=0 && d<=30; })).length;
  const expired  = records.filter(r => (r.certs||[]).some(c => { const d=daysUntil(c.expiryDate); return d!==null && d<0; })).length;
  const avgScore = records.length ? Math.round(records.reduce((s,r)=>s+calcPassportScore(r),0)/records.length) : 0;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🪪 Safety Passport รายบุคคล</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ เพิ่มพนักงาน</button>
  </div>
  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${records.length}</div><div class="kpi-label">พนักงานทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${active}</div><div class="kpi-label">ทำงานอยู่</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${expiring}</div><div class="kpi-label">ใบรับรองใกล้หมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${expired}</div><div class="kpi-label">ใบรับรองหมดอายุ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:${scoreColor(avgScore)}">${avgScore||'-'}</div><div class="kpi-label">Safety Score เฉลี่ย</div></div>
  </div>
  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาชื่อ, รหัสพนักงาน..." oninput="window.__applyFilter()"/>
    <select id="filter-dept" onchange="window.__applyFilter()">
      <option value="">ทุกแผนก</option>
      ${PASSPORT_DEPARTMENTS.map(d=>`<option value="${esc(d)}" ${deptFilter===d?'selected':''}>${esc(d)}</option>`).join('')}
    </select>
    <select id="filter-status" onchange="window.__applyFilter()">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(PASSPORT_STATUS).map(([k,v])=>`<option value="${k}" ${statusFilter===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  </div>
  <div id="list-wrap">${renderList(applyFilter(records, q, statusFilter, deptFilter))}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">Safety Passport</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function applyFilter(list, q, status, dept) {
  return list.filter(r => {
    const matchQ = !q || (r.employeeName||'').toLowerCase().includes(q) || (r.employeeId||'').toLowerCase().includes(q) || (r.position||'').toLowerCase().includes(q);
    const st = r.status||'active';
    return matchQ && (!status || st===status) && (!dept || r.department===dept);
  });
}
window.__applyFilter = () => {
  const q  = document.getElementById('search-input')?.value.toLowerCase()||'';
  const s  = document.getElementById('filter-status')?.value||'';
  const d  = document.getElementById('filter-dept')?.value||'';
  document.getElementById('list-wrap').innerHTML = renderList(applyFilter(records, q, s, d));
};

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ยังไม่มีข้อมูลพนักงาน</p>`;
  return list.map(r => {
    const score = calcPassportScore(r);
    const col   = scoreColor(score);
    const st    = PASSPORT_STATUS[r.status||'active'];
    const expCerts = (r.certs||[]).filter(c=>{ const d=daysUntil(c.expiryDate); return d!==null && d<0; });
    const nearCerts= (r.certs||[]).filter(c=>{ const d=daysUntil(c.expiryDate); return d!==null && d>=0 && d<=30; });
    return `
    <div class="card" onclick="window.__openView('${r.id}')">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="avatar" style="font-size:1.1rem">${initials(r.employeeName)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:0.95rem">${esc(r.employeeName||'-')}</div>
          <div class="info-row">
            ${r.employeeId ? `<span>🪪 ${esc(r.employeeId)}</span>` : ''}
            <span>🏢 ${esc(r.department||'-')}</span>
            <span>💼 ${esc(r.position||'-')}</span>
          </div>
          <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px">
            <span class="badge" style="color:${st.color};background:${st.bg}">${st.label}</span>
            ${expCerts.length  ? `<span class="badge" style="color:#dc2626;background:#fee2e2">⚠️ ใบรับรองหมด ${expCerts.length} รายการ</span>` : ''}
            ${nearCerts.length ? `<span class="badge" style="color:#d97706;background:#fef3c7">⏳ ใกล้หมด ${nearCerts.length} รายการ</span>` : ''}
          </div>
        </div>
        <div class="score-ring" style="border-color:${col}">
          <div class="score-num" style="color:${col}">${score}</div>
          <div style="font-size:0.6rem;color:#9ca3af">Score</div>
        </div>
      </div>
      ${(r.certs||[]).length ? `
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:3px">
        ${(r.certs||[]).slice(0,6).map(c=>{
          const cert = PASSPORT_CERTS.find(p=>p.key===c.key);
          if (!cert) return '';
          const days = daysUntil(c.expiryDate);
          const expired = days!==null && days<0;
          const near = days!==null && days>=0 && days<=30;
          const bg = expired?'#fee2e2':near?'#fef3c7':'#f3f4f6';
          const col2 = expired?'#dc2626':near?'#d97706':cert.color;
          return `<span style="font-size:0.72rem;padding:2px 7px;border-radius:10px;background:${bg};color:${col2};font-weight:600">${cert.icon} ${cert.label.split(' ')[0]}</span>`;
        }).join('')}
        ${(r.certs||[]).length > 6 ? `<span style="font-size:0.72rem;color:#6b7280">+${(r.certs||[]).length-6}</span>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');
}

// ── view ──────────────────────────────────────────────────────────────────────
window.__openView = async (id) => {
  editId = id;
  const r = await getSafetyPassport(id);
  if (!r) return;
  const score = calcPassportScore(r);
  const col   = scoreColor(score);
  const st    = PASSPORT_STATUS[r.status||'active'];

  openPanel('Safety Passport');
  document.getElementById('panel-body').innerHTML = `
    <div class="passport-card">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
        <div class="avatar" style="width:60px;height:60px;font-size:1.5rem">${initials(r.employeeName)}</div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:1.1rem">${esc(r.employeeName||'-')}</div>
          <div style="font-size:0.82rem;opacity:.8">${esc(r.employeeId||'')} · ${esc(r.position||'-')}</div>
          <div style="font-size:0.82rem;opacity:.8">${esc(r.department||'-')}</div>
        </div>
        <div style="text-align:center">
          <div style="font-size:2rem;font-weight:900;color:${col==='#16a34a'?'#86efac':col==='#d97706'?'#fde68a':'#fca5a5'}">${score}</div>
          <div style="font-size:0.68rem;opacity:.7">Safety Score</div>
          <div style="font-size:0.75rem;font-weight:700;color:${col==='#16a34a'?'#86efac':col==='#d97706'?'#fde68a':'#fca5a5'}">${scoreLabel(score)}</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;font-size:0.78rem;opacity:.85;flex-wrap:wrap">
        <span>📅 เข้าทำงาน: ${fmtDate(r.startDate)}</span>
        <span>🩺 ตรวจสุขภาพ: ${fmtDate(r.lastHealthCheck)}</span>
        <span class="badge" style="color:#fff;background:rgba(255,255,255,.2)">${st.label}</span>
      </div>
    </div>

    ${r.violationCount ? `<div style="padding:8px 12px;background:#fef2f2;border-radius:8px;font-size:0.85rem;color:#dc2626;margin-bottom:12px">⚠️ บันทึกการฝ่าฝืนกฎ: <strong>${r.violationCount} ครั้ง</strong></div>` : ''}

    <div class="section-title">ใบรับรองและความสามารถ</div>
    ${(r.certs||[]).length ? (r.certs||[]).map(c=>{
      const cert = PASSPORT_CERTS.find(p=>p.key===c.key);
      if (!cert) return '';
      const days = daysUntil(c.expiryDate);
      const expired = days!==null && days<0;
      const near    = days!==null && days>=0 && days<=30;
      const statusTxt = expired ? `<span style="color:#dc2626;font-weight:700">⚠️ หมดอายุแล้ว ${Math.abs(days)} วัน</span>`
                      : near    ? `<span style="color:#d97706;font-weight:700">⏳ หมด ${days} วัน</span>`
                      : days !== null ? `<span style="color:#16a34a">✓ เหลือ ${days} วัน</span>`
                      : `<span style="color:#6b7280">ไม่มีวันหมดอายุ</span>`;
      return `
      <div class="cert-block" style="border-color:${expired?'#fca5a5':near?'#fde68a':'#e5e7eb'}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <span style="font-weight:700;color:${cert.color}">${cert.icon} ${cert.label}</span>
            ${c.certNo ? `<div style="font-size:0.78rem;color:#6b7280">เลขที่: ${esc(c.certNo)}</div>` : ''}
          </div>
          ${statusTxt}
        </div>
        <div style="display:flex;gap:16px;font-size:0.78rem;color:#6b7280;margin-top:4px">
          <span>ออกให้: ${fmtDate(c.issueDate)}</span>
          ${c.expiryDate ? `<span>หมดอายุ: ${fmtDate(c.expiryDate)}</span>` : ''}
          ${c.issuedBy ? `<span>โดย: ${esc(c.issuedBy)}</span>` : ''}
        </div>
      </div>`;
    }).join('') : '<p style="color:#9ca3af;font-size:0.85rem">ยังไม่มีใบรับรอง</p>'}

    ${r.trainingHistory ? `<div class="section-title">ประวัติการฝึกอบรม</div><div style="font-size:0.85rem;white-space:pre-wrap">${esc(r.trainingHistory)}</div>` : ''}
    ${r.remarks ? `<div class="section-title">หมายเหตุ</div><div style="font-size:0.85rem">${esc(r.remarks)}</div>` : ''}`;

  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__editRecord('${id}')">แก้ไข</button>
     <button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ปิด</button>`;
};

// ── form ──────────────────────────────────────────────────────────────────────
window.__openPanel = (id) => {
  editId   = id;
  formCerts= [];
  openPanel('เพิ่มพนักงาน');
  document.getElementById('panel-body').innerHTML = renderForm(null);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

window.__editRecord = async (id) => {
  editId = id;
  const r = await getSafetyPassport(id);
  if (!r) return;
  formCerts = JSON.parse(JSON.stringify(r.certs||[]));
  openPanel('แก้ไข Passport');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderForm(r) {
  return `
  <div class="form-row">
    <div>
      <label class="lbl" style="margin-top:0">ชื่อ-นามสกุล *</label>
      <input id="f-name" value="${esc(r?.employeeName||'')}"/>
    </div>
    <div>
      <label class="lbl" style="margin-top:0">รหัสพนักงาน</label>
      <input id="f-eid" value="${esc(r?.employeeId||'')}" placeholder="EMP-001"/>
    </div>
    <div>
      <label class="lbl">แผนก *</label>
      <select id="f-dept">
        <option value="">-- เลือก --</option>
        ${PASSPORT_DEPARTMENTS.map(d=>`<option value="${esc(d)}" ${r?.department===d?'selected':''}>${esc(d)}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">ตำแหน่ง</label>
      <input id="f-pos" value="${esc(r?.position||'')}"/>
    </div>
    <div>
      <label class="lbl">วันที่เข้าทำงาน</label>
      <input id="f-start" type="date" value="${r?.startDate||''}"/>
    </div>
    <div>
      <label class="lbl">ตรวจสุขภาพล่าสุด</label>
      <input id="f-health" type="date" value="${r?.lastHealthCheck||''}"/>
    </div>
    <div>
      <label class="lbl">สถานะ</label>
      <select id="f-status">
        ${Object.entries(PASSPORT_STATUS).map(([k,v])=>`<option value="${k}" ${(r?.status||'active')===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">จำนวนครั้งฝ่าฝืนกฎ</label>
      <input id="f-viol" type="number" min="0" value="${r?.violationCount||0}"/>
    </div>
  </div>

  <div class="section-title">ใบรับรองและความสามารถ</div>
  <div id="certs-wrap">${renderCertsForm()}</div>
  <button type="button" class="btn btn-ghost" style="margin-top:6px;width:100%" onclick="window.__addCert()">+ เพิ่มใบรับรอง</button>

  <div>
    <label class="lbl">ประวัติการฝึกอบรม (สรุป)</label>
    <textarea id="f-training" rows="3">${esc(r?.trainingHistory||'')}</textarea>
  </div>
  <div>
    <label class="lbl">หมายเหตุ</label>
    <textarea id="f-remarks">${esc(r?.remarks||'')}</textarea>
  </div>`;
}

function renderCertsForm() {
  if (!formCerts.length) return `<p style="color:#9ca3af;font-size:0.82rem;margin:4px 0">ยังไม่มีใบรับรอง กด "+ เพิ่มใบรับรอง" ด้านล่าง</p>`;
  return formCerts.map((c, i) => `
    <div class="cert-block" id="cert-block-${i}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <select id="cert-key-${i}" style="flex:1;margin:0" onchange="window.__updateCertKey(${i},this.value)">
          <option value="">-- เลือกใบรับรอง --</option>
          ${PASSPORT_CERTS.map(p=>`<option value="${p.key}" ${c.key===p.key?'selected':''}>${p.icon} ${p.label}</option>`).join('')}
        </select>
        <button type="button" class="btn btn-danger" style="padding:4px 10px;margin-left:6px" onclick="window.__removeCert(${i})">✕</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <div>
          <label class="lbl" style="margin-top:0;font-size:0.74rem">เลขที่ใบรับรอง</label>
          <input id="cert-no-${i}" value="${esc(c.certNo||'')}" placeholder="CERT-001" style="margin-top:2px"
                 oninput="formCerts[${i}].certNo=this.value"/>
        </div>
        <div>
          <label class="lbl" style="margin-top:0;font-size:0.74rem">ออกให้โดย</label>
          <input id="cert-by-${i}" value="${esc(c.issuedBy||'')}" placeholder="หน่วยงาน" style="margin-top:2px"
                 oninput="formCerts[${i}].issuedBy=this.value"/>
        </div>
        <div>
          <label class="lbl" style="margin-top:0;font-size:0.74rem">วันที่ออก</label>
          <input id="cert-iss-${i}" type="date" value="${c.issueDate||''}" style="margin-top:2px"
                 oninput="formCerts[${i}].issueDate=this.value"/>
        </div>
        <div>
          <label class="lbl" style="margin-top:0;font-size:0.74rem">วันหมดอายุ</label>
          <input id="cert-exp-${i}" type="date" value="${c.expiryDate||''}" style="margin-top:2px"
                 oninput="formCerts[${i}].expiryDate=this.value"/>
        </div>
      </div>
    </div>`).join('');
}

window.__addCert = () => {
  formCerts.push({ key:'', certNo:'', issuedBy:'', issueDate:'', expiryDate:'' });
  document.getElementById('certs-wrap').innerHTML = renderCertsForm();
};
window.__removeCert = (i) => {
  formCerts.splice(i, 1);
  document.getElementById('certs-wrap').innerHTML = renderCertsForm();
};
window.__updateCertKey = (i, val) => { formCerts[i].key = val; };

window.__save = async () => {
  const employeeName = document.getElementById('f-name')?.value.trim();
  const department   = document.getElementById('f-dept')?.value;
  if (!employeeName || !department) { alert('กรุณากรอกชื่อและเลือกแผนก'); return; }

  // sync cert inputs
  formCerts.forEach((c, i) => {
    c.certNo    = document.getElementById(`cert-no-${i}`)?.value.trim()||'';
    c.issuedBy  = document.getElementById(`cert-by-${i}`)?.value.trim()||'';
    c.issueDate = document.getElementById(`cert-iss-${i}`)?.value||'';
    c.expiryDate= document.getElementById(`cert-exp-${i}`)?.value||'';
  });

  const data = {
    employeeName,
    employeeId:     document.getElementById('f-eid')?.value.trim()||'',
    department,
    position:       document.getElementById('f-pos')?.value.trim()||'',
    startDate:      document.getElementById('f-start')?.value||'',
    lastHealthCheck:document.getElementById('f-health')?.value||'',
    status:         document.getElementById('f-status')?.value||'active',
    violationCount: parseInt(document.getElementById('f-viol')?.value)||0,
    certs:          formCerts.filter(c=>c.key),
    trainingHistory:document.getElementById('f-training')?.value.trim()||'',
    remarks:        document.getElementById('f-remarks')?.value.trim()||'',
  };
  try {
    if (editId) await updateSafetyPassport(editId, data);
    else await createSafetyPassport(data, profile.uid);
    window.__closePanel(); await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบ Passport นี้?')) return;
  await deleteSafetyPassport(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
