<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบความปลอดภัย — KPO Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b;">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
const profile = await requireRole(['safety_officer', 'kpo', 'admin', 'manager']);
renderShell(profile, 'safety-inspection', 'ตรวจสอบความปลอดภัย');
const mc = document.getElementById('main-content');
mc.innerHTML = comingSoon('ตรวจสอบความปลอดภัย (Safety Inspection)', 'สร้างแบบตรวจสอบ Checklist, บันทึกผลการตรวจ, ติดตาม Fail Items');
function comingSoon(title, desc) {
  return `<div style="padding:60px 24px;text-align:center;font-family:Sarabun,sans-serif">
    <div style="font-size:3rem;margin-bottom:16px">🔍</div>
    <div style="font-size:1.3rem;font-weight:700;color:#0f172a;margin-bottom:8px">${title}</div>
    <div style="color:#64748b;font-size:.9rem;max-width:400px;margin:0 auto">${desc}</div>
    <div style="margin-top:24px;display:inline-block;padding:8px 20px;background:#f1f5f9;border-radius:20px;font-size:.82rem;color:#64748b">Phase 2 — กำลังพัฒนา</div>
  </div>`;
}
</script>
</body>
</html>
