<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตรวจสอบความปลอดภัย — KPO Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b;">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listInspections, createInspection, updateInspection, getInspection,
  listInspectionTemplates, createInspectionTemplate, updateInspectionTemplate, deleteInspectionTemplate, getInspectionTemplate,
  DEFAULT_INSPECTION_ITEMS, DEFAULT_INSPECTION_CATEGORIES,
  INSPECTION_STATUS, DEPARTMENTS, createCapa
} from "./js/safety-data.js";

const $ = id => document.getElementById(id);
let _profile;
let _inspections = [], _templates = [];
// view: 'list' | 'templates' | 'conduct' | 'view'
let _view = 'list';
let _conductData = null; // { templateId, templateName, items: [{category,item,result,note,responsible,dueDate}] }
let _viewId = null;

// ─── main layout ──────────────────────────────────────────────────────────
function buildLayout() {
  const mc = document.getElementById('main-content');
  mc.innerHTML = `
  <style>
    .si{padding:0 20px 32px;max-width:1300px;margin:0 auto;}
    .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:20px 0 16px;}
    .page-title{font-size:1.2rem;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;}
    .tab-bar{display:flex;gap:4px;margin-bottom:16px;background:#f1f5f9;border-radius:10px;padding:4px;}
    .tab{padding:7px 18px;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;border:none;background:transparent;color:#64748b;transition:.15s;}
    .tab.active,.tab:hover{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(0,0,0,.1);}
    .btn{padding:7px 16px;border:none;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn-primary{background:#0891b2;color:#fff;} .btn-primary:hover{background:#0e7490;}
    .btn-green{background:#16a34a;color:#fff;} .btn-green:hover{background:#15803d;}
    .btn-ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;} .btn-ghost:hover{background:#e2e8f0;}
    .btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
    .btn-danger:hover{background:#fecaca;}
    .tbl-wrap{overflow-x:auto;}
    .tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
    .tbl th{text-align:left;padding:9px 12px;font-size:.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;background:#f8fafc;border-bottom:1.5px solid #e2e8f0;}
    .tbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;}
    .tbl tr:hover td{background:#f8fafc;cursor:pointer;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600;}
    .empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
    /* Conduct view */
    .conduct-header{background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;border-radius:14px;padding:20px 24px;margin-bottom:20px;}
    .conduct-header h2{font-size:1.1rem;font-weight:700;margin-bottom:4px;}
    .conduct-header .meta{font-size:.82rem;opacity:.85;}
    .progress-bar-wrap{background:rgba(255,255,255,.25);border-radius:10px;height:8px;margin-top:12px;}
    .progress-bar-fill{background:#fff;border-radius:10px;height:8px;transition:.3s;}
    .progress-label{font-size:.78rem;opacity:.85;margin-top:4px;}
    .category-section{margin-bottom:12px;}
    .category-title{font-size:.82rem;font-weight:700;color:#0891b2;padding:8px 12px;background:#ecfeff;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .checklist-item{background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;transition:.15s;}
    .checklist-item.pass{border-color:#16a34a;background:#f0fdf4;}
    .checklist-item.fail{border-color:#dc2626;background:#fff1f2;}
    .checklist-item.na{border-color:#e2e8f0;background:#f8fafc;opacity:.75;}
    .item-text{font-size:.85rem;color:#1e293b;margin-bottom:10px;font-weight:500;}
    .result-btns{display:flex;gap:8px;flex-wrap:wrap;}
    .result-btn{padding:6px 14px;border-radius:20px;border:2px solid #e2e8f0;font-family:Sarabun,sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;background:#fff;transition:.15s;}
    .result-btn.sel-pass{background:#dcfce7;border-color:#16a34a;color:#15803d;}
    .result-btn.sel-fail{background:#fee2e2;border-color:#dc2626;color:#dc2626;}
    .result-btn.sel-na{background:#f1f5f9;border-color:#94a3b8;color:#64748b;}
    .fail-detail{margin-top:10px;display:none;}
    .fail-detail.show{display:block;}
    .fail-detail input,.fail-detail textarea{width:100%;padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.82rem;box-sizing:border-box;margin-bottom:6px;}
    .fail-detail textarea{min-height:56px;resize:vertical;}
    .conduct-footer{position:sticky;bottom:0;background:#fff;border-top:1px solid #e2e8f0;padding:14px 0;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
    /* tpl card */
    .tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:4px;}
    .tpl-card{background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:18px;cursor:pointer;transition:.15s;}
    .tpl-card:hover{border-color:#0891b2;box-shadow:0 2px 8px rgba(8,145,178,.15);}
    .tpl-card-name{font-size:.95rem;font-weight:700;color:#0f172a;margin-bottom:4px;}
    .tpl-card-meta{font-size:.78rem;color:#94a3b8;}
    .tpl-card-actions{display:flex;gap:8px;margin-top:12px;}
    /* view detail */
    .view-header{background:#f8fafc;border-radius:12px;padding:16px 20px;margin-bottom:16px;}
    .view-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:#64748b;margin-top:6px;}
    .summary-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .sum-card{background:#fff;border-radius:10px;padding:12px 18px;flex:1;min-width:120px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.07);}
    .sum-card .val{font-size:1.6rem;font-weight:800;}
    .sum-card .lbl{font-size:.72rem;color:#64748b;margin-top:2px;}
    .fail-list{background:#fff;border-radius:12px;padding:16px;}
    .fail-item-row{padding:10px 0;border-bottom:1px solid #f1f5f9;}
    .fail-item-row:last-child{border-bottom:none;}
    /* forms */
    .form-group{margin-bottom:12px;}
    .form-label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:4px;}
    .req{color:#dc2626;}
    .form-ctrl{width:100%;padding:8px 11px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.85rem;color:#0f172a;box-sizing:border-box;}
    .form-ctrl:focus{outline:none;border-color:#0891b2;box-shadow:0 0 0 3px rgba(8,145,178,.1);}
    /* modal */
    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;}
    .modal-panel{background:#fff;height:100dvh;width:min(580px,100vw);overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;}
    .modal-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
    .modal-body{padding:20px;flex:1;}
    .modal-foot{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;}
    textarea.form-ctrl{resize:vertical;min-height:72px;}
  </style>

  <div class="si" id="mainView">
    <!-- content injected by renderView() -->
  </div>

  <div id="modalBg" class="modal-bg" style="display:none" onclick="__closeModal(event)">
    <div class="modal-panel">
      <div class="modal-head">
        <div style="font-size:1rem;font-weight:700;color:#0f172a" id="modalTitle">—</div>
        <button class="btn btn-ghost" onclick="__closeModal(null)" style="padding:4px 10px">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>`;
}

function renderView() {
  const mv = $('mainView');
  if (_view === 'list')      mv.innerHTML = listViewHTML();
  else if (_view === 'templates') mv.innerHTML = templatesViewHTML();
  else if (_view === 'conduct')   renderConductView(mv);
  else if (_view === 'view-result') renderResultView(mv);
}

// ─── List view ─────────────────────────────────────────────────────────────
function listViewHTML() {
  return `
  <div class="page-header">
    <div class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      ตรวจสอบความปลอดภัย
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="__setView('templates')">จัดการ Template</button>
      <button class="btn btn-primary" onclick="__openStartInspection()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        เริ่มการตรวจสอบ
      </button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active">ประวัติการตรวจ (${_inspections.length})</button>
  </div>

  ${_inspections.length === 0
    ? `<div class="empty-state"><div style="font-size:2.5rem">🔍</div><div style="margin-top:8px">ยังไม่มีประวัติการตรวจสอบ</div><div style="margin-top:4px;font-size:.8rem">กด "เริ่มการตรวจสอบ" เพื่อดำเนินการตรวจสอบ</div></div>`
    : `<div class="tbl-wrap"><table class="tbl">
      <thead><tr>
        <th>หมายเลข</th><th>วันที่</th><th>Template ที่ใช้</th><th>แผนก/พื้นที่</th>
        <th>ผล (Pass/Fail/NA)</th><th>ผู้ตรวจ</th><th>สถานะ</th>
      </tr></thead>
      <tbody>
      ${_inspections.map(r => {
        const s = INSPECTION_STATUS[r.status] || { label: r.status||'—', color:'#64748b', bg:'#f9fafb' };
        const passCount = (r.items||[]).filter(i => i.result==='pass').length;
        const failCount = (r.items||[]).filter(i => i.result==='fail').length;
        const naCount   = (r.items||[]).filter(i => i.result==='na').length;
        return `<tr onclick="__openViewResult('${r.id}')">
          <td style="font-weight:700;color:#0891b2">${r.inspId||r.id.slice(0,8)}</td>
          <td>${r.inspectionDate||'—'}</td>
          <td>${r.templateName||'—'}</td>
          <td>${r.area||r.department||'—'}</td>
          <td>
            <span style="color:#16a34a;font-weight:600">✓${passCount}</span>
            <span style="color:#dc2626;font-weight:600;margin-left:8px">✗${failCount}</span>
            <span style="color:#94a3b8;margin-left:8px">—${naCount}</span>
          </td>
          <td>${r.inspector||'—'}</td>
          <td><span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`
  }`;
}

// ─── Templates view ─────────────────────────────────────────────────────────
function templatesViewHTML() {
  return `
  <div class="page-header">
    <div class="page-title">จัดการ Template ตรวจสอบ</div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-ghost" onclick="__setView('list')">← กลับ</button>
      <button class="btn btn-primary" onclick="__openCreateTpl()">+ สร้าง Template ใหม่</button>
      <button class="btn btn-ghost" onclick="__createDefaultTpl()">สร้าง Default Template</button>
    </div>
  </div>

  <div class="tpl-grid">
    ${_templates.map(t => {
      const itemCount = (t.items||[]).length;
      const catCount  = new Set((t.items||[]).map(i => i.category)).size;
      return `<div class="tpl-card">
        <div class="tpl-card-name">${t.name||'ไม่ระบุชื่อ'}</div>
        <div class="tpl-card-meta">${catCount} หมวด · ${itemCount} รายการ</div>
        ${t.description ? `<div style="font-size:.78rem;color:#64748b;margin-top:6px">${t.description}</div>` : ''}
        <div class="tpl-card-actions">
          <button class="btn btn-primary" style="font-size:.8rem;padding:5px 12px" onclick="event.stopPropagation();__startFromTemplate('${t.id}')">ใช้ Template นี้</button>
          <button class="btn btn-ghost" style="font-size:.8rem;padding:5px 10px" onclick="event.stopPropagation();__openEditTpl('${t.id}')">แก้ไข</button>
          <button class="btn btn-danger" style="font-size:.8rem;padding:5px 10px" onclick="event.stopPropagation();__deleteTpl('${t.id}')">ลบ</button>
        </div>
      </div>`;
    }).join('')}
    ${_templates.length === 0 ? `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#94a3b8">ยังไม่มี Template กด "สร้าง Default Template" เพื่อสร้างแบบตรวจสอบมาตรฐาน</div>` : ''}
  </div>`;
}

// ─── Conduct view ──────────────────────────────────────────────────────────
function renderConductView(mv) {
  const items = _conductData.items;
  const total = items.length;
  const done  = items.filter(i => i.result && i.result !== '').length;
  const pct   = total > 0 ? Math.round(done/total*100) : 0;

  // Group by category
  const byCategory = {};
  for (const [idx, item] of items.entries()) {
    if (!byCategory[item.category]) byCategory[item.category] = [];
    byCategory[item.category].push({ ...item, _idx: idx });
  }

  mv.innerHTML = `
  <div class="conduct-header">
    <h2>${_conductData.templateName}</h2>
    <div class="meta">
      <span id="conductDate">${_conductData.date||''}</span> ·
      <span id="conductArea">${_conductData.area||''}</span> ·
      ผู้ตรวจ: <span id="conductInspector">${_conductData.inspector||''}</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressFill" style="width:${pct}%"></div>
    </div>
    <div class="progress-label" id="progressLabel">${done}/${total} รายการ (${pct}%)</div>
  </div>

  ${Object.entries(byCategory).map(([cat, catItems]) => `
    <div class="category-section">
      <div class="category-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        ${cat}
      </div>
      ${catItems.map(item => `
        <div class="checklist-item ${item.result||''}" id="ci_${item._idx}">
          <div class="item-text">${item.item}</div>
          <div class="result-btns">
            <button class="result-btn ${item.result==='pass'?'sel-pass':''}" onclick="__setResult(${item._idx},'pass')">✓ Pass</button>
            <button class="result-btn ${item.result==='fail'?'sel-fail':''}" onclick="__setResult(${item._idx},'fail')">✗ Fail</button>
            <button class="result-btn ${item.result==='na'?'sel-na':''}" onclick="__setResult(${item._idx},'na')">— N/A</button>
          </div>
          <div class="fail-detail ${item.result==='fail'?'show':''}" id="fd_${item._idx}">
            <textarea placeholder="รายละเอียด / สิ่งที่พบ..." oninput="__setNote(${item._idx},this.value)">${item.note||''}</textarea>
            <input type="text" placeholder="ผู้รับผิดชอบแก้ไข..." oninput="__setResponsible(${item._idx},this.value)" value="${item.responsible||''}">
            <input type="date" title="วันครบกำหนด" oninput="__setDueDate(${item._idx},this.value)" value="${item.dueDate||''}">
          </div>
        </div>`).join('')}
    </div>
  `).join('')}

  <div class="conduct-footer">
    <button class="btn btn-ghost" onclick="__setView('list')">ยกเลิก</button>
    <button class="btn btn-primary" onclick="__saveDraft()">บันทึก Draft</button>
    <button class="btn btn-green" onclick="__submitInspection()">ส่งผลการตรวจสอบ</button>
  </div>`;
}

window.__setResult = (idx, result) => {
  _conductData.items[idx].result = result;
  const ci  = document.getElementById(`ci_${idx}`);
  const fd  = document.getElementById(`fd_${idx}`);
  if (ci) { ci.className = `checklist-item ${result}`; }
  if (fd) { fd.className = `fail-detail ${result==='fail'?'show':''}`; }
  // update result buttons
  const btns = ci?.querySelectorAll('.result-btn');
  if (btns) {
    btns[0].className = `result-btn ${result==='pass'?'sel-pass':''}`;
    btns[1].className = `result-btn ${result==='fail'?'sel-fail':''}`;
    btns[2].className = `result-btn ${result==='na'?'sel-na':''}`;
  }
  updateProgress();
};

window.__setNote        = (idx, v) => { _conductData.items[idx].note = v; };
window.__setResponsible = (idx, v) => { _conductData.items[idx].responsible = v; };
window.__setDueDate     = (idx, v) => { _conductData.items[idx].dueDate = v; };

function updateProgress() {
  const total = _conductData.items.length;
  const done  = _conductData.items.filter(i => i.result).length;
  const pct   = total > 0 ? Math.round(done/total*100) : 0;
  const fill  = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  if (fill)  fill.style.width = pct + '%';
  if (label) label.textContent = `${done}/${total} รายการ (${pct}%)`;
}

async function saveDraft() {
  await saveInspection('draft');
  showToast('บันทึก Draft แล้ว ✓', '#0891b2');
}

async function submitInspection() {
  const unanswered = _conductData.items.filter(i => !i.result).length;
  if (unanswered > 0 && !confirm(`ยังมี ${unanswered} รายการที่ยังไม่ได้ตอบ ต้องการส่งผลเลยหรือไม่?`)) return;
  const id = await saveInspection('completed');
  // Auto-create CAPA for fail items
  const failItems = _conductData.items.filter(i => i.result === 'fail');
  for (const fi of failItems) {
    if (fi.responsible || fi.dueDate) {
      await createCapa({
        capaId: `CAPA-INS-${Date.now()}-${Math.random().toString(36).slice(2,6)}`,
        source: 'Safety Inspection',
        sourceRef: id,
        description: `[${fi.category}] ${fi.item}${fi.note?': '+fi.note:''}`,
        correctiveAction: 'ต้องกำหนดมาตรการแก้ไข',
        preventiveAction: '',
        assignedTo: fi.responsible || '',
        department: _conductData.area || '',
        startDate: new Date().toISOString().split('T')[0],
        dueDate: fi.dueDate || '',
      }, _profile.uid).catch(() => {});
    }
  }
  showToast(`ส่งผลการตรวจสอบแล้ว${failItems.length>0?` สร้าง CAPA ${failItems.filter(f=>f.responsible||f.dueDate).length} รายการ`:''} ✓`, '#16a34a');
  _inspections = await listInspections({ lim: 100 });
  _view = 'list';
  renderView();
}

async function saveInspection(status) {
  const passCount = _conductData.items.filter(i => i.result==='pass').length;
  const failCount = _conductData.items.filter(i => i.result==='fail').length;
  const naCount   = _conductData.items.filter(i => i.result==='na').length;
  const data = {
    inspId: `INS-${new Date().getFullYear()}${String(new Date().getMonth()+1).padStart(2,'0')}-${String(Math.floor(Math.random()*9000)+1000)}`,
    templateId: _conductData.templateId,
    templateName: _conductData.templateName,
    inspectionDate: _conductData.date,
    area: _conductData.area,
    department: _conductData.area,
    inspector: _conductData.inspector,
    items: _conductData.items,
    passCount, failCount, naCount,
    status,
  };
  const ref = await createInspection(data, _profile.uid);
  _conductData._savedId = ref.id;
  return ref.id;
}

// ─── Result view ─────────────────────────────────────────────────────────
async function openViewResult(id) {
  _viewId = id;
  const r = _inspections.find(x => x.id === id) || await getInspection(id);
  if (!r) return;
  _view = 'view-result';
  renderResultView($('mainView'), r);
}

function renderResultView(mv, r) {
  if (!r) { mv.innerHTML = '<div class="empty-state">ไม่พบข้อมูล</div>'; return; }
  const pass = r.passCount || (r.items||[]).filter(i=>i.result==='pass').length;
  const fail = r.failCount || (r.items||[]).filter(i=>i.result==='fail').length;
  const na   = r.naCount   || (r.items||[]).filter(i=>i.result==='na').length;
  const total = (r.items||[]).length;
  const s = INSPECTION_STATUS[r.status] || { label: r.status, color:'#64748b', bg:'#f9fafb' };
  const failItems = (r.items||[]).filter(i => i.result==='fail');
  const byCategory = {};
  for (const item of (r.items||[])) {
    if (!byCategory[item.category]) byCategory[item.category] = [];
    byCategory[item.category].push(item);
  }

  mv.innerHTML = `
  <div style="display:flex;align-items:center;gap:10px;padding:20px 0 8px;flex-wrap:wrap">
    <button class="btn btn-ghost" onclick="__setView('list')">← กลับ</button>
    <span style="font-size:1.1rem;font-weight:700;color:#0891b2">${r.inspId||r.id.slice(0,8)}</span>
    <span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span>
  </div>

  <div class="view-header">
    <div style="font-size:1rem;font-weight:700">${r.templateName||'—'}</div>
    <div class="view-meta">
      <span>📅 ${r.inspectionDate||'—'}</span>
      <span>📍 ${r.area||r.department||'—'}</span>
      <span>👤 ผู้ตรวจ: ${r.inspector||'—'}</span>
    </div>
  </div>

  <div class="summary-row">
    <div class="sum-card" style="border-top:3px solid #16a34a"><div class="val" style="color:#16a34a">${pass}</div><div class="lbl">Pass</div></div>
    <div class="sum-card" style="border-top:3px solid #dc2626"><div class="val" style="color:#dc2626">${fail}</div><div class="lbl">Fail</div></div>
    <div class="sum-card" style="border-top:3px solid #94a3b8"><div class="val" style="color:#94a3b8">${na}</div><div class="lbl">N/A</div></div>
    <div class="sum-card" style="border-top:3px solid #0891b2"><div class="val" style="color:#0891b2">${total>0?Math.round(pass/(total-na||1)*100):'—'}%</div><div class="lbl">Pass Rate</div></div>
  </div>

  ${failItems.length > 0 ? `
  <div style="font-size:.9rem;font-weight:700;color:#dc2626;margin-bottom:10px">⚠️ รายการที่ Fail (${failItems.length})</div>
  <div class="fail-list">
    ${failItems.map(fi => `
    <div class="fail-item-row">
      <div style="font-size:.8rem;color:#94a3b8;font-weight:600">${fi.category}</div>
      <div style="font-size:.85rem;font-weight:600;color:#dc2626;margin-top:2px">${fi.item}</div>
      ${fi.note ? `<div style="font-size:.82rem;color:#475569;margin-top:4px">${fi.note}</div>` : ''}
      <div style="display:flex;gap:16px;margin-top:6px;font-size:.78rem;color:#94a3b8;flex-wrap:wrap">
        ${fi.responsible ? `<span>👤 ${fi.responsible}</span>` : ''}
        ${fi.dueDate ? `<span>📅 ครบ ${fi.dueDate}</span>` : ''}
      </div>
    </div>`).join('')}
  </div>` : ''}

  <details style="margin-top:16px">
    <summary style="cursor:pointer;font-size:.85rem;font-weight:600;color:#0891b2;padding:8px 0">ดูรายการตรวจสอบทั้งหมด (${total} รายการ)</summary>
    <div style="margin-top:8px">
      ${Object.entries(byCategory).map(([cat, items]) => `
        <div style="margin-bottom:12px">
          <div style="font-size:.8rem;font-weight:700;color:#0891b2;padding:6px 10px;background:#ecfeff;border-radius:6px;margin-bottom:6px">${cat}</div>
          ${items.map(item => {
            const rc = item.result==='pass'?'#16a34a':item.result==='fail'?'#dc2626':'#94a3b8';
            const rl = item.result==='pass'?'Pass':item.result==='fail'?'Fail':item.result==='na'?'N/A':'—';
            return `<div style="display:flex;align-items:flex-start;gap:10px;padding:6px 8px;border-bottom:1px solid #f8fafc">
              <span style="color:${rc};font-weight:700;font-size:.78rem;min-width:36px">${rl}</span>
              <span style="font-size:.82rem;color:#334155">${item.item}</span>
            </div>`;
          }).join('')}
        </div>`).join('')}
    </div>
  </details>`;
}

// ─── Start inspection modal ───────────────────────────────────────────────
function openStartInspection() {
  $('modalTitle').textContent = 'เริ่มการตรวจสอบ';
  const tplOptions = _templates.map(t =>
    `<option value="${t.id}">${t.name} (${(t.items||[]).length} รายการ)</option>`
  ).join('');

  $('modalBody').innerHTML = `
  <div class="form-group">
    <label class="form-label">Template <span class="req">*</span></label>
    <select class="form-ctrl" id="mTpl">
      <option value="">-- เลือก Template --</option>
      ${tplOptions}
    </select>
    ${_templates.length === 0 ? `<div style="margin-top:6px;font-size:.78rem;color:#f59e0b">⚠️ ยังไม่มี Template กด "สร้าง Default Template" ก่อน</div>` : ''}
  </div>
  <div class="form-group">
    <label class="form-label">วันที่ตรวจ <span class="req">*</span></label>
    <input type="date" class="form-ctrl" id="mDate" value="${new Date().toISOString().split('T')[0]}">
  </div>
  <div class="form-group">
    <label class="form-label">พื้นที่/แผนก <span class="req">*</span></label>
    <select class="form-ctrl" id="mArea">
      <option value="">-- เลือก --</option>
      ${DEPARTMENTS.map(d => `<option value="${d}">${d}</option>`).join('')}
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">ผู้ตรวจสอบ <span class="req">*</span></label>
    <input type="text" class="form-ctrl" id="mInspector" value="${_profile.displayName || _profile.email || ''}">
  </div>`;

  $('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__closeModal(null)">ยกเลิก</button>
    <button class="btn btn-primary" onclick="__confirmStartInspection()">เริ่มตรวจสอบ →</button>`;
  $('modalBg').style.display = 'flex';
}

async function confirmStartInspection() {
  const tplId    = $('mTpl')?.value;
  const date     = $('mDate')?.value;
  const area     = $('mArea')?.value;
  const inspector= $('mInspector')?.value?.trim();
  if (!tplId || !date || !area || !inspector) { showToast('กรุณากรอกข้อมูลให้ครบ', '#dc2626'); return; }

  const tpl = _templates.find(t => t.id === tplId) || await getInspectionTemplate(tplId);
  if (!tpl) { showToast('ไม่พบ Template', '#dc2626'); return; }

  _conductData = {
    templateId: tplId,
    templateName: tpl.name,
    date, area, inspector,
    items: (tpl.items||[]).map(i => ({ ...i, result: '', note: '', responsible: '', dueDate: '' })),
  };
  closeModal(null);
  _view = 'conduct';
  renderView();
}

// ─── Template create/edit modal ───────────────────────────────────────────
function openCreateTpl() {
  $('modalTitle').textContent = 'สร้าง Template ใหม่';
  $('modalBody').innerHTML = tplFormHTML({ name:'', description:'', items:[] });
  $('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__closeModal(null)">ยกเลิก</button>
    <button class="btn btn-primary" onclick="__submitCreateTpl()">สร้าง Template</button>`;
  $('modalBg').style.display = 'flex';
}

function tplFormHTML(d) {
  return `
  <div class="form-group">
    <label class="form-label">ชื่อ Template <span class="req">*</span></label>
    <input type="text" class="form-ctrl" id="tName" value="${d.name||''}" placeholder="เช่น Weekly Warehouse Check">
  </div>
  <div class="form-group">
    <label class="form-label">คำอธิบาย</label>
    <input type="text" class="form-ctrl" id="tDesc" value="${d.description||''}" placeholder="รายละเอียดเพิ่มเติม">
  </div>
  <div style="font-size:.8rem;color:#64748b;margin-top:8px;padding:10px;background:#f8fafc;border-radius:8px">
    หลังสร้าง Template แล้ว สามารถเพิ่ม/ลบรายการตรวจสอบได้ในหน้าแก้ไข Template
  </div>`;
}

async function submitCreateTpl() {
  const name = $('tName')?.value?.trim();
  if (!name) { showToast('กรุณาระบุชื่อ Template', '#dc2626'); return; }
  const btn = $('modalFoot').querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = 'กำลังสร้าง...';
  try {
    await createInspectionTemplate({ name, description: $('tDesc')?.value?.trim()||'', items:[] }, _profile.uid);
    _templates = await listInspectionTemplates();
    closeModal(null);
    renderView();
    showToast('สร้าง Template แล้ว ✓', '#16a34a');
  } catch(e) {
    btn.disabled = false; btn.textContent = 'สร้าง Template';
    showToast('เกิดข้อผิดพลาด: ' + e.message, '#dc2626');
  }
}

async function openEditTpl(id) {
  const t = _templates.find(x => x.id === id) || await getInspectionTemplate(id);
  if (!t) return;
  $('modalTitle').textContent = 'แก้ไข Template';
  const items = t.items || [];

  $('modalBody').innerHTML = `
  <div class="form-group">
    <label class="form-label">ชื่อ Template <span class="req">*</span></label>
    <input type="text" class="form-ctrl" id="etName" value="${t.name||''}">
  </div>
  <div class="form-group">
    <label class="form-label">คำอธิบาย</label>
    <input type="text" class="form-ctrl" id="etDesc" value="${t.description||''}">
  </div>
  <div style="font-size:.8rem;font-weight:600;color:#0891b2;margin:14px 0 8px">รายการตรวจสอบ (${items.length} รายการ)</div>
  <div id="itemList">
    ${items.map((item, i) => `
    <div id="tplItem_${i}" style="display:flex;gap:8px;margin-bottom:6px">
      <input type="text" class="form-ctrl" value="${item.category||''}" placeholder="หมวด" style="width:35%">
      <input type="text" class="form-ctrl" value="${item.item||''}" placeholder="รายการตรวจ" style="flex:1">
      <button onclick="this.parentElement.remove()" style="padding:4px 8px;border:1px solid #fca5a5;border-radius:6px;background:#fee2e2;color:#dc2626;cursor:pointer;font-size:.8rem">✕</button>
    </div>`).join('')}
  </div>
  <button class="btn btn-ghost" onclick="__addTplItem()" style="margin-top:8px;width:100%">+ เพิ่มรายการ</button>`;

  $('modalFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__closeModal(null)">ยกเลิก</button>
    <button class="btn btn-primary" onclick="__submitEditTpl('${id}')">บันทึกการแก้ไข</button>`;
  $('modalBg').style.display = 'flex';
}

window.__addTplItem = () => {
  const list = document.getElementById('itemList');
  const n = list.children.length;
  const row = document.createElement('div');
  row.id = `tplItem_${n}`;
  row.style.cssText = 'display:flex;gap:8px;margin-bottom:6px';
  row.innerHTML = `
    <input type="text" class="form-ctrl" placeholder="หมวด" style="width:35%">
    <input type="text" class="form-ctrl" placeholder="รายการตรวจ" style="flex:1">
    <button onclick="this.parentElement.remove()" style="padding:4px 8px;border:1px solid #fca5a5;border-radius:6px;background:#fee2e2;color:#dc2626;cursor:pointer;font-size:.8rem">✕</button>`;
  list.appendChild(row);
};

async function submitEditTpl(id) {
  const name = document.getElementById('etName')?.value?.trim();
  if (!name) { showToast('กรุณาระบุชื่อ Template', '#dc2626'); return; }
  const rows = document.getElementById('itemList')?.children || [];
  const items = [];
  for (const row of rows) {
    const inputs = row.querySelectorAll('input');
    const cat  = inputs[0]?.value?.trim();
    const item = inputs[1]?.value?.trim();
    if (cat && item) items.push({ category: cat, item });
  }
  const btn = $('modalFoot').querySelector('.btn-primary');
  btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try {
    await updateInspectionTemplate(id, { name, description: document.getElementById('etDesc')?.value?.trim()||'', items });
    _templates = await listInspectionTemplates();
    closeModal(null);
    renderView();
    showToast('บันทึก Template แล้ว ✓', '#16a34a');
  } catch(e) {
    btn.disabled = false; btn.textContent = 'บันทึกการแก้ไข';
    showToast('เกิดข้อผิดพลาด: ' + e.message, '#dc2626');
  }
}

async function deleteTpl(id) {
  if (!confirm('ลบ Template นี้หรือไม่?')) return;
  await deleteInspectionTemplate(id);
  _templates = await listInspectionTemplates();
  renderView();
  showToast('ลบ Template แล้ว ✓', '#0891b2');
}

async function createDefaultTpl() {
  if (!confirm('สร้าง Default Warehouse Safety Checklist Template หรือไม่?')) return;
  await createInspectionTemplate({
    name: 'Warehouse Safety Checklist (มาตรฐาน)',
    description: 'แบบตรวจสอบมาตรฐานสำหรับคลังสินค้า',
    items: DEFAULT_INSPECTION_ITEMS,
  }, _profile.uid);
  _templates = await listInspectionTemplates();
  renderView();
  showToast('สร้าง Default Template แล้ว ✓', '#16a34a');
}

async function startFromTemplate(id) {
  const t = _templates.find(x => x.id === id);
  if (t && (!t.items || t.items.length === 0)) {
    showToast('Template นี้ยังไม่มีรายการ กรุณาเพิ่มรายการก่อน', '#f59e0b');
    return;
  }
  openStartInspection();
  // pre-select template after modal opens
  setTimeout(() => { const sel = $('mTpl'); if (sel) sel.value = id; }, 50);
}

function showToast(msg, color = '#16a34a') {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:24px;right:24px;background:${color};color:#fff;padding:12px 20px;border-radius:10px;font-family:Sarabun,sans-serif;font-size:.85rem;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function closeModal(e) {
  if (e && e.target !== $('modalBg')) return;
  $('modalBg').style.display = 'none';
}

window.__setView              = v => { _view = v; renderView(); };
window.__openStartInspection  = openStartInspection;
window.__confirmStartInspection = confirmStartInspection;
window.__openViewResult       = openViewResult;
window.__openCreateTpl        = openCreateTpl;
window.__openEditTpl          = openEditTpl;
window.__submitCreateTpl      = submitCreateTpl;
window.__submitEditTpl        = submitEditTpl;
window.__deleteTpl            = deleteTpl;
window.__createDefaultTpl     = createDefaultTpl;
window.__startFromTemplate    = startFromTemplate;
window.__saveDraft            = saveDraft;
window.__submitInspection     = submitInspection;
window.__closeModal           = closeModal;

_profile = await requireRole(['safety_officer','kpo','admin','manager','warehouse']);
renderShell(_profile, 'safety-inspection', 'ตรวจสอบความปลอดภัย');
buildLayout();
const [insp, tpls] = await Promise.all([listInspections({ lim: 100 }), listInspectionTemplates()]);
_inspections = insp;
_templates = tpls;
renderView();
</script>
</body>
</html>
