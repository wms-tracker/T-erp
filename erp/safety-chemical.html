<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ทะเบียนสารเคมีอันตราย — KPO Safety</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/safety.css">
  <style>
    /* Filter / search bar */
    .top-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem;align-items:center}
    .top-bar input[type=search]{padding:.38rem .7rem;border-radius:8px;border:1px solid #cbd5e1;
      font-size:.85rem;min-width:200px;flex:1}
    .filt-btn{padding:.3rem .8rem;border-radius:999px;border:1px solid #cbd5e1;background:#fff;
              font-size:.78rem;cursor:pointer;white-space:nowrap;transition:all .15s}
    .filt-btn.active{background:#1e3a5f;color:#fff;border-color:#1e3a5f}

    /* Summary */
    .sum-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.6rem;margin-bottom:1.2rem}
    .sum-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:.7rem .5rem;text-align:center}
    .sum-card .n{font-size:1.5rem;font-weight:700;line-height:1}
    .sum-card .l{font-size:.7rem;color:#64748b;margin-top:.2rem}

    /* Table */
    .chem-table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;
                overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);font-size:.83rem;margin-bottom:4rem}
    .chem-table th{background:#f8fafc;padding:.55rem .75rem;text-align:left;color:#64748b;
                    font-weight:600;font-size:.78rem;border-bottom:1px solid #e2e8f0;white-space:nowrap}
    .chem-table td{padding:.55rem .75rem;border-bottom:1px solid #f1f5f9;vertical-align:middle;color:#374151}
    .chem-table tr:hover td{background:#fafbff;cursor:pointer}
    .ghs-chip{display:inline-flex;align-items:center;gap:.2rem;padding:.1rem .4rem;
              border-radius:999px;font-size:.7rem;font-weight:600;margin:.1rem .1rem 0 0}
    .sds-ok{color:#16a34a;font-size:.75rem}
    .sds-warn{color:#d97706;font-size:.75rem}
    .sds-exp{color:#dc2626;font-size:.75rem}

    /* Slide panel */
    .panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100}
    .panel-overlay.open{display:block}
    .side-panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);
                background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);
                transform:translateX(100%);transition:transform .25s;
                display:flex;flex-direction:column;z-index:101;overflow:hidden}
    .side-panel.open{transform:none}
    .panel-header{padding:1rem 1.2rem;border-bottom:1px solid #e2e8f0;display:flex;
                  align-items:center;justify-content:space-between;flex-shrink:0}
    .panel-header h3{margin:0;font-size:1rem;color:#1e3a5f}
    .panel-body{flex:1;overflow-y:auto;padding:1.2rem}
    .panel-footer{padding:.8rem 1.2rem;border-top:1px solid #e2e8f0;display:flex;gap:.5rem;
                  justify-content:flex-end;flex-shrink:0}

    /* Form */
    .fg{margin-bottom:.9rem}
    .fg label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:.3rem}
    .fg input,.fg select,.fg textarea{width:100%;padding:.45rem .65rem;border-radius:7px;
      border:1px solid #cbd5e1;font-size:.85rem;box-sizing:border-box}
    .fg textarea{min-height:75px;resize:vertical}
    .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
    .fg-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.6rem}
    .ghs-picker{display:flex;flex-wrap:wrap;gap:.35rem}
    .ghs-pick-btn{padding:.25rem .55rem;border-radius:999px;border:1px solid #cbd5e1;
                  font-size:.75rem;cursor:pointer;background:#fff;transition:all .15s;white-space:nowrap}
    .ghs-pick-btn.sel{border-color:#1e3a5f;background:#eff6ff;color:#1e3a5f;font-weight:600}

    /* Detail sections */
    .ds{margin-bottom:1.1rem}
    .ds h4{font-size:.78rem;font-weight:700;color:#64748b;text-transform:uppercase;
           letter-spacing:.06em;margin:0 0 .5rem;padding-bottom:.3rem;border-bottom:1px solid #f1f5f9}
    .info-grid{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;font-size:.83rem}
    .info-grid .k{color:#64748b;white-space:nowrap}
    .info-grid .v{color:#1e293b}
    .hazard-box{background:#fff8f8;border:1px solid #fecdd3;border-radius:8px;padding:.7rem .9rem;
                font-size:.82rem;color:#374151;line-height:1.5;margin-bottom:.5rem}
    .hazard-box .hb-title{font-weight:700;color:#dc2626;margin-bottom:.3rem;font-size:.8rem}
    .warn-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:.7rem .9rem;
              font-size:.82rem;color:#374151;line-height:1.5;margin-bottom:.5rem}
    .warn-box .wb-title{font-weight:700;color:#d97706;margin-bottom:.3rem;font-size:.8rem}
    .badge{display:inline-block;padding:.15rem .5rem;border-radius:999px;font-size:.7rem;font-weight:600}

    /* FAB */
    .fab{position:fixed;bottom:2rem;right:2rem;width:52px;height:52px;border-radius:50%;
         background:#1e3a5f;color:#fff;font-size:1.4rem;border:none;cursor:pointer;
         box-shadow:0 4px 16px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;
         transition:transform .15s}
    .fab:hover{transform:scale(1.08)}

    /* SDS expiry indicator */
    .sds-bar{height:4px;border-radius:2px;margin-top:.2rem}

    @media(max-width:600px){
      .chem-table .hide-sm{display:none}
    }
    @media print{
      .fab,.top-bar .no-print,.panel-overlay,.side-panel{display:none!important}
      .chem-table{font-size:.75rem}
    }
  </style>
</head>
<body>

<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell }  from './js/shell.js';
import {
  GHS_CLASSES, PHYSICAL_STATES, CHEM_STATUS,
  listChemicals, getChemical,
  createChemical, updateChemical, deleteChemical,
} from './js/safety-data.js';
import './js/safety-attach.js';

const _profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(_profile, 'safety-chemical', 'ทะเบียนสารเคมีอันตราย');
main.insertAdjacentHTML('afterbegin', `
<div class="panel-overlay" id="panelOverlay" onclick="window.__ch_closePanel()"></div>
<div class="side-panel" id="sidePanel">
  <div class="panel-header">
    <h3 id="panelTitle">สารเคมี</h3>
    <button class="btn-icon" onclick="window.__ch_closePanel()">✕</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
  <div class="panel-footer" id="panelFooter"></div>
</div>

<button class="fab no-print" title="เพิ่มสารเคมี" onclick="window.__ch_openNew()">＋</button>
`);

let _all  = [];
let _shown = [];
let _filterGhs = 'all';
let _search    = '';

const ghsMap = Object.fromEntries(GHS_CLASSES.map(g => [g.key, g]));
const today  = new Date(); today.setHours(0,0,0,0);

function daysLeft(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - today) / 86400000);
}
function sdsStatus(dateStr) {
  const d = daysLeft(dateStr);
  if (d === null) return { cls: '', txt: '—' };
  if (d < 0)   return { cls: 'sds-exp',  txt: `หมดอายุ ${Math.abs(d)} วันที่แล้ว` };
  if (d <= 30) return { cls: 'sds-warn', txt: `เหลือ ${d} วัน` };
  return { cls: 'sds-ok', txt: `เหลือ ${d} วัน` };
}
const badge = (l,c,bg) => `<span class="badge" style="color:${c};background:${bg}">${l}</span>`;

/* ── load ── */
async function load() {
  _all = await listChemicals({});
  applyFilter();
}

/* ── filter ── */
function applyFilter() {
  let rows = [..._all];
  if (_filterGhs !== 'all') rows = rows.filter(r => (r.ghsClasses||[]).includes(_filterGhs));
  if (_search) {
    const q = _search.toLowerCase();
    rows = rows.filter(r =>
      (r.nameTh||'').toLowerCase().includes(q) ||
      (r.nameEn||'').toLowerCase().includes(q) ||
      (r.casNumber||'').includes(q) ||
      (r.location||'').toLowerCase().includes(q)
    );
  }
  _shown = rows;
  renderStats();
  renderTable();
}

window.__ch_search = v => { _search = v; applyFilter(); };
window.__ch_filterGhs = key => {
  _filterGhs = key;
  document.querySelectorAll('.filt-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  applyFilter();
};

/* ── stats ── */
function renderStats() {
  const expiredSds  = _all.filter(c => daysLeft(c.sdsExpiry) !== null && daysLeft(c.sdsExpiry) < 0).length;
  const warnSds     = _all.filter(c => { const d=daysLeft(c.sdsExpiry); return d!==null&&d>=0&&d<=30; }).length;
  const lowStock    = _all.filter(c => c.status === 'low_stock').length;
  const ghsCount    = new Set(_all.flatMap(c => c.ghsClasses||[])).size;
  document.getElementById('chStats').innerHTML = `
    <div class="sum-card"><div class="n">${_all.length}</div><div class="l">สารเคมีทั้งหมด</div></div>
    <div class="sum-card"><div class="n" style="color:#dc2626">${expiredSds}</div><div class="l">☠️ SDS หมดอายุ</div></div>
    <div class="sum-card"><div class="n" style="color:#d97706">${warnSds}</div><div class="l">⚠️ SDS ใกล้หมด</div></div>
    <div class="sum-card"><div class="n" style="color:#d97706">${lowStock}</div><div class="l">📦 สต็อกต่ำ</div></div>
    <div class="sum-card"><div class="n" style="color:#1e3a5f">${ghsCount}</div><div class="l">ประเภทอันตราย GHS</div></div>`;
}

/* ── table ── */
function renderTable() {
  if (!_shown.length) {
    document.getElementById('chTable').innerHTML =
      `<tr><td colspan="7" style="text-align:center;padding:2.5rem;color:#94a3b8">
         ไม่พบสารเคมีที่ตรงเงื่อนไข</td></tr>`;
    return;
  }
  document.getElementById('chTable').innerHTML = _shown.map(c => {
    const ghsChips = (c.ghsClasses||[]).map(k => {
      const g = ghsMap[k];
      return g ? `<span class="ghs-chip" style="color:${g.color};background:${g.bg}">${g.symbol} ${g.label}</span>` : '';
    }).join('');
    const st   = CHEM_STATUS[c.status] || CHEM_STATUS.active;
    const sds  = sdsStatus(c.sdsExpiry);
    return `
    <tr onclick="window.__ch_view('${c.id}')">
      <td><div style="font-weight:600;color:#1e293b">${c.nameTh||'—'}</div>
          <div style="font-size:.75rem;color:#94a3b8">${c.nameEn||''}</div></td>
      <td class="hide-sm" style="font-size:.78rem;color:#64748b">${c.casNumber||'—'}</td>
      <td>${ghsChips||'<span style="color:#94a3b8;font-size:.75rem">—</span>'}</td>
      <td class="hide-sm">${c.location||'—'}</td>
      <td class="hide-sm"><span class="${sds.cls}">${sds.txt}</span></td>
      <td>${badge(st.label,st.color,st.bg)}</td>
      <td style="text-align:right;font-size:.8rem;color:#64748b">${c.quantity||0} ${c.unit||''}</td>
    </tr>`;
  }).join('');
}

/* ── panel ── */
function openPanel(title, body, footer = '') {
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelBody').innerHTML = body;
  document.getElementById('panelFooter').innerHTML = footer;
  document.getElementById('panelOverlay').classList.add('open');
  document.getElementById('sidePanel').classList.add('open');
}
window.__ch_closePanel = () => {
  document.getElementById('panelOverlay').classList.remove('open');
  document.getElementById('sidePanel').classList.remove('open');
};

/* ── GHS multi-picker ── */
let _selGhs = [];
window.__ch_toggleGhs = key => {
  const i = _selGhs.indexOf(key);
  if (i === -1) _selGhs.push(key); else _selGhs.splice(i, 1);
  document.querySelectorAll('.ghs-pick-btn').forEach(b =>
    b.classList.toggle('sel', _selGhs.includes(b.dataset.ghs)));
};
function ghsPicker(selected = []) {
  _selGhs = [...selected];
  return `<div class="ghs-picker">${GHS_CLASSES.map(g =>
    `<button type="button" class="ghs-pick-btn ${selected.includes(g.key)?'sel':''}"
             data-ghs="${g.key}" onclick="window.__ch_toggleGhs('${g.key}')">
       ${g.symbol} ${g.label}</button>`).join('')}</div>`;
}

/* ── form ── */
function formHTML(c = {}) {
  const stOpts = Object.entries(CHEM_STATUS).map(([k,v]) =>
    `<option value="${k}" ${(c.status||'active')===k?'selected':''}>${v.label}</option>`).join('');
  const psOpts = PHYSICAL_STATES.map(p =>
    `<option value="${p.key}" ${c.physicalState===p.key?'selected':''}>${p.label}</option>`).join('');
  return `
    <div class="fg-row">
      <div class="fg"><label>ชื่อสารเคมี (ภาษาไทย) *</label>
        <input id="f_nameTh" value="${c.nameTh||''}" placeholder="เช่น กรดกำมะถัน"></div>
      <div class="fg"><label>ชื่อสารเคมี (ภาษาอังกฤษ)</label>
        <input id="f_nameEn" value="${c.nameEn||''}" placeholder="Sulfuric Acid"></div>
    </div>
    <div class="fg-row3">
      <div class="fg"><label>CAS Number</label>
        <input id="f_cas" value="${c.casNumber||''}" placeholder="7664-93-9"></div>
      <div class="fg"><label>สถานะทางกายภาพ</label>
        <select id="f_ps">${psOpts}</select></div>
      <div class="fg"><label>สถานะสต็อก</label>
        <select id="f_status">${stOpts}</select></div>
    </div>
    <div class="fg">
      <label>ประเภทอันตราย GHS (เลือกได้หลายประเภท)</label>
      ${ghsPicker(c.ghsClasses||[])}
    </div>
    <div class="fg-row">
      <div class="fg"><label>ปริมาณที่มี</label>
        <input type="number" id="f_qty" value="${c.quantity||0}" min="0"></div>
      <div class="fg"><label>หน่วย</label>
        <input id="f_unit" value="${c.unit||''}" placeholder="ลิตร / กก. / ถัง"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>สถานที่เก็บ</label>
        <input id="f_loc" value="${c.location||''}" placeholder="เช่น ห้องเคมี ชั้น 1"></div>
      <div class="fg"><label>ผู้ผลิต / ผู้จัดจำหน่าย</label>
        <input id="f_supplier" value="${c.supplier||''}" placeholder="ชื่อบริษัท"></div>
    </div>
    <div class="fg-row">
      <div class="fg"><label>วันที่ SDS / MSDS หมดอายุ</label>
        <input type="date" id="f_sdsExp" value="${c.sdsExpiry||''}"></div>
      <div class="fg"><label>เลขที่เอกสาร SDS</label>
        <input id="f_sdsRef" value="${c.sdsRef||''}" placeholder="SDS-001"></div>
    </div>
    <div class="fg"><label>เงื่อนไขการเก็บรักษา</label>
      <textarea id="f_storage">${c.storageCondition||''}</textarea></div>
    <div class="fg"><label>วิธีปฐมพยาบาล (First Aid)</label>
      <textarea id="f_firstaid">${c.firstAid||''}</textarea></div>
    <div class="fg"><label>วิธีดับเพลิง (Fire Fighting)</label>
      <textarea id="f_fire">${c.fireFighting||''}</textarea></div>
    <div class="fg"><label>วิธีรับมือหกรั่วไหล (Spill)</label>
      <textarea id="f_spill">${c.spillResponse||''}</textarea></div>
    <div class="fg"><label>PPE ที่ต้องใช้</label>
      <input id="f_ppe" value="${c.ppe||''}" placeholder="เช่น ถุงมือยาง, หน้ากากคาร์บอน, แว่นตานิรภัย"></div>
    <div class="fg"><label>หมายเหตุ</label>
      <textarea id="f_notes">${c.notes||''}</textarea></div>`;
}

function collectForm() {
  return {
    nameTh:          document.getElementById('f_nameTh')?.value.trim(),
    nameEn:          document.getElementById('f_nameEn')?.value.trim(),
    casNumber:       document.getElementById('f_cas')?.value.trim(),
    physicalState:   document.getElementById('f_ps')?.value,
    status:          document.getElementById('f_status')?.value,
    ghsClasses:      [..._selGhs],
    quantity:        +document.getElementById('f_qty')?.value || 0,
    unit:            document.getElementById('f_unit')?.value.trim(),
    location:        document.getElementById('f_loc')?.value.trim(),
    supplier:        document.getElementById('f_supplier')?.value.trim(),
    sdsExpiry:       document.getElementById('f_sdsExp')?.value,
    sdsRef:          document.getElementById('f_sdsRef')?.value.trim(),
    storageCondition:document.getElementById('f_storage')?.value.trim(),
    firstAid:        document.getElementById('f_firstaid')?.value.trim(),
    fireFighting:    document.getElementById('f_fire')?.value.trim(),
    spillResponse:   document.getElementById('f_spill')?.value.trim(),
    ppe:             document.getElementById('f_ppe')?.value.trim(),
    notes:           document.getElementById('f_notes')?.value.trim(),
  };
}

/* ── new ── */
window.__ch_openNew = () => {
  openPanel('เพิ่มสารเคมี', formHTML(),
    `<button class="btn" onclick="window.__ch_closePanel()">ยกเลิก</button>
     <button class="btn btn-primary" onclick="window.__ch_saveNew()">💾 บันทึก</button>`);
};
window.__ch_saveNew = async () => {
  const data = collectForm();
  if (!data.nameTh) { alert('กรุณาระบุชื่อสารเคมี'); return; }
  await createChemical(data, _profile.uid);
  window.__ch_closePanel();
  await load();
};

/* ── view ── */
window.__ch_view = async id => {
  const c = await getChemical(id);
  if (!c) return;
  const st  = CHEM_STATUS[c.status] || CHEM_STATUS.active;
  const sds = sdsStatus(c.sdsExpiry);
  const ps  = PHYSICAL_STATES.find(p => p.key === c.physicalState);
  const ghsChips = (c.ghsClasses||[]).map(k => {
    const g = ghsMap[k];
    return g ? `<span class="ghs-chip" style="color:${g.color};background:${g.bg};font-size:.78rem">${g.symbol} ${g.label}</span>` : '';
  }).join('');

  openPanel(c.nameTh||'—', `
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem">
      ${badge(st.label,st.color,st.bg)}
      ${c.nameEn ? `<span style="font-size:.8rem;color:#64748b">${c.nameEn}</span>` : ''}
    </div>

    ${ghsChips ? `<div style="margin-bottom:1rem">${ghsChips}</div>` : ''}

    <div class="ds"><h4>ข้อมูลทั่วไป</h4>
      <div class="info-grid">
        <span class="k">CAS Number</span><span class="v">${c.casNumber||'—'}</span>
        <span class="k">สถานะทางกายภาพ</span><span class="v">${ps?.label||'—'}</span>
        <span class="k">ปริมาณสต็อก</span><span class="v">${c.quantity||0} ${c.unit||''}</span>
        <span class="k">สถานที่เก็บ</span><span class="v">${c.location||'—'}</span>
        <span class="k">ผู้จัดจำหน่าย</span><span class="v">${c.supplier||'—'}</span>
        <span class="k">เลขที่ SDS</span><span class="v">${c.sdsRef||'—'}</span>
        <span class="k">SDS หมดอายุ</span>
        <span class="v"><span class="${sds.cls}">${c.sdsExpiry||'—'} ${sds.cls?`(${sds.txt})`:''}</span></span>
        <span class="k">PPE ที่ต้องใช้</span><span class="v">${c.ppe||'—'}</span>
      </div>
    </div>

    ${c.storageCondition?`
    <div class="warn-box">
      <div class="wb-title">🏪 เงื่อนไขการเก็บรักษา</div>
      ${c.storageCondition}
    </div>`:''}

    ${c.firstAid?`
    <div class="hazard-box">
      <div class="hb-title">🚑 การปฐมพยาบาล</div>
      ${c.firstAid}
    </div>`:''}

    ${c.fireFighting?`
    <div class="hazard-box">
      <div class="hb-title">🔥 การดับเพลิง</div>
      ${c.fireFighting}
    </div>`:''}

    ${c.spillResponse?`
    <div class="hazard-box">
      <div class="hb-title">⚗️ การรับมือหกรั่วไหล</div>
      ${c.spillResponse}
    </div>`:''}

    ${c.notes?`<div class="ds"><h4>หมายเหตุ</h4>
      <p style="font-size:.83rem;color:#374151;margin:0">${c.notes}</p></div>`:''}`,

    `<button class="btn no-print" onclick="window.print()">🖨️ พิมพ์ SDS</button>
     <button class="btn no-print" onclick="window.__ch_openEdit('${c.id}')">✏️ แก้ไข</button>
     <button class="btn btn-danger no-print" onclick="window.__ch_delete('${c.id}')">🗑️ ลบ</button>`);
};

/* ── edit ── */
window.__ch_openEdit = async id => {
  const c = await getChemical(id);
  if (!c) return;
  openPanel('แก้ไขข้อมูลสารเคมี', formHTML(c),
    `<button class="btn" onclick="window.__ch_closePanel()">ยกเลิก</button>
     <button class="btn btn-primary" onclick="window.__ch_saveEdit('${c.id}')">💾 บันทึก</button>`);
};
window.__ch_saveEdit = async id => {
  const data = collectForm();
  if (!data.nameTh) { alert('กรุณาระบุชื่อสารเคมี'); return; }
  await updateChemical(id, data);
  window.__ch_closePanel();
  await load();
};

/* ── delete ── */
window.__ch_delete = async id => {
  if (!confirm('ยืนยันลบสารเคมีนี้?')) return;
  await deleteChemical(id);
  window.__ch_closePanel();
  await load();
};

      <button class="btn no-print" onclick="window.print()">🖨️</button>
    </div>
    <!-- GHS filter -->
