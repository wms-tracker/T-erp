<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>คลัง PPE — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s;position:relative}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.card-critical{border-left:4px solid #dc2626;background:#fffafa}
.card-low{border-left:4px solid #d97706;background:#fffbeb}
.card-expired{border-left:4px solid #7c3aed;background:#faf5ff}
.cat-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:2px solid #e5e7eb;cursor:pointer;font-size:0.82rem;transition:all .15s;user-select:none}
.cat-chip.active{border-color:#1a237e;background:#e8eaf6;color:#1a237e;font-weight:700}
.chip-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.stock-meter{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:4px 0}
.stock-fill{height:100%;border-radius:6px;transition:width .3s}
.adj-btn{width:34px;height:34px;border:none;border-radius:8px;font-size:1.1rem;font-weight:700;cursor:pointer;transition:opacity .15s;line-height:1}
.adj-btn:hover{opacity:.8}
.qty-display{font-size:1.4rem;font-weight:800;min-width:50px;text-align:center;line-height:1}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:55px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-warning{background:#d97706;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-bar input{flex:1}
.filter-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter-tab{padding:5px 14px;border-radius:16px;border:1px solid #e5e7eb;cursor:pointer;font-size:0.8rem;background:#f9fafb}
.filter-tab.active{background:#1a237e;color:#fff;border-color:#1a237e;font-weight:600}
.adj-panel{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:14px;margin-top:12px}
.info-row{display:flex;gap:14px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.alert-tag{font-size:0.75rem;padding:2px 8px;border-radius:6px;font-weight:600;display:inline-block}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  PPE_STOCK_CATEGORIES, PPE_STOCK_STATUS, PPE_UNITS,
  listPPEStock, getPPEStock, createPPEStock, updatePPEStock, deletePPEStock, adjustPPEStockQty
} from "./js/safety-data.js";

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-ppe-stock', 'คลังอุปกรณ์ป้องกันส่วนบุคคล (PPE Stock)');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const badge   = (l,c,bg) => `<span class="badge" style="color:${c};background:${bg}">${l}</span>`;
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

let records     = [];
let editId      = null;
let selCat      = '';
let filterStatus= 'all';
let searchKw    = '';

function getItemStatus(r) {
  const qty = r.currentQty || 0;
  const min = r.minQty || 0;
  if (r.expiryDate && new Date(r.expiryDate) < new Date()) return 'expired';
  if (qty === 0 || qty < min * 0.3) return 'critical';
  if (qty < min) return 'low';
  return 'ok';
}

function getStockPct(r) {
  const qty = r.currentQty || 0;
  const max = r.maxQty || Math.max(qty * 2, 1);
  return Math.min(100, Math.round(qty / max * 100));
}

// ── render ────────────────────────────────────────────────────────────────────
async function render() {
  records = await listPPEStock();
  records.forEach(r => { r._status = getItemStatus(r); });

  const total    = records.length;
  const critical = records.filter(r=>r._status==='critical').length;
  const low      = records.filter(r=>r._status==='low').length;
  const expired  = records.filter(r=>r._status==='expired').length;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🦺 คลัง PPE — อุปกรณ์ป้องกันส่วนบุคคล</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ เพิ่มรายการ PPE</button>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${total}</div><div class="kpi-label">รายการทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${critical}</div><div class="kpi-label">หมด / วิกฤติ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${low}</div><div class="kpi-label">ใกล้หมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#7c3aed">${expired}</div><div class="kpi-label">หมดอายุ</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาชื่อ PPE, ยี่ห้อ, สถานที่เก็บ..." oninput="window.__search(this.value)"/>
  </div>

  <div class="filter-tabs">
    ${['all','critical','low','expired','ok'].map(k=>`
      <div class="filter-tab ${filterStatus===k?'active':''}" onclick="window.__setFilter('${k}')">
        ${k==='all' ? `ทั้งหมด (${total})` :
          k==='critical' ? `หมด/วิกฤติ (${critical})` :
          k==='low'      ? `ใกล้หมด (${low})` :
          k==='expired'  ? `หมดอายุ (${expired})` :
          `สต็อกพอ (${records.filter(r=>r._status==='ok').length})`}
      </div>`).join('')}
  </div>

  <div id="list-wrap">${renderList(getFiltered())}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">รายการ PPE</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function getFiltered() {
  return records.filter(r => {
    const matchStatus = filterStatus === 'all' || r._status === filterStatus;
    const kw = searchKw.toLowerCase();
    const matchSearch = !kw ||
      (r.itemName||'').toLowerCase().includes(kw) ||
      (r.brand||'').toLowerCase().includes(kw) ||
      (r.storageLocation||'').toLowerCase().includes(kw);
    return matchStatus && matchSearch;
  });
}

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ไม่พบรายการ PPE</p>`;
  return list.map(r => {
    const st  = PPE_STOCK_STATUS[r._status] || PPE_STOCK_STATUS.ok;
    const cat = PPE_STOCK_CATEGORIES.find(c=>c.key===r.category)||{};
    const pct = getStockPct(r);
    const barC = r._status==='critical'?'#dc2626':r._status==='low'?'#d97706':r._status==='expired'?'#7c3aed':'#16a34a';
    const cls  = r._status==='critical'?'card-critical':r._status==='low'?'card-low':r._status==='expired'?'card-expired':'';

    return `
    <div class="card ${cls}" onclick="window.__openPanel('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:1rem">${cat.icon||'🧰'} ${esc(r.itemName||'-')}</div>
          <div class="info-row">
            ${r.brand ? `<span>🏷️ ${esc(r.brand)}</span>` : ''}
            <span>📍 ${esc(r.storageLocation||'-')}</span>
            ${r.expiryDate ? `<span>📅 หมดอายุ: ${fmtDate(r.expiryDate)}</span>` : ''}
          </div>
        </div>
        <div style="flex-shrink:0;text-align:right">
          <div style="font-size:1.5rem;font-weight:800;color:${barC}">${r.currentQty||0}
            <span style="font-size:0.75rem;font-weight:400;color:#6b7280">${esc(r.unit||'ชิ้น')}</span>
          </div>
          ${badge(st.label, st.color, st.bg)}
          ${r.minQty ? `<div style="font-size:0.72rem;color:#6b7280;margin-top:2px">Min: ${r.minQty} ${esc(r.unit||'ชิ้น')}</div>` : ''}
        </div>
      </div>
      <div class="stock-meter" style="margin-top:8px">
        <div class="stock-fill" style="width:${pct}%;background:${barC}"></div>
      </div>
    </div>`;
  }).join('');
}

window.__setFilter = (k) => {
  filterStatus = k;
  document.querySelectorAll('.filter-tab').forEach((el,i)=>{
    const keys = ['all','critical','low','expired','ok'];
    el.classList.toggle('active', keys[i]===k);
  });
  document.getElementById('list-wrap').innerHTML = renderList(getFiltered());
};

window.__search = (q) => {
  searchKw = q;
  document.getElementById('list-wrap').innerHTML = renderList(getFiltered());
};

// ── panel ─────────────────────────────────────────────────────────────────────
window.__openPanel = async (id) => {
  editId = id;
  selCat = '';
  const panel = document.getElementById('panel');
  const body  = document.getElementById('panel-body');
  const foot  = document.getElementById('panel-footer');
  document.getElementById('panel-title').textContent = id ? 'แก้ไขรายการ PPE' : 'เพิ่มรายการ PPE';
  document.getElementById('overlay').classList.add('open');
  panel.classList.add('open');

  let rec = null;
  if (id) {
    rec = await getPPEStock(id);
    if (rec) selCat = rec.category || '';
  }
  body.innerHTML = renderForm(rec);
  foot.innerHTML = id
    ? `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
       <button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
       <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`
    : `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
       <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderForm(rec) {
  const catChips = PPE_STOCK_CATEGORIES.map(c=>`
    <div class="cat-chip ${selCat===c.key?'active':''}" onclick="window.__selCat('${c.key}')">
      ${c.icon} ${esc(c.label)}
    </div>`).join('');

  const itemSuggestions = selCat
    ? `<datalist id="item-suggestions">${(PPE_STOCK_CATEGORIES.find(c=>c.key===selCat)?.items||[]).map(i=>`<option value="${esc(i)}">`).join('')}</datalist>`
    : '<datalist id="item-suggestions"></datalist>';

  return `
  <div class="section-title">หมวดหมู่ PPE</div>
  <div class="chip-wrap">${catChips}</div>
  ${itemSuggestions}

  <label class="lbl">ชื่อ PPE *</label>
  <input id="f-name" list="item-suggestions" value="${esc(rec?.itemName||'')}" placeholder="เช่น หมวกนิรภัย, ถุงมือยาง Nitrile"/>

  <div class="form-row">
    <div>
      <label class="lbl">ยี่ห้อ / รุ่น</label>
      <input id="f-brand" value="${esc(rec?.brand||'')}" placeholder="เช่น 3M, MSA, Honeywell"/>
    </div>
    <div>
      <label class="lbl">หน่วย *</label>
      <select id="f-unit">
        ${PPE_UNITS.map(u=>`<option value="${u}" ${(rec?.unit||'ชิ้น')===u?'selected':''}>${u}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">สต็อกปัจจุบัน *</label>
      <input id="f-qty" type="number" min="0" value="${rec?.currentQty??0}"/>
    </div>
    <div>
      <label class="lbl">สต็อกขั้นต่ำ (Min) *</label>
      <input id="f-min" type="number" min="0" value="${rec?.minQty??0}" placeholder="แจ้งเตือนเมื่อต่ำกว่านี้"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">สต็อกสูงสุด (Max)</label>
      <input id="f-max" type="number" min="0" value="${rec?.maxQty||''}" placeholder="เพื่อแสดง meter"/>
    </div>
    <div>
      <label class="lbl">สถานที่จัดเก็บ</label>
      <input id="f-loc" value="${esc(rec?.storageLocation||'')}" placeholder="เช่น ห้องเก็บ PPE อาคาร A"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">วันหมดอายุ (ถ้ามี)</label>
      <input id="f-exp" type="date" value="${rec?.expiryDate||''}"/>
    </div>
    <div>
      <label class="lbl">รหัสสินค้า / Part No</label>
      <input id="f-sku" value="${esc(rec?.sku||'')}" placeholder="เช่น PPE-HM-001"/>
    </div>
  </div>

  <label class="lbl">หมายเหตุ</label>
  <textarea id="f-note">${esc(rec?.note||'')}</textarea>

  ${rec ? `
  <div class="adj-panel">
    <div class="section-title" style="margin-top:0">ปรับสต็อก (รับเข้า / เบิกออก)</div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
      <button class="adj-btn" style="background:#fee2e2;color:#dc2626" onclick="window.__quickAdj(-1)">−</button>
      <div class="qty-display" id="adj-display">${rec?.currentQty||0}</div>
      <button class="adj-btn" style="background:#dcfce7;color:#16a34a" onclick="window.__quickAdj(+1)">+</button>
      <span style="font-size:0.85rem;color:#6b7280">${esc(rec?.unit||'ชิ้น')}</span>
    </div>
    <div class="form-row">
      <div>
        <label class="lbl">จำนวนที่ปรับ</label>
        <input id="adj-delta" type="number" placeholder="+5 หรือ -3"/>
      </div>
      <div>
        <label class="lbl">หมายเหตุการปรับ</label>
        <input id="adj-note" placeholder="เช่น รับเข้าจาก PO#123"/>
      </div>
    </div>
    <button class="btn btn-success" style="margin-top:8px;width:100%" onclick="window.__applyAdj('${rec.id}')">ยืนยันการปรับสต็อก</button>
  </div>` : ''}`;
}

let adjQty = 0;
window.__selCat = (key) => {
  selCat = key;
  document.querySelectorAll('.cat-chip').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('onclick')===`window.__selCat('${key}')`);
  });
  const cat = PPE_STOCK_CATEGORIES.find(c=>c.key===key);
  const dl  = document.getElementById('item-suggestions');
  if (dl && cat) dl.innerHTML = cat.items.map(i=>`<option value="${esc(i)}">`).join('');
};

window.__quickAdj = (d) => {
  adjQty += d;
  const disp = document.getElementById('adj-display');
  if (disp) disp.textContent = adjQty;
  const inp = document.getElementById('adj-delta');
  if (inp) inp.value = adjQty > 0 ? '+'+adjQty : adjQty;
};

window.__applyAdj = async (id) => {
  const deltaRaw = document.getElementById('adj-delta')?.value;
  const delta = parseInt(deltaRaw) || adjQty;
  const note  = document.getElementById('adj-note')?.value.trim() || '';
  if (delta === 0) { alert('กรุณาระบุจำนวนที่ปรับ'); return; }
  try {
    const newQty = await adjustPPEStockQty(id, delta, note, profile.uid);
    alert(`ปรับสต็อกสำเร็จ — สต็อกใหม่: ${newQty} ${document.getElementById('adj-display')?.nextSibling?.textContent||''}`);
    adjQty = 0;
    window.__closePanel();
    await render();
  } catch(e) { alert('ปรับสต็อกไม่สำเร็จ: '+e.message); }
};

// ── save / delete ─────────────────────────────────────────────────────────────
window.__save = async () => {
  const name = document.getElementById('f-name')?.value.trim();
  const unit = document.getElementById('f-unit')?.value;
  const qty  = parseInt(document.getElementById('f-qty')?.value) || 0;
  const min  = parseInt(document.getElementById('f-min')?.value) || 0;
  if (!name || !selCat) {
    alert('กรุณากรอก: หมวดหมู่ PPE และชื่อ PPE');
    return;
  }
  const data = {
    category:        selCat,
    itemName:        name,
    brand:           document.getElementById('f-brand')?.value.trim()||'',
    unit,
    currentQty:      qty,
    minQty:          min,
    maxQty:          parseInt(document.getElementById('f-max')?.value)||null,
    storageLocation: document.getElementById('f-loc')?.value.trim()||'',
    expiryDate:      document.getElementById('f-exp')?.value||'',
    sku:             document.getElementById('f-sku')?.value.trim()||'',
    note:            document.getElementById('f-note')?.value.trim()||'',
  };
  try {
    if (editId) await updatePPEStock(editId, data);
    else        await createPPEStock(data, profile.uid);
    window.__closePanel();
    await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบรายการ PPE นี้?')) return;
  await deletePPEStock(id);
  window.__closePanel();
  await render();
};

window.__closePanel = () => {
  adjQty = 0;
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
