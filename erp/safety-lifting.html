<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ตรวจสอบอุปกรณ์ยก — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.type-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:2px solid #e5e7eb;cursor:pointer;font-size:0.82rem;transition:all .15s;user-select:none}
.type-chip.active{border-color:#1a237e;background:#e8eaf6;color:#1a237e;font-weight:700}
.chip-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s}
.checklist-item:hover{background:#f1f5f9}
.checklist-item.checked{background:#dcfce7}
.checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:#16a34a;flex-shrink:0;margin-top:2px}
.checklist-item label{font-size:0.85rem;cursor:pointer;line-height:1.4}
.progress-wrap{background:#e5e7eb;border-radius:8px;height:8px;overflow:hidden}
.progress-bar{height:100%;border-radius:8px;transition:width .3s}
.card-fail{border-left:4px solid #dc2626;background:#fffafa}
.card-overdue{border-left:4px solid #d97706;background:#fffbeb}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-bar input{flex:1}
.info-row{display:flex;gap:14px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.color-code-swatch{display:inline-flex;align-items:center;gap:5px}
.color-swatch{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<script type="module">
import { requireRole, getProfile } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  LIFTING_TYPES, LIFTING_INSPECT_STATUS, LIFTING_CHECKLIST,
  listLiftingEq, getLiftingEq, createLiftingEq, updateLiftingEq, deleteLiftingEq
} from "./js/safety-data.js";

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-lifting', 'ตรวจสอบอุปกรณ์ยก (Lifting Equipment)');
main.insertAdjacentHTML('afterbegin', `
<div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <span id="panel-title">บันทึกการตรวจสอบ</span>
    <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
  <div class="panel-footer" id="panel-footer"></div>
</div>
`);

const badge   = (l,c,bg) => `<span class="badge" style="color:${c};background:${bg}">${l}</span>`;
const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

// color-code system: Jan-Mar=Red, Apr-Jun=Green, Jul-Sep=Blue, Oct-Dec=Yellow
const COLOR_CODES = [
  { label:'แดง (Q1: ม.ค.–มี.ค.)',  color:'#dc2626', bg:'#fee2e2' },
  { label:'เขียว (Q2: เม.ย.–มิ.ย.)',color:'#16a34a', bg:'#dcfce7' },
  { label:'น้ำเงิน (Q3: ก.ค.–ก.ย.)',color:'#2563eb', bg:'#dbeafe' },
  { label:'เหลือง (Q4: ต.ค.–ธ.ค.)', color:'#d97706', bg:'#fef3c7' },
];

let records    = [];
let editId     = null;
let selType    = '';
let chkState   = {};

function daysUntil(d) {
  if (!d) return null;
  return Math.round((new Date(d) - new Date()) / 86400000);
}

// ── render ────────────────────────────────────────────────────────────────────
async function render() {
  records = await listLiftingEq();
  const total    = records.length;
  const pass     = records.filter(r=>r.inspStatus==='pass').length;
  const fail     = records.filter(r=>r.inspStatus==='fail').length;
  const retired  = records.filter(r=>r.inspStatus==='retired').length;
  const overdue  = records.filter(r=> r.nextInspDate && daysUntil(r.nextInspDate) < 0).length;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🪝 ตรวจสอบอุปกรณ์ยก (Lifting Equipment)</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ เพิ่มรายการ</button>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${total}</div><div class="kpi-label">อุปกรณ์ทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${pass}</div><div class="kpi-label">ผ่านการตรวจ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${fail}</div><div class="kpi-label">ห้ามใช้งาน</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${overdue}</div><div class="kpi-label">เกินกำหนดตรวจ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#6b7280">${retired}</div><div class="kpi-label">ตัดออกแล้ว</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหา Tag ID, Serial No, สถานที่..." oninput="window.__search(this.value)"/>
  </div>

  <div id="list-wrap">${renderList(records)}</div>`;
}

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ไม่พบรายการอุปกรณ์ยก</p>`;
  return list.map(r => {
    const st  = LIFTING_INSPECT_STATUS[r.inspStatus] || LIFTING_INSPECT_STATUS.pass;
    const lt  = LIFTING_TYPES.find(x=>x.key===r.liftingType) || {};
    const done = (r.checklist||[]).filter(Boolean).length;
    const pct  = Math.round(done/LIFTING_CHECKLIST.length*100);
    const days = daysUntil(r.nextInspDate);
    let cls = '';
    if (r.inspStatus==='fail' || r.inspStatus==='retired') cls = 'card-fail';
    else if (days !== null && days < 0) cls = 'card-overdue';

    const cc = COLOR_CODES.find(c=>c.label.startsWith(r.colorCode||'__'));
    return `
    <div class="card ${cls}" onclick="window.__openPanel('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:1rem">${lt.icon||'🔩'} ${esc(r.tagId||'-')}
            <span style="font-weight:400;font-size:0.85rem;color:#374151"> · ${esc(lt.label||r.liftingType||'-')}</span>
            ${r.colorCode ? `<span class="color-code-swatch"><span class="color-swatch" style="background:${COLOR_CODES.find(c=>c.label.startsWith(r.colorCode))?.color||'#ccc'}"></span></span>` : ''}
          </div>
          <div class="info-row">
            <span>⚖️ SWL: ${r.swl ? esc(r.swl)+' kg' : '-'}</span>
            <span>📍 ${esc(r.location||'-')}</span>
            <span>📅 ตรวจครั้งถัดไป: ${fmtDate(r.nextInspDate)}</span>
          </div>
          ${days !== null && days < 0 ? `<span style="font-size:0.78rem;color:#dc2626;font-weight:600">⚠️ เกินกำหนด ${Math.abs(days)} วัน</span>` : ''}
          ${days !== null && days >= 0 && days <= 30 ? `<span style="font-size:0.78rem;color:#d97706;font-weight:600">⏰ ตรวจใน ${days} วัน</span>` : ''}
        </div>
        <div style="flex-shrink:0;text-align:right">
          ${badge(st.label, st.color, st.bg)}
          <div style="font-size:0.75rem;color:#6b7280;margin-top:4px">ตรวจ ${done}/${LIFTING_CHECKLIST.length}</div>
        </div>
      </div>
      <div class="progress-wrap" style="margin-top:8px">
        <div class="progress-bar" style="width:${pct}%;background:${r.inspStatus==='fail'?'linear-gradient(90deg,#dc2626,#f87171)':'linear-gradient(90deg,#16a34a,#4ade80)'}"></div>
      </div>
    </div>`;
  }).join('');
}

window.__search = (q) => {
  const kw = q.toLowerCase();
  const f = records.filter(r =>
    (r.tagId||'').toLowerCase().includes(kw) ||
    (r.serialNo||'').toLowerCase().includes(kw) ||
    (r.location||'').toLowerCase().includes(kw) ||
    (r.liftingType||'').toLowerCase().includes(kw)
  );
  document.getElementById('list-wrap').innerHTML = renderList(f);
};

// ── panel ─────────────────────────────────────────────────────────────────────
window.__openPanel = async (id) => {
  editId   = id;
  selType  = '';
  chkState = {};
  const panel = document.getElementById('panel');
  const body  = document.getElementById('panel-body');
  const foot  = document.getElementById('panel-footer');
  document.getElementById('panel-title').textContent = id ? 'แก้ไขรายการ' : 'เพิ่มรายการตรวจสอบ';
  document.getElementById('overlay').classList.add('open');
  panel.classList.add('open');

  let rec = null;
  if (id) {
    rec = await getLiftingEq(id);
    if (rec) {
      selType = rec.liftingType || '';
      (rec.checklist||[]).forEach((v,i)=>{ chkState[LIFTING_CHECKLIST[i]?.key] = v; });
    }
  }
  body.innerHTML = renderForm(rec);
  renderChecklist();
  foot.innerHTML = id
    ? `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
       <button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
       <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`
    : `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
       <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderForm(rec) {
  const typeChips = LIFTING_TYPES.map(t=>`
    <div class="type-chip ${selType===t.key?'active':''}" onclick="window.__selType('${t.key}')">
      ${t.icon} ${esc(t.label)}
    </div>`).join('');

  const today = new Date().toISOString().slice(0,10);
  return `
  <div class="section-title">ประเภทอุปกรณ์ยก</div>
  <div class="chip-wrap">${typeChips}</div>

  <div class="form-row">
    <div>
      <label class="lbl">Tag ID / รหัสอุปกรณ์ *</label>
      <input id="f-tag" value="${esc(rec?.tagId||'')}" placeholder="เช่น SL-001"/>
    </div>
    <div>
      <label class="lbl">Serial No / เลขที่ใบรับรอง</label>
      <input id="f-serial" value="${esc(rec?.serialNo||'')}" placeholder="เช่น WRS-2024-001"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">SWL — Safe Working Load (kg) *</label>
      <input id="f-swl" type="number" min="0" value="${rec?.swl||''}" placeholder="เช่น 2000"/>
    </div>
    <div>
      <label class="lbl">สถานที่ใช้งาน / เก็บรักษา *</label>
      <input id="f-loc" value="${esc(rec?.location||'')}" placeholder="เช่น แผนก Shipping"/>
    </div>
  </div>

  <div class="section-title">การตรวจสอบ</div>
  <div class="form-row">
    <div>
      <label class="lbl">วันที่ตรวจสอบครั้งนี้ *</label>
      <input id="f-insp-date" type="date" value="${rec?.lastInspDate||today}"/>
    </div>
    <div>
      <label class="lbl">วันที่ตรวจสอบครั้งถัดไป</label>
      <input id="f-next-date" type="date" value="${rec?.nextInspDate||''}"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">ผู้ตรวจสอบ *</label>
      <input id="f-by" value="${esc(rec?.inspectedBy||profile.displayName||'')}" placeholder="ชื่อผู้ตรวจ"/>
    </div>
    <div>
      <label class="lbl">รหัสสีประจำไตรมาส</label>
      <select id="f-color">
        <option value="">-- เลือกรหัสสี --</option>
        ${COLOR_CODES.map(c=>`<option value="${c.label.split(' ')[0]}" ${(rec?.colorCode||'')=== c.label.split(' ')[0]?'selected':''}>${c.label}</option>`).join('')}
      </select>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">ผลการตรวจโดยรวม *</label>
      <select id="f-status">
        ${Object.entries(LIFTING_INSPECT_STATUS).map(([k,v])=>`<option value="${k}" ${(rec?.inspStatus||'pass')===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">ความยาว/ขนาด</label>
      <input id="f-size" value="${esc(rec?.sizeDesc||'')}" placeholder="เช่น 3m x 1t, 25mm dia"/>
    </div>
  </div>

  <div class="section-title" style="margin-top:16px">รายการตรวจสอบ</div>
  <div class="progress-wrap"><div class="progress-bar" id="cl-bar" style="width:0%"></div></div>
  <div id="cl-pct" style="font-size:0.78rem;color:#6b7280;text-align:right;margin:3px 0 6px">0 / ${LIFTING_CHECKLIST.length}</div>
  <div id="checklist-wrap"></div>

  <label class="lbl">ข้อบกพร่องที่พบ / หมายเหตุ</label>
  <textarea id="f-note">${esc(rec?.note||'')}</textarea>`;
}

function renderChecklist() {
  const wrap = document.getElementById('checklist-wrap');
  if (!wrap) return;
  wrap.innerHTML = LIFTING_CHECKLIST.map(item=>`
    <div class="checklist-item ${chkState[item.key]?'checked':''}" onclick="window.__toggleCL('${item.key}')">
      <input type="checkbox" ${chkState[item.key]?'checked':''} onchange="window.__toggleCL('${item.key}')"/>
      <label>${esc(item.label)}</label>
    </div>`).join('');
  updateBar();
}

function updateBar() {
  const done  = Object.values(chkState).filter(Boolean).length;
  const total = LIFTING_CHECKLIST.length;
  const pct   = Math.round(done/total*100);
  const bar   = document.getElementById('cl-bar');
  const lbl   = document.getElementById('cl-pct');
  if (bar) { bar.style.width = pct+'%'; bar.style.background = pct===100 ? 'linear-gradient(90deg,#16a34a,#4ade80)' : 'linear-gradient(90deg,#2563eb,#60a5fa)'; }
  if (lbl) lbl.textContent = `${done} / ${total}`;
}

window.__toggleCL = (key) => {
  chkState[key] = !chkState[key];
  renderChecklist();
};

window.__selType = (key) => {
  selType = key;
  document.querySelectorAll('.type-chip').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('onclick')===`window.__selType('${key}')`);
  });
};

// ── save / delete ─────────────────────────────────────────────────────────────
window.__save = async () => {
  const tagId  = document.getElementById('f-tag')?.value.trim();
  const swl    = document.getElementById('f-swl')?.value;
  const loc    = document.getElementById('f-loc')?.value.trim();
  const byWho  = document.getElementById('f-by')?.value.trim();
  const iDate  = document.getElementById('f-insp-date')?.value;
  const status = document.getElementById('f-status')?.value;
  if (!tagId || !swl || !loc || !byWho || !iDate || !selType) {
    alert('กรุณากรอก: ประเภท, Tag ID, SWL, สถานที่, ผู้ตรวจ และวันที่ตรวจ');
    return;
  }
  const data = {
    liftingType:  selType,
    tagId,
    serialNo:     document.getElementById('f-serial')?.value.trim()||'',
    swl:          parseFloat(swl)||0,
    location:     loc,
    lastInspDate: iDate,
    nextInspDate: document.getElementById('f-next-date')?.value||'',
    inspectedBy:  byWho,
    colorCode:    document.getElementById('f-color')?.value||'',
    inspStatus:   status,
    sizeDesc:     document.getElementById('f-size')?.value.trim()||'',
    checklist:    LIFTING_CHECKLIST.map(item=>!!chkState[item.key]),
    note:         document.getElementById('f-note')?.value.trim()||'',
  };
  try {
    if (editId) await updateLiftingEq(editId, data);
    else        await createLiftingEq(data, profile.uid);
    window.__closePanel();
    await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบรายการนี้?')) return;
  await deleteLiftingEq(id);
  window.__closePanel();
  await render();
};

window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
