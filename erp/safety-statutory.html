<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ทะเบียนเครื่องจักรตามกฎหมาย — KPO Safety</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  STATUTORY_EQ_TYPES, STATUTORY_EQ_STATUS,
  listStatutoryEq, getStatutoryEq, createStatutoryEq, updateStatutoryEq, deleteStatutoryEq,
} from './js/safety-data.js';
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo','admin','manager']);
const main    = renderShell(profile, 'safety-statutory', 'ทะเบียนเครื่องจักร/อุปกรณ์ตามกฎหมาย');

main.insertAdjacentHTML('afterbegin', `
<div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-header">
    <span id="panel-title">เพิ่มเครื่องจักร</span>
    <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>
`);

const fmt   = d => d ? new Date(d).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '—';
const today = () => new Date().toISOString().slice(0,10);

let records = [], filterType = '', filterStatus = '';

function computeStatus(r) {
  if(r.status==='decom') return 'decom';
  if(!r.inspectionDue) return r.status||'pending';
  const days = Math.ceil((new Date(r.inspectionDue) - new Date()) / 86400000);
  if(days < 0) return 'expired';
  if(days < 90) return 'expiring';
  return 'active';
}

function getType(k) { return STATUTORY_EQ_TYPES[k] || {label:k, icon:'🔧', law:''}; }
function getStatusInfo(k) { return STATUTORY_EQ_STATUS[k] || {label:k, color:'#555', bg:'#eee'}; }

function daysUntilBadge(dueDate) {
  if(!dueDate) return '';
  const days = Math.ceil((new Date(dueDate) - new Date()) / 86400000);
  if(days < 0) return `<span style="color:#dc2626;font-size:0.75rem;font-weight:700;">เกิน ${Math.abs(days)} วัน</span>`;
  if(days < 90) return `<span style="color:#d97706;font-size:0.75rem;font-weight:700;">อีก ${days} วัน</span>`;
  return `<span style="color:#16a34a;font-size:0.75rem;">อีก ${days} วัน</span>`;
}

function kpiBar() {
  const total    = records.length;
  const expiring = records.filter(r=>computeStatus(r)==='expiring').length;
  const expired  = records.filter(r=>computeStatus(r)==='expired').length;
  const active   = records.filter(r=>computeStatus(r)==='active').length;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;">
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#1a73e8;">${total}</div><div style="font-size:0.78rem;color:#6b7280;">เครื่องจักรทั้งหมด</div></div>
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#16a34a;">${active}</div><div style="font-size:0.78rem;color:#6b7280;">ผ่านตรวจ/ใช้งาน</div></div>
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#d97706;">${expiring}</div><div style="font-size:0.78rem;color:#6b7280;">ใกล้หมดอายุ</div></div>
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#dc2626;">${expired}</div><div style="font-size:0.78rem;color:#6b7280;">หมดอายุ</div></div>
  </div>`;
}

function renderPage() {
  let rows = records;
  if(filterType)   rows = rows.filter(r=>r.eqType===filterType);
  if(filterStatus) rows = rows.filter(r=>computeStatus(r)===filterStatus);

  document.getElementById('main-list').innerHTML = rows.length===0
    ? `<div style="text-align:center;color:#999;padding:40px 0;">ไม่พบข้อมูล</div>`
    : rows.map(r => {
        const st  = getStatusInfo(computeStatus(r));
        const typ = getType(r.eqType);
        return `<tr onclick="window.__editRecord('${r.id}')" style="cursor:pointer;">
          <td style="padding:11px 14px;border-bottom:1px solid #f0f2f8;">
            <div style="font-weight:600;">${typ.icon} ${r.machineName||'—'}</div>
            <div style="font-size:0.78rem;color:#888;">${r.serialNo||''} · ${r.location||''}</div>
          </td>
          <td style="padding:11px 14px;border-bottom:1px solid #f0f2f8;font-size:0.82rem;">${typ.label}</td>
          <td style="padding:11px 14px;border-bottom:1px solid #f0f2f8;font-size:0.82rem;">${r.regNo||'—'}</td>
          <td style="padding:11px 14px;border-bottom:1px solid #f0f2f8;font-size:0.82rem;">${fmt(r.lastInspectionDate)}</td>
          <td style="padding:11px 14px;border-bottom:1px solid #f0f2f8;font-size:0.82rem;">
            ${fmt(r.inspectionDue)}<br>${daysUntilBadge(r.inspectionDue)}
          </td>
          <td style="padding:11px 14px;border-bottom:1px solid #f0f2f8;">
            <span class="badge" style="color:${st.color};background:${st.bg}">${st.label}</span>
          </td>
        </tr>`;
      }).join('');
}

function formHTML(r) {
  return `
    <div id="panel-msg" class="msg" style="margin-bottom:8px;"></div>
    <input type="hidden" id="f-id" value="${r?.id||''}"/>
    <input type="hidden" id="f-attach-existing" value='${JSON.stringify(r?.attachments||[])}'/>
    <div class="form-group"><label class="form-label">ชื่อเครื่องจักร/อุปกรณ์ *</label>
      <input id="f-name" class="form-control" value="${r?.machineName||''}" placeholder="เช่น หม้อไอน้ำ No.1"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group"><label class="form-label">ประเภท *</label>
        <select id="f-type" class="form-control">
          ${Object.entries(STATUTORY_EQ_TYPES).map(([k,v])=>`<option value="${k}" ${(r?.eqType||'boiler')===k?'selected':''}>${v.icon} ${v.label}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">หมายเลขเครื่อง / S/N</label>
        <input id="f-serial" class="form-control" value="${r?.serialNo||''}"/></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group"><label class="form-label">แผนก/ตำแหน่งที่ตั้ง</label>
        <input id="f-location" class="form-control" value="${r?.location||''}"/></div>
      <div class="form-group"><label class="form-label">ผู้ดูแล/ผู้รับผิดชอบ</label>
        <input id="f-owner" class="form-control" value="${r?.owner||''}"/></div>
    </div>
    <div style="border-top:1px solid #eef0f7;margin:14px 0;padding-top:14px;">
      <div style="font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;margin-bottom:10px;">ทะเบียนและใบรับรอง</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group"><label class="form-label">เลขที่ทะเบียน (รัฐ)</label>
          <input id="f-regno" class="form-control" value="${r?.regNo||''}" placeholder="เลขที่ขึ้นทะเบียน"/></div>
        <div class="form-group"><label class="form-label">หน่วยงานที่ออก</label>
          <input id="f-issuer" class="form-control" value="${r?.issuer||''}" placeholder="เช่น กรมสวัสดิการฯ"/></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group"><label class="form-label">วันที่ตรวจครั้งล่าสุด</label>
          <input id="f-last-insp" class="form-control" type="date" value="${r?.lastInspectionDate||''}"/></div>
        <div class="form-group"><label class="form-label">วันที่ต้องตรวจครั้งถัดไป *</label>
          <input id="f-due" class="form-control" type="date" value="${r?.inspectionDue||''}"/></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="form-group"><label class="form-label">เลขที่ใบรับรอง</label>
          <input id="f-cert" class="form-control" value="${r?.certNo||''}"/></div>
        <div class="form-group"><label class="form-label">หน่วยงานตรวจสอบ</label>
          <input id="f-inspector" class="form-control" value="${r?.inspectorOrg||''}" placeholder="หน่วยงาน/บริษัทตรวจสอบ"/></div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group"><label class="form-label">ความจุ/ขนาด</label>
        <input id="f-capacity" class="form-control" value="${r?.capacity||''}" placeholder="เช่น 2 ตัน/ชม., 5 ตัน"/></div>
      <div class="form-group"><label class="form-label">สถานะ</label>
        <select id="f-status" class="form-control">
          ${Object.entries(STATUTORY_EQ_STATUS).map(([k,v])=>`<option value="${k}" ${(r?.status||'active')===k?'selected':''}>${v.label}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-group"><label class="form-label">หมายเหตุ / กฎหมายที่เกี่ยวข้อง</label>
      <textarea id="f-remarks" class="form-control" rows="2">${r?.remarks||''}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      ${r?.id?`<button class="btn btn-danger" style="padding:9px 14px;" onclick="
window.__viewRecord = async id => { await window.__editRecord(id); window.__safetyViewMode(); };
window.__deleteRecord('${r.id}')">🗑 ลบ</button>`:''}
      <button class="btn btn-primary" style="flex:1;" onclick="window.__saveRecord()">💾 บันทึก</button>
      <button class="btn btn-outline" onclick="window.__closePanel()">ยกเลิก</button>
    </div>`;
}

window.__openPanel = () => {
  document.getElementById('panel-title').textContent = 'เพิ่มเครื่องจักร/อุปกรณ์';
  document.getElementById('panel-body').innerHTML = formHTML(null);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
};
window.__closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
window.__editRecord = async id => {
  const r = await getStatutoryEq(id);
  if(!r) return;
  document.getElementById('panel-title').textContent = 'แก้ไขข้อมูลเครื่องจักร';
  document.getElementById('panel-body').innerHTML = formHTML(r);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
};
window.__deleteRecord = async id => {
  if(!confirm('ลบรายการนี้?')) return;
  await deleteStatutoryEq(id);
  window.__closePanel();
  await loadAll();
};
window.__saveRecord = async () => {
  const msg = document.getElementById('panel-msg');
  const name = document.getElementById('f-name').value.trim();
  if(!name){ msg.textContent='* กรุณาระบุชื่อเครื่องจักร'; msg.className='msg error'; return; }
  msg.textContent='กำลังบันทึก…'; msg.className='msg';
  const data = {
    machineName:        name,
    eqType:             document.getElementById('f-type').value,
    serialNo:           document.getElementById('f-serial').value.trim(),
    location:           document.getElementById('f-location').value.trim(),
    owner:              document.getElementById('f-owner').value.trim(),
    regNo:              document.getElementById('f-regno').value.trim(),
    issuer:             document.getElementById('f-issuer').value.trim(),
    lastInspectionDate: document.getElementById('f-last-insp').value||null,
    inspectionDue:      document.getElementById('f-due').value||null,
    certNo:             document.getElementById('f-cert').value.trim(),
    inspectorOrg:       document.getElementById('f-inspector').value.trim(),
    capacity:           document.getElementById('f-capacity').value.trim(),
    status:             document.getElementById('f-status').value,
    remarks:            document.getElementById('f-remarks').value.trim(),
  };
  try {
    if(window.__commitAttach)data.attachments=await window.__commitAttach();
    const id = document.getElementById('f-id').value;
    if(id) await updateStatutoryEq(id,data); else await createStatutoryEq(data,profile.uid);
    window.__closePanel(); await loadAll();
  } catch(e){ msg.textContent='เกิดข้อผิดพลาด: '+e.message; msg.className='msg error'; }
};
window.__setFilter = (key,val) => {
  if(key==='type')   filterType=val;
  if(key==='status') filterStatus=val;
  renderPage();
};

main.innerHTML += `
  <style>
    .panel{position:fixed;right:0;top:0;bottom:0;width:560px;max-width:100vw;background:#fff;box-shadow:-4px 0 24px rgba(15,25,60,.13);z-index:200;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;}
    .panel.open{transform:none;}
    .overlay{display:none;position:fixed;inset:0;background:rgba(15,20,40,.35);z-index:199;}
    .overlay.open{display:block;}
    .panel-header{padding:18px 20px 12px;border-bottom:1px solid #e8eaf6;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#1a237e,#283593);color:#fff;position:sticky;top:0;z-index:10;}
    .panel-body{padding:16px 20px 32px;}
    .form-group{margin-bottom:12px;}
    .form-label{display:block;font-size:0.82rem;font-weight:600;color:#333;margin-bottom:5px;}
    .form-control{width:100%;padding:9px 11px;border:1.5px solid #d1d5e8;border-radius:8px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;}
    .form-control:focus{outline:none;border-color:#1a73e8;}
    @media(max-width:600px){.panel{width:100%;}}
  </style>
  <div id="kpi-bar"></div>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
      <b>ทะเบียนเครื่องจักร/อุปกรณ์ที่ต้องตรวจสอบตามกฎหมาย</b>
      <button class="btn btn-primary" onclick="window.__openPanel()">+ เพิ่มรายการ</button>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <select class="form-control" style="width:auto;min-width:160px;padding:7px 11px;" onchange="window.__setFilter('type',this.value)">
        <option value="">ทุกประเภท</option>
        ${Object.entries(STATUTORY_EQ_TYPES).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('')}
      </select>
      <select class="form-control" style="width:auto;min-width:150px;padding:7px 11px;" onchange="window.__setFilter('status',this.value)">
        <option value="">ทุกสถานะ</option>
        ${Object.entries(STATUTORY_EQ_STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
      </select>
    </div>
    <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
        <thead>
          <tr style="background:#f0f2f8;">
            <th style="padding:10px 14px;text-align:left;font-size:0.78rem;color:#374151;border-bottom:2px solid #e0e3f0;">เครื่องจักร/อุปกรณ์</th>
            <th style="padding:10px 14px;text-align:left;font-size:0.78rem;color:#374151;border-bottom:2px solid #e0e3f0;">ประเภท</th>
            <th style="padding:10px 14px;text-align:left;font-size:0.78rem;color:#374151;border-bottom:2px solid #e0e3f0;">เลขทะเบียน</th>
            <th style="padding:10px 14px;text-align:left;font-size:0.78rem;color:#374151;border-bottom:2px solid #e0e3f0;">ตรวจล่าสุด</th>
            <th style="padding:10px 14px;text-align:left;font-size:0.78rem;color:#374151;border-bottom:2px solid #e0e3f0;">ตรวจครั้งถัดไป</th>
            <th style="padding:10px 14px;text-align:left;font-size:0.78rem;color:#374151;border-bottom:2px solid #e0e3f0;">สถานะ</th>
          </tr>
        </thead>
        <tbody id="main-list"></tbody>
      </table>
    </div>
  </div>`;

async function loadAll() {
  records = await listStatutoryEq();
  document.getElementById('kpi-bar').innerHTML = kpiBar();
  renderPage();
}
loadAll();
</script>
</body>
</html>
