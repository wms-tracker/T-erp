<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>กรอกข้อมูล — Warehouse Control Tower</title>
<style>
:root {
  --bg: #eef1f7; --panel: #ffffff; --panel-2: #f5f7fb; --text: #16213e; --text-muted: #5c6584;
  --border: #dde2ee; --accent: #2e6cf6; --accent-2: #5a8dfb;
  --ok: #17a673; --ok-bg: rgba(23,166,115,0.12);
  --warn: #d99a1f; --warn-bg: rgba(217,154,31,0.14);
  --bad: #e14b4b; --bad-bg: rgba(225,75,75,0.13);
  --shadow: 0 6px 24px rgba(20,30,60,0.08);
}
:root[data-theme="dark"] {
  --bg: #0b1120; --panel: #141d33; --panel-2: #101728; --text: #e8ecfb; --text-muted: #93a0c4;
  --border: #253156; --accent: #5a8dfb; --accent-2: #7fa6ff;
  --ok: #2fd196; --ok-bg: rgba(47,209,150,0.12);
  --warn: #f0b429; --warn-bg: rgba(240,180,41,0.14);
  --bad: #ff5c5c; --bad-bg: rgba(255,92,92,0.14);
  --shadow: 0 8px 28px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
.entry-topbar {
  background: linear-gradient(180deg, var(--panel) 0%, var(--panel) 100%); border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow); position: sticky; top: 0; z-index: 10;
}
.entry-topbar-inner { max-width: 960px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.entry-logo { width: 36px; height: 36px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1rem; flex-shrink: 0; }
.entry-titles h1 { font-size: 0.98rem; margin: 0; letter-spacing: .3px; }
.entry-titles p { margin: 0; font-size: .68rem; color: var(--text-muted); letter-spacing: .5px; text-transform: uppercase; }
.entry-topbar-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.role-pill { font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: var(--accent); color: #fff; opacity: .9; }
.entry-wrap { max-width: 960px; margin: 0 auto; padding: 20px 18px 60px; }
.entry-sub { font-size: .8rem; color: var(--text-muted); margin: 0 0 16px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tab-btn { padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); cursor: pointer; font-size: .86rem; font-weight: 600; color: var(--text-muted); transition: all .15s; }
.tab-btn:hover { color: var(--text); border-color: var(--accent); }
.tab-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 16px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem;
  background: var(--panel-2); color: var(--text); font-family: inherit; color-scheme: light dark;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  font-size: 0.9rem; font-weight: 600; transition: filter 0.15s, background 0.15s; background: var(--panel-2); color: var(--text);
}
.btn:hover { filter: brightness(1.05); }
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: none; }
.btn-icon { padding: 8px 10px; }
.msg { font-size: 0.85rem; margin-top: 12px; min-height: 18px; }
.msg.error { color: var(--bad); }
.msg.ok { color: var(--ok); }
.num-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 14px 0; }
.num-grid .field label { font-size: .78rem; }
.num-grid .field input { text-align: right; font-weight: 700; }
.total-badge { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: .84rem; margin: 10px 0; }
.block-msg { background: var(--warn-bg); border: 1px solid var(--warn); border-radius: 10px; padding: 16px; color: var(--warn); font-size: .88rem; line-height: 1.7; }
h3 { color: var(--text); }
</style>
</head>
<body></body>
<script type="module">
import { requireRole, db } from "./js/auth.js";
import {
  DEPARTMENTS, WAREHOUSES,
  ACCIDENT_SEVERITIES, ACCIDENT_SEVERITY_LABEL,
  ACCIDENT_TYPES, ACCIDENT_STATUSES,
} from "./js/control-tower/data-service.js";
import {
  doc, getDoc, setDoc, addDoc, collection, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const profile = await requireRole(['warehouse', 'admin']);
const isAdmin = profile.role === 'admin';
const myDept = profile.wctDepartment || null;

function todayStr() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function deptLabel(code) { return DEPARTMENTS.find(d => d.code === code)?.label || code; }

const body = document.body;
const ROLE_LABEL = { admin: 'Admin', manager: 'Manager', warehouse: 'คลังสินค้า', sales: 'ฝ่ายขาย', accounting: 'บัญชี' };

function headerHtml() {
  return `
    <header class="entry-topbar">
      <div class="entry-topbar-inner">
        <div class="entry-logo">HW</div>
        <div class="entry-titles">
          <h1>HORIZON WAREHOUSE</h1>
          <p>กรอกข้อมูลรายวัน</p>
        </div>
        <div class="entry-topbar-controls">
          <span class="role-pill">${escapeHtml(ROLE_LABEL[profile.role] || profile.role)}</span>
          <a href="warehouse-control-tower.html" class="btn">📊 ไปหน้า Dashboard</a>
          <button class="btn btn-icon" id="entryThemeBtn" title="สลับธีม">🌙</button>
        </div>
      </div>
    </header>`;
}
function initThemeToggle() {
  const KEY = 'wct_theme';
  const apply = (t) => { document.documentElement.setAttribute('data-theme', t); document.getElementById('entryThemeBtn').textContent = t === 'dark' ? '☀️' : '🌙'; };
  apply(localStorage.getItem(KEY) || 'light');
  document.getElementById('entryThemeBtn').addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem(KEY, next); apply(next);
  });
}

// ---------------------------------------------------------------
// Warehouse staff ที่ยังไม่ถูกกำหนดแผนก (wctDepartment) โดยแอดมิน -> บล็อกไว้ก่อน
// ---------------------------------------------------------------
if (!isAdmin && !myDept) {
  body.innerHTML = `
    ${headerHtml()}
    <div class="entry-wrap">
      <div class="block-msg" style="margin-top:20px;">
        ⚠️ บัญชีของคุณ (<b>${escapeHtml(profile.name || profile.email)}</b>) ยังไม่ได้ถูกกำหนด "แผนก" สำหรับกรอกข้อมูล<br/>
        กรุณาติดต่อแอดมินให้กำหนดแผนกที่หน้า <b>จัดการผู้ใช้งาน & สิทธิ์</b> (dashboard-admin.html#users) ก่อนใช้งานหน้านี้
      </div>
    </div>`;
  initThemeToggle();
  throw new Error('no-department-assigned');
}

const TABS = [];
if (isAdmin || myDept === 'OB') TABS.push({ key: 'outbound', label: '📤 Outbound รายวัน' });
if (isAdmin || myDept === 'IB') TABS.push({ key: 'inbound', label: '📥 Inbound รายวัน' });
if (isAdmin || myDept === 'TS') TABS.push({ key: 'transport', label: '🚚 TS รายวัน' });
TABS.push({ key: 'manpower', label: '👷 Manpower รายวัน' });
TABS.push({ key: 'accident', label: '🦺 แจ้งอุบัติเหตุ' });

let activeTab = TABS[0].key;

body.innerHTML = `
  ${headerHtml()}
  <div class="entry-wrap">
    <p class="entry-sub" style="margin-top:20px;">
      เข้าสู่ระบบเป็น <b>${escapeHtml(profile.name || profile.email)}</b>
      ${isAdmin ? '(แอดมิน — กรอกแทนแผนกใดก็ได้)' : `— แผนก <b>${escapeHtml(deptLabel(myDept))}</b>`}
    </p>
    <div class="tabs" id="tabBar"></div>
    <div id="tabContent"></div>
  </div>
`;

const tabBar = document.getElementById('tabBar');
initThemeToggle();
tabBar.innerHTML = TABS.map(t => `<button class="tab-btn ${t.key===activeTab?'active':''}" data-tab="${t.key}">${t.label}</button>`).join('');
tabBar.addEventListener('click', e => {
  const btn = e.target.closest('[data-tab]');
  if (!btn) return;
  activeTab = btn.dataset.tab;
  tabBar.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
  renderTab();
});

function fmtNum(n) { return Number(n || 0).toLocaleString('th-TH'); }
function numField(id, label, value = 0) {
  return `<div class="field"><label>${escapeHtml(label)}</label><input type="number" id="${id}" value="${value}" min="0" /></div>`;
}
function getNum(id) { return Math.max(0, Number(document.getElementById(id).value) || 0); }

function renderTab() {
  const content = document.getElementById('tabContent');
  if (activeTab === 'outbound') return renderOutboundForm(content);
  if (activeTab === 'inbound') return renderInboundForm(content);
  if (activeTab === 'transport') return renderTransportForm(content);
  if (activeTab === 'manpower') return renderManpowerForm(content);
  if (activeTab === 'accident') return renderAccidentForm(content);
}

// =====================================================================
// OUTBOUND DAILY (แผนก OB)
// =====================================================================
async function renderOutboundForm(el) {
  el.innerHTML = `
    <div class="card">
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="field"><label>วันที่</label><input type="date" id="ob-date" value="${todayStr()}" /></div>
        <div class="field"><label>คลัง (Warehouse)</label><select id="ob-wh">${WAREHOUSES.map(w=>`<option value="${w.code}">${w.label}</option>`).join('')}</select></div>
        <div class="field"><label>เป้าหมาย Orders/วัน</label><input type="number" id="ob-target" value="900" min="0" /></div>
      </div>
      <h3 style="font-size:.9rem;margin:14px 0 0;">ยอดสะสมวันนี้ (แต่ละช่องคือยอดรวม ไม่ใช่ยอดเฉพาะขั้นนั้น)</h3>
      <div class="num-grid">
        ${numField('ob-total', 'ออเดอร์ทั้งหมด/วัน (Total)', 0)}
        ${numField('ob-picked', 'หยิบแล้ว (Picked)', 0)}
        ${numField('ob-qc', 'QC', 0)}
        ${numField('ob-shipped', 'จัดส่งแล้ว (Shipped)', 0)}
        ${numField('ob-cancelled', 'ยกเลิก (Cancelled)', 0)}
      </div>
      <div class="field" style="max-width:200px;"><label>จำนวนชิ้นรวม (Qty)</label><input type="number" id="ob-qty" value="0" min="0" /></div>
      <div class="total-badge" id="ob-total-info"></div>
      <button class="btn btn-primary" id="ob-save" style="width:auto;">💾 บันทึก</button>
      <p class="msg" id="ob-msg"></p>
    </div>`;
  const recalcInfo = () => {
    const total = getNum('ob-total'), picked = getNum('ob-picked'), qc = getNum('ob-qc'), shipped = getNum('ob-shipped'), cancelled = getNum('ob-cancelled');
    const pending = Math.max(0, total - picked - cancelled);
    let warn = '';
    if (picked > total) warn += ' ⚠️ หยิบแล้วมากกว่าออเดอร์ทั้งหมด';
    if (qc > picked) warn += ' ⚠️ QC มากกว่าหยิบแล้ว';
    if (shipped > qc) warn += ' ⚠️ จัดส่งแล้วมากกว่า QC';
    document.getElementById('ob-total-info').innerHTML = `Pending (ยังไม่หยิบ) = <b>${fmtNum(pending)}</b>${warn}`;
  };
  ['ob-total','ob-picked','ob-qc','ob-shipped','ob-cancelled'].forEach(id => document.getElementById(id).addEventListener('input', recalcInfo));
  const load = async () => {
    const date = document.getElementById('ob-date').value, wh = document.getElementById('ob-wh').value;
    const snap = await getDoc(doc(db, 'wctOutboundDaily', `${date}_${wh}`));
    const d = snap.exists() ? snap.data() : {};
    document.getElementById('ob-target').value = d.target ?? 900;
    document.getElementById('ob-qty').value = d.qty ?? 0;
    document.getElementById('ob-total').value = d.total ?? 0;
    document.getElementById('ob-picked').value = d.picked ?? 0;
    document.getElementById('ob-qc').value = d.qc ?? 0;
    document.getElementById('ob-shipped').value = d.shipped ?? 0;
    document.getElementById('ob-cancelled').value = d.cancelled ?? 0;
    recalcInfo();
  };
  document.getElementById('ob-date').addEventListener('change', load);
  document.getElementById('ob-wh').addEventListener('change', load);
  document.getElementById('ob-save').addEventListener('click', async () => {
    const date = document.getElementById('ob-date').value, wh = document.getElementById('ob-wh').value;
    const msg = document.getElementById('ob-msg'); msg.className = 'msg';
    if (!date) { msg.textContent = 'กรุณาเลือกวันที่'; msg.classList.add('error'); return; }
    const payload = {
      date, warehouse: wh, department: 'OB', target: getNum('ob-target'), qty: getNum('ob-qty'),
      total: getNum('ob-total'), picked: getNum('ob-picked'), qc: getNum('ob-qc'), shipped: getNum('ob-shipped'), cancelled: getNum('ob-cancelled'),
      updatedBy: profile.uid, updatedByName: profile.name || profile.email, updatedAt: serverTimestamp(),
    };
    try {
      await setDoc(doc(db, 'wctOutboundDaily', `${date}_${wh}`), payload, { merge: true });
      msg.textContent = `บันทึกข้อมูล Outbound วันที่ ${date} (${wh}) สำเร็จ`; msg.classList.add('ok');
    } catch (err) { msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message; msg.classList.add('error'); }
  });
  recalcInfo();
}

// =====================================================================
// INBOUND DAILY (แผนก IB)
// =====================================================================
async function renderInboundForm(el) {
  el.innerHTML = `
    <div class="card">
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="field"><label>วันที่</label><input type="date" id="ib-date" value="${todayStr()}" /></div>
        <div class="field"><label>คลัง (Warehouse)</label><select id="ib-wh">${WAREHOUSES.map(w=>`<option value="${w.code}">${w.label}</option>`).join('')}</select></div>
        <div class="field"><label>เป้าหมาย ตู้/วัน</label><input type="number" id="ib-target" value="12" min="0" /></div>
      </div>
      <h3 style="font-size:.9rem;margin:14px 0 0;">ยอดสะสมวันนี้ (แต่ละช่องคือยอดรวม ไม่ใช่ยอดเฉพาะขั้นนั้น)</h3>
      <div class="num-grid">
        ${numField('ib-total', 'จำนวนตู้ที่มาประจำวัน (Total)', 0)}
        ${numField('ib-arrived', 'รถมาถึงแล้วกี่คัน (Arrived)', 0)}
        ${numField('ib-unloaded', 'ลงเสร็จแล้วเท่าไหร่ (Unloaded)', 0)}
        ${numField('ib-putaway', 'จัดเก็บเรียบร้อย (Put Away)', 0)}
      </div>
      <div class="total-badge" id="ib-total-info"></div>
      <button class="btn btn-primary" id="ib-save" style="width:auto;">💾 บันทึก</button>
      <p class="msg" id="ib-msg"></p>
    </div>`;
  const FIELDS = ['total', 'arrived', 'unloaded', 'putaway'];
  const recalcInfo = () => {
    const total = getNum('ib-total'), arrived = getNum('ib-arrived'), unloaded = getNum('ib-unloaded'), putaway = getNum('ib-putaway');
    const pending = Math.max(0, total - arrived);
    let warn = '';
    if (arrived > total) warn += ' ⚠️ มาถึงมากกว่าจำนวนตู้ทั้งหมด';
    if (unloaded > arrived) warn += ' ⚠️ ลงเสร็จมากกว่ามาถึง';
    if (putaway > unloaded) warn += ' ⚠️ จัดเก็บมากกว่าลงเสร็จ';
    document.getElementById('ib-total-info').innerHTML = `Pending (ยังไม่มาถึง) = <b>${fmtNum(pending)}</b>${warn}`;
  };
  FIELDS.forEach(f => document.getElementById(`ib-${f}`).addEventListener('input', recalcInfo));
  const load = async () => {
    const date = document.getElementById('ib-date').value, wh = document.getElementById('ib-wh').value;
    const snap = await getDoc(doc(db, 'wctInboundDaily', `${date}_${wh}`));
    const d = snap.exists() ? snap.data() : {};
    document.getElementById('ib-target').value = d.target ?? 12;
    FIELDS.forEach(f => document.getElementById(`ib-${f}`).value = d[f] ?? 0);
    recalcInfo();
  };
  document.getElementById('ib-date').addEventListener('change', load);
  document.getElementById('ib-wh').addEventListener('change', load);
  document.getElementById('ib-save').addEventListener('click', async () => {
    const date = document.getElementById('ib-date').value, wh = document.getElementById('ib-wh').value;
    const msg = document.getElementById('ib-msg'); msg.className = 'msg';
    if (!date) { msg.textContent = 'กรุณาเลือกวันที่'; msg.classList.add('error'); return; }
    const payload = { date, warehouse: wh, department: 'IB', target: getNum('ib-target'), updatedBy: profile.uid, updatedByName: profile.name || profile.email, updatedAt: serverTimestamp() };
    FIELDS.forEach(f => payload[f] = getNum(`ib-${f}`));
    try {
      await setDoc(doc(db, 'wctInboundDaily', `${date}_${wh}`), payload, { merge: true });
      msg.textContent = `บันทึกข้อมูล Inbound วันที่ ${date} (${wh}) สำเร็จ`; msg.classList.add('ok');
    } catch (err) { msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message; msg.classList.add('error'); }
  });
  recalcInfo();
}

// =====================================================================
// TRANSPORTATION DAILY (แผนก TS)
// =====================================================================
async function renderTransportForm(el) {
  el.innerHTML = `
    <div class="card">
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="field"><label>วันที่</label><input type="date" id="ts-date" value="${todayStr()}" /></div>
        <div class="field"><label>คลัง (Warehouse)</label><select id="ts-wh">${WAREHOUSES.map(w=>`<option value="${w.code}">${w.label}</option>`).join('')}</select></div>
        <div class="field"><label>เป้าหมายจุดส่ง/วัน</label><input type="number" id="ts-target" value="100" min="0" /></div>
      </div>
      <h3 style="font-size:.9rem;margin:14px 0 0;">จำนวนรถที่ใช้วันนี้</h3>
      <div class="num-grid">
        ${numField('ts-companyVehicles', 'รถบริษัท (คัน)', 0)}
        ${numField('ts-outsourceVehicles', 'รถขนส่ง Outsource (คัน)', 0)}
      </div>
      <h3 style="font-size:.9rem;margin:14px 0 0;">จุดส่ง</h3>
      <div class="num-grid">
        ${numField('ts-deliveryPoints', 'จำนวนจุดส่ง', 0)}
        ${numField('ts-delivered', 'ส่งสำเร็จแล้ว', 0)}
      </div>
      <div class="total-badge" id="ts-total-info"></div>
      <button class="btn btn-primary" id="ts-save" style="width:auto;">💾 บันทึก</button>
      <p class="msg" id="ts-msg"></p>
    </div>`;
  const FIELDS = ['companyVehicles', 'outsourceVehicles', 'deliveryPoints', 'delivered'];
  const recalcInfo = () => {
    const totalVehicles = getNum('ts-companyVehicles') + getNum('ts-outsourceVehicles');
    const deliveryPoints = getNum('ts-deliveryPoints'), delivered = getNum('ts-delivered');
    const pending = Math.max(0, deliveryPoints - delivered);
    let warn = '';
    if (delivered > deliveryPoints) warn = ' ⚠️ ส่งสำเร็จมากกว่าจำนวนจุดส่งทั้งหมด — ตรวจสอบตัวเลขอีกครั้ง';
    document.getElementById('ts-total-info').innerHTML = `รถทั้งหมดวันนี้ = <b>${fmtNum(totalVehicles)}</b> คัน · คงเหลือ/รอส่ง (คำนวณ) = <b>${fmtNum(pending)}</b>${warn}`;
  };
  FIELDS.forEach(f => document.getElementById(`ts-${f}`).addEventListener('input', recalcInfo));
  const load = async () => {
    const date = document.getElementById('ts-date').value, wh = document.getElementById('ts-wh').value;
    const snap = await getDoc(doc(db, 'wctTransportDaily', `${date}_${wh}`));
    const d = snap.exists() ? snap.data() : {};
    document.getElementById('ts-target').value = d.target ?? 100;
    FIELDS.forEach(f => document.getElementById(`ts-${f}`).value = d[f] ?? 0);
    recalcInfo();
  };
  document.getElementById('ts-date').addEventListener('change', load);
  document.getElementById('ts-wh').addEventListener('change', load);
  document.getElementById('ts-save').addEventListener('click', async () => {
    const date = document.getElementById('ts-date').value, wh = document.getElementById('ts-wh').value;
    const msg = document.getElementById('ts-msg'); msg.className = 'msg';
    if (!date) { msg.textContent = 'กรุณาเลือกวันที่'; msg.classList.add('error'); return; }
    const payload = { date, warehouse: wh, department: 'TS', target: getNum('ts-target'), updatedBy: profile.uid, updatedByName: profile.name || profile.email, updatedAt: serverTimestamp() };
    FIELDS.forEach(f => payload[f] = getNum(`ts-${f}`));
    try {
      await setDoc(doc(db, 'wctTransportDaily', `${date}_${wh}`), payload, { merge: true });
      msg.textContent = `บันทึกข้อมูล TS วันที่ ${date} (${wh}) สำเร็จ`; msg.classList.add('ok');
    } catch (err) { msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message; msg.classList.add('error'); }
  });
  recalcInfo();
}

// =====================================================================
// MANPOWER DAILY (ทุกแผนก — กรอกได้เฉพาะแผนกตัวเอง เว้นแต่แอดมิน)
// =====================================================================
async function renderManpowerForm(el) {
  const deptOptions = isAdmin ? DEPARTMENTS : DEPARTMENTS.filter(d => d.code === myDept);
  el.innerHTML = `
    <div class="card">
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="field"><label>วันที่</label><input type="date" id="mp-date" value="${todayStr()}" /></div>
        <div class="field"><label>แผนก</label><select id="mp-dept">${deptOptions.map(d=>`<option value="${d.code}">${d.label}</option>`).join('')}</select></div>
      </div>
      <h3 style="font-size:.9rem;margin:14px 0 0;">จำนวนพนักงานตามประเภท</h3>
      <div class="num-grid">
        ${numField('mp-regular', 'จำนวนพนักงานประจำ (คน)', 0)}
        ${numField('mp-outsourceRegular', 'จำนวน Outsource ประจำ (คน)', 0)}
        ${numField('mp-outsourceExtra', 'จำนวน Outsource เสริม - ขอ/เรียกมาก่อน (คน)', 0)}
      </div>
      <h3 style="font-size:.9rem;margin:14px 0 0;">สถานะการมาปฏิบัติงานวันนี้</h3>
      <div class="num-grid">
        ${numField('mp-present', 'มาจริง (คน)', 0)}
        ${numField('mp-leave', 'Leave (ลา)', 0)}
        ${numField('mp-late', 'Late (สาย)', 0)}
        ${numField('mp-ot', 'OT รวม (ชั่วโมง)', 0)}
      </div>
      <div class="total-badge" id="mp-total"></div>
      <button class="btn btn-primary" id="mp-save" style="width:auto;">💾 บันทึก</button>
      <p class="msg" id="mp-msg"></p>
    </div>`;
  const HEADCOUNT_FIELDS = ['regular', 'outsourceRegular', 'outsourceExtra'];
  const OTHER_FIELDS = ['present', 'leave', 'late', 'ot'];
  const recalcTotal = () => {
    const total = HEADCOUNT_FIELDS.reduce((s, f) => s + getNum(`mp-${f}`), 0);
    const present = getNum('mp-present'), leave = getNum('mp-leave');
    const absent = Math.max(0, total - present - leave);
    let warn = '';
    if (present + leave > total) warn = ' ⚠️ มาจริง + ลา มากกว่าจำนวนพนักงานทั้งหมด — ตรวจสอบตัวเลขอีกครั้ง';
    document.getElementById('mp-total').innerHTML = `จำนวนพนักงานทั้งหมด = <b>${fmtNum(total)}</b> · ขาด (คำนวณ) = <b>${fmtNum(absent)}</b>${warn}`;
  };
  [...HEADCOUNT_FIELDS, ...OTHER_FIELDS].forEach(f => document.getElementById(`mp-${f}`).addEventListener('input', recalcTotal));
  const load = async () => {
    const date = document.getElementById('mp-date').value, dept = document.getElementById('mp-dept').value;
    const snap = await getDoc(doc(db, 'wctManpowerDaily', `${date}_${dept}`));
    const d = snap.exists() ? snap.data() : {};
    [...HEADCOUNT_FIELDS, ...OTHER_FIELDS].forEach(f => document.getElementById(`mp-${f}`).value = d[f] ?? 0);
    recalcTotal();
  };
  document.getElementById('mp-date').addEventListener('change', load);
  document.getElementById('mp-dept').addEventListener('change', load);
  document.getElementById('mp-save').addEventListener('click', async () => {
    const date = document.getElementById('mp-date').value, dept = document.getElementById('mp-dept').value;
    const msg = document.getElementById('mp-msg'); msg.className = 'msg';
    if (!date) { msg.textContent = 'กรุณาเลือกวันที่'; msg.classList.add('error'); return; }
    const total = HEADCOUNT_FIELDS.reduce((s, f) => s + getNum(`mp-${f}`), 0);
    const absent = Math.max(0, total - getNum('mp-present') - getNum('mp-leave'));
    const payload = { date, department: dept, total, absent, updatedBy: profile.uid, updatedByName: profile.name || profile.email, updatedAt: serverTimestamp() };
    [...HEADCOUNT_FIELDS, ...OTHER_FIELDS].forEach(f => payload[f] = getNum(`mp-${f}`));
    try {
      await setDoc(doc(db, 'wctManpowerDaily', `${date}_${dept}`), payload, { merge: true });
      msg.textContent = `บันทึกข้อมูล Manpower แผนก ${deptLabel(dept)} วันที่ ${date} สำเร็จ`; msg.classList.add('ok');
    } catch (err) { msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message; msg.classList.add('error'); }
  });
  await load();
}

// =====================================================================
// ACCIDENT REPORT (ทุกแผนก — รายเหตุการณ์ ไม่ใช่สรุปรายวัน)
// =====================================================================

  const now = new Date();
  const deptOptions = isAdmin ? DEPARTMENTS : DEPARTMENTS.filter(d => d.code === myDept);
  el.innerHTML = `
    <div class="card">
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="field"><label>วันที่เกิดเหตุ</label><input type="date" id="ac-date" value="${todayStr()}" /></div>
        <div class="field"><label>เวลา</label><input type="time" id="ac-time" value="${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}" /></div>
        <div class="field"><label>แผนก</label><select id="ac-dept">${deptOptions.map(d=>`<option value="${d.code}">${d.label}</option>`).join('')}</select></div>
        <div class="field"><label>ความรุนแรง</label><select id="ac-severity">${ACCIDENT_SEVERITIES.map(s=>`<option value="${s}">${ACCIDENT_SEVERITY_LABEL[s]}</option>`).join('')}</select></div>
      </div>
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="field"><label>พื้นที่เกิดเหตุ</label><input id="ac-location" placeholder="เช่น Zone A, Dock 1" /></div>
        <div class="field"><label>ประเภทอุบัติเหตุ</label><select id="ac-type">${ACCIDENT_TYPES.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}</select></div>
        <div class="field"><label>ผู้เกี่ยวข้อง</label><input id="ac-employee" placeholder="ชื่อพนักงาน" /></div>
        <div class="field"><label>ผู้รับผิดชอบแก้ไข</label><input id="ac-responsible" placeholder="ชื่อผู้รับผิดชอบ" /></div>
      </div>
      <div class="field"><label>ลักษณะเหตุการณ์</label><textarea id="ac-description" rows="2" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;"></textarea></div>
      <div class="field"><label>สาเหตุ</label><textarea id="ac-cause" rows="2" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;"></textarea></div>
      <div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));">
        <div class="field"><label>ความเสียหาย (ถ้ามี)</label><input id="ac-damage" placeholder="เช่น ประมาณ 5,000 บาท หรือ -" /></div>
        <div class="field"><label>สถานะ</label><select id="ac-status">${ACCIDENT_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>การแก้ไข</label><textarea id="ac-correctiveaction" rows="2" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;"></textarea></div>
      <button class="btn btn-primary" id="ac-save" style="width:auto;margin-top:8px;">💾 บันทึกรายงาน</button>
      <p class="msg" id="ac-msg"></p>
    </div>`;
  document.getElementById('ac-save').addEventListener('click', async () => {
    const date = document.getElementById('ac-date').value;
    const msg = document.getElementById('ac-msg'); msg.className = 'msg';
    if (!date) { msg.textContent = 'กรุณาเลือกวันที่'; msg.classList.add('error'); return; }
    const dept = document.getElementById('ac-dept').value;
    const accidentNo = `ACC-${date.replace(/-/g,'')}-${Math.random().toString(36).slice(2,6).toUpperCase()}`;
    const payload = {
      accident_no: accidentNo, date, time: document.getElementById('ac-time').value,
      location: document.getElementById('ac-location').value.trim(), department: dept,
      employee: document.getElementById('ac-employee').value.trim(), type: document.getElementById('ac-type').value,
      severity: document.getElementById('ac-severity').value, description: document.getElementById('ac-description').value.trim(),
      cause: document.getElementById('ac-cause').value.trim(), damage: document.getElementById('ac-damage').value.trim() || '-',
      corrective_action: document.getElementById('ac-correctiveaction').value.trim(),
      responsible: document.getElementById('ac-responsible').value.trim(), status: document.getElementById('ac-status').value,
      closed_date: document.getElementById('ac-status').value === 'Closed' ? date : null,
      createdBy: profile.uid, createdByName: profile.name || profile.email, createdAt: serverTimestamp(),
    };
    try {
      await addDoc(collection(db, 'wctAccidents'), payload);
      msg.textContent = `บันทึกรายงานอุบัติเหตุ ${accidentNo} สำเร็จ`; msg.classList.add('ok');
      ['ac-location','ac-employee','ac-responsible','ac-description','ac-cause','ac-damage','ac-correctiveaction'].forEach(id => document.getElementById(id).value = '');
    } catch (err) { msg.textContent = 'เกิดข้อผิดพลาด: ' + err.message; msg.classList.add('error'); }
  });
}

renderTab();
