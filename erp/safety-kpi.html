<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เป้าหมาย KPI ความปลอดภัย — KPO Safety</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/safety.css">
  <style>
    /* Year bar */
    .year-bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem}
    .year-bar select,.year-bar input{padding:.35rem .7rem;border-radius:6px;border:1px solid #cbd5e1;font-size:.88rem}

    /* Summary strip */
    .summary-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem;margin-bottom:1.5rem}
    .sum-box{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:.7rem .5rem;text-align:center}
    .sum-box .n{font-size:1.6rem;font-weight:700;line-height:1}
    .sum-box .l{font-size:.7rem;color:#64748b;margin-top:.2rem}

    /* KPI cards */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.9rem}
    .kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1rem;position:relative;overflow:hidden}
    .kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:12px 0 0 12px}
    .kpi-card.green::before{background:#16a34a}
    .kpi-card.yellow::before{background:#d97706}
    .kpi-card.red::before{background:#dc2626}
    .kpi-card.grey::before{background:#94a3b8}

    .kpi-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.6rem}
    .kpi-label{font-size:.85rem;font-weight:600;color:#1e293b;line-height:1.3}
    .kpi-traffic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
    .kpi-traffic.green{background:#dcfce7}
    .kpi-traffic.yellow{background:#fef3c7}
    .kpi-traffic.red{background:#fee2e2}
    .kpi-traffic.grey{background:#f1f5f9}

    .kpi-vals{display:flex;gap:1.2rem;margin-bottom:.6rem;align-items:flex-end}
    .kpi-actual{font-size:1.7rem;font-weight:700;line-height:1}
    .kpi-target{font-size:.8rem;color:#94a3b8;margin-bottom:.15rem}
    .kpi-unit{font-size:.75rem;color:#64748b;margin-bottom:.1rem}

    .kpi-bar-track{background:#f1f5f9;border-radius:4px;height:8px;overflow:hidden}
    .kpi-bar-fill{height:8px;border-radius:4px;transition:width .6s}

    .kpi-footer{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem;font-size:.75rem;color:#94a3b8}

    /* Edit modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
    .modal-overlay.open{display:flex}
    .modal-box{background:#fff;border-radius:12px;padding:1.5rem;width:min(520px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
    .modal-head h3{font-size:1rem;color:#1e3a5f;margin:0}
    .tgt-row{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;margin-bottom:.5rem;padding:.4rem .5rem;border-radius:6px;background:#f8fafc}
    .tgt-row label{font-size:.82rem;color:#374151}
    .tgt-row input{width:80px;padding:.3rem .5rem;border-radius:6px;border:1px solid #cbd5e1;font-size:.85rem;text-align:center}

    /* Print */
    @media print{
      .year-bar .no-print,.no-print{display:none!important}
      .kpi-grid{grid-template-columns:repeat(3,1fr)}
      .kpi-card{break-inside:avoid}
    }
  </style>
</head>
<body>
<div class="modal-overlay" id="editModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>⚙️ ตั้งเป้าหมาย KPI ประจำปี <span id="editYear"></span></h3>
      <button class="btn-icon" onclick="window.__kpi_closeEdit()">✕</button>
    </div>
    <div id="editRows"></div>
    <div style="display:flex;gap:.6rem;justify-content:flex-end;margin-top:1rem">
      <button class="btn" onclick="window.__kpi_closeEdit()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="window.__kpi_saveTargets()">💾 บันทึกเป้าหมาย</button>
    </div>
  </div>
</div>

<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell }  from './js/shell.js';
import {
  getKpiTargets, saveKpiTargets, KPI_DEFINITIONS,
  computeSafetyKPIs, listIncidents, listNearMiss,
  listCapaRecords, listInspections, listTrainings,
  listTalks, listLegalRegisters, listObservations,
  listDrills, listContractors,
} from './js/safety-data.js';

const _profile = await requireRole(['safety_officer','kpo']);
renderShell(_profile, 'safety-kpi', 'เป้าหมาย KPI ความปลอดภัย');

const now = new Date();
let _year    = now.getFullYear();
let _targets = {};  // key → target value
let _actuals = {};  // key → actual value

/* ── compute actuals for year ── */
async function computeActuals(year) {
  const sStr = `${year}-01-01`;
  const eStr = `${year}-12-31`;
  const today = new Date();

  const [kpis, nearMiss, capas, inspections, trainings,
         talks, legals, obs, drills, contractors] = await Promise.all([
    computeSafetyKPIs({ startDate: sStr, endDate: eStr }),
    listNearMiss({ startDate: sStr, endDate: eStr }),
    listCapaRecords({}),
    listInspections({ startDate: sStr, endDate: eStr }),
    listTrainings({ lim: 500 }),
    listTalks({ startDate: sStr, endDate: eStr }),
    listLegalRegisters({}),
    listObservations({ startDate: sStr, endDate: eStr }),
    listDrills({ lim: 200 }),
    listContractors({}),
  ]);

  // incidents / lti / lostDays
  const incidents = await listIncidents({ startDate: sStr, endDate: eStr });
  const lostDays  = incidents.reduce((a,b) => a + (b.lostTimeDays||0), 0);

  // CAPA closure rate
  const closedCapa = capas.filter(c => c.status === 'closed');
  const capaCloseRate = capas.length ? Math.round(closedCapa.length / capas.length * 100) : 100;

  // Inspection average pass rate
  const insWithRate = inspections.filter(i => typeof i.passRate === 'number');
  const inspPassRate = insWithRate.length
    ? Math.round(insWithRate.reduce((a,b) => a+b.passRate, 0) / insWithRate.length)
    : 0;

  // Training completion (completed / total %)
  const trainYear = trainings.filter(t => (t.trainingDate||'').startsWith(String(year)));
  const trainCompleted = trainYear.filter(t => t.status === 'completed').length;
  const trainingCompletion = trainYear.length
    ? Math.round(trainCompleted / trainYear.length * 100) : 0;

  // Safety talks per month average
  const monthsElapsed = year < now.getFullYear() ? 12 :
    Math.max(1, now.getMonth() + 1);
  const safetyTalks = Math.round(talks.length / monthsElapsed);

  // Legal compliance %
  const compliantLg = legals.filter(l => l.status === 'compliant').length;
  const legalCompliance = legals.length
    ? Math.round(compliantLg / legals.length * 100) : 100;

  // BBS observations per month
  const bbs = Math.round(obs.length / monthsElapsed);

  // Drills in year
  const drillYear = drills.filter(d => (d.drillDate||'').startsWith(String(year)));

  // Contractor induction rate
  const activeCtc = contractors.filter(c => c.status === 'active');
  const allWorkers  = activeCtc.flatMap(c => c.workers||[]);
  const indWorkers  = allWorkers.filter(w => w.induction === 'completed').length;
  const contractorInduction = allWorkers.length
    ? Math.round(indWorkers / allWorkers.length * 100) : 100;

  return {
    incidents:          kpis.total,
    lti:                kpis.lti,
    lostDays,
    nearMiss:           nearMiss.length,
    capaCloseRate,
    inspPassRate,
    trainingCompletion,
    safetyTalks,
    legalCompliance,
    bbs,
    drills:             drillYear.length,
    contractorInduction,
  };
}

/* ── traffic light ── */
function getStatus(def, actual, target) {
  if (target === undefined || target === null) return 'grey';
  if (def.direction === 'lower') {
    if (actual <= target)          return 'green';
    if (actual <= target * 1.5 || (target === 0 && actual <= 2)) return 'yellow';
    return 'red';
  } else {
    if (actual >= target)          return 'green';
    if (actual >= target * 0.8)    return 'yellow';
    return 'red';
  }
}
const statusIcon = { green:'✅', yellow:'⚠️', red:'❌', grey:'—' };

function pct(def, actual, target) {
  if (!target) return def.direction === 'lower' ? (actual === 0 ? 100 : 0) : 0;
  if (def.direction === 'lower') {
    return target === 0
      ? (actual === 0 ? 100 : Math.max(0, 100 - actual * 50))
      : Math.max(0, Math.min(100, Math.round((1 - (actual - target) / target) * 100)));
  }
  return Math.min(100, Math.round(actual / target * 100));
}
const barColor = { green:'#16a34a', yellow:'#d97706', red:'#dc2626', grey:'#94a3b8' };

/* ── edit modal ── */
window.__kpi_openEdit = () => {
  document.getElementById('editYear').textContent = _year;
  document.getElementById('editRows').innerHTML = KPI_DEFINITIONS.map(d => `
    <div class="tgt-row">
      <label>${d.label} <span style="color:#94a3b8;font-size:.75rem">(${d.unit})</span></label>
      <input type="number" id="tgt_${d.key}" value="${_targets[d.key] ?? d.defaultTarget}" min="0" max="9999" step="${d.unit==='%'?1:1}">
    </div>`).join('');
  document.getElementById('editModal').classList.add('open');
};
window.__kpi_closeEdit = () => document.getElementById('editModal').classList.remove('open');

window.__kpi_saveTargets = async () => {
  const newTargets = {};
  KPI_DEFINITIONS.forEach(d => {
    const v = +document.getElementById(`tgt_${d.key}`)?.value;
    newTargets[d.key] = isNaN(v) ? d.defaultTarget : v;
  });
  await saveKpiTargets(_year, newTargets, _profile.uid);
  _targets = newTargets;
  window.__kpi_closeEdit();
  render();
};

/* ── render ── */
function render() {
  const green  = KPI_DEFINITIONS.filter(d => getStatus(d, _actuals[d.key]??0, _targets[d.key]) === 'green').length;
  const yellow = KPI_DEFINITIONS.filter(d => getStatus(d, _actuals[d.key]??0, _targets[d.key]) === 'yellow').length;
  const red    = KPI_DEFINITIONS.filter(d => getStatus(d, _actuals[d.key]??0, _targets[d.key]) === 'red').length;
  const grey   = KPI_DEFINITIONS.filter(d => getStatus(d, _actuals[d.key]??0, _targets[d.key]) === 'grey').length;
  const totalSet = KPI_DEFINITIONS.length - grey;
  const overallPct = totalSet ? Math.round(green / KPI_DEFINITIONS.length * 100) : 0;

  document.getElementById('kpiMain').innerHTML = `
    <!-- Year bar -->
    <div class="year-bar">
      <select onchange="window.__kpi_setYear(+this.value)">
        ${[0,1,2].map(i => {
          const y = now.getFullYear() - i;
          return `<option value="${y}" ${y===_year?'selected':''}>${y+543}</option>`;
        }).join('')}
      </select>
      <button class="btn btn-primary no-print" onclick="window.__kpi_openEdit()">⚙️ ตั้งเป้าหมาย</button>
      <button class="btn no-print" onclick="window.print()">🖨️ พิมพ์</button>
      <span style="font-size:.82rem;color:#64748b">อัปเดตล่าสุด: ข้อมูลจริงจากระบบทุกครั้งที่โหลดหน้า</span>
    </div>

    <!-- Summary strip -->
    <div class="summary-strip">
      <div class="sum-box">
        <div class="n" style="color:#16a34a">${green}</div>
        <div class="l">✅ บรรลุเป้าหมาย</div>
      </div>
      <div class="sum-box">
        <div class="n" style="color:#d97706">${yellow}</div>
        <div class="l">⚠️ ใกล้เป้า</div>
      </div>
      <div class="sum-box">
        <div class="n" style="color:#dc2626">${red}</div>
        <div class="l">❌ ต่ำกว่าเป้า</div>
      </div>
      <div class="sum-box">
        <div class="n" style="color:#1e3a5f">${overallPct}%</div>
        <div class="l">Overall KPI Score</div>
      </div>
    </div>

    <!-- KPI cards -->
    <div class="kpi-grid">
      ${KPI_DEFINITIONS.map(d => kpiCard(d)).join('')}
    </div>`;
}

function kpiCard(d) {
  const actual  = _actuals[d.key] ?? 0;
  const target  = _targets[d.key] ?? d.defaultTarget;
  const status  = getStatus(d, actual, target);
  const barPct  = pct(d, actual, target);
  const icon    = statusIcon[status];
  const color   = barColor[status];

  const diff = actual - target;
  const diffTxt = d.direction === 'lower'
    ? (diff === 0 ? 'ตรงเป้า' : diff > 0 ? `+${diff} ${d.unit}เกินเป้า` : `${Math.abs(diff)} ${d.unit}ต่ำกว่าเป้า`)
    : (diff === 0 ? 'ตรงเป้า' : diff > 0 ? `+${diff} ${d.unit}เกินเป้า` : `${Math.abs(diff)} ${d.unit}ต่ำกว่าเป้า`);

  return `
  <div class="kpi-card ${status}">
    <div class="kpi-top">
      <div class="kpi-label">${d.label}</div>
      <div class="kpi-traffic ${status}">${icon}</div>
    </div>
    <div class="kpi-vals">
      <div>
        <div class="kpi-target">เป้า: ${target} ${d.unit}</div>
        <div style="display:flex;align-items:flex-end;gap:.3rem">
          <div class="kpi-actual" style="color:${color}">${actual}</div>
          <div class="kpi-unit">${d.unit}</div>
        </div>
      </div>
    </div>
    <div class="kpi-bar-track">
      <div class="kpi-bar-fill" style="width:${barPct}%;background:${color}"></div>
    </div>
    <div class="kpi-footer">
      <span>${diffTxt}</span>
      <span>${barPct}%</span>
    </div>
  </div>`;
}

/* ── year change ── */
window.__kpi_setYear = async y => {
  _year = y;
  document.getElementById('kpiMain').innerHTML =
    '<p style="color:#94a3b8;font-style:italic;padding:2rem">กำลังโหลดข้อมูล...</p>';
  await loadYear();
};

async function loadYear() {
  const [saved, actuals] = await Promise.all([
    getKpiTargets(_year),
    computeActuals(_year),
  ]);
  _targets = saved?.targets || {};
  _actuals = actuals;
  render();
}

/* ── inject & load ── */
const main = document.querySelector('main') || document.querySelector('.page-content')
          || document.querySelector('#content') || document.body;
main.insertAdjacentHTML('beforeend',
  `<div style="padding:1rem 1.5rem 3rem" id="kpiMain">
     <p style="color:#94a3b8;font-style:italic">กำลังโหลดข้อมูล...</p>
   </div>`);

await loadYear();
</script>
</body>
</html>
