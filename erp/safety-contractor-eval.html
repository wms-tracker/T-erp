<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ประเมินผู้รับเหมาด้านความปลอดภัย</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root{--c-primary:#2563eb;--c-success:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-gray:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.toolbar input{flex:1;min-width:160px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f1f5f9;padding:10px 12px;text-align:left;font-size:.8rem;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
td{padding:10px 12px;font-size:.85rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
/* Panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(680px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1.05rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:70px}
.section-title{font-size:.9rem;font-weight:700;color:#334155;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
.score-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px 10px;background:#f8fafc;border-radius:8px}
.score-label{flex:1;font-size:.82rem;color:#334155}
.score-weight{font-size:.75rem;color:#9ca3af;white-space:nowrap}
.score-input{width:70px;padding:5px 8px;border:1px solid #d1d5db;border-radius:6px;font-size:.85rem;text-align:center}
.score-bar-wrap{width:80px;background:#e2e8f0;border-radius:4px;height:6px;overflow:hidden}
.score-bar{height:100%;background:var(--c-primary);border-radius:4px;transition:width .3s}
.total-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:10px;padding:14px 18px;margin:16px 0;display:flex;align-items:center;gap:16px}
.total-score-num{font-size:2.2rem;font-weight:800;color:var(--c-primary)}
.total-grade{font-size:1rem;font-weight:700}
.tab-bar{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid #e2e8f0;padding-bottom:0}
.tab-btn{padding:8px 16px;border:none;background:none;font-family:inherit;font-size:.85rem;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}
.detail-view{padding:20px}
.detail-section{background:#f8fafc;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.detail-section h3{font-size:.9rem;font-weight:700;color:#334155;margin-bottom:10px}
.detail-row{display:flex;gap:8px;margin-bottom:6px;font-size:.83rem}
.detail-row .dk{color:#6b7280;width:160px;flex-shrink:0}
.detail-row .dv{color:#1e293b;font-weight:500}
.score-detail-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #e2e8f0;font-size:.82rem}
.score-detail-row:last-child{border-bottom:none}
.score-detail-label{flex:1;color:#334155}
.score-detail-val{font-weight:700;color:var(--c-primary);width:40px;text-align:right}
.score-detail-bar-wrap{width:100px;background:#e2e8f0;border-radius:4px;height:5px}
.score-detail-bar{height:100%;background:var(--c-primary);border-radius:4px}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
</style>
</head>
<body>
<script type="module">
import { requireRole, renderShell } from './js/shell.js';
import { db } from './js/auth.js';
import {
  COL,
  CEVAL_CRITERIA_PREQUALIFY, CEVAL_CRITERIA_ONSITE,
  CEVAL_GRADE, CEVAL_APPROVAL, CEVAL_WORK_TYPE,
  calcCEvalScore, getCEvalGrade,
  listContractorEval, getContractorEval,
  createContractorEval, updateContractorEval, deleteContractorEval,
} from './js/safety-data.js';
import { collection, query, orderBy, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(profile, 'safety-contractor-eval', 'ประเมินผู้รับเหมาด้านความปลอดภัย');

// ── State ──
let allRecs = [];
let editId   = null;
let preqScores = {}, onsiteScores = {};
let viewRec  = null;

// ── Render KPI ──
function renderKPI(recs) {
  const total  = recs.length;
  const approved    = recs.filter(r=>r.approvalStatus==='approved').length;
  const conditional = recs.filter(r=>r.approvalStatus==='conditional').length;
  const rejected    = recs.filter(r=>r.approvalStatus==='rejected').length;
  const pending     = recs.filter(r=>r.approvalStatus==='pending').length;
  return `
  <div class="kpi-row">
    <div class="kpi"><div class="num">${total}</div><div class="lbl">ทั้งหมด</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${approved}</div><div class="lbl">✅ อนุมัติ</div></div>
    <div class="kpi" style="border-color:#d97706"><div class="num" style="color:#d97706">${conditional}</div><div class="lbl">⚠️ มีเงื่อนไข</div></div>
    <div class="kpi" style="border-color:#dc2626"><div class="num" style="color:#dc2626">${rejected}</div><div class="lbl">❌ ไม่ผ่าน</div></div>
    <div class="kpi" style="border-color:#6b7280"><div class="num" style="color:#6b7280">${pending}</div><div class="lbl">⏳ รอตรวจ</div></div>
  </div>`;
}

// ── Render Table ──
function renderTable(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon">🏗️</div><p>ยังไม่มีข้อมูลการประเมิน</p></div>`;
  const rows = recs.map(r => {
    const a = CEVAL_APPROVAL[r.approvalStatus] || CEVAL_APPROVAL.pending;
    const wt = CEVAL_WORK_TYPE.find(w=>w.key===r.workType) || { icon:'🔖', label: r.workType||'—' };
    const preqScore  = r.preqTotalScore  != null ? r.preqTotalScore.toFixed(1)  : '—';
    const onsiteScore= r.onsiteTotalScore!= null ? r.onsiteTotalScore.toFixed(1): '—';
    const finalScore = r.finalScore      != null ? r.finalScore.toFixed(1)      : '—';
    const grade      = r.finalScore      != null ? getCEvalGrade(r.finalScore)  : null;
    return `<tr>
      <td><strong>${r.contractorName||'—'}</strong><br/><span style="font-size:.75rem;color:#6b7280">${r.contractorId||''}</span></td>
      <td>${wt.icon} ${wt.label}</td>
      <td>${r.evalDate||'—'}</td>
      <td style="text-align:center">${preqScore}</td>
      <td style="text-align:center">${onsiteScore}</td>
      <td style="text-align:center">${grade?`<span style="font-weight:700;color:${grade.color}">${finalScore}</span>`:finalScore}</td>
      <td><span class="badge" style="color:${a.color};background:${a.bg}">${a.icon} ${a.label}</span></td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="window.__viewEval('${r.id}')">ดู</button>
        <button class="btn btn-sm btn-ghost" onclick="window.__editEval('${r.id}')">แก้ไข</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deleteEval('${r.id}','${(r.contractorName||'').replace(/'/g,"\\'")}')">ลบ</button>
      </td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>ผู้รับเหมา</th><th>ประเภทงาน</th><th>วันที่ประเมิน</th>
      <th style="text-align:center">Prequalify</th><th style="text-align:center">On-site</th><th style="text-align:center">รวม</th>
      <th>สถานะ</th><th>จัดการ</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── Score row helper ──
function scoreRow(c, scoreObj, prefix) {
  const v = scoreObj[c.key] || 0;
  return `<div class="score-row">
    <div class="score-label">${c.label}</div>
    <div class="score-weight">น้ำหนัก ${c.weight}%</div>
    <div class="score-bar-wrap"><div class="score-bar" id="bar-${prefix}-${c.key}" style="width:${v}%"></div></div>
    <input class="score-input" type="number" min="0" max="100" value="${v}"
      oninput="window.__scoreChange('${prefix}','${c.key}',this.value)"
      id="inp-${prefix}-${c.key}"/>
  </div>`;
}

// ── Render panel form ──
function renderPanelForm(rec) {
  const wts = CEVAL_WORK_TYPE.map(w=>`<option value="${w.key}" ${(rec?.workType===w.key)?'selected':''}>${w.icon} ${w.label}</option>`).join('');
  const appOpts = Object.entries(CEVAL_APPROVAL).map(([k,v])=>`<option value="${k}" ${(rec?.approvalStatus===k)?'selected':''}>${v.label}</option>`).join('');
  const preqRows  = CEVAL_CRITERIA_PREQUALIFY.map(c=>scoreRow(c, preqScores,  'preq')).join('');
  const onsiteRows= CEVAL_CRITERIA_ONSITE.map(c=>scoreRow(c, onsiteScores, 'onsite')).join('');
  return `
  <form id="eval-form" onsubmit="return false">
    <div class="tab-bar">
      <button type="button" class="tab-btn active" onclick="window.__switchTab('info')">ข้อมูลทั่วไป</button>
      <button type="button" class="tab-btn" onclick="window.__switchTab('preq')">Prequalification</button>
      <button type="button" class="tab-btn" onclick="window.__switchTab('onsite')">On-site</button>
      <button type="button" class="tab-btn" onclick="window.__switchTab('summary')">สรุปผล</button>
    </div>

    <div class="tab-panel active" id="tab-info">
      <div class="form-row">
        <div class="form-group"><label>ชื่อผู้รับเหมา *</label>
          <input id="f-contractorName" value="${rec?.contractorName||''}" placeholder="บริษัท/บุคคล" required/></div>
        <div class="form-group"><label>รหัสผู้รับเหมา</label>
          <input id="f-contractorId" value="${rec?.contractorId||''}" placeholder="CTR-001"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>ผู้ติดต่อ</label>
          <input id="f-contactPerson" value="${rec?.contactPerson||''}" placeholder="ชื่อ-นามสกุล"/></div>
        <div class="form-group"><label>โทรศัพท์</label>
          <input id="f-contactPhone" value="${rec?.contactPhone||''}" placeholder="08x-xxx-xxxx"/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>ประเภทงาน</label>
          <select id="f-workType">${wts}</select></div>
        <div class="form-group"><label>วันที่ประเมิน *</label>
          <input id="f-evalDate" type="date" value="${rec?.evalDate||''}" required/></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>วันเริ่มงาน</label>
          <input id="f-workStart" type="date" value="${rec?.workStart||''}"/></div>
        <div class="form-group"><label>วันสิ้นสุดงาน</label>
          <input id="f-workEnd" type="date" value="${rec?.workEnd||''}"/></div>
      </div>
      <div class="form-row one">
        <div class="form-group"><label>ขอบเขตงาน/รายละเอียด</label>
          <textarea id="f-workScope" rows="3" placeholder="ระบุรายละเอียดงานที่รับเหมา">${rec?.workScope||''}</textarea></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-preq">
      <div class="section-title">คะแนน Pre-qualification — เอกสารและเงื่อนไขก่อนเริ่มงาน</div>
      ${preqRows}
      <div class="total-box" id="preq-total-box">
        <div class="total-score-num" id="preq-total">0</div>
        <div><div class="total-grade" id="preq-grade">—</div><div style="font-size:.78rem;color:#6b7280">คะแนน Prequalification</div></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-onsite">
      <div class="section-title">คะแนน On-site — พฤติกรรมและการปฏิบัติงานจริง</div>
      ${onsiteRows}
      <div class="total-box" id="onsite-total-box">
        <div class="total-score-num" id="onsite-total">0</div>
        <div><div class="total-grade" id="onsite-grade">—</div><div style="font-size:.78rem;color:#6b7280">คะแนน On-site</div></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-summary">
      <div class="section-title">สรุปผลการประเมิน</div>
      <div class="form-row">
        <div class="form-group"><label>น้ำหนัก Prequalification (%)</label>
          <input id="f-preqWeight" type="number" min="0" max="100" value="${rec?.preqWeight??50}" oninput="window.__recalcFinal()"/></div>
        <div class="form-group"><label>น้ำหนัก On-site (%)</label>
          <input id="f-onsiteWeight" type="number" min="0" max="100" value="${rec?.onsiteWeight??50}" oninput="window.__recalcFinal()"/></div>
      </div>
      <div class="total-box" id="final-total-box">
        <div class="total-score-num" id="final-score">0</div>
        <div>
          <div class="total-grade" id="final-grade">—</div>
          <div style="font-size:.78rem;color:#6b7280">คะแนนรวมสุดท้าย</div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>ผลการตัดสิน</label>
          <select id="f-approvalStatus">${appOpts}</select></div>
        <div class="form-group"><label>ผู้ประเมิน</label>
          <input id="f-evaluator" value="${rec?.evaluator||profile.name||''}" placeholder="ชื่อ Safety Officer"/></div>
      </div>
      <div class="form-row one">
        <div class="form-group"><label>เงื่อนไขพิเศษ / หมายเหตุ</label>
          <textarea id="f-conditions" rows="3" placeholder="ระบุเงื่อนไขที่ต้องปฏิบัติตามก่อนเริ่มงาน หรือหมายเหตุอื่นๆ">${rec?.conditions||''}</textarea></div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button type="button" class="btn btn-primary" onclick="window.__saveEval()">💾 บันทึก</button>
      <button type="button" class="btn btn-ghost"   onclick="window.__closePanel()">ยกเลิก</button>
    </div>
  </form>`;
}

// ── Render Detail View ──
function renderDetail(r) {
  const a  = CEVAL_APPROVAL[r.approvalStatus] || CEVAL_APPROVAL.pending;
  const wt = CEVAL_WORK_TYPE.find(w=>w.key===r.workType) || { icon:'🔖', label: r.workType||'—' };
  const grade = r.finalScore != null ? getCEvalGrade(r.finalScore) : null;

  const preqRows = CEVAL_CRITERIA_PREQUALIFY.map(c=>{
    const v = (r.preqScores||{})[c.key]||0;
    return `<div class="score-detail-row">
      <div class="score-detail-label">${c.label} <span style="color:#9ca3af;font-size:.73rem">(น้ำหนัก ${c.weight}%)</span></div>
      <div class="score-detail-bar-wrap"><div class="score-detail-bar" style="width:${v}%;background:${v>=80?'#16a34a':v>=60?'#d97706':'#dc2626'}"></div></div>
      <div class="score-detail-val">${v}</div>
    </div>`;
  }).join('');

  const onsiteRows = CEVAL_CRITERIA_ONSITE.map(c=>{
    const v = (r.onsiteScores||{})[c.key]||0;
    return `<div class="score-detail-row">
      <div class="score-detail-label">${c.label} <span style="color:#9ca3af;font-size:.73rem">(น้ำหนัก ${c.weight}%)</span></div>
      <div class="score-detail-bar-wrap"><div class="score-detail-bar" style="width:${v}%;background:${v>=80?'#16a34a':v>=60?'#d97706':'#dc2626'}"></div></div>
      <div class="score-detail-val">${v}</div>
    </div>`;
  }).join('');

  return `<div class="detail-view">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <div style="font-size:1.2rem;font-weight:800">${r.contractorName||'—'}</div>
        <div style="color:#6b7280;font-size:.82rem">${wt.icon} ${wt.label} &nbsp;•&nbsp; ${r.evalDate||'—'}</div>
      </div>
      <span class="badge" style="color:${a.color};background:${a.bg};font-size:.85rem">${a.icon} ${a.label}</span>
      ${grade?`<span style="font-size:1.5rem;font-weight:800;color:${grade.color};margin-left:auto">${(r.finalScore||0).toFixed(1)} pts</span>`:''}
    </div>

    ${grade?`<div class="total-box" style="margin-bottom:16px">
      <div style="font-size:2rem;font-weight:800;color:${grade.color}">${(r.finalScore||0).toFixed(1)}</div>
      <div><div style="font-weight:700;font-size:.95rem;color:${grade.color}">${grade.label}</div>
           <div style="font-size:.78rem;color:#6b7280">Prequalify ${(r.preqTotalScore||0).toFixed(1)} pts &nbsp;|&nbsp; On-site ${(r.onsiteTotalScore||0).toFixed(1)} pts</div></div>
    </div>`:''}

    <div class="detail-section">
      <h3>ข้อมูลทั่วไป</h3>
      <div class="detail-row"><span class="dk">รหัสผู้รับเหมา</span><span class="dv">${r.contractorId||'—'}</span></div>
      <div class="detail-row"><span class="dk">ผู้ติดต่อ</span><span class="dv">${r.contactPerson||'—'} ${r.contactPhone?'('+r.contactPhone+')':''}</span></div>
      <div class="detail-row"><span class="dk">ระยะเวลางาน</span><span class="dv">${r.workStart||'—'} ถึง ${r.workEnd||'—'}</span></div>
      <div class="detail-row"><span class="dk">ขอบเขตงาน</span><span class="dv">${r.workScope||'—'}</span></div>
      <div class="detail-row"><span class="dk">ผู้ประเมิน</span><span class="dv">${r.evaluator||'—'}</span></div>
      ${r.conditions?`<div class="detail-row"><span class="dk">เงื่อนไข/หมายเหตุ</span><span class="dv">${r.conditions}</span></div>`:''}
    </div>

    <div class="detail-section">
      <h3>Prequalification — คะแนน ${(r.preqTotalScore||0).toFixed(1)} / 100</h3>
      ${preqRows}
    </div>
    <div class="detail-section">
      <h3>On-site Evaluation — คะแนน ${(r.onsiteTotalScore||0).toFixed(1)} / 100</h3>
      ${onsiteRows}
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button class="btn btn-ghost btn-sm" onclick="window.__editEval('${r.id}')">✏️ แก้ไข</button>
      <button class="btn btn-danger btn-sm" onclick="window.__deleteEval('${r.id}','${(r.contractorName||'').replace(/'/g,"\\'")}')">🗑️ ลบ</button>
    </div>
  </div>`;
}

// ── Score helpers ──
function recalcScoreUI(prefix, criteria, scoreObj) {
  const score = calcCEvalScore(scoreObj, criteria);
  const g = getCEvalGrade(score);
  const totalEl = document.getElementById(`${prefix}-total`);
  const gradeEl = document.getElementById(`${prefix}-grade`);
  if (totalEl) totalEl.textContent = score.toFixed(1);
  if (gradeEl) { gradeEl.textContent = g.label; gradeEl.style.color = g.color; }
}
window.__scoreChange = (prefix, key, val) => {
  const v = Math.min(100, Math.max(0, Number(val)||0));
  if (prefix==='preq')   { preqScores[key]   = v; recalcScoreUI('preq',   CEVAL_CRITERIA_PREQUALIFY, preqScores); }
  if (prefix==='onsite') { onsiteScores[key] = v; recalcScoreUI('onsite', CEVAL_CRITERIA_ONSITE,     onsiteScores); }
  const bar = document.getElementById(`bar-${prefix}-${key}`);
  if (bar) bar.style.width = v + '%';
  window.__recalcFinal();
};
window.__recalcFinal = () => {
  const pw = Number(document.getElementById('f-preqWeight')?.value  || 50);
  const ow = Number(document.getElementById('f-onsiteWeight')?.value || 50);
  const preqScore   = calcCEvalScore(preqScores,   CEVAL_CRITERIA_PREQUALIFY);
  const onsiteScore = calcCEvalScore(onsiteScores, CEVAL_CRITERIA_ONSITE);
  const finalScore  = pw + ow > 0 ? (preqScore * pw + onsiteScore * ow) / (pw + ow) : 0;
  const g = getCEvalGrade(finalScore);
  const el = document.getElementById('final-score');
  const gl = document.getElementById('final-grade');
  if (el) el.textContent = finalScore.toFixed(1);
  if (gl) { gl.textContent = g.label; gl.style.color = g.color; }
  // auto-set approval from grade
  const asSel = document.getElementById('f-approvalStatus');
  if (asSel) asSel.value = g.approved;
};

// ── Tabs ──
window.__switchTab = (tab) => {
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    const tabs=['info','preq','onsite','summary'];
    b.classList.toggle('active', tabs[i]===tab);
  });
  document.querySelectorAll('.tab-panel').forEach(p=>{
    p.classList.toggle('active', p.id==='tab-'+tab);
  });
};

// ── Panel open/close ──
window.__closePanel = ()=>{
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
function openPanel(html, title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  // init totals
  recalcScoreUI('preq',   CEVAL_CRITERIA_PREQUALIFY, preqScores);
  recalcScoreUI('onsite', CEVAL_CRITERIA_ONSITE,     onsiteScores);
  window.__recalcFinal();
}

// ── New / Edit ──
window.__newEval = ()=>{
  editId = null;
  preqScores = {}; onsiteScores = {};
  openPanel(renderPanelForm(null), '+ เพิ่มการประเมินผู้รับเหมา');
};
window.__editEval = async (id) => {
  editId = id;
  const r = await getContractorEval(id);
  preqScores   = { ...(r.preqScores   || {}) };
  onsiteScores = { ...(r.onsiteScores || {}) };
  openPanel(renderPanelForm(r), '✏️ แก้ไขการประเมิน');
};

// ── View detail ──
window.__viewEval = async (id) => {
  const r = await getContractorEval(id);
  viewRec = r;
  document.getElementById('panel-title').textContent = '📋 รายละเอียดการประเมิน';
  document.getElementById('panel-content').innerHTML = renderDetail(r);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
};

// ── Save ──
window.__saveEval = async ()=>{
  const pw = Number(document.getElementById('f-preqWeight').value||50);
  const ow = Number(document.getElementById('f-onsiteWeight').value||50);
  const preqScore   = calcCEvalScore(preqScores,   CEVAL_CRITERIA_PREQUALIFY);
  const onsiteScore = calcCEvalScore(onsiteScores, CEVAL_CRITERIA_ONSITE);
  const finalScore  = pw + ow > 0 ? (preqScore * pw + onsiteScore * ow) / (pw + ow) : 0;
  const grade       = getCEvalGrade(finalScore);
  const data = {
    contractorName:  document.getElementById('f-contractorName').value.trim(),
    contractorId:    document.getElementById('f-contractorId').value.trim(),
    contactPerson:   document.getElementById('f-contactPerson').value.trim(),
    contactPhone:    document.getElementById('f-contactPhone').value.trim(),
    workType:        document.getElementById('f-workType').value,
    evalDate:        document.getElementById('f-evalDate').value,
    workStart:       document.getElementById('f-workStart').value,
    workEnd:         document.getElementById('f-workEnd').value,
    workScope:       document.getElementById('f-workScope').value.trim(),
    preqScores:      { ...preqScores },
    onsiteScores:    { ...onsiteScores },
    preqTotalScore:  preqScore,
    onsiteTotalScore:onsiteScore,
    preqWeight:      pw,
    onsiteWeight:    ow,
    finalScore,
    grade:           grade.label,
    approvalStatus:  document.getElementById('f-approvalStatus').value,
    evaluator:       document.getElementById('f-evaluator').value.trim(),
    conditions:      document.getElementById('f-conditions').value.trim(),
  };
  if (!data.contractorName || !data.evalDate) { alert('กรุณากรอกชื่อผู้รับเหมาและวันที่'); return; }
  try {
    if (editId) await updateContractorEval(editId, data);
    else        await createContractorEval(data, profile.uid||profile.email||'unknown');
    window.__closePanel();
    await loadData();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

// ── Delete ──
window.__deleteEval = async (id, name) => {
  if (!confirm(`ลบการประเมิน "${name}" ออกจากระบบ?`)) return;
  await deleteContractorEval(id);
  window.__closePanel();
  await loadData();
};

// ── Filter + render ──
function applyFilter() {
  const q   = document.getElementById('search-box')?.value.toLowerCase()||'';
  const st  = document.getElementById('filter-status')?.value||'';
  const wt  = document.getElementById('filter-wtype')?.value||'';
  const filtered = allRecs.filter(r => {
    const matchQ  = !q || (r.contractorName||'').toLowerCase().includes(q) || (r.contractorId||'').toLowerCase().includes(q);
    const matchSt = !st || r.approvalStatus===st;
    const matchWt = !wt || r.workType===wt;
    return matchQ && matchSt && matchWt;
  });
  document.getElementById('table-wrap').innerHTML = renderTable(filtered);
}

async function loadData() {
  allRecs = await listContractorEval();
  document.getElementById('kpi-wrap').innerHTML = renderKPI(allRecs);
  applyFilter();
}

// ── Build UI ──
const wtOpts = `<option value="">-- ทุกประเภท --</option>` +
  CEVAL_WORK_TYPE.map(w=>`<option value="${w.key}">${w.icon} ${w.label}</option>`).join('');
const stOpts = `<option value="">-- ทุกสถานะ --</option>` +
  Object.entries(CEVAL_APPROVAL).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');

main.innerHTML = `
  <div style="padding:20px">
    <div id="kpi-wrap"></div>
    <div class="toolbar">
      <input id="search-box" placeholder="🔍 ค้นหาชื่อผู้รับเหมา…" oninput="applyFilter()"/>
      <select id="filter-status" onchange="applyFilter()">${stOpts}</select>
      <select id="filter-wtype"  onchange="applyFilter()">${wtOpts}</select>
      <button class="btn btn-primary" onclick="window.__newEval()">+ เพิ่มการประเมิน</button>
    </div>
    <div id="table-wrap"></div>
  </div>

  <div class="panel-overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-head">
      <h2 id="panel-title">ประเมินผู้รับเหมา</h2>
      <button class="btn btn-ghost btn-sm" onclick="window.__closePanel()">✕ ปิด</button>
    </div>
    <div class="panel-body" id="panel-content"></div>
  </div>
`;

// expose applyFilter globally (used by oninput/onchange inline)
window.applyFilter = applyFilter;

await loadData();
</script>
