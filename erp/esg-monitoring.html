<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แบบฟอร์มตรวจสอบ Monitoring</title>
  <link rel="stylesheet" href="./css/main.css">
  <style>
    .period-bar{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:1.2rem}
    .period-bar select,.period-bar input{padding:.35rem .65rem;border-radius:6px;border:1px solid #cbd5e1;font-size:.88rem;background:#fff}

    .mon-section{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;margin-bottom:1rem}
    .mon-sec-head{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem;background:#f8fafc;border-bottom:1px solid #e2e8f0}
    .mon-sec-num{width:24px;height:24px;border-radius:50%;background:#1e3a5f;color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .mon-sec-title{font-size:.9rem;font-weight:700;color:#1e3a5f}
    .mon-sec-en{font-size:.74rem;color:#94a3b8;margin-left:auto}
    .mon-sec-body{padding:.9rem 1rem}

    .info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.65rem}
    .f-label{font-size:.76rem;color:#64748b;font-weight:600;margin-bottom:.22rem}
    .f-input{width:100%;padding:.38rem .6rem;border:1px solid #cbd5e1;border-radius:7px;background:#f8faff;color:#1e293b;font-family:'Sarabun',sans-serif;font-size:.88rem}
    .f-input:focus{outline:none;border-color:#1e3a5f;box-shadow:0 0 0 2px #dbeafe}

    /* Equipment table */
    .eq-tbl{width:100%;border-collapse:collapse;font-size:.82rem}
    .eq-tbl th{background:#f1f5f9;color:#334155;padding:.45rem .65rem;text-align:left;font-weight:700;border-bottom:2px solid #e2e8f0;white-space:nowrap}
    .eq-tbl td{padding:.5rem .65rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
    .eq-tbl tr:last-child td{border-bottom:none}
    .eq-tbl tr:hover td{background:#f8fafc}
    .eq-name{font-weight:600;color:#1e293b}
    .eq-model{font-size:.76rem;color:#94a3b8}
    .eq-qty{font-weight:700;color:#1e3a5f;text-align:center;font-variant-numeric:tabular-nums}
    .radio-grp{display:flex;gap:.4rem;align-items:center}
    .radio-grp label{display:flex;align-items:center;gap:.2rem;font-size:.8rem;cursor:pointer;white-space:nowrap}
    .radio-grp input[type=radio]{accent-color:#1e3a5f}
    .num-inp{width:60px;padding:.28rem .4rem;border:1px solid #cbd5e1;border-radius:6px;background:#f8faff;color:#1e293b;font-size:.82rem;text-align:center}
    .num-inp:focus{outline:none;border-color:#1e3a5f}
    .note-inp{padding:.28rem .5rem;border:1px solid #cbd5e1;border-radius:6px;background:#f8faff;color:#1e293b;font-size:.78rem;width:100%}
    .note-inp:focus{outline:none;border-color:#1e3a5f}

    /* KPI table */
    .kpi-tbl{width:100%;border-collapse:collapse;font-size:.81rem}
    .kpi-tbl th{background:#f1f5f9;color:#334155;padding:.42rem .65rem;font-weight:700;border-bottom:2px solid #e2e8f0}
    .kpi-tbl th:first-child{text-align:left}
    .kpi-tbl td{padding:.48rem .65rem;border-bottom:1px solid #f1f5f9;vertical-align:middle;text-align:center}
    .kpi-tbl td.left{text-align:left}
    .kpi-tbl tr:last-child td{border-bottom:none}
    .kpi-tbl tr:hover td{background:#f8fafc}
    .kpi-domain{padding:.38rem .65rem;font-size:.78rem;font-weight:700;background:#1e3a5f;color:#fff;text-transform:uppercase;letter-spacing:.04em}
    .tgt-badge{display:inline-block;background:#fdf3dc;color:#c8972a;padding:.08rem .45rem;border-radius:20px;font-size:.73rem;font-weight:600;white-space:nowrap}
    .kpi-inp{width:85px;padding:.28rem .45rem;border:1px solid #cbd5e1;border-radius:6px;background:#f8faff;color:#1e293b;font-size:.85rem;text-align:center}
    .kpi-inp:focus{outline:none;border-color:#1e3a5f}
    .live-dot{width:9px;height:9px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:3px;background:#e2e8f0}
    .dot-ok{background:#16a34a}
    .dot-warn{background:#d97706}
    .dot-fail{background:#dc2626}

    /* Checklist */
    .cl-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
    @media(max-width:600px){.cl-grid{grid-template-columns:1fr}}
    .cl-title{font-size:.77rem;font-weight:700;color:#1e3a5f;margin-bottom:.45rem;text-transform:uppercase;letter-spacing:.04em}
    .cl-list{list-style:none}
    .cl-list li{display:flex;align-items:center;gap:.5rem;padding:.38rem 0;border-bottom:1px solid #f1f5f9}
    .cl-list li:last-child{border-bottom:none}
    .cl-list input[type=checkbox]{width:15px;height:15px;accent-color:#1e3a5f;flex-shrink:0}
    .cl-list .cl-lbl{flex:1;font-size:.85rem;color:#334155}
    .cl-note{width:160px;flex-shrink:0}

    /* Corrective action */
    .ca-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.65rem}
    @media(max-width:640px){.ca-grid{grid-template-columns:1fr}}
    .ca-box{background:#f8fafc;border-radius:8px;padding:.65rem .8rem}
    .ca-step-label{font-size:.75rem;font-weight:700;color:#1e3a5f;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.04em}
    .ca-ta{width:100%;padding:.4rem .55rem;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#1e293b;font-family:'Sarabun',sans-serif;font-size:.85rem;resize:vertical;min-height:60px}
    .ca-ta:focus{outline:none;border-color:#1e3a5f}

    /* Signature */
    .sig-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.9rem}
    @media(max-width:580px){.sig-row{grid-template-columns:1fr}}
    .sig-box{border:1px solid #e2e8f0;border-radius:8px;padding:.65rem .8rem}
    .sig-role{font-size:.73rem;font-weight:700;color:#94a3b8;margin-bottom:.35rem;text-transform:uppercase;letter-spacing:.04em}
    .sig-name{border:none;border-bottom:1px dashed #cbd5e1;background:none;color:#1e293b;font-family:'Sarabun',sans-serif;font-size:.86rem;width:100%;padding:.28rem 0}
    .sig-name:focus{outline:none;border-bottom-color:#1e3a5f}

    /* Action bar */
    .action-bar{display:flex;gap:.5rem;justify-content:flex-end;margin-bottom:1rem}
    .btn-reset{padding:.38rem .9rem;border-radius:7px;border:1px solid #e2e8f0;background:#fff;color:#64748b;font-family:'Sarabun',sans-serif;font-size:.84rem;cursor:pointer}
    .btn-reset:hover{background:#f1f5f9}

    @media(max-width:640px){
      .info-grid{grid-template-columns:1fr 1fr}
      .eq-tbl{font-size:.76rem}
      .kpi-tbl{font-size:.76rem}
      .kpi-inp{width:68px}
    }

    /* Document header */
    .doc-header{display:grid;grid-template-columns:auto 1fr auto;gap:0;border:2px solid #1e3a5f;border-radius:10px;overflow:hidden;margin-bottom:1rem;background:#fff}
    .doc-hd-logo{padding:.7rem 1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #1e3a5f;min-width:110px}
    .doc-hd-logo-circle{width:52px;height:52px;border-radius:50%;background:#1e3a5f;display:flex;align-items:center;justify-content:center;color:#c8972a;font-size:1.3rem;font-weight:900;letter-spacing:-.03em;margin-bottom:.25rem}
    .doc-hd-logo-name{font-size:.62rem;font-weight:700;color:#1e3a5f;text-align:center;line-height:1.3}
    .doc-hd-center{padding:.55rem .9rem;display:flex;flex-direction:column;justify-content:center;border-right:1px solid #1e3a5f}
    .doc-hd-title-th{font-size:1rem;font-weight:800;color:#1e3a5f;line-height:1.3}
    .doc-hd-title-en{font-size:.74rem;color:#64748b;margin-top:.1rem}
    .doc-hd-addr{font-size:.68rem;color:#94a3b8;margin-top:.25rem}
    .doc-hd-meta{padding:.4rem .8rem;display:grid;grid-template-rows:repeat(4,1fr);gap:.1rem;min-width:155px}
    .doc-meta-row{display:flex;align-items:center;gap:.35rem;font-size:.72rem;padding:.1rem 0;border-bottom:1px solid #f1f5f9}
    .doc-meta-row:last-child{border-bottom:none}
    .doc-meta-label{color:#94a3b8;white-space:nowrap;width:75px;flex-shrink:0}
    .doc-meta-val{color:#1e3a5f;font-weight:700}
    .doc-meta-input{border:none;border-bottom:1px dashed #cbd5e1;background:none;color:#1e3a5f;font-size:.72rem;font-weight:700;width:70px;padding:0;font-family:'Sarabun',sans-serif}
    .doc-meta-input:focus{outline:none;border-bottom-color:#1e3a5f}
    @media(max-width:580px){
      .doc-header{grid-template-columns:1fr;border-radius:8px}
      .doc-hd-logo{flex-direction:row;gap:.6rem;border-right:none;border-bottom:1px solid #1e3a5f;padding:.5rem .8rem}
      .doc-hd-center{border-right:none;border-bottom:1px solid #1e3a5f}
      .doc-hd-meta{grid-template-rows:unset;grid-template-columns:1fr 1fr}
    }

    /* Photo per equipment row */
    .photo-cell{display:flex;flex-direction:column;align-items:center;gap:.25rem}
    .photo-btn{width:34px;height:34px;border-radius:7px;border:1.5px dashed #cbd5e1;background:#f8faff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.95rem;flex-shrink:0;transition:border-color .15s}
    .photo-btn:hover{border-color:#1e3a5f;background:#eff6ff}
    .photo-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;border:1.5px solid #1e3a5f;cursor:pointer}

    /* Add equipment button */
    .add-eq-row{padding:.5rem .65rem;background:#f8fafc;border-top:1px dashed #cbd5e1;text-align:center}
    .btn-add-eq{background:none;border:1.5px dashed #1e3a5f;color:#1e3a5f;border-radius:7px;padding:.3rem .9rem;font-family:'Sarabun',sans-serif;font-size:.8rem;cursor:pointer;transition:background .15s}
    .btn-add-eq:hover{background:#eff6ff}
    .btn-del-eq{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.9rem;padding:.1rem .3rem;border-radius:4px;line-height:1}
    .btn-del-eq:hover{background:#fef2f2}
  </style>
</head>
<body>

<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';

const _profile = await requireRole(['admin','safety_officer','oel_manager','manager','managing_director','kpo']);
const main = renderShell(_profile, 'esg-monitoring', 'แบบฟอร์มตรวจสอบ Monitoring');

main.innerHTML = `
<div class="action-bar no-print">
  <button class="btn-reset" onclick="resetForm()">↺ ล้างข้อมูล</button>
  <button class="btn btn-primary no-print" onclick="window.print()" style="font-size:.84rem;padding:.38rem 1rem">🖨 พิมพ์</button>
</div>

<!-- Document Header -->
<div class="doc-header">
  <div class="doc-hd-logo">
    <div class="doc-hd-logo-circle">HG</div>
    <div class="doc-hd-logo-name">HORIZON GROUP<br>(THAILAND)</div>
  </div>
  <div class="doc-hd-center">
    <div class="doc-hd-title-th">แบบฟอร์มตรวจสอบและรายงานผล</div>
    <div class="doc-hd-title-en">Monitoring &amp; Reporting Form — ESG</div>
    <div class="doc-hd-addr">TPY Estate (Warehouse D &amp; F) · 12/1 Moo 2, Setthakij 1 Rd., Na Di, Mueang Samut Sakhon 74000</div>
  </div>
  <div class="doc-hd-meta">
    <div class="doc-meta-row"><span class="doc-meta-label">เลขที่เอกสาร</span><input class="doc-meta-input" value="HG-ESG-M-01"></div>
    <div class="doc-meta-row"><span class="doc-meta-label">แก้ไขครั้งที่</span><input class="doc-meta-input" value="00" style="width:35px"></div>
    <div class="doc-meta-row"><span class="doc-meta-label">วันที่บังคับใช้</span><input class="doc-meta-input" id="hd-effdate" style="width:90px"></div>
    <div class="doc-meta-row"><span class="doc-meta-label">หน้าที่</span><span class="doc-meta-val">1 / 1</span></div>
  </div>
</div>

<!-- 1 ข้อมูลทั่วไป -->
<div class="mon-section">
  <div class="mon-sec-head">
    <div class="mon-sec-num">1</div>
    <div class="mon-sec-title">ข้อมูลทั่วไป</div>
    <span class="mon-sec-en">General Information</span>
  </div>
  <div class="mon-sec-body">
    <div class="info-grid">
      <div><div class="f-label">วันที่ตรวจสอบ</div><input type="date" class="f-input" id="f-date"></div>
      <div><div class="f-label">ประเภทการตรวจสอบ</div>
        <select class="f-input" id="f-type">
          <option value="">-- เลือก --</option>
          <option>ตรวจสอบประจำวัน (Daily Check)</option>
          <option>ตรวจสอบประจำเดือน (Monthly Inspection)</option>
          <option>ตรวจสอบประจำปี (Annual Audit)</option>
        </select>
      </div>
      <div><div class="f-label">ผู้ตรวจสอบ</div><input type="text" class="f-input" id="f-inspector" placeholder="ชื่อ-สกุล"></div>
      <div><div class="f-label">แผนก / ตำแหน่ง</div><input type="text" class="f-input" id="f-dept" placeholder="แผนก"></div>
      <div><div class="f-label">สถานที่</div>
        <select class="f-input" id="f-loc">
          <option>โกดัง D — TPY Estate</option>
          <option>โกดัง F — TPY Estate</option>
          <option>โกดัง D &amp; F</option>
        </select>
      </div>
      <div><div class="f-label">รอบปี (พ.ศ.)</div><input type="number" class="f-input" id="f-year" value="2569" min="2560" max="2600"></div>
    </div>
  </div>
</div>

<!-- 2 Pre-shift check -->
<div class="mon-section">
  <div class="mon-sec-head">
    <div class="mon-sec-num">2</div>
    <div class="mon-sec-title">ตรวจสอบสภาพเครื่องจักรก่อนใช้งาน</div>
    <span class="mon-sec-en">Equipment Pre-shift Check</span>
  </div>
  <div class="mon-sec-body" style="overflow-x:auto;padding:0">
    <table class="eq-tbl" id="eq-table">
      <colgroup><col style="width:28px"><col><col style="width:50px"><col style="width:55px"><col style="width:160px"><col><col style="width:46px"><col style="width:30px"></colgroup>
      <thead><tr>
        <th>#</th><th>เครื่องจักร / อุปกรณ์</th>
        <th style="text-align:center">จำนวน</th><th style="text-align:center">ตรวจได้</th>
        <th style="text-align:center">สภาพ</th><th>หมายเหตุ</th>
        <th style="text-align:center">รูป</th><th></th>
      </tr></thead>
      <tbody id="eq-tbody">
        ${[
          [1,'เครื่องบรรจุสุญญากาศ','Vacuum Packing Machine รุ่น NG-01M',1],
          [2,'รถโฟล์คลิฟท์','Forklift HELI รุ่น G2 Series CQD16-GB2SLi-ZSM630-SS',1],
          [3,'รถลากพาเลท Hand Pallet Truck','ยี่ห้อ HELI ขนาด 3 ตัน',12],
          [4,'รถยกไฟฟ้าแบบยืนขับ STACKER','ยี่ห้อ HELI รุ่น CDD15J-RE-M300',2],
          [5,'รถยกไฟฟ้าแบบลากขับ STACKER','ยี่ห้อ HELI รุ่น CDD15J',3],
        ].map(([n,name,model,qty])=>`
          <tr data-eq-row>
            <td style="color:#94a3b8;font-size:.78rem;text-align:center" class="eq-num">${n}</td>
            <td>
              <div class="eq-name" contenteditable="false">${name}</div>
              <div class="eq-model" contenteditable="false">${model}</div>
            </td>
            <td class="eq-qty">${qty}</td>
            <td style="text-align:center"><input type="number" class="num-inp" min="0" max="${qty}" placeholder="0"></td>
            <td><div class="radio-grp">
              <label><input type="radio" name="eq${n}" value="ok"> ปกติ</label>
              <label><input type="radio" name="eq${n}" value="warn"> บกพร่อง</label>
              <label><input type="radio" name="eq${n}" value="na"> N/A</label>
            </div></td>
            <td><input type="text" class="note-inp" placeholder="ระบุ..."></td>
            <td style="text-align:center;padding:.35rem .3rem">
              <div class="photo-cell">
                <input type="file" accept="image/*" style="display:none" onchange="previewPhoto(this)">
                <div class="photo-btn" title="แนบรูป" onclick="this.previousElementSibling.click()">📷</div>
              </div>
            </td>
            <td style="text-align:center;padding:.25rem 0"></td>
          </tr>`).join('')}
      </tbody>
    </table>
    <div class="add-eq-row">
      <button class="btn-add-eq" onclick="addEquipmentRow()">＋ เพิ่มเครื่องจักร / อุปกรณ์</button>
    </div>
  </div>
</div>

<!-- 3 KPI -->
<div class="mon-section">
  <div class="mon-sec-head">
    <div class="mon-sec-num">3</div>
    <div class="mon-sec-title">ตัวชี้วัด KPI (Risk &amp; KPI Monitoring)</div>
    <span class="mon-sec-en">Monitoring Plan — รอบปี 2569</span>
  </div>
  <div class="mon-sec-body" style="overflow-x:auto">
    <table class="kpi-tbl">
      <colgroup><col><col style="width:85px"><col style="width:95px"><col style="width:150px"><col style="width:85px"><col style="width:120px"></colgroup>
      <thead><tr>
        <th class="left">ตัวชี้วัด (KPI)</th>
        <th>เป้าหมาย</th><th>ค่าที่วัดได้</th>
        <th>วิธีตรวจสอบ</th><th>สถานะ</th><th>หมายเหตุ</th>
      </tr></thead>
      <tbody>
        <tr><td colspan="6" class="kpi-domain">🛡 ความปลอดภัย (Safety)</td></tr>
        <tr>
          <td class="left">อัตราการเกิดอุบัติเหตุถึงขั้นหยุดงาน (LTI)</td>
          <td><span class="tgt-badge">0 ครั้ง</span></td>
          <td><input type="number" class="kpi-inp" min="0" placeholder="0" id="kpi-lti"></td>
          <td style="font-size:.76rem;color:#94a3b8">บันทึกสถิติอุบัติเหตุรายเดือน</td>
          <td><span class="live-dot" id="dot-lti"></span><span id="st-lti" style="font-size:.76rem;color:#94a3b8">—</span></td>
          <td><input type="text" class="note-inp" placeholder="ระบุ..."></td>
        </tr>
        <tr>
          <td class="left">จำนวนครั้งที่พบความเสี่ยงจากไฟฟ้า / อัคคีภัย</td>
          <td><span class="tgt-badge">&lt; 2 ครั้ง/ปี</span></td>
          <td><input type="number" class="kpi-inp" min="0" placeholder="0" id="kpi-fire"></td>
          <td style="font-size:.76rem;color:#94a3b8">Check-list ทุก 15 วัน</td>
          <td><span class="live-dot" id="dot-fire"></span><span id="st-fire" style="font-size:.76rem;color:#94a3b8">—</span></td>
          <td><input type="text" class="note-inp" placeholder="ระบุ..."></td>
        </tr>
        <tr><td colspan="6" class="kpi-domain">🌿 สิ่งแวดล้อม (Environment)</td></tr>
        <tr>
          <td class="left">ปริมาณขยะพลาสติก / กระดาษที่ถูกรีไซเคิล</td>
          <td><span class="tgt-badge">&gt; 90%</span></td>
          <td><input type="number" class="kpi-inp" min="0" max="100" placeholder="%" id="kpi-recycle"></td>
          <td style="font-size:.76rem;color:#94a3b8">ตราชั่ง + ใบเสร็จจากบริษัทรับซื้อ</td>
          <td><span class="live-dot" id="dot-recycle"></span><span id="st-recycle" style="font-size:.76rem;color:#94a3b8">—</span></td>
          <td><input type="text" class="note-inp" placeholder="ระบุ..."></td>
        </tr>
        <tr>
          <td class="left">ระดับเสียงรบกวนจากการขนส่ง (หน้าคลัง)</td>
          <td><span class="tgt-badge">&lt; 70 dB(A)</span></td>
          <td><input type="number" class="kpi-inp" min="0" placeholder="dB" id="kpi-noise"></td>
          <td style="font-size:.76rem;color:#94a3b8">เครื่องวัดเสียง ตรวจสุ่มช่วง peak</td>
          <td><span class="live-dot" id="dot-noise"></span><span id="st-noise" style="font-size:.76rem;color:#94a3b8">—</span></td>
          <td><input type="text" class="note-inp" placeholder="ระบุ..."></td>
        </tr>
        <tr><td colspan="6" class="kpi-domain">🤝 สังคม (Social)</td></tr>
        <tr>

// Set today
const today = new Date().toISOString().slice(0, 10);
document.getElementById('f-date').value = today;
document.getElementById('hd-effdate').value = today;

// Renumber equipment rows
function renumberEq() {
  document.querySelectorAll('#eq-tbody tr[data-eq-row]').forEach((tr, i) => {
    tr.querySelector('.eq-num').textContent = i + 1;
    tr.querySelectorAll('input[type=radio]').forEach(r => {
      r.name = 'eq' + (i + 1);
    });
  });
}

// Add equipment row
window.addEquipmentRow = function() {
  const tbody = document.getElementById('eq-tbody');
  const n = tbody.querySelectorAll('tr[data-eq-row]').length + 1;
  const tr = document.createElement('tr');
  tr.setAttribute('data-eq-row', '');
  tr.innerHTML = \`
    <td style="color:#94a3b8;font-size:.78rem;text-align:center" class="eq-num">\${n}</td>
    <td>
      <div class="eq-name" contenteditable="true" style="border-bottom:1px dashed #cbd5e1;min-width:120px;outline:none;padding:.1rem 0" data-placeholder="ชื่อเครื่องจักร">ชื่อเครื่องจักร</div>
      <div class="eq-model" contenteditable="true" style="border-bottom:1px dashed #e2e8f0;min-width:120px;outline:none;padding:.1rem 0" data-placeholder="รุ่น / ยี่ห้อ">รุ่น / ยี่ห้อ</div>
    </td>
    <td class="eq-qty"><input type="number" class="num-inp" min="1" value="1" style="width:50px"></td>
    <td style="text-align:center"><input type="number" class="num-inp" min="0" placeholder="0"></td>
    <td><div class="radio-grp">
      <label><input type="radio" name="eq\${n}" value="ok"> ปกติ</label>
      <label><input type="radio" name="eq\${n}" value="warn"> บกพร่อง</label>
      <label><input type="radio" name="eq\${n}" value="na"> N/A</label>
    </div></td>
    <td><input type="text" class="note-inp" placeholder="ระบุ..."></td>
    <td style="text-align:center;padding:.35rem .3rem">
      <div class="photo-cell">
        <input type="file" accept="image/*" style="display:none" onchange="previewPhoto(this)">
        <div class="photo-btn" title="แนบรูป" onclick="this.previousElementSibling.click()">📷</div>
      </div>
    </td>
    <td style="text-align:center;padding:.25rem 0">
      <button class="btn-del-eq" title="ลบแถวนี้" onclick="this.closest('tr').remove();renumberEq()">✕</button>
    </td>\`;
  tbody.appendChild(tr);
  tr.querySelector('[contenteditable]').focus();
};

// Photo preview
window.previewPhoto = function(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    const cell = input.closest('.photo-cell');
    let thumb = cell.querySelector('.photo-thumb');
    if (!thumb) {
      thumb = document.createElement('img');
      thumb.className = 'photo-thumb';
      thumb.title = 'คลิกเพื่อดูรูปใหญ่';
      thumb.onclick = () => window.open(thumb.src, '_blank');
      cell.appendChild(thumb);
      const btn = cell.querySelector('.photo-btn');
      btn.textContent = '🔄';
      btn.title = 'เปลี่ยนรูป';
    }
    thumb.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
};

// Live KPI dots
const KPI_RULES = [
  { id:'kpi-lti',      dot:'dot-lti',      st:'st-lti',      ok:v=>v===0,    warn:v=>false,  labels:['ผ่าน','—','เกินเป้า'] },
  { id:'kpi-fire',     dot:'dot-fire',     st:'st-fire',     ok:v=>v<2,      warn:v=>v===2,  labels:['ผ่าน','ใกล้เป้า','เกินเป้า'] },
  { id:'kpi-recycle',  dot:'dot-recycle',  st:'st-recycle',  ok:v=>v>90,     warn:v=>v>=75,  labels:['ผ่าน','ใกล้เป้า','ต่ำกว่าเป้า'] },
  { id:'kpi-noise',    dot:'dot-noise',    st:'st-noise',    ok:v=>v<70,     warn:v=>v<=75,  labels:['ผ่าน','ใกล้เป้า','เกินเป้า'] },
  { id:'kpi-complaint',dot:'dot-complaint',st:'st-complaint',ok:v=>v===0,    warn:v=>false,  labels:['ผ่าน','—','เกินเป้า'] },
  { id:'kpi-sat',      dot:'dot-sat',      st:'st-sat',      ok:v=>v>80,     warn:v=>v>=65,  labels:['ผ่าน','ใกล้เป้า','ต่ำกว่าเป้า'] },
];
function updateDot(r) {
  const inp = document.getElementById(r.id);
  const dot = document.getElementById(r.dot);
  const st  = document.getElementById(r.st);
  if (!inp || !inp.value) { dot.className='live-dot'; st.textContent='—'; st.style.color='#94a3b8'; return; }
  const v = Number(inp.value);
  if (r.ok(v)) { dot.className='live-dot dot-ok'; st.textContent=r.labels[0]; st.style.color='#16a34a'; }
  else if (r.warn(v)) { dot.className='live-dot dot-warn'; st.textContent=r.labels[1]; st.style.color='#d97706'; }
  else { dot.className='live-dot dot-fail'; st.textContent=r.labels[2]; st.style.color='#dc2626'; }
}
KPI_RULES.forEach(r => document.getElementById(r.id)?.addEventListener('input', ()=>updateDot(r)));

window.resetForm = function() {
  if (!confirm('ล้างข้อมูลในแบบฟอร์มทั้งหมดหรือไม่?')) return;
  document.querySelectorAll('input:not([type=radio]):not([type=checkbox]),select,textarea').forEach(el => {
    if (el.id === 'f-date') el.value = new Date().toISOString().slice(0,10);
    else if (el.id === 'f-year') el.value = '2569';
    else el.value = '';
  });
  document.querySelectorAll('input[type=radio],input[type=checkbox]').forEach(el => el.checked = false);
  KPI_RULES.forEach(r => updateDot(r));
};
</script>
