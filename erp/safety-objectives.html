<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>วัตถุประสงค์และเป้าหมายด้านความปลอดภัย</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root{--c-primary:#1e40af;--c-success:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-gray:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.toolbar input{flex:1;min-width:140px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
/* progress bar */
.progress-wrap{background:#e2e8f0;border-radius:999px;height:8px;overflow:hidden}
.progress-bar{height:100%;border-radius:999px;transition:width .4s}
/* objective card */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.obj-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:4px solid #e2e8f0;transition:box-shadow .15s}
.obj-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.card-title{font-size:.9rem;font-weight:700;line-height:1.4}
.card-meta{font-size:.77rem;color:#6b7280;margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap}
.card-progress{margin-bottom:10px}
.progress-label{display:flex;justify-content:space-between;font-size:.78rem;color:#475569;margin-bottom:4px}
.card-actions{display:flex;gap:6px;padding-top:10px;border-top:1px solid #f1f5f9}
/* table */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f1f5f9;padding:9px 12px;text-align:left;font-size:.8rem;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
td{padding:9px 12px;font-size:.84rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
/* panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(680px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:70px}
.form-hint{font-size:.74rem;color:#9ca3af;margin-top:2px}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.view-toggle{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:8px}
.view-btn{padding:5px 12px;border:none;background:none;border-radius:6px;font-size:.82rem;cursor:pointer;color:#6b7280;font-family:inherit}
.view-btn.active{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  OBJ_CATEGORIES, OBJ_STATUS, OBJ_PRIORITY, OBJ_MEASURE_UNITS,
  listObjectives, getObjective, createObjective, updateObjective, deleteObjective,
} from './js/safety-data.js';
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(profile, 'safety-objectives', 'วัตถุประสงค์และเป้าหมายด้านความปลอดภัย (§6.2)');

let allRecs  = [];
let editId   = null;
let viewMode = 'card';

function getCategory(key) { return OBJ_CATEGORIES.find(c=>c.key===key)||{icon:'📌',label:key||'—',color:'#6b7280',bg:'#f3f4f6'}; }

function calcProgress(rec) {
  const base    = parseFloat(rec.baseline)||0;
  const target  = parseFloat(rec.target)||100;
  const current = parseFloat(rec.current)||0;
  if (target === base) return 0;
  const pct = Math.round(((current - base) / (target - base)) * 100);
  return Math.min(100, Math.max(0, pct));
}

function progressColor(pct, status) {
  if (status==='completed') return '#16a34a';
  if (status==='cancelled') return '#9ca3af';
  if (status==='behind')    return '#dc2626';
  if (status==='at_risk')   return '#ea580c';
  if (pct >= 80) return '#16a34a';
  if (pct >= 50) return '#2563eb';
  if (pct >= 20) return '#d97706';
  return '#dc2626';
}

// ── KPI ──
function renderKPI(recs) {
  const total     = recs.length;
  const completed = recs.filter(r=>r.status==='completed').length;
  const on_track  = recs.filter(r=>r.status==='on_track').length;
  const at_risk   = recs.filter(r=>r.status==='at_risk').length;
  const behind    = recs.filter(r=>r.status==='behind').length;
  const avgPct    = total ? Math.round(recs.reduce((s,r)=>s+calcProgress(r),0)/total) : 0;
  return `<div class="kpi-row">
    <div class="kpi"><div class="num">${total}</div><div class="lbl">เป้าหมายทั้งหมด</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${completed}</div><div class="lbl">🏆 บรรลุเป้า</div></div>
    <div class="kpi" style="border-color:#2563eb"><div class="num" style="color:#2563eb">${on_track}</div><div class="lbl">✅ เป็นไปตามแผน</div></div>
    <div class="kpi" style="border-color:#ea580c"><div class="num" style="color:#ea580c">${at_risk}</div><div class="lbl">⚠️ มีความเสี่ยง</div></div>
    <div class="kpi" style="border-color:#dc2626"><div class="num" style="color:#dc2626">${behind}</div><div class="lbl">🔴 ล่าช้า</div></div>
    <div class="kpi" style="border-color:#7c3aed"><div class="num" style="color:#7c3aed">${avgPct}%</div><div class="lbl">ความคืบหน้าเฉลี่ย</div></div>
  </div>`;
}

// ── Card view ──
function renderCards(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon" style="font-size:3rem">🎯</div><p style="margin-top:12px">ยังไม่มีเป้าหมาย</p></div>`;
  return `<div class="card-grid">${recs.map(r => {
    const cat  = getCategory(r.category);
    const sts  = OBJ_STATUS[r.status]||OBJ_STATUS.planning;
    const pri  = OBJ_PRIORITY[r.priority]||OBJ_PRIORITY.medium;
    const pct  = calcProgress(r);
    const pc   = progressColor(pct, r.status);
    const unit = OBJ_MEASURE_UNITS.find(u=>u.key===r.measureUnit);
    return `<div class="obj-card" style="border-top-color:${cat.color}">
      <div class="card-head">
        <div class="card-title">${cat.icon} ${r.title||'—'}</div>
        <span class="badge" style="color:${sts.color};background:${sts.bg};white-space:nowrap">${sts.icon} ${sts.label}</span>
      </div>
      <div class="card-meta">
        <span style="background:${cat.bg};color:${cat.color};padding:2px 8px;border-radius:999px;font-size:.74rem">${cat.label}</span>
        <span class="badge" style="color:${pri.color};background:${pri.bg}">ความสำคัญ: ${pri.label}</span>
      </div>
      <div class="card-progress">
        <div class="progress-label">
          <span>ความคืบหน้า</span>
          <span style="font-weight:700;color:${pc}">${pct}%</span>
        </div>
        <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%;background:${pc}"></div></div>
        <div style="display:flex;gap:12px;margin-top:5px;font-size:.76rem;color:#6b7280">
          <span>Baseline: <strong>${r.baseline||0} ${unit?.label||r.measureUnit||''}</strong></span>
          <span>เป้า: <strong>${r.target||0} ${unit?.label||r.measureUnit||''}</strong></span>
          <span>ปัจจุบัน: <strong style="color:${pc}">${r.current||0} ${unit?.label||r.measureUnit||''}</strong></span>
        </div>
      </div>
      ${r.responsible?`<div style="font-size:.78rem;color:#475569;margin-bottom:6px">👤 ${r.responsible}</div>`:''}
      ${r.dueDate?`<div style="font-size:.78rem;color:#475569">📅 กำหนด: ${r.dueDate}</div>`:''}
      <div class="card-actions">
        <button class="btn btn-sm btn-ghost" onclick="window.__editObj('${r.id}')">✏️ แก้ไข</button>
        <button class="btn btn-sm btn-ghost" onclick="window.__updateProgress('${r.id}')">📊 อัปเดต</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deleteObj('${r.id}','${(r.title||'').replace(/'/g,"\\'")}')">ลบ</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── Table view ──
function renderTable(recs) {
  if (!recs.length) return `<div class="empty-state"><div style="font-size:3rem">🎯</div><p style="margin-top:12px">ยังไม่มีเป้าหมาย</p></div>`;
  const rows = recs.map(r => {
    const cat = getCategory(r.category);
    const sts = OBJ_STATUS[r.status]||OBJ_STATUS.planning;
    const pri = OBJ_PRIORITY[r.priority]||OBJ_PRIORITY.medium;
    const pct = calcProgress(r);
    const pc  = progressColor(pct, r.status);
    return `<tr>
      <td><span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.77rem;font-weight:600;background:${cat.bg};color:${cat.color}">${cat.icon} ${cat.label}</span></td>
      <td><strong>${r.title||'—'}</strong></td>
      <td><span class="badge" style="color:${sts.color};background:${sts.bg}">${sts.icon} ${sts.label}</span></td>
      <td><span class="badge" style="color:${pri.color};background:${pri.bg}">${pri.label}</span></td>
      <td style="min-width:120px">
        <div style="display:flex;align-items:center;gap:6px">
          <div class="progress-wrap" style="flex:1"><div class="progress-bar" style="width:${pct}%;background:${pc}"></div></div>
          <span style="font-size:.8rem;font-weight:700;color:${pc}">${pct}%</span>
        </div>
      </td>
      <td style="font-size:.82rem">${r.current||0} / ${r.target||0}</td>
      <td style="font-size:.82rem">${r.responsible||'—'}</td>
      <td style="font-size:.82rem">${r.dueDate||'—'}</td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="window.__editObj('${r.id}')">แก้ไข</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deleteObj('${r.id}','${(r.title||'').replace(/'/g,"\\'")}')">ลบ</button>
      </td>
    </tr>`;
  }).join('');
  return `<table><thead><tr>
    <th>หมวด</th><th>เป้าหมาย</th><th>สถานะ</th><th>ความสำคัญ</th>
    <th>ความคืบหน้า</th><th>ค่า (ปัจจุบัน/เป้า)</th><th>ผู้รับผิดชอบ</th><th>กำหนดเสร็จ</th><th>จัดการ</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

// ── Form ──
function renderForm(rec) {
  const catOpts = OBJ_CATEGORIES.map(c=>`<option value="${c.key}" ${rec?.category===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('');
  const stsOpts = Object.entries(OBJ_STATUS).map(([k,v])=>`<option value="${k}" ${(rec?.status||'planning')===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  const priOpts = Object.entries(OBJ_PRIORITY).map(([k,v])=>`<option value="${k}" ${(rec?.priority||'medium')===k?'selected':''}>${v.label}</option>`).join('');
  const unitOpts = OBJ_MEASURE_UNITS.map(u=>`<option value="${u.key}" ${rec?.measureUnit===u.key?'selected':''}>${u.label}</option>`).join('');
  return `<form id="obj-form" onsubmit="return false">
    <div class="form-row">
      <div class="form-group"><label>หมวดหมู่ *</label><select id="f-category">${catOpts}</select></div>
      <div class="form-group"><label>ความสำคัญ</label><select id="f-priority">${priOpts}</select></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>ชื่อวัตถุประสงค์ / เป้าหมาย *</label>
        <input id="f-title" value="${rec?.title||''}" placeholder="เช่น ลดอัตราอุบัติเหตุ LTI เป็น 0 ครั้ง"/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>รายละเอียด / วิธีวัดผล</label>
        <textarea id="f-description" rows="3" placeholder="อธิบายเป้าหมาย วิธีวัด และเกณฑ์ความสำเร็จ">${rec?.description||''}</textarea></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>หน่วยวัด</label><select id="f-measureUnit">${unitOpts}</select></div>
      <div class="form-group"><label>สถานะ</label><select id="f-status">${stsOpts}</select></div>
    </div>
    <div class="form-row three">
      <div class="form-group"><label>ค่าเริ่มต้น (Baseline)</label>
        <input id="f-baseline" type="number" step="any" value="${rec?.baseline||''}" placeholder="0"/>
        <span class="form-hint">ค่าปัจจุบันก่อนเริ่มดำเนินการ</span></div>
      <div class="form-group"><label>เป้าหมาย (Target)</label>
        <input id="f-target" type="number" step="any" value="${rec?.target||''}" placeholder="100"/></div>
      <div class="form-group"><label>ค่าปัจจุบัน</label>
        <input id="f-current" type="number" step="any" value="${rec?.current||''}" placeholder="0"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>ผู้รับผิดชอบ</label>
        <input id="f-responsible" value="${rec?.responsible||''}" placeholder="ชื่อ / แผนก"/></div>
      <div class="form-group"><label>วันที่กำหนดเสร็จ</label>
        <input id="f-dueDate" type="date" value="${rec?.dueDate||''}"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>วันที่ทบทวนความคืบหน้า</label>
        <input id="f-reviewDate" type="date" value="${rec?.reviewDate||''}"/></div>
      <div class="form-group"><label>งบประมาณที่ต้องการ (บาท)</label>
        <input id="f-budget" type="number" value="${rec?.budget||''}" placeholder="0"/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>แผนการดำเนินงาน / กิจกรรมหลัก</label>
        <textarea id="f-actionPlan" rows="3" placeholder="ระบุกิจกรรมหลักที่ต้องทำเพื่อบรรลุเป้าหมาย">${rec?.actionPlan||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>หมายเหตุ</label>
        <input id="f-notes" value="${rec?.notes||''}" placeholder="หมายเหตุเพิ่มเติม"/></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button type="button" class="btn btn-primary" onclick="window.__saveObj()">💾 บันทึก</button>
      <button type="button" class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>
    </div>
  </form>`;
}

// ── Progress update panel ──
function renderProgressForm(rec) {
  const sts = OBJ_STATUS[rec.status]||OBJ_STATUS.planning;
  const pct = calcProgress(rec);
  const pc  = progressColor(pct, rec.status);
  const unit = OBJ_MEASURE_UNITS.find(u=>u.key===rec.measureUnit);
  const stsOpts = Object.entries(OBJ_STATUS).map(([k,v])=>`<option value="${k}" ${rec.status===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  return `<div style="margin-bottom:20px;padding:14px;background:#f8fafc;border-radius:10px;border-left:4px solid ${pc}">
    <div style="font-size:.85rem;font-weight:700;margin-bottom:8px">${rec.title}</div>
    <div style="display:flex;align-items:center;gap:8px">
      <div class="progress-wrap" style="flex:1"><div class="progress-bar" style="width:${pct}%;background:${pc}"></div></div>
      <strong style="color:${pc}">${pct}%</strong>
    </div>
    <div style="font-size:.78rem;color:#6b7280;margin-top:4px">
      Baseline: ${rec.baseline||0} → เป้า: ${rec.target||0} ${unit?.label||''} · ปัจจุบัน: <strong>${rec.current||0}</strong>
    </div>
  </div>
  <form id="prog-form" onsubmit="return false">
    <div class="form-row">
      <div class="form-group"><label>ค่าปัจจุบัน *</label>
        <input id="p-current" type="number" step="any" value="${rec.current||''}" placeholder="0"/></div>
      <div class="form-group"><label>สถานะใหม่</label><select id="p-status">${stsOpts}</select></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>หมายเหตุการอัปเดต</label>
        <textarea id="p-progressNote" rows="2" placeholder="สิ่งที่ดำเนินการแล้ว / อุปสรรค">${rec.progressNote||''}</textarea></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button type="button" class="btn btn-primary" onclick="window.__saveProgress('${rec.id}')">📊 บันทึกความคืบหน้า</button>
      <button type="button" class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>
    </div>
  </form>`;
}

// ── Panel ──
window.__closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
function openPanel(html, title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

window.__newObj  = () => { editId = null; openPanel(renderForm(null), '+ เพิ่มวัตถุประสงค์'); };
window.__editObj = async id => {
  editId = id;
  const r = await getObjective(id);
  openPanel(renderForm(r), '✏️ แก้ไขวัตถุประสงค์');
};
window.__updateProgress = async id => {
  const r = await getObjective(id);
  openPanel(renderProgressForm(r), '📊 อัปเดตความคืบหน้า');
};

// ── Save ──
window.__saveObj = async () => {
  const data = {
    category:    document.getElementById('f-category').value,
    priority:    document.getElementById('f-priority').value,
    title:       document.getElementById('f-title').value.trim(),
    description: document.getElementById('f-description').value.trim(),
    measureUnit: document.getElementById('f-measureUnit').value,
    status:      document.getElementById('f-status').value,
    baseline:    document.getElementById('f-baseline').value,
    target:      document.getElementById('f-target').value,
    current:     document.getElementById('f-current').value,
    responsible: document.getElementById('f-responsible').value.trim(),
    dueDate:     document.getElementById('f-dueDate').value,
    reviewDate:  document.getElementById('f-reviewDate').value,
    budget:      document.getElementById('f-budget').value,
    actionPlan:  document.getElementById('f-actionPlan').value.trim(),
    notes:       document.getElementById('f-notes').value.trim(),
  };
  if (!data.title) { alert('กรุณากรอกชื่อวัตถุประสงค์'); return; }
  try {
    if (editId) await updateObjective(editId, data);
    else        await createObjective(data, profile.uid||profile.email||'unknown');
    window.__closePanel();
    await loadData();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

window.__saveProgress = async id => {
  const data = {
    current:      document.getElementById('p-current').value,
    status:       document.getElementById('p-status').value,
    progressNote: document.getElementById('p-progressNote').value.trim(),
    lastUpdated:  new Date().toISOString().split('T')[0],
  };
  try {
    await updateObjective(id, data);
    window.__closePanel();
    await loadData();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

// ── Delete ──
window.__deleteObj = async (id, title) => {
  if (!confirm(`ลบวัตถุประสงค์ "${title}"?`)) return;
  await deleteObjective(id);
  window.__closePanel();
  await loadData();
};

// ── Filter ──
function applyFilter() {
  const q   = document.getElementById('search-box')?.value.toLowerCase()||'';
  const cat = document.getElementById('filter-cat')?.value||'';
  const sts = document.getElementById('filter-status')?.value||'';
  const pri = document.getElementById('filter-priority')?.value||'';
  const filtered = allRecs.filter(r =>
    (!q   || (r.title||'').toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q)) &&
    (!cat || r.category===cat) &&
    (!sts || r.status===sts) &&
    (!pri || r.priority===pri)
  );
  document.getElementById('kpi-wrap').innerHTML = renderKPI(filtered);
  document.getElementById('content-wrap').innerHTML =
    viewMode==='card' ? renderCards(filtered) : renderTable(filtered);
}
window.applyFilter = applyFilter;

window.__switchView = mode => {
  viewMode = mode;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===mode));
  applyFilter();
};

async function loadData() {
  allRecs = await listObjectives();
  applyFilter();
}

// ── Build UI ──
const catOpts = `<option value="">-- ทุกหมวด --</option>` +
  OBJ_CATEGORIES.map(c=>`<option value="${c.key}">${c.icon} ${c.label}</option>`).join('');
const stsOpts = `<option value="">-- ทุกสถานะ --</option>` +
  Object.entries(OBJ_STATUS).map(([k,v])=>`<option value="${k}">${v.icon} ${v.label}</option>`).join('');
const priOpts = `<option value="">-- ทุกระดับ --</option>` +
  Object.entries(OBJ_PRIORITY).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');

main.innerHTML = `
  <div style="padding:20px">
    <div id="kpi-wrap"></div>
    <div class="toolbar">
      <input id="search-box" placeholder="🔍 ค้นหาวัตถุประสงค์…" oninput="applyFilter()"/>
      <select id="filter-cat"      onchange="applyFilter()">${catOpts}</select>
      <select id="filter-status"   onchange="applyFilter()">${stsOpts}</select>
      <select id="filter-priority" onchange="applyFilter()">${priOpts}</select>
      <div class="view-toggle">
        <button class="view-btn active" data-view="card"  onclick="window.__switchView('card')">🎯 การ์ด</button>
        <button class="view-btn"        data-view="table" onclick="window.__switchView('table')">📋 ตาราง</button>
      </div>
      <button class="btn btn-primary" onclick="window.__newObj()">+ เพิ่มเป้าหมาย</button>
    </div>
    <div id="content-wrap"></div>
  </div>

  <div class="panel-overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-head">
      <h2 id="panel-title">วัตถุประสงค์และเป้าหมาย</h2>
      <button class="btn btn-ghost btn-sm" onclick="window.__closePanel()">✕ ปิด</button>
    </div>
    <div class="panel-body" id="panel-content"></div>
  </div>
`;

await loadData();
</script>
</body>
</html>
