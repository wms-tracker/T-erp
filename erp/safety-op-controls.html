<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>เธ—เธฐเน€เธเธตเธขเธเธเธฒเธฃเธเธงเธเธเธธเธกเธเธฒเธฃเธเธเธดเธเธฑเธ•เธดเธเธฒเธ</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root{--c-primary:#1e40af;--c-success:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-gray:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.toolbar input{flex:1;min-width:140px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
/* process groups */
.group-section{margin-bottom:20px}
.group-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;user-select:none}
.group-header h3{font-size:.9rem;font-weight:700;flex:1}
.group-count{font-size:.78rem;padding:2px 8px;border-radius:999px;font-weight:600}
.ctrl-card{background:#fff;border-radius:9px;padding:14px;border:1px solid #e2e8f0;margin-bottom:8px;position:relative}
.ctrl-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.ctrl-card-title{font-size:.88rem;font-weight:700}
.ctrl-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ctrl-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:5px;font-size:.74rem;font-weight:600}
.ctrl-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:.78rem;color:#475569}
.ctrl-meta .meta-item{display:flex;gap:5px;align-items:flex-start}
.ctrl-meta .meta-label{color:#9ca3af;white-space:nowrap}
.overdue{border-left:3px solid #dc2626}
/* table */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f1f5f9;padding:9px 12px;text-align:left;font-size:.8rem;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
td{padding:9px 12px;font-size:.84rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
/* panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(680px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:70px}
.ctrl-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctrl-type-box{padding:7px 10px;border-radius:7px;border:1px solid #e2e8f0;cursor:pointer;font-size:.82rem;display:flex;align-items:center;gap:6px;transition:all .15s}
.ctrl-type-box.checked{border-color:var(--c-primary);background:#dbeafe;font-weight:600}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.view-toggle{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:8px}
.view-btn{padding:5px 12px;border:none;background:none;border-radius:6px;font-size:.82rem;cursor:pointer;color:#6b7280;font-family:inherit}
.view-btn.active{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.section-head{font-size:.85rem;font-weight:700;color:#475569;padding:10px 0 6px;border-bottom:1px solid #e2e8f0;margin-bottom:12px;margin-top:4px}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  OPC_PROCESS_TYPES, OPC_CONTROL_TYPES, OPC_VERIFY_FREQ, OPC_STATUS,
  listOpControls, getOpControl, createOpControl, updateOpControl, deleteOpControl,
} from './js/safety-data.js';

const profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(profile, 'safety-op-controls', 'เธ—เธฐเน€เธเธตเธขเธเธเธฒเธฃเธเธงเธเธเธธเธกเธเธฒเธฃเธเธเธดเธเธฑเธ•เธดเธเธฒเธ (ยง8.1)');

let allRecs  = [];
let editId   = null;
let viewMode = 'group';

function getProcess(key) { return OPC_PROCESS_TYPES.find(p=>p.key===key)||{icon:'๐“',label:key||'โ€”',color:'#6b7280',bg:'#f3f4f6'}; }
function getCtrlType(key){ return OPC_CONTROL_TYPES.find(c=>c.key===key)||{icon:'๐“',label:key||'โ€”'}; }
function getFreq(key)    { return OPC_VERIFY_FREQ.find(f=>f.key===key)||{label:key||'โ€”'}; }

function isOverdue(r) {
  if (!r.nextVerifyDate) return false;
  return r.nextVerifyDate < new Date().toISOString().split('T')[0];
}

// โ”€โ”€ KPI โ”€โ”€
function renderKPI(recs) {
  const total    = recs.length;
  const active   = recs.filter(r=>r.status==='active').length;
  const needUpd  = recs.filter(r=>r.status==='update_needed').length;
  const overdue  = recs.filter(r=>isOverdue(r)&&r.status!=='suspended').length;
  const procCnt  = [...new Set(recs.map(r=>r.processType))].length;
  const ctrlCnt  = recs.reduce((s,r)=>{
    return s + (Array.isArray(r.controlTypes) ? r.controlTypes.length : 0);
  }, 0);
  return `<div class="kpi-row">
    <div class="kpi"><div class="num">${total}</div><div class="lbl">เธกเธฒเธ•เธฃเธเธฒเธฃเธ—เธฑเนเธเธซเธกเธ”</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${active}</div><div class="lbl">โ… เนเธเนเธเธฒเธ</div></div>
    <div class="kpi" style="border-color:#d97706"><div class="num" style="color:#d97706">${needUpd}</div><div class="lbl">โ ๏ธ เธ•เนเธญเธเธเธฃเธฑเธเธเธฃเธธเธ</div></div>
    <div class="kpi" style="border-color:#dc2626"><div class="num" style="color:#dc2626">${overdue}</div><div class="lbl">๐”ด เน€เธเธดเธเธเธณเธซเธเธ”เธ—เธเธ—เธงเธ</div></div>
    <div class="kpi" style="border-color:#2563eb"><div class="num" style="color:#2563eb">${procCnt}</div><div class="lbl">เธเธฃเธฐเน€เธ เธ—เธเธฃเธฐเธเธงเธเธเธฒเธฃ</div></div>
    <div class="kpi" style="border-color:#7c3aed"><div class="num" style="color:#7c3aed">${ctrlCnt}</div><div class="lbl">เธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธกเธฃเธงเธก</div></div>
  </div>`;
}

// โ”€โ”€ Grouped card view โ”€โ”€
function renderGroups(recs) {
  if (!recs.length) return `<div class="empty-state"><div style="font-size:3rem">๐”ง</div><p style="margin-top:12px">เธขเธฑเธเนเธกเนเธกเธตเธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธก</p></div>`;
  const grouped = {};
  recs.forEach(r => {
    const k = r.processType||'other';
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push(r);
  });
  return Object.entries(grouped).map(([pt, items]) => {
    const proc = getProcess(pt);
    const cards = items.map(r => {
      const sts    = OPC_STATUS[r.status]||OPC_STATUS.active;
      const od     = isOverdue(r);
      const ctypes = (r.controlTypes||[]).map(k => { const c = getCtrlType(k); return `<span class="ctrl-tag" style="background:#f1f5f9;color:#334155">${c.icon} ${c.label}</span>`; }).join('');
      return `<div class="ctrl-card${od?' overdue':''}">
        <div class="ctrl-card-head">
          <div class="ctrl-card-title">๐“ ${r.title||'โ€”'}</div>
          <span class="badge" style="color:${sts.color};background:${sts.bg};white-space:nowrap">${sts.icon} ${sts.label}</span>
        </div>
        ${r.description?`<div style="font-size:.8rem;color:#6b7280;margin-bottom:8px">${r.description.substring(0,100)}${r.description.length>100?'โ€ฆ':''}</div>`:''}
        <div class="ctrl-tags">${ctypes}</div>
        <div class="ctrl-meta">
          <div class="meta-item"><span class="meta-label">เธญเธฑเธเธ•เธฃเธฒเธข:</span>${r.associatedHazards||'โ€”'}</div>
          <div class="meta-item"><span class="meta-label">เธเธนเนเธฃเธฑเธเธเธดเธ”เธเธญเธ:</span>${r.responsible||'โ€”'}</div>
          <div class="meta-item"><span class="meta-label">เธงเธดเธเธตเธ•เธฃเธงเธเธชเธญเธ:</span>${r.verifyMethod||'โ€”'}</div>
          <div class="meta-item"><span class="meta-label">เธเธงเธฒเธกเธ–เธตเน:</span>${getFreq(r.verifyFreq).label}</div>
          ${r.nextVerifyDate?`<div class="meta-item" style="${od?'color:#dc2626;font-weight:700':''}"><span class="meta-label">เธ—เธเธ—เธงเธเธ–เธฑเธ”เนเธ:</span>${r.nextVerifyDate}${od?' โ ๏ธ':''}</div>`:''}
          ${r.docRef?`<div class="meta-item"><span class="meta-label">เน€เธญเธเธชเธฒเธฃเธญเนเธฒเธเธญเธดเธ:</span>${r.docRef}</div>`:''}
        </div>
        <div style="display:flex;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid #f1f5f9">
          <button class="btn btn-sm btn-ghost" onclick="window.__editOpc('${r.id}')">โ๏ธ เนเธเนเนเธ</button>
          <button class="btn btn-sm btn-danger" onclick="window.__deleteOpc('${r.id}','${(r.title||'').replace(/'/g,"\\'")}')">เธฅเธ</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="group-section">
      <div class="group-header" style="background:${proc.bg}" onclick="this.nextElementSibling.classList.toggle('hidden')">
        <span style="font-size:1.1rem">${proc.icon}</span>
        <h3 style="color:${proc.color}">${proc.label}</h3>
        <span class="group-count" style="background:${proc.color}20;color:${proc.color}">${items.length} เธกเธฒเธ•เธฃเธเธฒเธฃ</span>
        <span style="color:${proc.color}">โ–พ</span>
      </div>
      <div>${cards}</div>
    </div>`;
  }).join('');
}

// โ”€โ”€ Table view โ”€โ”€
function renderTable(recs) {
  if (!recs.length) return `<div class="empty-state"><div style="font-size:3rem">๐”ง</div><p style="margin-top:12px">เธขเธฑเธเนเธกเนเธกเธตเธกเธฒเธ•เธฃเธเธฒเธฃ</p></div>`;
  const rows = recs.map(r => {
    const proc = getProcess(r.processType);
    const sts  = OPC_STATUS[r.status]||OPC_STATUS.active;
    const od   = isOverdue(r);
    const ctypes = (r.controlTypes||[]).map(k => getCtrlType(k).icon).join(' ');
    return `<tr ${od?"style='background:#fff5f5'":''}>
      <td><span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.77rem;font-weight:600;background:${proc.bg};color:${proc.color}">${proc.icon} ${proc.label}</span></td>
      <td><strong>${r.title||'โ€”'}</strong></td>
      <td style="font-size:.8rem">${ctypes} ${(r.controlTypes||[]).map(k=>getCtrlType(k).label).join(', ')}</td>
      <td style="font-size:.8rem">${r.associatedHazards||'โ€”'}</td>
      <td><span class="badge" style="color:${sts.color};background:${sts.bg}">${sts.icon} ${sts.label}</span></td>
      <td style="font-size:.82rem">${getFreq(r.verifyFreq).label}</td>
      <td style="font-size:.82rem${od?';color:#dc2626;font-weight:700':''}">${r.nextVerifyDate||'โ€”'}${od?' โ ๏ธ':''}</td>
      <td style="font-size:.82rem">${r.responsible||'โ€”'}</td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="window.__editOpc('${r.id}')">เนเธเนเนเธ</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deleteOpc('${r.id}','${(r.title||'').replace(/'/g,"\\'")}')">เธฅเธ</button>
      </td>
    </tr>`;
  }).join('');
  return `<table><thead><tr>
    <th>เธเธฃเธฐเธเธงเธเธเธฒเธฃ</th><th>เธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธก</th><th>เธเธฃเธฐเน€เธ เธ—เธกเธฒเธ•เธฃเธเธฒเธฃ</th>
    <th>เธญเธฑเธเธ•เธฃเธฒเธข/เธเธงเธฒเธกเน€เธชเธตเนเธขเธ</th><th>เธชเธ–เธฒเธเธฐ</th><th>เธเธงเธฒเธกเธ–เธตเน</th><th>เธ—เธเธ—เธงเธเธ–เธฑเธ”เนเธ</th><th>เธเธนเนเธฃเธฑเธเธเธดเธ”เธเธญเธ</th><th>เธเธฑเธ”เธเธฒเธฃ</th>
  </tr></thead><tbody>${rows}</tbody></table>`;
}

// โ”€โ”€ Form โ”€โ”€
function renderForm(rec) {
  const procOpts = OPC_PROCESS_TYPES.map(p=>`<option value="${p.key}" ${rec?.processType===p.key?'selected':''}>${p.icon} ${p.label}</option>`).join('');
  const stsOpts  = Object.entries(OPC_STATUS).map(([k,v])=>`<option value="${k}" ${(rec?.status||'active')===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  const freqOpts = OPC_VERIFY_FREQ.map(f=>`<option value="${f.key}" ${rec?.verifyFreq===f.key?'selected':''}>${f.label}</option>`).join('');
  const ctrlBoxes = OPC_CONTROL_TYPES.map(c => {
    const checked = (rec?.controlTypes||[]).includes(c.key);
    return `<div class="ctrl-type-box${checked?' checked':''}" id="ctb-${c.key}" onclick="window.__toggleCtrlType('${c.key}')">
      <input type="checkbox" id="ctype-${c.key}" style="display:none" ${checked?'checked':''}/>${c.icon} ${c.label}
    </div>`;
  }).join('');
  return `<form id="opc-form" onsubmit="return false">
    <div class="form-row">
      <div class="form-group"><label>เธเธฃเธฐเน€เธ เธ—เธเธฃเธฐเธเธงเธเธเธฒเธฃ *</label><select id="f-processType">${procOpts}</select></div>
      <div class="form-group"><label>เธชเธ–เธฒเธเธฐ</label><select id="f-status">${stsOpts}</select></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธเธทเนเธญเธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธก *</label>
        <input id="f-title" value="${rec?.title||''}" placeholder="เน€เธเนเธ เธเธฒเธฃเธเธงเธเธเธธเธกเธเธฒเธฃเธ—เธณเธเธฒเธเธเธเธ—เธตเนเธชเธนเธเธ”เนเธงเธข PTW"/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธฃเธฒเธขเธฅเธฐเน€เธญเธตเธขเธ” / เธงเธฑเธ•เธ–เธธเธเธฃเธฐเธชเธเธเน</label>
        <textarea id="f-description" rows="2" placeholder="เธญเธเธดเธเธฒเธขเธงเธฑเธ•เธ–เธธเธเธฃเธฐเธชเธเธเนเนเธฅเธฐเธเธญเธเน€เธเธ•เธเธญเธเธกเธฒเธ•เธฃเธเธฒเธฃเธเธตเน">${rec?.description||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธญเธฑเธเธ•เธฃเธฒเธข / เธเธงเธฒเธกเน€เธชเธตเนเธขเธเธ—เธตเนเน€เธเธตเนเธขเธงเธเนเธญเธ</label>
        <input id="f-associatedHazards" value="${rec?.associatedHazards||''}" placeholder="เน€เธเนเธ เธ•เธเธเธฒเธเธ—เธตเนเธชเธนเธ, เธเธฒเธเนเธเธเนเธฒ"/></div>
    </div>
    <div class="section-head">เธเธฃเธฐเน€เธ เธ—เธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธก (เน€เธฅเธทเธญเธเนเธ”เนเธซเธฅเธฒเธขเธเนเธญ)</div>
    <div class="ctrl-type-grid" style="margin-bottom:14px">${ctrlBoxes}</div>
    <div class="form-row one">
      <div class="form-group"><label>เธฃเธฒเธขเธฅเธฐเน€เธญเธตเธขเธ”เธกเธฒเธ•เธฃเธเธฒเธฃเธ—เธตเนเนเธเน</label>
        <textarea id="f-controlDetail" rows="3" placeholder="เธญเธเธดเธเธฒเธขเธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธกเธญเธขเนเธฒเธเธฅเธฐเน€เธญเธตเธขเธ”">${rec?.controlDetail||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เน€เธญเธเธชเธฒเธฃ/เธฃเธฐเน€เธเธตเธขเธเธญเนเธฒเธเธญเธดเธ (Document Reference)</label>
        <input id="f-docRef" value="${rec?.docRef||''}" placeholder="เน€เธเนเธ WI-PRD-001, SOP-MNT-005"/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธงเธดเธเธตเธเธฒเธฃเธ•เธฃเธงเธเธชเธญเธ / เธ•เธดเธ”เธ•เธฒเธกเธเธฅ</label>

window.__toggleCtrlType = key => {
  const cb  = document.getElementById(`ctype-${key}`);
  const box = document.getElementById(`ctb-${key}`);
  if (!cb || !box) return;
  cb.checked = !cb.checked;
  box.classList.toggle('checked', cb.checked);
};

// โ”€โ”€ Panel โ”€โ”€
window.__closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
function openPanel(html, title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__newOpc  = () => { editId = null; openPanel(renderForm(null), '+ เน€เธเธดเนเธกเธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธก'); };
window.__editOpc = async id => {
  editId = id;
  const r = await getOpControl(id);
  openPanel(renderForm(r), 'โ๏ธ เนเธเนเนเธเธกเธฒเธ•เธฃเธเธฒเธฃเธเธงเธเธเธธเธก');
};

// โ”€โ”€ Save โ”€โ”€
window.__saveOpc = async () => {
  const controlTypes = OPC_CONTROL_TYPES
    .map(c => document.getElementById(`ctype-${c.key}`)?.checked ? c.key : null)
    .filter(Boolean);
  const data = {
    processType:       document.getElementById('f-processType').value,
    status:            document.getElementById('f-status').value,
    title:             document.getElementById('f-title').value.trim(),
    description:       document.getElementById('f-description').value.trim(),
    associatedHazards: document.getElementById('f-associatedHazards').value.trim(),
    controlTypes,
    controlDetail:     document.getElementById('f-controlDetail').value.trim(),
    docRef:            document.getElementById('f-docRef').value.trim(),
    verifyMethod:      document.getElementById('f-verifyMethod').value.trim(),
    verifyFreq:        document.getElementById('f-verifyFreq').value,
    nextVerifyDate:    document.getElementById('f-nextVerifyDate').value,
    responsible:       document.getElementById('f-responsible').value.trim(),
    notes:             document.getElementById('f-notes').value.trim(),
  };
  if (!data.title) { alert('เธเธฃเธธเธ“เธฒเธเธฃเธญเธเธเธทเนเธญเธกเธฒเธ•เธฃเธเธฒเธฃ'); return; }
  try {
    if (editId) await updateOpControl(editId, data);
    else        await createOpControl(data, profile.uid||profile.email||'unknown');
    window.__closePanel();
    await loadData();
  } catch(e) { alert('เธเธฑเธเธ—เธถเธเนเธกเนเธชเธณเน€เธฃเนเธ: ' + e.message); }
};

// โ”€โ”€ Delete โ”€โ”€
window.__deleteOpc = async (id, title) => {
  if (!confirm(`เธฅเธ "${title}"?`)) return;
  await deleteOpControl(id);
  window.__closePanel();
  await loadData();
};

// โ”€โ”€ Filter โ”€โ”€
function applyFilter() {
  const q   = document.getElementById('search-box')?.value.toLowerCase()||'';
  const pt  = document.getElementById('filter-process')?.value||'';
  const sts = document.getElementById('filter-status')?.value||'';
  const od  = document.getElementById('filter-overdue')?.value||'';
  const filtered = allRecs.filter(r =>
    (!q  || (r.title||'').toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q) || (r.associatedHazards||'').toLowerCase().includes(q)) &&
    (!pt  || r.processType===pt) &&
    (!sts || r.status===sts) &&
    (!od  || (od==='1' && isOverdue(r)))
  );
  document.getElementById('kpi-wrap').innerHTML = renderKPI(filtered);
  document.getElementById('content-wrap').innerHTML =
    viewMode==='group' ? renderGroups(filtered) : renderTable(filtered);
}
window.applyFilter = applyFilter;

window.__switchView = mode => {
  viewMode = mode;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===mode));
  applyFilter();
};

async function loadData() {
  allRecs = await listOpControls();
  applyFilter();
}
