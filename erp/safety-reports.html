<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายงานความปลอดภัย — KPO Safety</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/safety.css">
  <style>
    .period-bar{background:#1e3a5f;color:#fff;padding:.9rem 1.5rem;border-radius:10px;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:1.5rem}
    .period-bar label{font-size:.82rem;opacity:.75}
    .period-bar select{padding:.35rem .7rem;border-radius:6px;border:1px solid #4a6fa5;background:#0f2847;color:#fff;font-size:.88rem}
    #spinner{display:none;text-align:center;padding:3rem;color:#64748b}
    #reportWrap{display:none}

    /* Report layout */
    .rpt-header{text-align:center;padding:1.5rem 0 1rem;border-bottom:3px double #1e3a5f;margin-bottom:1.5rem}
    .rpt-header h1{font-size:1.25rem;color:#1e3a5f;margin:0;font-weight:700}
    .rpt-header .sub{color:#64748b;font-size:.88rem;margin-top:.3rem}
    .rpt-header .meta{margin-top:.7rem;font-size:.8rem;color:#475569;display:flex;gap:2rem;justify-content:center;flex-wrap:wrap}

    .rpt-section{margin-bottom:1.8rem}
    .rpt-section h2{font-size:.95rem;background:#1e3a5f;color:#fff;padding:.45rem 1rem;border-radius:6px;margin:0 0 .7rem;display:flex;align-items:center;gap:.5rem}

    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.7rem}
    .kpi-box{border:1px solid #e2e8f0;border-radius:8px;padding:.75rem .5rem;text-align:center;background:#fff}
    .kpi-box .val{font-size:1.7rem;font-weight:700;color:#1e3a5f;line-height:1}
    .kpi-box .lbl{font-size:.72rem;color:#64748b;margin-top:.3rem;line-height:1.3}
    .kpi-box.good .val{color:#16a34a}
    .kpi-box.warn .val{color:#d97706}
    .kpi-box.bad  .val{color:#dc2626}

    .rt{width:100%;border-collapse:collapse;font-size:.8rem}
    .rt th{background:#f1f5f9;color:#374151;padding:.4rem .6rem;text-align:left;border:1px solid #e2e8f0;white-space:nowrap}
    .rt td{padding:.4rem .6rem;border:1px solid #e2e8f0;vertical-align:top}
    .rt tr:nth-child(even) td{background:#f8fafc}
    .rt .center{text-align:center}

    .bx{display:inline-block;padding:.1rem .4rem;border-radius:4px;font-size:.7rem;font-weight:600}
    .empty{color:#94a3b8;font-style:italic;font-size:.82rem;padding:.7rem 0;text-align:center}

    .sig-row{display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;margin-top:2rem;padding-top:1rem;border-top:1px solid #e2e8f0;font-size:.8rem;color:#475569}
    .sig-row .sig-line{margin-bottom:2.5rem;border-bottom:1px solid #94a3b8}

    @media print{
      .period-bar,.no-print{display:none!important}
      #reportWrap{display:block!important}
      .rpt-section{page-break-inside:avoid}
      .kpi-grid{grid-template-columns:repeat(5,1fr)}
      body{font-size:10pt}
      .rt{font-size:9pt}
    }
  </style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell }  from './js/shell.js';
import {
  computeSafetyKPIs,
  listIncidents, listNearMiss,
  listCapaRecords,
  listInspections,
  listTrainings, TRAINING_TYPES, TRAINING_STATUS,
  listEquipments, EQUIP_STATUS,
  listMeetings, MEETING_STATUS, MEETING_TYPES,
  listDrills, DRILL_STATUS, DRILL_TYPES,
  listLegalRegisters, LEGAL_STATUS,
  listPermits, PERMIT_STATUS, PERMIT_TYPES,
  listRiskAssessments,
  listTalks,
  INCIDENT_TYPES, INCIDENT_STATUS, CAPA_STATUS
} from './js/safety-data.js';
import './js/safety-attach.js';

const _profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(_profile, 'safety-reports', 'รายงานความปลอดภัย');

const MONTHS_TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                   'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const now   = new Date();
let _type   = 'monthly';
let _month  = now.getMonth();
let _quarter= Math.floor(now.getMonth() / 3);
let _year   = now.getFullYear();

/* ── helpers ── */
function fmt(d) {
  if (!d) return '-';
  const dt = typeof d === 'string' ? new Date(d) : d;
  return `${dt.getDate().toString().padStart(2,'0')}/${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getFullYear()+543}`;
}
function bx(txt, color, bg) {
  return `<span class="bx" style="background:${bg||'#e2e8f0'};color:${color||'#374151'}">${txt}</span>`;
}
function inRange(val, s, e) {
  if (!val) return false;
  const d = typeof val === 'string' ? new Date(val) : val;
  return d >= s && d <= e;
}
function getTs(row) {
  return row.createdAt?.toDate?.() || null;
}

function getPeriod() {
  if (_type === 'monthly') {
    const s = new Date(_year, _month, 1);
    const e = new Date(_year, _month + 1, 0, 23, 59, 59);
    return { s, e, label: `${MONTHS_TH[_month]} ${_year + 543}` };
  }
  if (_type === 'quarterly') {
    const sm = _quarter * 3;
    const s  = new Date(_year, sm, 1);
    const e  = new Date(_year, sm + 3, 0, 23, 59, 59);
    const labels = ['ไตรมาส 1 (ม.ค.–มี.ค.)','ไตรมาส 2 (เม.ย.–มิ.ย.)','ไตรมาส 3 (ก.ค.–ก.ย.)','ไตรมาส 4 (ต.ค.–ธ.ค.)'];
    return { s, e, label: `${labels[_quarter]} ${_year + 543}` };
  }
  const s = new Date(_year, 0, 1);
  const e = new Date(_year, 11, 31, 23, 59, 59);
  return { s, e, label: `ประจำปี ${_year + 543}` };
}

/* ── period picker UI ── */
function buildPicker() {
  const cy   = now.getFullYear();
  const yrs  = Array.from({length: 5}, (_, i) => cy - i);
  const mOpt = MONTHS_TH.map((m, i) => `<option value="${i}" ${i===_month?'selected':''}>${m}</option>`).join('');
  const yOpt = yrs.map(y => `<option value="${y}" ${y===_year?'selected':''}>${y + 543}</option>`).join('');
  const qOpt = ['ไตรมาส 1','ไตรมาส 2','ไตรมาส 3','ไตรมาส 4']
               .map((q, i) => `<option value="${i}" ${i===_quarter?'selected':''}>${q}</option>`).join('');
  return `
  <div class="period-bar no-print">
    <div style="display:flex;gap:.5rem;align-items:center">
      <label>ประเภท</label>
      <select onchange="__sr_type(this.value)">
        <option value="monthly"   ${_type==='monthly'  ?'selected':''}>รายเดือน</option>
        <option value="quarterly" ${_type==='quarterly'?'selected':''}>รายไตรมาส</option>
        <option value="annual"    ${_type==='annual'   ?'selected':''}>รายปี</option>
      </select>
    </div>
    <div id="mPick" style="display:${_type==='monthly'?'flex':'none'};gap:.5rem;align-items:center">
      <label>เดือน</label>
      <select onchange="__sr_month(this.value)">${mOpt}</select>
    </div>
    <div id="qPick" style="display:${_type==='quarterly'?'flex':'none'};gap:.5rem;align-items:center">
      <label>ไตรมาส</label>
      <select onchange="__sr_q(this.value)">${qOpt}</select>
    </div>
    <div style="display:flex;gap:.5rem;align-items:center">
      <label>ปี</label>
      <select onchange="__sr_year(this.value)">${yOpt}</select>
    </div>
    <button class="btn btn-primary" id="genBtn" onclick="__sr_gen()">📊 สร้างรายงาน</button>
    <button class="btn no-print" onclick="window.print()">🖨️ พิมพ์</button>
  </div>
  <div id="spinner">⏳ กำลังโหลดข้อมูล...</div>
  <div id="reportWrap"></div>`;
}

window.__sr_type = v => {
  _type = v;
  document.getElementById('mPick').style.display = v==='monthly'   ? 'flex' : 'none';
  document.getElementById('qPick').style.display = v==='quarterly' ? 'flex' : 'none';
};
window.__sr_month = v => { _month   = +v; };
window.__sr_q     = v => { _quarter = +v; };
window.__sr_year  = v => { _year    = +v; };

window.__sr_gen = async () => {
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '⏳ กำลังโหลด...';
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('reportWrap').style.display = 'none';

  const { s, e, label } = getPeriod();
  const sStr = s.toISOString().slice(0, 10);
  const eStr = e.toISOString().slice(0, 10);

  try {
    const [kpis, incidents, nearMiss, capas, inspections,
           trainings, equipments, meetings, drills, legals,
           permits, risks, talks] = await Promise.all([
      computeSafetyKPIs({ startDate: sStr, endDate: eStr }),
      listIncidents({ startDate: sStr, endDate: eStr }),
      listNearMiss({ startDate: sStr, endDate: eStr }),
      listCapaRecords({}),
      listInspections({ startDate: sStr, endDate: eStr }),
      listTrainings({}),
      listEquipments({}),
      listMeetings({}),
      listDrills({}),
      listLegalRegisters({}),
      listPermits({ startDate: sStr, endDate: eStr }),
      listRiskAssessments({}),
      listTalks({ startDate: sStr, endDate: eStr }),
    ]);
    buildReport({ label, s, e, kpis, incidents, nearMiss, capas, inspections,
                  trainings, equipments, meetings, drills, legals, permits, risks, talks });
  } catch (err) {
    alert('เกิดข้อผิดพลาด: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = '📊 สร้างรายงาน';
    document.getElementById('spinner').style.display = 'none';
  }
};

function buildReport({ label, s, e, kpis, incidents, nearMiss, capas, inspections,
                       trainings, equipments, meetings, drills, legals, permits, risks, talks }) {
  const today = new Date();

  /* ── period-filter helpers ── */
  const filterPeriod = (rows, field) =>
    rows.filter(r => inRange(r[field] || getTs(r)?.toISOString(), s, e));

  const trainingPeriod = filterPeriod(trainings, 'trainingDate');
  const meetingPeriod  = filterPeriod(meetings,  'meetingDate');
  const drillPeriod    = filterPeriod(drills,     'drillDate');

  /* ── KPI helpers ── */
  const lostDays     = incidents.reduce((a, b) => a + (b.lostTimeDays || 0), 0);
  const openCapa     = capas.filter(c => c.status !== 'closed');
  const closedCapa   = capas.filter(c => c.status === 'closed');
  const overdueCapa  = openCapa.filter(c => c.dueDate && new Date(c.dueDate) < today);

  const insWithRate  = inspections.filter(i => typeof i.passRate === 'number');
  const avgPass      = insWithRate.length
    ? Math.round(insWithRate.reduce((a,b) => a + b.passRate, 0) / insWithRate.length)
    : null;

  const expiredEq    = equipments.filter(eq =>
    eq.expiryDate && new Date(eq.expiryDate) < today && eq.status !== 'retired');
  const soonEq       = equipments.filter(eq => {
    if (!eq.expiryDate) return false;
    const d = Math.ceil((new Date(eq.expiryDate) - today) / 86400000);
    return d >= 0 && d <= 30 && eq.status !== 'retired';
  });

  const compliantLg  = legals.filter(l => l.status === 'compliant').length;
  const legalPct     = legals.length ? Math.round(compliantLg / legals.length * 100) : 0;
  const nonCompLg    = legals.filter(l => l.status === 'non_compliant').length;
  const overdueLg    = legals.filter(l => l.nextReviewDate && new Date(l.nextReviewDate) < today).length;

  const ttlPax       = trainingPeriod.reduce((a, b) => a + (b.participantCount || 0), 0);
  const ttlHrs       = trainingPeriod.reduce((a, b) => a + (b.durationHours || 0), 0);

  const drillsScored = drillPeriod.filter(d => d.score);
  const avgDrill     = drillsScored.length
    ? (drillsScored.reduce((a,b) => a + b.score, 0) / drillsScored.length).toFixed(1)
    : null;

  const extremeRisks = risks.filter(r =>
    (r.hazards || []).some(h => (h.likelihoodAfter||0)*(h.severityAfter||0) > 16)).length;
  const highRisks    = risks.filter(r =>
    (r.hazards || []).some(h => { const sc = (h.likelihoodAfter||0)*(h.severityAfter||0); return sc >= 10 && sc <= 16; })).length;

  /* ── section renderers ── */
  const emptyNote = txt => `<p class="empty">${txt || 'ไม่มีข้อมูลในช่วงเวลาดังกล่าว'}</p>`;

  // Section 1 — KPI
  const kpiColor = (v, good, warn) => v <= good ? 'good' : v <= warn ? 'warn' : 'bad';
  const kpiHtml = `
    <div class="kpi-grid">
      <div class="kpi-box ${kpiColor(incidents.length,0,3)}">
        <div class="val">${incidents.length}</div><div class="lbl">อุบัติเหตุ (ครั้ง)</div></div>
      <div class="kpi-box ${kpiColor(nearMiss.length,0,5)}">
        <div class="val">${nearMiss.length}</div><div class="lbl">Near Miss (ครั้ง)</div></div>
      <div class="kpi-box ${kpiColor(lostDays,0,1)}">
        <div class="val">${lostDays}</div><div class="lbl">วันสูญเสีย (วัน)</div></div>
      <div class="kpi-box ${kpis.fatality>0?'bad':kpis.lti>0?'bad':'good'}">
        <div class="val">${kpis.fatality > 0 ? kpis.fatality : kpis.lti}</div>
        <div class="lbl">${kpis.fatality > 0 ? 'เสียชีวิต' : 'หยุดงาน LTI'}</div></div>
      <div class="kpi-box ${kpiColor(overdueCapa.length,0,2)}">
        <div class="val">${overdueCapa.length}</div><div class="lbl">CAPA เกินกำหนด</div></div>
      <div class="kpi-box ${avgPass===null?'':avgPass>=90?'good':avgPass>=70?'warn':'bad'}">
        <div class="val">${avgPass !== null ? avgPass + '%' : '-'}</div><div class="lbl">Pass Rate ตรวจสอบ</div></div>
      <div class="kpi-box">
        <div class="val">${ttlPax}</div><div class="lbl">ผู้เข้าอบรม (คน)</div></div>
      <div class="kpi-box">
        <div class="val">${ttlHrs}</div><div class="lbl">ชั่วโมงอบรม</div></div>
      <div class="kpi-box ${legalPct>=90?'good':legalPct>=70?'warn':'bad'}">
        <div class="val">${legalPct}%</div><div class="lbl">สอดคล้องกฎหมาย</div></div>
      <div class="kpi-box ${kpiColor(expiredEq.length,0,3)}">
        <div class="val">${expiredEq.length}</div><div class="lbl">PPE หมดอายุ</div></div>
    </div>`;

  // Section 2 — Incidents
  const incHtml = incidents.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>วันที่</th><th>รหัส</th><th>ประเภท</th><th>แผนก</th><th class="center">วันสูญเสีย</th><th>สถานะ</th><th>รายละเอียด</th></tr></thead>
      <tbody>${incidents.map(i => {
        const t  = INCIDENT_TYPES[i.incidentType] || {};
        const st = INCIDENT_STATUS[i.status] || {};
        return `<tr>
          <td>${fmt(i.incidentDate)}</td>
          <td style="font-family:monospace;font-size:.72rem">${i.incidentId||'-'}</td>
          <td>${bx(t.labelTh||i.incidentType||'-', t.color, t.bg)}</td>
          <td>${i.department||'-'}</td>
          <td class="center">${i.lostTimeDays||0}</td>
          <td>${bx(st.label||i.status||'-', st.color, st.bg)}</td>
          <td>${(i.description||'').slice(0,60)}${i.description?.length>60?'…':''}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  // Section 3 — Near Miss
  const nmHtml = nearMiss.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>วันที่</th><th>แผนก</th><th>ประเภท</th><th>สถานะ</th><th>รายละเอียด</th></tr></thead>
      <tbody>${nearMiss.map(n => `<tr>
        <td>${fmt(n.incidentDate || getTs(n)?.toISOString())}</td>
        <td>${n.department||'-'}</td>
        <td>${n.nearMissType||'-'}</td>
        <td>${n.status||'-'}</td>
        <td>${(n.description||'').slice(0,80)}${n.description?.length>80?'…':''}</td>
      </tr>`).join('')}</tbody>
    </table>`;

  // Section 4 — CAPA
  const capaHtml = openCapa.length === 0
    ? `<p class="empty">ไม่มี CAPA ค้างอยู่</p>`
    : `<table class="rt">
        <thead><tr><th>แหล่งที่มา</th><th>คำอธิบาย</th><th>ผู้รับผิดชอบ</th><th>กำหนด</th><th>สถานะ</th></tr></thead>
        <tbody>${openCapa.map(c => {
          const od = c.dueDate && new Date(c.dueDate) < today;
          const st = CAPA_STATUS[c.status] || {};
          return `<tr style="${od?'background:#fef2f2':''}">
            <td>${c.sourceType||'-'}</td>
            <td>${(c.description||'').slice(0,60)}${c.description?.length>60?'…':''}</td>
            <td>${c.assignedTo||'-'}</td>
            <td style="${od?'color:#dc2626;font-weight:600':''}">${fmt(c.dueDate)}</td>
            <td>${bx(st.label||c.status,'#fff',st.color||'#94a3b8')}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
      <div style="margin-top:.4rem;font-size:.78rem;color:#475569">ปิดแล้ว ${closedCapa.length} รายการ | เกินกำหนด ${overdueCapa.length} รายการ</div>`;

  // Section 5 — Inspections
  const insHtml = inspections.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>วันที่</th><th>แผนก/พื้นที่</th><th>ผู้ตรวจ</th><th class="center">ผ่าน</th><th class="center">ไม่ผ่าน</th><th class="center">Pass%</th><th>สถานะ</th></tr></thead>
      <tbody>${inspections.map(i => {
        const pr = typeof i.passRate === 'number' ? i.passRate : null;
        const pc = pr === null ? '' : pr >= 90 ? '#16a34a' : pr >= 70 ? '#d97706' : '#dc2626';
        return `<tr>
          <td>${fmt(i.inspectionDate)}</td>
          <td>${i.area||i.department||'-'}</td>
          <td>${i.inspectorName||'-'}</td>
          <td class="center" style="color:#16a34a">${i.passCount??'-'}</td>
          <td class="center" style="color:#dc2626">${i.failCount??'-'}</td>
          <td class="center" style="color:${pc};font-weight:600">${pr!==null?pr+'%':'-'}</td>
          <td>${i.status||'-'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  // Section 6 — Training
  const trHtml = trainingPeriod.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>วันที่</th><th>หลักสูตร</th><th>ประเภท</th><th>ผู้สอน</th><th class="center">คน</th><th class="center">ชม.</th><th>สถานะ</th></tr></thead>
      <tbody>${trainingPeriod.map(t => {
        const tt = TRAINING_TYPES.find(x => x.key === t.trainingType);
        const st = TRAINING_STATUS[t.status] || {};
        return `<tr>
          <td>${fmt(t.trainingDate)}</td>
          <td>${t.trainingTitle||'-'}</td>
          <td>${tt?.label||t.trainingType||'-'}</td>
          <td>${t.instructor||'-'}</td>
          <td class="center">${t.participantCount||0}</td>
          <td class="center">${t.durationHours||0}</td>
          <td>${bx(st.label||t.status,'#fff',st.color||'#94a3b8')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div style="margin-top:.4rem;font-size:.78rem;color:#475569">รวม ${ttlPax} คน / ${ttlHrs} ชั่วโมง</div>`;

  // Section 7 — Equipment
  const alertEq = [...expiredEq, ...soonEq.filter(eq => !expiredEq.includes(eq))];
  const eqHtml = alertEq.length === 0
    ? `<p class="empty">ไม่มีอุปกรณ์หมดอายุหรือใกล้หมดอายุ (≤30 วัน)</p>`
    : `<table class="rt">
        <thead><tr><th>ชื่ออุปกรณ์</th><th>หมวดหมู่</th><th>หมายเลข</th><th>ผู้ใช้</th><th>วันหมดอายุ</th><th>สถานะ</th></tr></thead>
        <tbody>${alertEq.map(eq => {
          const d  = eq.expiryDate ? Math.ceil((new Date(eq.expiryDate)-today)/86400000) : null;
          const st = EQUIP_STATUS[eq.status] || {};
          const rd = d !== null && d < 0 ? '#fef2f2' : d !== null && d <= 7 ? '#fffbeb' : '';
          return `<tr style="${rd?'background:'+rd:''}">
            <td>${eq.equipmentName||'-'}</td>
            <td>${eq.category||'-'}</td>
            <td style="font-family:monospace;font-size:.72rem">${eq.serialNumber||'-'}</td>
            <td>${eq.assignedTo||'-'}</td>
            <td style="color:${d!==null&&d<0?'#dc2626':'#d97706'};font-weight:600">${fmt(eq.expiryDate)}</td>
            <td>${bx(st.label||eq.status,'#fff',st.color||'#94a3b8')}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;

  // Section 8 — PTW
  const ptwHtml = permits.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>เลขที่</th><th>ประเภท</th><th>งาน</th><th>แผนก</th><th>วันที่</th><th>สถานะ</th></tr></thead>
      <tbody>${permits.map(p => {
        const pt = PERMIT_TYPES[p.permitType] || {};
        const st = PERMIT_STATUS[p.status] || {};
        return `<tr>
          <td style="font-family:monospace;font-size:.72rem">${p.permitId||'-'}</td>
          <td>${pt.labelTh||p.permitType||'-'}</td>
          <td>${(p.workDescription||'').slice(0,50)}${p.workDescription?.length>50?'…':''}</td>
          <td>${p.department||'-'}</td>
          <td>${fmt(p.startDate||getTs(p)?.toISOString())}</td>
          <td>${bx(st.label||p.status,'#fff',st.color||'#94a3b8')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  // Section 9 — Meetings
  const mtgHtml = meetingPeriod.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>ครั้งที่</th><th>วันที่</th><th>ประเภท</th><th class="center">วาระ</th><th class="center">มติ</th><th>สถานะ</th></tr></thead>
      <tbody>${meetingPeriod.map(m => {
        const mt = MEETING_TYPES.find(x => x.key === m.meetingType);
        const st = MEETING_STATUS[m.status] || {};
        return `<tr>
          <td>${m.meetingNo||'-'}</td>
          <td>${fmt(m.meetingDate)}</td>
          <td>${mt?.label||m.meetingType||'-'}</td>
          <td class="center">${(m.agendas||[]).length}</td>
          <td class="center">${(m.resolutions||[]).length}</td>
          <td>${bx(st.label||m.status,'#fff',st.color||'#94a3b8')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;

  // Section 10 — Drills
  const drillHtml = drillPeriod.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>วันที่</th><th>ประเภท</th><th>สถานที่</th><th class="center">ผู้เข้าร่วม</th><th class="center">ระยะเวลา</th><th class="center">คะแนน</th><th>สถานะ</th></tr></thead>
      <tbody>${drillPeriod.map(d => {
        const dt = DRILL_TYPES.find(x => x.key === d.drillType);
        const st = DRILL_STATUS[d.status] || {};
        const sc = d.score;
        const sc_c = sc >= 8 ? '#16a34a' : sc >= 6 ? '#d97706' : '#dc2626';
        return `<tr>
          <td>${fmt(d.drillDate)}</td>
          <td>${dt?.label||d.drillType||'-'}</td>
          <td>${d.location||'-'}</td>
          <td class="center">${d.participantCount||0}</td>
          <td class="center">${d.durationMinutes||'-'} นาที</td>
          <td class="center" style="color:${sc?sc_c:'#94a3b8'};font-weight:600">${sc||'-'}/10</td>
          <td>${bx(st.label||d.status,'#fff',st.color||'#94a3b8')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    ${avgDrill ? `<div style="margin-top:.4rem;font-size:.78rem;color:#475569">คะแนนเฉลี่ย ${avgDrill}/10</div>` : ''}`;

  // Section 11 — Legal
  const lgHtml = legals.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>กฎหมาย / มาตรฐาน</th><th>หมวด</th><th>ข้อกำหนดสำคัญ</th><th>สถานะ</th><th>ทบทวนครั้งถัดไป</th></tr></thead>
      <tbody>${legals.map(l => {
        const st = LEGAL_STATUS[l.status] || {};
        const od = l.nextReviewDate && new Date(l.nextReviewDate) < today;
        return `<tr style="${l.status==='non_compliant'?'background:#fef2f2':''}">
          <td>${l.lawName||'-'}</td>
          <td>${l.category||'-'}</td>
          <td>${(l.requirements||'').slice(0,60)}${l.requirements?.length>60?'…':''}</td>
          <td>${bx(st.label||l.status,'#fff',st.color||'#94a3b8')}</td>
          <td style="${od?'color:#dc2626;font-weight:600':''}">${fmt(l.nextReviewDate)}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>
    <div style="margin-top:.4rem;font-size:.78rem;color:#475569">
      สอดคล้อง ${compliantLg} | ไม่สอดคล้อง ${nonCompLg} | เกินกำหนดทบทวน ${overdueLg} รายการ
    </div>`;

  // Section 12 — Risk
  const riskHtml = risks.length === 0
    ? emptyNote('ไม่มีข้อมูลการประเมินความเสี่ยง')
    : `<table class="rt">
        <thead><tr><th>หน่วยงาน</th><th>ชื่อประเมิน</th><th class="center">อันตราย</th><th class="center" style="color:#dc2626">Extreme</th><th class="center" style="color:#d97706">High</th><th>ผู้ประเมิน</th><th>วันที่</th></tr></thead>
        <tbody>${risks.map(r => {
          const haz = r.hazards || [];
          const ext = haz.filter(h => (h.likelihoodAfter||0)*(h.severityAfter||0) > 16).length;
          const hi  = haz.filter(h => { const sc=(h.likelihoodAfter||0)*(h.severityAfter||0); return sc>=10&&sc<=16; }).length;
          return `<tr>
            <td>${r.department||'-'}</td>
            <td>${r.assessmentTitle||'-'}</td>
            <td class="center">${haz.length}</td>
            <td class="center" style="color:${ext>0?'#dc2626':'#374151'};font-weight:${ext>0?'700':'400'}">${ext}</td>
            <td class="center" style="color:${hi>0?'#d97706':'#374151'};font-weight:${hi>0?'700':'400'}">${hi}</td>
            <td>${r.assessorName||'-'}</td>
            <td>${fmt(r.assessmentDate||getTs(r)?.toISOString())}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;

  // Section 13 — Safety Talks
  const tlkHtml = talks.length === 0 ? emptyNote() : `
    <table class="rt">
      <thead><tr><th>วันที่</th><th>หัวข้อ</th><th>ประเภท</th><th>แผนก</th><th class="center">ผู้เข้าร่วม</th><th class="center">ระยะเวลา</th></tr></thead>
      <tbody>${talks.map(t => `<tr>
        <td>${fmt(t.talkDate||getTs(t)?.toISOString())}</td>
        <td>${t.talkTitle||t.topic||'-'}</td>
        <td>${t.talkType||'-'}</td>
        <td>${t.department||'-'}</td>
        <td class="center">${t.attendeeCount||0}</td>
        <td class="center">${t.durationMinutes||'-'} นาที</td>
      </tr>`).join('')}</tbody>
    </table>`;

  /* ── assemble ── */
  const wrap = document.getElementById('reportWrap');
  wrap.innerHTML = `
    <div class="rpt-header">
      <div style="font-size:.82rem;color:#64748b;margin-bottom:.3rem">บริษัท เค.พี.โอ. จำกัด — ระบบบริหารความปลอดภัย KPO Safety</div>
      <h1>รายงานความปลอดภัย ${label}</h1>
      <div class="sub">ช่วงเวลา: ${fmt(s.toISOString())} — ${fmt(e.toISOString())}</div>
      <div class="meta">
        <span>จัดทำโดย: ${_profile.displayName||_profile.email}</span>
        <span>วันที่สร้าง: ${fmt(new Date().toISOString())}</span>
      </div>
    </div>

    <div class="rpt-section">
      <h2>📊 ส่วนที่ 1 — บทสรุป KPI ความปลอดภัย</h2>${kpiHtml}</div>

    <div class="rpt-section">
      <h2>⚠️ ส่วนที่ 2 — อุบัติเหตุ (${incidents.length} ครั้ง | วันสูญเสีย ${lostDays} วัน)</h2>${incHtml}</div>

    <div class="rpt-section">
      <h2>🔶 ส่วนที่ 3 — Near Miss / เหตุการณ์เกือบเกิดอุบัติเหตุ (${nearMiss.length} ครั้ง)</h2>${nmHtml}</div>

    <div class="rpt-section">
      <h2>✅ ส่วนที่ 4 — ติดตาม CAPA (เปิดอยู่ ${openCapa.length} | เกินกำหนด ${overdueCapa.length})</h2>${capaHtml}</div>

    <div class="rpt-section">
      <h2>🔍 ส่วนที่ 5 — การตรวจสอบความปลอดภัย (${inspections.length} ครั้ง${avgPass!==null?' | เฉลี่ย '+avgPass+'%':''})</h2>${insHtml}</div>

    <div class="rpt-section">
      <h2>🎓 ส่วนที่ 6 — การฝึกอบรม (${trainingPeriod.length} หลักสูตร | ${ttlPax} คน | ${ttlHrs} ชม.)</h2>${trHtml}</div>

    <div class="rpt-section">
      <h2>🦺 ส่วนที่ 7 — อุปกรณ์ PPE ที่ต้องดำเนินการ (หมดอายุ ${expiredEq.length} | ใกล้หมด ${soonEq.length})</h2>${eqHtml}</div>

    <div class="rpt-section">
      <h2>📋 ส่วนที่ 8 — ใบอนุญาตทำงาน PTW (${permits.length} ใบ)</h2>${ptwHtml}</div>

    <div class="rpt-section">
      <h2>🤝 ส่วนที่ 9 — การประชุม คปอ. (${meetingPeriod.length} ครั้ง)</h2>${mtgHtml}</div>

    <div class="rpt-section">
      <h2>🚨 ส่วนที่ 10 — ซ้อมแผนฉุกเฉิน (${drillPeriod.length} ครั้ง${avgDrill?' | เฉลี่ย '+avgDrill+'/10':''})</h2>${drillHtml}</div>

    <div class="rpt-section">
      <h2>⚖️ ส่วนที่ 11 — ความสอดคล้องกฎหมาย (${legalPct}% | ไม่สอดคล้อง ${nonCompLg})</h2>${lgHtml}</div>

    <div class="rpt-section">
      <h2>📊 ส่วนที่ 12 — ประเมินความเสี่ยง HIRA (${risks.length} ประเมิน | Extreme ${extremeRisks} | High ${highRisks})</h2>${riskHtml}</div>

    <div class="rpt-section">
      <h2>💬 ส่วนที่ 13 — Safety Talk (${talks.length} ครั้ง)</h2>${tlkHtml}</div>

    <div class="sig-row">
      <div>
        <div class="sig-line">&nbsp;</div>
        <div>เจ้าหน้าที่ความปลอดภัยวิชาชีพ</div>
        <div style="margin-top:.2rem;color:#94a3b8">วันที่ ___________________</div>
      </div>
      <div>
        <div class="sig-line">&nbsp;</div>
        <div>ประธาน คปอ.</div>
        <div style="margin-top:.2rem;color:#94a3b8">วันที่ ___________________</div>
      </div>
      <div>
        <div class="sig-line">&nbsp;</div>
        <div>ผู้จัดการโรงงาน / ผู้บริหาร</div>
        <div style="margin-top:.2rem;color:#94a3b8">วันที่ ___________________</div>
      </div>
    </div>
  `;
  wrap.style.display = 'block';
  wrap.scrollIntoView({ behavior: 'smooth' });
}

/* ── inject into page ── */
const target = document.getElementById('main-content');
target.insertAdjacentHTML('beforeend', buildPicker());
</script>
</body>
</html>
