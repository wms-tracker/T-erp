// ─── Period helpers ────────────────────────────────────────────────────────
function periodRange(p, customStart, customEnd) {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  if (p === 'month')  return { start: `${y}-${pad(m+1)}-01`, end: fmt(new Date(y,m+1,0)), label: `เดือน${m+1}/${y}` };
  if (p === 'q')      { const qm = Math.floor(m/3)*3; return { start:`${y}-${pad(qm+1)}-01`, end: fmt(new Date(y,qm+3,0)), label:`Q${Math.floor(m/3)+1}/${y}` }; }
  if (p === 'ytd')    return { start: `${y}-01-01`, end: fmt(now), label: `YTD ${y}` };
  if (p === 'year')   return { start: `${y}-01-01`, end: `${y}-12-31`, label: `ปี ${y}` };
  if (p === 'lastyear') return { start:`${y-1}-01-01`, end:`${y-1}-12-31`, label:`ปี ${y-1}` };
  return { start: customStart||`${y}-01-01`, end: customEnd||fmt(now), label:`${customStart} – ${customEnd}` };
}

let _period = 'ytd', _customStart = '', _customEnd = '';
let _allData = {};

// ─── Load all data ─────────────────────────────────────────────────────────
async function loadAllData() {
  const { start, end } = periodRange(_period, _customStart, _customEnd);
  const year = new Date(start).getFullYear();

  const [
    incidents, nearMiss, capas, inspections, risks,
    trainings, equips, drills, legals, members, trendData
  ] = await Promise.all([
    listIncidents({ startDate: start, endDate: end, lim: 1000 }),
    listNearMiss({ startDate: start, endDate: end, lim: 1000 }),
    listCapaRecords({ lim: 500 }),
    listInspections({ startDate: start, endDate: end, lim: 500 }),
    listRiskAssessments({ lim: 200 }),
    listTrainings({ lim: 200 }),
    listEquipments({ lim: 500 }),
    listDrills({ lim: 100 }),
    listLegalRegisters({ lim: 200 }),
    listCommitteeMembers(),
    monthlyTrend(year),
  ]);

  _allData = { incidents, nearMiss, capas, inspections, risks, trainings, equips, drills, legals, members, trendData, start, end };
  return _allData;
}

// ─── Render report ─────────────────────────────────────────────────────────
async function renderReport() {
  const rc = $('reportContent');
  rc.innerHTML = '<div style="text-align:center;padding:60px;color:#94a3b8">⏳ กำลังวิเคราะห์ข้อมูล...</div>';

  // Destroy old charts
  Object.values(CHART_INSTANCES).forEach(c => { try { c.destroy(); } catch{} });

  const data = await loadAllData();
  const { start, end, incidents, nearMiss, capas, inspections, risks, trainings, equips, drills, legals, members, trendData } = data;

  // ── KPI calculations ────────────────────────────────────────────────────
  const totalIncidents   = incidents.length;
  const fatalLTI         = incidents.filter(i => ['fatality','lti'].includes(i.incidentType)).length;
  const nmCount          = nearMiss.length;
  const openCapa         = capas.filter(c => c.status !== 'closed').length;
  const overdueCapa      = capas.filter(c => c.status !== 'closed' && c.dueDate && c.dueDate < new Date().toISOString().split('T')[0]).length;
  const inspTotal        = inspections.length;
  const inspPass         = inspections.reduce((s,i) => s + (i.passCount||0), 0);
  const inspItems        = inspections.reduce((s,i) => s + ((i.passCount||0) + (i.failCount||0)), 0);
  const inspPassRate     = inspItems > 0 ? Math.round(inspPass/inspItems*100) : null;
  const highRiskCount    = risks.filter(r => { const l = getRiskLevel((r.likelihood||1)*(r.severity||1)); return l.level === 'high' || l.level === 'extreme'; }).length;
  const trainCompleted   = trainings.filter(t => t.status === 'completed').length;
  const totalParticipants = trainings.filter(t=>t.status==='completed').reduce((s,t)=>s+(t.participantCount||0),0);
  const legalCompliance  = legals.length > 0 ? Math.round(legals.filter(l=>l.complianceStatus==='compliant').length / legals.filter(l=>l.complianceStatus!=='not_applicable').length * 100) : null;
  const expiredEquip     = equips.filter(e => e.expiryDate && e.expiryDate < new Date().toISOString().split('T')[0]).length;
  const drillsDone       = drills.filter(d=>d.status==='completed').length;

  // ── Days Without Accident ──
  const severeTypes = ['fatality','lti','rws','mtc','fac'];
  const severeIncidents = incidents.filter(i => severeTypes.includes(i.incidentType)).sort((a,b) => b.incidentDate?.localeCompare(a.incidentDate));
  const lastSevere = severeIncidents[0]?.incidentDate;
  const daysWithout = lastSevere
    ? Math.floor((new Date() - new Date(lastSevere)) / 86400000)
    : null;

  // ── AI Insights ────────────────────────────────────────────────────────
  const insights = generateInsights({ incidents, nearMiss, capas, inspections, risks, trainings, equips, legals, drills });

  // ── Monthly trend labels ────────────────────────────────────────────────
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const trendLabels = trendData.map(d => months[d.month-1]);
  const trendVals   = trendData.map(d => d.count);

  // ── Incident by type ───────────────────────────────────────────────────
  const typeCounts = {};
  for (const inc of incidents) {
    const k = inc.incidentType;
    typeCounts[k] = (typeCounts[k]||0) + 1;
  }
  const typeLabels = Object.keys(typeCounts).map(k => (INCIDENT_TYPES[k]?.labelTh || k));
  const typeData   = Object.values(typeCounts);
  const typeColors = Object.keys(typeCounts).map(k => INCIDENT_TYPES[k]?.color || '#94a3b8');

  // ── Incident by dept ───────────────────────────────────────────────────
  const deptCounts = {};
  for (const inc of incidents) {
    const k = inc.department || 'ไม่ระบุ';
    deptCounts[k] = (deptCounts[k]||0) + 1;
  }
  const deptLabels = Object.keys(deptCounts);
  const deptData   = Object.values(deptCounts);

  // ── Risk distribution ──────────────────────────────────────────────────
  const riskDist = { low:0, moderate:0, high:0, extreme:0 };
  for (const r of risks) {
    const l = getRiskLevel((r.likelihood||1)*(r.severity||1));
    riskDist[l.level] = (riskDist[l.level]||0) + 1;
  }

  // ── Training by type ───────────────────────────────────────────────────
  const trainByType = {};
  for (const t of trainings.filter(t=>t.status==='completed')) {
    const k = TRAINING_TYPES.find(x=>x.key===t.trainingType)?.label || t.trainingType || 'อื่นๆ';
    trainByType[k] = (trainByType[k]||0) + (t.participantCount||0);
  }

  // ── Render HTML ────────────────────────────────────────────────────────
  rc.innerHTML = `
  <!-- Days Without Accident Banner -->
  ${daysWithout !== null ? `
  <div style="background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;border-radius:14px;padding:18px 24px;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <div style="text-align:center;min-width:80px">
      <div style="font-size:3rem;font-weight:900;line-height:1">${daysWithout}</div>
      <div style="font-size:.75rem;opacity:.7;font-weight:600">วัน</div>
    </div>
    <div>
      <div style="font-size:1rem;font-weight:700">ไม่มีอุบัติเหตุสูญเสียวัน (LTI+) ต่อเนื่อง</div>
      <div style="font-size:.82rem;opacity:.7;margin-top:4px">นับจาก ${lastSevere} ถึงวันนี้</div>

  <!-- KPI Cards -->

    <div class="kpi-card" style="border-color:#7f1d1d"><div class="kpi-val" style="color:#7f1d1d">${fatalLTI}</div><div class="kpi-lbl">Fatality + LTI</div></div>
    <div class="kpi-card" style="border-color:#2563eb"><div class="kpi-val" style="color:#2563eb">${nmCount}</div><div class="kpi-lbl">Near Miss / Unsafe</div></div>
    <div class="kpi-card" style="border-color:#d97706"><div class="kpi-val" style="color:#d97706">${openCapa}</div><div class="kpi-lbl">CAPA ค้างอยู่${overdueCapa>0?` <span style="color:#dc2626">(${overdueCapa} เกิน)</span>`:''}</div></div>
    <div class="kpi-card" style="border-color:#0891b2"><div class="kpi-val" style="color:#0891b2">${inspPassRate!==null?inspPassRate+'%':'—'}</div><div class="kpi-lbl">Pass Rate ตรวจสอบ (${inspTotal} ครั้ง)</div></div>
    <div class="kpi-card" style="border-color:#dc2626"><div class="kpi-val" style="color:#dc2626">${highRiskCount}</div><div class="kpi-lbl">ความเสี่ยงสูง/สูงมาก</div></div>
    <div class="kpi-card" style="border-color:#16a34a"><div class="kpi-val" style="color:#16a34a">${trainCompleted}</div><div class="kpi-lbl">อบรมเสร็จแล้ว (${totalParticipants} คน)</div></div>
    <div class="kpi-card" style="border-color:${legalCompliance!==null&&legalCompliance<80?'#dc2626':'#16a34a'}"><div class="kpi-val" style="color:${legalCompliance!==null&&legalCompliance<80?'#dc2626':'#16a34a'}">${legalCompliance!==null?legalCompliance+'%':'—'}</div><div class="kpi-lbl">ความสอดคล้องกฎหมาย</div></div>
    <div class="kpi-card" style="border-color:${expiredEquip>0?'#dc2626':'#16a34a'}"><div class="kpi-val" style="color:${expiredEquip>0?'#dc2626':'#16a34a'}">${expiredEquip}</div><div class="kpi-lbl">อุปกรณ์หมดอายุ</div></div>
    <div class="kpi-card" style="border-color:#7c3aed"><div class="kpi-val" style="color:#7c3aed">${drillsDone}</div><div class="kpi-lbl">ซ้อมแผนฉุกเฉินเสร็จ</div></div>
    <div class="kpi-card" style="border-color:#0891b2"><div class="kpi-val" style="color:#0891b2">${members.filter(m=>m.status==='active').length}</div><div class="kpi-lbl">กรรมการ คปอ. ปัจจุบัน</div></div>
  </div>

  <!-- AI Analyst -->
  <div class="ai-panel">
    <div class="ai-panel-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 0 2h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1 0-2h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/></svg>
      AI Safety Analyst — วิเคราะห์ข้อมูลและคำแนะนำ

    ${insights.length === 0
      ? `<div style="opacity:.6;font-size:.85rem">📊 ยังไม่มีข้อมูลเพียงพอสำหรับการวิเคราะห์ในช่วงเวลานี้</div>`
      : insights.map(ins => `
      <div class="ai-insight" style="border-color:${ins.color}">
        <div class="ai-insight-label" style="color:${ins.color}">${ins.icon} ${ins.level}</div>
        <div class="ai-insight-text">${ins.text}</div>
      </div>`).join('')}
  </div>

  <!-- Charts -->
  <div class="section-title">📈 แนวโน้มรายเดือน</div>
  <div class="chart-grid">
    <div class="chart-card" style="grid-column:1/-1">
      <div class="chart-card-title">จำนวนอุบัติเหตุรายเดือน (ปี ${new Date(start).getFullYear()})</div>
      <div class="chart-wrap" style="height:200px"><canvas id="chartTrend"></canvas></div>
    </div>
  </div>

  <div class="chart-grid">
    <div class="chart-card">
      <div class="chart-card-title">อุบัติเหตุแยกตามประเภท</div>
      <div class="chart-wrap"><canvas id="chartType"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-card-title">อุบัติเหตุแยกตามแผนก</div>
      <div class="chart-wrap"><canvas id="chartDept"></canvas></div>

    <table class="dept-table">
      <thead><tr><th>แผนก</th><th style="text-align:center">จำนวนเหตุ</th><th style="text-align:center">Near Miss</th><th style="text-align:center">สัดส่วน</th></tr></thead>
      <tbody>
      ${deptLabels.sort((a,b)=>deptCounts[b]-deptCounts[a]).map(dept => {
        const nmDept = nearMiss.filter(n=>n.department===dept).length;
        const pct = totalIncidents > 0 ? Math.round(deptCounts[dept]/totalIncidents*100) : 0;
        return `<tr>
          <td>${dept}</td>
          <td style="text-align:center;font-weight:700;color:#dc2626">${deptCounts[dept]}</td>
          <td style="text-align:center;color:#2563eb">${nmDept}</td>
          <td style="text-align:center">
            <div style="display:flex;align-items:center;gap:6px;justify-content:center">
              <div style="width:80px;height:6px;background:#f1f5f9;border-radius:3px"><div style="width:${pct}%;height:100%;background:#dc2626;border-radius:3px"></div></div>
              <span style="font-size:.78rem;color:#64748b">${pct}%</span>
            </div>
          </td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
  </div>` : ''}

  <!-- CAPA overdue list -->
  ${overdueCapa > 0 ? `
  <div class="section-title" style="color:#dc2626">⚠️ CAPA เกินกำหนด (${overdueCapa} รายการ)</div>
  <div style="background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:20px;overflow-x:auto">
    <table class="dept-table">
      <thead><tr><th>CAPA ID</th><th>คำอธิบาย</th><th>ผู้รับผิดชอบ</th><th>ครบกำหนด</th></tr></thead>
      <tbody>
      ${capas.filter(c=>c.status!=='closed'&&c.dueDate&&c.dueDate<new Date().toISOString().split('T')[0]).map(c=>`
        <tr>
          <td style="font-weight:700;color:#dc2626">${c.capaId||c.id.slice(0,8)}</td>
          <td>${(c.description||'').slice(0,60)}...</td>
          <td>${c.assignedTo||'—'}</td>
          <td style="color:#dc2626;font-weight:600">${c.dueDate} ⚠️</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>` : ''}`;

  // ── Draw Charts ───────────────────────────────────────────────────────
  const fontFamily = "'Sarabun', sans-serif";
  const baseOptions = { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { font: { family: fontFamily } } } }, scales: {} };

  CHART_INSTANCES.trend = new Chart($('chartTrend'), {
    type: 'line',
    data: { labels: trendLabels, datasets: [{ label: 'จำนวนเหตุการณ์', data: trendVals, borderColor: '#0891b2', backgroundColor: 'rgba(8,145,178,.1)', fill: true, tension: .4, pointRadius: 4, pointBackgroundColor: '#0891b2' }] },
    options: { ...baseOptions, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { family: fontFamily } } }, x: { ticks: { font: { family: fontFamily } } } } },
  });

  if (typeLabels.length > 0) {
    CHART_INSTANCES.type = new Chart($('chartType'), {
      type: 'doughnut',
      data: { labels: typeLabels, datasets: [{ data: typeData, backgroundColor: typeColors.map(c=>c+'cc'), borderColor: typeColors, borderWidth: 2 }] },
      options: { ...baseOptions, plugins: { legend: { position: 'right', labels: { font: { family: fontFamily }, boxWidth: 12 } } } },
    });
  } else { $('chartType').parentElement.innerHTML = '<div class="empty-state">ไม่มีข้อมูลอุบัติเหตุในช่วงนี้</div>'; }

  if (deptLabels.length > 0) {
    CHART_INSTANCES.dept = new Chart($('chartDept'), {
      type: 'bar',
      data: { labels: deptLabels, datasets: [{ label: 'จำนวนเหตุการณ์', data: deptData, backgroundColor: '#0891b2cc', borderColor: '#0891b2', borderWidth: 1.5, borderRadius: 6 }] },
      options: { ...baseOptions, indexAxis: 'y', scales: { x: { beginAtZero: true, ticks: { stepSize: 1, font: { family: fontFamily } } }, y: { ticks: { font: { family: fontFamily, size: 11 } } } } },
    });
  } else { $('chartDept').parentElement.innerHTML = '<div class="empty-state">ไม่มีข้อมูล</div>'; }

  if (Object.values(riskDist).some(v=>v>0)) {
    CHART_INSTANCES.risk = new Chart($('chartRisk'), {
      type: 'doughnut',
      data: {
        labels: ['ต่ำ','ปานกลาง','สูง','สูงมาก'],
        datasets: [{ data: [riskDist.low, riskDist.moderate, riskDist.high, riskDist.extreme], backgroundColor: ['#16a34acc','#d97706cc','#dc2626cc','#7f1d1dcc'], borderColor: ['#16a34a','#d97706','#dc2626','#7f1d1d'], borderWidth: 2 }]
      },
      options: { ...baseOptions, plugins: { legend: { position: 'right', labels: { font: { family: fontFamily }, boxWidth: 12 } } } },
    });
  } else { $('chartRisk').parentElement.innerHTML = '<div class="empty-state">ยังไม่มีการประเมินความเสี่ยง</div>'; }

  const trainLabels2 = Object.keys(trainByType).map(k => k.length > 18 ? k.slice(0,18)+'…' : k);
  const trainVals2   = Object.values(trainByType);
  if (trainLabels2.length > 0) {
    CHART_INSTANCES.train = new Chart($('chartTrain'), {
      type: 'bar',
      data: { labels: trainLabels2, datasets: [{ label: 'ผู้เข้าร่วม (คน)', data: trainVals2, backgroundColor: '#7c3aedcc', borderColor: '#7c3aed', borderWidth: 1.5, borderRadius: 6 }] },
      options: { ...baseOptions, indexAxis: 'y', scales: { x: { beginAtZero: true, ticks: { font: { family: fontFamily } } }, y: { ticks: { font: { family: fontFamily, size: 11 } } } } },
    });
  } else { $('chartTrain').parentElement.innerHTML = '<div class="empty-state">ยังไม่มีข้อมูลการอบรม</div>'; }
}

// ─── AI Insights engine ────────────────────────────────────────────────────
function generateInsights({ incidents, nearMiss, capas, inspections, risks, trainings, equips, legals, drills }) {
  const insights = [];
  const today = new Date().toISOString().split('T')[0];

  // 1. Overdue CAPA
  const overdue = capas.filter(c => c.status !== 'closed' && c.dueDate && c.dueDate < today);
  if (overdue.length > 0) {
    insights.push({ level: 'เร่งด่วน', icon: '🔴', color: '#f87171',
      text: `มี CAPA ค้างเกินกำหนด ${overdue.length} รายการ กรุณาเร่งรัดผู้รับผิดชอบ: ${[...new Set(overdue.map(c=>c.assignedTo).filter(Boolean))].slice(0,3).join(', ')||'ไม่ระบุ'}` });
  }

  // 2. High-risk department
  if (incidents.length > 0) {
    const deptCount = {};
    for (const i of incidents) { const k = i.department||'ไม่ระบุ'; deptCount[k]=(deptCount[k]||0)+1; }
    const topDept = Object.entries(deptCount).sort((a,b)=>b[1]-a[1])[0];
    if (topDept && topDept[1] >= 2) {
      insights.push({ level: 'แจ้งเตือน', icon: '🏭', color: '#fbbf24',
        text: `แผนก ${topDept[0]} มีอุบัติเหตุสูงสุด ${topDept[1]} ครั้ง ควรทบทวน Risk Assessment และมาตรการควบคุมในแผนกนี้` });
    }
  }

  // 3. Near miss spike (near miss > incidents suggests good culture)
  if (nearMiss.length > 0 && incidents.length === 0) {
    insights.push({ level: 'เชิงบวก', icon: '✅', color: '#4ade80',
      text: `ช่วงเวลานี้มีรายงาน Near Miss ${nearMiss.length} ครั้ง แต่ไม่มีอุบัติเหตุ แสดงถึงวัฒนธรรมความปลอดภัยที่ดี ควรส่งเสริมการรายงาน Near Miss ต่อเนื่อง` });
  }

  // 4. Expired equipment
  const expiredEquip = equips.filter(e => e.expiryDate && e.expiryDate < today);
  if (expiredEquip.length > 0) {
    insights.push({ level: 'แจ้งเตือน', icon: '🦺', color: '#fb923c',
      text: `อุปกรณ์ความปลอดภัยหมดอายุ ${expiredEquip.length} รายการ (${expiredEquip.slice(0,3).map(e=>e.name).join(', ')}${expiredEquip.length>3?'...':''}) ควรสั่งซื้อทดแทนทันที` });
  }

  // 5. Legal compliance gap
  const nonCompliant = legals.filter(l => l.complianceStatus === 'non_compliant');
  if (nonCompliant.length > 0) {
    insights.push({ level: 'เร่งด่วน', icon: '⚖️', color: '#f87171',
      text: `พบข้อกำหนดกฎหมายที่ไม่สอดคล้อง ${nonCompliant.length} รายการ: ${nonCompliant.slice(0,2).map(l=>l.lawName).join(', ')} ควรดำเนินการแก้ไขและบันทึกหลักฐาน` });
  }

  // 6. Inspection fail items
  const failItems = inspections.reduce((s,i) => s + (i.failCount||0), 0);
  if (failItems > 5) {
    insights.push({ level: 'คำแนะนำ', icon: '🔍', color: '#60a5fa',
      text: `การตรวจสอบพบรายการ Fail รวม ${failItems} รายการ หากยังไม่ได้สร้าง CAPA ควรดำเนินการแก้ไขและติดตามผล` });
  }

  // 7. High/Extreme risks without controls
  const uncontrolledRisks = risks.filter(r => {
    const l = getRiskLevel((r.likelihood||1)*(r.severity||1));
    return (l.level === 'high' || l.level === 'extreme') && (!r.controls || !Object.values(r.controls).some(Boolean));
  });
  if (uncontrolledRisks.length > 0) {
    insights.push({ level: 'แจ้งเตือน', icon: '⚠️', color: '#fbbf24',
      text: `มีความเสี่ยงระดับสูง/สูงมาก ${uncontrolledRisks.length} รายการ ที่ยังไม่ได้กำหนดมาตรการควบคุม ควรจัดลำดับความสำคัญและดำเนินการ` });
  }

  // 8. No drills this year
  const thisYear = new Date().getFullYear().toString();
  const drillsThisYear = drills.filter(d => d.drillDate?.startsWith(thisYear) && d.status === 'completed');
  if (drillsThisYear.length === 0) {
    insights.push({ level: 'คำแนะนำ', icon: '🚨', color: '#60a5fa',
      text: `ยังไม่มีบันทึกการซ้อมแผนฉุกเฉินในปีนี้ กฎหมายกำหนดให้ต้องซ้อมอย่างน้อยปีละ 1 ครั้ง ควรวางแผนและบันทึก` });
  }

  // 9. Near miss type pattern
  if (nearMiss.length >= 3) {
    const nmTypeCnt = {};
    for (const n of nearMiss) { const k=n.nmType||n.reportType||'unsafe_condition'; nmTypeCnt[k]=(nmTypeCnt[k]||0)+1; }
    const topNm = Object.entries(nmTypeCnt).sort((a,b)=>b[1]-a[1])[0];
    if (topNm && topNm[1] >= 2) {
      const label = topNm[0]==='unsafe_act'?'พฤติกรรมไม่ปลอดภัย':topNm[0]==='unsafe_condition'?'สภาพไม่ปลอดภัย':'เฉียดอุบัติเหตุ';
      insights.push({ level: 'คำแนะนำ', icon: '📌', color: '#60a5fa',
        text: `รายงาน Near Miss ส่วนใหญ่ (${topNm[1]}/${nearMiss.length} ครั้ง) เป็นประเภท "${label}" ควรวิเคราะห์หาสาเหตุรากและออกมาตรการป้องกัน` });
    }
  }

  return insights;
}

// ─── Print PDF ─────────────────────────────────────────────────────────────
async function printReport() {
  const { start, end, incidents, nearMiss, capas, inspections, risks, trainings, legals } = _allData;
  const { label } = periodRange(_period, _customStart, _customEnd);
  const today = new Date().toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' });

  const openCapa = capas.filter(c=>c.status!=='closed').length;
  const overdueCapa = capas.filter(c=>c.status!=='closed'&&c.dueDate&&c.dueDate<new Date().toISOString().split('T')[0]).length;
  const inspPass = inspections.reduce((s,i)=>s+(i.passCount||0),0);
  const inspItems = inspections.reduce((s,i)=>s+((i.passCount||0)+(i.failCount||0)),0);
  const inspPassRate = inspItems>0?Math.round(inspPass/inspItems*100)+'%':'—';
  const legalComp = legals.length>0?Math.round(legals.filter(l=>l.complianceStatus==='compliant').length/legals.filter(l=>l.complianceStatus!=='not_applicable').length*100)+'%':'—';

  const pa = $('printArea');
  pa.style.display = 'block';
  pa.innerHTML = `
  <div class="pr-title">รายงานสรุปสถิติความปลอดภัยในการทำงาน</div>
  <div class="pr-sub">ช่วงเวลา: ${label} &nbsp;|&nbsp; วันที่พิมพ์: ${today}</div>

  <div class="pr-kpi-grid">
    ${[['อุบัติเหตุทั้งหมด',incidents.length,'#dc2626'],['Near Miss / Unsafe',nearMiss.length,'#2563eb'],['CAPA ค้าง (เกิน)',`${openCapa} (${overdueCapa})`,'#d97706'],['Inspection Pass Rate',inspPassRate,'#0891b2'],['การอบรมเสร็จ',trainings.filter(t=>t.status==='completed').length,'#16a34a'],['ความสอดคล้องกฎหมาย',legalComp,'#7c3aed']].map(([l,v,c])=>`
    <div class="pr-kpi-box">
      <div class="pr-kpi-val" style="color:${c}">${v}</div>
      <div class="pr-kpi-lbl">${l}</div>
    </div>`).join('')}
  </div>

  <div class="pr-section">
    <div class="pr-section-title">สรุปอุบัติเหตุ/เหตุการณ์</div>
    <table class="pr-table">
      <thead><tr><th>วันที่</th><th>ประเภท</th><th>แผนก</th><th>สถานที่</th><th>ผู้ได้รับบาดเจ็บ</th><th>สถานะ</th></tr></thead>
      <tbody>
      ${incidents.slice(0,20).map(i=>`<tr><td>${i.incidentDate||'—'}</td><td>${i.incidentType||'—'}</td><td>${i.department||'—'}</td><td>${i.location||'—'}</td><td>${i.injuredPerson||'—'}</td><td>${i.status||'—'}</td></tr>`).join('')}
      ${incidents.length===0?'<tr><td colspan="6" style="text-align:center;color:#999">ไม่มีข้อมูลในช่วงเวลานี้</td></tr>':''}
      </tbody>
    </table>
  </div>

  <div class="pr-section">
    <div class="pr-section-title">CAPA ที่ยังเปิดอยู่</div>
    <table class="pr-table">
      <thead><tr><th>CAPA ID</th><th>รายละเอียด</th><th>ผู้รับผิดชอบ</th><th>ครบกำหนด</th><th>สถานะ</th></tr></thead>
      <tbody>
      ${capas.filter(c=>c.status!=='closed').slice(0,15).map(c=>`<tr><td>${c.capaId||'—'}</td><td>${(c.description||'').slice(0,60)}</td><td>${c.assignedTo||'—'}</td><td>${c.dueDate||'—'}</td><td>${c.status||'—'}</td></tr>`).join('')}
      ${capas.filter(c=>c.status!=='closed').length===0?'<tr><td colspan="5" style="text-align:center;color:#999">ไม่มี CAPA ค้างอยู่</td></tr>':''}
      </tbody>
    </table>
  </div>

  <div class="pr-sign-row">
    ${['จป. วิชาชีพ','ประธาน คปอ.','ผู้บริหาร'].map(n=>`<div class="pr-sign-blk"><div class="pr-sign-line">(...................................)<br>${n}</div></div>`).join('')}
  </div>`;

  window.print();
  setTimeout(() => { pa.style.display = 'none'; pa.innerHTML = ''; }, 1000);
}

// ─── Controls ──────────────────────────────────────────────────────────────
window.__setPeriod = v => {
  _period = v;
  // Update tab buttons
  document.querySelectorAll('.p-btn').forEach(b => b.classList.toggle('active', b.textContent.trim() === {month:'เดือนนี้',q:'ไตรมาสนี้',ytd:'YTD',year:'ปีนี้',lastyear:'ปีที่แล้ว',custom:'กำหนดเอง'}[v]));
  const cr = $('customRange');
  if (cr) cr.style.display = v === 'custom' ? 'flex' : 'none';
  if (v !== 'custom') renderReport();
};

window.__customDate = () => {
  _customStart = $('cStart')?.value;
  _customEnd   = $('cEnd')?.value;
  if (_customStart && _customEnd) renderReport();
};

window.__printReport = printReport;

// ─── Boot ───────────────────────────────────────────────────────────────────
_profile = await requireRole(['safety_officer','kpo','admin','manager']);
renderShell(_profile, 'safety-reports', 'รายงานความปลอดภัย');
buildLayout();
await renderReport();
</script>
</body>
