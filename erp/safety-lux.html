<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>เธ•เธฃเธงเธเธงเธฑเธ”เนเธชเธเธชเธงเนเธฒเธ (Lux) โ€” KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(600px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-bar select,.search-bar input{flex:1;min-width:120px}
.info-row{display:flex;gap:12px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.lux-meter{position:relative;height:28px;border-radius:8px;overflow:hidden;background:#e5e7eb;margin:4px 0}
.lux-bar{height:100%;border-radius:8px;transition:width .5s;display:flex;align-items:center;padding:0 10px;font-size:0.8rem;font-weight:700;color:#fff}
.lux-mark{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.8}
.lux-mark-label{position:absolute;top:-16px;font-size:0.65rem;color:#6b7280;transform:translateX(-50%)}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  LUX_AREA_TYPES, LUX_STATUS, classifyLux,
  listLuxMonitor, getLuxMonitor, createLuxMonitor, updateLuxMonitor, deleteLuxMonitor
} from "./js/safety-data.js";
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-lux', 'เธ•เธฃเธงเธเธงเธฑเธ”เนเธชเธเธชเธงเนเธฒเธ (Lux)');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

let records = [];
let editId  = null;

const MAX_LUX = 2000;

function getStandard(areaType) {
  return LUX_AREA_TYPES.find(a => a.key === areaType)?.standard ?? null;
}

function statusBadge(avgLux, standard) {
  const key = classifyLux(avgLux, standard);
  const st  = LUX_STATUS[key];
  return `<span class="badge" style="color:${st.color};background:${st.bg}">${st.label}</span>`;
}

function luxMeter(avgLux, standard) {
  const pct = Math.min(avgLux / MAX_LUX * 100, 100);
  const key = classifyLux(avgLux, standard);
  const col = key==='compliant' ? '#16a34a' : key==='warning' ? '#d97706' : key==='low' ? '#dc2626' : '#6b7280';
  const stdPct = standard ? Math.min(standard / MAX_LUX * 100, 100) : null;
  return `
  <div style="margin:8px 0">
    <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:2px">
      <span style="color:#6b7280">เธเธงเธฒเธกเธชเธงเนเธฒเธ (Lux)</span>
      <span style="font-weight:800;color:${col}">${avgLux} lux${standard ? ` / เธกเธฒเธ•เธฃเธเธฒเธ ${standard} lux` : ''}</span>
    </div>
    <div class="lux-meter">
      <div class="lux-bar" style="width:${pct}%;background:${col}">${avgLux} lux</div>
      ${stdPct !== null ? `<div class="lux-mark" style="left:${stdPct}%"><div class="lux-mark-label" style="left:0">${standard}</div></div>` : ''}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:0.65rem;color:#9ca3af">
      <span>0</span>${standard ? `<span>${standard}</span>` : ''}<span style="margin-left:auto">${MAX_LUX}</span>
    </div>
  </div>`;
}

async function render() {
  records = await listLuxMonitor();
  const statusFilter = document.getElementById('filter-status')?.value || '';
  const q            = document.getElementById('search-input')?.value.toLowerCase() || '';

  const compliant = records.filter(r => classifyLux(r.avgLux||0, getStandard(r.areaType))==='compliant').length;
  const warning   = records.filter(r => classifyLux(r.avgLux||0, getStandard(r.areaType))==='warning').length;
  const low       = records.filter(r => classifyLux(r.avgLux||0, getStandard(r.areaType))==='low').length;
  const avgLuxAll = records.length ? Math.round(records.reduce((s,r)=>s+(r.avgLux||0),0)/records.length) : 0;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">๐’ก เธ•เธฃเธงเธเธงเธฑเธ”เนเธชเธเธชเธงเนเธฒเธ (Lux)</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ เธเธฑเธเธ—เธถเธเธเธฒเธฃเธงเธฑเธ”</button>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${records.length}</div><div class="kpi-label">เธเธฃเธฑเนเธเธ—เธตเนเธงเธฑเธ”</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${compliant}</div><div class="kpi-label">เธเนเธฒเธเธกเธฒเธ•เธฃเธเธฒเธ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${warning}</div><div class="kpi-label">เนเธเธฅเนเธ•เนเธณเธเธงเนเธฒเธกเธฒเธ•เธฃเธเธฒเธ</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${low}</div><div class="kpi-label">เธ•เนเธณเธเธงเนเธฒเธกเธฒเธ•เธฃเธเธฒเธ</div></div>
    <div class="kpi-card"><div class="kpi-num">${avgLuxAll||'-'}</div><div class="kpi-label">Avg Lux</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="เธเนเธเธซเธฒเธชเธ–เธฒเธเธ—เธตเน, เธเธนเนเธงเธฑเธ”..." oninput="window.__applyFilter()"/>
    <select id="filter-status" onchange="window.__applyFilter()">
      <option value="">เธ—เธธเธเธชเธ–เธฒเธเธฐ</option>
      ${Object.entries(LUX_STATUS).map(([k,v])=>`<option value="${k}" ${statusFilter===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  </div>

  <div id="list-wrap">${renderList(applyFilter(records, q, statusFilter))}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">เธเธฑเธเธ—เธถเธเธเธฒเธฃเธ•เธฃเธงเธเธงเธฑเธ”เนเธชเธเธชเธงเนเธฒเธ</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">โ•</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function applyFilter(list, q, status) {
  return list.filter(r => {
    const matchQ = !q || (r.location||'').toLowerCase().includes(q) || (r.measuredBy||'').toLowerCase().includes(q) || (r.areaType||'').toLowerCase().includes(q);
    const st = classifyLux(r.avgLux||0, getStandard(r.areaType));
    return matchQ && (!status || st===status);
  });
}

window.__applyFilter = () => {
  const q = document.getElementById('search-input')?.value.toLowerCase()||'';
  const s = document.getElementById('filter-status')?.value||'';
  document.getElementById('list-wrap').innerHTML = renderList(applyFilter(records, q, s));
};

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">เธขเธฑเธเนเธกเนเธกเธตเธเนเธญเธกเธนเธฅเธเธฒเธฃเธงเธฑเธ”</p>`;
  return list.map(r => {
    const area     = LUX_AREA_TYPES.find(a=>a.key===r.areaType);
    const standard = area?.standard ?? null;
    const lux      = r.avgLux||0;
    return `
    <div class="card" onclick="window.__openView('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:0.95rem">๐’ก ${esc(r.location||'-')}</div>
          <div class="info-row">
            <span>${area?.label||'-'}</span>
            <span>๐“… ${fmtDate(r.measureDate)}</span>
            <span>๐‘ค ${esc(r.measuredBy||'-')}</span>
          </div>
          ${luxMeter(lux, standard)}
        </div>
        <div>${statusBadge(lux, standard)}</div>
      </div>
    </div>`;
  }).join('');
}

// โ”€โ”€ view โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€
window.__openView = async (id) => {
  editId = id;
  const r = await getLuxMonitor(id);
  if (!r) return;
  const area     = LUX_AREA_TYPES.find(a=>a.key===r.areaType);
  const standard = area?.standard ?? null;
  openPanel('เธฃเธฒเธขเธฅเธฐเน€เธญเธตเธขเธ”เธเธฒเธฃเธงเธฑเธ”เนเธชเธเธชเธงเนเธฒเธ');
  document.getElementById('panel-body').innerHTML = `
    <div style="text-align:center;margin-bottom:16px">
      <div style="font-size:2rem">๐’ก</div>
      <div style="font-weight:800;font-size:1rem">${esc(r.location||'-')}</div>
      <div style="font-size:0.82rem;color:#6b7280">${area?.label||'-'} ยท ${fmtDate(r.measureDate)}</div>
    </div>
    ${luxMeter(r.avgLux||0, standard)}
    <div class="form-row" style="margin-top:12px">
      <div><div class="lbl" style="margin-top:0">เธเนเธฒเนเธชเธเน€เธเธฅเธตเนเธข (Avg)</div><div style="font-weight:700">${r.avgLux||'-'} lux</div></div>
      <div><div class="lbl" style="margin-top:0">เธกเธฒเธ•เธฃเธเธฒเธเธ—เธตเนเธเธณเธซเธเธ”</div><div style="font-weight:700">${standard ? standard+' lux' : 'เนเธกเนเธกเธตเธเนเธฒเธกเธฒเธ•เธฃเธเธฒเธ'}</div></div>
      <div><div class="lbl">เธเนเธฒเธ•เนเธณเธชเธธเธ” (Min)</div><div style="font-weight:700">${r.minLux??'-'} lux</div></div>
      <div><div class="lbl">เธเนเธฒเธชเธนเธเธชเธธเธ” (Max)</div><div style="font-weight:700">${r.maxLux??'-'} lux</div></div>
      <div><div class="lbl">เธเธนเนเธ•เธฃเธงเธเธงเธฑเธ”</div><div>${esc(r.measuredBy||'-')}</div></div>
      <div><div class="lbl">เน€เธเธฃเธทเนเธญเธเธกเธทเธญเธ—เธตเนเนเธเน</div><div>${esc(r.instrument||'-')}</div></div>
      <div><div class="lbl">Serial No. / เธฃเธธเนเธ</div><div>${esc(r.instrumentSN||'-')}</div></div>
      <div><div class="lbl">เธงเธฑเธเธซเธกเธ”เธญเธฒเธขเธธเธชเธญเธเน€เธ—เธตเธขเธ</div><div>${fmtDate(r.calExpiry)}</div></div>
    </div>
    ${r.correctedActions ? `<div style="margin-top:10px"><div class="lbl" style="margin-top:0">เธกเธฒเธ•เธฃเธเธฒเธฃเนเธเนเนเธ</div><div style="font-size:0.85rem">${esc(r.correctedActions)}</div></div>` : ''}
    ${r.remarks ? `<div style="margin-top:8px"><div class="lbl" style="margin-top:0">เธซเธกเธฒเธขเน€เธซเธ•เธธ</div><div style="font-size:0.85rem">${esc(r.remarks)}</div></div>` : ''}`;
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-ghost" onclick="window.__editRecord('${id}')">เนเธเนเนเธ</button>
     <button class="btn btn-danger" onclick="window.__del('${id}')">เธฅเธ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">เธเธดเธ”</button>`;
};

// โ”€โ”€ form โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€โ”€
window.__openPanel = (id) => {
  editId = id;
  openPanel(id ? 'เนเธเนเนเธเธเธฑเธเธ—เธถเธเธเธฒเธฃเธงเธฑเธ”' : 'เธเธฑเธเธ—เธถเธเธเธฒเธฃเธงเธฑเธ”เนเธชเธเธชเธงเนเธฒเธ');
  document.getElementById('panel-body').innerHTML = renderForm(null);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">เธเธฑเธเธ—เธถเธ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">เธขเธเน€เธฅเธดเธ</button>`;
};

window.__editRecord = async (id) => {
  editId = id;
  const r = await getLuxMonitor(id);
  if (!r) return;
  openPanel('เนเธเนเนเธเธเธฑเธเธ—เธถเธเธเธฒเธฃเธงเธฑเธ”');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">เธเธฑเธเธ—เธถเธ</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">เธขเธเน€เธฅเธดเธ</button>`;
};

function renderForm(r) {
  return `
  <div class="form-row">
    <div>
      <label class="lbl" style="margin-top:0">เธเธฃเธฐเน€เธ เธ—เธเธทเนเธเธ—เธตเน *</label>
      <select id="f-area" onchange="window.__previewLux()">
        <option value="">-- เน€เธฅเธทเธญเธเธเธทเนเธเธ—เธตเน --</option>
        ${LUX_AREA_TYPES.map(a=>`<option value="${a.key}" ${r?.areaType===a.key?'selected':''}>${a.label}${a.standard?' (โฅ'+a.standard+' lux)':''}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl" style="margin-top:0">เธเธทเนเธญเธชเธ–เธฒเธเธ—เธตเน/เธเธธเธ”เธงเธฑเธ” *</label>
      <input id="f-loc" value="${esc(r?.location||'')}" placeholder="เน€เธเนเธ เธซเนเธญเธเธเธงเธเธเธธเธกเธเธฅเธดเธ•, เนเธฅเธเน 1"/>
    </div>
    <div>
      <label class="lbl">เธงเธฑเธเธ—เธตเนเธ•เธฃเธงเธเธงเธฑเธ” *</label>
      <input id="f-date" type="date" value="${r?.measureDate||new Date().toISOString().slice(0,10)}"/>
    </div>
    <div>
      <label class="lbl">เธเธนเนเธ•เธฃเธงเธเธงเธฑเธ” *</label>
      <input id="f-by" value="${esc(r?.measuredBy||profile.displayName||'')}"/>
    </div>
    <div>
      <label class="lbl">เธเนเธฒเนเธชเธเน€เธเธฅเธตเนเธข Avg (lux) *</label>
      <input id="f-avg" type="number" step="1" min="0" value="${r?.avgLux||''}" placeholder="เน€เธเนเธ 350"
             oninput="window.__previewLux()"/>
    </div>
    <div>
      <label class="lbl">เธเนเธฒเธ•เนเธณเธชเธธเธ” Min (lux)</label>
      <input id="f-min" type="number" step="1" min="0" value="${r?.minLux||''}"/>
    </div>
    <div>
      <label class="lbl">เธเนเธฒเธชเธนเธเธชเธธเธ” Max (lux)</label>
      <input id="f-max" type="number" step="1" min="0" value="${r?.maxLux||''}"/>
    </div>
    <div>
      <label class="lbl">เน€เธเธฃเธทเนเธญเธเธกเธทเธญเธ—เธตเนเนเธเนเธงเธฑเธ”</label>
      <input id="f-instr" value="${esc(r?.instrument||'')}" placeholder="เน€เธเนเธ Lux Meter เธฃเธธเนเธ XYZ"/>
    </div>
    <div>
      <label class="lbl">Serial No. / เธฃเธธเนเธ</label>
      <input id="f-sn" value="${esc(r?.instrumentSN||'')}"/>
    </div>
    <div>
      <label class="lbl">เธงเธฑเธเธซเธกเธ”เธญเธฒเธขเธธเธชเธญเธเน€เธ—เธตเธขเธ</label>
      <input id="f-cal" type="date" value="${r?.calExpiry||''}"/>
    </div>
  </div>
  <div id="lux-preview"></div>
  <div>
    <label class="lbl">เธกเธฒเธ•เธฃเธเธฒเธฃเนเธเนเนเธ (เธ–เนเธฒเธ•เนเธณเธเธงเนเธฒเธกเธฒเธ•เธฃเธเธฒเธ)</label>
    <textarea id="f-action">${esc(r?.correctedActions||'')}</textarea>
  </div>
  <div>
    <label class="lbl">เธซเธกเธฒเธขเน€เธซเธ•เธธ</label>
    <textarea id="f-remarks">${esc(r?.remarks||'')}</textarea>
  </div>`;
}

window.__previewLux = () => {
  const v   = parseFloat(document.getElementById('f-avg')?.value);
  const key = document.getElementById('f-area')?.value;
  const std = getStandard(key);
  if (!isNaN(v) && v > 0) {
    document.getElementById('lux-preview').innerHTML = luxMeter(v, std);
  }
};

window.__save = async () => {
  const areaType   = document.getElementById('f-area')?.value;
  const location   = document.getElementById('f-loc')?.value.trim();
  const avgLux     = parseFloat(document.getElementById('f-avg')?.value);
  const measuredBy = document.getElementById('f-by')?.value.trim();
  const measureDate = document.getElementById('f-date')?.value;
  if (!areaType || !location || isNaN(avgLux) || !measuredBy || !measureDate) {
    alert('เธเธฃเธธเธ“เธฒเธเธฃเธญเธเธเนเธญเธกเธนเธฅเธ—เธตเนเธเธณเน€เธเนเธ: เธเธทเนเธเธ—เธตเน, เธชเธ–เธฒเธเธ—เธตเน, เธเนเธฒ Avg Lux, เธเธนเนเธ•เธฃเธงเธเธงเธฑเธ”, เธงเธฑเธเธ—เธตเน');
    return;
  }
  const standard = getStandard(areaType);
  const data = {
    areaType, location, avgLux, measuredBy, measureDate,
    minLux:           parseFloat(document.getElementById('f-min')?.value)||null,
    maxLux:           parseFloat(document.getElementById('f-max')?.value)||null,
    instrument:       document.getElementById('f-instr')?.value.trim()||'',
    instrumentSN:     document.getElementById('f-sn')?.value.trim()||'',
    calExpiry:        document.getElementById('f-cal')?.value||'',
    correctedActions: document.getElementById('f-action')?.value.trim()||'',
    remarks:          document.getElementById('f-remarks')?.value.trim()||'',
    luxStatus:        classifyLux(avgLux, standard),
  };
  try {
    if (editId) await updateLuxMonitor(editId, data);
    else await createLuxMonitor(data, profile.uid);
    window.__closePanel(); await render();
  } catch(e) { alert('เธเธฑเธเธ—เธถเธเนเธกเนเธชเธณเน€เธฃเนเธ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('เธขเธทเธเธขเธฑเธเธฅเธเธเธฑเธเธ—เธถเธเธเธตเน?')) return;
  await deleteLuxMonitor(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
