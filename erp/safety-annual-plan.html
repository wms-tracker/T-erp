<!DOCTYPE html>
<html lang="th">
<head>

<title>เนเธเธเธเธงเธฒเธกเธเธฅเธญเธ”เธ เธฑเธขเธเธฃเธฐเธเธณเธเธต</title>
<link rel="stylesheet" href="css/style.css"/>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.toolbar input{flex:1;min-width:140px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
/* View toggle */
.view-toggle{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:8px}
.view-btn{padding:5px 12px;border:none;background:none;border-radius:6px;font-size:.82rem;cursor:pointer;color:#6b7280;font-family:inherit}
.view-btn.active{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* Table */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f1f5f9;padding:9px 12px;text-align:left;font-size:.8rem;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}

/* Gantt */
.gantt-wrap{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.07);overflow-x:auto;margin-bottom:20px}
.gantt-table{border-collapse:collapse;min-width:900px;width:100%}
.gantt-table th{background:#f1f5f9;padding:8px 10px;font-size:.78rem;color:#475569;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.gantt-table td{padding:7px 10px;font-size:.82rem;border-bottom:1px solid #f8fafc;vertical-align:middle}
.gantt-table tr:hover td{background:#f8fafc}
.gantt-cell{text-align:center}
.gantt-block{display:inline-block;width:28px;height:20px;border-radius:4px;cursor:default}
.gantt-block.planned{background:#bfdbfe}
.gantt-block.completed{background:#bbf7d0}
.gantt-block.delayed{background:#fde68a}
.gantt-block.in_progress{background:#a5b4fc}
.gantt-block.cancelled{background:#fca5a5}
.gantt-month-head{background:#e2e8f0!important}
/* Progress bar */
.prog-wrap{background:#e2e8f0;border-radius:4px;height:7px;overflow:hidden;margin-top:4px}
.prog-bar{height:100%;border-radius:4px;background:var(--c-primary);transition:width .4s}
/* Panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:70px}
.month-checks{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:4px}
.month-check{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;font-size:.75rem;color:#475569;transition:all .15s}
.month-check input{width:14px;height:14px;cursor:pointer}
.month-check.checked{background:#ecfdf5;border-color:#059669;color:#059669;font-weight:600}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.cat-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.77rem;font-weight:600}
/* เธเธเธญ Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:950;overflow-y:auto;padding:20px}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal-box{background:#fff;border-radius:14px;width:min(760px,100%);box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;background:linear-gradient(135deg,#064e3b,#065f46)}
.modal-head h2{font-size:1rem;font-weight:700;color:#fff}
.modal-body{padding:22px}
.btn-green{background:#059669;color:#fff}
.btn-print{background:#1e40af;color:#fff}
/* Print doc preview */
.print-doc{display:none;padding:28px;font-family:'Sarabun',sans-serif;color:#000}
.print-doc.show{display:block}
.doc-header{text-align:center;margin-bottom:16px;border-bottom:2px solid #000;padding-bottom:12px}
.doc-header h1{font-size:16pt;font-weight:700;margin-bottom:4px}
.doc-header p{font-size:11pt;margin:2px 0}
.doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-bottom:14px;font-size:10pt}
.doc-meta .dm-row{display:flex;gap:6px}
.doc-meta .dm-k{color:#333;min-width:160px;font-weight:600}
.doc-plan-table{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:16px}
.doc-plan-table th,.doc-plan-table td{border:1px solid #000;padding:4px 6px;vertical-align:middle}
.doc-plan-table th{background:#d1fae5;text-align:center;font-weight:700}

.doc-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:20px;font-size:10pt}
.doc-sign .sign-box{text-align:center;padding:8px}
.sign-line{border-top:1px solid #000;margin-top:40px;margin-bottom:4px}
/* @media print hides UI */
@media print{
  body > *{display:none!important}
  #print-frame{display:block!important;position:fixed;inset:0;z-index:9999;background:#fff;overflow:visible}
}
#print-frame{display:none}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  APLAN_CATEGORIES, APLAN_STATUS, APLAN_QUARTERS, APLAN_MONTHS_TH, KPO_DUTIES,
  listAnnualPlan, getAnnualPlan, createAnnualPlan, updateAnnualPlan, deleteAnnualPlan,
} from './js/safety-data.js';

const profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(profile, 'safety-annual-plan', 'เนเธเธเธเธงเธฒเธกเธเธฅเธญเธ”เธ เธฑเธขเธเธฃเธฐเธเธณเธเธต');

const THIS_YEAR = new Date().getFullYear() + 543; // เธ.เธจ.
const YEARS = [THIS_YEAR, THIS_YEAR-1, THIS_YEAR+1];

let allRecs  = [];
let editId   = null;
let viewMode = 'list'; // 'list' | 'gantt'
let selYear  = THIS_YEAR;

// โ”€โ”€ KPI โ”€โ”€
function renderKPI(recs) {
  const total = recs.length;
  const done  = recs.filter(r=>r.status==='completed').length;
  const prog  = recs.filter(r=>r.status==='in_progress').length;
  const delay = recs.filter(r=>r.status==='delayed').length;
  const cancel= recs.filter(r=>r.status==='cancelled').length;
  const pct   = total ? Math.round(done/total*100) : 0;
  const totalBudget = recs.reduce((s,r)=>s+(r.budget||0),0);
  const usedBudget  = recs.filter(r=>r.status==='completed').reduce((s,r)=>s+(r.budget||0),0);
  return `<div class="kpi-row">
    <div class="kpi"><div class="num">${total}</div><div class="lbl">เธเธดเธเธเธฃเธฃเธกเธ—เธฑเนเธเธซเธกเธ”</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${done}</div><div class="lbl">โ… เน€เธชเธฃเนเธเธชเธดเนเธ</div></div>
    <div class="kpi" style="border-color:#2563eb"><div class="num" style="color:#2563eb">${prog}</div><div class="lbl">๐” เธเธณเธฅเธฑเธเธ”เธณเน€เธเธดเธเธเธฒเธฃ</div></div>
    <div class="kpi" style="border-color:#d97706"><div class="num" style="color:#d97706">${delay}</div><div class="lbl">โ ๏ธ เธฅเนเธฒเธเนเธฒ</div></div>
    <div class="kpi" style="border-color:#dc2626"><div class="num" style="color:#dc2626">${cancel}</div><div class="lbl">โ เธขเธเน€เธฅเธดเธ</div></div>
    <div class="kpi" style="border-color:#059669">
      <div class="num" style="color:#059669">${pct}%</div>
      <div class="lbl">เธเธงเธฒเธกเธชเธณเน€เธฃเนเธ</div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
    </div>
    <div class="kpi" style="border-color:#7c3aed">
      <div class="num" style="color:#7c3aed;font-size:1rem">${totalBudget.toLocaleString()}</div>
      <div class="lbl">เธเธเธฃเธงเธก (เธเธฒเธ—)</div>
    </div>
  </div>`;
}

// โ”€โ”€ List Table โ”€โ”€
function renderTable(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon">๐“…</div><p>เธขเธฑเธเนเธกเนเธกเธตเนเธเธเธเธฒเธ</p></div>`;
  const rows = recs.map(r => {
    const cat = APLAN_CATEGORIES.find(c=>c.key===r.category)||{icon:'๐”–',label:r.category||'โ€”',color:'#6b7280',bg:'#f3f4f6'};
    const st  = APLAN_STATUS[r.status]||APLAN_STATUS.planned;
    const months = (r.planMonths||[]).map(m=>APLAN_MONTHS_TH[m-1]).join(', ');
    return `<tr>
      <td><strong>${r.activityName||'โ€”'}</strong><br/><span style="font-size:.74rem;color:#6b7280">${r.responsible||'โ€”'}</span></td>
      <td><span class="cat-chip" style="color:${cat.color};background:${cat.bg}">${cat.icon} ${cat.label}</span></td>
      <td style="font-size:.8rem">${months||'โ€”'}</td>
      <td style="text-align:right;font-size:.82rem">${(r.budget||0).toLocaleString()}</td>
      <td><span class="badge" style="color:${st.color};background:${st.bg}">${st.label}</span></td>
      <td style="font-size:.82rem;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.notes||'โ€”'}</td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="window.__editPlan('${r.id}')">เนเธเนเนเธ</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deletePlan('${r.id}','${(r.activityName||'').replace(/'/g,"\\'")}')">เธฅเธ</button>
      </td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>เธเธดเธเธเธฃเธฃเธก / เธเธนเนเธฃเธฑเธเธเธดเธ”เธเธญเธ</th><th>เธซเธกเธงเธ”เธซเธกเธนเน</th><th>เน€เธ”เธทเธญเธเธ—เธตเนเธงเธฒเธเนเธเธ</th>
      <th style="text-align:right">เธเธเธเธฃเธฐเธกเธฒเธ“ (เธฟ)</th><th>เธชเธ–เธฒเธเธฐ</th><th>เธซเธกเธฒเธขเน€เธซเธ•เธธ</th><th>เธเธฑเธ”เธเธฒเธฃ</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// โ”€โ”€ Gantt View โ”€โ”€
function renderGantt(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon">๐“…</div><p>เธขเธฑเธเนเธกเนเธกเธตเนเธเธเธเธฒเธ</p></div>`;
  // group by quarter
  const monthHeads = APLAN_MONTHS_TH.map((m,i)=>`<th class="gantt-cell gantt-month-head" style="min-width:38px">${m}</th>`).join('');
  const rows = recs.map(r => {
    const cat = APLAN_CATEGORIES.find(c=>c.key===r.category)||{icon:'๐”–',label:'',color:'#6b7280',bg:'#f3f4f6'};
    const st  = r.status||'planned';
    const cells = Array.from({length:12},(_,i)=>{
      const mo = i+1;
      const planned = (r.planMonths||[]).includes(mo);
      if (!planned) return `<td class="gantt-cell"></td>`;
      return `<td class="gantt-cell"><div class="gantt-block ${st}" title="${APLAN_STATUS[st]?.label||st}"></div></td>`;
    }).join('');
    return `<tr>
      <td style="min-width:200px;white-space:nowrap"><span style="color:${cat.color}">${cat.icon}</span> ${r.activityName||'โ€”'}</td>
      <td style="white-space:nowrap;font-size:.78rem;color:#6b7280">${r.responsible||'โ€”'}</td>
      ${cells}
    </tr>`;
  }).join('');
  // legend
  const legend = Object.entries(APLAN_STATUS).map(([k,v])=>
    `<span style="display:inline-flex;align-items:center;gap:4px;font-size:.75rem;margin-right:10px">
      <span style="display:inline-block;width:14px;height:14px;border-radius:3px;background:${k==='planned'?'#bfdbfe':k==='completed'?'#bbf7d0':k==='delayed'?'#fde68a':k==='in_progress'?'#a5b4fc':'#fca5a5'}"></span>
      ${v.label}
    </span>`
  ).join('');
  return `<div class="gantt-wrap">
    <div style="padding:10px 14px;border-bottom:1px solid #e2e8f0;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <strong style="font-size:.85rem">Gantt Chart เธเธต ${selYear}</strong>
      <span style="margin-left:auto">${legend}</span>
    </div>
    <div style="overflow-x:auto">
    <table class="gantt-table">
      <thead><tr>
        <th style="min-width:200px">เธเธดเธเธเธฃเธฃเธก</th><th style="min-width:100px">เธเธนเนเธฃเธฑเธเธเธดเธ”เธเธญเธ</th>
        ${monthHeads}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
  </div>`;
}

// โ”€โ”€ Form โ”€โ”€
function renderForm(rec) {
  const catOpts = APLAN_CATEGORIES.map(c=>`<option value="${c.key}" ${rec?.category===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('');
  const stOpts  = Object.entries(APLAN_STATUS).map(([k,v])=>`<option value="${k}" ${(rec?.status||'planned')===k?'selected':''}>${v.label}</option>`).join('');
  const yrOpts  = YEARS.map(y=>`<option value="${y}" ${(rec?.planYear||THIS_YEAR)===y?'selected':''}>${y}</option>`).join('');
  const selMonths = rec?.planMonths||[];
  const monthChecks = APLAN_MONTHS_TH.map((m,i)=>{
    const mo = i+1;
    const chk = selMonths.includes(mo);
    return `<label class="month-check${chk?' checked':''}" id="mc-${mo}">
      <input type="checkbox" value="${mo}" ${chk?'checked':''} onchange="window.__toggleMonth(${mo},this.checked)"/>
      ${m}
    </label>`;
  }).join('');
  const dutyOpts = `<option value="">-- เนเธกเนเธฃเธฐเธเธธ --</option>` +
    KPO_DUTIES.map(d=>`<option value="${d.key}" ${rec?.kpoDuty===d.key?'selected':''}>${d.icon} เธเนเธญ ${d.no}: ${d.short}</option>`).join('');
  return `<form id="plan-form" onsubmit="return false">
    <div class="form-row one">
      <div class="form-group"><label>เธเธทเนเธญเธเธดเธเธเธฃเธฃเธก / เนเธเธฃเธเธเธฒเธฃ *</label>
        <input id="f-activityName" value="${rec?.activityName||''}" placeholder="เน€เธเนเธ เธเธถเธเธญเธเธฃเธกเธเธฒเธฃเธ”เธฑเธเน€เธเธฅเธดเธเธเธฑเนเธเธ•เนเธ" required/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>เธซเธเนเธฒเธ—เธตเน เธเธเธญ. (12 เธซเธเนเธฒเธ—เธตเน)</label>
        <select id="f-kpoDuty">${dutyOpts}</select></div>
      <div class="form-group"><label>เธซเธกเธงเธ”เธซเธกเธนเนเธเธดเธเธเธฃเธฃเธก</label>
        <select id="f-category">${catOpts}</select></div>
    </div>
    <div class="form-row three">
      <div class="form-group"><label>เธเธตเนเธเธ (เธ.เธจ.)</label>
        <select id="f-planYear">${yrOpts}</select></div>
      <div class="form-group"><label>เธชเธ–เธฒเธเธฐ</label>
        <select id="f-status">${stOpts}</select></div>
      <div class="form-group"><label>&nbsp;</label><div style="font-size:.75rem;color:#6b7280;padding-top:8px">เน€เธเธทเนเธญเธกเธเธฑเธเธซเธเนเธฒเธ—เธตเนเธ•เธฒเธกเธเธเธซเธกเธฒเธข</div></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>เธเธนเนเธฃเธฑเธเธเธดเธ”เธเธญเธ</label>
        <input id="f-responsible" value="${rec?.responsible||''}" placeholder="เธเธทเนเธญ / เนเธเธเธ"/></div>
      <div class="form-group"><label>เธเธเธเธฃเธฐเธกเธฒเธ“ (เธเธฒเธ—)</label>
        <input id="f-budget" type="number" min="0" value="${rec?.budget||0}"/></div>
    </div>
    <div class="form-group" style="margin-bottom:14px">
      <label>เน€เธ”เธทเธญเธเธ—เธตเนเธงเธฒเธเนเธเธเธ”เธณเน€เธเธดเธเธเธฒเธฃ (เน€เธฅเธทเธญเธเนเธ”เนเธซเธฅเธฒเธขเน€เธ”เธทเธญเธ)</label>
      <div class="month-checks" id="month-checks-wrap">${monthChecks}</div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>เธงเธฑเธ•เธ–เธธเธเธฃเธฐเธชเธเธเน / เน€เธซเธ•เธธเธเธฅ</label>
        <textarea id="f-objective" rows="2" placeholder="เธงเธฑเธ•เธ–เธธเธเธฃเธฐเธชเธเธเนเธเธญเธเธเธดเธเธเธฃเธฃเธกเธเธตเน">${rec?.objective||''}</textarea></div>
