<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>สอบสวนอุบัติเหตุ (RCA) — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:60px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-success{background:#16a34a;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-column:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-bar select,.search-bar input{flex:1;min-width:120px}
.info-row{display:flex;gap:12px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.why-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.why-num{width:24px;height:24px;border-radius:50%;background:#1a237e;color:#fff;font-size:0.75rem;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:10px}
.cause-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:0.78rem;cursor:pointer;border:2px solid transparent;margin:2px;transition:all .15s}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  INVESTIG_METHODS, ROOT_CAUSE_CATEGORIES, INVESTIG_STATUS,
  listIncidentInvestig, getIncidentInvestig, createIncidentInvestig,
  updateIncidentInvestig, deleteIncidentInvestig
} from "./js/safety-data.js";

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-investigation', 'สอบสวนอุบัติเหตุ (RCA)');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

let records  = [];
let editId   = null;
let selMethod= '';
let selCauses= new Set();

function statusBadge(st) {
  const s = INVESTIG_STATUS[st] || INVESTIG_STATUS.open;
  return `<span class="badge" style="color:${s.color};background:${s.bg}">${s.label}</span>`;
}

async function render() {
  records = await listIncidentInvestig();
  const statusFilter = document.getElementById('filter-status')?.value || '';
  const q = document.getElementById('search-input')?.value.toLowerCase() || '';
  const open = records.filter(r=>r.status==='open').length;
  const inProg = records.filter(r=>r.status==='in_progress').length;
  const done = records.filter(r=>r.status==='completed'||r.status==='closed').length;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">🔎 สอบสวนอุบัติเหตุ (RCA)</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ เปิดการสอบสวน</button>
  </div>
  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${records.length}</div><div class="kpi-label">ทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${open}</div><div class="kpi-label">เปิดใหม่</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#2563eb">${inProg}</div><div class="kpi-label">กำลังสอบสวน</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${done}</div><div class="kpi-label">เสร็จสิ้น</div></div>
  </div>
  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาเหตุการณ์, สถานที่..." oninput="window.__applyFilter()"/>
    <select id="filter-status" onchange="window.__applyFilter()">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(INVESTIG_STATUS).map(([k,v])=>`<option value="${k}" ${statusFilter===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  </div>
  <div id="list-wrap">${renderList(applyFilter(records, q, statusFilter))}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">สอบสวนอุบัติเหตุ</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function applyFilter(list, q, status) {
  return list.filter(r => {
    const matchQ = !q || (r.incidentDesc||'').toLowerCase().includes(q) || (r.location||'').toLowerCase().includes(q) || (r.investigatedBy||'').toLowerCase().includes(q);
    return matchQ && (!status || r.status===status);
  });
}
window.__applyFilter = () => {
  const q = document.getElementById('search-input')?.value.toLowerCase()||'';
  const s = document.getElementById('filter-status')?.value||'';
  document.getElementById('list-wrap').innerHTML = renderList(applyFilter(records, q, s));
};

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ยังไม่มีรายการสอบสวน</p>`;
  return list.map(r => {
    const method = INVESTIG_METHODS.find(m=>m.key===r.method);
    const causes = (r.rootCauseCategories||[]).map(k=>{
      const c = ROOT_CAUSE_CATEGORIES.find(rc=>rc.key===k);
      return c ? `<span style="font-size:0.72rem;padding:1px 6px;border-radius:8px;background:${c.color}18;color:${c.color};font-weight:600">${c.icon} ${c.label.split(' (')[0]}</span>` : '';
    }).join(' ');
    return `
    <div class="card" onclick="window.__openView('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:0.95rem">${esc(r.incidentDesc||'-')}</div>
          <div class="info-row">
            <span>📍 ${esc(r.location||'-')}</span>
            <span>📅 ${fmtDate(r.incidentDate)}</span>
            <span>👤 ${esc(r.investigatedBy||'-')}</span>
            ${method ? `<span>${method.icon} ${method.label.split(' (')[0].split(' ')[0]}</span>` : ''}
          </div>
          ${causes ? `<div style="margin-top:5px">${causes}</div>` : ''}
        </div>
        ${statusBadge(r.status)}
      </div>
    </div>`;
  }).join('');
}

// ── view ──────────────────────────────────────────────────────────────────────
window.__openView = async (id) => {
  editId = id;
  const r = await getIncidentInvestig(id);
  if (!r) return;
  const method = INVESTIG_METHODS.find(m=>m.key===r.method);
  openPanel('รายละเอียดการสอบสวน');

  const whyRows = (r.fiveWhys||[]).map((w,i)=>
    `<div style="display:flex;gap:10px;margin-bottom:6px">
       <div class="why-num">${i+1}</div>
       <div style="flex:1;padding:8px 10px;background:#f9fafb;border-radius:7px;font-size:0.85rem">${esc(w||'(ยังไม่ระบุ)')}</div>
     </div>`).join('');

  document.getElementById('panel-body').innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-weight:800;font-size:1rem">${esc(r.incidentDesc||'-')}</div>
      <div style="font-size:0.82rem;color:#6b7280;margin-top:4px">📍 ${esc(r.location||'-')} · 📅 ${fmtDate(r.incidentDate)}</div>
      <div style="margin-top:6px">${statusBadge(r.status)}</div>
    </div>
    <div class="form-row">
      <div><div class="lbl" style="margin-top:0">ผู้สอบสวน</div><div>${esc(r.investigatedBy||'-')}</div></div>
      <div><div class="lbl" style="margin-top:0">วิธีการวิเคราะห์</div><div>${method?method.icon+' '+method.label:'-'}</div></div>
      <div><div class="lbl">วันที่เปิดสอบสวน</div><div>${fmtDate(r.openedAt)}</div></div>
      <div><div class="lbl">วันที่กำหนดแล้วเสร็จ</div><div>${fmtDate(r.targetDate)}</div></div>
    </div>
    ${r.immediateActions ? `<div style="margin-top:10px"><div class="lbl" style="margin-top:0">การแก้ไขเฉพาะหน้า</div><div style="font-size:0.85rem">${esc(r.immediateActions)}</div></div>` : ''}
    ${r.rootCauseCategories?.length ? `
    <div class="section-title">หมวดสาเหตุราก</div>
    <div>${r.rootCauseCategories.map(k=>{const c=ROOT_CAUSE_CATEGORIES.find(rc=>rc.key===k);return c?`<span style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;background:${c.color}18;color:${c.color};font-weight:600;font-size:0.82rem;margin:2px">${c.icon} ${c.label}</span>`:''}).join('')}</div>` : ''}
    ${r.rootCauseDesc ? `<div style="margin-top:10px"><div class="lbl" style="margin-top:0">สาเหตุรากที่แท้จริง</div><div style="font-size:0.85rem">${esc(r.rootCauseDesc)}</div></div>` : ''}
    ${r.fiveWhys?.length ? `<div class="section-title">5-Why Analysis</div>${whyRows}` : ''}
    ${r.correctiveActions ? `<div style="margin-top:10px"><div class="lbl" style="margin-top:0">มาตรการแก้ไขถาวร</div><div style="font-size:0.85rem">${esc(r.correctiveActions)}</div></div>` : ''}
    ${r.preventiveActions ? `<div style="margin-top:8px"><div class="lbl" style="margin-top:0">มาตรการป้องกัน</div><div style="font-size:0.85rem">${esc(r.preventiveActions)}</div></div>` : ''}
    ${r.lessonLearned ? `<div style="margin-top:8px;padding:10px;background:#fef9c3;border-radius:8px"><div class="lbl" style="margin-top:0;color:#854d0e">💡 Lesson Learned</div><div style="font-size:0.85rem">${esc(r.lessonLearned)}</div></div>` : ''}`;

  const footer = document.getElementById('panel-footer');
  const btns = [`<button class="btn btn-ghost" onclick="window.__editRecord('${id}')">แก้ไข</button>`];
  if (r.status==='open')        btns.unshift(`<button class="btn btn-primary" onclick="window.__progress('${id}','in_progress')">เริ่มสอบสวน</button>`);
  if (r.status==='in_progress') btns.unshift(`<button class="btn btn-success" onclick="window.__progress('${id}','completed')">ปิดการสอบสวน</button>`);
  if (r.status==='completed')   btns.unshift(`<button class="btn btn-ghost" onclick="window.__progress('${id}','closed')">ปิดถาวร</button>`);
  btns.push(`<button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>`);
  btns.push(`<button class="btn btn-ghost" onclick="window.__closePanel()">ปิด</button>`);
  footer.innerHTML = btns.join('');
};

// ── form ──────────────────────────────────────────────────────────────────────
window.__openPanel = (id) => {
  editId   = id;
  selMethod= '';
  selCauses= new Set();
  openPanel(id ? 'แก้ไขการสอบสวน' : 'เปิดการสอบสวน');
  document.getElementById('panel-body').innerHTML = renderForm(null);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

window.__editRecord = async (id) => {
  editId = id;
  const r = await getIncidentInvestig(id);
  if (!r) return;
  selMethod = r.method||'';
  selCauses = new Set(r.rootCauseCategories||[]);
  openPanel('แก้ไขการสอบสวน');
  document.getElementById('panel-body').innerHTML = renderForm(r);
  document.getElementById('panel-footer').innerHTML =
    `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
     <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderForm(r) {
  return `
  <div class="form-row">
    <div style="grid-column:1/-1">
      <label class="lbl" style="margin-top:0">รายละเอียดเหตุการณ์ *</label>
      <textarea id="f-desc" rows="2">${esc(r?.incidentDesc||'')}</textarea>
    </div>
    <div>
      <label class="lbl">สถานที่เกิดเหตุ</label>
      <input id="f-loc" value="${esc(r?.location||'')}" placeholder="เช่น Line 2, คลังสินค้า"/>
    </div>
    <div>
      <label class="lbl">วันที่เกิดเหตุ</label>
      <input id="f-inc-date" type="date" value="${r?.incidentDate||''}"/>
    </div>
    <div>
      <label class="lbl">ผู้สอบสวน *</label>
      <input id="f-by" value="${esc(r?.investigatedBy||profile.displayName||'')}"/>
    </div>
    <div>
      <label class="lbl">วันที่กำหนดแล้วเสร็จ</label>
      <input id="f-target" type="date" value="${r?.targetDate||''}"/>
    </div>
  </div>

  <div class="section-title">วิธีการวิเคราะห์</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
    ${INVESTIG_METHODS.map(m=>`
      <div style="padding:6px 12px;border-radius:8px;border:2px solid ${(selMethod||r?.method)===m.key?m.color:'#e5e7eb'};background:${(selMethod||r?.method)===m.key?m.color+'18':'#fff'};cursor:pointer;font-size:0.82rem;font-weight:600;color:${(selMethod||r?.method)===m.key?m.color:'#374151'}"
         id="mb-${m.key}" onclick="window.__selMethod('${m.key}','${m.color}')">
         ${m.icon} ${m.label.split('(')[0].trim()}
      </div>`).join('')}
  </div>

  <div class="section-title">หมวดสาเหตุราก (เลือกได้หลายข้อ)</div>
  <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">
    ${ROOT_CAUSE_CATEGORIES.map(c=>`
      <div class="cause-chip" id="cc-${c.key}"
           style="background:${selCauses.has(c.key)?c.color+'18':'#f3f4f6'};border-color:${selCauses.has(c.key)?c.color:'transparent'};color:${selCauses.has(c.key)?c.color:'#374151'}"
           onclick="window.__toggleCause('${c.key}','${c.color}')">
        ${c.icon} ${c.label.split(' (')[0]}
      </div>`).join('')}
  </div>

  <div>
    <label class="lbl">การแก้ไขเฉพาะหน้า (Immediate Action)</label>
    <textarea id="f-imm">${esc(r?.immediateActions||'')}</textarea>
  </div>
  <div>
    <label class="lbl">สาเหตุรากที่แท้จริง</label>
    <textarea id="f-root">${esc(r?.rootCauseDesc||'')}</textarea>
  </div>

  <div class="section-title">5-Why Analysis</div>
  ${[0,1,2,3,4].map(i=>`
    <div class="why-row">
      <div class="why-num">${i+1}</div>
      <input id="why-${i}" placeholder="ทำไมที่ ${i+1}..." value="${esc(r?.fiveWhys?.[i]||'')}"/>
    </div>`).join('')}

  <div>
    <label class="lbl">มาตรการแก้ไขถาวร (Corrective Actions)</label>
    <textarea id="f-correct">${esc(r?.correctiveActions||'')}</textarea>
  </div>
  <div>
    <label class="lbl">มาตรการป้องกัน (Preventive Actions)</label>
    <textarea id="f-prevent">${esc(r?.preventiveActions||'')}</textarea>
  </div>
  <div>
    <label class="lbl">💡 Lesson Learned</label>
    <textarea id="f-lesson">${esc(r?.lessonLearned||'')}</textarea>
  </div>`;
}

window.__selMethod = (key, color) => {
  selMethod = key;
  INVESTIG_METHODS.forEach(m=>{
    const el = document.getElementById(`mb-${m.key}`);
    if (!el) return;
    el.style.borderColor  = m.key===key ? color : '#e5e7eb';
    el.style.background   = m.key===key ? color+'18' : '#fff';
    el.style.color        = m.key===key ? color : '#374151';
  });
};

window.__toggleCause = (key, color) => {
  if (selCauses.has(key)) selCauses.delete(key);
  else selCauses.add(key);
  const el = document.getElementById(`cc-${key}`);
  if (!el) return;
  const on = selCauses.has(key);
  el.style.background  = on ? color+'18' : '#f3f4f6';
  el.style.borderColor = on ? color : 'transparent';
  el.style.color       = on ? color : '#374151';
};

window.__save = async () => {
  const incidentDesc = document.getElementById('f-desc')?.value.trim();
  const investigatedBy = document.getElementById('f-by')?.value.trim();
  if (!incidentDesc || !investigatedBy) { alert('กรุณากรอกรายละเอียดเหตุการณ์และผู้สอบสวน'); return; }
  const data = {
    incidentDesc,
    location:         document.getElementById('f-loc')?.value.trim()||'',
    incidentDate:     document.getElementById('f-inc-date')?.value||'',
    investigatedBy,
    targetDate:       document.getElementById('f-target')?.value||'',
    method:           selMethod,
    rootCauseCategories: [...selCauses],
    immediateActions: document.getElementById('f-imm')?.value.trim()||'',
    rootCauseDesc:    document.getElementById('f-root')?.value.trim()||'',
    fiveWhys:         [0,1,2,3,4].map(i=>document.getElementById(`why-${i}`)?.value.trim()||''),
    correctiveActions:document.getElementById('f-correct')?.value.trim()||'',
    preventiveActions:document.getElementById('f-prevent')?.value.trim()||'',
    lessonLearned:    document.getElementById('f-lesson')?.value.trim()||'',
    openedAt:         editId ? undefined : new Date().toISOString().slice(0,10),
  };
  if (!data.openedAt) delete data.openedAt;
  try {
    if (editId) await updateIncidentInvestig(editId, data);
    else await createIncidentInvestig(data, profile.uid);
    window.__closePanel(); await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__progress = async (id, newStatus) => {
  await updateIncidentInvestig(id, { status: newStatus, [`${newStatus}At`]: new Date().toISOString() });
  window.__closePanel(); await render();
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบรายการสอบสวนนี้?')) return;
  await deleteIncidentInvestig(id); window.__closePanel(); await render();
};

function openPanel(title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}
window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
