<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>เฝ้าระวังโรคอาชีวอนามัย</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root{--c-primary:#0891b2;--c-success:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-gray:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.toolbar input{flex:1;min-width:160px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f1f5f9;padding:10px 12px;text-align:left;font-size:.8rem;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
td{padding:10px 12px;font-size:.85rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
.result-mini{display:flex;gap:6px;flex-wrap:wrap}
.result-pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:600}
/* Panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(680px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1.05rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-row.four{grid-template-columns:1fr 1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:70px}
.section-title{font-size:.9rem;font-weight:700;color:#334155;margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.result-card{background:#f8fafc;border-radius:8px;padding:12px 14px;border:1px solid #e2e8f0}
.result-card .rc-label{font-size:.78rem;color:#6b7280;margin-bottom:4px}
.result-card .rc-num{font-size:1.4rem;font-weight:700}
.pct-bar-wrap{background:#e2e8f0;border-radius:4px;height:8px;overflow:hidden;margin-top:6px}
.pct-bar{height:100%;border-radius:4px;transition:width .4s}
.summary-box{background:linear-gradient(135deg,#ecfeff,#cffafe);border:1px solid #a5f3fc;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap}
.summary-stat{text-align:center}
.summary-stat .sv{font-size:1.8rem;font-weight:800;color:var(--c-primary)}
.summary-stat .sl{font-size:.75rem;color:#6b7280}
.detail-section{background:#f8fafc;border-radius:10px;padding:14px 16px;margin-bottom:14px}
.detail-section h3{font-size:.9rem;font-weight:700;color:#334155;margin-bottom:10px}
.detail-row{display:flex;gap:8px;margin-bottom:6px;font-size:.83rem}
.detail-row .dk{color:#6b7280;width:160px;flex-shrink:0}
.detail-row .dv{color:#1e293b;font-weight:500}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.hazard-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  OCCH_HAZARD_TYPES, OCCH_EXAM_TYPE, OCCH_RESULT_STATUS,
  listOccHealth, getOccHealth, createOccHealth, updateOccHealth, deleteOccHealth,
  COL,
} from './js/safety-data.js';
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(profile, 'safety-occ-health', 'เฝ้าระวังโรคอาชีวอนามัย');

const DEPARTMENTS = ['ผลิต','คลังสินค้า','ซ่อมบำรุง','QC/QA','Shipping','ธุรการ','วิศวกรรม','ความปลอดภัย','ผู้รับเหมา'];

let allRecs = [];
let editId  = null;

// ── KPI ──
function renderKPI(recs) {
  const totalExam   = recs.reduce((s,r)=>(s+(r.totalExamined||0)),0);
  const totalAbnorm = recs.reduce((s,r)=>(s+(r.watchlistCount||0)+(r.restrictedCount||0)+(r.referredCount||0)),0);
  const totalRefer  = recs.reduce((s,r)=>(s+(r.referredCount||0)),0);
  const totalRestrict = recs.reduce((s,r)=>(s+(r.restrictedCount||0)),0);
  const abnormPct   = totalExam ? ((totalAbnorm/totalExam)*100).toFixed(1) : 0;
  return `<div class="kpi-row">
    <div class="kpi"><div class="num">${recs.length}</div><div class="lbl">รายการตรวจ</div></div>
    <div class="kpi" style="border-color:#0891b2"><div class="num" style="color:#0891b2">${totalExam.toLocaleString()}</div><div class="lbl">พนักงานที่ตรวจ</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${totalExam-totalAbnorm >= 0 ? (totalExam-totalAbnorm).toLocaleString():0}</div><div class="lbl">✅ ปกติ</div></div>
    <div class="kpi" style="border-color:#d97706"><div class="num" style="color:#d97706">${(recs.reduce((s,r)=>(s+(r.watchlistCount||0)),0)).toLocaleString()}</div><div class="lbl">🟡 เฝ้าระวัง</div></div>
    <div class="kpi" style="border-color:#ea580c"><div class="num" style="color:#ea580c">${totalRestrict.toLocaleString()}</div><div class="lbl">🔶 จำกัดงาน</div></div>
    <div class="kpi" style="border-color:#dc2626"><div class="num" style="color:#dc2626">${totalRefer.toLocaleString()}</div><div class="lbl">🔴 ส่งต่อ</div></div>
    <div class="kpi" style="border-color:#7c3aed"><div class="num" style="color:#7c3aed">${abnormPct}%</div><div class="lbl">อัตราผิดปกติ</div></div>
  </div>`;
}

// ── Table ──
function renderTable(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon">🩺</div><p>ยังไม่มีข้อมูลการเฝ้าระวัง</p></div>`;
  const rows = recs.map(r => {
    const hz = OCCH_HAZARD_TYPES.find(h=>h.key===r.hazardType) || { icon:'🔬', label:r.hazardType||'—', color:'#6b7280', bg:'#f3f4f6' };
    const et = OCCH_EXAM_TYPE.find(e=>e.key===r.examType) || { label:r.examType||'—' };
    const total = r.totalExamined||0;
    const normal = total-(r.watchlistCount||0)-(r.restrictedCount||0)-(r.referredCount||0);
    const abnormPct = total ? (((total-normal)/total)*100).toFixed(0) : 0;
    return `<tr>
      <td><strong>${r.programName||'—'}</strong><br/><span style="font-size:.74rem;color:#6b7280">${r.department||'—'} &nbsp;•&nbsp; ${et.label}</span></td>
      <td><span class="hazard-chip" style="color:${hz.color};background:${hz.bg}">${hz.icon} ${hz.label}</span></td>
      <td>${r.examDate||'—'}</td>
      <td style="text-align:center;font-weight:700">${total.toLocaleString()}</td>
      <td>
        <div class="result-mini">
          ${normal>0?`<span class="result-pill" style="color:#16a34a;background:#dcfce7">✅ ${normal}</span>`:''}
          ${(r.watchlistCount||0)>0?`<span class="result-pill" style="color:#d97706;background:#fef3c7">🟡 ${r.watchlistCount}</span>`:''}
          ${(r.restrictedCount||0)>0?`<span class="result-pill" style="color:#ea580c;background:#fff7ed">🔶 ${r.restrictedCount}</span>`:''}
          ${(r.referredCount||0)>0?`<span class="result-pill" style="color:#dc2626;background:#fee2e2">🔴 ${r.referredCount}</span>`:''}
        </div>
      </td>
      <td style="text-align:center">${abnormPct}%</td>
      <td>${r.nextExamDate||'—'}</td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="window.__viewOcc('${r.id}')">ดู</button>
        <button class="btn btn-sm btn-ghost" onclick="window.__editOcc('${r.id}')">แก้ไข</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deleteOcc('${r.id}','${(r.programName||'').replace(/'/g,"\\'")}')">ลบ</button>
      </td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>โปรแกรม / แผนก</th><th>ประเภทความเสี่ยง</th><th>วันที่ตรวจ</th>
      <th style="text-align:center">ตรวจ(คน)</th><th>ผลการตรวจ</th>
      <th style="text-align:center">ผิดปกติ%</th><th>ตรวจครั้งถัดไป</th><th>จัดการ</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── Form ──
function renderForm(rec) {
  const hzOpts = OCCH_HAZARD_TYPES.map(h=>`<option value="${h.key}" ${rec?.hazardType===h.key?'selected':''}>${h.icon} ${h.label}</option>`).join('');
  const etOpts = OCCH_EXAM_TYPE.map(e=>`<option value="${e.key}" ${rec?.examType===e.key?'selected':''}>${e.label}</option>`).join('');
  const deptOpts = `<option value="">-- เลือกแผนก --</option>` + DEPARTMENTS.map(d=>`<option value="${d}" ${rec?.department===d?'selected':''}>${d}</option>`).join('');
  const total = rec?.totalExamined||0;
  return `<form id="occ-form" onsubmit="return false">
    <div class="form-row">
      <div class="form-group"><label>ชื่อโปรแกรม *</label>
        <input id="f-programName" value="${rec?.programName||''}" placeholder="เช่น เฝ้าระวังการสูญเสียการได้ยิน" required/></div>
      <div class="form-group"><label>แผนก</label>
        <select id="f-department">${deptOpts}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>ประเภทความเสี่ยง *</label>
        <select id="f-hazardType">${hzOpts}</select></div>
      <div class="form-group"><label>ประเภทการตรวจ</label>
        <select id="f-examType">${etOpts}</select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>วันที่ตรวจ *</label>
        <input id="f-examDate" type="date" value="${rec?.examDate||''}" required/></div>
      <div class="form-group"><label>วันที่ตรวจครั้งถัดไป</label>
        <input id="f-nextExamDate" type="date" value="${rec?.nextExamDate||''}"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>สถานที่ตรวจ / หน่วยงานตรวจ</label>
        <input id="f-examProvider" value="${rec?.examProvider||''}" placeholder="โรงพยาบาล / คลินิกอาชีวอนามัย"/></div>
      <div class="form-group"><label>แพทย์ / ผู้รับผิดชอบ</label>
        <input id="f-physician" value="${rec?.physician||''}" placeholder="ชื่อแพทย์"/></div>
    </div>

    <div class="section-title">ผลการตรวจสุขภาพ (จำนวนพนักงาน)</div>
    <div class="form-row four">
      <div class="form-group"><label>✅ ปกติ</label>
        <input id="f-normalCount" type="number" min="0" value="${rec?.normalCount||0}" oninput="window.__calcTotal()"/></div>
      <div class="form-group"><label>🟡 เฝ้าระวัง</label>
        <input id="f-watchlistCount" type="number" min="0" value="${rec?.watchlistCount||0}" oninput="window.__calcTotal()"/></div>
      <div class="form-group"><label>🔶 จำกัดงาน</label>
        <input id="f-restrictedCount" type="number" min="0" value="${rec?.restrictedCount||0}" oninput="window.__calcTotal()"/></div>
      <div class="form-group"><label>🔴 ส่งต่อแพทย์</label>
        <input id="f-referredCount" type="number" min="0" value="${rec?.referredCount||0}" oninput="window.__calcTotal()"/></div>
    </div>
    <div style="background:#f0fdfa;border:1px solid #a5f3fc;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.85rem;display:flex;gap:16px;align-items:center">
      <span>รวมตรวจทั้งหมด: <strong id="total-display">${total}</strong> คน</span>
      <span id="abnorm-display" style="color:#d97706"></span>
    </div>

    <div class="form-row one">
      <div class="form-group"><label>ข้อมูลความเสี่ยงที่ตรวจพบ</label>
        <textarea id="f-findings" rows="3" placeholder="สรุปข้อมูลความเสี่ยงสำคัญที่ตรวจพบ เช่น ค่าเฉลี่ยการได้ยินลดลง...">${rec?.findings||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>มาตรการ / การติดตาม</label>
        <textarea id="f-actions" rows="3" placeholder="มาตรการดำเนินการ เช่น จัดให้ใส่ที่ครอบหู, ส่งตรวจซ้ำ 3 เดือน...">${rec?.actions||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>หมายเหตุ</label>
        <input id="f-notes" value="${rec?.notes||''}" placeholder="หมายเหตุเพิ่มเติม"/></div>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button type="button" class="btn btn-primary" onclick="window.__saveOcc()">💾 บันทึก</button>
      <button type="button" class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>
    </div>
  </form>`;
}

// ── Detail ──
function renderDetail(r) {
  const hz = OCCH_HAZARD_TYPES.find(h=>h.key===r.hazardType)||{icon:'🔬',label:r.hazardType||'—',color:'#6b7280',bg:'#f3f4f6'};
  const et = OCCH_EXAM_TYPE.find(e=>e.key===r.examType)||{label:r.examType||'—'};
  const total  = r.totalExamined||0;
  const normal = r.normalCount||(total-(r.watchlistCount||0)-(r.restrictedCount||0)-(r.referredCount||0));
  const abnorm = total - normal;
  const abnormPct = total ? ((abnorm/total)*100).toFixed(1) : 0;
  const normalPct = total ? ((normal/total)*100).toFixed(0) : 0;
  return `<div style="padding:20px">
    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <div style="font-size:1.15rem;font-weight:800">${r.programName||'—'}</div>
        <div style="color:#6b7280;font-size:.82rem">${r.department||'—'} &nbsp;•&nbsp; ${et.label} &nbsp;•&nbsp; ${r.examDate||'—'}</div>
      </div>
      <span class="hazard-chip" style="color:${hz.color};background:${hz.bg};margin-left:auto">${hz.icon} ${hz.label}</span>
    </div>

    <div class="summary-box">
      <div class="summary-stat"><div class="sv">${total.toLocaleString()}</div><div class="sl">ตรวจทั้งหมด</div></div>
      <div class="summary-stat"><div class="sv" style="color:#16a34a">${normal.toLocaleString()}</div><div class="sl">✅ ปกติ</div></div>
      <div class="summary-stat"><div class="sv" style="color:#d97706">${(r.watchlistCount||0).toLocaleString()}</div><div class="sl">🟡 เฝ้าระวัง</div></div>
      <div class="summary-stat"><div class="sv" style="color:#ea580c">${(r.restrictedCount||0).toLocaleString()}</div><div class="sl">🔶 จำกัดงาน</div></div>
      <div class="summary-stat"><div class="sv" style="color:#dc2626">${(r.referredCount||0).toLocaleString()}</div><div class="sl">🔴 ส่งต่อ</div></div>
      <div class="summary-stat"><div class="sv" style="color:#7c3aed">${abnormPct}%</div><div class="sl">ผิดปกติ</div></div>
    </div>

    <div class="detail-section" style="margin-bottom:12px">
      <div style="font-size:.8rem;color:#6b7280;margin-bottom:6px">อัตราผลปกติ ${normalPct}%</div>
      <div class="pct-bar-wrap" style="height:12px">
        <div class="pct-bar" style="width:${normalPct}%;background:#16a34a"></div>
      </div>
    </div>

    <div class="detail-section">
      <h3>ข้อมูลทั่วไป</h3>
      <div class="detail-row"><span class="dk">สถานที่ตรวจ</span><span class="dv">${r.examProvider||'—'}</span></div>
      <div class="detail-row"><span class="dk">แพทย์ / ผู้รับผิดชอบ</span><span class="dv">${r.physician||'—'}</span></div>
      <div class="detail-row"><span class="dk">ตรวจครั้งถัดไป</span><span class="dv">${r.nextExamDate||'—'}</span></div>
    </div>
    ${r.findings?`<div class="detail-section"><h3>ข้อมูลความเสี่ยงที่ตรวจพบ</h3><p style="font-size:.85rem;line-height:1.6">${r.findings}</p></div>`:''}
    ${r.actions?`<div class="detail-section"><h3>มาตรการ / การติดตาม</h3><p style="font-size:.85rem;line-height:1.6">${r.actions}</p></div>`:''}
    ${r.notes?`<div class="detail-section"><h3>หมายเหตุ</h3><p style="font-size:.85rem">${r.notes}</p></div>`:''}
    <div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button class="btn btn-ghost btn-sm" onclick="window.__editOcc('${r.id}')">✏️ แก้ไข</button>
      <button class="btn btn-danger btn-sm" onclick="window.__deleteOcc('${r.id}','${(r.programName||'').replace(/'/g,"\\'")}')">🗑️ ลบ</button>
    </div>
  </div>`;
}

// ── Helpers ──
window.__calcTotal = () => {
  const n  = Number(document.getElementById('f-normalCount')?.value||0);
  const w  = Number(document.getElementById('f-watchlistCount')?.value||0);
  const rs = Number(document.getElementById('f-restrictedCount')?.value||0);
  const rf = Number(document.getElementById('f-referredCount')?.value||0);
  const t  = n + w + rs + rf;
  const el = document.getElementById('total-display');
  const ad = document.getElementById('abnorm-display');
  if (el) el.textContent = t;
  if (ad) ad.textContent = t ? `ผิดปกติ ${(((w+rs+rf)/t)*100).toFixed(1)}%` : '';
};

// ── Panel ──
window.__closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
function openPanel(html, title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
  window.__calcTotal();
}

window.__newOcc = () => { editId = null; openPanel(renderForm(null), '+ เพิ่มข้อมูลการเฝ้าระวัง'); };
window.__editOcc = async id => {
  editId = id;
  const r = await getOccHealth(id);
  openPanel(renderForm(r), '✏️ แก้ไขข้อมูล');
};
window.__viewOcc = async id => {
  const r = await getOccHealth(id);
  document.getElementById('panel-title').textContent = '🩺 รายละเอียดการเฝ้าระวัง';
  document.getElementById('panel-content').innerHTML = renderDetail(r);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
};

window.__saveOcc = async () => {
  const n  = Number(document.getElementById('f-normalCount').value||0);
  const w  = Number(document.getElementById('f-watchlistCount').value||0);
  const rs = Number(document.getElementById('f-restrictedCount').value||0);
  const rf = Number(document.getElementById('f-referredCount').value||0);
  const data = {
    programName:    document.getElementById('f-programName').value.trim(),
    department:     document.getElementById('f-department').value,
    hazardType:     document.getElementById('f-hazardType').value,
    examType:       document.getElementById('f-examType').value,
    examDate:       document.getElementById('f-examDate').value,
    nextExamDate:   document.getElementById('f-nextExamDate').value,
    examProvider:   document.getElementById('f-examProvider').value.trim(),
    physician:      document.getElementById('f-physician').value.trim(),
    normalCount:    n,
    watchlistCount: w,
    restrictedCount:rs,
    referredCount:  rf,
    totalExamined:  n + w + rs + rf,
    findings:       document.getElementById('f-findings').value.trim(),
    actions:        document.getElementById('f-actions').value.trim(),
    notes:          document.getElementById('f-notes').value.trim(),
  };
  if (!data.programName || !data.examDate) { alert('กรุณากรอกชื่อโปรแกรมและวันที่ตรวจ'); return; }
  try {
    if (editId) await updateOccHealth(editId, data);
    else        await createOccHealth(data, profile.uid||profile.email||'unknown');
    window.__closePanel();
    await loadData();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

window.__deleteOcc = async (id, name) => {
  if (!confirm(`ลบข้อมูล "${name}" ออกจากระบบ?`)) return;
  await deleteOccHealth(id);
  window.__closePanel();
  await loadData();
};

// ── Filter ──
function applyFilter() {
  const q  = document.getElementById('search-box')?.value.toLowerCase()||'';
  const hz = document.getElementById('filter-hazard')?.value||'';
  const dp = document.getElementById('filter-dept')?.value||'';
  const filtered = allRecs.filter(r =>
    (!q  || (r.programName||'').toLowerCase().includes(q)) &&
    (!hz || r.hazardType===hz) &&
    (!dp || r.department===dp)
  );
  document.getElementById('table-wrap').innerHTML = renderTable(filtered);
}
window.applyFilter = applyFilter;

async function loadData() {
  allRecs = await listOccHealth();
  document.getElementById('kpi-wrap').innerHTML = renderKPI(allRecs);
  applyFilter();
}

// ── Build UI ──
const hzOpts = `<option value="">-- ทุกประเภทความเสี่ยง --</option>` +
  OCCH_HAZARD_TYPES.map(h=>`<option value="${h.key}">${h.icon} ${h.label}</option>`).join('');
const deptOpts = `<option value="">-- ทุกแผนก --</option>` +
  DEPARTMENTS.map(d=>`<option value="${d}">${d}</option>`).join('');

main.innerHTML = `
  <div style="padding:20px">
    <div id="kpi-wrap"></div>
    <div class="toolbar">
      <input id="search-box" placeholder="🔍 ค้นหาชื่อโปรแกรม…" oninput="applyFilter()"/>
      <select id="filter-hazard" onchange="applyFilter()">${hzOpts}</select>
      <select id="filter-dept"   onchange="applyFilter()">${deptOpts}</select>
      <button class="btn btn-primary" onclick="window.__newOcc()">+ เพิ่มข้อมูล</button>
    </div>
    <div id="table-wrap"></div>
  </div>

  <div class="panel-overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-head">
      <h2 id="panel-title">เฝ้าระวังโรคอาชีวอนามัย</h2>
      <button class="btn btn-ghost btn-sm" onclick="window.__closePanel()">✕ ปิด</button>
    </div>
    <div class="panel-body" id="panel-content"></div>
  </div>
`;

await loadData();
</script>
</body>
