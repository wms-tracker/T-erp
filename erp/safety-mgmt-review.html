<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>การทบทวนของฝ่ายบริหาร</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root{--c-primary:#7c3aed;--c-success:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-gray:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
/* Cards */
.review-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.review-card{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);border:1px solid #e2e8f0;overflow:hidden;cursor:pointer;transition:box-shadow .2s}
.review-card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.card-head{padding:14px 16px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-title{font-weight:700;font-size:.95rem;flex:1}
.card-meta{font-size:.78rem;color:#6b7280;margin-top:3px}
.card-body{padding:12px 16px}
.card-row{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px;color:#475569}
.card-row strong{color:#1e293b}
.card-actions{padding:10px 16px;border-top:1px solid #f1f5f9;display:flex;gap:8px}
.input-check{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#f8fafc;border-radius:7px;margin-bottom:6px;font-size:.83rem;cursor:pointer}
.input-check input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--c-primary)}
.input-status{display:flex;gap:4px;margin-left:auto}
.rating-btn{padding:3px 8px;border:1px solid #d1d5db;border-radius:5px;background:#fff;font-size:.75rem;cursor:pointer;font-family:inherit;transition:all .15s}
.rating-btn.sel-good{background:#dcfce7;border-color:#16a34a;color:#16a34a;font-weight:600}
.rating-btn.sel-fair{background:#fef3c7;border-color:#d97706;color:#d97706;font-weight:600}
.rating-btn.sel-poor{background:#fee2e2;border-color:#dc2626;color:#dc2626;font-weight:600}
/* Panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(720px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:60px}
.section-title{font-size:.9rem;font-weight:700;color:#334155;margin:16px 0 10px;padding-bottom:6px;border-bottom:2px solid #e2e8f0;display:flex;align-items:center;gap:6px}
.action-row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;margin-bottom:6px;background:#f8fafc;padding:7px 10px;border-radius:7px}
.action-row input{padding:5px 8px;border:1px solid #d1d5db;border-radius:5px;font-size:.82rem;font-family:inherit;width:100%}
.action-row select{padding:5px 8px;border:1px solid #d1d5db;border-radius:5px;font-size:.82rem;font-family:inherit}
.tab-bar{display:flex;gap:6px;margin-bottom:16px;border-bottom:2px solid #e2e8f0}
.tab-btn{padding:8px 14px;border:none;background:none;font-family:inherit;font-size:.85rem;cursor:pointer;color:#6b7280;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:700}
.tab-panel{display:none}.tab-panel.active{display:block}
.detail-section{background:#f8fafc;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.detail-section h3{font-size:.88rem;font-weight:700;color:#334155;margin-bottom:10px;display:flex;align-items:center;gap:5px}
.clause-tag{font-size:.7rem;background:#ede9fe;color:#7c3aed;padding:1px 7px;border-radius:999px;font-weight:600}
.input-detail-row{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #e2e8f0;font-size:.83rem}
.input-detail-row:last-child{border-bottom:none}
.idl{flex:1;color:#334155}
.idst{flex-shrink:0}
.output-row{padding:7px 0;border-bottom:1px solid #e2e8f0;font-size:.83rem}
.output-row:last-child{border-bottom:none}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  MGMT_REVIEW_INPUTS, MGMT_REVIEW_OUTPUTS, MGMT_REVIEW_STATUS,
  listMgmtReview, getMgmtReview, createMgmtReview, updateMgmtReview, deleteMgmtReview,
} from './js/safety-data.js';

const profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(profile, 'safety-mgmt-review', 'การทบทวนของฝ่ายบริหาร (ISO 45001)');

let allRecs = [];
let editId  = null;
let inputRatings = {}; // key → 'good'|'fair'|'poor'
let inputNotes   = {}; // key → string
let outputNotes  = {}; // key → string
let actionItems  = []; // [{what,who,due}]

// ── KPI ──
function renderKPI(recs) {
  const total    = recs.length;
  const approved = recs.filter(r=>r.status==='approved').length;
  const closed   = recs.filter(r=>r.status==='closed').length;
  const draft    = recs.filter(r=>r.status==='draft').length;
  const totalActions = recs.reduce((s,r)=>s+(r.actionItems||[]).length,0);
  return `<div class="kpi-row">
    <div class="kpi"><div class="num">${total}</div><div class="lbl">ครั้งทบทวนทั้งหมด</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${closed}</div><div class="lbl">✅ ปิดแล้ว</div></div>
    <div class="kpi" style="border-color:#2563eb"><div class="num" style="color:#2563eb">${approved}</div><div class="lbl">📋 อนุมัติแล้ว</div></div>
    <div class="kpi" style="border-color:#6b7280"><div class="num" style="color:#6b7280">${draft}</div><div class="lbl">📝 ร่าง</div></div>
    <div class="kpi" style="border-color:#d97706"><div class="num" style="color:#d97706">${totalActions}</div><div class="lbl">📌 Action Items</div></div>
  </div>`;
}

// ── Cards ──
function renderCards(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon">📋</div><p>ยังไม่มีบันทึกการทบทวน</p></div>`;
  return `<div class="review-cards">${recs.map(r => {
    const st = MGMT_REVIEW_STATUS[r.status]||MGMT_REVIEW_STATUS.draft;
    const coveredInputs = MGMT_REVIEW_INPUTS.filter(i=>(r.inputRatings||{})[i.key]).length;
    const actions = (r.actionItems||[]).length;
    const attendees = (r.attendees||'').split(',').filter(Boolean).length;
    return `<div class="review-card">
      <div class="card-head">
        <div>
          <div class="card-title">${r.meetingTitle||'การทบทวนของฝ่ายบริหาร'}</div>
          <div class="card-meta">📅 ${r.reviewDate||'—'} &nbsp;•&nbsp; 📍 ${r.location||'—'}</div>
        </div>
        <span class="badge" style="color:${st.color};background:${st.bg}">${st.label}</span>
      </div>
      <div class="card-body">
        <div class="card-row"><span>ผู้เข้าร่วม</span><strong>${attendees} คน</strong></div>
        <div class="card-row"><span>Input ที่ครอบคลุม</span><strong>${coveredInputs}/${MGMT_REVIEW_INPUTS.length} ข้อ</strong></div>
        <div class="card-row"><span>Action Items</span><strong>${actions} รายการ</strong></div>
        <div class="card-row"><span>ประธาน</span><strong>${r.chairperson||'—'}</strong></div>
      </div>
      <div class="card-actions">
        <button class="btn btn-sm btn-ghost" onclick="window.__viewReview('${r.id}')">ดูรายละเอียด</button>
        <button class="btn btn-sm btn-ghost" onclick="window.__editReview('${r.id}')">แก้ไข</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deleteReview('${r.id}','${(r.meetingTitle||'').replace(/'/g,"\\'")}')">ลบ</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ── Form ──
function renderForm(rec) {
  const stOpts = Object.entries(MGMT_REVIEW_STATUS).map(([k,v])=>
    `<option value="${k}" ${(rec?.status||'draft')===k?'selected':''}>${v.label}</option>`
  ).join('');

  const inputRows = MGMT_REVIEW_INPUTS.map(inp => {
    const rating = inputRatings[inp.key]||'';
    const note   = inputNotes[inp.key]||'';
    return `<div class="input-check">
      <div style="flex:1">
        <div style="font-weight:500">${inp.label}</div>
        <div style="font-size:.73rem;color:#9ca3af">${inp.clause}</div>
        <input type="text" placeholder="สรุปประเด็น / ผลการพิจารณา…"
          style="margin-top:4px;width:100%;padding:4px 8px;border:1px solid #d1d5db;border-radius:5px;font-size:.8rem;font-family:inherit"
          value="${note.replace(/"/g,'&quot;')}"
          oninput="window.__inputNote('${inp.key}',this.value)"/>
      </div>
      <div class="input-status">
        <button type="button" class="rating-btn ${rating==='good'?'sel-good':''}" onclick="window.__rate('${inp.key}','good')">ดี</button>
        <button type="button" class="rating-btn ${rating==='fair'?'sel-fair':''}" onclick="window.__rate('${inp.key}','fair')">พอใช้</button>
        <button type="button" class="rating-btn ${rating==='poor'?'sel-poor':''}" onclick="window.__rate('${inp.key}','poor')">ต้องแก้ไข</button>
      </div>
    </div>`;
  }).join('');

  const outputRows = MGMT_REVIEW_OUTPUTS.map(out => {
    const note = outputNotes[out.key]||'';
    return `<div class="form-group" style="margin-bottom:10px">
      <label>${out.label}</label>
      <textarea rows="2" placeholder="ระบุผลการตัดสินใจ / มติที่ประชุม…"
        oninput="window.__outputNote('${out.key}',this.value)">${note}</textarea>
    </div>`;
  }).join('');

  const actionRows = actionItems.map((a,i) => `
    <div class="action-row" id="action-row-${i}">
      <input placeholder="รายละเอียดมาตรการ / งานที่มอบหมาย"
        value="${(a.what||'').replace(/"/g,'&quot;')}"
        oninput="window.__actionChange(${i},'what',this.value)"/>
      <input placeholder="ผู้รับผิดชอบ" style="width:110px"
        value="${(a.who||'').replace(/"/g,'&quot;')}"
        oninput="window.__actionChange(${i},'who',this.value)"/>
      <input type="date" style="width:130px" value="${a.due||''}"
        oninput="window.__actionChange(${i},'due',this.value)"/>
      <button type="button" class="btn btn-sm btn-danger" onclick="window.__removeAction(${i})">✕</button>
    </div>`).join('');

  return `<form id="review-form" onsubmit="return false">
    <div class="tab-bar">
      <button type="button" class="tab-btn active" onclick="window.__switchTab('info')">ข้อมูลการประชุม</button>
      <button type="button" class="tab-btn" onclick="window.__switchTab('inputs')">Input (9.3)</button>
      <button type="button" class="tab-btn" onclick="window.__switchTab('outputs')">Output</button>
      <button type="button" class="tab-btn" onclick="window.__switchTab('actions')">Action Items</button>
    </div>

    <div class="tab-panel active" id="tab-info">
      <div class="form-row one">
        <div class="form-group"><label>ชื่อการประชุมทบทวน *</label>
          <input id="f-meetingTitle" value="${rec?.meetingTitle||'การทบทวนของฝ่ายบริหารด้านความปลอดภัย'}" required/></div>
      </div>
      <div class="form-row three">
        <div class="form-group"><label>วันที่ประชุม *</label>
          <input id="f-reviewDate" type="date" value="${rec?.reviewDate||''}" required/></div>
        <div class="form-group"><label>เวลา</label>
          <input id="f-reviewTime" type="time" value="${rec?.reviewTime||''}"/></div>
        <div class="form-group"><label>สถานะ</label>
          <select id="f-status">${stOpts}</select></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>สถานที่ประชุม</label>
          <input id="f-location" value="${rec?.location||''}" placeholder="ห้องประชุม / สถานที่"/></div>
        <div class="form-group"><label>ประธานการประชุม</label>
          <input id="f-chairperson" value="${rec?.chairperson||''}" placeholder="ชื่อ-ตำแหน่ง"/></div>
      </div>
      <div class="form-row one">
        <div class="form-group"><label>ผู้เข้าร่วมประชุม (คั่นด้วยจุลภาค)</label>
          <textarea id="f-attendees" rows="2" placeholder="ชื่อ-ตำแหน่ง, ...">${rec?.attendees||''}</textarea></div>
      </div>
      <div class="form-row one">
        <div class="form-group"><label>วาระการประชุม</label>
          <textarea id="f-agenda" rows="3" placeholder="ระบุวาระสำคัญของการประชุม">${rec?.agenda||''}</textarea></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>วันทบทวนครั้งถัดไป</label>
          <input id="f-nextReviewDate" type="date" value="${rec?.nextReviewDate||''}"/></div>
        <div class="form-group"><label>ผู้จดบันทึก</label>
          <input id="f-secretary" value="${rec?.secretary||profile.displayName||''}" placeholder="ชื่อ"/></div>
      </div>
    </div>

    <div class="tab-panel" id="tab-inputs">
      <div style="background:#ede9fe;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.82rem;color:#5b21b6">
        📌 ISO 45001 ข้อ 9.3 กำหนดให้ฝ่ายบริหารพิจารณา Input ทั้ง 10 หัวข้อ ให้คะแนนและบันทึกสรุปประเด็นสำคัญ
      </div>
      ${inputRows}
    </div>

    <div class="tab-panel" id="tab-outputs">
      <div style="background:#ecfdf5;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:.82rem;color:#065f46">
        📌 Output ที่ต้องมีจากการทบทวน ให้ระบุมติหรือผลการตัดสินใจของฝ่ายบริหารในแต่ละหัวข้อ
      </div>
      ${outputRows}
    </div>

    <div class="tab-panel" id="tab-actions">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="font-size:.85rem;color:#475569">มาตรการ / งานที่มอบหมายจากการทบทวน</span>
        <button type="button" class="btn btn-sm btn-ghost" onclick="window.__addAction()">+ เพิ่มรายการ</button>
      </div>
      <div id="action-list">${actionRows||'<div style="color:#9ca3af;font-size:.85rem;padding:12px 0">ยังไม่มี Action Items — กดปุ่มเพิ่มรายการ</div>'}</div>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button type="button" class="btn btn-primary" onclick="window.__saveReview()">💾 บันทึก</button>
      <button type="button" class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>
    </div>
  </form>`;
}

// ── Detail view ──
function renderDetail(r) {
  const st = MGMT_REVIEW_STATUS[r.status]||MGMT_REVIEW_STATUS.draft;
  const attendeeList = (r.attendees||'').split(',').filter(Boolean).map(a=>`<span style="display:inline-block;background:#f1f5f9;border-radius:5px;padding:2px 8px;font-size:.8rem;margin:2px">${a.trim()}</span>`).join('');

  const inputRows = MGMT_REVIEW_INPUTS.map(inp => {
    const rating = (r.inputRatings||{})[inp.key];
    const note   = (r.inputNotes||{})[inp.key]||'—';
    const ratingColors = { good:'#16a34a', fair:'#d97706', poor:'#dc2626' };
    const ratingLabels = { good:'ดี', fair:'พอใช้', poor:'ต้องแก้ไข' };
    return `<div class="input-detail-row">
      <div class="idl"><strong>${inp.label}</strong><div style="color:#9ca3af;font-size:.73rem;margin-top:1px">${inp.clause}</div>
        <div style="color:#475569;margin-top:3px">${note}</div></div>
      <div class="idst">${rating?`<span class="badge" style="color:${ratingColors[rating]};background:${ratingColors[rating]}22">${ratingLabels[rating]}</span>`:'<span style="color:#9ca3af;font-size:.78rem">—</span>'}</div>
    </div>`;
  }).join('');

  const outputRows = MGMT_REVIEW_OUTPUTS.map(out => {
    const note = (r.outputNotes||{})[out.key]||'—';
    return `<div class="output-row"><strong>${out.label}</strong><div style="color:#475569;margin-top:3px;font-size:.83rem">${note}</div></div>`;
  }).join('');

  const actionRows = (r.actionItems||[]).length
    ? `<table style="width:100%;border-collapse:collapse;font-size:.82rem">
        <thead><tr style="background:#f1f5f9">
          <th style="padding:7px 10px;text-align:left;font-weight:600">มาตรการ / งาน</th>
          <th style="padding:7px 10px;text-align:left;font-weight:600">ผู้รับผิดชอบ</th>
          <th style="padding:7px 10px;text-align:left;font-weight:600">กำหนดเสร็จ</th>
        </tr></thead>
        <tbody>${(r.actionItems||[]).map(a=>`<tr><td style="padding:7px 10px;border-bottom:1px solid #f1f5f9">${a.what||'—'}</td><td style="padding:7px 10px;border-bottom:1px solid #f1f5f9">${a.who||'—'}</td><td style="padding:7px 10px;border-bottom:1px solid #f1f5f9">${a.due||'—'}</td></tr>`).join('')}</tbody>
      </table>`
    : '<div style="color:#9ca3af;font-size:.85rem">ไม่มี Action Items</div>';

  const good = MGMT_REVIEW_INPUTS.filter(i=>(r.inputRatings||{})[i.key]==='good').length;
  const fair = MGMT_REVIEW_INPUTS.filter(i=>(r.inputRatings||{})[i.key]==='fair').length;
  const poor = MGMT_REVIEW_INPUTS.filter(i=>(r.inputRatings||{})[i.key]==='poor').length;

  return `<div style="padding:20px">
    <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <div>
        <div style="font-size:1.1rem;font-weight:800">${r.meetingTitle||'การทบทวนของฝ่ายบริหาร'}</div>
        <div style="color:#6b7280;font-size:.82rem">📅 ${r.reviewDate||'—'} ${r.reviewTime?'เวลา '+r.reviewTime:''} &nbsp;•&nbsp; 📍 ${r.location||'—'}</div>
        <div style="color:#6b7280;font-size:.82rem;margin-top:2px">ประธาน: ${r.chairperson||'—'} &nbsp;•&nbsp; บันทึกโดย: ${r.secretary||'—'}</div>
      </div>
      <span class="badge" style="color:${st.color};background:${st.bg};margin-left:auto">${st.label}</span>
    </div>

    <div style="background:#f5f3ff;border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;gap:16px;flex-wrap:wrap">
      <div style="text-align:center"><div style="font-size:1.4rem;font-weight:800;color:#16a34a">${good}</div><div style="font-size:.75rem;color:#6b7280">Input ดี</div></div>
      <div style="text-align:center"><div style="font-size:1.4rem;font-weight:800;color:#d97706">${fair}</div><div style="font-size:.75rem;color:#6b7280">พอใช้</div></div>
      <div style="text-align:center"><div style="font-size:1.4rem;font-weight:800;color:#dc2626">${poor}</div><div style="font-size:.75rem;color:#6b7280">ต้องแก้ไข</div></div>
      <div style="text-align:center"><div style="font-size:1.4rem;font-weight:800;color:#7c3aed">${(r.actionItems||[]).length}</div><div style="font-size:.75rem;color:#6b7280">Action Items</div></div>
    </div>

    ${r.agenda?`<div class="detail-section" style="margin-bottom:12px"><h3>วาระการประชุม</h3><p style="font-size:.85rem;line-height:1.7;white-space:pre-wrap">${r.agenda}</p></div>`:''}

    <div class="detail-section">
      <h3>ผู้เข้าร่วมประชุม</h3>
      <div>${attendeeList||'—'}</div>
    </div>

    <div class="detail-section">
      <h3>📥 Input ตาม ISO 45001 ข้อ 9.3</h3>
      ${inputRows}
    </div>

    <div class="detail-section">
      <h3>📤 Output จากการทบทวน</h3>
      ${outputRows}
    </div>

    <div class="detail-section">
      <h3>📌 Action Items (${(r.actionItems||[]).length} รายการ)</h3>
      ${actionRows}
    </div>

    ${r.nextReviewDate?`<div style="background:#ede9fe;border-radius:8px;padding:10px 14px;font-size:.85rem;color:#5b21b6;margin-top:4px">📅 ทบทวนครั้งถัดไป: <strong>${r.nextReviewDate}</strong></div>`:''}

    <div style="display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button class="btn btn-ghost btn-sm" onclick="window.__editReview('${r.id}')">✏️ แก้ไข</button>
      <button class="btn btn-danger btn-sm" onclick="window.__deleteReview('${r.id}','${(r.meetingTitle||'').replace(/'/g,"\\'")}')">🗑️ ลบ</button>
    </div>
  </div>`;
}

// ── Helpers ──
window.__rate = (key, val) => {
  inputRatings[key] = val;
  document.querySelectorAll(`[onclick*="__rate('${key}'"]`).forEach(b => {
    b.classList.remove('sel-good','sel-fair','sel-poor');
    if (b.textContent.trim()===(val==='good'?'ดี':val==='fair'?'พอใช้':'ต้องแก้ไข'))
      b.classList.add(`sel-${val}`);
  });
};
window.__inputNote  = (key, val) => { inputNotes[key]  = val; };
window.__outputNote = (key, val) => { outputNotes[key] = val; };

window.__addAction = () => {
  actionItems.push({ what:'', who:'', due:'' });
  reRenderActions();
};
window.__removeAction = idx => {
  actionItems.splice(idx, 1);
  reRenderActions();
};
window.__actionChange = (idx, field, val) => { actionItems[idx][field] = val; };
function reRenderActions() {
  const wrap = document.getElementById('action-list');
  if (!wrap) return;
  if (!actionItems.length) { wrap.innerHTML = '<div style="color:#9ca3af;font-size:.85rem;padding:12px 0">ยังไม่มี Action Items — กดปุ่มเพิ่มรายการ</div>'; return; }
  wrap.innerHTML = actionItems.map((a,i)=>`
    <div class="action-row">
      <input placeholder="รายละเอียดมาตรการ" value="${(a.what||'').replace(/"/g,'&quot;')}"
        oninput="window.__actionChange(${i},'what',this.value)"/>
      <input placeholder="ผู้รับผิดชอบ" style="width:110px" value="${(a.who||'').replace(/"/g,'&quot;')}"
        oninput="window.__actionChange(${i},'who',this.value)"/>
      <input type="date" style="width:130px" value="${a.due||''}"
        oninput="window.__actionChange(${i},'due',this.value)"/>
      <button type="button" class="btn btn-sm btn-danger" onclick="window.__removeAction(${i})">✕</button>
    </div>`).join('');
}

// ── Tabs ──
window.__switchTab = tab => {
  const tabs = ['info','inputs','outputs','actions'];
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',tabs[i]===tab));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+tab));
};

// ── Panel ──
window.__closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
function openPanel(html, title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

window.__newReview = () => {
  editId = null; inputRatings = {}; inputNotes = {}; outputNotes = {}; actionItems = [];
  openPanel(renderForm(null), '+ เพิ่มบันทึกการทบทวน');
};
window.__editReview = async id => {
  editId = id;
  const r = await getMgmtReview(id);
  inputRatings = { ...(r.inputRatings||{}) };
  inputNotes   = { ...(r.inputNotes||{}) };
  outputNotes  = { ...(r.outputNotes||{}) };
  actionItems  = JSON.parse(JSON.stringify(r.actionItems||[]));
  openPanel(renderForm(r), '✏️ แก้ไขการทบทวน');
};
window.__viewReview = async id => {
  const r = await getMgmtReview(id);
  document.getElementById('panel-title').textContent = '📋 บันทึกการทบทวนของฝ่ายบริหาร';
  document.getElementById('panel-content').innerHTML = renderDetail(r);
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
};

// ── Save ──
window.__saveReview = async () => {
  const data = {
    meetingTitle:   document.getElementById('f-meetingTitle').value.trim(),
    reviewDate:     document.getElementById('f-reviewDate').value,
    reviewTime:     document.getElementById('f-reviewTime').value,
    status:         document.getElementById('f-status').value,
    location:       document.getElementById('f-location').value.trim(),
    chairperson:    document.getElementById('f-chairperson').value.trim(),
    attendees:      document.getElementById('f-attendees').value.trim(),
    agenda:         document.getElementById('f-agenda').value.trim(),
    nextReviewDate: document.getElementById('f-nextReviewDate').value,
    secretary:      document.getElementById('f-secretary').value.trim(),
    inputRatings:   { ...inputRatings },
    inputNotes:     { ...inputNotes },
    outputNotes:    { ...outputNotes },
    actionItems:    JSON.parse(JSON.stringify(actionItems)),
  };
  if (!data.meetingTitle || !data.reviewDate) { alert('กรุณากรอกชื่อการประชุมและวันที่'); return; }
  try {
    if (editId) await updateMgmtReview(editId, data);
    else        await createMgmtReview(data, profile.uid||profile.email||'unknown');
    window.__closePanel();
    await loadData();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

// ── Delete ──
window.__deleteReview = async (id, name) => {
  if (!confirm(`ลบบันทึก "${name}"?`)) return;
  await deleteMgmtReview(id);
  window.__closePanel();
  await loadData();
};

// ── Filter ──
function applyFilter() {
  const st = document.getElementById('filter-status')?.value||'';
  const yr = document.getElementById('filter-year')?.value||'';
  const filtered = allRecs.filter(r =>
    (!st || r.status===st) &&
    (!yr || (r.reviewDate||'').startsWith(yr))
  );
  document.getElementById('kpi-wrap').innerHTML = renderKPI(filtered);
  document.getElementById('content-wrap').innerHTML = renderCards(filtered);
}
window.applyFilter = applyFilter;

async function loadData() {
  allRecs = await listMgmtReview();
  applyFilter();
}

// ── Build UI ──
const stOpts = `<option value="">-- ทุกสถานะ --</option>` +
  Object.entries(MGMT_REVIEW_STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
const curYear = new Date().getFullYear();
const yrOpts = `<option value="">-- ทุกปี --</option>` +
  [curYear, curYear-1, curYear-2].map(y=>`<option value="${y}">${y+543} (${y})</option>`).join('');

main.innerHTML = `
  <div style="padding:20px">
    <div id="kpi-wrap"></div>
    <div class="toolbar">
      <select id="filter-year"   onchange="applyFilter()">${yrOpts}</select>
      <select id="filter-status" onchange="applyFilter()">${stOpts}</select>
      <button class="btn btn-primary" onclick="window.__newReview()">+ เพิ่มบันทึกการทบทวน</button>
    </div>
    <div id="content-wrap"></div>
  </div>

  <div class="panel-overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-head">
      <h2 id="panel-title">การทบทวนของฝ่ายบริหาร</h2>
      <button class="btn btn-ghost btn-sm" onclick="window.__closePanel()">✕ ปิด</button>
    </div>
    <div class="panel-body" id="panel-content"></div>
  </div>
`;

await loadData();
</script>
</body>
</html>
