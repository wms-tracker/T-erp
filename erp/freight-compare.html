<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เปรียบเทียบค่าขนส่ง — Web ERP</title>
<link rel="stylesheet" href="css/erp.css" />
</head>
<body></body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import { toast, emptyStateHTML } from "./js/ui.js";
import { listCarriers, getSkuDimension, getSkuGrid, calculateOrderAndOptionallySave, listZoneMapEntries } from "./js/freight-data.js";

const profile = await requireRole(["admin", "warehouse", "sales", "manager"]);
const main = renderShell(profile, "freight-compare", "⚖️ เปรียบเทียบค่าขนส่งระหว่าง Carrier");

const STATUS_LABEL = {
  CALCULATED: "คำนวณสำเร็จ", RATE_NOT_FOUND: "ไม่พบ Rate Card", ZONE_NOT_FOUND: "ไม่พบ Zone",
  WEIGHT_ERROR: "ข้อมูลน้ำหนักผิดพลาด", DIMENSION_ERROR: "ข้อมูลขนาดผิดพลาด", DATA_ERROR: "ข้อมูลไม่ถูกต้อง",
  MANUAL_REVIEW: "ต้องตรวจสอบเอง", CALCULATION_ERROR: "คำนวณผิดพลาด",
};
const STATUS_BADGE = {
  CALCULATED: "badge-done", MANUAL_REVIEW: "badge-pending",
  RATE_NOT_FOUND: "badge-cancel", ZONE_NOT_FOUND: "badge-cancel", WEIGHT_ERROR: "badge-cancel",
  DIMENSION_ERROR: "badge-cancel", DATA_ERROR: "badge-cancel", CALCULATION_ERROR: "badge-cancel",
};

function escAttr(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

let carriers = [];
let nextUid = 1;

// Same item-row model as freight-calculator.html, so the two pages behave identically for
// multi-SKU orders and for Business Idea's per-item Type/Bracket selection.
let items = [newItem()];
function newItem() {
  return { uid: nextUid++, sku: "", quantity: 1, weightKg: "", lengthCm: "", widthCm: "", heightCm: "", variantType: "", bracketLabel: "", grid: null };
}

// Business Idea needs its item-row Type/Bracket pickers only if SOME active carrier actually
// uses SKU_ZONE_GRID — computed once carriers are loaded.
let anySkuZoneGridCarrier = false;

main.innerHTML = `
  <div class="card">
    <div class="section-title">ข้อมูล Order (คำนวณครั้งเดียว เทียบทุก Carrier พร้อมกัน)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><label>จังหวัด / อำเภอ <span class="req">*</span></label><input id="in-province" list="province-list" placeholder="พิมพ์แล้วเลือกจากรายการ — จะกรอกรหัสไปรษณีย์ให้อัตโนมัติ" /><datalist id="province-list"></datalist></div>
      <div class="field"><label>รหัสไปรษณีย์ <span class="req">*</span></label><input id="in-postal" maxlength="5" /></div>
    </div>

    <div class="field">
      <label>รายการสินค้า <span class="req">*</span></label>
      <div style="overflow-x:auto;">
        <table style="min-width:640px;">
          <thead><tr>
            <th>SKU</th><th style="width:64px;">จำนวน</th><th style="width:80px;">น้ำหนัก(kg)</th>
            <th style="width:64px;">ยาว</th><th style="width:64px;">กว้าง</th><th style="width:64px;">สูง</th>
            <th>ประเภท/ช่วงตัวเลข (เฉพาะ Business Idea)</th><th></th>
          </tr></thead>
          <tbody id="items-rows"></tbody>
        </table>
      </div>
      <button type="button" class="btn btn-outline" id="btn-add-item" style="width:auto;padding:6px 16px;margin-top:8px;">+ เพิ่มสินค้า</button>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="field"><label>ยอด COD (บาท, ถ้ามี)</label><input id="in-cod" type="number" step="0.01" /></div>
      <div class="field"><label>วันที่จัดส่ง</label><input id="in-shipdate" type="date" /></div>
    </div>
    <button class="btn btn-primary btn-lg" id="btn-compare">⚖️ เปรียบเทียบทุก Carrier</button>
  </div>

  <div id="result-panel"></div>
`;

document.getElementById("in-shipdate").value = new Date().toISOString().slice(0, 10);

// ---------- item rows (same pattern as freight-calculator.html) ----------

function itemRowHTML(it) {
  let typeBracketHTML = "-";
  if (anySkuZoneGridCarrier) {
    const typeOptions = it.grid?.variants?.length > 1
      ? `<select data-field="variantType" data-uid="${it.uid}" style="width:48%;display:inline-block;">${it.grid.variants.map((v) => `<option value="${v.type}" ${v.type === it.variantType ? "selected" : ""}>${v.type}</option>`).join("")}</select>`
      : "";
    const chosenVariant = it.grid?.variants?.find((v) => v.type === (it.variantType || it.grid.variants[0]?.type)) || it.grid?.variants?.[0];
    const brackets = chosenVariant ? [...new Set(chosenVariant.cells.map((c) => c.bracketLabel))] : [];
    const bracketOptions = brackets.length
      ? `<select data-field="bracketLabel" data-uid="${it.uid}" style="width:48%;display:inline-block;"><option value="">— เลือกช่วงตัวเลข —</option>${brackets.map((b) => `<option value="${b}" ${b === it.bracketLabel ? "selected" : ""}>${b}</option>`).join("")}</select>`
      : "";
    typeBracketHTML = (typeOptions || bracketOptions) ? `${typeOptions}${bracketOptions}` : `<span style="color:#aaa;font-size:0.78rem;">กรอก SKU ก่อน</span>`;
  }
  return `
    <tr data-uid="${it.uid}">
      <td><input data-field="sku" data-uid="${it.uid}" value="${it.sku}" style="min-width:140px;" /></td>
      <td><input data-field="quantity" data-uid="${it.uid}" type="number" min="1" value="${it.quantity}" style="width:56px;" /></td>
      <td><input data-field="weightKg" data-uid="${it.uid}" type="number" step="0.01" value="${it.weightKg}" style="width:72px;" /></td>
      <td><input data-field="lengthCm" data-uid="${it.uid}" type="number" step="0.1" value="${it.lengthCm}" style="width:56px;" /></td>
      <td><input data-field="widthCm" data-uid="${it.uid}" type="number" step="0.1" value="${it.widthCm}" style="width:56px;" /></td>
      <td><input data-field="heightCm" data-uid="${it.uid}" type="number" step="0.1" value="${it.heightCm}" style="width:56px;" /></td>
      <td>${typeBracketHTML}</td>
      <td><button type="button" class="btn btn-outline btn-remove-item" data-uid="${it.uid}" style="padding:4px 10px;font-size:0.76rem;" ${items.length <= 1 ? "disabled" : ""}>ลบ</button></td>
    </tr>`;
}

function renderItemsRows() {
  document.getElementById("items-rows").innerHTML = items.map(itemRowHTML).join("");
}

function findItem(uid) {
  return items.find((it) => String(it.uid) === String(uid));
}

document.getElementById("btn-add-item").addEventListener("click", () => {
  items.push(newItem());
  renderItemsRows();
});

document.getElementById("items-rows").addEventListener("click", (e) => {
  const btn = e.target.closest(".btn-remove-item");
  if (!btn) return;
  if (items.length <= 1) return;
  items = items.filter((it) => String(it.uid) !== String(btn.dataset.uid));
  renderItemsRows();
});

document.getElementById("items-rows").addEventListener("input", (e) => {
  const field = e.target.dataset.field;
  const uid = e.target.dataset.uid;
  if (!field || !uid) return;
  const it = findItem(uid);
  if (!it) return;
  it[field] = e.target.value;
});

document.getElementById("items-rows").addEventListener("change", async (e) => {
  const field = e.target.dataset.field;
  const uid = e.target.dataset.uid;
  if (!field || !uid) return;
  const it = findItem(uid);
  if (!it) return;
  it[field] = e.target.value;

  if (field === "sku") {
    const sku = it.sku.trim();
    it.grid = null;
    if (sku) {
      const dim = await getSkuDimension(sku);
      if (dim) {
        if (dim.weightKg != null && !it.weightKg) it.weightKg = dim.weightKg;
        if (dim.lengthCm != null && !it.lengthCm) it.lengthCm = dim.lengthCm;
        if (dim.widthCm != null && !it.widthCm) it.widthCm = dim.widthCm;
        if (dim.heightCm != null && !it.heightCm) it.heightCm = dim.heightCm;
      }
      if (anySkuZoneGridCarrier) {
        it.grid = await getSkuGrid(sku);
        it.variantType = ""; it.bracketLabel = "";
      }
    }
    renderItemsRows();
  } else if (field === "variantType") {
    it.bracketLabel = "";
    renderItemsRows();
  }
});

// ---------- build shared order input ----------

function num(v) { return v !== "" && v != null ? Number(v) : null; }

function buildSharedInput() {
  return {
    province: document.getElementById("in-province").value.trim(),
    postalCode: document.getElementById("in-postal").value.trim(),
    codAmount: num(document.getElementById("in-cod").value),
    shipDate: document.getElementById("in-shipdate").value || null,
    items: items.map((it) => ({
      sku: it.sku.trim() || null,
      quantity: num(it.quantity) || 1,
      actualWeightKg: num(it.weightKg),
      lengthCm: num(it.lengthCm), widthCm: num(it.widthCm), heightCm: num(it.heightCm),
      variantType: it.variantType || null, weightBracketLabel: it.bracketLabel || null,
    })),
  };
}

// ---------- compare ----------

function renderResults(rows) {
  const panel = document.getElementById("result-panel");
  const priced = rows.filter((r) => r.result.status === "CALCULATED").sort((a, b) => a.result.totalFreight - b.result.totalFreight);
  const cheapest = priced[0];
  const mostExpensive = priced[priced.length - 1];

  const summary = priced.length >= 2 ? `
    <div class="card" style="background:#e6f7ee;border:1px solid #b8e0c7;">
      <div style="font-size:0.95rem;">
        🟢 <strong>ถูกที่สุด:</strong> ${cheapest.label} — ${cheapest.result.totalFreight.toFixed(2)} บาท<br>
        🔴 <strong>แพงที่สุด:</strong> ${mostExpensive.label} — ${mostExpensive.result.totalFreight.toFixed(2)} บาท<br>
        💰 <strong>ประหยัดได้สูงสุด:</strong> ${(mostExpensive.result.totalFreight - cheapest.result.totalFreight).toFixed(2)} บาท
        (${(((mostExpensive.result.totalFreight - cheapest.result.totalFreight) / mostExpensive.result.totalFreight) * 100).toFixed(1)}%) ถ้าเลือก ${cheapest.label} แทน ${mostExpensive.label}
      </div>
    </div>` : "";

  const failed = rows.filter((r) => r.result.status !== "CALCULATED");
  const failedHTML = failed.length ? `
    <div class="card" style="background:#fff8e1;border:1px solid #ffe4a3;">
      ${failed.map((r) => `<div style="font-size:0.82rem;margin-bottom:4px;">🟡 <strong>${r.label}</strong>: ${r.result.errors?.[0]?.message || STATUS_LABEL[r.result.status]}${r.result.errors?.[0]?.availableTypes ? ` (${r.result.errors[0].availableTypes.join(", ")})` : ""}${r.result.errors?.[0]?.availableBrackets ? ` (${r.result.errors[0].availableBrackets.join(", ")})` : ""}</div>`).join("")}
    </div>` : "";

  panel.innerHTML = `
    ${summary}${failedHTML}
    <div class="card">
      <div class="section-title" style="font-size:0.95rem;">ผลเปรียบเทียบทั้งหมด</div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Carrier</th><th>สถานะ</th><th>ค่าขนส่งรวม</th><th>ต่างจากถูกที่สุด</th></tr></thead>
          <tbody>${rows.sort((a, b) => (a.result.totalFreight ?? Infinity) - (b.result.totalFreight ?? Infinity)).map((r) => `
            <tr style="${cheapest && r === cheapest ? "background:#e6f7ee;" : ""}${mostExpensive && r === mostExpensive && priced.length >= 2 ? "background:#fdecea;" : ""}">
              <td>${r.label}${cheapest && r === cheapest ? " 🟢" : ""}${mostExpensive && r === mostExpensive && priced.length >= 2 ? " 🔴" : ""}</td>
              <td><span class="badge ${STATUS_BADGE[r.result.status] || "badge-pending"}">${STATUS_LABEL[r.result.status] || r.result.status}</span></td>
              <td>${r.result.totalFreight != null ? r.result.totalFreight.toLocaleString(undefined, { minimumFractionDigits: 2 }) : "-"}</td>
              <td>${r.result.totalFreight != null && cheapest ? "+" + (r.result.totalFreight - cheapest.result.totalFreight).toFixed(2) : "-"}</td>
            </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`;
}

document.getElementById("btn-compare").addEventListener("click", async () => {
  const shared = buildSharedInput();
  if (!shared.province && !shared.postalCode) { toast({ type: "error", title: "กรุณาระบุจังหวัดหรือรหัสไปรษณีย์" }); return; }
  if (!shared.items.some((it) => it.sku || it.actualWeightKg)) { toast({ type: "error", title: "กรุณากรอก SKU หรือน้ำหนักอย่างน้อย 1 รายการ" }); return; }
  const btn = document.getElementById("btn-compare");
  btn.disabled = true; btn.textContent = "กำลังคำนวณ...";
  document.getElementById("result-panel").innerHTML = `<div class="card">${emptyStateHTML({ icon: "⏳", title: "กำลังคำนวณทุก Carrier..." })}</div>`;
  try {
    const jobs = [];
    for (const c of carriers.filter((c) => c.active !== false)) {
      const services = c.services?.length ? c.services : [null];
      for (const svc of services) {
        jobs.push({ carrier: c, service: svc, input: { ...shared, carrierId: c.id, serviceId: svc?.id || null } });
      }
    }
    if (!jobs.length) {
      document.getElementById("result-panel").innerHTML = `<div class="card">${emptyStateHTML({
        icon: "🚚", title: "ยังไม่มี Carrier ในระบบ",
        desc: "ต้องนำเข้าข้อมูลจาก Excel หรือเพิ่ม Carrier เองก่อน จึงจะเปรียบเทียบได้",
        actionLabel: "⬇️ ไปหน้านำเข้าจาก Excel", actionHref: "freight-import.html",
      })}</div>`;
      return;
    }
    const results = await Promise.all(jobs.map((j) => calculateOrderAndOptionallySave(j.input, profile, { save: false })));
    const rows = jobs.map((j, i) => ({
      label: `${j.carrier.name || j.carrier.id}${j.service ? " — " + j.service.name : ""}`,
      result: results[i].result,
    }));
    renderResults(rows);
  } catch (err) {
    toast({ type: "error", title: "เปรียบเทียบไม่สำเร็จ", desc: err.message });
  } finally {
    btn.disabled = false; btn.textContent = "⚖️ เปรียบเทียบทุก Carrier";
  }
});

// จังหวัด/รหัสไปรษณีย์: `province` is purely informational for the engine (zone lookup only
// ever uses postalCode), and one province covers many postal codes, so there's no honest
// single postal code to guess from a province name alone. Instead this offers a real,
// searchable list of (district+province, postal code) pairs from the imported Zone Mapping
// data — picking one fills the postal code exactly, never a guess.
document.getElementById("in-province").addEventListener("input", (e) => {
  const m = e.target.value.match(/—\s*(\d{5})\s*$/);
  if (m) document.getElementById("in-postal").value = m[1];
});

async function load() {
  carriers = await listCarriers();
  anySkuZoneGridCarrier = carriers.some((c) => c.active !== false && c.pricingStrategy === "SKU_ZONE_GRID");
  renderItemsRows();

  const zoneEntries = await listZoneMapEntries();
  document.getElementById("province-list").innerHTML = zoneEntries.map((z) => {
    const label = (z.districts?.length ? z.districts.join(" / ") : z.province) || "-";
    return `<option value="${escAttr(label)} — ${z.postalCode}"></option>`;
  }).join("");
}

await load();
</script>
</html>
