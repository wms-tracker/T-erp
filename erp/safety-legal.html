<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กฎหมายความปลอดภัย — KPO Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b;">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listLegalRegisters, getLegalRegister, createLegalRegister,
  updateLegalRegister, deleteLegalRegister,
  LEGAL_CATEGORIES, LEGAL_STATUS
} from "./js/safety-data.js";

const $ = id => document.getElementById(id);
let _profile, _regs = [];
let _editId = null;
let _search = '', _filterCat = '', _filterStatus = '';

function buildLayout() {
  document.getElementById('main-content').innerHTML = `
  <style>
    .lr{padding:0 20px 40px;max-width:1200px;margin:0 auto;}
    .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:20px 0 14px;}
    .page-title{font-size:1.2rem;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;}
    .btn{padding:7px 16px;border:none;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn-primary{background:#0891b2;color:#fff;} .btn-primary:hover{background:#0e7490;}
    .btn-ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;} .btn-ghost:hover{background:#e2e8f0;}
    .btn-sm{padding:5px 11px;font-size:.78rem;}
    .btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600;}
    .sum-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .sum-chip{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 16px;flex:1;min-width:100px;text-align:center;}
    .sum-chip .val{font-size:1.4rem;font-weight:800;}
    .sum-chip .lbl{font-size:.72rem;color:#94a3b8;margin-top:2px;}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .filter-bar input,.filter-bar select{padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.82rem;}
    .tbl-wrap{overflow-x:auto;}
    .tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
    .tbl th{text-align:left;padding:9px 12px;font-size:.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;background:#f8fafc;border-bottom:1.5px solid #e2e8f0;}
    .tbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;}
    .tbl tr:hover td{background:#f8fafc;cursor:pointer;}
    .empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
    .compliance-bar{height:8px;border-radius:4px;background:#e2e8f0;margin-top:6px;overflow:hidden;}
    .compliance-fill{height:100%;border-radius:4px;background:#16a34a;}
    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;}
    .modal-panel{background:#fff;height:100dvh;width:min(580px,100vw);overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;}
    .modal-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
    .modal-body{padding:20px;flex:1;}
    .modal-foot{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;}
    .form-group{margin-bottom:12px;}
    .form-label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:4px;}
    .req{color:#dc2626;}
    .form-ctrl{width:100%;padding:8px 11px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.85rem;color:#0f172a;box-sizing:border-box;}
    .form-ctrl:focus{outline:none;border-color:#0891b2;box-shadow:0 0 0 3px rgba(8,145,178,.1);}
    textarea.form-ctrl{resize:vertical;min-height:72px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
  </style>
  <div class="lr" id="mainView"></div>
  <div id="mBg" class="modal-bg" style="display:none" onclick="__closeModal(event)">
    <div class="modal-panel">
      <div class="modal-head"><div style="font-size:1rem;font-weight:700;color:#0f172a" id="mdTitle">—</div>
        <button class="btn btn-ghost btn-sm" onclick="__closeModal(null)">✕</button></div>
      <div class="modal-body" id="mdBody"></div>
      <div class="modal-foot" id="mdFoot"></div>
    </div>
  </div>`;
}

function renderView() {
  const filtered = _regs.filter(r => {
    if (_filterCat && r.category !== _filterCat) return false;
    if (_filterStatus && r.complianceStatus !== _filterStatus) return false;
    if (_search && !JSON.stringify(r).toLowerCase().includes(_search.toLowerCase())) return false;
    return true;
  });

  const total = _regs.length;
  const compliant    = _regs.filter(r=>r.complianceStatus==='compliant').length;
  const partial      = _regs.filter(r=>r.complianceStatus==='partial').length;
  const nonCompliant = _regs.filter(r=>r.complianceStatus==='non_compliant').length;
  const applicable   = total - _regs.filter(r=>r.complianceStatus==='not_applicable').length;
  const compliancePct = applicable > 0 ? Math.round(compliant/applicable*100) : 0;

  $('mainView').innerHTML = `
  <div class="page-header">
    <div class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 16h4"/><path d="M7 11h8"/><path d="M7 6h10"/></svg>
      ทะเบียนกฎหมายความปลอดภัย
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="__loadDefaults()">โหลดกฎหมายพื้นฐาน</button>
      <button class="btn btn-primary" onclick="__openForm(null)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        เพิ่มกฎหมาย/มาตรฐาน
      </button>
    </div>
  </div>

  <div class="sum-bar">
    <div class="sum-chip">
      <div class="val" style="color:${compliancePct>=80?'#16a34a':compliancePct>=60?'#d97706':'#dc2626'}">${compliancePct}%</div>
      <div class="lbl">ความสอดคล้อง</div>
      <div class="compliance-bar"><div class="compliance-fill" style="width:${compliancePct}%;background:${compliancePct>=80?'#16a34a':compliancePct>=60?'#d97706':'#dc2626'}"></div></div>
    </div>
    <div class="sum-chip"><div class="val">${total}</div><div class="lbl">รายการทั้งหมด</div></div>
    <div class="sum-chip"><div class="val" style="color:#16a34a">${compliant}</div><div class="lbl">สอดคล้อง</div></div>
    <div class="sum-chip"><div class="val" style="color:#d97706">${partial}</div><div class="lbl">บางส่วน</div></div>
    <div class="sum-chip"><div class="val" style="color:#dc2626">${nonCompliant}</div><div class="lbl">ไม่สอดคล้อง</div></div>
  </div>

  <div class="filter-bar">
    <input type="text" placeholder="ค้นหา..." oninput="__srch(this.value)" style="min-width:180px">
    <select onchange="__fCat(this.value)">
      <option value="">ทุกหมวดหมู่</option>
      ${LEGAL_CATEGORIES.map(c=>`<option value="${c}" ${_filterCat===c?'selected':''}>${c}</option>`).join('')}
    </select>
    <select onchange="__fSt(this.value)">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(LEGAL_STATUS).map(([k,v])=>`<option value="${k}" ${_filterStatus===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  </div>

  ${filtered.length === 0
    ? `<div class="empty-state"><div style="font-size:2.5rem">⚖️</div><div style="margin-top:8px">ยังไม่มีรายการกฎหมาย</div><div style="margin-top:4px;font-size:.8rem">กด "โหลดกฎหมายพื้นฐาน" เพื่อนำเข้ากฎหมายที่ใช้บ่อย</div></div>`
    : `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>กฎหมาย/มาตรฐาน</th><th>หมวดหมู่</th><th>ข้อกำหนด</th><th>ทบทวนล่าสุด</th><th>ทบทวนครั้งถัดไป</th><th>สถานะ</th><th>ผู้รับผิดชอบ</th><th></th></tr></thead>
      <tbody>
      ${filtered.map(r => {
        const s = LEGAL_STATUS[r.complianceStatus] || LEGAL_STATUS.under_review;
        const today = new Date().toISOString().split('T')[0];
        const overdue = r.nextReviewDate && r.nextReviewDate < today;
        return `<tr onclick="__openForm('${r.id}')">
          <td>
            <div style="font-weight:700">${r.lawName||'—'}</div>
            ${r.lawNo?`<div style="font-size:.72rem;color:#94a3b8">${r.lawNo}</div>`:''}
          </td>
          <td style="font-size:.78rem">${r.category||'—'}</td>
          <td style="font-size:.78rem;max-width:200px">${r.requirement||'—'}</td>
          <td>${r.lastReviewDate||'—'}</td>
          <td class="${overdue?'expire-warn':''}">${r.nextReviewDate||'—'}${overdue?' ⚠️':''}</td>
          <td><span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span></td>
          <td>${r.responsible||'—'}</td>
          <td onclick="event.stopPropagation()"><button class="btn btn-danger btn-sm" onclick="__del('${r.id}')">ลบ</button></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`}`;
}

async function openForm(id) {
  _editId = id;
  let r = id ? (_regs.find(x=>x.id===id) || await getLegalRegister(id)) : null;
  $('mdTitle').textContent = id ? 'แก้ไขทะเบียนกฎหมาย' : 'เพิ่มกฎหมาย/มาตรฐาน';
  $('mdBody').innerHTML = `
  <div class="form-group">
    <label class="form-label">ชื่อกฎหมาย/มาตรฐาน <span class="req">*</span></label>
    <input type="text" class="form-ctrl" id="fLaw" value="${r?.lawName||''}" placeholder="เช่น พ.ร.บ.ความปลอดภัย อาชีวอนามัย และสภาพแวดล้อมในการทำงาน">
  </div>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">เลขที่/ปีที่ออก</label>
      <input type="text" class="form-ctrl" id="fNo" value="${r?.lawNo||''}" placeholder="เช่น พ.ศ.2554">
    </div>
    <div class="form-group">
      <label class="form-label">หมวดหมู่ <span class="req">*</span></label>
      <select class="form-ctrl" id="fCat">
        ${LEGAL_CATEGORIES.map(c=>`<option value="${c}" ${r?.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">ข้อกำหนดที่เกี่ยวข้อง</label>
    <textarea class="form-ctrl" id="fReq">${r?.requirement||''}</textarea>
  </div>
  <div class="form-group">
    <label class="form-label">มาตรการปฏิบัติตาม</label>
    <textarea class="form-ctrl" id="fAction">${r?.actionsTaken||''}</textarea>
  </div>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">สถานะความสอดคล้อง</label>
      <select class="form-ctrl" id="fSt">
        ${Object.entries(LEGAL_STATUS).map(([k,v])=>`<option value="${k}" ${(r?.complianceStatus||'under_review')===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">ผู้รับผิดชอบ</label>
      <input type="text" class="form-ctrl" id="fResp" value="${r?.responsible||''}">
    </div>
    <div class="form-group">
      <label class="form-label">วันที่ทบทวนล่าสุด</label>
      <input type="date" class="form-ctrl" id="fLast" value="${r?.lastReviewDate||''}">
    </div>
    <div class="form-group">
      <label class="form-label">กำหนดทบทวนครั้งถัดไป</label>
      <input type="date" class="form-ctrl" id="fNext" value="${r?.nextReviewDate||''}">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">หมายเหตุ</label>
    <textarea class="form-ctrl" id="fNote" style="min-height:56px">${r?.note||''}</textarea>
  </div>`;
  $('mdFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__closeModal(null)">ยกเลิก</button>
    ${id?`<button class="btn btn-danger btn-sm" onclick="__del('${id}')">ลบ</button>`:''}
    <button class="btn btn-primary" id="mdSave" onclick="__save()">${id?'บันทึกการแก้ไข':'เพิ่ม'}</button>`;
  $('mBg').style.display = 'flex';
}

async function save() {
  const lawName = $('fLaw')?.value?.trim();
  const cat = $('fCat')?.value;
  if (!lawName || !cat) { showToast('กรุณาระบุชื่อกฎหมายและหมวดหมู่', '#dc2626'); return; }
  const data = {
    lawName, lawNo: $('fNo')?.value?.trim()||'', category: cat,
    requirement: $('fReq')?.value?.trim()||'', actionsTaken: $('fAction')?.value?.trim()||'',
    complianceStatus: $('fSt')?.value||'under_review', responsible: $('fResp')?.value?.trim()||'',
    lastReviewDate: $('fLast')?.value||'', nextReviewDate: $('fNext')?.value||'',
    note: $('fNote')?.value?.trim()||'',
  };
  const btn = $('mdSave'); btn.disabled=true; btn.textContent='กำลังบันทึก...';
  try {
    if (_editId) await updateLegalRegister(_editId, data);
    else await createLegalRegister(data, _profile.uid);
    _regs = await listLegalRegisters({ lim: 200 });
    closeModal(null); renderView();
    showToast('บันทึกแล้ว ✓', '#16a34a');
  } catch(e) { btn.disabled=false; btn.textContent=_editId?'บันทึกการแก้ไข':'เพิ่ม'; showToast(e.message,'#dc2626'); }
}

async function del(id) {
  if (!confirm('ลบรายการนี้?')) return;
  await deleteLegalRegister(id);
  _regs = await listLegalRegisters({ lim: 200 });
  closeModal(null); renderView();
  showToast('ลบแล้ว','#0891b2');
}

const DEFAULT_LAWS = [
  { lawName:'พ.ร.บ.ความปลอดภัย อาชีวอนามัย และสภาพแวดล้อมในการทำงาน', lawNo:'พ.ศ.2554', category:'พ.ร.บ. ความปลอดภัยฯ พ.ศ.2554', requirement:'นายจ้างต้องจัดให้มีเจ้าหน้าที่ความปลอดภัยในการทำงาน (จป.) และคณะกรรมการความปลอดภัย (คปอ.) ตามขนาดองค์กร', complianceStatus:'under_review' },
  { lawName:'กฎกระทรวงกำหนดมาตรฐานการบริหารจัดการด้านความปลอดภัยฯ', lawNo:'พ.ศ.2549', category:'กฎกระทรวง (สวัสดิการฯ)', requirement:'จัดทำแผนงานด้านความปลอดภัยฯ ประจำปี และรายงานสถิติอุบัติเหตุต่ออธิบดีกรมสวัสดิการฯ', complianceStatus:'under_review' },
  { lawName:'ประกาศกรมสวัสดิการฯ เรื่อง หลักเกณฑ์ วิธีการ และเงื่อนไข จป.วิชาชีพ', lawNo:'', category:'ประกาศกรม (แรงงาน)', requirement:'จป.วิชาชีพ ต้องผ่านการอบรมหลักสูตรที่กรมสวัสดิการรับรอง และปฏิบัติงานตามขอบเขตที่กำหนด', complianceStatus:'under_review' },
  { lawName:'กฎกระทรวงกำหนดมาตรฐานในการบริหาร จัดการ และดำเนินการด้านความปลอดภัย (ไฟฟ้า)', lawNo:'พ.ศ.2558', category:'กฎกระทรวง (สวัสดิการฯ)', requirement:'ติดตั้งระบบไฟฟ้าตามมาตรฐาน จัดให้มีการตรวจสอบและบำรุงรักษาระบบไฟฟ้าสม่ำเสมอ', complianceStatus:'under_review' },
  { lawName:'กฎกระทรวงกำหนดมาตรฐานในการบริหาร จัดการ และดำเนินการด้านความปลอดภัย (เคมี)', lawNo:'พ.ศ.2556', category:'กฎกระทรวง (สวัสดิการฯ)', requirement:'จัดทำ SDS จัดเก็บสารเคมีอย่างปลอดภัย จัดให้มี PPE สำหรับผู้ทำงานกับสารเคมี', complianceStatus:'under_review' },
];

async function loadDefaults() {
  if (!confirm(`โหลดกฎหมายพื้นฐาน ${DEFAULT_LAWS.length} รายการ?\n(รายการที่มีอยู่แล้วจะไม่ถูกลบ)`)) return;
  let added = 0;
  for (const law of DEFAULT_LAWS) {
    const exists = _regs.some(r => r.lawName === law.lawName);
    if (!exists) { await createLegalRegister(law, _profile.uid); added++; }
  }
  _regs = await listLegalRegisters({ lim: 200 });
  renderView();
  showToast(`เพิ่ม ${added} รายการแล้ว ✓`, '#16a34a');
}

function closeModal(e) { if (e && e.target!==$('mBg')) return; $('mBg').style.display='none'; }
function showToast(msg,color='#16a34a'){const el=document.createElement('div');el.style.cssText=`position:fixed;bottom:24px;right:24px;background:${color};color:#fff;padding:12px 20px;border-radius:10px;font-family:Sarabun,sans-serif;font-size:.85rem;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)`;el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500);}

window.__openForm=openForm; window.__save=save; window.__del=del;
window.__closeModal=closeModal; window.__loadDefaults=loadDefaults;
window.__srch=v=>{_search=v;renderView()};
window.__fCat=v=>{_filterCat=v;renderView()};
window.__fSt=v=>{_filterStatus=v;renderView()};

_profile = await requireRole(['safety_officer','kpo','admin','manager']);
renderShell(_profile, 'safety-legal', 'กฎหมายความปลอดภัย');
buildLayout();
_regs = await listLegalRegisters({ lim: 200 });
renderView();
</script>
</body>
</html>
