<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Module 07 — แผนฝึกอบรมความปลอดภัย</title>
<link rel="stylesheet" href="css/erp.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:4px solid #e2e8f0;text-align:center}
.kpi .num{font-size:1.6rem;font-weight:700;line-height:1}
.kpi .lbl{font-size:.72rem;color:#64748b;margin-top:4px}
.kpi.green{border-top-color:#059669}.kpi.green .num{color:#059669}
.kpi.blue{border-top-color:#2563eb}.kpi.blue .num{color:#2563eb}
.kpi.amber{border-top-color:#d97706}.kpi.amber .num{color:#d97706}
.kpi.purple{border-top-color:#7c3aed}.kpi.purple .num{color:#7c3aed}
.kpi.red{border-top-color:#dc2626}.kpi.red .num{color:#dc2626}
/* Filter bar */
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filter-select,.year-select{padding:7px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:.82rem;background:#fff;cursor:pointer;font-family:'Sarabun',sans-serif}
/* Card + Table */
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1f5f9}
.card-head h2{font-size:.95rem;font-weight:700;flex:1}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:8px 12px;background:#f8fafc;font-size:.74rem;color:#64748b;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.tbl td{padding:8px 12px;font-size:.82rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafc}
/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
/* Btn */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-size:.82rem;font-family:'Sarabun',sans-serif;font-weight:600;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-ghost{background:transparent;border:1px solid #d1d5db;color:#374151}.btn-ghost:hover{background:#f9fafb}
.btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}.btn-danger:hover{background:#fecaca}
/* Upcoming strip */
.upcoming-strip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;margin-bottom:16px}
.upcoming-strip h3{font-size:.8rem;font-weight:700;color:#1d4ed8;margin-bottom:8px}
.upcoming-item{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #dbeafe;font-size:.8rem}
.upcoming-item:last-child{border-bottom:none}
.upcoming-days{background:#2563eb;color:#fff;border-radius:6px;padding:2px 7px;font-size:.72rem;font-weight:700;white-space:nowrap}
/* Chart */
.chart-wrap{padding:16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{width:46px;font-size:.72rem;color:#64748b;flex-shrink:0;text-align:right}
.bar-track{flex:1;background:#f1f5f9;border-radius:4px;height:20px;overflow:hidden;display:flex}
.bar-seg{height:100%;transition:width .5s}
.bar-num{font-size:.7rem;color:#94a3b8;width:30px;flex-shrink:0}
/* Slide panel */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999}
.overlay.open{display:block}
.panel{position:fixed;top:0;right:-100%;width:min(620px,100vw);height:100vh;background:#fff;z-index:1000;overflow-y:auto;transition:right .3s;box-shadow:-4px 0 20px rgba(0,0,0,.12)}
.panel.open{right:0}
.panel-head{position:sticky;top:0;background:#fff;padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;z-index:1}
.panel-head h2{flex:1;font-size:.95rem;font-weight:700}
.panel-body{padding:20px}
/* Form */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:4px}
.form-input,.form-textarea,.form-select{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:.85rem;font-family:'Sarabun',sans-serif;background:#fff}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:2px solid #2563eb;border-color:#2563eb}
.form-textarea{min-height:68px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* Detail */
.dl-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:.82rem}
.dl-row:last-child{border-bottom:none}
/* Progress */
.prog-wrap{background:#f1f5f9;border-radius:4px;height:8px;overflow:hidden;margin-top:6px}
.prog-bar{height:100%;border-radius:4px;background:#059669;transition:width .5s}
/* Empty / spinner */
.empty{text-align:center;padding:36px 20px;color:#94a3b8;font-size:.85rem}
.spinner{text-align:center;padding:36px;color:#94a3b8;font-size:.88rem}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  listTrainings, getTraining, createTraining, updateTraining, deleteTraining,
  TRAINING_STATUS, TRAINING_TYPES, DEPARTMENTS
} from './js/safety-data.js';
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo','admin','manager']);
const main = renderShell(profile, 'kpo-training', 'Module 07 — แผนฝึกอบรมความปลอดภัย');

const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const NOW     = new Date();
const NOW_CE  = NOW.getFullYear();
const NOW_BE  = NOW_CE + 543;

let allTrainings = [];
let filterYear   = NOW_CE;
let filterStatus = '';
let filterType   = '';
let editingId    = null;

/* ───── helpers ───── */
function fmtDate(iso) {
  if (!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${parseInt(y)+543}`;
}

function statusBadge(s) {
  const st = TRAINING_STATUS[s] || { label: s, color:'#6b7280', bg:'#f9fafb' };
  return `<span class="badge" style="background:${st.bg};color:${st.color}">${st.label}</span>`;
}

function typeLabel(k) {
  return TRAINING_TYPES.find(t => t.key === k)?.label || k || '-';
}

function daysUntil(isoDate) {
  if (!isoDate) return null;
  return Math.ceil((new Date(isoDate) - NOW) / 86400000);
}

/* ───── SHELL ───── */
main.innerHTML = `
<div style="padding:20px">
  <div id="kpi-row" class="kpi-row"></div>
  <div id="upcoming-wrap"></div>
  <div class="filter-bar">
    <select class="year-select" id="f-year" onchange="window._filter()">
      ${[NOW_CE-1,NOW_CE,NOW_CE+1].map(y=>`<option value="${y}"${y===NOW_CE?' selected':''}>${y+543}</option>`).join('')}
      <option value="">ทุกปี</option>
    </select>
    <select class="filter-select" id="f-status" onchange="window._filter()">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(TRAINING_STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
    </select>
    <select class="filter-select" id="f-type" onchange="window._filter()">
      <option value="">ทุกประเภท</option>
      ${TRAINING_TYPES.map(t=>`<option value="${t.key}">${t.label}</option>`).join('')}
    </select>
  </div>
  <div class="card">
    <div class="card-head">
      <h2>📚 รายการฝึกอบรม</h2>
      <button class="btn btn-primary btn-sm" onclick="window._openForm()">➕ เพิ่มแผนอบรม</button>
    </div>
    <div id="tbl-wrap"><div class="spinner">กำลังโหลด...</div></div>
  </div>
  <div class="card">
    <div class="card-head"><h2>📊 สรุปรายเดือน</h2></div>
    <div id="chart-wrap" class="chart-wrap"><div class="spinner">กำลังโหลด...</div></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="window._closePanel()"></div>
<div class="panel" id="panelForm">
  <div class="panel-head">
    <h2 id="form-title">➕ เพิ่มแผนอบรม</h2>
    <button class="btn btn-ghost btn-sm" onclick="window._closePanel()">✕ ปิด</button>
  </div>
  <div class="panel-body" id="panelFormBody"></div>
</div>
<div class="panel" id="panelDetail">
  <div class="panel-head">
    <h2>📋 รายละเอียดการอบรม</h2>
    <button class="btn btn-ghost btn-sm" onclick="window._closePanel()">✕ ปิด</button>
  </div>
  <div class="panel-body" id="panelDetailBody"></div>
</div>`;

/* ───── FILTER ───── */
window._filter = () => {
  filterYear   = document.getElementById('f-year')?.value;
  filterStatus = document.getElementById('f-status')?.value || '';
  filterType   = document.getElementById('f-type')?.value  || '';
  renderTable();
  renderChart();
};

function filtered() {
  return allTrainings.filter(r => {
    if (filterYear && !r.trainingDate?.startsWith(filterYear)) return false;
    if (filterStatus && r.status !== filterStatus) return false;
    if (filterType   && r.trainingType !== filterType)   return false;
    return true;
  });
}

/* ───── KPI ───── */
function renderKPI() {
  const yearRecs = filterYear
    ? allTrainings.filter(r => r.trainingDate?.startsWith(filterYear))
    : allTrainings;
  const total     = yearRecs.length;
  const completed = yearRecs.filter(r => r.status === 'completed').length;
  const planned   = yearRecs.filter(r => r.status === 'planned').length;
  const pct       = total ? Math.round(completed/total*100) : 0;
  const participants = yearRecs.filter(r=>r.status==='completed')
    .reduce((s,r)=>s+(r.actualParticipants||r.targetParticipants||0),0);

  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi blue"><div class="num">${total}</div><div class="lbl">แผนอบรมทั้งหมด</div></div>
    <div class="kpi green"><div class="num">${completed}</div><div class="lbl">เสร็จแล้ว</div></div>
    <div class="kpi ${pct>=80?'green':pct>=50?'amber':'red'}">
      <div class="num">${pct}%</div><div class="lbl">%สำเร็จ</div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
    </div>
    <div class="kpi amber"><div class="num">${planned}</div><div class="lbl">รอดำเนินการ</div></div>
    <div class="kpi purple"><div class="num">${participants}</div><div class="lbl">ผู้เข้าอบรมรวม (คน)</div></div>`;
}

/* ───── UPCOMING ───── */
function renderUpcoming() {
  const upcoming = allTrainings
    .filter(r => r.status === 'planned' && r.trainingDate)
    .map(r => ({ ...r, days: daysUntil(r.trainingDate) }))
    .filter(r => r.days !== null && r.days >= 0 && r.days <= 30)
    .sort((a,b) => a.days - b.days)
    .slice(0, 5);

  const wrap = document.getElementById('upcoming-wrap');
  if (!upcoming.length) { wrap.innerHTML = ''; return; }

  wrap.innerHTML = `<div class="upcoming-strip">
    <h3>🔔 กำลังจะมาถึงใน 30 วัน (${upcoming.length} รายการ)</h3>
    ${upcoming.map(r => `
    <div class="upcoming-item">
      <span class="upcoming-days">${r.days===0?'วันนี้':r.days+' วัน'}</span>
      <span style="flex:1">${r.courseName||'-'}</span>
      <span style="font-size:.75rem;color:#3b82f6">${fmtDate(r.trainingDate)}</span>
    </div>`).join('')}
  </div>`;
}

/* ───── TABLE ───── */
function renderTable() {
  const rows = filtered();
  const wrap = document.getElementById('tbl-wrap');
  if (!rows.length) { wrap.innerHTML = '<div class="empty">📭 ไม่มีรายการที่ตรงกับเงื่อนไข</div>'; return; }

  wrap.innerHTML = `<div style="overflow-x:auto"><table class="tbl">
    <thead><tr>
      <th>วันที่อบรม</th>
      <th>หลักสูตร</th>
      <th>ประเภท</th>
      <th>สถานที่</th>
      <th style="text-align:center">เป้าหมาย</th>
      <th style="text-align:center">จริง</th>
      <th>สถานะ</th>
      <th></th>
    </tr></thead>
    <tbody>
    ${rows.map(r => `<tr>
      <td style="white-space:nowrap">${fmtDate(r.trainingDate)}</td>
      <td style="font-weight:600;max-width:200px">${r.courseName||'-'}</td>
      <td style="font-size:.76rem;color:#64748b">${typeLabel(r.trainingType)}</td>
      <td style="font-size:.78rem">${r.venue||'-'}</td>
      <td style="text-align:center">${r.targetParticipants||'-'}</td>
      <td style="text-align:center;font-weight:700;color:${r.status==='completed'?(r.actualParticipants>=(r.targetParticipants||0)?'#059669':'#d97706'):'#94a3b8'}">${r.status==='completed'?(r.actualParticipants??'-'):'-'}</td>
      <td>${statusBadge(r.status||'planned')}</td>
      <td style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-sm" onclick="window._view('${r.id}')">ดู</button>
        <button class="btn btn-ghost btn-sm" onclick="window._editForm('${r.id}')">✏️</button>
      </td>
    </tr>`).join('')}
    </tbody>
  </table></div>`;
}

/* ───── CHART ───── */
function renderChart() {
  const rows = filtered();
  const counts = Array(12).fill(0).map(() => ({ planned:0, completed:0 }));
  rows.forEach(r => {
    if (!r.trainingDate) return;
    const m = parseInt(r.trainingDate.slice(5,7)) - 1;
    if (m < 0 || m > 11) return;
    if (r.status === 'completed') counts[m].completed++;
    else counts[m].planned++;
  });
  const maxVal = Math.max(1, ...counts.map(c => c.planned + c.completed));

  document.getElementById('chart-wrap').innerHTML =
    counts.map((c,i) => {
      const doneW = Math.round(c.completed/maxVal*100);
      const planW = Math.round(c.planned/maxVal*100);
      const total = c.planned + c.completed;
      return `<div class="bar-row">
        <div class="bar-label">${THAI_MONTHS[i]}</div>
        <div class="bar-track">
          ${c.completed>0?`<div class="bar-seg" style="width:${doneW}%;background:#059669"></div>`:''}
          ${c.planned>0  ?`<div class="bar-seg" style="width:${planW}%;background:#2563eb;opacity:.6"></div>`:''}
        </div>
        <div class="bar-num">${total||''}</div>
      </div>`;
    }).join('') +
    `<div style="display:flex;gap:16px;margin-top:10px;font-size:.72rem">
      <span><span style="display:inline-block;width:12px;height:12px;background:#059669;border-radius:2px;vertical-align:middle;margin-right:4px"></span>เสร็จแล้ว</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#2563eb;opacity:.6;border-radius:2px;vertical-align:middle;margin-right:4px"></span>วางแผนแล้ว</span>
    </div>`;
}

/* ───── PANEL HELPERS ───── */
function openPanel(id) {
  document.getElementById('overlay').classList.add('open');
  document.getElementById(id).classList.add('open');
}
window._closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
  editingId = null;
};

/* ───── FORM ───── */
function buildForm(r = {}) {
  const typeOpts = TRAINING_TYPES.map(t =>
    `<option value="${t.key}"${r.trainingType===t.key?' selected':''}>${t.label}</option>`).join('');
  const deptOpts = ['ทุกแผนก',...(DEPARTMENTS||[])].map(d=>
    `<option value="${d}"${r.department===d?' selected':''}>${d}</option>`).join('');
  const statusOpts = Object.entries(TRAINING_STATUS).map(([k,v])=>
    `<option value="${k}"${(r.status||'planned')===k?' selected':''}>${v.label}</option>`).join('');

  return `
  <div class="form-group">
    <label class="form-label">ชื่อหลักสูตร *</label>
    <input type="text" id="f-course" class="form-input" value="${r.courseName||''}" placeholder="เช่น อบรมการใช้ Forklift ประจำปี"/>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">ประเภทการอบรม</label>
      <select id="f-type2" class="form-select"><option value="">-- เลือก --</option>${typeOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">แผนก</label>
      <select id="f-dept" class="form-select">${deptOpts}</select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">วันที่อบรม *</label>
      <input type="date" id="f-date" class="form-input" value="${r.trainingDate||''}"/>
    </div>
    <div class="form-group">
      <label class="form-label">วันที่สิ้นสุด (ถ้ามี)</label>
      <input type="date" id="f-end" class="form-input" value="${r.endDate||''}"/>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">สถานที่</label>
      <input type="text" id="f-venue" class="form-input" value="${r.venue||''}" placeholder="ห้องประชุม / สถานที่"/>
    </div>
    <div class="form-group">
      <label class="form-label">วิทยากร</label>
      <input type="text" id="f-trainer" class="form-input" value="${r.trainer||''}" placeholder="ชื่อวิทยากร / หน่วยงาน"/>
    </div>
  </div>
  <div class="form-row3">
    <div class="form-group">
      <label class="form-label">เป้าหมาย (คน)</label>
      <input type="number" id="f-target" class="form-input" value="${r.targetParticipants||''}" min="0" placeholder="0"/>
    </div>
    <div class="form-group">
      <label class="form-label">จริง (คน)</label>
      <input type="number" id="f-actual" class="form-input" value="${r.actualParticipants||''}" min="0" placeholder="0"/>
    </div>
    <div class="form-group">
      <label class="form-label">ผ่านทดสอบ (คน)</label>
      <input type="number" id="f-pass" class="form-input" value="${r.passCount||''}" min="0" placeholder="0"/>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">สถานะ</label>
      <select id="f-status2" class="form-select">${statusOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">งบประมาณ (บาท)</label>
      <input type="number" id="f-budget" class="form-input" value="${r.budget||''}" min="0" placeholder="0"/>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">หมายเหตุ</label>
    <textarea id="f-remark" class="form-textarea">${r.remark||''}</textarea>
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:4px">
    ${editingId ? `<button class="btn btn-danger btn-sm" onclick="window._del()">🗑 ลบ</button><div style="flex:1"></div>` : ''}
    <button class="btn btn-ghost" onclick="window._closePanel()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="window._save()">💾 บันทึก</button>
  </div>`;
}

window._openForm = () => {
  editingId = null;
  document.getElementById('form-title').textContent = '➕ เพิ่มแผนอบรม';
  document.getElementById('panelFormBody').innerHTML = buildForm();
  openPanel('panelForm');
};

window._editForm = async (id) => {
  editingId = id;
  document.getElementById('form-title').textContent = '✏️ แก้ไขแผนอบรม';
  document.getElementById('panelFormBody').innerHTML = '<div class="spinner">กำลังโหลด...</div>';
  openPanel('panelForm');
  const r = await getTraining(id);
  document.getElementById('panelFormBody').innerHTML = buildForm(r||{});
};

window._save = async () => {
  const course  = document.getElementById('f-course')?.value?.trim();
  const date    = document.getElementById('f-date')?.value;
  if (!course || !date) { alert('กรุณากรอก ชื่อหลักสูตร และ วันที่อบรม'); return; }

  const payload = {
    courseName:          course,
    trainingType:        document.getElementById('f-type2')?.value  || '',
    department:          document.getElementById('f-dept')?.value   || '',
    trainingDate:        date,
    endDate:             document.getElementById('f-end')?.value    || '',
    venue:               document.getElementById('f-venue')?.value?.trim() || '',
    trainer:             document.getElementById('f-trainer')?.value?.trim() || '',
    targetParticipants:  Number(document.getElementById('f-target')?.value)  || 0,
    actualParticipants:  Number(document.getElementById('f-actual')?.value)  || 0,
    passCount:           Number(document.getElementById('f-pass')?.value)    || 0,
    budget:              Number(document.getElementById('f-budget')?.value)  || 0,
    status:              document.getElementById('f-status2')?.value || 'planned',
    remark:              document.getElementById('f-remark')?.value?.trim() || '',
    kpoDuty:             'duty7',
  };

  try {
    if (editingId) {
      await updateTraining(editingId, payload);
    } else {
      await createTraining(payload, profile.uid);
    }
    window._closePanel();
    await load();
  } catch(e) { alert('บันทึกไม่ได้: ' + (e?.message||e)); }
};

window._del = async () => {
  if (!editingId) return;
  if (!confirm('ลบรายการนี้?')) return;
  try {
    await deleteTraining(editingId);
    window._closePanel();
    await load();
  } catch(e) { alert('ลบไม่ได้: ' + (e?.message||e)); }
};

/* ───── DETAIL ───── */
window._view = async (id) => {
  document.getElementById('panelDetailBody').innerHTML = '<div class="spinner">กำลังโหลด...</div>';
  openPanel('panelDetail');
  try {
    const r = await getTraining(id);
    if (!r) { document.getElementById('panelDetailBody').innerHTML = '<div class="empty">ไม่พบข้อมูล</div>'; return; }
    const actual = r.actualParticipants || 0;
    const target = r.targetParticipants || 0;
    const pct = target ? Math.min(100, Math.round(actual/target*100)) : 0;
    const passRate = actual ? Math.round((r.passCount||0)/actual*100) : 0;

    document.getElementById('panelDetailBody').innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-size:1.05rem;font-weight:700;margin-bottom:6px">${r.courseName||'-'}</div>
      ${statusBadge(r.status||'planned')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
      <div style="background:#eff6ff;border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:1.3rem;font-weight:700;color:#2563eb">${target||'-'}</div>
        <div style="font-size:.7rem;color:#64748b">เป้าหมาย (คน)</div>
      </div>
      <div style="background:#f0fdf4;border-radius:8px;padding:12px;text-align:center">
        <div style="font-size:1.3rem;font-weight:700;color:#059669">${actual||'-'}</div>
        <div style="font-size:.7rem;color:#64748b">เข้าอบรมจริง (คน)</div>
      </div>
    </div>
    ${target>0?`<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:3px"><span>% การเข้าร่วม</span><span style="font-weight:700;color:${pct>=100?'#059669':pct>=80?'#d97706':'#dc2626'}">${pct}%</span></div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:${pct>=100?'#059669':pct>=80?'#d97706':'#dc2626'}"></div></div>
    </div>`:''}
    ${actual>0?`<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;font-size:.75rem;margin-bottom:3px"><span>% ผ่านการทดสอบ</span><span style="font-weight:700;color:#7c3aed">${passRate}%</span></div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${passRate}%;background:#7c3aed"></div></div>
    </div>`:''}
    <hr style="border:none;border-top:1px solid #e2e8f0;margin:12px 0"/>
    <div class="dl-row"><span>ประเภท</span><span>${typeLabel(r.trainingType)}</span></div>
    <div class="dl-row"><span>วันที่</span><span>${fmtDate(r.trainingDate)}${r.endDate?' – '+fmtDate(r.endDate):''}</span></div>
    <div class="dl-row"><span>สถานที่</span><span>${r.venue||'-'}</span></div>
    <div class="dl-row"><span>วิทยากร</span><span>${r.trainer||'-'}</span></div>
    <div class="dl-row"><span>แผนก</span><span>${r.department||'-'}</span></div>
    <div class="dl-row"><span>ผ่านทดสอบ</span><span style="font-weight:700;color:#7c3aed">${r.passCount||0} คน</span></div>
    <div class="dl-row"><span>งบประมาณ</span><span>${r.budget?r.budget.toLocaleString()+' บาท':'-'}</span></div>
    ${r.remark?`<div style="margin-top:12px;background:#f8fafc;border-radius:8px;padding:10px;font-size:.8rem;color:#374151">${r.remark}</div>`:''}
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-ghost" style="flex:1" onclick="window._closePanel();window._editForm('${r.id}')">✏️ แก้ไข</button>
    </div>`;
  } catch(e) {
    document.getElementById('panelDetailBody').innerHTML = `<div style="color:#991b1b">โหลดไม่ได้: ${e?.message||e}</div>`;
  }
};

/* ───── LOAD ───── */
async function load() {
  try {
    allTrainings = await listTrainings({ lim: 300 });
    renderKPI();
    renderUpcoming();
    renderTable();
    renderChart();
  } catch(e) {
    main.innerHTML = `<div style="margin:20px;background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:20px;color:#991b1b">
      ⚠️ โหลดข้อมูลไม่ได้: ${e?.message||e}
    </div>`;
  }
}

await load();
</script>
