<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Module 05 — กฎระเบียบและเอกสาร</title>
<link rel="stylesheet" href="css/erp.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:4px solid #e2e8f0;text-align:center}
.kpi .num{font-size:1.5rem;font-weight:700;line-height:1}
.kpi .lbl{font-size:.7rem;color:#64748b;margin-top:3px}
.kpi.green{border-top-color:#059669}.kpi.green .num{color:#059669}
.kpi.blue{border-top-color:#2563eb}.kpi.blue .num{color:#2563eb}
.kpi.red{border-top-color:#dc2626}.kpi.red .num{color:#dc2626}
.kpi.amber{border-top-color:#d97706}.kpi.amber .num{color:#d97706}
.kpi.purple{border-top-color:#7c3aed}.kpi.purple .num{color:#7c3aed}
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1f5f9;flex-wrap:wrap}
.card-head h2{font-size:.95rem;font-weight:700;flex:1}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:5px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.8rem;font-family:'Sarabun',sans-serif;background:#fff}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:8px 12px;background:#f8fafc;font-size:.74rem;color:#64748b;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.tbl td{padding:8px 12px;font-size:.82rem;border-bottom:1px solid #f1f5f9;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafc}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-size:.82rem;font-family:'Sarabun',sans-serif;font-weight:600;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-ghost{background:transparent;border:1px solid #d1d5db;color:#374151}.btn-ghost:hover{background:#f9fafb}
.btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999}
.overlay.open{display:block}
.panel{position:fixed;top:0;right:-100%;width:min(620px,100vw);height:100vh;background:#fff;z-index:1000;overflow-y:auto;transition:right .3s;box-shadow:-4px 0 20px rgba(0,0,0,.12)}
.panel.open{right:0}
.panel-head{position:sticky;top:0;background:#fff;padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;z-index:1}
.panel-head h2{flex:1;font-size:.95rem;font-weight:700}
.panel-body{padding:20px}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:4px}
.form-input,.form-textarea,.form-select{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:.85rem;font-family:'Sarabun',sans-serif;background:#fff}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:2px solid #2563eb;border-color:#2563eb}
.form-textarea{min-height:72px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.empty{text-align:center;padding:36px 20px;color:#94a3b8;font-size:.85rem}
.spinner{text-align:center;padding:36px;color:#94a3b8;font-size:.88rem}
.detail-row{display:flex;gap:8px;margin-bottom:10px;font-size:.85rem}
.detail-row .dl{font-weight:600;color:#374151;min-width:100px}
.detail-row .dv{color:#1e293b}
.section-title{font-size:.8rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;border-bottom:1px solid #f1f5f9;padding-bottom:4px}
.review-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  listLegalRegisters, getLegalRegister,
  createLegalRegister, updateLegalRegister, deleteLegalRegister,
  LEGAL_CATEGORIES, LEGAL_STATUS
} from './js/safety-data.js';

const profile = await requireRole(['safety_officer','kpo','admin','manager']);
const main = renderShell(profile, 'kpo-rules', 'Module 05 — กฎระเบียบและเอกสาร');

const TODAY = new Date().toISOString().slice(0,10);
function fmtDate(iso) {
  if (!iso) return '-';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${parseInt(y)+543}`;
}
function statusBadge(s) {
  const st = LEGAL_STATUS[s];
  if (!st) return `<span class="badge" style="background:#f1f5f9;color:#64748b">${s||'-'}</span>`;
  return `<span class="badge" style="background:${st.bg};color:${st.color}">${st.label}</span>`;
}
function reviewStatus(dateStr) {
  if (!dateStr) return '';
  const diff = Math.ceil((new Date(dateStr)-new Date())/86400000);
  if (diff < 0)  return `<span class="review-chip" style="background:#fee2e2;color:#dc2626">⚠️ เกินกำหนด ${Math.abs(diff)} วัน</span>`;
  if (diff <= 30) return `<span class="review-chip" style="background:#fef3c7;color:#d97706">⏰ ครบ ${diff} วัน</span>`;
  return '';
}

let records = [], editId = null;
let filterCat = '', filterStatus = '';

/* ───── SHELL ───── */
main.innerHTML = `
<div style="padding:20px">
  <div id="kpi-row" class="kpi-row"></div>
  <div class="card">
    <div class="card-head">
      <h2>📋 ทะเบียนกฎหมาย/ข้อกำหนดด้านความปลอดภัย</h2>
      <div class="filter-bar">
        <select id="f-cat" onchange="window._filter()">
          <option value="">ทุกหมวด</option>
          ${LEGAL_CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
        </select>
        <select id="f-status" onchange="window._filter()">
          <option value="">ทุกสถานะ</option>
          ${Object.entries(LEGAL_STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}
        </select>
        <input type="text" id="f-search" placeholder="ค้นหา..." oninput="window._filter()" style="min-width:120px"/>
      </div>
      <button class="btn btn-primary btn-sm" onclick="window._openAdd()">➕ เพิ่มรายการ</button>
    </div>
    <div id="tbl-wrap"><div class="spinner">กำลังโหลด...</div></div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="window._closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <h2 id="panel-title">เพิ่มรายการ</h2>
    <button class="btn btn-ghost btn-sm" onclick="window._closePanel()">✕ ปิด</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</div>`;

function openPanel(){document.getElementById('overlay').classList.add('open');document.getElementById('panel').classList.add('open');}
window._closePanel=()=>{document.getElementById('overlay').classList.remove('open');document.getElementById('panel').classList.remove('open');editId=null;};

window._filter = () => {
  filterCat    = document.getElementById('f-cat')?.value    || '';
  filterStatus = document.getElementById('f-status')?.value || '';
  const search = (document.getElementById('f-search')?.value || '').toLowerCase();
  renderTable(records.filter(r =>
    (!filterCat    || r.category === filterCat) &&
    (!filterStatus || r.status   === filterStatus) &&
    (!search       || (r.lawName||'').toLowerCase().includes(search) || (r.description||'').toLowerCase().includes(search))
  ));
};

function renderKPIs(data) {
  const total = data.length;
  const comp  = data.filter(r=>r.status==='compliant').length;
  const nonComp = data.filter(r=>r.status==='non_compliant').length;
  const partial = data.filter(r=>r.status==='partial').length;
  const pct = total ? Math.round(comp/total*100) : 0;
  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi blue"><div class="num">${total}</div><div class="lbl">ทั้งหมด</div></div>
    <div class="kpi green"><div class="num">${comp}</div><div class="lbl">สอดคล้อง</div></div>
    <div class="kpi amber"><div class="num">${partial}</div><div class="lbl">บางส่วน</div></div>
    <div class="kpi red"><div class="num">${nonComp}</div><div class="lbl">ไม่สอดคล้อง</div></div>
    <div class="kpi purple"><div class="num">${pct}%</div><div class="lbl">อัตราสอดคล้อง</div></div>`;
}

function renderTable(data) {
  const wrap = document.getElementById('tbl-wrap');
  if (!data.length) { wrap.innerHTML='<div class="empty">📭 ไม่พบรายการ</div>'; return; }
  wrap.innerHTML = `<div style="overflow-x:auto"><table class="tbl">
    <thead><tr>
      <th style="min-width:160px">กฎหมาย/ข้อกำหนด</th>
      <th>หมวด</th>
      <th>สถานะ</th>
      <th>วันบังคับใช้</th>
      <th>ทบทวนครั้งถัดไป</th>
      <th>ผู้รับผิดชอบ</th>
      <th></th>
    </tr></thead>
    <tbody>
    ${data.map(r=>`<tr>
      <td><div style="font-weight:600;line-height:1.3">${r.lawName||'-'}</div>
          <div style="font-size:.72rem;color:#64748b">${r.lawCode||''}</div>
          ${reviewStatus(r.reviewDate)}
      </td>
      <td style="font-size:.76rem;color:#64748b">${r.category||'-'}</td>
      <td>${statusBadge(r.status||'under_review')}</td>
      <td style="white-space:nowrap">${fmtDate(r.effectiveDate)}</td>
      <td style="white-space:nowrap">${fmtDate(r.reviewDate)}</td>
      <td style="font-size:.78rem">${r.responsible||'-'}</td>
      <td style="display:flex;gap:4px">
        <button class="btn btn-ghost btn-sm" onclick="window._view('${r.id}')">👁</button>
        <button class="btn btn-ghost btn-sm" onclick="window._edit('${r.id}')">✏️</button>
        <button class="btn btn-danger btn-sm" onclick="window._del('${r.id}')">🗑</button>
      </td>
    </tr>`).join('')}
    </tbody>
  </table></div>`;
}

window._openAdd = () => {
  editId=null;
  document.getElementById('panel-title').textContent = '➕ เพิ่มกฎหมาย/ข้อกำหนด';
  document.getElementById('panel-body').innerHTML = buildForm();
  openPanel();
};
window._edit = (id) => {
  editId=id;
  const r=records.find(x=>x.id===id)||{};
  document.getElementById('panel-title').textContent = '✏️ แก้ไข';
  document.getElementById('panel-body').innerHTML = buildForm(r);
  openPanel();
};
window._view = (id) => {
  const r=records.find(x=>x.id===id);
  if (!r) return;
  document.getElementById('panel-title').textContent = '📋 รายละเอียด';
  document.getElementById('panel-body').innerHTML = `
  <div class="detail-row"><div class="dl">ชื่อกฎหมาย</div><div class="dv">${r.lawName||'-'}</div></div>
  <div class="detail-row"><div class="dl">รหัส/เลขที่</div><div class="dv">${r.lawCode||'-'}</div></div>
  <div class="detail-row"><div class="dl">หมวด</div><div class="dv">${r.category||'-'}</div></div>
  <div class="detail-row"><div class="dl">สถานะ</div><div class="dv">${statusBadge(r.status)}</div></div>
  <div class="detail-row"><div class="dl">วันบังคับใช้</div><div class="dv">${fmtDate(r.effectiveDate)}</div></div>
  <div class="detail-row"><div class="dl">ทบทวนถัดไป</div><div class="dv">${fmtDate(r.reviewDate)}</div></div>
  <div class="detail-row"><div class="dl">ผู้รับผิดชอบ</div><div class="dv">${r.responsible||'-'}</div></div>
  <div class="section-title">สาระสำคัญ</div>
  <p style="font-size:.85rem;line-height:1.7">${r.description||'(ไม่มี)'}</p>
  <div class="section-title">มาตรการ / การดำเนินการ</div>
  <p style="font-size:.85rem;line-height:1.7">${r.action||'(ไม่มี)'}</p>
  ${r.docUrl?`<div style="margin-top:16px"><a href="${r.docUrl}" target="_blank" class="btn btn-ghost btn-sm">📎 ดูเอกสาร</a></div>`:''}
  <div style="margin-top:20px;display:flex;gap:8px">
    <button class="btn btn-primary btn-sm" onclick="window._edit('${r.id}')">✏️ แก้ไข</button>
    <button class="btn btn-ghost btn-sm" onclick="window._closePanel()">ปิด</button>
  </div>`;
  openPanel();
};

function buildForm(r={}) {
  const catOpts = LEGAL_CATEGORIES.map(c=>`<option value="${c}"${r.category===c?' selected':''}>${c}</option>`).join('');
  const stOpts  = Object.entries(LEGAL_STATUS).map(([k,v])=>
    `<option value="${k}"${(r.status||'under_review')===k?' selected':''}>${v.label}</option>`).join('');
  return `
  <div class="form-group">
    <label class="form-label">ชื่อกฎหมาย/ข้อกำหนด *</label>
    <input type="text" id="f-name" class="form-input" value="${r.lawName||''}" placeholder="เช่น พ.ร.บ. ความปลอดภัยฯ 2554"/>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">รหัส/เลขที่</label>
      <input type="text" id="f-code" class="form-input" value="${r.lawCode||''}" placeholder="เช่น มาตรา 16"/>
    </div>
    <div class="form-group">
      <label class="form-label">หมวด *</label>
      <select id="f-cat" class="form-select"><option value="">-- เลือก --</option>${catOpts}</select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">วันที่บังคับใช้</label>
      <input type="date" id="f-eff" class="form-input" value="${r.effectiveDate||''}"/>
    </div>
    <div class="form-group">
      <label class="form-label">ทบทวนถัดไป</label>
      <input type="date" id="f-rev" class="form-input" value="${r.reviewDate||''}"/>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">สถานะการปฏิบัติตาม</label>
      <select id="f-status" class="form-select">${stOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">ผู้รับผิดชอบ</label>
      <input type="text" id="f-resp" class="form-input" value="${r.responsible||''}" placeholder="ชื่อ / ตำแหน่ง"/>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">สาระสำคัญ / ข้อกำหนด</label>
    <textarea id="f-desc" class="form-textarea">${r.description||''}</textarea>
  </div>
  <div class="form-group">
    <label class="form-label">มาตรการ / การดำเนินการ</label>
    <textarea id="f-action" class="form-textarea">${r.action||''}</textarea>
  </div>
  <div class="form-group">
    <label class="form-label">ลิงก์เอกสาร (URL)</label>
    <input type="url" id="f-url" class="form-input" value="${r.docUrl||''}" placeholder="https://..."/>
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end">
    <button class="btn btn-ghost" onclick="window._closePanel()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="window._save()">💾 บันทึก</button>
  </div>`;
}

window._save = async () => {
  const name = document.getElementById('f-name')?.value?.trim();
  const cat  = document.getElementById('f-cat')?.value;
  if (!name || !cat) { alert('กรุณากรอก ชื่อกฎหมาย และ หมวด'); return; }
  const payload = {
    lawName:       name,
    lawCode:       document.getElementById('f-code')?.value?.trim()   || '',
    category:      cat,
    effectiveDate: document.getElementById('f-eff')?.value            || '',
    reviewDate:    document.getElementById('f-rev')?.value            || '',
    status:        document.getElementById('f-status')?.value         || 'under_review',
    responsible:   document.getElementById('f-resp')?.value?.trim()   || '',
    description:   document.getElementById('f-desc')?.value?.trim()   || '',
    action:        document.getElementById('f-action')?.value?.trim() || '',
    docUrl:        document.getElementById('f-url')?.value?.trim()    || '',
    kpoDuty:       'duty5',
  };
  try {
    if (editId) await updateLegalRegister(editId, payload);
    else        await createLegalRegister(payload, profile.uid);
    window._closePanel();
    records = await listLegalRegisters({ lim:300 });
    renderKPIs(records);
    window._filter();
  } catch(e) { alert('บันทึกไม่ได้: '+(e?.message||e)); }
};

window._del = async (id) => {
  if (!confirm('ลบรายการนี้?')) return;
  try { await deleteLegalRegister(id); records=records.filter(x=>x.id!==id); renderKPIs(records); window._filter(); }
  catch(e) { alert('ลบไม่ได้: '+(e?.message||e)); }
};

/* ───── LOAD ───── */
try {
  records = await listLegalRegisters({ lim:300 });
  renderKPIs(records);
  renderTable(records);
} catch(e) {
  main.innerHTML=`<div style="margin:20px;background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:20px;color:#991b1b">⚠️ โหลดข้อมูลไม่ได้: ${e?.message||e}</div>`;
}
</script>
</body>
</html>
