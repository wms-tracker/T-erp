<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>แจ้งเตือนความปลอดภัย — KPO Safety</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
  .card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px}
  .kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
  .kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
  .btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn-primary{background:#1a237e;color:#fff}
  .btn-success{background:#16a34a;color:#fff}
  .btn-danger{background:#dc2626;color:#fff}
  .btn-ghost{background:#f3f4f6;color:#374151}
  .panel{position:fixed;right:0;top:0;bottom:0;width:480px;max-width:100vw;background:#fff;box-shadow:-4px 0 24px rgba(15,25,60,.13);z-index:1000;overflow-y:auto;transform:translateX(100%);transition:transform .22s ease}
  .panel.open{transform:none}
  .panel-overlay{display:none;position:fixed;inset:0;background:rgba(15,20,40,.35);z-index:999}
  .panel-overlay.open{display:block}
  .panel-header{padding:18px 20px 12px;border-bottom:1px solid #e8eaf6;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:10}
  .panel-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#666;padding:4px 8px;border-radius:6px}
  .panel-close:hover{background:#f0f2f8}
  .panel-body{padding:16px 20px 32px}
  .form-group{margin-bottom:13px}
  .form-label{display:block;font-size:0.82rem;font-weight:600;color:#333;margin-bottom:5px}
  .form-control{width:100%;padding:9px 11px;border:1.5px solid #d1d5e8;border-radius:8px;font-size:0.88rem;font-family:inherit;box-sizing:border-box}
  .form-control:focus{outline:none;border-color:#1a73e8}
  .alert-card{border-radius:14px;padding:16px;margin-bottom:12px;border-left:4px solid #e0e3f0}
  </style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  ALERT_TYPES, ALERT_URGENCY, ALERT_STATUS,
  listAlerts, getAlert, createAlert, updateAlert, deleteAlert,
} from './js/safety-data.js';
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-alert', 'แจ้งเตือนความปลอดภัยด่วน');

const badge = (l,c,bg) => `<span class="badge" style="color:${c};background:${bg}">${l}</span>`;
const fmt   = d => d ? new Date(d).toLocaleDateString('th-TH',{year:'2-digit',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
const today = () => new Date().toISOString().slice(0,16);

let records = [], filterStatus = '', filterUrgency = '';

function getType(k) { return ALERT_TYPES.find(t=>t.key===k)||{label:k,icon:'📢',color:'#555',bg:'#eee'}; }
function filtered() {
  return records.filter(r=>{
    if(filterStatus  && r.status   !== filterStatus)  return false;
    if(filterUrgency && r.urgency  !== filterUrgency) return false;
    return true;
  });
}

function kpiBar() {
  const active  = records.filter(r=>r.status==='active').length;
  const crit    = records.filter(r=>r.urgency==='critical').length;
  return `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px;">
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#1a73e8;">${records.length}</div><div style="font-size:0.78rem;color:#6b7280;">ทั้งหมด</div></div>
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#dc2626;">${active}</div><div style="font-size:0.78rem;color:#6b7280;">มีผลอยู่</div></div>
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#7f1d1d;">${crit}</div><div style="font-size:0.78rem;color:#6b7280;">ด่วนมาก</div></div>
    <div class="card" style="padding:14px 16px;"><div style="font-size:1.6rem;font-weight:800;color:#16a34a;">${records.filter(r=>r.status==='resolved').length}</div><div style="font-size:0.78rem;color:#6b7280;">แก้ไขแล้ว</div></div>
  </div>`;
}

function renderPage() {
  const rows=filtered();
  main.innerHTML = `
    ${kpiBar()}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <b>รายการแจ้งเตือน</b>
        <button class="btn btn-primary" onclick="window.__openPanel()">+ ออกประกาศ/แจ้งเตือน</button>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;">
        <select class="form-control" style="width:auto;min-width:140px;" onchange="window.__setStatus(this.value)">
          <option value="">ทุกสถานะ</option>
          ${Object.entries(ALERT_STATUS).map(([k,v])=>`<option value="${k}" ${k===filterStatus?'selected':''}>${v.label}</option>`).join('')}
        </select>
        <select class="form-control" style="width:auto;min-width:140px;" onchange="window.__setUrgency(this.value)">
          <option value="">ทุกระดับ</option>
          ${Object.entries(ALERT_URGENCY).map(([k,v])=>`<option value="${k}" ${k===filterUrgency?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
      <div>
        ${rows.length===0?`<div style="text-align:center;color:#999;padding:32px;">ไม่พบข้อมูล</div>`:rows.map(r=>{
          const tp=getType(r.alertType);
          const ug=ALERT_URGENCY[r.urgency]||{label:r.urgency||'—',color:'#555',bg:'#eee'};
          const st=ALERT_STATUS[r.status]||{label:r.status||'—',color:'#555',bg:'#eee'};
          return `<div class="alert-card" style="background:${tp.bg}20;border-left-color:${tp.color};">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
              <div style="flex:1;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
                  <span style="font-size:1.4rem;">${tp.icon}</span>
                  <b style="font-size:0.96rem;">${r.title||'—'}</b>
                </div>
                <div style="font-size:0.78rem;display:flex;gap:8px;flex-wrap:wrap;">
                  ${badge(ug.label,ug.color,ug.bg)}
                  ${badge(tp.label,tp.color,tp.bg)}
                  ${badge(st.label,st.color,st.bg)}
                </div>
                ${r.message?`<div style="font-size:0.84rem;color:#444;margin-top:8px;">${r.message}</div>`:''}
                <div style="font-size:0.76rem;color:#888;margin-top:6px;">เผยแพร่: ${fmt(r.alertDateTime)} • โดย: ${r.issuedBy||'—'}</div>
              </div>
              <div style="display:flex;gap:6px;flex-shrink:0;">
                ${r.status==='active'?`<button class="btn btn-success" style="padding:4px 10px;font-size:0.78rem;" onclick="window.__resolveRecord('${r.id}')">แก้ไขแล้ว</button>`:''}
                <button class="btn btn-outline" style="padding:4px 10px;font-size:0.78rem;" onclick="window.__viewRecord('${r.id}')">ดูเอกสาร</button><button class="btn btn-outline" style="padding:4px 10px;font-size:0.78rem;margin-left:4px;" onclick="window.__editRecord('${r.id}')">แก้ไข</button>
                <button class="btn btn-danger"  style="padding:4px 10px;font-size:0.78rem;" onclick="window.__deleteRecord('${r.id}')">ลบ</button>
              </div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="panel-overlay" id="panel-overlay" onclick="window.__closePanel()"></div>
    <div class="panel" id="alert-panel">
      <div class="panel-header"><b id="panel-title">ออกประกาศ / แจ้งเตือน</b><button class="panel-close" onclick="window.__closePanel()">✕</button></div>
      <div class="panel-body" id="panel-body"></div>
    </div>`;
}

function formHTML(r) {
  return `
    <div id="panel-msg" class="msg" style="margin-bottom:8px;"></div>
    <input type="hidden" id="f-id" value="${r?.id||''}"/>
    <input type="hidden" id="f-attach-existing" value='${JSON.stringify(r?.attachments||[])}'/>
    <div class="form-group"><label class="form-label">หัวข้อประกาศ *</label><input id="f-title" class="form-control" value="${r?.title||''}"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div class="form-group"><label class="form-label">ประเภท *</label>
        <select id="f-type" class="form-control">
          <option value="">— เลือก —</option>
          ${ALERT_TYPES.map(t=>`<option value="${t.key}" ${r?.alertType===t.key?'selected':''}>${t.icon} ${t.label}</option>`).join('')}
        </select></div>
      <div class="form-group"><label class="form-label">ระดับความด่วน *</label>
        <select id="f-urgency" class="form-control">
          <option value="">— เลือก —</option>
          ${Object.entries(ALERT_URGENCY).map(([k,v])=>`<option value="${k}" ${r?.urgency===k?'selected':''}>${v.label}</option>`).join('')}
        </select></div>
    </div>
    <div class="form-group"><label class="form-label">วัน/เวลาที่แจ้ง</label><input id="f-datetime" class="form-control" type="datetime-local" value="${r?.alertDateTime||today()}"/></div>
    <div class="form-group"><label class="form-label">รายละเอียด / ข้อความแจ้ง</label><textarea id="f-msg" class="form-control" rows="4">${r?.message||''}</textarea></div>
    <div class="form-group"><label class="form-label">พื้นที่/กลุ่มที่แจ้ง</label><input id="f-target" class="form-control" value="${r?.targetGroup||''}"/></div>
    <div class="form-group"><label class="form-label">ผู้ออกประกาศ</label><input id="f-by" class="form-control" value="${r?.issuedBy||profile.displayName||''}"/></div>
    <div class="form-group"><label class="form-label">มาตรการ / การดำเนินการที่ต้องทำ</label><textarea id="f-action" class="form-control" rows="3">${r?.requiredActions||''}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="btn btn-primary" style="flex:1;" onclick="window.__saveRecord()">📢 เผยแพร่</button>
      <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>
    </div>`;
}

window.__setStatus  = v => { filterStatus=v;  renderPage(); };
window.__setUrgency = v => { filterUrgency=v; renderPage(); };
window.__openPanel  = () => {
  document.getElementById('panel-title').textContent='ออกประกาศ / แจ้งเตือน';
  document.getElementById('panel-body').innerHTML=formHTML(null);
  document.getElementById('alert-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
};
window.__closePanel = () => {
  document.getElementById('alert-panel').classList.remove('open');
  document.getElementById('panel-overlay').classList.remove('open');
};
window.__editRecord = async id => {
  const r=await getAlert(id); if(!r) return;
  document.getElementById('panel-title').textContent='แก้ไขประกาศ';
  document.getElementById('panel-body').innerHTML=formHTML(r);
  document.getElementById('alert-panel').classList.add('open');
  document.getElementById('panel-overlay').classList.add('open');
};
window.__resolveRecord = async id => {
  if(!confirm('ยืนยันว่าแก้ไข/ดำเนินการแล้ว?')) return;
  await updateAlert(id,{ status:'resolved', resolvedAt:new Date().toISOString(), resolvedBy:profile.displayName||profile.uid });
  await loadAll();
};
window.__saveRecord = async () => {
  const msg=document.getElementById('panel-msg');
  const title=document.getElementById('f-title').value.trim();
  const type=document.getElementById('f-type').value;
  const urgency=document.getElementById('f-urgency').value;
  if(!title||!type||!urgency){ msg.textContent='* กรุณาระบุข้อมูลที่จำเป็น'; msg.className='msg error'; return; }
  msg.textContent='กำลังบันทึก…'; msg.className='msg';
  const data={
    title, alertType:type, urgency,
    alertDateTime:document.getElementById('f-datetime').value,
    message:document.getElementById('f-msg').value.trim(),
    targetGroup:document.getElementById('f-target').value.trim(),
    issuedBy:document.getElementById('f-by').value.trim(),
    requiredActions:document.getElementById('f-action').value.trim(),
    status:'active',
  };
  try {
    if(window.__commitAttach)data.attachments=await window.__commitAttach();
    const id=document.getElementById('f-id').value;
    if(id) await updateAlert(id,data); else await createAlert(data,profile.uid);
    window.__closePanel(); await loadAll();
  } catch(e){ msg.textContent='เกิดข้อผิดพลาด: '+e.message; msg.className='msg error'; }
};
window.__deleteRecord = async id => {
  if(!confirm('ลบประกาศนี้?')) return;
  await deleteAlert(id); await loadAll();
};

async function loadAll() { records=await listAlerts(); renderPage(); }
loadAll();
</script>
</body>
</html>
