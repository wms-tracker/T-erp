<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>การปรับปรุงอย่างต่อเนื่อง</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
:root{--c-primary:#059669;--c-success:#16a34a;--c-warn:#d97706;--c-danger:#dc2626;--c-gray:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--c-primary)}
.kpi .num{font-size:1.6rem;font-weight:700;color:var(--c-primary)}
.kpi .lbl{font-size:.78rem;color:var(--c-gray);margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.toolbar input{flex:1;min-width:140px}
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.85rem;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-ghost{background:#f1f5f9;color:#334155}
.btn-danger{background:#fee2e2;color:var(--c-danger)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.07)}
th{background:#f1f5f9;padding:9px 12px;text-align:left;font-size:.8rem;color:#475569;font-weight:600;border-bottom:1px solid #e2e8f0}
td{padding:9px 12px;font-size:.84rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.cat-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.77rem;font-weight:600}
/* kanban cards */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.kan-col{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.kan-col h3{font-size:.82rem;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #e2e8f0}
.kan-card{background:#f8fafc;border-radius:8px;padding:10px 12px;margin-bottom:8px;border-left:3px solid #e2e8f0;cursor:pointer;transition:box-shadow .15s}
.kan-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.kan-card .title{font-size:.83rem;font-weight:600;margin-bottom:4px}
.kan-card .meta{font-size:.74rem;color:#6b7280}
/* view toggle */
.view-toggle{display:flex;gap:4px;background:#f1f5f9;padding:4px;border-radius:8px}
.view-btn{padding:5px 12px;border:none;background:none;border-radius:6px;font-size:.82rem;cursor:pointer;color:#6b7280;font-family:inherit}
.view-btn.active{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
/* prog bar */
.prog-wrap{background:#e2e8f0;border-radius:4px;height:6px;margin-top:4px}
.prog-bar{height:100%;border-radius:4px;background:var(--c-primary)}
/* panel */
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900}
.panel-overlay.open{display:block}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(640px,100vw);background:#fff;box-shadow:-4px 0 24px rgba(0,0,0,.12);z-index:901;overflow-y:auto;transform:translateX(100%);transition:transform .3s ease}
.panel.open{transform:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1}
.panel-head h2{font-size:1rem;font-weight:700}
.panel-body{padding:22px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.one{grid-template-columns:1fr}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.8rem;font-weight:600;color:#475569}
.form-group input,.form-group select,.form-group textarea{padding:8px 10px;border:1px solid #d1d5db;border-radius:7px;font-size:.85rem;font-family:inherit}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--c-primary)}
.form-group textarea{resize:vertical;min-height:70px}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  IMPV_SOURCES, IMPV_CATEGORIES, IMPV_PRIORITY, IMPV_STATUS,
  listImprovement, getImprovement, createImprovement, updateImprovement, deleteImprovement,
} from './js/safety-data.js';

const profile = await requireRole(['safety_officer','kpo']);
const main = renderShell(profile, 'safety-improvement', 'การปรับปรุงอย่างต่อเนื่อง');

let allRecs  = [];
let editId   = null;
let viewMode = 'table';

// ── KPI ──
function renderKPI(recs) {
  const total    = recs.length;
  const idea     = recs.filter(r=>r.status==='idea').length;
  const inProg   = recs.filter(r=>r.status==='in_progress'||r.status==='planning').length;
  const done     = recs.filter(r=>r.status==='completed').length;
  const high     = recs.filter(r=>r.priority==='high' && r.status!=='completed' && r.status!=='cancelled').length;
  const pct      = total ? Math.round(done/total*100) : 0;
  return `<div class="kpi-row">
    <div class="kpi"><div class="num">${total}</div><div class="lbl">ทั้งหมด</div></div>
    <div class="kpi" style="border-color:#9ca3af"><div class="num" style="color:#9ca3af">${idea}</div><div class="lbl">💡 แนวคิด</div></div>
    <div class="kpi" style="border-color:#d97706"><div class="num" style="color:#d97706">${inProg}</div><div class="lbl">🔄 กำลังดำเนินการ</div></div>
    <div class="kpi" style="border-color:#16a34a"><div class="num" style="color:#16a34a">${done}</div><div class="lbl">✅ เสร็จสิ้น</div></div>
    <div class="kpi" style="border-color:#dc2626"><div class="num" style="color:#dc2626">${high}</div><div class="lbl">🔴 ความสำคัญสูง</div></div>
    <div class="kpi" style="border-color:#059669">
      <div class="num" style="color:#059669">${pct}%</div>
      <div class="lbl">ความสำเร็จ</div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
    </div>
  </div>`;
}

// ── Table ──
function renderTable(recs) {
  if (!recs.length) return `<div class="empty-state"><div class="icon">📈</div><p>ยังไม่มีรายการปรับปรุง</p></div>`;
  const rows = recs.map(r => {
    const cat  = IMPV_CATEGORIES.find(c=>c.key===r.category)||{icon:'📌',label:r.category||'—',color:'#6b7280',bg:'#f3f4f6'};
    const st   = IMPV_STATUS[r.status]||IMPV_STATUS.idea;
    const pri  = IMPV_PRIORITY[r.priority]||IMPV_PRIORITY.medium;
    const src  = IMPV_SOURCES.find(s=>s.key===r.source);
    const overdue = r.targetDate && r.status!=='completed' && r.status!=='cancelled' && new Date(r.targetDate) < new Date();
    return `<tr>
      <td><strong style="font-size:.85rem">${r.title||'—'}</strong><br/>
        <span style="font-size:.74rem;color:#6b7280">${src?src.icon+' '+src.label:'—'}</span></td>
      <td><span class="cat-chip" style="color:${cat.color};background:${cat.bg}">${cat.icon} ${cat.label}</span></td>
      <td><span class="badge" style="color:${pri.color};background:${pri.bg}">${pri.label}</span></td>
      <td style="font-size:.82rem">${r.responsible||'—'}</td>
      <td style="font-size:.82rem;color:${overdue?'#dc2626':'inherit'};font-weight:${overdue?600:400}">${r.targetDate||'—'}${overdue?' ⚠️':''}</td>
      <td><span class="badge" style="color:${st.color};background:${st.bg}">${st.icon} ${st.label}</span></td>
      <td>
        <button class="btn btn-sm btn-ghost" onclick="window.__editImpv('${r.id}')">แก้ไข</button>
        <button class="btn btn-sm btn-danger" onclick="window.__deleteImpv('${r.id}','${(r.title||'').replace(/'/g,"\\'")}')">ลบ</button>
      </td>
    </tr>`;
  }).join('');
  return `<table>
    <thead><tr>
      <th>ชื่อโครงการ / แหล่งที่มา</th><th>หมวดหมู่</th><th>ความสำคัญ</th>
      <th>ผู้รับผิดชอบ</th><th>เป้าหมายวันที่</th><th>สถานะ</th><th>จัดการ</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ── Kanban ──
function renderKanban(recs) {
  const cols = Object.entries(IMPV_STATUS).map(([key, st]) => {
    const items = recs.filter(r=>r.status===key);
    const cards = items.map(r => {
      const pri = IMPV_PRIORITY[r.priority]||IMPV_PRIORITY.medium;
      const cat = IMPV_CATEGORIES.find(c=>c.key===r.category)||{icon:'📌'};
      return `<div class="kan-card" onclick="window.__editImpv('${r.id}')" style="border-left-color:${pri.color}">
        <div class="title">${cat.icon} ${r.title||'—'}</div>
        <div class="meta">${r.responsible||'—'} ${r.targetDate?'· '+r.targetDate:''}</div>
        <div style="margin-top:4px"><span class="badge" style="color:${pri.color};background:${pri.bg};font-size:.7rem">${pri.label}</span></div>
      </div>`;
    }).join('');
    return `<div class="kan-col">
      <h3 style="color:${st.color}">${st.icon} ${st.label} <span style="font-size:.75rem;color:#9ca3af;font-weight:400">(${items.length})</span></h3>
      ${cards||'<div style="font-size:.8rem;color:#9ca3af;text-align:center;padding:12px">ไม่มีรายการ</div>'}
    </div>`;
  }).join('');
  return `<div class="kanban">${cols}</div>`;
}

// ── Form ──
function renderForm(rec) {
  const catOpts = IMPV_CATEGORIES.map(c=>`<option value="${c.key}" ${rec?.category===c.key?'selected':''}>${c.icon} ${c.label}</option>`).join('');
  const srcOpts = IMPV_SOURCES.map(s=>`<option value="${s.key}" ${rec?.source===s.key?'selected':''}>${s.icon} ${s.label}</option>`).join('');
  const priOpts = Object.entries(IMPV_PRIORITY).map(([k,v])=>`<option value="${k}" ${(rec?.priority||'medium')===k?'selected':''}>${v.label}</option>`).join('');
  const stOpts  = Object.entries(IMPV_STATUS).map(([k,v])=>`<option value="${k}" ${(rec?.status||'idea')===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
  return `<form id="impv-form" onsubmit="return false">
    <div class="form-row one">
      <div class="form-group"><label>ชื่อโครงการ / แนวคิดการปรับปรุง *</label>
        <input id="f-title" value="${rec?.title||''}" placeholder="ชื่อโครงการปรับปรุง"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>หมวดหมู่ ISO 45001</label>
        <select id="f-category">${catOpts}</select></div>
      <div class="form-group"><label>แหล่งที่มา</label>
        <select id="f-source">${srcOpts}</select></div>
    </div>
    <div class="form-row three">
      <div class="form-group"><label>ความสำคัญ</label>
        <select id="f-priority">${priOpts}</select></div>
      <div class="form-group"><label>สถานะ</label>
        <select id="f-status">${stOpts}</select></div>
      <div class="form-group"><label>วันเป้าหมาย</label>
        <input id="f-targetDate" type="date" value="${rec?.targetDate||''}"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>ผู้รับผิดชอบ</label>
        <input id="f-responsible" value="${rec?.responsible||''}" placeholder="ชื่อ / แผนก"/></div>
      <div class="form-group"><label>วันที่เสร็จจริง</label>
        <input id="f-completedDate" type="date" value="${rec?.completedDate||''}"/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>สภาพปัญหา / โอกาสปรับปรุง</label>
        <textarea id="f-problem" rows="2" placeholder="อธิบายปัญหาหรือโอกาสที่ระบุได้">${rec?.problem||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>วัตถุประสงค์ / เป้าหมายที่คาดหวัง</label>
        <textarea id="f-objective" rows="2" placeholder="ผลลัพธ์ที่ต้องการจากการปรับปรุง">${rec?.objective||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>แนวทางดำเนินการ</label>
        <textarea id="f-approach" rows="2" placeholder="วิธีการหรือขั้นตอนที่จะดำเนินการ">${rec?.approach||''}</textarea></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>ผลการดำเนินการ / ประโยชน์ที่ได้รับ</label>
        <textarea id="f-result" rows="2" placeholder="ผลที่เกิดขึ้นจริง / ประโยชน์ที่ได้รับหลังปรับปรุง">${rec?.result||''}</textarea></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>งบประมาณที่ใช้ (บาท)</label>
        <input id="f-budget" type="number" min="0" value="${rec?.budget||0}"/></div>
      <div class="form-group"><label>ข้ออ้างอิง (ข้อกำหนด ISO / กฎหมาย)</label>
        <input id="f-reference" value="${rec?.reference||''}" placeholder="เช่น ISO 45001 §10.3, ..."/></div>
    </div>
    <div class="form-row one">
      <div class="form-group"><label>หมายเหตุ</label>
        <input id="f-notes" value="${rec?.notes||''}" placeholder="หมายเหตุเพิ่มเติม"/></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0">
      <button type="button" class="btn btn-primary" onclick="window.__saveImpv()">💾 บันทึก</button>
      <button type="button" class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>
    </div>
  </form>`;
}

// ── Panel ──
window.__closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
};
function openPanel(html, title) {
  document.getElementById('panel-title').textContent = title;
  document.getElementById('panel-content').innerHTML = html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('panel').classList.add('open');
}

window.__newImpv  = () => { editId = null; openPanel(renderForm(null), '+ เพิ่มโครงการปรับปรุง'); };
window.__editImpv = async id => {
  editId = id;
  const r = await getImprovement(id);
  openPanel(renderForm(r), '✏️ แก้ไขโครงการปรับปรุง');
};

// ── Save ──
window.__saveImpv = async () => {
  const data = {
    title:         document.getElementById('f-title').value.trim(),
    category:      document.getElementById('f-category').value,
    source:        document.getElementById('f-source').value,
    priority:      document.getElementById('f-priority').value,
    status:        document.getElementById('f-status').value,
    targetDate:    document.getElementById('f-targetDate').value,
    responsible:   document.getElementById('f-responsible').value.trim(),
    completedDate: document.getElementById('f-completedDate').value,
    problem:       document.getElementById('f-problem').value.trim(),
    objective:     document.getElementById('f-objective').value.trim(),
    approach:      document.getElementById('f-approach').value.trim(),
    result:        document.getElementById('f-result').value.trim(),
    budget:        Number(document.getElementById('f-budget').value||0),
    reference:     document.getElementById('f-reference').value.trim(),
    notes:         document.getElementById('f-notes').value.trim(),
  };
  if (!data.title) { alert('กรุณากรอกชื่อโครงการ'); return; }
  try {
    if (editId) await updateImprovement(editId, data);
    else        await createImprovement(data, profile.uid||profile.email||'unknown');
    window.__closePanel();
    await loadData();
  } catch(e) { alert('บันทึกไม่สำเร็จ: ' + e.message); }
};

// ── Delete ──
window.__deleteImpv = async (id, title) => {
  if (!confirm(`ลบโครงการ "${title}"?`)) return;
  await deleteImprovement(id);
  window.__closePanel();
  await loadData();
};

// ── Filter + render ──
function applyFilter() {
  const q   = document.getElementById('search-box')?.value.toLowerCase()||'';
  const cat = document.getElementById('filter-cat')?.value||'';
  const st  = document.getElementById('filter-status')?.value||'';
  const pri = document.getElementById('filter-priority')?.value||'';
  const filtered = allRecs.filter(r =>
    (!q   || (r.title||'').toLowerCase().includes(q) || (r.responsible||'').toLowerCase().includes(q)) &&
    (!cat || r.category===cat) &&
    (!st  || r.status===st) &&
    (!pri || r.priority===pri)
  );
  document.getElementById('kpi-wrap').innerHTML = renderKPI(filtered);
  document.getElementById('content-wrap').innerHTML =
    viewMode==='kanban' ? renderKanban(filtered) : renderTable(filtered);
}
window.applyFilter = applyFilter;

window.__switchView = mode => {
  viewMode = mode;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===mode));
  applyFilter();
};

async function loadData() {
  allRecs = await listImprovement();
  applyFilter();
}

// ── Build UI ──
const catOpts = `<option value="">-- ทุกหมวด --</option>` +
  IMPV_CATEGORIES.map(c=>`<option value="${c.key}">${c.icon} ${c.label}</option>`).join('');
const stOpts = `<option value="">-- ทุกสถานะ --</option>` +
  Object.entries(IMPV_STATUS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');
const priOpts = `<option value="">-- ทุกระดับ --</option>` +
  Object.entries(IMPV_PRIORITY).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');

main.innerHTML = `
  <div style="padding:20px">
    <div id="kpi-wrap"></div>
    <div class="toolbar">
      <input id="search-box" placeholder="🔍 ค้นหาโครงการ / ผู้รับผิดชอบ…" oninput="applyFilter()"/>
      <select id="filter-cat"      onchange="applyFilter()">${catOpts}</select>
      <select id="filter-status"   onchange="applyFilter()">${stOpts}</select>
      <select id="filter-priority" onchange="applyFilter()">${priOpts}</select>
      <div class="view-toggle">
        <button class="view-btn active" data-view="table"  onclick="window.__switchView('table')">📋 ตาราง</button>
        <button class="view-btn"        data-view="kanban" onclick="window.__switchView('kanban')">🗂️ Kanban</button>
      </div>
      <button class="btn btn-primary" onclick="window.__newImpv()">+ เพิ่มโครงการ</button>
    </div>
    <div id="content-wrap"></div>
  </div>

  <div class="panel-overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-head">
      <h2 id="panel-title">การปรับปรุงอย่างต่อเนื่อง</h2>
      <button class="btn btn-ghost btn-sm" onclick="window.__closePanel()">✕ ปิด</button>
    </div>
    <div class="panel-body" id="panel-content"></div>
  </div>
`;

await loadData();
</script>
</body>
</html>
