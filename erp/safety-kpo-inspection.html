<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Module 06 — สำรวจความปลอดภัย & สถิติอุบัติเหตุ</title>
<link rel="stylesheet" href="css/erp.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:#f8fafc;color:#1e293b}
/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid #e2e8f0;padding-bottom:0}
.tab-btn{padding:10px 18px;border:none;background:none;cursor:pointer;font-size:.9rem;font-family:'Sarabun',sans-serif;color:#64748b;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:700}
.tab-btn:hover:not(.active){color:#1e293b}
.tab-panel{display:none}.tab-panel.active{display:block}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-top:4px solid #e2e8f0;text-align:center}
.kpi .num{font-size:1.6rem;font-weight:700;line-height:1}
.kpi .lbl{font-size:.72rem;color:#64748b;margin-top:4px}
.kpi.green{border-top-color:#059669}.kpi.green .num{color:#059669}
.kpi.blue{border-top-color:#2563eb}.kpi.blue .num{color:#2563eb}
.kpi.red{border-top-color:#dc2626}.kpi.red .num{color:#dc2626}
.kpi.amber{border-top-color:#d97706}.kpi.amber .num{color:#d97706}
.kpi.purple{border-top-color:#7c3aed}.kpi.purple .num{color:#7c3aed}
.kpi.gray{border-top-color:#94a3b8}.kpi.gray .num{color:#94a3b8}
/* Table */
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden;margin-bottom:16px}
.card-head{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1f5f9}
.card-head h2{font-size:.95rem;font-weight:700;flex:1}
.tbl{width:100%;border-collapse:collapse}
.tbl th{padding:9px 12px;background:#f8fafc;font-size:.75rem;color:#64748b;text-align:left;border-bottom:1px solid #e2e8f0;white-space:nowrap}
.tbl td{padding:9px 12px;font-size:.82rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#f8fafc}
/* Badge */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
/* Btn */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-size:.82rem;font-family:'Sarabun',sans-serif;font-weight:600;transition:all .2s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-sm{padding:4px 10px;font-size:.75rem}
.btn-ghost{background:transparent;border:1px solid #d1d5db;color:#374151}.btn-ghost:hover{background:#f9fafb}
/* Year select */
.year-select{padding:7px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:.88rem;background:#fff;cursor:pointer}
/* Chart */
.chart-wrap{padding:16px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-label{width:46px;font-size:.72rem;color:#64748b;flex-shrink:0;text-align:right}
.bar-track{flex:1;background:#f1f5f9;border-radius:4px;height:20px;overflow:hidden;position:relative;display:flex}
.bar-seg{height:100%;transition:width .5s;min-width:0}
.bar-pct-out{font-size:.7rem;color:#94a3b8;width:30px;flex-shrink:0}
/* Progress circle */
.pct-text{font-weight:700}
/* Slide panel */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999}
.overlay.open{display:block}
.panel{position:fixed;top:0;right:-100%;width:min(640px,100vw);height:100vh;background:#fff;z-index:1000;overflow-y:auto;transition:right .3s;box-shadow:-4px 0 20px rgba(0,0,0,.12)}
.panel.open{right:0}
.panel-head{position:sticky;top:0;background:#fff;padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:10px;z-index:1}
.panel-head h2{flex:1;font-size:1rem;font-weight:700}
.panel-body{padding:20px}
/* Form */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:4px}
.form-input,.form-textarea,.form-select{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:.85rem;font-family:'Sarabun',sans-serif;background:#fff}
.form-textarea{min-height:72px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* Inspection items */
.insp-cat{font-size:.78rem;font-weight:700;color:#374151;background:#f8fafc;padding:7px 10px;border-radius:6px;margin-top:12px;margin-bottom:4px}
.insp-item-row{display:flex;align-items:flex-start;gap:8px;padding:5px 4px;border-bottom:1px solid #f1f5f9}
.insp-item-name{flex:1;font-size:.78rem;line-height:1.4;color:#374151}
.pfn-group{display:flex;gap:4px;flex-shrink:0}
.pfn-btn{padding:3px 8px;border:1px solid #d1d5db;border-radius:5px;cursor:pointer;font-size:.7rem;font-weight:600;background:#fff;transition:all .15s;white-space:nowrap}
.pfn-btn.p.sel{background:#059669;border-color:#059669;color:#fff}
.pfn-btn.f.sel{background:#dc2626;border-color:#dc2626;color:#fff}
.pfn-btn.n.sel{background:#94a3b8;border-color:#94a3b8;color:#fff}
/* Empty state */
.empty{text-align:center;padding:36px 20px;color:#94a3b8;font-size:.85rem}
/* Detail panel */
.detail-section{margin-bottom:16px}
.detail-section h3{font-size:.82rem;font-weight:700;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.detail-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.82rem;border-bottom:1px solid #f1f5f9}
.result-pass{color:#059669;font-weight:600}
.result-fail{color:#dc2626;font-weight:600}
.result-na{color:#94a3b8}
/* Stat breakdown */
.type-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f1f5f9}
.type-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.type-name{flex:1;font-size:.82rem}
.type-cnt{font-size:.88rem;font-weight:700}
.spinner{text-align:center;padding:40px;color:#94a3b8;font-size:.88rem}
</style>
</head>
<body>
<script type="module">
import { requireRole } from './js/auth.js';
import { renderShell } from './js/shell.js';
import {
  listInspections, createInspection, getInspection,
  DEFAULT_INSPECTION_ITEMS, INSPECTION_STATUS,
  computeSafetyKPIs, monthlyTrend, listIncidents, incidentsByDept,
  INCIDENT_TYPES, DEPARTMENTS
} from './js/safety-data.js';
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo','admin','manager']);
const main = renderShell(profile, 'kpo-inspection', 'Module 06 — สำรวจความปลอดภัย & สถิติ');

const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const THIS_YEAR_CE = new Date().getFullYear(); // Gregorian for incident queries
const THIS_YEAR_BE = THIS_YEAR_CE + 543;      // Buddhist for display

let activeTab = 'tab-inspect';
let inspections = [];
let statsYear = THIS_YEAR_CE;
let detailId = null;
let formItems = [];

/* ───────────── helpers ───────────── */
function fmtDate(iso) {
  if (!iso) return '-';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${parseInt(y) + 543}`;
}

function statusBadge(s) {
  const st = INSPECTION_STATUS[s] || { label: s, color: '#6b7280', bg: '#f9fafb' };
  return `<span class="badge" style="background:${st.bg};color:${st.color}">${st.label}</span>`;
}

function passRateColor(pct) {
  if (pct >= 90) return '#059669';
  if (pct >= 70) return '#d97706';
  return '#dc2626';
}

/* ───────────── RENDER SHELL ───────────── */
main.innerHTML = `
<div style="padding:20px">
  <div class="tabs">
    <button class="tab-btn active" onclick="window._tab('tab-inspect')">📋 ผลการตรวจสำรวจ</button>
    <button class="tab-btn"       onclick="window._tab('tab-stats')">📊 สถิติอุบัติเหตุ</button>
  </div>
  <div id="tab-inspect" class="tab-panel active"><div class="spinner">กำลังโหลด...</div></div>
  <div id="tab-stats"   class="tab-panel"><div class="spinner">กำลังโหลด...</div></div>
</div>

<!-- Overlay & Panels -->
<div class="overlay" id="overlay" onclick="window._closePanel()"></div>

<div class="panel" id="panelForm">
  <div class="panel-head">
    <h2>➕ บันทึกผลการตรวจสำรวจ</h2>
    <button class="btn btn-ghost btn-sm" onclick="window._closePanel()">✕ ปิด</button>
  </div>
  <div class="panel-body" id="panelFormBody">
    ${renderInspectionForm()}
  </div>
</div>

<div class="panel" id="panelDetail">
  <div class="panel-head">
    <h2>🔍 รายละเอียดการตรวจ</h2>
    <button class="btn btn-ghost btn-sm" onclick="window._closePanel()">✕ ปิด</button>
  </div>
  <div class="panel-body" id="panelDetailBody"></div>
</div>
`;

/* ───────────── TAB SWITCH ───────────── */
window._tab = (id) => {
  activeTab = id;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 ? 'tab-inspect' : 'tab-stats') === id);
  });
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === id));
  if (id === 'tab-stats') loadStats();
};

/* ───────────── PANEL OPEN/CLOSE ───────────── */
function openPanel(id) {
  document.getElementById('overlay').classList.add('open');
  document.getElementById(id).classList.add('open');
}
window._closePanel = () => {
  document.getElementById('overlay').classList.remove('open');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('open'));
  detailId = null;
};

/* ════════════════════════════════════════════
   TAB 1: INSPECTION
════════════════════════════════════════════ */
async function loadInspect() {
  const panel = document.getElementById('tab-inspect');
  panel.innerHTML = '<div class="spinner">กำลังโหลด...</div>';
  try {
    inspections = await listInspections({ lim: 200 });
    renderInspectTab();
  } catch(e) {
    panel.innerHTML = `<div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:20px;color:#991b1b">
      ⚠️ โหลดข้อมูลไม่ได้: ${e?.message||e}
    </div>`;
  }
}

function renderInspectTab() {
  const thisYear = inspections.filter(r => r.inspectionDate?.startsWith(String(THIS_YEAR_CE)));
  const completed = thisYear.filter(r => r.status === 'completed' || r.status === 'reviewed');
  const avgPass   = completed.length
    ? Math.round(completed.reduce((s,r) => s + (r.passRate||0), 0) / completed.length)
    : 0;
  const totalFail = completed.reduce((s,r) => s + (r.failCount||0), 0);

  document.getElementById('tab-inspect').innerHTML = `
  <div class="kpi-row">
    <div class="kpi blue"><div class="num">${thisYear.length}</div><div class="lbl">ครั้งที่ตรวจ ปี ${THIS_YEAR_BE}</div></div>
    <div class="kpi green"><div class="num">${completed.length}</div><div class="lbl">เสร็จสิ้น/ตรวจสอบแล้ว</div></div>
    <div class="kpi ${avgPass>=90?'green':avgPass>=70?'amber':'red'}">
      <div class="num">${avgPass}%</div><div class="lbl">เฉลี่ย % ผ่าน</div>
    </div>
    <div class="kpi red"><div class="num">${totalFail}</div><div class="lbl">รายการที่พบปัญหา</div></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>📋 รายการตรวจสำรวจ</h2>
      <button class="btn btn-primary btn-sm" onclick="window._openForm()">➕ เพิ่มผลการตรวจ</button>
    </div>
    ${inspections.length === 0 ? `<div class="empty">📭 ยังไม่มีข้อมูลการตรวจสำรวจ</div>` : `
    <div style="overflow-x:auto">
    <table class="tbl">
      <thead><tr>
        <th>วันที่ตรวจ</th>
        <th>พื้นที่</th>
        <th>ผู้ตรวจ</th>
        <th style="text-align:center">ผ่าน</th>
        <th style="text-align:center">ไม่ผ่าน</th>
        <th style="text-align:center">% ผ่าน</th>
        <th>สถานะ</th>
        <th></th>
      </tr></thead>
      <tbody>
        ${inspections.map(r => {
          const pct = r.passRate ?? (r.totalItems ? Math.round((r.passCount||0)/r.totalItems*100) : '-');
          return `<tr>
            <td>${fmtDate(r.inspectionDate)}</td>
            <td>${r.area||'-'}</td>
            <td style="font-size:.78rem">${Array.isArray(r.inspectors)?r.inspectors.join(', '):(r.inspectors||'-')}</td>
            <td style="text-align:center;color:#059669;font-weight:700">${r.passCount??'-'}</td>
            <td style="text-align:center;color:#dc2626;font-weight:700">${r.failCount??'-'}</td>
            <td style="text-align:center;font-weight:700;color:${passRateColor(Number(pct))}">${pct}%</td>
            <td>${statusBadge(r.status||'draft')}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="window._viewInspect('${r.id}')">ดู</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`}
  </div>`;
}

/* ───────────── FORM ───────────── */
function renderInspectionForm() {
  const groups = {};
  DEFAULT_INSPECTION_ITEMS.forEach((it, idx) => {
    if (!groups[it.category]) groups[it.category] = [];
    groups[it.category].push({ ...it, idx });
  });

  const itemsHtml = Object.entries(groups).map(([cat, items]) => `
    <div class="insp-cat">${cat}</div>
    ${items.map(it => `
    <div class="insp-item-row" id="item-row-${it.idx}">
      <div class="insp-item-name">${it.item}</div>
      <div class="pfn-group">
        <button class="pfn-btn p" onclick="window._pfn(${it.idx},'pass')" title="ผ่าน">✓ ผ่าน</button>
        <button class="pfn-btn f" onclick="window._pfn(${it.idx},'fail')" title="ไม่ผ่าน">✗ ไม่ผ่าน</button>
        <button class="pfn-btn n" onclick="window._pfn(${it.idx},'na')"   title="ไม่เกี่ยวข้อง">N/A</button>
      </div>
    </div>`).join('')}
  `).join('');

  return `
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">วันที่ตรวจ *</label>
      <input type="date" id="f-date" class="form-input" value="${new Date().toISOString().slice(0,10)}"/>
    </div>
    <div class="form-group">
      <label class="form-label">สถานะ</label>
      <select id="f-status" class="form-select">
        <option value="draft">Draft</option>
        <option value="completed" selected>เสร็จสิ้น</option>
        <option value="reviewed">ตรวจสอบแล้ว</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">พื้นที่ตรวจ *</label>
      <input type="text" id="f-area" class="form-input" placeholder="เช่น OB, IB, Rack Area"/>
    </div>
    <div class="form-group">
      <label class="form-label">ผู้ตรวจ</label>
      <input type="text" id="f-inspector" class="form-input" placeholder="ชื่อ-นามสกุล"/>
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">รายการตรวจ <span style="color:#94a3b8;font-weight:400">(กดเลือก ผ่าน / ไม่ผ่าน / N/A)</span></label>
    <div id="items-wrap" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;max-height:380px;overflow-y:auto">
      ${itemsHtml}
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">หมายเหตุ / สรุปผล</label>
    <textarea id="f-remark" class="form-textarea" placeholder="สรุปสิ่งที่พบ และข้อเสนอแนะ"></textarea>
  </div>
  <div style="display:flex;gap:10px;justify-content:flex-end;padding-top:8px">
    <button class="btn btn-ghost" onclick="window._closePanel()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="window._saveInspect()">💾 บันทึก</button>
  </div>`;
}

window._openForm = () => {
  formItems = DEFAULT_INSPECTION_ITEMS.map(it => ({ ...it, result: '' }));
  document.getElementById('panelFormBody').innerHTML = renderInspectionForm();
  openPanel('panelForm');
};

window._pfn = (idx, result) => {
  if (!formItems[idx]) formItems[idx] = { ...DEFAULT_INSPECTION_ITEMS[idx], result };
  else formItems[idx].result = result;
  const row = document.getElementById(`item-row-${idx}`);
  if (!row) return;
  row.querySelectorAll('.pfn-btn').forEach(b => {
    const isThis = (b.classList.contains('p') && result==='pass') ||
                   (b.classList.contains('f') && result==='fail') ||
                   (b.classList.contains('n') && result==='na');
    b.classList.toggle('sel', isThis);
  });
};

window._saveInspect = async () => {
  const date     = document.getElementById('f-date')?.value;
  const area     = document.getElementById('f-area')?.value?.trim();
  const inspector= document.getElementById('f-inspector')?.value?.trim();
  const status   = document.getElementById('f-status')?.value || 'completed';
  const remark   = document.getElementById('f-remark')?.value?.trim();

  if (!date || !area) { alert('กรุณากรอก วันที่ตรวจ และ พื้นที่ตรวจ'); return; }

  const items = formItems.length
    ? formItems.map(it => ({ category: it.category, item: it.item, result: it.result||'na' }))
    : DEFAULT_INSPECTION_ITEMS.map(it => ({ category: it.category, item: it.item, result: 'na' }));

  const passCount = items.filter(it => it.result === 'pass').length;
  const failCount = items.filter(it => it.result === 'fail').length;
  const naCount   = items.filter(it => it.result === 'na').length;
  const assessed  = items.length - naCount;
  const passRate  = assessed > 0 ? Math.round(passCount / assessed * 100) : 100;

  const payload = {
    inspectionDate: date,
    area,
    inspectors: inspector ? [inspector] : [],
    items,
    totalItems: items.length,
    passCount,
    failCount,
    naCount,
    passRate,
    remark,
    status,
    kpoDuty: 'duty6',
  };

  try {
    await createInspection(payload, profile.uid);
    window._closePanel();
    await loadInspect();
  } catch(e) {
    alert('บันทึกไม่ได้: ' + (e?.message||e));
  }
};

/* ───────────── VIEW DETAIL ───────────── */
window._viewInspect = async (id) => {
  detailId = id;
  document.getElementById('panelDetailBody').innerHTML = '<div class="spinner">กำลังโหลด...</div>';
  openPanel('panelDetail');
  try {
    const r = await getInspection(id);
    if (!r) { document.getElementById('panelDetailBody').innerHTML = '<div class="empty">ไม่พบข้อมูล</div>'; return; }

    const groups = {};
    (r.items||[]).forEach(it => {
      if (!groups[it.category]) groups[it.category] = [];
      groups[it.category].push(it);
    });

    const itemsHtml = Object.entries(groups).map(([cat, items]) => `
      <div class="insp-cat">${cat}</div>
      ${items.map(it => `
      <div class="insp-item-row">
        <div class="insp-item-name">${it.item}</div>
        <span class="${it.result==='pass'?'result-pass':it.result==='fail'?'result-fail':'result-na'}">
          ${it.result==='pass'?'✓ ผ่าน':it.result==='fail'?'✗ ไม่ผ่าน':'N/A'}
        </span>
      </div>`).join('')}
    `).join('');

    document.getElementById('panelDetailBody').innerHTML = `
    <div class="detail-section">
      <h3>ข้อมูลทั่วไป</h3>
      <div class="detail-row"><span>วันที่ตรวจ</span><strong>${fmtDate(r.inspectionDate)}</strong></div>
      <div class="detail-row"><span>พื้นที่</span><strong>${r.area||'-'}</strong></div>
      <div class="detail-row"><span>ผู้ตรวจ</span><span>${Array.isArray(r.inspectors)?r.inspectors.join(', '):(r.inspectors||'-')}</span></div>
      <div class="detail-row"><span>สถานะ</span>${statusBadge(r.status||'draft')}</div>
    </div>
    <div class="detail-section">
      <h3>สรุปผล</h3>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;margin-bottom:10px">
        <div style="background:#f0fdf4;border-radius:8px;padding:12px"><div style="font-size:1.4rem;font-weight:700;color:#059669">${r.passCount??'-'}</div><div style="font-size:.72rem;color:#64748b">ผ่าน</div></div>
        <div style="background:#fee2e2;border-radius:8px;padding:12px"><div style="font-size:1.4rem;font-weight:700;color:#dc2626">${r.failCount??'-'}</div><div style="font-size:.72rem;color:#64748b">ไม่ผ่าน</div></div>
        <div style="background:#f1f5f9;border-radius:8px;padding:12px"><div style="font-size:1.4rem;font-weight:700;color:#94a3b8">${r.naCount??'-'}</div><div style="font-size:.72rem;color:#64748b">N/A</div></div>
      </div>
      <div style="font-size:.88rem;text-align:center;font-weight:700;color:${passRateColor(r.passRate||0)}">% ผ่าน: ${r.passRate??'-'}%</div>
    </div>
    ${r.remark ? `<div class="detail-section"><h3>หมายเหตุ</h3><p style="font-size:.82rem;color:#374151">${r.remark}</p></div>` : ''}
    <div class="detail-section">
      <h3>รายการตรวจ</h3>
      ${itemsHtml}
    </div>`;
  } catch(e) {
    document.getElementById('panelDetailBody').innerHTML = `<div style="color:#991b1b">โหลดไม่ได้: ${e?.message||e}</div>`;
  }
};

/* ════════════════════════════════════════════
   TAB 2: STATISTICS
════════════════════════════════════════════ */
let statsLoaded = false;

async function loadStats() {
  if (statsLoaded) return;
  statsLoaded = true;
  renderStatsShell();
  await fetchAndRenderStats();
}

function renderStatsShell() {
  const yearOpts = [THIS_YEAR_CE-1, THIS_YEAR_CE, THIS_YEAR_CE+1]
    .map(y => `<option value="${y}"${y===statsYear?' selected':''}>${y+543} (${y})</option>`).join('');

  document.getElementById('tab-stats').innerHTML = `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <h2 style="font-size:1rem;font-weight:700">📊 สถิติอุบัติเหตุ</h2>
    <select class="year-select" onchange="window._chStatsYear(this.value)">
      ${yearOpts}
    </select>
  </div>
  <div id="stats-kpi" class="kpi-row"></div>
  <div class="card" style="margin-bottom:16px">
    <div class="card-head"><h2>แนวโน้มรายเดือน ปี ${statsYear+543}</h2></div>
    <div id="stats-chart" class="chart-wrap"><div class="spinner">กำลังโหลด...</div></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
    <div class="card">
      <div class="card-head"><h2>จำแนกตามประเภท</h2></div>
      <div id="stats-type" style="padding:12px"><div class="spinner">กำลังโหลด...</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>จำแนกตามแผนก</h2></div>
      <div id="stats-dept" style="padding:12px"><div class="spinner">กำลังโหลด...</div></div>
    </div>
  </div>`;
}

async function fetchAndRenderStats() {
  const startDate = `${statsYear}-01-01`;
  const endDate   = `${statsYear}-12-31`;

  try {
    const [kpi, trend, incidents] = await Promise.all([
      computeSafetyKPIs({ startDate, endDate }),
      monthlyTrend(statsYear),
      listIncidents({ startDate, endDate, lim: 2000 }),
    ]);

    // KPI
    const kpiEl = document.getElementById('stats-kpi');
    if (kpiEl) kpiEl.innerHTML = `
      <div class="kpi blue"><div class="num">${kpi.total}</div><div class="lbl">อุบัติเหตุทั้งหมด</div></div>
      <div class="kpi ${kpi.daysWithoutAccident===null?'gray':'green'}">
        <div class="num">${kpi.daysWithoutAccident===null?'-':kpi.daysWithoutAccident}</div>
        <div class="lbl">วันปลอดอุบัติเหตุ</div>
      </div>
      <div class="kpi ${kpi.fatality>0?'red':'gray'}"><div class="num">${kpi.fatality}</div><div class="lbl">Fatality</div></div>
      <div class="kpi ${kpi.lti>0?'red':'gray'}"><div class="num">${kpi.lti}</div><div class="lbl">LTI (หยุดงาน)</div></div>
      <div class="kpi ${kpi.mtc>0?'amber':'gray'}"><div class="num">${kpi.mtc}</div><div class="lbl">MTC</div></div>
      <div class="kpi ${kpi.fac>0?'amber':'gray'}"><div class="num">${kpi.fac}</div><div class="lbl">FAC</div></div>
      <div class="kpi purple"><div class="num">${kpi.nearMiss}</div><div class="lbl">Near Miss</div></div>`;

    // Monthly chart
    const maxVal = Math.max(1, ...trend.map(m => m.accident + m.nearMiss));
    const chartEl = document.getElementById('stats-chart');
    if (chartEl) chartEl.innerHTML = trend.map(m => {
      const accW  = Math.round(m.accident  / maxVal * 100);
      const nmW   = Math.round(m.nearMiss  / maxVal * 100);
      return `<div class="bar-row">
        <div class="bar-label">${m.label}</div>
        <div class="bar-track">
          ${m.accident>0  ? `<div class="bar-seg" style="width:${accW}%;background:#dc2626" title="อุบัติเหตุ ${m.accident}"></div>` : ''}
          ${m.nearMiss>0  ? `<div class="bar-seg" style="width:${nmW}%;background:#2563eb;opacity:.7" title="Near Miss ${m.nearMiss}"></div>` : ''}
        </div>
        <div class="bar-pct-out" style="font-size:.7rem;color:#94a3b8">${m.accident+m.nearMiss||''}</div>
      </div>`;
    }).join('') + `
    <div style="display:flex;gap:16px;margin-top:10px;font-size:.72rem">
      <span><span style="display:inline-block;width:12px;height:12px;background:#dc2626;border-radius:2px;margin-right:4px;vertical-align:middle"></span>อุบัติเหตุ</span>
      <span><span style="display:inline-block;width:12px;height:12px;background:#2563eb;opacity:.7;border-radius:2px;margin-right:4px;vertical-align:middle"></span>Near Miss</span>
    </div>`;

    // By type
    const typeCounts = {};
    incidents.forEach(r => { const t = r.incidentType||'other'; typeCounts[t] = (typeCounts[t]||0)+1; });
    const typeEl = document.getElementById('stats-type');
    if (typeEl) typeEl.innerHTML = Object.entries(typeCounts).length === 0
      ? `<div class="empty">ไม่มีข้อมูล</div>`
      : Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([t,c]) => {
          const info = INCIDENT_TYPES[t] || { labelTh: t, color: '#6b7280' };
          return `<div class="type-row">
            <div class="type-dot" style="background:${info.color}"></div>
            <div class="type-name">${info.labelTh||t}</div>
            <div class="type-cnt" style="color:${info.color}">${c}</div>
          </div>`;
        }).join('');

    // By dept
    const deptCounts = {};
    incidents.forEach(r => { const d = r.department||'ไม่ระบุ'; deptCounts[d] = (deptCounts[d]||0)+1; });
    const deptEl = document.getElementById('stats-dept');
    if (deptEl) deptEl.innerHTML = Object.entries(deptCounts).length === 0
      ? `<div class="empty">ไม่มีข้อมูล</div>`
      : Object.entries(deptCounts).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([d,c]) => `
          <div class="type-row">
            <div class="type-dot" style="background:#2563eb"></div>
            <div class="type-name" style="font-size:.8rem">${d}</div>
            <div class="type-cnt" style="color:#2563eb">${c}</div>
          </div>`).join('');

  } catch(e) {
    document.getElementById('tab-stats').innerHTML += `
    <div style="background:#fee2e2;border:1px solid #fca5a5;border-radius:10px;padding:20px;color:#991b1b">
      ⚠️ โหลดสถิติไม่ได้: ${e?.message||e}
    </div>`;
  }
}

window._chStatsYear = (y) => {
  statsYear  = Number(y);
  statsLoaded = false;
  renderStatsShell();
  fetchAndRenderStats();
};

/* ───────────── INIT ───────────── */
await loadInspect();
</script>
</body>
</html>
