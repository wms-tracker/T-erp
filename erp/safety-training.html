<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฝึกอบรมความปลอดภัย — KPO Safety</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div id="root" style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:Sarabun,sans-serif;color:#64748b;">กำลังโหลด...</div>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell  } from "./js/shell.js";
import {
  listTrainings, getTraining, createTraining, updateTraining, deleteTraining,
  TRAINING_STATUS, TRAINING_TYPES, DEPARTMENTS
} from "./js/safety-data.js";

const $ = id => document.getElementById(id);
let _profile, _trainings = [];
let _editId = null;
let _filterType = '', _filterStatus = '', _filterDept = '', _search = '';

function buildLayout() {
  document.getElementById('main-content').innerHTML = `
  <style>
    .tr{padding:0 20px 40px;max-width:1200px;margin:0 auto;}
    .page-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:20px 0 14px;}
    .page-title{font-size:1.2rem;font-weight:700;color:#0f172a;display:flex;align-items:center;gap:8px;}
    .btn{padding:7px 16px;border:none;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.83rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn-primary{background:#0891b2;color:#fff;} .btn-primary:hover{background:#0e7490;}
    .btn-ghost{background:#f1f5f9;color:#475569;border:1px solid #e2e8f0;} .btn-ghost:hover{background:#e2e8f0;}
    .btn-sm{padding:5px 11px;font-size:.78rem;}
    .btn-danger{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5;}
    .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600;}
    .sum-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
    .sum-chip{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 16px;flex:1;min-width:110px;text-align:center;}
    .sum-chip .val{font-size:1.4rem;font-weight:800;color:#0f172a;}
    .sum-chip .lbl{font-size:.72rem;color:#94a3b8;margin-top:2px;}
    .filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
    .filter-bar input,.filter-bar select{padding:7px 10px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.82rem;}
    .tbl-wrap{overflow-x:auto;}
    .tbl{width:100%;border-collapse:collapse;font-size:.82rem;}
    .tbl th{text-align:left;padding:9px 12px;font-size:.72rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.04em;background:#f8fafc;border-bottom:1.5px solid #e2e8f0;}
    .tbl td{padding:9px 12px;border-bottom:1px solid #f1f5f9;color:#334155;vertical-align:middle;}
    .tbl tr:hover td{background:#f8fafc;cursor:pointer;}
    .empty-state{text-align:center;padding:60px 20px;color:#94a3b8;}
    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:200;display:flex;align-items:flex-start;justify-content:flex-end;}
    .modal-panel{background:#fff;height:100dvh;width:min(540px,100vw);overflow-y:auto;box-shadow:-4px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column;}
    .modal-head{padding:16px 20px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1;}
    .modal-body{padding:20px;flex:1;}
    .modal-foot{padding:14px 20px;border-top:1px solid #f1f5f9;display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff;}
    .form-group{margin-bottom:12px;}
    .form-label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:4px;}
    .req{color:#dc2626;}
    .form-ctrl{width:100%;padding:8px 11px;border:1px solid #e2e8f0;border-radius:8px;font-family:Sarabun,sans-serif;font-size:.85rem;color:#0f172a;box-sizing:border-box;}
    .form-ctrl:focus{outline:none;border-color:#0891b2;box-shadow:0 0 0 3px rgba(8,145,178,.1);}
    textarea.form-ctrl{resize:vertical;min-height:72px;}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
  </style>
  <div class="tr" id="mainView"></div>
  <div id="mBg" class="modal-bg" style="display:none" onclick="__closeModal(event)">
    <div class="modal-panel">
      <div class="modal-head">
        <div style="font-size:1rem;font-weight:700;color:#0f172a" id="mdTitle">—</div>
        <button class="btn btn-ghost btn-sm" onclick="__closeModal(null)">✕</button>
      </div>
      <div class="modal-body" id="mdBody"></div>
      <div class="modal-foot" id="mdFoot"></div>
    </div>
  </div>`;
}

function renderView() {
  const filtered = _trainings.filter(t => {
    if (_filterType && t.trainingType !== _filterType) return false;
    if (_filterStatus && t.status !== _filterStatus) return false;
    if (_filterDept && t.department !== _filterDept) return false;
    if (_search && !JSON.stringify(t).toLowerCase().includes(_search.toLowerCase())) return false;
    return true;
  });

  const completed = _trainings.filter(t => t.status === 'completed');
  const totalParticipants = completed.reduce((s, t) => s + (t.participantCount || 0), 0);
  const upcoming = _trainings.filter(t => t.status === 'planned' && t.trainingDate >= new Date().toISOString().split('T')[0]).length;

  $('mainView').innerHTML = `
  <div class="page-header">
    <div class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0891b2" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      ฝึกอบรมความปลอดภัย
    </div>
    <button class="btn btn-primary" onclick="__openForm(null)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      บันทึกการฝึกอบรม
    </button>
  </div>

  <div class="sum-bar">
    <div class="sum-chip"><div class="val">${_trainings.length}</div><div class="lbl">รายการทั้งหมด</div></div>
    <div class="sum-chip"><div class="val" style="color:#16a34a">${completed.length}</div><div class="lbl">เสร็จแล้ว</div></div>
    <div class="sum-chip"><div class="val" style="color:#2563eb">${upcoming}</div><div class="lbl">ที่วางแผนไว้</div></div>
    <div class="sum-chip"><div class="val" style="color:#0891b2">${totalParticipants}</div><div class="lbl">ผู้เข้าร่วมสะสม</div></div>
  </div>

  <div class="filter-bar">
    <input type="text" placeholder="ค้นหา..." oninput="__srch(this.value)" style="min-width:180px">
    <select onchange="__fType(this.value)">
      <option value="">ทุกประเภท</option>
      ${TRAINING_TYPES.map(t => `<option value="${t.key}" ${_filterType===t.key?'selected':''}>${t.label}</option>`).join('')}
    </select>
    <select onchange="__fStatus(this.value)">
      <option value="">ทุกสถานะ</option>
      ${Object.entries(TRAINING_STATUS).map(([k,v]) => `<option value="${k}" ${_filterStatus===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
    <select onchange="__fDept(this.value)">
      <option value="">ทุกแผนก</option>
      ${DEPARTMENTS.map(d => `<option value="${d}" ${_filterDept===d?'selected':''}>${d}</option>`).join('')}
    </select>
  </div>

  ${filtered.length === 0
    ? `<div class="empty-state"><div style="font-size:2.5rem">📚</div><div style="margin-top:8px">ยังไม่มีบันทึกการฝึกอบรม</div></div>`
    : `<div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>วันที่</th><th>หลักสูตร/ประเภท</th><th>แผนก</th><th>วิทยากร</th><th>ผู้เข้าร่วม</th><th>คะแนนเฉลี่ย</th><th>สถานะ</th><th></th></tr></thead>
      <tbody>
      ${filtered.map(t => {
        const s = TRAINING_STATUS[t.status] || TRAINING_STATUS.planned;
        const typeLabel = TRAINING_TYPES.find(x=>x.key===t.trainingType)?.label || t.trainingType || '—';
        return `<tr onclick="__openForm('${t.id}')">
          <td>${t.trainingDate||'—'}</td>
          <td><div style="font-weight:600">${t.title||typeLabel}</div><div style="font-size:.75rem;color:#94a3b8">${typeLabel}</div></td>
          <td>${t.department||'ทุกแผนก'}</td>
          <td>${t.instructor||'—'}</td>
          <td style="text-align:center">${t.participantCount||'—'}</td>
          <td style="text-align:center">${t.avgScore ? t.avgScore+'%' : '—'}</td>
          <td><span class="badge" style="background:${s.bg};color:${s.color}">${s.label}</span></td>
          <td onclick="event.stopPropagation()"><button class="btn btn-danger btn-sm" onclick="__del('${t.id}')">ลบ</button></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`}`;
}

async function openForm(id) {
  _editId = id;
  let t = id ? (_trainings.find(x=>x.id===id) || await getTraining(id)) : null;
  $('mdTitle').textContent = id ? 'แก้ไขบันทึกการฝึกอบรม' : 'บันทึกการฝึกอบรมใหม่';
  $('mdBody').innerHTML = `
  <div class="form-group">
    <label class="form-label">ชื่อหลักสูตร <span class="req">*</span></label>
    <input type="text" class="form-ctrl" id="fTitle" value="${t?.title||''}" placeholder="ชื่อหลักสูตร / หัวข้ออบรม">
  </div>
  <div class="form-grid">
    <div class="form-group">
      <label class="form-label">ประเภทการฝึกอบรม <span class="req">*</span></label>
      <select class="form-ctrl" id="fType">
        ${TRAINING_TYPES.map(x=>`<option value="${x.key}" ${t?.trainingType===x.key?'selected':''}>${x.label}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">สถานะ</label>
      <select class="form-ctrl" id="fStatus">
        ${Object.entries(TRAINING_STATUS).map(([k,v])=>`<option value="${k}" ${(t?.status||'planned')===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">วันที่อบรม <span class="req">*</span></label>
      <input type="date" class="form-ctrl" id="fDate" value="${t?.trainingDate||''}">
    </div>
    <div class="form-group">
      <label class="form-label">ระยะเวลา (ชั่วโมง)</label>
      <input type="number" class="form-ctrl" id="fHours" value="${t?.durationHours||''}" min="1" step="0.5">
    </div>
    <div class="form-group">
      <label class="form-label">แผนก / กลุ่มเป้าหมาย</label>
      <select class="form-ctrl" id="fDept">
        <option value="">ทุกแผนก</option>
        ${DEPARTMENTS.map(d=>`<option value="${d}" ${t?.department===d?'selected':''}>${d}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">จำนวนผู้เข้าร่วม</label>
      <input type="number" class="form-ctrl" id="fCount" value="${t?.participantCount||''}" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">วิทยากร / ผู้จัดอบรม</label>
      <input type="text" class="form-ctrl" id="fInstr" value="${t?.instructor||''}">
    </div>
    <div class="form-group">
      <label class="form-label">สถานที่</label>
      <input type="text" class="form-ctrl" id="fVenue" value="${t?.venue||''}">
    </div>
    <div class="form-group">
      <label class="form-label">คะแนนเฉลี่ย (%) ถ้ามีการทดสอบ</label>
      <input type="number" class="form-ctrl" id="fScore" value="${t?.avgScore||''}" min="0" max="100">
    </div>
    <div class="form-group">
      <label class="form-label">ค่าใช้จ่าย (บาท)</label>
      <input type="number" class="form-ctrl" id="fCost" value="${t?.cost||''}" min="0">
    </div>
  </div>
  <div class="form-group">
    <label class="form-label">สรุปเนื้อหา / หมายเหตุ</label>
    <textarea class="form-ctrl" id="fNote">${t?.note||''}</textarea>
  </div>`;
  $('mdFoot').innerHTML = `
    <button class="btn btn-ghost" onclick="__closeModal(null)">ยกเลิก</button>
    ${id?`<button class="btn btn-danger btn-sm" onclick="__del('${id}')">ลบ</button>`:''}
    <button class="btn btn-primary" id="mdSave" onclick="__save()">${id?'บันทึกการแก้ไข':'บันทึก'}</button>`;
  $('mBg').style.display = 'flex';
}

async function save() {
  const title = $('fTitle')?.value?.trim();
  const date  = $('fDate')?.value;
  if (!title || !date) { showToast('กรุณาระบุชื่อหลักสูตรและวันที่', '#dc2626'); return; }
  const data = {
    title, trainingType: $('fType')?.value, status: $('fStatus')?.value||'planned',
    trainingDate: date, durationHours: +($('fHours')?.value||0)||null,
    department: $('fDept')?.value||'', participantCount: +($('fCount')?.value||0)||null,
    instructor: $('fInstr')?.value?.trim()||'', venue: $('fVenue')?.value?.trim()||'',
    avgScore: +($('fScore')?.value||0)||null, cost: +($('fCost')?.value||0)||null,
    note: $('fNote')?.value?.trim()||'',
  };
  const btn = $('mdSave'); btn.disabled=true; btn.textContent='กำลังบันทึก...';
  try {
    if (_editId) await updateTraining(_editId, data);
    else await createTraining(data, _profile.uid);
    _trainings = await listTrainings({ lim: 200 });
    closeModal(null); renderView();
    showToast('บันทึกแล้ว ✓', '#16a34a');
  } catch(e) { btn.disabled=false; btn.textContent=_editId?'บันทึกการแก้ไข':'บันทึก'; showToast(e.message,'#dc2626'); }
}

async function del(id) {
  if (!confirm('ลบบันทึกนี้?')) return;
  await deleteTraining(id);
  _trainings = await listTrainings({ lim: 200 });
  closeModal(null); renderView();
  showToast('ลบแล้ว','#0891b2');
}

function closeModal(e) { if (e && e.target!==$('mBg')) return; $('mBg').style.display='none'; }
function showToast(msg,color='#16a34a'){const el=document.createElement('div');el.style.cssText=`position:fixed;bottom:24px;right:24px;background:${color};color:#fff;padding:12px 20px;border-radius:10px;font-family:Sarabun,sans-serif;font-size:.85rem;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2)`;el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3500);}

window.__openForm=openForm; window.__save=save; window.__del=del; window.__closeModal=closeModal;
window.__srch=v=>{_search=v;renderView()};
window.__fType=v=>{_filterType=v;renderView()};
window.__fStatus=v=>{_filterStatus=v;renderView()};
window.__fDept=v=>{_filterDept=v;renderView()};

_profile = await requireRole(['safety_officer','kpo','admin','manager']);
renderShell(_profile, 'safety-training', 'ฝึกอบรมความปลอดภัย');
buildLayout();
_trainings = await listTrainings({ lim: 200 });
renderView();
</script>
</body>
</html>
