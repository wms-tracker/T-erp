<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>รายละเอียดรายงาน คปอ — Web ERP</title>
<link rel="stylesheet" href="css/erp.css" />
</head>
<body></body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import { toast, confirmModal } from "./js/ui.js";
import {
  SEVERITY_LABEL, SEVERITY_CLASS, SEVERITY_DESC, SEVERITY_CRITICAL_LEVELS, STATUS_LIST, STATUS_BADGE, STATUS_CLOSED,
  getReport, listImages, listHistory, changeStatus,
  uploadImage, historyActionLabel,
  WORKFLOW_STEPS, stepIndex, inferLegacyStep, composeExecutiveSummary, computeAgeSLA,
  addProgressUpdate, listProgressUpdates, uploadProgressAsset,
} from "./js/damage-reports.js";

const profile = await requireRole(["warehouse", "manager"]);
const canEdit = profile.role === "warehouse" || profile.role === "admin";
const user = { uid: profile.uid, name: profile.name, email: profile.email };
const params = new URLSearchParams(location.search);
const reportId = params.get("id");

const main = renderShell(profile, "damage-dashboard", "📄 รายละเอียดรายงาน คปอ");

if (!reportId) {
  main.innerHTML = `<div class="card">ไม่พบเลขที่รายงาน — <a href="damage-reports.html">กลับไปแดชบอร์ด</a></div>`;
  throw new Error("no id");
}

main.innerHTML = `
  <div class="card"><div class="skeleton skel-line w-40" style="height:22px;"></div><div class="skeleton skel-line w-60"></div></div>
  <div class="card"><div class="skeleton skel-line w-80"></div><div class="skeleton skel-line w-60"></div><div class="skeleton skel-line w-40"></div></div>
`;

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtDate(s) { if (!s) return "-"; try { return new Date(s).toLocaleDateString("th-TH", { year: "numeric", month: "long", day: "numeric" }); } catch (e) { return s; } }
function fmtDateTime(ts) {
  if (!ts) return "-";
  const d = ts?.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
}
function locStr(loc) {
  if (!loc) return "-";
  const parts = [
    loc.building && `อาคาร ${loc.building}`, loc.floor && `ชั้น ${loc.floor}`,
    loc.zone && `Zone ${loc.zone}`, loc.area && `Area ${loc.area}`,
    loc.point && `จุด ${loc.point}`, loc.rack && `แร็ค ${loc.rack}`,
  ].filter(Boolean);
  let s = parts.join(" / ") || "-";
  if (loc.note) s += ` — ${loc.note}`;
  return s;
}
function fmtDateShortLocal(ts) {
  if (!ts) return "";
  const d = ts?.toDate ? ts.toDate() : new Date(ts);
  if (Number.isNaN(d.getTime())) return "";
  return d.toLocaleDateString("th-TH", { day: "numeric", month: "short" });
}
function firstReachedDate(stepKey, progressUpdates, report) {
  if (stepKey === "reported") return report.createdAt || null;
  const matches = progressUpdates.filter((u) => u.step === stepKey && u.createdAt);
  if (!matches.length) return null;
  return matches.reduce((min, u) => (!min || u.createdAt.toMillis() < min.toMillis() ? u.createdAt : min), null);
}
function impactList(impact) {
  if (!impact) return [];
  const list = [];
  if (impact.operations) list.push("มีผลต่อการทำงาน");
  if (impact.safety) list.push("มีผลต่อความปลอดภัย");
  if (impact.property) list.push("มีผลต่อสินค้า/ทรัพย์สิน");
  return list;
}

const HISTORY_TONE = { create: "tl-create", change_status: "tl-status", upload_image: "tl-image", delete_image: "tl-image", close: "tl-close" };
function timelineItem(h) {
  const tone = h.action === "change_status" && h.newValue === "ปิดรายงาน" ? "tl-close" : (HISTORY_TONE[h.action] || "tl-status");
  let detail = "";
  if (h.action === "change_status") detail = `${esc(h.oldValue || "-")} → ${esc(h.newValue || "-")}`;
  else if (h.action === "update_field") detail = `${esc(h.field || "")}: ${esc((h.oldValue || "-").slice(0, 40))} → ${esc((h.newValue || "-").slice(0, 40))}`;
  else if (h.newValue) detail = esc(h.newValue.slice(0, 60));
  return `
    <div class="timeline-item ${tone}">
      <div class="timeline-time">${fmtDateTime(h.changedAt)}</div>
      <div class="timeline-title">${historyActionLabel(h.action)}</div>
      ${detail ? `<div class="timeline-detail">${detail}</div>` : ""}
      <div class="timeline-detail by">โดย ${esc(h.changedByName || "-")}</div>
    </div>`;
}

function progressUpdateItem(u) {
  const s = WORKFLOW_STEPS.find((x) => x.key === u.step) || WORKFLOW_STEPS[0];
  return `
    <div class="timeline-item tl-status">
      <div class="timeline-time">${fmtDateTime(u.createdAt)}</div>
      <div class="timeline-title">${s.icon} ${esc(s.label)} · ${u.progressPercent || 0}%</div>
      <div class="timeline-detail">${esc(u.text)}</div>
      ${u.blocker ? `<div class="timeline-detail" style="color:#c62828;font-weight:600;">🔴 ${esc(u.blocker)}</div>` : ""}
      ${u.nextAction ? `<div class="timeline-detail">➡️ ${esc(u.nextAction)}${u.nextActionDue ? ` (กำหนด ${fmtDate(u.nextActionDue)})` : ""}</div>` : ""}
      ${u.images?.length ? `<div class="img-gallery" style="margin-top:8px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;">${u.images.map((img, i) => `<div class="img-thumb"><button type="button" class="img-zoom-btn" onclick="window.open('${img.url}','_blank')" aria-label="ดูรูปที่ ${i + 1} ขยาย"><img src="${img.url}" alt="รูปประกอบการอัปเดตความคืบหน้า ${i + 1}" style="height:88px;" /></button></div>`).join("")}</div>` : ""}
      ${u.attachments?.length ? `<div class="timeline-detail">📎 ${u.attachments.map((a) => `<a href="${a.url}" target="_blank">${esc(a.fileName || "เอกสาร")}</a>`).join(", ")}</div>` : ""}
      <div class="timeline-detail by">โดย ${esc(u.createdByName || "-")}</div>
    </div>`;
}

function showFlashToast() {
  const raw = sessionStorage.getItem("dar-flash");
  if (!raw) return;
  sessionStorage.removeItem("dar-flash");
  try { toast(JSON.parse(raw)); } catch (e) {}
}

// สเปกข้อ 59: Progress Update modal — ต้องอัปเดตได้จากมือถือภายใน 30–60 วินาที จึงมีแค่ "วันนี้ทำอะไร"
// เป็นช่องเดียวที่บังคับ ส่วนที่เหลือกรอกเพิ่มได้ถ้ามีเวลา
const PU_MAX_IMAGES = 10;
function openProgressUpdateModal(report) {
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `
    <div class="modal-box modal-wide" role="dialog" aria-modal="true" aria-labelledby="pu-title">
      <h3 id="pu-title">📝 อัปเดตความคืบหน้า</h3>
      <div class="field"><label for="pu-text">วันนี้ทำอะไร? <span class="req">*</span></label><textarea id="pu-text" rows="3" placeholder="เช่น ติดต่อวิศวกรเข้าตรวจสอบแล้ว รอนัดหน้างาน"></textarea></div>
      <div class="field"><label for="pu-step">ตอนนี้ถึงขั้นตอนไหน? <span class="req">*</span></label>
        <select id="pu-step">${WORKFLOW_STEPS.map((s) => `<option value="${s.key}" ${s.key === inferLegacyStep(report) ? "selected" : ""}>${s.icon} ${esc(s.label)}</option>`).join("")}</select>
      </div>
      <div class="field"><label for="pu-progress">ความคืบหน้า (%)</label><input id="pu-progress" type="number" min="0" max="100" value="${report.progressPercent || 0}" /></div>
      <div class="field"><label for="pu-blocker">ปัญหา/อุปสรรค (ถ้ามี)</label><textarea id="pu-blocker" rows="2" placeholder="เช่น รอ Vendor ยืนยันวันส่งอะไหล่">${esc(report.blockerText || "")}</textarea></div>
      <div class="field"><label for="pu-next">ขั้นตอนต่อไป</label><textarea id="pu-next" rows="2">${esc(report.nextAction || "")}</textarea></div>
      <div class="grid-cards">
        <div class="field"><label for="pu-assignee">ผู้รับผิดชอบขั้นตอนถัดไป</label><input id="pu-assignee" value="${esc(report.nextActionAssignee || "")}" /></div>
        <div class="field"><label for="pu-due">กำหนดเสร็จ</label><input id="pu-due" type="date" value="${esc(report.nextActionDue || report.dueDate || "")}" /></div>
      </div>
      <div class="field">
        <label>แนบรูปภาพ <span id="pu-count" style="font-weight:400;color:#5f6368;">(0/${PU_MAX_IMAGES})</span></label>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <label class="btn btn-outline" style="min-height:44px;cursor:pointer;">📷 ถ่ายรูป<input id="pu-cam" type="file" accept="image/*" capture="environment" hidden /></label>
          <label class="btn btn-outline" style="min-height:44px;cursor:pointer;">🖼 เลือกรูปจากเครื่อง (หลายรูปได้)<input id="pu-gallery" type="file" accept="image/*" multiple hidden /></label>
        </div>
        <div class="img-gallery" id="pu-preview" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;"></div>
      </div>
      <div class="field"><label for="pu-docs">แนบเอกสาร (PDF/Excel ฯลฯ)</label><input id="pu-docs" type="file" multiple /></div>
      <div class="msg" id="pu-msg"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" data-act="cancel" style="min-height:44px;">ยกเลิก</button>
        <button class="btn btn-primary" data-act="save" style="min-height:44px;">บันทึก Update</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);

  // รูปสะสมได้ทีละรูป/หลายรูป (ถ่ายเพิ่มได้เรื่อยๆ ไม่ทับรูปเดิม) — input ของ capture เลือกได้ทีละรูปเสมอ
  // จึงแยกปุ่ม "ถ่ายรูป" กับ "เลือกจากเครื่อง" แล้วสะสมลงลิสต์เดียวกัน
  let picked = [];
  const renderPicked = () => {
    document.getElementById("pu-count").textContent = `(${picked.length}/${PU_MAX_IMAGES})`;
    document.getElementById("pu-preview").innerHTML = picked.map((p, i) => `
      <div class="img-thumb">
        <img src="${p.url}" alt="รูปที่ ${i + 1} ที่จะแนบ" style="height:80px;" />
        <div class="tools"><button type="button" data-rm="${i}" aria-label="ลบรูปที่ ${i + 1}">✕</button></div>
      </div>`).join("");
    document.querySelectorAll("#pu-preview [data-rm]").forEach((b) => b.addEventListener("click", () => {
      const [gone] = picked.splice(Number(b.dataset.rm), 1);
      URL.revokeObjectURL(gone.url);
      renderPicked();
    }));
  };
  const addFiles = (e) => {
    const files = [...(e.target.files || [])];
    e.target.value = "";
    const room = PU_MAX_IMAGES - picked.length;
    if (files.length > room) toast({ type: "info", title: `แนบได้สูงสุด ${PU_MAX_IMAGES} รูปต่อการอัปเดต`, desc: room > 0 ? `เพิ่มให้ ${room} รูปแรก` : "" });
    files.slice(0, Math.max(0, room)).forEach((file) => picked.push({ file, url: URL.createObjectURL(file) }));
    renderPicked();
  };
  document.getElementById("pu-cam").addEventListener("change", addFiles);
  document.getElementById("pu-gallery").addEventListener("change", addFiles);

  const close = () => { document.removeEventListener("keydown", onKey); picked.forEach((p) => URL.revokeObjectURL(p.url)); backdrop.remove(); };
  function onKey(e) { if (e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('[data-act="cancel"]').addEventListener("click", close);
  backdrop.querySelector('[data-act="save"]').addEventListener("click", async () => {
    const text = document.getElementById("pu-text").value.trim();
    const msg = document.getElementById("pu-msg");
    msg.className = "msg";
    if (!text) { msg.classList.add("error"); msg.textContent = "กรุณากรอกว่าวันนี้ทำอะไร"; return; }
    const saveBtn = backdrop.querySelector('[data-act="save"]');
    saveBtn.disabled = true;
    try {
      const docFiles = [...(document.getElementById("pu-docs").files || [])];
      // อัปโหลดขนานกัน (หลายรูปพร้อมกัน เร็วกว่าทีละรูปมากบน wifi คลัง) พร้อมนับความคืบหน้า
      const total = picked.length + docFiles.length;
      let doneCount = 0;
      const track = (p) => p.then((r) => { doneCount++; msg.textContent = `กำลังอัปโหลดไฟล์ ${doneCount}/${total}...`; return r; });
      if (total) msg.textContent = `กำลังอัปโหลดไฟล์ 0/${total}...`;
      const [images, attachments] = await Promise.all([
        Promise.all(picked.map((p) => track(uploadProgressAsset(reportId, p.file, "image")))),
        Promise.all(docFiles.map((f) => track(uploadProgressAsset(reportId, f, "document")))),
      ]);
      msg.textContent = "กำลังบันทึก...";
      await addProgressUpdate(reportId, {
        text,
        step: document.getElementById("pu-step").value,
        progressPercent: document.getElementById("pu-progress").value,
        blocker: document.getElementById("pu-blocker").value.trim(),
        nextAction: document.getElementById("pu-next").value.trim(),
        nextActionAssignee: document.getElementById("pu-assignee").value.trim(),
        nextActionDue: document.getElementById("pu-due").value,
        images, attachments,
      }, user);
      close();
      await load();
      toast({ title: "บันทึกความคืบหน้าแล้ว" });
    } catch (err) {
      msg.classList.add("error");
      msg.textContent = "บันทึกไม่สำเร็จ: " + (err?.message || err);
      saveBtn.disabled = false;
    }
  });
}

async function load() {
  const report = await getReport(reportId);
  if (!report) {
    main.innerHTML = `<div class="card">ไม่พบรายงานนี้ — <a href="damage-reports.html">กลับไปแดชบอร์ด</a></div>`;
    return;
  }
  const [mainImgs, beforeImgs, afterImgs, history, progressUpdates] = await Promise.all([
    listImages(reportId, "main"), listImages(reportId, "before"), listImages(reportId, "after"), listHistory(reportId),
    listProgressUpdates(reportId),
  ]);

  const curStepKey = inferLegacyStep(report);
  const curIdx = stepIndex(curStepKey);
  const curStepObj = WORKFLOW_STEPS[curIdx];
  const sla = computeAgeSLA(report);
  const summaryText = composeExecutiveSummary(report);

  main.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center;">
      <div>
        <div style="font-size:1.3rem;font-weight:800;color:#1a237e;">${esc(report.reportNo)}</div>
        <div style="font-size:0.82rem;color:#5f6368;margin-top:4px;">แจ้งเมื่อ ${fmtDateTime(report.createdAt)} โดย ${esc(report.reporterName)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span class="sev-badge ${SEVERITY_CLASS[report.severity] || ""}"><span class="sev-dot ${SEVERITY_CLASS[report.severity] || ""}"></span>${SEVERITY_LABEL[report.severity] || report.severity}</span>
        <span class="badge ${STATUS_BADGE[report.status] || "badge-pending"}">${esc(report.status)}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" id="btn-print" style="min-height:44px;">🖨 Generate Report / PDF</button>
        ${canEdit ? `<button class="btn btn-outline" id="btn-edit" style="min-height:44px;">✏️ แก้ไข</button>` : ""}
        <a class="btn btn-outline" href="damage-reports.html" style="min-height:44px;">⬅ กลับ</a>
      </div>
    </div>

    ${report.blockerText ? `
    <div class="blocker-banner">
      <span class="bb-icon">🔴</span>
      <div>
        <div>BLOCKER: ${esc(report.blockerText)}</div>
        <div class="bb-since">${report.blockerSince ? `ติดปัญหานี้ตั้งแต่ ${fmtDateTime(report.blockerSince)}` : ""}</div>
      </div>
    </div>` : ""}

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
        <span class="hero-step-badge">${curStepObj.icon} ${esc(curStepObj.label)} · Step ${curIdx + 1}/${WORKFLOW_STEPS.length}</span>
        ${canEdit ? `<button class="btn btn-primary btn-lg" id="btn-progress-update">📝 อัปเดตความคืบหน้า</button>` : ""}
      </div>
      <div class="progress-track"><div class="progress-fill ${(report.progressPercent || 0) >= 100 ? "done" : ""}" style="width:${report.progressPercent || 0}%;"></div></div>
      <div style="font-size:0.78rem;color:#6b7280;">${report.progressPercent || 0}% เสร็จสมบูรณ์</div>
      <div class="hero-summary">
        ${esc(summaryText)}
        <span class="tpl-tag">*สรุปนี้ประกอบจากข้อมูลในระบบโดยอัตโนมัติ (template) ไม่ใช่ AI สรุปให้</span>
      </div>
      <div class="grid-cards">
        <div><label style="font-size:0.78rem;color:#5f6368;">ผู้รับผิดชอบ</label><div>${esc(report.responsiblePerson) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#5f6368;">กำหนดเสร็จ</label><div>${sla.due ? fmtDate(sla.due) : "-"}${sla.dueDays != null ? ` <span class="age-badge ${sla.isOverdue ? "overdue" : "ok"}">${sla.isOverdue ? `เกินกำหนด ${Math.abs(sla.dueDays)} วัน` : `เหลือ ${sla.dueDays} วัน`}</span>` : ""}</div></div>
        <div><label style="font-size:0.78rem;color:#5f6368;">อายุงาน</label><div>${sla.ageDays != null ? `${sla.ageDays} วัน` : "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#5f6368;">ขั้นตอนถัดไป</label><div>${esc(report.nextAction) || "-"}${report.nextActionAssignee ? ` <span style="color:#6b7280;">(${esc(report.nextActionAssignee)})</span>` : ""}</div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="font-size:0.95rem;">🗺️ Workflow Timeline</div>
      <div class="wf-timeline">
        ${WORKFLOW_STEPS.map((s, i) => {
          const done = i < curIdx || (i === curIdx && s.key === "closed");
          const current = i === curIdx;
          const reachedDate = firstReachedDate(s.key, progressUpdates, report);
          return `
          ${i > 0 ? `<div class="wf-line ${i <= curIdx ? "done" : ""}"></div>` : ""}
          <div class="wf-step ${done ? "done" : ""} ${current ? "current" : ""}">
            <div class="wf-dot">${done && !current ? "✓" : s.icon}</div>
            <div class="wf-label">${esc(s.label)}</div>
            <div class="wf-date">${reachedDate ? fmtDateShortLocal(reachedDate) : ""}</div>
          </div>`;
        }).join("")}
      </div>
    </div>

    <div class="card">
      <div class="section-title">📋 ข้อมูลทั่วไป</div>
      <div class="grid-cards">
        <div><label style="font-size:0.78rem;color:#5f6368;">ผู้แจ้ง</label><div>${esc(report.reporterName) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#5f6368;">แผนก</label><div>${esc(report.department) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#5f6368;">พื้นที่/โซน</label><div>${esc(report.zone) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#5f6368;">ประเภทความเสียหาย</label><div>${esc(report.damageType) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#5f6368;">วันที่พบ</label><div>${fmtDate(report.reportDate)} ${esc(report.reportTime || "")}</div></div>
      </div>
      <div style="margin-top:10px;"><label style="font-size:0.78rem;color:#5f6368;">ตำแหน่งความเสียหาย</label><div>${locStr(report.location)}</div></div>
    </div>

    <div class="card">
      <div class="section-title">📝 รายละเอียดความเสียหาย</div>
      <p><b>${esc(report.title)}</b></p>
      <p style="white-space:pre-wrap;color:#444;">${esc(report.description)}</p>
      ${report.cause ? `<p style="margin-top:10px;"><label style="font-size:0.78rem;color:#5f6368;">สาเหตุเบื้องต้น</label><br>${esc(report.cause)}</p>` : ""}
      ${impactList(report.impact).length || report.impact?.details ? `<p style="margin-top:10px;"><label style="font-size:0.78rem;color:#5f6368;">ผลกระทบ</label><br>
        ${impactList(report.impact).map((t) => `<span class="badge badge-cancel" style="margin-right:6px;">${t}</span>`).join("")}
        ${report.impact?.details ? `<div style="margin-top:6px;color:#555;">${esc(report.impact.details)}</div>` : ""}
      </p>` : ""}
    </div>

    <div class="card">
      <div class="section-title">📷 รูปภาพหลักฐาน (${mainImgs.length})</div>
      <div class="img-gallery">

    <div class="card">
      <div class="section-title">🔧 การประเมินและการแก้ไข</div>

        <div><label style="font-size:0.78rem;color:#5f6368;">วันที่ต้องการให้ดำเนินการ</label><div>${fmtDate(report.dueDate)}</div></div>

          ${canEdit ? `<label class="upload-drop" style="margin-top:10px;padding:14px;"><div>📷 เพิ่มรูป Before</div><input type="file" id="up-before" accept="image/*" capture="environment" multiple /></label>` : ""}

        <div class="ba-col">
          <h4>หลังแก้ไข (After)</h4>
          <div class="img-gallery">${afterImgs.map((img) => `<div class="img-thumb"><span class="type-tag" style="background:rgba(26,138,58,0.9);">AFTER</span><button type="button" class="img-zoom-btn" onclick="window.open('${img.url}','_blank')" aria-label="ดูรูป After ขยาย"><img src="${img.url}" alt="${esc(img.caption) || "รูปหลังแก้ไข"}" /></button><div class="cap">${esc(img.caption) || ""}</div></div>`).join("") || `<p style="color:#6b7280;font-size:0.85rem;">— ยังไม่มีรูป —</p>`}</div>
          ${canEdit ? `<label class="upload-drop" style="margin-top:10px;padding:14px;"><div>📷 เพิ่มรูป After</div><input type="file" id="up-after" accept="image/*" capture="environment" multiple /></label>` : ""}

  document.getElementById("btn-status-save")?.addEventListener("click", async () => {
    const sel = document.getElementById("status-select");
    try {
      await changeStatus(reportId, sel.value, user);
      await load();
      toast({ title: "บันทึกสถานะแล้ว", desc: sel.value });
    } catch (e) {
      toast({ type: "error", title: "บันทึกสถานะไม่สำเร็จ", desc: e.message });
    }
  });
  document.getElementById("btn-close")?.addEventListener("click", async () => {
    const ok = await confirmModal({
      icon: "✔",
      title: "ยืนยันปิดรายงานนี้?",
      desc: "หลังปิดแล้วยังแก้ไขสถานะกลับได้ในภายหลังหากจำเป็น",
      confirmLabel: "ปิดรายงาน",
      danger: false,
    });
    if (!ok) return;
    try {
      await changeStatus(reportId, STATUS_CLOSED, user);
      await load();
      toast({ title: "ปิดรายงานแล้ว", desc: report.reportNo });
    } catch (e) {
      toast({ type: "error", title: "ปิดรายงานไม่สำเร็จ", desc: e.message });
    }
  });

  document.getElementById("up-before")?.addEventListener("change", (e) => handleBAUpload(e, "before"));
  document.getElementById("up-after")?.addEventListener("change", (e) => handleBAUpload(e, "after"));

  async function handleBAUpload(e, type) {
    const files = [...e.target.files];
    e.target.value = "";
    if (!files.length) return;
    const m = document.getElementById("ba-msg");
    for (let i = 0; i < files.length; i++) {
      m.textContent = `กำลังอัปโหลดรูป ${type === "before" ? "Before" : "After"} ${i + 1}/${files.length}...`;
      try {
        await uploadImage(reportId, files[i], { imageType: type, capturedAt: new Date().toISOString() }, user);
      } catch (err) { m.className = "msg error"; m.textContent = "อัปโหลดไม่สำเร็จ: " + err.message; return; }
    }
    m.textContent = "";
    await load();
  }
}

await load();
showFlashToast();

// ใช้แพทเทิร์นเดียวกับ __printPackingSlip ใน dashboard-warehouse.html — build HTML string เต็มหน้า
// เปิดหน้าต่างใหม่ แล้วสั่ง window.print() (ผู้ใช้เลือก "Save as PDF" จาก dialog ของเบราว์เซอร์ได้)
function sevInline(sev) {
  const map = { FAC: "background:#e8f5e9;color:#2e7d32;", MTC: "background:#fff8e1;color:#a66a00;", LTI: "background:#ffe4d6;color:#c1440e;", PTD: "background:#fdecea;color:#c62828;" };
  return map[sev] || "background:#eee;color:#555;";
}
function histDetail(h) {
  if (h.action === "change_status") return `${esc(h.oldValue || "-")} → ${esc(h.newValue || "-")}`;
  if (h.action === "update_field") return `${esc(h.field || "")}: ${esc((h.oldValue || "-").slice(0, 50))} → ${esc((h.newValue || "-").slice(0, 50))}`;
  if (h.newValue) return esc(h.newValue.slice(0, 80));
  return "-";
}

      .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

      footer{margin-top:24px;padding-top:10px;border-top:1px solid #ddd;font-size:8.5pt;color:#6b7280;}

      <div class="no-print" style="text-align:right;margin-bottom:10px;">
        <button onclick="window.print()" style="padding:8px 18px;border:none;background:#1a73e8;color:#fff;border-radius:8px;cursor:pointer;font-size:12pt;">🖨 พิมพ์ / บันทึกเป็น PDF</button>
      </div>
      <div class="header">
        <div><div class="brand">🏢 WEB ERP — คลังสินค้า</div><h1 style="margin-top:6px;">รายงาน คปอ <span style="font-size:11pt;font-weight:400;color:#5f6368;">(DAMAGE AREA REPORT)</span></h1></div>
        <div class="doc-meta">เลขที่: <b>${esc(report.reportNo)}</b><br>วันที่พิมพ์: ${new Date().toLocaleString("th-TH")}<br>พิมพ์โดย: ${esc(user?.name || user?.email || "-")}</div>

            <span class="sev-tag" style="${sevInline(report.severity)}">${esc(SEVERITY_LABEL[report.severity] || report.severity)}</span>

      </div></section>` : ""}
      <section><h2>Section 4 — แนวทางแก้ไข</h2>

          <tr><td class="k">แนวทางแก้ไข</td><td colspan="3">${esc(report.correctiveAction) || "-"}</td></tr>
          <tr><td class="k">งบประมาณโดยประมาณ</td><td>${report.estimatedCost ? Number(report.estimatedCost).toLocaleString("th-TH") + " บาท" : "-"}</td><td class="k">กำหนดดำเนินการ</td><td>${fmtDate(report.dueDate)}</td></tr>

      <script>window.onload=()=>{setTimeout(()=>window.print(),200);};<\/script>
    </body></html>`;
  const win = window.open("", "_blank");
  if (win) { win.document.write(html); win.document.close(); }
}
