<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>รายละเอียดรายงานความเสียหาย — Web ERP</title>
<link rel="stylesheet" href="css/erp.css" />
</head>
<body></body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  SEVERITY_LABEL, SEVERITY_CLASS, STATUS_LIST, STATUS_BADGE, STATUS_CLOSED,
  getReport, listImages, listHistory, changeStatus,
  uploadImage, historyActionLabel,
} from "./js/damage-reports.js";

const profile = await requireRole(["warehouse", "manager"]);
const canEdit = profile.role === "warehouse" || profile.role === "admin";
const user = { uid: profile.uid, name: profile.name, email: profile.email };
const params = new URLSearchParams(location.search);
const reportId = params.get("id");

const main = renderShell(profile, "damage-dashboard", "📄 รายละเอียดรายงานความเสียหาย");

if (!reportId) {
  main.innerHTML = `<div class="card">ไม่พบเลขที่รายงาน — <a href="damage-reports.html">กลับไปแดชบอร์ด</a></div>`;
  throw new Error("no id");
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtDate(s) { if (!s) return "-"; try { return new Date(s).toLocaleDateString("th-TH", { year: "numeric", month: "long", day: "numeric" }); } catch (e) { return s; } }
function fmtDateTime(ts) {
  if (!ts) return "-";
  const d = ts?.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
}
function locStr(loc) {
  if (!loc) return "-";
  const parts = [
    loc.building && `อาคาร ${loc.building}`, loc.floor && `ชั้น ${loc.floor}`,
    loc.zone && `Zone ${loc.zone}`, loc.area && `Area ${loc.area}`,
    loc.point && `จุด ${loc.point}`, loc.rack && `แร็ค ${loc.rack}`,
  ].filter(Boolean);
  let s = parts.join(" / ") || "-";
  if (loc.note) s += ` — ${loc.note}`;
  return s;
}
function impactList(impact) {
  if (!impact) return [];
  const list = [];
  if (impact.operations) list.push("มีผลต่อการทำงาน");
  if (impact.safety) list.push("มีผลต่อความปลอดภัย");
  if (impact.property) list.push("มีผลต่อสินค้า/ทรัพย์สิน");
  return list;
}

async function load() {
  const report = await getReport(reportId);
  if (!report) {
    main.innerHTML = `<div class="card">ไม่พบรายงานนี้ — <a href="damage-reports.html">กลับไปแดชบอร์ด</a></div>`;
    return;
  }
  const [mainImgs, beforeImgs, afterImgs, history] = await Promise.all([
    listImages(reportId, "main"), listImages(reportId, "before"), listImages(reportId, "after"), listHistory(reportId),
  ]);

  main.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px;align-items:center;">
      <div>
        <div style="font-size:1.3rem;font-weight:800;color:#1a237e;">${esc(report.reportNo)}</div>
        <div style="font-size:0.82rem;color:#888;margin-top:4px;">แจ้งเมื่อ ${fmtDateTime(report.createdAt)} โดย ${esc(report.reporterName)}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span class="sev-badge ${SEVERITY_CLASS[report.severity] || ""}"><span class="sev-dot ${SEVERITY_CLASS[report.severity] || ""}"></span>${SEVERITY_LABEL[report.severity] || report.severity}</span>
        <span class="badge ${STATUS_BADGE[report.status] || "badge-pending"}">${esc(report.status)}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" id="btn-print">🖨 Generate Report / PDF</button>
        ${canEdit ? `<button class="btn btn-outline" id="btn-edit">✏️ แก้ไข</button>` : ""}
        <a class="btn btn-outline" href="damage-reports.html">⬅ กลับ</a>
      </div>
    </div>

    <div class="card">
      <div class="section-title">📋 ข้อมูลทั่วไป</div>
      <div class="grid-cards">
        <div><label style="font-size:0.78rem;color:#888;">ผู้แจ้ง</label><div>${esc(report.reporterName) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#888;">แผนก</label><div>${esc(report.department) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#888;">พื้นที่/โซน</label><div>${esc(report.zone) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#888;">ประเภทความเสียหาย</label><div>${esc(report.damageType) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#888;">วันที่พบ</label><div>${fmtDate(report.reportDate)} ${esc(report.reportTime || "")}</div></div>
      </div>
      <div style="margin-top:10px;"><label style="font-size:0.78rem;color:#888;">ตำแหน่งความเสียหาย</label><div>${locStr(report.location)}</div></div>
    </div>

    <div class="card">
      <div class="section-title">📝 รายละเอียดความเสียหาย</div>
      <p><b>${esc(report.title)}</b></p>
      <p style="white-space:pre-wrap;color:#444;">${esc(report.description)}</p>
      ${report.cause ? `<p style="margin-top:10px;"><label style="font-size:0.78rem;color:#888;">สาเหตุเบื้องต้น</label><br>${esc(report.cause)}</p>` : ""}
      ${impactList(report.impact).length || report.impact?.details ? `<p style="margin-top:10px;"><label style="font-size:0.78rem;color:#888;">ผลกระทบ</label><br>
        ${impactList(report.impact).map((t) => `<span class="badge badge-cancel" style="margin-right:6px;">${t}</span>`).join("")}
        ${report.impact?.details ? `<div style="margin-top:6px;color:#555;">${esc(report.impact.details)}</div>` : ""}
      </p>` : ""}
    </div>

    <div class="card">
      <div class="section-title">📷 รูปภาพหลักฐาน (${mainImgs.length})</div>
      <div class="img-gallery">
        ${mainImgs.map((img) => `
          <div class="img-thumb"><img src="${img.url}" onclick="window.open('${img.url}','_blank')" style="cursor:zoom-in;" />
            <div class="cap">${esc(img.caption) || "<span style=color:#bbb;>ไม่มีคำบรรยาย</span>"}${img.location ? `<div class="meta">📍 ${esc(img.location)}</div>` : ""}</div>
          </div>`).join("") || `<p style="color:#999;">ไม่มีรูปภาพ</p>`}
      </div>
      ${canEdit ? `<p style="font-size:0.8rem;color:#999;margin-top:10px;">แก้ไข/เพิ่ม/ลบ/จัดเรียงรูปหลักได้ที่หน้า <a href="damage-report-form.html?id=${reportId}">✏️ แก้ไขรายงาน</a></p>` : ""}
    </div>

    <div class="card">
      <div class="section-title">🔧 การประเมินและการแก้ไข</div>
      <div class="grid-cards">
        <div><label style="font-size:0.78rem;color:#888;">ผู้รับผิดชอบ</label><div>${esc(report.responsiblePerson) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#888;">หน่วยงานที่ต้องดำเนินการ</label><div>${esc(report.responsibleDept) || "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#888;">งบประมาณโดยประมาณ</label><div>${report.estimatedCost ? Number(report.estimatedCost).toLocaleString("th-TH") + " บาท" : "-"}</div></div>
        <div><label style="font-size:0.78rem;color:#888;">วันที่ต้องการให้ดำเนินการ</label><div>${fmtDate(report.dueDate)}</div></div>
      </div>
      ${report.correctiveAction ? `<div style="margin-top:10px;"><label style="font-size:0.78rem;color:#888;">แนวทางแก้ไขเบื้องต้น</label><div style="white-space:pre-wrap;">${esc(report.correctiveAction)}</div></div>` : ""}
      ${canEdit ? `
      <div style="margin-top:16px;padding-top:14px;border-top:1px solid #eee;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
        <label style="font-size:0.85rem;">เปลี่ยนสถานะ:</label>
        <select id="status-select">${STATUS_LIST.map((s) => `<option value="${s}" ${s === report.status ? "selected" : ""}>${s}</option>`).join("")}</select>
        <button class="btn btn-primary" id="btn-status-save">💾 บันทึกสถานะ</button>
        ${report.status !== STATUS_CLOSED ? `<button class="btn btn-danger" id="btn-close">✔ ปิดรายงาน</button>` : ""}
        <span class="msg" id="status-msg"></span>
      </div>` : ""}
    </div>

    <div class="card">
      <div class="section-title">🖼 รูปภาพก่อน/หลังแก้ไข (Before / After)</div>
      <div class="ba-compare">
        <div class="ba-col">
          <h4>ก่อนแก้ไข (Before)</h4>
          <div class="img-gallery">${beforeImgs.map((img) => `<div class="img-thumb"><span class="type-tag">BEFORE</span><img src="${img.url}" onclick="window.open('${img.url}','_blank')" style="cursor:zoom-in;" /><div class="cap">${esc(img.caption) || ""}</div></div>`).join("") || `<p style="color:#999;font-size:0.85rem;">— ยังไม่มีรูป —</p>`}</div>
          ${canEdit ? `<label class="upload-drop" style="margin-top:10px;padding:14px;"><div>📷 เพิ่มรูป Before</div><input type="file" id="up-before" accept="image/*" capture="environment" multiple /></label>` : ""}
        </div>
        <div class="ba-col">
          <h4>หลังแก้ไข (After)</h4>
          <div class="img-gallery">${afterImgs.map((img) => `<div class="img-thumb"><span class="type-tag" style="background:rgba(26,138,58,0.9);">AFTER</span><img src="${img.url}" onclick="window.open('${img.url}','_blank')" style="cursor:zoom-in;" /><div class="cap">${esc(img.caption) || ""}</div></div>`).join("") || `<p style="color:#999;font-size:0.85rem;">— ยังไม่มีรูป —</p>`}</div>
          ${canEdit ? `<label class="upload-drop" style="margin-top:10px;padding:14px;"><div>📷 เพิ่มรูป After</div><input type="file" id="up-after" accept="image/*" capture="environment" multiple /></label>` : ""}
        </div>
      </div>
      <span class="msg" id="ba-msg"></span>
    </div>

    <div class="card">
      <div class="section-title">🕘 ประวัติการแก้ไข (Audit Trail)</div>
      <table>
        <thead><tr><th>วันที่/เวลา</th><th>การกระทำ</th><th>ฟิลด์</th><th>ค่าเดิม</th><th>ค่าใหม่</th><th>ผู้แก้ไข</th></tr></thead>
        <tbody>
          ${history.length ? history.map((h) => `
            <tr>
              <td style="font-size:0.8rem;white-space:nowrap;">${fmtDateTime(h.changedAt)}</td>
              <td>${historyActionLabel(h.action)}</td>
              <td style="font-size:0.8rem;color:#888;">${esc(h.field || "-")}</td>
              <td style="font-size:0.8rem;max-width:160px;overflow:hidden;text-overflow:ellipsis;">${esc((h.oldValue || "").slice(0, 60))}</td>
              <td style="font-size:0.8rem;max-width:160px;overflow:hidden;text-overflow:ellipsis;">${esc((h.newValue || "").slice(0, 60))}</td>
              <td style="font-size:0.8rem;">${esc(h.changedByName)}</td>
            </tr>`).join("") : `<tr><td colspan="6" style="text-align:center;color:#999;">ยังไม่มีประวัติ</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById("btn-print")?.addEventListener("click", () => printReport(report, mainImgs, beforeImgs, afterImgs));
  document.getElementById("btn-edit")?.addEventListener("click", () => { location.href = `damage-report-form.html?id=${reportId}`; });

  document.getElementById("btn-status-save")?.addEventListener("click", async () => {
    const sel = document.getElementById("status-select");
    const m = document.getElementById("status-msg");
    try { await changeStatus(reportId, sel.value, user); m.className = "msg ok"; m.textContent = "บันทึกสถานะแล้ว"; await load(); }
    catch (e) { m.className = "msg error"; m.textContent = "ผิดพลาด: " + e.message; }
  });
  document.getElementById("btn-close")?.addEventListener("click", async () => {
    if (!confirm("ยืนยันปิดรายงานนี้? หลังปิดแล้วยังแก้ไขสถานะกลับได้ในภายหลังหากจำเป็น")) return;
    try { await changeStatus(reportId, STATUS_CLOSED, user); await load(); }
    catch (e) { alert("ผิดพลาด: " + e.message); }
  });

  document.getElementById("up-before")?.addEventListener("change", (e) => handleBAUpload(e, "before"));
  document.getElementById("up-after")?.addEventListener("change", (e) => handleBAUpload(e, "after"));

  async function handleBAUpload(e, type) {
    const files = [...e.target.files];
    e.target.value = "";
    if (!files.length) return;
    const m = document.getElementById("ba-msg");
    for (let i = 0; i < files.length; i++) {
      m.textContent = `กำลังอัปโหลดรูป ${type === "before" ? "Before" : "After"} ${i + 1}/${files.length}...`;
      try {
        await uploadImage(reportId, files[i], { imageType: type, capturedAt: new Date().toISOString() }, user);
      } catch (err) { m.className = "msg error"; m.textContent = "อัปโหลดไม่สำเร็จ: " + err.message; return; }
    }
    m.textContent = "";
    await load();
  }
}

await load();

// ---------- Generate Report (Print / Save as PDF) ----------
// ใช้แพทเทิร์นเดียวกับ __printPackingSlip ใน dashboard-warehouse.html — build HTML string เต็มหน้า
// เปิดหน้าต่างใหม่ แล้วสั่ง window.print() (ผู้ใช้เลือก "Save as PDF" จาก dialog ของเบราว์เซอร์ได้)
function sevInline(sev) {
  const map = { "ต่ำ": "background:#e8f5e9;color:#2e7d32;", "ปานกลาง": "background:#fff8e1;color:#a66a00;", "สูง": "background:#ffe4d6;color:#c1440e;", "Critical": "background:#fdecea;color:#c62828;" };
  return map[sev] || "background:#eee;color:#555;";
}
function printReport(report, mainImgs, beforeImgs, afterImgs) {
  const html = `<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8" />
    <title>DAR - ${esc(report.reportNo)}</title>
    <style>
      body{font-family:'Sarabun',Tahoma,sans-serif;margin:16mm;color:#222;font-size:11pt;}
      h1{font-size:16pt;margin:0;}
      .header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1a237e;padding-bottom:10px;margin-bottom:16px;}
      .brand{font-size:13pt;font-weight:800;color:#1a237e;}
      .doc-meta{text-align:right;font-size:10pt;color:#555;}
      .sev-tag{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;font-size:10pt;}
      section{margin-bottom:18px;}
      section h2{font-size:12pt;color:#1a237e;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;}
      table.kv{width:100%;border-collapse:collapse;}
      table.kv td{padding:4px 6px;font-size:10pt;vertical-align:top;}
      table.kv td.k{color:#888;width:150px;white-space:nowrap;}
      .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
      .gallery figure{margin:0;border:1px solid #ddd;border-radius:8px;overflow:hidden;page-break-inside:avoid;}
      .gallery img{width:100%;height:200px;object-fit:cover;display:block;}
      .gallery figcaption{padding:6px 8px;font-size:9pt;color:#444;}
      .ba{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
      .ba h4{font-size:10.5pt;margin:0 0 6px;}
      .ba img{width:100%;height:220px;object-fit:cover;border-radius:8px;border:1px solid #ddd;margin-bottom:8px;}
      .sign-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:34px;}
      .sign-line{border-top:1px solid #333;margin-top:44px;padding-top:6px;font-size:9.5pt;text-align:center;color:#444;}
      @media print { .no-print{display:none!important;} body{margin:12mm 14mm;} section{page-break-inside:avoid;} }
    </style></head><body>
      <div class="no-print" style="text-align:right;margin-bottom:10px;">
        <button onclick="window.print()" style="padding:8px 18px;border:none;background:#1a73e8;color:#fff;border-radius:8px;cursor:pointer;font-size:12pt;">🖨 พิมพ์ / บันทึกเป็น PDF</button>
      </div>
      <div class="header">
        <div><div class="brand">🏢 WEB ERP — คลังสินค้า</div><h1 style="margin-top:6px;">DAMAGE AREA REPORT</h1></div>
        <div class="doc-meta">เลขที่: <b>${esc(report.reportNo)}</b><br>วันที่พิมพ์: ${new Date().toLocaleString("th-TH")}<br>สถานะ: <b>${esc(report.status)}</b></div>
      </div>
      <section><h2>Section 1 — ข้อมูลทั่วไป</h2>
        <table class="kv">
          <tr><td class="k">ผู้แจ้ง</td><td>${esc(report.reporterName)}</td><td class="k">แผนก</td><td>${esc(report.department) || "-"}</td></tr>
          <tr><td class="k">พื้นที่/โซน</td><td>${esc(report.zone)}</td><td class="k">ประเภทความเสียหาย</td><td>${esc(report.damageType)}</td></tr>
          <tr><td class="k">วันที่พบ</td><td>${fmtDate(report.reportDate)} ${esc(report.reportTime || "")}</td><td class="k">ตำแหน่ง</td><td>${esc(locStr(report.location))}</td></tr>
          <tr><td class="k">ระดับความรุนแรง</td><td colspan="3"><span class="sev-tag" style="${sevInline(report.severity)}">${esc(SEVERITY_LABEL[report.severity] || report.severity)}</span></td></tr>
        </table>
      </section>
      <section><h2>Section 2 — รายละเอียดความเสียหาย</h2>
        <table class="kv">
          <tr><td class="k">หัวข้อ</td><td colspan="3">${esc(report.title)}</td></tr>
          <tr><td class="k">รายละเอียด</td><td colspan="3">${esc(report.description)}</td></tr>
          <tr><td class="k">สาเหตุเบื้องต้น</td><td colspan="3">${esc(report.cause) || "-"}</td></tr>
          <tr><td class="k">ผลกระทบ</td><td colspan="3">${esc(impactList(report.impact).join(", ") || "-")}${report.impact?.details ? " — " + esc(report.impact.details) : ""}</td></tr>
        </table>
      </section>
      ${mainImgs.length ? `<section><h2>Section 3 — รูปภาพหลักฐาน</h2><div class="gallery">
        ${mainImgs.map((img, i) => `<figure><img src="${img.url}" /><figcaption><b>Figure ${i + 1}</b>${img.caption ? " — " + esc(img.caption) : ""}${img.location ? "<br>ตำแหน่ง: " + esc(img.location) : ""}</figcaption></figure>`).join("")}
      </div></section>` : ""}
      <section><h2>Section 4 — แนวทางแก้ไข</h2>
        <table class="kv">
          <tr><td class="k">ผู้รับผิดชอบ</td><td>${esc(report.responsiblePerson) || "-"}</td><td class="k">หน่วยงาน</td><td>${esc(report.responsibleDept) || "-"}</td></tr>
          <tr><td class="k">แนวทางแก้ไข</td><td colspan="3">${esc(report.correctiveAction) || "-"}</td></tr>
          <tr><td class="k">งบประมาณโดยประมาณ</td><td>${report.estimatedCost ? Number(report.estimatedCost).toLocaleString("th-TH") + " บาท" : "-"}</td><td class="k">กำหนดดำเนินการ</td><td>${fmtDate(report.dueDate)}</td></tr>
          <tr><td class="k">สถานะปัจจุบัน</td><td colspan="3"><b>${esc(report.status)}</b></td></tr>
        </table>
      </section>
      ${beforeImgs.length || afterImgs.length ? `<section><h2>Section 5 — Before / After</h2><div class="ba">
        <div><h4>ก่อนแก้ไข (Before)</h4>${beforeImgs.map((img) => `<img src="${img.url}" />${img.caption ? `<div style="font-size:9pt;color:#666;margin:-4px 0 8px;">${esc(img.caption)}</div>` : ""}`).join("") || '<p style="color:#999;">— ไม่มีรูป —</p>'}</div>
        <div><h4>หลังแก้ไข (After)</h4>${afterImgs.map((img) => `<img src="${img.url}" />${img.caption ? `<div style="font-size:9pt;color:#666;margin:-4px 0 8px;">${esc(img.caption)}</div>` : ""}`).join("") || '<p style="color:#999;">— ไม่มีรูป —</p>'}</div>
      </div></section>` : ""}
      <section><h2>Section 6 — การอนุมัติ</h2>
        <div class="sign-grid">
          <div class="sign-line">ผู้แจ้ง</div>
          <div class="sign-line">ผู้ตรวจสอบ</div>
          <div class="sign-line">ผู้อนุมัติ</div>
        </div>
        <div style="margin-top:16px;font-size:9.5pt;color:#666;">วันที่: ________________________</div>
      </section>
      <script>window.onload=()=>{setTimeout(()=>window.print(),200);};<\/script>
    </body></html>`;
  const win = window.open("", "_blank");
  if (win) { win.document.write(html); win.document.close(); }
}
</script>
</html>
