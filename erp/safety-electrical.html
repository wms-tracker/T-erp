<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ตรวจสอบระบบไฟฟ้า — KPO Safety</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.section-title{font-size:0.8rem;font-weight:700;color:#1a237e;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:0.75rem;font-weight:600}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.13)}
.card-fail{border-left:4px solid #dc2626;background:#fffafa}
.card-observe{border-left:4px solid #d97706;background:#fffbeb}
.type-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;border:2px solid #e5e7eb;cursor:pointer;font-size:0.82rem;transition:all .15s;user-select:none}
.type-chip.active{border-color:#1a237e;background:#e8eaf6;color:#1a237e;font-weight:700}
.chip-wrap{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s}
.checklist-item:hover{background:#f1f5f9}
.checklist-item.checked{background:#dcfce7}
.checklist-item input[type=checkbox]{width:17px;height:17px;accent-color:#16a34a;flex-shrink:0;margin-top:2px}
.checklist-item label{font-size:0.85rem;cursor:pointer;line-height:1.4}
.progress-wrap{background:#e5e7eb;border-radius:8px;height:8px;overflow:hidden}
.progress-bar{height:100%;border-radius:8px;transition:width .3s}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(520px,100vw);background:#fff;box-shadow:-4px 0 20px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .25s;z-index:1000;display:flex;flex-direction:column;overflow:hidden}
.panel.open{transform:none}
.panel-header{padding:16px 20px;background:#1a237e;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-footer{padding:12px 20px;border-top:1px solid #e5e7eb;display:flex;gap:8px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:999;display:none}
.overlay.open{display:block}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:7px;font-size:0.88rem;font-family:inherit;box-sizing:border-box;margin-top:4px}
textarea{resize:vertical;min-height:70px}
label.lbl{font-size:0.8rem;font-weight:600;color:#374151;display:block;margin-top:10px}
.btn{padding:8px 18px;border:none;border-radius:7px;font-weight:600;cursor:pointer;font-size:0.85rem;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#1a237e;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:#f3f4f6;color:#374151}
.kpi-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.kpi-num{font-size:1.5rem;font-weight:700;color:#1a237e}
.kpi-label{font-size:0.72rem;color:#6b7280;margin-top:2px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-row{grid-template-columns:1fr}}
.search-bar{display:flex;gap:8px;margin-bottom:10px}
.search-bar input{flex:1}
.info-row{display:flex;gap:14px;flex-wrap:wrap;font-size:0.81rem;color:#6b7280;margin-top:3px}
.finding-row{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.finding-row textarea{min-height:40px}
.finding-row button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:0.82rem;background:#f3f4f6;flex-shrink:0;margin-top:4px}
</style>
</head>
<body>
<script type="module">
import { requireRole } from "./js/auth.js";
import { renderShell } from "./js/shell.js";
import {
  ELEC_AREA_TYPES, ELEC_INSP_STATUS, ELEC_CHECKLIST,
  listElectricalInsp, getElectricalInsp, createElectricalInsp,
  updateElectricalInsp, deleteElectricalInsp
} from "./js/safety-data.js";
import './js/safety-attach.js';

const profile = await requireRole(['safety_officer','kpo']);
const main    = renderShell(profile, 'safety-electrical', 'ตรวจสอบความปลอดภัยระบบไฟฟ้า');

const esc     = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const badge   = (l,c,bg) => `<span class="badge" style="color:${c};background:${bg}">${l}</span>`;
const fmtDate = s => s ? new Date(s).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'}) : '-';

let records  = [];
let editId   = null;
let selType  = '';
let chkState = {};
let findings = [];

// ── render ────────────────────────────────────────────────────────────────────
async function render() {
  records = await listElectricalInsp();
  const total   = records.length;
  const pass    = records.filter(r=>r.status==='pass').length;
  const fail    = records.filter(r=>r.status==='fail').length;
  const observe = records.filter(r=>r.status==='observe').length;

  main.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="margin:0;font-size:1.1rem;color:#1a237e">⚡ ตรวจสอบความปลอดภัยระบบไฟฟ้า</h2>
    <button class="btn btn-primary" onclick="window.__openPanel(null)">+ บันทึกการตรวจ</button>
  </div>

  <div class="kpi-bar">
    <div class="kpi-card"><div class="kpi-num">${total}</div><div class="kpi-label">บันทึกทั้งหมด</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#16a34a">${pass}</div><div class="kpi-label">ผ่าน — ปลอดภัย</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#d97706">${observe}</div><div class="kpi-label">ต้องติดตาม</div></div>
    <div class="kpi-card"><div class="kpi-num" style="color:#dc2626">${fail}</div><div class="kpi-label">แก้ไขด่วน</div></div>
  </div>

  <div class="search-bar">
    <input id="search-input" placeholder="ค้นหาสถานที่, ผู้ตรวจ, ประเภทพื้นที่..." oninput="window.__search(this.value)"/>
  </div>

  <div id="list-wrap">${renderList(records)}</div>
  <div class="overlay" id="overlay" onclick="window.__closePanel()"></div>
  <div class="panel" id="panel">
    <div class="panel-header">
      <span id="panel-title">ตรวจสอบระบบไฟฟ้า</span>
      <button onclick="window.__closePanel()" style="background:none;border:none;color:#fff;font-size:1.3rem;cursor:pointer">✕</button>
    </div>
    <div class="panel-body" id="panel-body"></div>
    <div class="panel-footer" id="panel-footer"></div>
  </div>`;
}

function renderList(list) {
  if (!list.length) return `<p style="color:#9ca3af;text-align:center;padding:32px 0">ยังไม่มีบันทึกการตรวจสอบระบบไฟฟ้า</p>`;
  return list.map(r => {
    const st  = ELEC_INSP_STATUS[r.status] || ELEC_INSP_STATUS.pass;
    const at  = ELEC_AREA_TYPES.find(x=>x.key===r.areaType) || {};
    const done = (r.checklist||[]).filter(Boolean).length;
    const pct  = Math.round(done / ELEC_CHECKLIST.length * 100);
    const cls  = r.status==='fail' ? 'card-fail' : r.status==='observe' ? 'card-observe' : '';
    const barC = r.status==='fail' ? 'linear-gradient(90deg,#dc2626,#f87171)' :
                 r.status==='observe' ? 'linear-gradient(90deg,#d97706,#fbbf24)' :
                 'linear-gradient(90deg,#16a34a,#4ade80)';
    return `
    <div class="card ${cls}" onclick="window.__openPanel('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:1rem">${at.icon||'⚡'} ${esc(r.location||'-')}
            <span style="font-weight:400;font-size:0.85rem;color:#374151"> · ${esc(at.label||r.areaType||'-')}</span>
          </div>
          <div class="info-row">
            <span>👤 ${esc(r.inspector||'-')}</span>
            <span>📅 ${fmtDate(r.inspDate)}</span>
            ${r.voltage ? `<span>⚡ ${esc(r.voltage)} V</span>` : ''}
          </div>
          ${r.findings&&r.findings.length ? `<div style="font-size:0.8rem;color:#dc2626;margin-top:3px">⚠️ พบข้อบกพร่อง ${r.findings.length} รายการ</div>` : ''}
        </div>
        <div style="flex-shrink:0;text-align:right">
          ${badge(st.label, st.color, st.bg)}
          <div style="font-size:0.75rem;color:#6b7280;margin-top:4px">ตรวจ ${done}/${ELEC_CHECKLIST.length}</div>
        </div>
      </div>
      <div class="progress-wrap" style="margin-top:8px">
        <div class="progress-bar" style="width:${pct}%;background:${barC}"></div>
      </div>
    </div>`;
  }).join('');
}

window.__search = (q) => {
  const kw = q.toLowerCase();
  const f  = records.filter(r =>
    (r.location||'').toLowerCase().includes(kw) ||
    (r.inspector||'').toLowerCase().includes(kw) ||
    (r.areaType||'').toLowerCase().includes(kw)
  );
  document.getElementById('list-wrap').innerHTML = renderList(f);
};

// ── panel ─────────────────────────────────────────────────────────────────────
window.__openPanel = async (id) => {
  editId   = id;
  selType  = '';
  chkState = {};
  findings = [];
  const panel = document.getElementById('panel');
  const body  = document.getElementById('panel-body');
  const foot  = document.getElementById('panel-footer');
  document.getElementById('panel-title').textContent = id ? 'แก้ไขบันทึก' : 'บันทึกการตรวจสอบ';
  document.getElementById('overlay').classList.add('open');
  panel.classList.add('open');

  let rec = null;
  if (id) {
    rec = await getElectricalInsp(id);
    if (rec) {
      selType  = rec.areaType || '';
      findings = rec.findings ? [...rec.findings] : [];
      (rec.checklist||[]).forEach((v,i)=>{ chkState[ELEC_CHECKLIST[i]?.key] = v; });
    }
  }
  body.innerHTML = renderForm(rec);
  renderChecklist();
  foot.innerHTML = id
    ? `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
       <button class="btn btn-danger" onclick="window.__del('${id}')">ลบ</button>
       <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`
    : `<button class="btn btn-primary" onclick="window.__save()">บันทึก</button>
       <button class="btn btn-ghost" onclick="window.__closePanel()">ยกเลิก</button>`;
};

function renderForm(rec) {
  const today = new Date().toISOString().slice(0,10);
  const chips = ELEC_AREA_TYPES.map(t=>`
    <div class="type-chip ${selType===t.key?'active':''}" onclick="window.__selType('${t.key}')">
      ${t.icon} ${esc(t.label)}
    </div>`).join('');

  return `
  <div class="section-title">ประเภทพื้นที่/ระบบ</div>
  <div class="chip-wrap">${chips}</div>

  <div class="form-row">
    <div>
      <label class="lbl">สถานที่ / ชื่อตู้ไฟ *</label>
      <input id="f-loc" value="${esc(rec?.location||'')}" placeholder="เช่น ตู้ MDB อาคาร A, ห้องไฟฟ้า B1"/>
    </div>
    <div>
      <label class="lbl">แรงดันไฟฟ้า (V)</label>
      <input id="f-voltage" value="${esc(rec?.voltage||'')}" placeholder="เช่น 220, 380, 11000"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">วันที่ตรวจ *</label>
      <input id="f-date" type="date" value="${rec?.inspDate||today}"/>
    </div>
    <div>
      <label class="lbl">ผู้ตรวจสอบ *</label>
      <input id="f-insp" value="${esc(rec?.inspector||profile.displayName||'')}" placeholder="ชื่อผู้ตรวจ"/>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label class="lbl">ผลการตรวจโดยรวม *</label>
      <select id="f-status">
        ${Object.entries(ELEC_INSP_STATUS).map(([k,v])=>`<option value="${k}" ${(rec?.status||'pass')===k?'selected':''}>${v.label}</option>`).join('')}
      </select>
    </div>
    <div>
      <label class="lbl">วันนัดหมายแก้ไข (ถ้ามี)</label>
      <input id="f-fix-date" type="date" value="${rec?.fixByDate||''}"/>
    </div>
  </div>

  <div class="section-title" style="margin-top:16px">รายการตรวจสอบ</div>
  <div class="progress-wrap"><div class="progress-bar" id="cl-bar" style="width:0%"></div></div>
  <div id="cl-pct" style="font-size:0.78rem;color:#6b7280;text-align:right;margin:3px 0 6px">0 / ${ELEC_CHECKLIST.length}</div>
  <div id="checklist-wrap"></div>

  <div class="section-title" style="margin-top:16px">ข้อบกพร่องที่พบ / CAR</div>
  <div id="findings-wrap">${renderFindingsUI()}</div>
  <button class="btn btn-ghost" style="margin-top:4px;font-size:0.82rem" onclick="window.__addFinding()">+ เพิ่มข้อบกพร่อง</button>

  <label class="lbl">หมายเหตุเพิ่มเติม</label>
  <textarea id="f-note">${esc(rec?.note||'')}</textarea>`;
}

function renderChecklist() {
  const wrap = document.getElementById('checklist-wrap');
  if (!wrap) return;
  wrap.innerHTML = ELEC_CHECKLIST.map(item=>`
    <div class="checklist-item ${chkState[item.key]?'checked':''}" onclick="window.__toggleCL('${item.key}')">
      <input type="checkbox" ${chkState[item.key]?'checked':''} onchange="window.__toggleCL('${item.key}')"/>
      <label>${esc(item.label)}</label>
    </div>`).join('');
  updateBar();
}

function updateBar() {
  const done  = Object.values(chkState).filter(Boolean).length;
  const total = ELEC_CHECKLIST.length;
  const pct   = Math.round(done/total*100);
  const bar   = document.getElementById('cl-bar');
  const lbl   = document.getElementById('cl-pct');
  if (bar) { bar.style.width = pct+'%'; bar.style.background = pct===100 ? 'linear-gradient(90deg,#16a34a,#4ade80)' : 'linear-gradient(90deg,#2563eb,#60a5fa)'; }
  if (lbl) lbl.textContent = `${done} / ${total}`;
}

window.__toggleCL = (key) => {
  chkState[key] = !chkState[key];
  renderChecklist();
};

window.__selType = (key) => {
  selType = key;
  document.querySelectorAll('.type-chip').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('onclick')===`window.__selType('${key}')`);
  });
};

function renderFindingsUI() {
  if (!findings.length) return '<p style="color:#9ca3af;font-size:0.82rem;margin:4px 0 0">ไม่มีข้อบกพร่อง</p>';
  return findings.map((f,i)=>`
    <div class="finding-row">
      <textarea rows="2" oninput="window.__updateFinding(${i},this.value)" placeholder="รายละเอียดข้อบกพร่อง...">${esc(f)}</textarea>
      <button onclick="window.__removeFinding(${i})">✕</button>
    </div>`).join('');
}

window.__addFinding    = () => { findings.push(''); document.getElementById('findings-wrap').innerHTML = renderFindingsUI(); };
window.__removeFinding = (i) => { findings.splice(i,1); document.getElementById('findings-wrap').innerHTML = renderFindingsUI(); };
window.__updateFinding = (i,v) => { findings[i] = v; };

// ── save / delete ─────────────────────────────────────────────────────────────
window.__save = async () => {
  const loc   = document.getElementById('f-loc')?.value.trim();
  const insp  = document.getElementById('f-insp')?.value.trim();
  const date  = document.getElementById('f-date')?.value;
  const st    = document.getElementById('f-status')?.value;
  if (!loc || !insp || !date || !selType) {
    alert('กรุณากรอก: ประเภทพื้นที่, สถานที่, ผู้ตรวจ และวันที่ตรวจ');
    return;
  }
  const data = {
    areaType:   selType,
    location:   loc,
    voltage:    document.getElementById('f-voltage')?.value.trim()||'',
    inspDate:   date,
    inspector:  insp,
    status:     st,
    fixByDate:  document.getElementById('f-fix-date')?.value||'',
    checklist:  ELEC_CHECKLIST.map(item=>!!chkState[item.key]),
    findings:   findings.filter(f=>f.trim()),
    note:       document.getElementById('f-note')?.value.trim()||'',
  };
  try {
    if (editId) await updateElectricalInsp(editId, data);
    else        await createElectricalInsp(data, profile.uid);
    window.__closePanel();
    await render();
  } catch(e) { alert('บันทึกไม่สำเร็จ: '+e.message); }
};

window.__del = async (id) => {
  if (!confirm('ยืนยันลบบันทึกนี้?')) return;
  await deleteElectricalInsp(id);
  window.__closePanel();
  await render();
};

window.__closePanel = () => {
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
};

await render();
</script>
</body>
</html>
