<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 ความแม่นของโมเดล — Accuracy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--font:"Plus Jakarta Sans","Noto Sans Thai",system-ui,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  :focus-visible{outline:3px solid #22d3ee;outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{
    animation-duration:.01ms!important;transition-duration:.01ms!important}}
  body{margin:0;min-height:100vh;color:#eef2fb;font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 480px at 12% -8%,rgba(74,222,128,.10),transparent),
      radial-gradient(900px 520px at 88% 4%,rgba(34,211,238,.12),transparent),
      linear-gradient(165deg,#0a0e1f,#121a35);background-attachment:fixed;padding:30px 15px 64px}
  .wrap{max-width:760px;margin:0 auto}
  h1{text-align:center;font-weight:800;letter-spacing:-.5px;font-size:clamp(22px,5vw,30px);margin:.1em 0;
    background:linear-gradient(90deg,#4ade80,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;color:#9aa7c7;font-size:13px;margin-bottom:20px;line-height:1.7}
  a{color:#22d3ee;text-decoration:none} a:hover{text-decoration:underline}
  .row{display:flex;gap:10px;max-width:520px;margin:0 auto 18px}
  select{flex:1;border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,.1);font-family:var(--font);
    background:rgba(0,0,0,.25);color:#eef2fb;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
  select:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.18)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:16px}
  .stat{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);
    border-radius:16px;padding:18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35);
    animation:fade .4s cubic-bezier(.2,.7,.3,1)}
  .stat .v{font-size:34px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#4ade80,#22d3ee);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .l{font-size:12px;color:#9aa7c7;margin-top:5px}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;
    backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card h3{margin:0 0 12px;font-size:14px;color:#22d3ee;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:8px 7px;border-bottom:1px solid rgba(255,255,255,.08)}
  .hit{color:#4ade80;font-weight:800} .miss{color:#fb7185;font-weight:800}
  .loading{text-align:center;color:#9aa7c7;padding:36px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 ความแม่นของโมเดล (พิสูจน์จริง)</h1>
  <div class="sub">วัดแบบ walk-forward: ทำนายย้อนหลังโดยใช้เฉพาะข้อมูล "ก่อนหน้า" แต่ละนัด แล้วเทียบผลจริง · <a href="/">← หน้าหลัก</a></div>
  <div class="row">
    <select id="comp">
      <optgroup label="🏆 ลีกยุโรป">
        <option value="PL">พรีเมียร์ลีก</option>
        <option value="PD">ลาลีกา</option>
        <option value="BL1">บุนเดสลีกา</option>
        <option value="SA">เซเรีย อา</option>
        <option value="FL1">ลีกเอิง</option>
        <option value="DED">เอเรอดีวีซี (ฮอลแลนด์)</option>
        <option value="PPL">ปรีไมรา (โปรตุเกส)</option>
        <option value="ELC">แชมเปียนชิพ (อังกฤษ)</option>
        <option value="CL">แชมเปียนส์ลีก (UCL)</option>
      </optgroup>
      <optgroup label="🌎 อเมริกาใต้">
        <option value="BSA">บราซิล ซีรีอา</option>
        <option value="CLI">โคปา ลิเบอร์ตาดอเรส</option>
      </optgroup>
    </select>
    <select id="season"></select>
  </div>
  <div id="out"><div class="loading">เลือกลีก/ฤดูกาลเพื่อวัดความแม่น...</div></div>
</div>
<script>
const $=s=>document.querySelector(s);

// ฤดูกาลคำนวณจากวันที่อัตโนมัติ (ลีกยุโรปข้ามปี · บราซิลปีปฏิทิน) → ไม่ต้องแก้โค้ดทุกปี
const CALENDAR_LEAGUES=["BSA","CLI"];
function seasonYears(comp){
  const d=new Date(), y=d.getFullYear(), m=d.getMonth()+1;
  const c = CALENDAR_LEAGUES.includes(comp) ? y : (m>=7? y : y-1);
  // วัดความแม่นต้องใช้ฤดูกาลที่มีนัดจบพอ → default = ฤดูกาลก่อน (ครบแล้ว)
  // ต้นฤดูกาลปัจจุบันยังไม่มีนัด จึงเรียงให้ "ฤดูกาลที่จบ" เป็นตัวเลือกแรก
  return [c-1, c-2, c];
}
function fillSeasons(){
  const comp=$("#comp").value, cur=$("#season").value;
  const cal=CALENDAR_LEAGUES.includes(comp);
  $("#season").innerHTML=seasonYears(comp)
    .map(y=>`<option value="${y}">${cal?y:y+"/"+String((y+1)%100).padStart(2,"0")}</option>`).join("");
  if(seasonYears(comp).map(String).includes(cur)) $("#season").value=cur;
}
async function load(){
  $("#out").innerHTML='<div class="loading">⏳ กำลังทำนายย้อนหลังทั้งฤดูกาล... (อาจช้า ~20-40 วิ)</div>';
  try{
    const d=await (await fetch(`/api/accuracy?comp=${$("#comp").value}&season=${$("#season").value}`)).json();
    if(d.error) throw new Error(d.error);
    if(!d.games){ $("#out").innerHTML='<div class="loading">📭 ฤดูกาลนี้ยังไม่มีนัดจบพอวัด (เพิ่งเปิดฤดูกาล) — ลองเลือกฤดูกาลก่อนหน้า</div>'; return; }
    const rows=d.recent.map(r=>`<tr>
      <td style="color:#94a3c4">${r.date}</td>
      <td>${r.home} <b>${r.score}</b> ${r.away}</td>
      <td>ทาย: ${r.pick}</td>
      <td class="${r.hit?'hit':'miss'}">${r.hit?'✓':'✗'}</td></tr>`).join("");
    $("#out").innerHTML=`
      <div class="cards">
        <div class="stat"><div class="v">${d.accuracy}%</div><div class="l">ความแม่น 1X2 (${d.games} นัด)</div></div>
        <div class="stat"><div class="v">${d.ouAcc}%</div><div class="l">สูง/ต่ำ 2.5</div></div>
        <div class="stat"><div class="v">${d.bttsAcc}%</div><div class="l">ทั้งคู่ยิง (BTTS)</div></div>
        <div class="stat"><div class="v">${d.logloss}</div><div class="l">Log-Loss (ต่ำ=ดี)</div></div>
      </div>
      <div class="card"><h3>📋 ตัวอย่างคำทำนายล่าสุด (เทียบผลจริง)</h3>
        <table>${rows}</table></div>
      <div class="sub" style="margin-top:14px">หมายเหตุ: ทำนายมั่ว 3 ทาง ≈ 33% · เก่งสุดของบุ๊กเมกเกอร์ ≈ 53-55% · โมเดลนี้วัดจากข้อมูลจริง ไม่ได้แต่งตัวเลข</div>`;
  }catch(e){
    const msg=/fetch/i.test(e.message)
      ? "⏳ เซิร์ฟเวอร์กำลังตื่น (cold start) — รอ ~30 วิ แล้วลองใหม่อีกครั้ง"
      : "❌ "+e.message;
    $("#out").innerHTML=`<div class="loading">${msg}<br><button onclick="load()" style="margin-top:12px;padding:8px 18px;border-radius:8px;border:1px solid #22d3ee;background:transparent;color:#22d3ee;cursor:pointer;font-family:var(--font)">ลองใหม่</button></div>`;
  }
}
$("#comp").addEventListener("change",()=>{ fillSeasons(); load(); });
$("#season").addEventListener("change",load);
fillSeasons();   // สร้างตัวเลือกฤดูกาลจากวันที่ปัจจุบัน
load();
</script>
</body>
</html>
