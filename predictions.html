<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔮 ทำนายรวม — Predictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{--font:"Plus Jakarta Sans","Noto Sans Thai",system-ui,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  :focus-visible{outline:3px solid #22d3ee;outline-offset:2px;border-radius:8px}
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{
    animation-duration:.01ms!important;transition-duration:.01ms!important}}
  body{margin:0;min-height:100vh;color:#eef2fb;font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;
    background:radial-gradient(900px 480px at 12% -8%,rgba(74,222,128,.10),transparent),
      radial-gradient(900px 520px at 88% 4%,rgba(34,211,238,.12),transparent),
      linear-gradient(165deg,#0a0e1f,#121a35);background-attachment:fixed;padding:30px 15px 64px}
  .wrap{max-width:860px;margin:0 auto}
  h1{text-align:center;font-weight:800;letter-spacing:-.5px;font-size:clamp(22px,5vw,30px);margin:.1em 0;
    background:linear-gradient(90deg,#4ade80,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{text-align:center;color:#9aa7c7;font-size:13px;margin-bottom:20px}
  a{color:#22d3ee;text-decoration:none} a:hover{text-decoration:underline}
  select{width:100%;max-width:360px;display:block;margin:0 auto 14px;border-radius:12px;padding:12px;font-family:var(--font);
    border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.25);color:#eef2fb;font-size:15px;outline:none;
    transition:border-color .15s,box-shadow .15s}
  select:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.18)}
  .card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:16px;
    padding:16px;margin-bottom:13px;backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .15s,box-shadow .2s;animation:fade .4s cubic-bezier(.2,.7,.3,1)}
  .card:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.45)}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#9aa7c7;margin-bottom:9px}
  .teams{font-size:17px;font-weight:800;text-align:center;margin-bottom:10px;letter-spacing:-.3px}
  .bar{display:flex;height:28px;border-radius:9px;overflow:hidden;font-size:11px;font-weight:800;color:#06121f;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  /* diverging CVD-safe: ฟ้า(เหย้า) ↔ เทา(เสมอ) ↔ ส้ม(เยือน) — คนตาบอดสีแยกได้ (validated) */
  .bar .h{background:linear-gradient(90deg,#22d3ee,#0ea5c4)} .bar .d{background:#8b93a7} .bar .a{background:linear-gradient(90deg,#f59e0b,#ea8a04)}
  .bar div{display:flex;align-items:center;justify-content:center;min-width:26px}
  .mk{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;font-size:12px}
  .mk span{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:5px 10px}
  .mk b{color:#ffd86b}
  .warn{color:#fb7185;font-size:11px;margin-top:7px}
  .loading{text-align:center;color:#9aa7c7;padding:36px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔮 ทำนายรวม (Predictions)</h1>
  <div class="sub">รันโมเดล Dixon-Coles ให้ทุกนัดที่จะแข่ง · <a href="/">← กลับหน้าหลัก</a></div>
  <select id="comp">
    <optgroup label="⚽ ทีมชาติ">
      <option value="WC">🌍 ฟุตบอลโลก 2026 (กำลังแข่ง)</option>
    </optgroup>
    <optgroup label="🏆 ลีกยุโรป">
      <option value="PL">พรีเมียร์ลีก</option>
      <option value="ELC">แชมเปียนชิพ (อังกฤษ)</option>
      <option value="PD">ลาลีกา</option>
      <option value="BL1">บุนเดสลีกา</option>
      <option value="SA">เซเรีย อา</option>
      <option value="FL1">ลีกเอิง</option>
      <option value="DED">เอเรอดีวีซี (ฮอลแลนด์)</option>
      <option value="PPL">ปรีไมรา (โปรตุเกส)</option>
      <option value="CL">แชมเปียนส์ลีก (UCL)</option>
    </optgroup>
    <optgroup label="🌎 อเมริกาใต้">
      <option value="BSA">บราซิล ซีรีอา</option>
      <option value="CLI">โคปา ลิเบอร์ตาดอเรส</option>
    </optgroup>
  </select>
  <select id="sort" style="max-width:340px;display:block;margin:0 auto 12px">
    <option value="date">📅 เรียงตามวันที่ (ใกล้สุดก่อน)</option>
    <option value="conf">🔥 เรียงตามความมั่นใจ</option>
  </select>
  <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:#9aa7c7">
    <label style="cursor:pointer"><input type="checkbox" id="todayOnly"> เฉพาะวันนี้</label>
    <label style="cursor:pointer"><input type="checkbox" id="hideFew"> ซ่อนคู่ข้อมูลน้อย (&lt;3 นัด)</label>
  </div>
  <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:#9aa7c7">
    <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#22d3ee;vertical-align:middle;margin-right:5px"></span>เหย้าชนะ</span>
    <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#8b93a7;vertical-align:middle;margin-right:5px"></span>เสมอ</span>
    <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:#f59e0b;vertical-align:middle;margin-right:5px"></span>เยือนชนะ</span>
  </div>
  <div id="list"><div class="loading">เลือกรายการเพื่อดูคำทำนาย...</div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const fmtDate=iso=>{ const d=new Date(iso);
  return d.toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}); };

async function load(){
  const comp=$("#comp").value;
  $("#list").innerHTML='<div class="loading">⏳ กำลังดึงโปรแกรม + รันโมเดล... (ครั้งแรกอาจช้า ~30 วิ)</div>';
  try{
    const r=await fetch(`/api/predictions?comp=${comp}`);
    const d=await r.json();
    if(d.error) throw new Error(d.error);
    if(!d.matches.length){ $("#list").innerHTML='<div class="loading">ไม่มีนัดที่จะแข่งในรายการนี้ (อาจปิดฤดูกาล)</div>'; return; }
    // ตัวกรอง: เฉพาะวันนี้ / ซ่อนคู่ข้อมูลน้อย
    let list=d.matches.slice();
    if($("#todayOnly").checked){
      const t=new Date().toDateString();
      list=list.filter(m=>new Date(m.date).toDateString()===t);
    }
    if($("#hideFew").checked) list=list.filter(m=>m.pred && m.pred.gH>=3 && m.pred.gA>=3);
    if(!list.length){ $("#list").innerHTML='<div class="loading">ไม่มีนัดตามตัวกรองที่เลือก</div>'; return; }
    // เรียงตามที่เลือก: วันที่ (ใกล้สุดก่อน) หรือ ความมั่นใจ (มากก่อน)
    const conf=m=> m.pred ? Math.max(m.pred.pHome,m.pred.pDraw,m.pred.pAway) : -1;
    if($("#sort").value==="conf") list.sort((x,y)=> conf(y)-conf(x));
    else list.sort((x,y)=> new Date(x.date)-new Date(y.date));
    $("#list").innerHTML=list.map(m=>{
      if(!m.pred) return `<div class="card"><div class="top"><span>${fmtDate(m.date)}</span></div>
        <div class="teams">${m.home} vs ${m.away}</div>
        <div class="warn">⚠️ ข้อมูลทีมไม่พอ ทำนายไม่ได้</div></div>`;
      const p=m.pred;
      const few=(p.gH<3||p.gA<3)?`<div class="warn">⚠️ บางทีมข้อมูลน้อย (${p.gH}/${p.gA} นัด) ความแม่นต่ำ</div>`:"";
      // ผลที่โมเดลเลือก + ระดับความมั่นใจ
      const top=Math.max(p.pHome,p.pDraw,p.pAway);
      const pick = top===p.pHome ? m.home+" ชนะ" : top===p.pAway ? m.away+" ชนะ" : "เสมอ";
      const badge = (top>=60 && p.gH>=3 && p.gA>=3)
        ? `<span style="background:#4ade80;color:#08111f;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700">🔥 มั่นใจ ${top}%</span>`
        : `<span style="color:#94a3c4;font-size:11px">มั่นใจ ${top}%</span>`;
      return `<div class="card">
        <div class="top"><span>${fmtDate(m.date)}</span>${badge}</div>
        <div class="teams">${m.home} <span style="color:#94a3c4">vs</span> ${m.away}</div>
        <div style="text-align:center;font-size:13px;margin-bottom:8px">ทาย: <b style="color:#4ade80">${pick}</b> · สกอร์ <b style="color:#ffd86b">${p.score}</b></div>
        <div class="bar">
          <div class="h" style="width:${p.pHome}%">${p.pHome}%</div>
          <div class="d" style="width:${p.pDraw}%">${p.pDraw}%</div>
          <div class="a" style="width:${p.pAway}%">${p.pAway}%</div>
        </div>
        <div class="mk">
          <span>สูง 2.5: <b>${p.over25}%</b></span>
          <span>ทั้งคู่ยิง: <b>${p.btts}%</b></span>
          <span>ข้อมูล ${p.gH}/${p.gA} นัด</span>
        </div>${few}</div>`;
    }).join("");
  }catch(e){ $("#list").innerHTML=`<div class="loading">❌ ${e.message}</div>`; }
}
["comp","sort","todayOnly","hideFew"].forEach(id=>$("#"+id).addEventListener("change",load));
load();
</script>
</body>
</html>
